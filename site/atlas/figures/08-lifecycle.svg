<polyline points="426,130 426,225" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="1468,130 1468,225" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<text x="30" y="258" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">Physical register (380 int / 432 fp / 128 flags)</text>
<rect x="426" y="265" width="1042" height="12" rx="3" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="430" y="258" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="30" y="274" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">new register at rename, old register freed when the history entry retires</text>
<polyline points="426,130 426,265" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="1468,130 1468,265" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<text x="30" y="298" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">Dispatch buffer entry (24 / 12 / 10 / 12)</text>
<rect x="558" y="305" width="250" height="12" rx="3" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="562" y="298" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="30" y="314" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">held until a scheduler queue has room</text>
<polyline points="558,130 558,305" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="808,130 808,305" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<text x="30" y="338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">Scheduler queue entry (13 / 18 / 12)</text>
<rect x="690" y="345" width="250" height="12" rx="3" fill="#ebf7f3" stroke="#50b696" stroke-width="1" stroke-dasharray="9 3"/>
<text x="694" y="338" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="30" y="354" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">held until operands ready and selected</text>
<polyline points="690,130 690,345" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="940,130 940,345" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<text x="30" y="378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">Load or store queue entry (130 / 60)</text>
<rect x="822" y="385" width="514" height="12" rx="3" fill="#ebf7f3" stroke="#50b696" stroke-width="1" stroke-dasharray="9 3"/>
<text x="826" y="378" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="30" y="394" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">taken at issue not dispatch; loads and non-speculative stores free theirs before retire</text>
<polyline points="822,130 822,385" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="1336,130 1336,385" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<text x="30" y="418" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">Branch in flight (144)</text>
<rect x="426" y="425" width="910" height="12" rx="3" fill="#dcf0ea" stroke="#50b696" stroke-width="1"/>
<text x="430" y="418" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="30" y="434" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">counted from rename to retire</text>
<polyline points="426,130 426,425" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="1336,130 1336,425" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<text x="30" y="458" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">Store data to L1D</text>
<rect x="1218" y="465" width="250" height="12" rx="3" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="1222" y="458" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="30" y="474" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">written after the retire group commits, 2 per cycle</text>
<polyline points="1218,130 1218,465" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="1468,130 1468,465" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<text x="30" y="500" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4b5563" text-anchor="start">Early release of load/store entries and the issue-time allocation point are what make the same filler give different window knees under a cache miss and under an ALU delay.</text>
<rect x="30" y="531" width="16" height="11" rx="2" fill="#a5d9c9" stroke="#059669" stroke-width="2.2"/>
<text x="50" y="540" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start">● confirmed, 3+ measurements</text>
