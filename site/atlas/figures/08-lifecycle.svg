<text x="30" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="600" fill="#1f2937" text-anchor="start">Retire group slot (330 x 7)</text>
<rect x="426" y="185" width="910" height="12" rx="3" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="430" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
<text x="30" y="194" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">taken at rename, memory op opens a group, branch closes it</text>
<polyline points="426,130 426,185" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
<polyline points="1336,130 1336,185" fill="none" stroke="#9ca3af" stroke-width="0.8" stroke-dasharray="2 3" stroke-linejoin="round"/>
