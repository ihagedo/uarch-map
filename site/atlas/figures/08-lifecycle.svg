<rect x="426" y="90" width="118" height="40" rx="5" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="434" y="105" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">Rename</text>
<polyline points="412,110 426,110" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="558" y="90" width="118" height="40" rx="5" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="566" y="105" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">Dispatch buffer</text>
<polyline points="544,110 558,110" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="690" y="90" width="118" height="40" rx="5" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="698" y="105" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">Scheduler queue</text>
