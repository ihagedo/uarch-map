<rect x="162" y="90" width="118" height="40" rx="5" fill="#b1c7f8" stroke="#2563eb" stroke-width="2.2"/>
<text x="170" y="105" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">Decode</text>
<polyline points="148,110 162,110" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<rect x="294" y="90" width="118" height="40" rx="5" fill="#f5fbf9" stroke="#50b696" stroke-width="1" stroke-dasharray="4 3"/>
<text x="302" y="105" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">Map</text>
