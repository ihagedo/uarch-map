<rect x="1218" y="90" width="118" height="40" rx="5" fill="#c0e5da" stroke="#059669" stroke-width="1.4"/>
<text x="1226" y="105" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">Retire group</text>
