<rect x="426" y="225" width="1042" height="12" rx="3" fill="#a5d9c9" stroke="#059669" stroke-width="2.2"/>
<text x="430" y="218" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#1f2937" text-anchor="start"></text>
