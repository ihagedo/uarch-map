<text x="830" y="105" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#1f2937" text-anchor="start">Issue</text>
<polyline points="808,110 822,110" fill="none" stroke="#1f2937" stroke-width="1.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
