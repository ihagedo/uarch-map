# d1-l1d.yaml
# Isaac Hagedorn, 2026-11-03
# The d1-l1d figure read step by step.
figure: d1-l1d
audience: architects who have seen a textbook cache but not a real one
goal: explain why the M1's L1D can start its lookup before translation and still be safe, and where the three measured latencies come from
steps:
  - n: 1
    targets: [va, vab]
    title: The address arrives untranslated
    say: A load's virtual address reaches the cache 48 bits wide. With 16 KiB pages, bits 13:0 never change under translation, so anything indexed by those bits can start now. The set field 13:6 and the bank field 7:4 both sit inside that window. Of the bank bits, the lower two (5:4) pick the 16 B slice inside the line and the upper two (7:6) pick which of four bank groups the line lives in; those upper two are also the low end of the set index.
    rests_on: corroborated
    ask: What is the largest 8-way cache you can index inside a 16 KiB page offset?
    slide: ["16 KiB pages: bits 13:0 need no translation", "set 13:6 and bank 7:4 live inside them; bank bits 5:4 pick the slice in the line, 7:6 the bank group", "128 KiB, 256 sets of 8 ways of 64 B lines: the largest VIPT L1D this page size allows"]
    status: agreed
  - n: 2
    targets: [h, utag, c8]
    title: The micro tag picks a way early
    say: The micro tag is the XOR fold of the page number, VA[47:14], down to eight bits. It is compared against the eight micro tags of the set, and one way wins in cycle 1, before the TLB has answered; that way select goes on to the tag array and the data banks. This is the AMD-style way predictor the security papers measured.
    rests_on: single
    ask: Two different pages can fold to the same 8 bits. What happens then?
    slide: ["the micro tag is the XOR fold of VA[47:14], eight bits", "compared against the eight micro tags of the set in cycle 1", "one way wins before the TLB answers"]
    status: agreed
  - n: 3
    targets: [dtlb, tag, c34]
    title: The physical tag confirms late
    say: In parallel, the L1 dTLB translates the page number. It holds 160 entries in five ways, indexed by VA 18:14, and gives back the physical page, PA[47:14]. In cycle 3 the 34-bit physical tag stored with the chosen way is compared against that physical page; the result is the tag hit, and only now is the hit certain.
    rests_on: confirmed
    slide: ["the L1 dTLB, 160 entries in five ways, translates the page in parallel", "cycle 3: the chosen way's 34-bit physical tag is compared with the physical page", "data has already left; the compare only confirms or replays"]
    status: agreed
  - n: 4
    targets: [data, mux_way, mux_bank, lsu_out]
    title: Data leaves the banks through two muxes
    say: The data is held in 16 banks of 16 B, 512 rows each; one 64 B line spans four banks. Two selections in series pick the 16 B that leaves. The way select from the micro tag drives an 8-to-1 mux inside the bank, choosing which way's column comes out; then the bank bits of the address drive a 16-to-1 mux that steers that bank's output to a load port. The bank bits are known from the address in cycle 0, the way only in cycle 1, which is why they are two muxes and not one. Three such paths run each cycle, the measured 48 bytes per cycle of load bandwidth.
    rests_on: corroborated
    ask: Why does a 16 B load touch one bank but an LDP of two Q registers touch two?
    slide: ["16 banks of 16 B, 512 rows each; a line spans four banks", "two muxes in series: the way select picks the column, the bank bits pick the bank", "three slices a cycle: 48 bytes per cycle of loads"]
    status: agreed
  - n: 5
    targets: [c34, replay]
    title: No match means replay
    say: A replay happens when the micro tag picked a way but the physical tag disagrees. The data that already went out was wrong, so the load goes back to the scheduler and issues again; its consumers were waiting on the confirm, so nothing wrong reaches them. The cost is a retry, not a stall of the whole pipeline.
    rests_on: inferred
    slide: ["micro tag hit, physical tag miss: the way was wrong", "the load replays from the scheduler; consumers had waited for the confirm", "a retry, not a pipeline stall"]
    status: agreed
  - n: 6
    targets: [fill, l2]
    title: A miss takes a fill buffer
    say: A true miss allocates a fill buffer and sends a request down to the shared L2; the L2 answers in 17 cycles and the 64 B line comes back up as two 32 B halves, so the request and the fill are two wires, a thin control line down and a thick data line up. How many fill buffers there are is a hole in the record, since nobody has measured it. Little's law on the measured L2 bandwidth says there must be at least seven, which is what the drawing's question mark stands for.
    rests_on: conjecture
    ask: How would you measure the number of fill buffers?
    aside:
      title: Little's law
      law: "in flight = throughput × latency"
      say: Whatever the queue is, the number of things inside it equals how fast they arrive times how long each stays. For misses, the things are lines, the throughput is the measured L2 bandwidth and the time is the L2 latency.
      steps:
        - "L2 load bandwidth 85 GB/s at 3.2 GHz is 26.6 B per cycle"
        - "26.6 B/clk × 17 clk = 452 B in flight"
        - "452 B ÷ 64 B per line = 7.1 lines, so at least seven buffers"
      note: a lower bound; the measured bandwidth may not have saturated the buffers, and the latency used is the hit latency, not a loaded one.
    slide: ["a true miss takes a fill buffer and asks the L2, 17 cycles away", "the line comes back as two 32 B halves", "at least seven buffers by Little's law; the count is unmeasured"]
    status: agreed
  - n: 7
    targets: [fill, data, lsu_out]
    title: Fill forwarding and the stolen bank cycle
    say: The short version is that the waiting load gets its data as the line arrives. In detail, two things happen at once. The load that missed does not wait for the line to be written and read again; it takes its bytes straight off the fill buffer, the forward path into the load port. And the write of the line into the bank takes a bank cycle that a load would otherwise have used, so a load to that bank in that cycle is delayed by one. The detail is inferred from timing probes rather than measured directly; the short version holds either way.
    rests_on: inferred
    slide: ["the waiting load gets its data as the line arrives", "in detail: straight off the fill buffer, and the bank write costs one load slot", "the detail is inferred from timing; the summary holds either way"]
    status: agreed
  - n: 8
    targets: [plru, evict]
    title: Tree PLRU picks the victim
    say: When a fill needs a way, a tree PLRU chooses the victim. Seven bits per set form a three-level tree over the eight ways; each access flips the bits on its path to point away from itself, and the victim is found by following the bits down. This was measured by the Prime+Retouch work. The victim is written back to the L2 only if it is dirty; otherwise it is simply dropped, because the L2 is inclusive and already holds a copy.
    rests_on: single
    aside:
      title: Tree PLRU
      law: "7 bits per set, 1 + 2 + 4; every bit points away from the side used last"
      say: True LRU over eight ways would have to keep their whole order, which takes more bits than the tag and a comparator per way. Tree PLRU keeps seven bits arranged as a binary tree over the ways. The root bit remembers which half of the set was used less recently, the two bits below it remember the same for each quarter, and the four leaf bits remember it for each pair of ways.
      steps:
        - "on a hit or a fill to way w, walk from the root down w's path and set each bit to point to the other side"
        - "to pick a victim, start at the root and follow the bits; each one points to the side used less recently"
        - "fresh set, touch ways 0, 1, 2, 3 in order: the root now points at ways 4 to 7, the bit under it at 6 to 7, its leaf at 7, so way 7 is the victim; the bold path on the drawing"
        - "the price is approximation: a way touched recently can still be chosen if the bits above it were flipped by its neighbours"
      note: Prime+Retouch depends on exactly this update rule; an attacker touches lines to flip bits above its own lines so the victim is always someone else's, which is how the policy was identified.
    slide: ["tree PLRU: seven bits per set, a three-level tree over eight ways", "the victim is written back only if dirty", "the L2 is inclusive, so a clean victim is just dropped"]
    status: agreed
  - n: 9
    targets: [sq, smiss]
    title: Stores come over the top
    say: Stores come in over the top. The store queue holds 60 entries of 32 B and, once a store retires, writes it into the banks at two 16 B slices per cycle, so a store never competes with the loads for the mux path. A store that misses does not stall the queue; it takes a store-miss entry, fetches the line for ownership from the L2, and younger stores that hit keep writing in the meantime.
    rests_on: corroborated
    slide: ["the store queue, 60 entries of 32 B, writes two 16 B slices a cycle into the banks", "a store miss takes a store-miss entry and fetches the line for ownership", "younger stores that hit keep writing"]
    status: agreed
