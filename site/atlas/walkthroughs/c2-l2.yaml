# c2-l2.yaml
# Isaac Hagedorn, 2026-11-03
# The c2-l2 figure read step by step.
figure: c2-l2
audience: the same class, before the dataflow figure D2; this is the textbook view of the L2
goal: fix the L2's numbers and shape in the listener's head before D2 follows one request through it
steps:
- n: 1
  targets:
  - fa
  title: The address, in textbook form
  say: 12 MiB in 12 ways of 128 B lines is 8192 sets, thirteen index bits. Eleven come straight from the physical address and two are hashed from page-number bits. All thirteen sit above the 16 KiB page
    offset, so the L2 waits for the dTLB.
  rests_on: confirmed
  slide:
  - 8192 sets × 12 ways × 128 B = 12 MiB
  - 'Thirteen index bits: eleven direct, two hashed'
  - 'Above the page offset: waits for the dTLB'
  status: draft
- n: 2
  targets:
  - fb
  - fd
  title: One set, twelve ways, each line in two halves
  say: 'A set is twelve 128 B lines, and each line is two 64 B halves with their own valid and dirty bits, because the L1D line is 64 B. Whether the other half follows the accessed one into the L1D is disputed.
    Augury saw an L1D fill bring in two adjacent 64 B lines, each evictable on its own. GoFetch saw the accessed half fill both the L1 and the L2 while the other half went only into the L2. iLeakage found
    that touching one half of each L2 line evicts a victim''s L1 copy only now and then, and both halves triples the rate, which says inclusion acts on the whole 128 B line without saying what the L1 fill
    brings. We lean to GoFetch: its test is direct, and Augury''s pair is what its data prefetcher would do. One more clue: Apple''s own errata name a sibling merge in the L2 fill path, and the OS turns
    it off on the M1, so on a stock machine only the accessed half should come.'
  rests_on: corroborated
  slide:
  - Twelve ways of 128 B; each line two 64 B halves with own valid and dirty
  - 'Disputed: does the other half follow into the L1D?'
  - '  Augury: an L1D fill brings two adjacent 64 B lines, each evictable on its own'
  - '  GoFetch: the accessed half fills L1 and L2; the other half only the L2'
  - '  iLeakage: inclusion acts per 128 B line; both halves triple the eviction rate'
  - 'We lean to GoFetch: a direct test; Augury''s pair looks like its prefetcher'
  - '  Apple''s errata name a sibling-half merge in the fill path; the OS disables it on the M1'
  status: draft
- n: 3
  targets:
  - l2_core_lru
  - l2_autolock
  - l2_hashed_way_filter
  - l2_zero_line_tags
  title: Four rules inside the set
  say: 'Four rules inside the set. Replacement is LRU among one core''s lines but not across cores: lines from two cores in one set have no LRU order between them, which is why a cross-core eviction set
    needs several passes to work. AutoLock: the L1 copy bits mark the lines an L1D still holds, and the victim is chosen among the unmarked lines first; S2C measured the threshold at about three of eight.
    The lookup reads a partial tag first: a few tag bits fire the candidate ways, only those ways'' sense amplifiers wake, then the full 20-bit compare runs; there is no way-predictor table. And an all-zero
    line may be kept as a tag bit alone, with no data array write, from a patent and unmeasured.'
  rests_on: single
  slide:
  - LRU per core, not across cores
  - '  Among one core''s lines the oldest goes first'
  - '  Lines from two cores in one set have no order between them'
  - '  So a cross-core eviction set needs several passes'
  - 'AutoLock: lines an L1D holds are spared'
  - '  L1 copy bits mark the lines an L1D still holds'
  - '  The victim is picked among the unmarked lines first'
  - '  Threshold measured at about 3 of 8 (S2C)'
  - Partial tag first, then the full compare
  - '  A few tag bits fire the candidate ways; only their sense amps wake'
  - '  Then the full 20-bit compare; no way-predictor table'
  - Zero lines as a tag bit
  - '  An all-zero line is recorded as a tag bit; no data array write'
  - '  From a patent; unmeasured'
  status: draft
- n: 4
  targets:
  - fc
  - l2_cachelets
  title: Four cachelets, 2048 sets each
  say: 'The 12 MiB behaves as four 3 MiB cachelets. Handley''s model: one cachelet beside each core, half for its own core and half spare for the other three, so a lone core sees 3 MiB near and 4.5 MiB
    far, 7.5 MiB in all; his bandwidth curves step at 3, 7.5 and about 16 MiB, and AnandTech saw latency rise past about 8 MB. Whether the cachelets are physical slices or a logical budget is open: Handley
    allows a hash that includes the core id with a per-core line budget; S2C suggests the two hashed index bits pick one of four slices of 2048 sets. Our proposal is the S2C reading, and a pinned-core sweep
    would narrow it: chase pointers from a thread pinned to core 0 over a growing footprint and expect a step at 3 MiB from 17 cycles to the far latency, a second at 7.5 MiB to the SLC, a third near 16
    MiB to DRAM. Then restrict the footprint to addresses of one hash class. If the hashed bits pick the slice, one class gives 3 MiB at 17 cycles and the other three are all far from the first line: four
    distinct curves. If it is a per-core budget, every class looks the same.'
  rests_on: conjecture
  ask: Design the sweep that would show four latency steps.
  slide:
  - Four 3 MiB cachelets; one core sees about 7.5 MiB
  - '  Handley: half of each cachelet for its own core, half spare for the others: 3 near + 4.5 far'
  - '  Bandwidth steps at 3, 7.5 and ~16 MiB; AnandTech: latency rises past ~8 MB'
  - 'Open: physical slices, or a logical per-core budget?'
  - '  Handley: possibly a hash with the core id and a per-core line budget'
  - '  S2C: the two hashed index bits may pick one of four slices of 2048 sets'
  - '  Our proposal: the S2C reading, the hashed bits pick the slice'
  - What a pinned-core sweep would show
  - '  Pointer chase from a thread pinned to core 0, footprint growing'
  - '  Steps at 3 MiB (17 clk to far), 7.5 MiB (to SLC), ~16 MiB (to DRAM)'
  - '  Then one hash class only: four distinct curves if slices; all alike if a budget'
  status: draft
- n: 5
  targets:
  - ft
  - fbw
  title: Seventeen cycles, 85 gigabytes a second
  say: The hit latency is 17 cycles from the core, one source, with 15 and 18 quoted elsewhere. One core pulls 85 GB/s from the L2 and pushes 100 GB/s into it, over a path of 32 B per cycle each way. Requests
    to one line stay in order, requests to different lines may pass.
  rests_on: single
  slide:
  - 17 cycles from the core; 15 and 18 also quoted
  - 85 GB/s loads, 100 GB/s stores for one core; 32 B/cycle each way
  - In order per line, not across lines
  status: draft
- n: 6
  targets:
  - story-1
  - story-2
  - story-3
  - story-4
  title: One request in four stills
  say: The address picks the set; the partial tag fires two of twelve ways; the full 20-bit compare finds way 4 half 0; the half goes to the L1D as two 32 B beats, 17 cycles after the request. The order
    of these steps is read from a patent.
  rests_on: inferred
  slide:
  - Set from index and hash
  - Partial tag fires two of twelve ways
  - 'Full compare: way 4, half 0, to the L1D in two beats'
  status: draft
