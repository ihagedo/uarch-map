# handley-vol2-latency.yaml
# Maynard Handley, 2025
# Latency by footprint, the TLB hierarchy and the prefetchers (M1 Explainer vol 2).
session: handley-vol2-latency
source: handley-vol2

claims:
  - id: c-mh-v2-l1d-latency
    text: >-
      Strided pointer chases take 3 cycles per load within the L1 (up to 128 KiB) and, to first approximation,
      4 cycles per load beyond it, the stride prefetcher hiding L2, SLC and DRAM latency
    loc: p169
    quote: "For the first part of the graph (within L1, so depth up to 128K) every load takes 3 cycles. Once we're past L1 (so loading from L2, then SLC, then DRAM) to first approximation latency is 4 cycles."
    method: pointer-chase
    derivation: measured
    value: 3
    unit: cycles
    supports: [l1d.latency]
    notes: >-
      The 4 cycles beyond L1 is a prefetched strided chain (63-65 B strides), not a cache latency. An 8 B linear chain gives the same 3
      cycles (c-mh-v2-stride-to-dram)
  - id: c-mh-v2-ptr-chase-fastpath
    text: >-
      The 3-cycle pointer-chase latency is a fast path: the loaded value is reused inside the LSU as the next
      address, saving the cycle needed to move it to the integer unit
    loc: p164
    quote: "a special load case that can be accelerated because the result of the load will be re-used in the LSU (so we avoid one cycle of overhead moving the load result to the integer unit)"
    derivation: inferred
    supports: []
  - id: c-mh-v2-load-alu-4
    text: >-
      Adding zero to each loaded pointer raises the chase to 5 cycles per load: the load takes 4 cycles once its
      value must go to the integer unit, plus 1 for the add
    loc: p165
    quote: "The cycles per load jumps to five (blue line). This is expected. The load now takes 4 rather than 3 cycles because we cannot use the fast path"
    method: pointer-chase
    derivation: measured
    value: 4
    unit: cycles
    supports: [l1d.latency_alu]
    notes: Handley also says standard loads take 4 cycles, more for vector/FP loads
  - id: c-mh-v2-no-address-prediction
    text: >-
      No load address prediction is seen: dividing each loaded pointer by one (12 cycles per load) gives no
      speed-up, and a random order within the L1 is no slower than a linear one
    loc: p166
    quote: "we see no difference until we move beyond the L1 ... load addresses that can be predicted) remains as before - apparently not present in M1"
    method: pointer-chase
    derivation: measured
    value: false
    hedge: "apparently"
    supports: [lsu.address_prediction]
    notes: >-
      The same sentence calls all zero-cycle loads (register reuse, values stored to the stack) absent, a conclusion
      carried over and not tested here; vol 1 measures register-matched zero-cycle loads (c-mh-v1-zcl-*)
  - id: c-mh-v2-ldp-ptr-first
    text: >-
      Pointer chasing through LDP keeps the 3-cycle fast path only when the next pointer is the first register of
      the pair; with the payload first, each step is slower
    loc: p166
    quote: "And only the first register of a load pair can be internally forwarded in the LSU for pointer-chasing acceleration."
    method: pointer-chase
    derivation: measured
    supports: []
    notes: A table gives 3.0 cycles per load with the pointer first and 4.0 with the payload first

  - id: c-mh-v2-stride-to-dram
    text: >-
      A linear chain of 8 B nodes keeps its 3-cycle L1 latency at every depth tested, out to about 1000 MB: the
      prefetcher covers L2, SLC and DRAM
    loc: p164
    quote: "Note also that the prefetching is correctly orchestrated not just out to L2 but all the way out to deep DRAM (the largest depth we test is ~1000MB)."
    method: pointer-chase
    derivation: measured
    value: 3
    unit: cycles
    supports: []
  - id: c-mh-v2-near-l2-3mib
    text: >-
      The linear-chain latency curve steps slightly past the near L2 of 3 MiB, where the first access to each line
      takes 4 rather than 3 cycles
    loc: p164
    quote: "The prefetcher seems to get the calculation slightly incorrect once we go past the near-L2 (3MiB) so that accessing the line the first time takes 4 rather than 3 cycles"
    method: pointer-chase
    derivation: measured
    value: 3
    unit: MiB
    hedge: "seems to"
    supports: [l2.inner_slice]
  - id: c-mh-v2-stride-max
    text: >-
      Stride prefetching works for every stride Handley tried up to just under two pages, though with odd
      variation by stride (e.g. 2 KiB worse than 8 KiB, 272 B much worse than 256 B in DRAM)
    loc: p171
    quote: "there are stride prefetchers, which all appear to work, right up to a stride of just under two pages."
    method: pointer-chase
    derivation: measured
    hedge: "I don't feel confident saying anything beyond"
    supports: []
    notes: >-
      Handley adds that the TLB tests suggest stride prefetching ends between 16K and 32K strides, and later guesses
      strides are tracked in about 16 bits (a 32 KiB stride is tracked but prefetches poorly)
  - id: c-mh-v2-stride-streams-16
    text: >-
      The core sustains at least 16 simultaneous stride prefetch streams; four run cleanly out to deep DRAM
    loc: p173
    quote: "the system can sustain at least 16 simultaneous stride prefetchers. - it can sustain four stride prefetchers with barely a sweat (even out to deep DRAM!)"
    method: pointer-chase
    derivation: measured
    value: 16
    unit: streams
    hedge: "it seems like"
    supports: [prefetch.streams]
    notes: >-
      Lower bound. With eight streams, occasional glitches near 16 MB and 64 MB, and stream tracking seems to
      stop beyond about 256 MB
  - id: c-mh-v2-backward-stride
    text: A backward linear stride is prefetched as well as a forward one
    loc: p174
    quote: "Below we see a backward linear stride being prefetched just as well as a forward linear sequence"
    method: pointer-chase
    derivation: measured
    supports: []
  - id: c-mh-v2-mixed-strides
    text: >-
      With interleaved chains of different strides and signs that use one element per line, prefetching keeps up
      for four chains, is acceptable for eight, and falls behind beyond eight
    loc: p177
    quote: "you're still going to do fine for four such arrays, and you can't really complain even with eight such arrays. But beyond eight you are going to be unhappy"
    method: pointer-chase
    derivation: measured
    value: 8
    unit: streams
    supports: []
    notes: Strides tested include +8, -40, +72, -104 B

  - id: c-mh-v2-spatial-prefetch
    text: >-
      Chains shuffled randomly within 16 KiB boxes are still prefetched out to DRAM, so some spatial prefetcher
      exists
    loc: p179
    quote: "these \"randomized\" patterns are still being prefetched. ... Beyond the brute fact of some sort of spatial prefetcher, it's difficult to say more"
    method: pointer-chase
    derivation: measured
    supports: []
    notes: Handley warns the 8 B-node version mostly shows 8 nodes sharing each line, not the prefetcher
  - id: c-mh-v2-dram-350
    text: A random access out to DRAM costs about 350 cycles
    loc: p179
    quote: "A random access out to DRAM costs about 350 cycles."
    derivation: measured
    value: 350
    unit: cycles
    approx: true
    hedge: "about"
    supports: []
    notes: >-
      In cycles, not ns. Handley later says purely random DRAM access is ~300 cycles. The fully random curve
      itself is not shown
  - id: c-mh-v2-stride-lockon
    text: >-
      The stride prefetcher seems to need about 4 accesses to lock onto a pattern, plus a few more before its
      prefetches arrive in time
    loc: p219
    quote: "the stride prefetcher probably requires something like seeing 4 accesses to lock onto the pattern"
    method: pointer-chase
    derivation: inferred
    value: 4
    unit: accesses
    approx: true
    hedge: "probably requires something like"
    supports: []
    notes: 64 B nodes in a 1 MiB space; little gain until boxes of 512 B (8 nodes)
  - id: c-mh-v2-region-prefetch
    text: >-
      Random nodes in randomly ordered boxes still gain a little latency, so a region prefetcher exists, but it
      is never very aggressive
    loc: p219
    quote: "this situation is somewhat amenable to a region prefetcher. And it seems that we have something like that. ... (which is apparently never very aggressive; we get some latency reduction but not much)"
    method: pointer-chase
    derivation: measured
    hedge: "it seems that"
    supports: []
    notes: Handley guesses it needs ~4 spatially correlated loads, within perhaps less than a page, to activate
  - id: c-mh-v2-hybrid-prefetch
    text: >-
      The box tests show a hybrid region+stride prefetcher; less certainly, a spatial prefetcher as well, not
      tuned well against the others
    loc: p220
    quote: "I think the definite take-away is the existence of a hybrid region+stride predictor; the less definite takeaway is that perhaps there's also a spatial predictor"
    method: pointer-chase
    derivation: inferred
    hedge: "I think"
    supports: []
  - id: c-mh-v2-next-line
    text: >-
      A next-line prefetcher probably exists, and the 64 B vs 128 B node results hint at a meta-scheme choosing
      among prefetchers
    loc: p222
    quote: "is the likely existence of a next-line prefetcher."
    derivation: inferred
    hedge: "likely"
    supports: []
  - id: c-mh-v2-three-prefetchers
    text: >-
      With 16 KiB boxes out to DRAM, three kinds of prefetcher are seen working: stride (forward and backward),
      hybrid region+stride, and pure region
    loc: p223
    quote: "We can see three very different prefetchers seem to be present (and functional, all the way out to DRAM)"
    method: pointer-chase
    derivation: measured
    value: stride, hybrid region+stride, region
    supports: []
    notes: Measured counterpart of the patent-based list in c-mh-v2-prefetch-kinds
  - id: c-mh-v2-ghb-box
    text: >-
      Shrinking the box from 16 KiB to 15000 B changes the random-in-box results sharply, which Handley explains
      by a GHB-like prefetcher history of a little under 256 entries
    loc: p224
    quote: "My assumption is that the prefetcher is something like a GHB prefetcher ... Suppose that the GHB holds a little under 256 entries."
    method: pointer-chase
    derivation: inferred
    value: 256
    unit: entries
    approx: true
    hedge: "My assumption is ... Suppose"
    supports: []
    notes: Upper bound; Handley later floats "let's say three times as many entries (240)" for Apple against ~80 for x86 and Arm cores
  - id: c-mh-v2-region-to-l2
    text: >-
      Low-confidence (spatial/region) prefetches go into the L2 but not the L1; stride prefetches go into the L1
    loc: p225
    quote: "the prefetcher is smart enough that for uncertain cases (so spatial/region prefetching, as opposed to stride prefetching) prefetching is done into L2, but not into L1."
    derivation: inferred
    supports: []
  - id: c-mh-v2-slc-spatial
    text: >-
      Random placements in randomly ordered boxes still run at ~50 cycles per load out to DRAM depths, which
      Handley reads as data coming from the SLC, perhaps filled by a spatial prefetcher at the memory controller
    loc: p225
    quote: "still runs at ~50 cycles/load. This suggests to me that the data is being loaded from the SLC. ... One could imagine the memory controller, after every DRAM page is opened, consulting the spatial prefetcher"
    method: pointer-chase
    derivation: inferred
    value: 50
    unit: cycles
    approx: true
    hedge: "This suggests to me"
    supports: []
    notes: Handley says the opposite for the patents (prefetching stays within the cluster, not the SLC)
  - id: c-mh-v2-temporal
    text: >-
      Apple does have a temporal prefetcher or equivalent; AnandTech's tests miss it because they use 16 KiB
      regions, just beyond its reach, while 15 KiB regions show it
    loc: p227
    quote: "I think the correct analysis is that Apple does have a Temporal Prefetcher (or equivalent); it just doesn't show up when the tests probe a region size of 16K"
    derivation: inferred
    hedge: "I think"
    supports: []
    notes: Disagrees with AnandTech's reading that Apple has no temporal prefetcher

  - id: c-mh-v2-prefetch-kinds
    text: >-
      Apple's current data prefetch scheme: an access-map (AMPM) prefetcher over regions that detects strides
      and dense patterns, plus auxiliary large-stride, spatial memory streaming (SMS) and pointer (content-directed)
      matchers, coordinated ad hoc
    loc: p228
    quote: "Apple's current scheme appears to be ... AMPM matcher detects strides ... and \"dense\" patterns ... auxiliary matcher detects large stride streams ... detects SMS (Spatial Memory Streaming) patterns ... detects what look like pointers in newly loaded L1 cache lines"
    method: patent-reading
    derivation: inferred
    value: AMPM region (strides, dense), large stride, SMS, pointer (content-directed)
    hedge: "appears to be"
    supports: [prefetch.kinds]
    notes: Synthesis of the prefetcher patents with the box tests
  - id: c-mh-v2-ampm-2k
    text: Apple's primary prefetcher is an access-map (AMPM) prefetcher keyed on load addresses grouped in 2 KiB regions
    loc: p228
    quote: "Apple's primary prefetcher is an AMPM prefetcher, based on load addresses clustered in regions of 2kiB."
    method: patent-reading
    derivation: inferred
    value: 2
    unit: KiB
    supports: []
    notes: US9015422B2 (2013); the 2015 patent may track a moving 2 KiB within 4 KiB
  - id: c-mh-v2-prefetch-at-lsu
    text: >-
      The prefetcher sits at the LSU and sees every virtual load/store address, up to four per cycle, not just
      cache misses, so streams cross page boundaries
    loc: p229
    quote: "Apple differs in that their prefetcher sits at the LSU and sees every (virtual) address that streams through. This is up to four addresses a cycle."
    method: patent-reading
    derivation: inferred
    value: 4
    unit: addresses/cycle
    supports: []
    notes: First seen in US20070294482A1 (2006), which places the prefetch unit in the LSU
  - id: c-mh-v2-prefetch-filter
    text: >-
      Incoming addresses are filtered and queued, and the rest of the prefetch unit processes one address per
      cycle
    loc: p233
    quote: "The first thing done to all these addresses is that they are \"filtered\", most are thrown away, the interesting ones are queued, and ultimately the rest of the Prefetch Unit only processes one address per cycle"
    method: patent-reading
    derivation: inferred
    value: 1
    unit: addresses/cycle
    supports: []
    notes: US9971694B1 (2015)
  - id: c-mh-v2-ampm-map
    text: >-
      Each access map covers a 2 KiB region as 32 two-bit slots, one per 64 B line (demand fetched, prefetched and
      used, prefetched, or not accessed), matched against predefined patterns
    loc: p232
    quote: "the regions used by the Prefetch Unit are apparently 2kiB in size. So a single entry for an Access Mapped region has 32 slots (2kiB/64). Each slot is two bits in size"
    method: patent-reading
    derivation: inferred
    value: 32
    unit: slots
    supports: []
    notes: US9015422B2 (2013). The patent gives no count of tracked regions; the AMPM paper suggests 50-60
  - id: c-mh-v2-ampm-throttle
    text: A credit scheme throttles the prefetcher to about 4 outstanding prefetches per region
    loc: p233
    quote: "throttles the prefetcher so that (essentially) a maximum of about 4 outstanding prefetches are allowed per region."
    method: patent-reading
    derivation: inferred
    value: 4
    unit: prefetches
    approx: true
    supports: []
    notes: US9015422B2 (2013)
  - id: c-mh-v2-unified-prefetch
    text: >-
      The L1 prefetcher drives both levels: high-confidence prefetches go through the L1 and on to a per-CPU
      prefetch queue at the L2 if they miss; low-confidence ones go straight to the L2 queue, which pulls from
      SLC/DRAM into the L2
    loc: p234
    quote: "The L1 Prefetcher is now fully in charge, generating two different streams of requests, one designed to pull data from L2 into L1, the second designed to pull data from SLC/DRAM into L2."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US10180905B1 (2016). Per-region state now holds virtual and physical addresses. Earlier (US9971694B1,
      2015) a separate L2 prefetcher per core was steered by the L1 unit
  - id: c-mh-v2-l2-line-128
    text: The M1 has 64 B lines in the L1 and 128 B lines in the L2 and SLC
    loc: p235
    quote: "So we have the system we still have as of M1, with an L1 that has 64B lines, and and L2 (+SLC) that has 128B lines."
    method: patent-reading
    derivation: inferred
    value: 128
    unit: B
    hedge: "my guess"
    supports: [l2.line]
    notes: Handley's guess from the access-map granularity bit in US10180905B1 (2016), placing the change at about the A10
  - id: c-mh-v2-density-pattern
    text: >-
      One predefined pattern is a density pattern: when many lines of a region have been accessed, the rest are
      prefetched at low confidence, acting as a region prefetcher
    loc: p235
    quote: "pattern, which effectively behaves like a region prefetcher; ie if we're accessed many lines within a region ... lines of that region are prefetched as low confidence lines"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10180905B1 (2016); region perhaps 2, 4 or 8 KiB
  - id: c-mh-v2-prefetch-throttle
    text: >-
      Every 32 cycles the L2 judges how busy the per-CPU prefetch queues are; over a history of busy periods it
      sets a throttle level, and L1 prefetchers then drop requests from regions below a quality threshold
      (50 %, 75 %, 90 %)
    loc: p236
    quote: "Every 32 cycle we loop over each CPU Prefetch Request Queue in the L2, and decide whether or not it should be throttled."
    method: patent-reading
    derivation: inferred
    value: 32
    unit: cycles
    supports: []
    notes: US9904624B1 (2016); example thresholds 16 requests and 4 low-confidence requests per queue, history of ~20 periods
  - id: c-mh-v2-content-directed
    text: >-
      A content-directed prefetcher scans lines entering the L1 for pointer-like 8-byte-aligned values, filters
      them and prefetches by a quality table; Handley saw no evidence of it in his tests
    loc: p237
    quote: "as data lines enter the L1 cache, they are scanned to see if they contain any values that look \"like\" pointers (the patent suggests doing this only on 8-byte aligned boundaries ... we saw no evidence for anything like this"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9886385B1 (2016); Handley guesses it arrived with the A11. Requests go straight to the L2
  - id: c-mh-v2-augury-dmp
    text: Security researchers (Augury, 2022) found evidence of a data memory-dependent prefetcher on the M1, matching the patent
    loc: p239
    quote: "A team investigating security have found evidence of a Content-Dependent Prefetcher on the M1"
    method: secondhand
    derivation: reported
    supports: []
  - id: c-mh-v2-mini-access-maps
    text: >-
      The filter holds one- or two-entry mini access maps, so a region gets a full access map only after a second
      or third access
    loc: p240
    quote: "We create some very small (one or two entry) \"mini Access Maps\" living in the filter."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: 2017 patent (Handley gives no number)
  - id: c-mh-v2-ampm-granularity
    text: For some long patterns the access-map field granularity grows from 64 B to 128 B and then 256 B
    loc: p240
    quote: "we bump the granularity of each field in the Access Map from 64B to 128B then even to 256B."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: 2017 patent (Handley gives no number)
  - id: c-mh-v2-large-stride
    text: >-
      A secondary large-stride prefetcher, a conventional stride table, catches strides the AMPM cannot: longer
      than half a region, about 1000 bytes
    loc: p241
    quote: "the AMPM scheme, flexible as it is, cannot detect strides that are longer than half the size of a region (so, let's say, strides long than about 1000 bytes)."
    method: patent-reading
    derivation: inferred
    value: 1000
    unit: B
    approx: true
    supports: []
    notes: 2017 patent (Handley gives no number)
  - id: c-mh-v2-sms
    text: >-
      A secondary spatial memory streaming prefetcher stores access patterns by PC and, once confident, hands a
      pattern back to the AMPM prefetcher to replay at the new base address
    loc: p241
    quote: "This essentially tries to track access patterns associated with a given PC. ... the SMSP returns the full pattern up to the AMPM Prefetcher, which will replay it"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: 2017 patent (Handley gives no number)
  - id: c-mh-v2-secondary-coverage
    text: >-
      The large-stride prefetcher reports its coverage of an access map to the AMPM prefetcher and takes over the
      stream once that coverage is large enough
    loc: p242
    quote: "once the coverage of the Stride Prefetcher is a large enough fraction of the coverage of the AMPM Prefetcher, we switch to Stride assuming primary control for this stream."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US11176045B2 (2020); Handley does not say which chip implements it
  - id: c-mh-v2-prefetch-not-slc
    text: Prefetching seems to stay within the cluster, using the L2 but not extending to the SLC
    loc: p231
    quote: "It's unclear that, even today, Apple extends prefetching up to the SLC; it looks like prefetching is considered ... to be done within a cluster, exploiting the L2 but not involving the SLC"
    method: patent-reading
    derivation: inferred
    hedge: "It's unclear ... it looks like"
    supports: []
    notes: From US9098418B2 and US9047198B2 (2012), which coordinate L1 and L2 prefetch and translate L2 prefetches across pages
  - id: c-mh-v2-no-i-stream-prefetch
    text: The M1 has no stream prefetcher for instructions
    loc: p243
    quote: "Is there the equivalent of a stream prefetcher for Instructions? Well, maybe there is on other CPUs, but on M1 there is not"
    derivation: inferred
    supports: []
    notes: Handley's explanation for the low L2 code-fetch bandwidth in Chips and Cheese's data; argued in vol 4

  - id: c-mh-v2-dtlb
    text: L1 TLB holds at least 160 entries (128 + 32), not the 128 suggested on the internet
    loc: p186
    quote: "This seems to suggest that the L1 TLB holds at least 160 entries or so (128+32)."
    method: pointer-chase
    derivation: measured
    value: 160
    unit: entries
    hedge: "This seems to suggest"
    supports: [dtlb.l1_entries]
    notes: >-
      Nodes spaced 16 KiB+64 B stay at best-case latency to 161 nodes (2676 KiB).
  - id: c-mh-v2-dtlb-5way
    text: >-
      The L1 data TLB is five-way set associative, indexed by virtual-address bits 14-18, as shown by where
      latency jumps for node spacings from 32 KiB+64 B to 512 KiB+64 B
    loc: p190
    quote: "I think it's pretty clear that we are using 5 bits of the virtual address (so bits 14..18) to index into a five-way associative set."
    method: pointer-chase
    derivation: measured
    value: 5-way set associative, indexed by VA bits 14-18
    hedge: "I think it's pretty clear"
    supports: [dtlb.l1_org]
    notes: >-
      Handley spells out 160 entries as 32 sets of five and rules out 128 set-associative + 32 fully associative,
      and says the internet's 128-entry L1D TLB is not what he sees
  - id: c-mh-v2-dtlb-random-repl
    text: >-
      Past the L1 TLB capacity latency climbs linearly from 3 to 9 cycles rather than stepping, so the L1 TLB
      probably uses random replacement
    loc: p191
    quote: "Note also how latency climbs linearly from the initial 3 cycles to 9 cycles. This is the signature of ... replacement in a cache, rather than LRU ... My guess is the L1 TLB is random replacement"
    method: pointer-chase
    derivation: inferred
    hedge: "My guess"
    supports: []
  - id: c-mh-v2-page-16k
    text: >-
      8 KiB node spacing jumps at the same ~2.5 MiB depth and then pays about half the TLB cost per node, which
      confirms 16 KiB pages
    loc: p191
    quote: "this confirms one more point, that the page size really is 16kiB"
    method: pointer-chase
    derivation: measured
    value: 16
    unit: KiB
    supports: [dtlb.page_size]
  - id: c-mh-v2-no-large-pages-tlb
    text: >-
      Apple shows no interest in large pages on the M1: only 16 KiB pages, with range registers presumably
      covering the I/O and OS cases
    loc: p186
    quote: "Apple appears to have no interest in large pages. This seems to make sense given that the easy large page cases (IO and OS situations) they can cover with Range Registers"
    derivation: inferred
    hedge: "appears to"
    supports: []
    notes: Handley elsewhere calls range registers "likely (though not proved)"
  - id: c-mh-v2-tlb2-drowsy
    text: >-
      Noisy timing on the first L2 TLB accesses suggests the L2 TLB is split into banks that sleep quickly and
      take a few cycles to wake
    loc: p191
    quote: "My guess is that the L2 TLB is aggressively drowsy (ie it's divided into physically distinct banks, those banks are designed to go to sleep rapidly, and take a few cycles to wake up out of sleep)"
    method: pointer-chase
    derivation: inferred
    hedge: "My guess"
    supports: []
    notes: Handley later suggests the L2 TLB, like the L2, may be three segments that sleep or power down independently
  - id: c-mh-v2-tlb2-hit-9
    text: >-
      A load that misses the L1 TLB, hits the L2 TLB and hits the L1D takes 9 cycles, flat from ~2.5 MB out to
      ~50 MB for most node spacings
    loc: p193
    quote: "corresponding to a TLB lookup that hits in L2 TLB but not L1 TLB, along with a subsequent data lookup that hits in L1, together forming a latency of 9 cycles."
    method: pointer-chase
    derivation: measured
    value: 9
    unit: cycles
    supports: []
    notes: >-
      Total load latency, not a miss penalty (7-cpu gives a 6-cycle L1 dTLB miss penalty). 16 KiB+64 B spacing shows
      12-15 cycles instead. AnandTech sees ~9 cycles rising, Handley flat
  - id: c-mh-v2-tlb1-prefetch
    text: >-
      Some TLB prefetching fills the L1 TLB, since loads past its capacity cost only 9 cycles
    loc: p204
    quote: "The quick summary seems to be that we do have TLB prefetching (one way or another) into the TLB1"
    method: pointer-chase
    derivation: inferred
    hedge: "seems to be"
    supports: []
  - id: c-mh-v2-dtlb-l2-3072
    text: Latency jumps for many node spacings at ~48 MB, which is 3072 16 KiB pages, giving a 3072-entry L2 TLB
    loc: p194
    quote: "corresponds to 3072 16kB pages, suggesting an L2 TLB size of 3072, which is in accord with what I've seen elsewhere on the internet."
    method: pointer-chase
    derivation: measured
    value: 3072
    unit: entries
    supports: [dtlb.l2_entries]
  - id: c-mh-v2-tlb2-miss-25
    text: >-
      Missing the L2 TLB adds about 25 cycles (to ~55 per load), the mapping being rebuilt from the MMU cache
    loc: p195
    quote: "a jump to ~55 cycles (additional 25 cycles) when page lookups miss in TLB2 and we have to use the MMU cache to reconstruct the mapping."
    method: pointer-chase
    derivation: measured
    value: 25
    unit: cycles
    approx: true
    supports: [dtlb.l2_miss_penalty]
    notes: 16 KiB+64 B node spacing; elsewhere Handley gives 45-55 cycles after the jump, and "~25 cycles" from the MMU cache
  - id: c-mh-v2-l2-increment-15
    text: >-
      In the 16 KiB+64 B probe, an L1 TLB miss raises latency to ~15 cycles, and also missing the L1D (L2 hit) to
      ~30, read as ~15 cycles each for the L2 TLB and the L2
    loc: p195
    quote: "a jump to around 30 cycles when loads miss in L1 and have to come out of L2. So apparently ~15 cycles to hit in TLB2, then another ~15 cycles to hit in L2."
    method: pointer-chase
    derivation: measured
    value: 15
    unit: cycles
    approx: true
    hedge: "apparently"
    supports: []
    notes: >-
      Increments over an L1 hit in a TLB probe, not a load-to-use L2 latency; see c-mh-v2-l2-latency-17. Handley calls a
      ~16-cycle jump "about the L2 latency"
  - id: c-mh-v2-tlb2-org
    text: >-
      All 3072 L2 TLB entries are usable with power-of-two node spacings, so the L2 TLB is probably 1024 hashed
      sets of three ways rather than plainly set associative
    loc: p199
    quote: "the TLB2 is probably not set associative. Or, to be more precise, it's organized as 1024 entries that are each three ways. So you perform a hash of the virtual address down to a number in the range 0..1023"
    method: pointer-chase
    derivation: derived
    value: 3-way, 1024 sets, hashed index
    hedge: "probably"
    supports: [dtlb.l2_org]
    notes: The hash might XOR the ten lowest page bits with the next ten. Handley later gives 256 sets of 12 ways instead (c-mh-v2-tlb2-256x12)
  - id: c-mh-v2-tlb2-256x12
    text: The M1's 3072-entry L2 TLB is probably 256 sets of 12 ways
    loc: p208
    quote: "This compares with the M1's design which is 3072 entries, probably 256 sets of 12 ways."
    derivation: inferred
    value: 12-way, 256 sets
    hedge: "probably"
    supports: [dtlb.l2_org]
    notes: Aside while comparing with the 256x16 TLB of US20220066947A1; disagrees with Handley's own 1024x3 (c-mh-v2-tlb2-org)
  - id: c-mh-v2-page-table-3
    text: >-
      With 16 KiB pages a superpage covers 256 MiB and a root page 4 TiB, so only three page-table levels are
      needed
    loc: p199
    quote: "a superpage will cover 28 bits of address space (256MiB) and a root page will cover 42 bits (4TiB). So (at least for now!) only three levels of page table are"
    derivation: inferred
    value: 3
    unit: levels
    supports: []
    notes: Handley expects the page-walk cache to hold the root and recent superpages and the leaf tables to be in the L2
  - id: c-mh-v2-mmu-cache
    text: The cost of L2 TLB misses suggests Apple uses an MMU (page-walk) cache of some form
    loc: p230
    quote: "The performance of TLB lookups that miss in the TLB2 suggests that Apple is using an MMU cache of some form, but I did not examine this closely."
    derivation: inferred
    supports: []
  - id: c-mh-v2-no-tlb2-prefetcher
    text: >-
      There is no dedicated L2 TLB prefetcher; the virtual-address data prefetchers touch, and so prefetch,
      the translations they need
    loc: p204
    quote: "Overall what we see suggests that Apple has no dedicated TLB2 prefetcher, and relies on the standard prefetchers (which operate in virtual address space, so will automatically touch required mappings, ie will prefetch in TLB entries)"
    method: pointer-chase
    derivation: inferred
    hedge: "suggests"
    supports: []
    notes: 16 KiB-strided chains beat the expected TLB2+MMU-cache+L2 cost by 10-12 cycles between 48 and ~250 MB
  - id: c-mh-v2-no-pte-prefetch
    text: >-
      No serious TLB prefetching is seen: Apple may keep the extra PTEs from each fetched line (US8397049B2) but
      does no stride PTE prefetching
    loc: p230
    quote: "I found no evidence of serious TLB prefetching. ... does not appear to engage in even basic stride PTE prefetching."
    method: patent-reading
    derivation: inferred
    hedge: "does not appear to"
    supports: []
    notes: US8397049B2 (2009)
  - id: c-mh-v2-tlb2-shared-guess
    text: >-
      Handley's preferred design has the L2 TLB, MMU cache and page walkers shared at cluster level, for which he
      has no direct evidence
    loc: p202
    quote: "So in my fantasy of how the M1 should be designed, all three of TLB2, the MMU cache, and the Page Walkers (state plus implementation logic) form a shared cluster-level entity!"
    derivation: inferred
    hedge: "my fantasy"
    supports: []
    notes: Handley says "I want to be true ... but have no direct evidence for"; the striping patent's diagrams also suggest a shared L2 TLB
  - id: c-mh-v2-tlb2-per-cluster
    text: >-
      A 2013 cluster maintenance patent adds to evidence, without proof, that the L2 TLB and page walkers are per
      cluster, not per core
    loc: p217
    quote: "one more data point in the collection of evidence (many substantial pieces, but no smoking gun) that the L2 TLB and associated page-walkers are per-cluster, not per-core."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9418010B2 (2013)

  - id: c-mh-v2-tlbi-range
    text: >-
      For a TLB range invalidation, hardware estimates the cycles for walking every entry versus looking up every
      page in the range and uses the faster
    loc: p206
    quote: "And so the patent calculates the cycle count for each option, and chooses whichever way will be faster!"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20200218663A1 (2019); Handley does not say whether the M1 implements it
  - id: c-mh-v2-asid-16
    text: Apple appears to use 16-bit ASIDs
    loc: p207
    quote: "My guess is that Apple uses a 16b ASID"
    method: vendor-doc
    derivation: inferred
    value: 16
    unit: bits
    hedge: "My guess"
    supports: []
    notes: From the XNU header osfmk/arm64/proc_reg.h
  - id: c-mh-v2-vmid-8
    text: Apple probably uses 8-bit VMIDs for now
    loc: p208
    quote: "ARM VMIDs are likewise either 8 or 16 bits; my guess is that (for now) Apple uses 8 bits."
    derivation: inferred
    value: 8
    unit: bits
    hedge: "my guess"
    supports: []
  - id: c-mh-v2-tlb-striping
    text: >-
      Striping ASID/VMID fields across the L2 TLB's SRAMs lets invalidation by ASID or VMID compare four
      entries at once, 4x as fast
    loc: p208
    quote: "the patent describes a non-obvious way of storing data in the L2 TLB such that we can perform the operation 4x as fast"
    method: patent-reading
    derivation: inferred
    value: 4
    unit: x
    chip: m2
    supports: []
    notes: US20220066947A1 (2020); Handley says these patents appear not to be implemented on the M1, perhaps on the A15/M2
  - id: c-mh-v2-tlb-patent-256x16
    text: >-
      The striping patent's L2 TLB is 256 sets of 16 ways, built from 8 physical blocks of two ways each
    loc: p208
    quote: "the L2 TLB describes is apparently 256 sets of 16 ways. ... The physical TLB (the 16 ways) consists of 8 identical physical blocks each handling two ways."
    method: patent-reading
    derivation: inferred
    value: 16-way, 256 sets
    chip: m2
    supports: []
    notes: US20220066947A1 (2020); Handley calls the 256x16 "fairly definite"
  - id: c-mh-v2-splinter-page-sizes
    text: >-
      A common TLB holds mixed page sizes with a size bit per entry, and the design allows five sizes: 16K, 64K, 2M,
      32M and 512M
    loc: p211
    quote: "has a size bit indicating whether the entry corresponds to a small vs large page. ... In fact the design envisages 5 different page sizes: 16K, 64K, 2M, 32M, and 512M."
    method: patent-reading
    derivation: inferred
    value: 16K, 64K, 2M, 32M, 512M
    chip: m2
    supports: []
    notes: US20220075734A1 (2020), for hypervisors using large pages that the guest splinters
  - id: c-mh-v2-page-size-presence
    text: >-
      Per translation context the TLB keeps a five-bit page-size-presence vector, refreshed by full scans, and a
      priority order so lookups try only the page sizes present
    loc: p212
    quote: "This creates a \"Page Size Presence\" bitvector five bits long, with 1 set for each present page size."
    method: patent-reading
    derivation: inferred
    value: 5
    unit: bits
    chip: m2
    supports: []
    notes: US20220075735A1 (2020)
  - id: c-mh-v2-mmu-cache-patent
    text: >-
      For two-stage translation Apple names three walk caches, S1TC, S2TC and HTLB, and ties their replacement
      to tracking which entries a completed walk has made redundant
    loc: p215
    quote: "Apple calls these S1TC ... S2TC ... and HTLB (Hypervisor TLB), which give a full lookup of a VA, through GPA to PA. All of these caches are present in the SoC."
    method: patent-reading
    derivation: inferred
    chip: m2
    supports: []
    notes: US11429535B1 (2021). Handley guesses this lives in a per-cluster L2 TLB/walker/MMU and at the SLC for IOMMUs
  - id: c-mh-v2-accel-tlbi
    text: >-
      Invalidations sent over the NoC to accelerator TLBs are bundled, up to about 8 per request, and dropped when
      the accelerator was powered down
    loc: p216
    quote: "the patent suggests bundling perhaps up to 8 TLB invalidation in one request."
    method: patent-reading
    derivation: inferred
    value: 8
    unit: invalidations
    supports: []
    notes: US20200379920A1 (2019); not tied to a chip

  - id: c-mh-v2-l2-latency-17
    text: >-
      A chain of randomly placed 64 B nodes in a 1 MiB block (in the L2) takes about 17 cycles per load
    loc: p218
    quote: "On the far left side we have one 64B node in a 64B box, each box randomly placed. So pure randomness, and about 17 cycle latency."
    method: pointer-chase
    derivation: measured
    value: 17
    unit: cycles
    approx: true
    hedge: "about"
    supports: [l2.latency]
    notes: >-
      Handley also expects "around 16cycles or so" for a random L2 chain, and gives the inner L2 latency as
      "apparently 18 cycles" (c-mh-v2-inner-l2-latency)
  - id: c-mh-v2-l2-inner
    text: >-
      Bandwidth curves droop at about 3 MiB; Handley reads this as each core having an inner L2 of 3 MiB (a
      quarter of the 12 MiB L2) plus a slightly slower outer L2
    loc: p108
    quote: "there's an \"inner L2\" of 3MiB, and an \"outer L2\", that's slightly slower ... So each core has an \"inner L2\" of 3MiB (one quarter of the 12MiB L2)."
    method: throughput
    derivation: measured
    value: 3
    unit: MiB
    hedge: "My guess for this is"
    supports: [l2.inner_slice]
    notes: >-
      The knee is measured; the four 3 MiB cachelets, each half private and half shared (outer L2 of 4.5
      MiB, 7.5 MiB per core), are Handley's guess, restated in c-mh-v2-near-l2-3mib and c-mh-v2-l2-outer
  - id: c-mh-v2-l2-outer
    text: Beyond its 3 MiB inner L2, a core still has 4.5 MiB of outer L2
    loc: p206
    quote: "3MiB L2 only reflects the inner L2, we still have 4.5MiB of outer L2."
    derivation: inferred
    value: 4.5
    unit: MiB
    supports: []
    notes: The arithmetic (three times 1.5 MiB, 7.5 MiB per core) is in c-mh-v2-l2-inner
  - id: c-mh-v2-l2-segments
    text: >-
      From several Apple patents, the (inner) L2 is three physical segments of 1 MiB with independent power
      control, any of which may be asleep (an extra cycle to wake) or off
    loc: p200
    quote: "based on multiple Apple patents is that the L2 is split into three \"physical segments\" with independent voltage/power control, each 1MiB in size."
    method: patent-reading
    derivation: inferred
    value: 3
    unit: segments
    supports: []
  - id: c-mh-v2-l2-not-24way
    text: >-
      Handley doubts the usual description of the 3 MiB inner L2 as 24-way set associative, since 24 tag compares
      per access would cost too much power
    loc: p200
    quote: "is that it is a 24-way set associative cache. But does this really make sense? ... This is what the internet seems to imagine, but to me it makes no sense."
    derivation: inferred
    supports: []
  - id: c-mh-v2-l2-assoc-hash
    text: >-
      The L2 behaves as three-way associative (one way per segment) with a hashed index, which pathological node
      spacings collapse onto an eighth of the cache
    loc: p205
    quote: "the overall cache is always three-way associative (three segments) but pathological address patterns will hash all addresses to only an eighth of the cache"
    method: pointer-chase
    derivation: inferred
    value: 3
    unit: ways
    supports: []
    notes: Read from 16K64 chains that run ~20 cycles slower than expected out to ~96 MB
  - id: c-mh-v2-l2-cpu-hash
    text: >-
      The inner and outer L2 may be logical, defined by hash functions that include the CPU ID with a per-CPU line
      budget, rather than physical structures
    loc: p205
    quote: "I suspect hash functions are perhaps also used to define the inner and outer L2 caches, so that these are not physical structures."
    derivation: inferred
    hedge: "I suspect"
    supports: []
  - id: c-mh-v2-l2-p2p
    text: >-
      Chips and Cheese's multi-core read bandwidth (four cores get four times one core's L2 bandwidth) suggests a
      point-to-point L2 connection to each P core
    loc: p243
    quote: "the P L2 has what looks like point-to-point (rather than a shared) connection to each of the four cores it services"
    method: secondhand
    derivation: reported
    supports: []
  - id: c-mh-v2-l2-ifetch-quarter
    text: >-
      Per Chips and Cheese, sustained L1I bandwidth is 8 instructions (32 B) per cycle, and code fetch from the L2
      about a quarter of that
    loc: p243
    quote: "while the (sustained) L1I bandwidth is 8 instructions (ie 32B) per cycle, the sustained bandwidth from L2 is apparently about a quarter of that."
    method: secondhand
    derivation: reported
    value: 8
    unit: instr/cycle
    supports: []

  - id: c-mh-v2-l1d-8way-tlb
    text: >-
      The L1D is indexed by address bits 6-13 (256 sets of 64 B lines) with eight ways, so 16 KiB-spaced nodes all
      share one set and spill to the L2 after eight
    loc: p184
    quote: "The eight address bits 6..13 give the set into which to place the line. Each set can hold up to eight lines. That's what 8-way set-associative means!"
    method: pointer-chase
    derivation: inferred
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: >-
      Explains why 16 KiB-spaced chains cost 16+ cycles per load from ~36 nodes. Handley later qualifies how ways are
      chosen (c-mh-v2-l1d-way-hash).
  - id: c-mh-v2-l1d-way-hash
    text: >-
      The L1D seems to place each line in a way chosen deterministically from low physical page-address bits
      (hashed with index bits) rather than by ordinary tag-matched ways, with no way prediction
    loc: p197
    quote: "we appear to have learned one more fact about the M1's L1D ... like a deterministic algorithm to place lines in sets, rather than the usual ways."
    method: pointer-chase
    derivation: inferred
    hedge: "appear to"
    supports: []
    notes: >-
      Spacings of 32K-128K+64 B use all eight ways, 256K/512K+64 B only one, 16K+64 B about four;
      Handley never sees a way misprediction and cannot name the hash

new_params:
  dtlb.page_size:   {block: dtlb, name: Page size, unit: KiB}
  dtlb.l2_org:      {block: dtlb, name: L2 TLB organisation}
  prefetch.streams: {block: prefetch, name: Simultaneous stride streams, unit: streams}

new_mechanisms:
  lsu_virtual_prefetch:
    name: LSU-resident virtual-address prefetcher
    status: inferred
    description: The prefetcher trains on every load and store virtual address at the LSU.
    params: [prefetch.kinds, prefetch.streams]
    sim_switch: null
    detection_rule: >-
      a linear pointer chase keeps its L1 latency across page boundaries out to DRAM, and page-strided chains the
      prefetcher can follow lose the L1 TLB miss cost; a physical-address prefetcher would restart at each page
  l1d_hashed_way:
    name: L1D way chosen from physical page bits
    status: speculative
    description: A line's way seems fixed by a hash of physical page bits.
    params: [l1d.assoc]
    sim_switch: null
    detection_rule: >-
      pointer chases with node spacing 2^k+64 B reach the full L1 line count for some k and about one way per set
      for others, with no extra-cycle way-mispredict outliers
  content_directed_prefetch:
    name: Content-directed (data memory-dependent) prefetch
    status: inferred
    description: Pointer-like values in filled lines are prefetched into the L2.
    params: [prefetch.kinds]
    sim_switch: null
    detection_rule: >-
      loading a line of pointers makes later chases through those pointers faster although no load ever used
      their addresses

mechanism_claims:
  lsu_virtual_prefetch: [c-mh-v2-prefetch-at-lsu, c-mh-v2-stride-to-dram, c-mh-v2-no-tlb2-prefetcher, c-mh-v2-tlb1-prefetch,
                         c-mh-v2-ampm-2k, c-mh-v2-ampm-map, c-mh-v2-prefetch-filter, c-mh-v2-unified-prefetch,
                         c-mh-v2-prefetch-kinds, c-mh-v2-region-to-l2]
  l1d_hashed_way: [c-mh-v2-l1d-way-hash, c-mh-v2-l1d-8way-tlb]
  content_directed_prefetch: [c-mh-v2-content-directed, c-mh-v2-augury-dmp, c-at-pointer-prefetch]
