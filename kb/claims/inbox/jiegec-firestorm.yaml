# jiegec-firestorm.yaml
# Jiajie Chen, 2024
# Chen's Firestorm diagram notes and raw sweeps: load and store queue limits, scheduler sizes and the return stack.
session: jiegec-firestorm
source: jiegec-firestorm

claims:
  - id: c-jc-ras-sweep
    text: >-
      In Chen's call-depth sweep the minimum time per call level stays near 1.1 up to a depth of 50 and jumps to about
      5.6 at 51, staying near 5 out to 64
    loc: p003
    quote: "48,1.08,4.71,34.50 49,1.10,5.24,76.29 50,1.12,5.01,50.88 51,5.57,9.63,65.25 52,5.48,10.23,95.85"
    derivation: measured
    value: 50
    unit: entries
    supports: [ras.depth]
    notes: Columns are depth, min, avg and max; the unit of time is not given. The diagram labels this a 50-entry RAS.

  - id: c-jc-lq-130
    text: The load sweep shows a step at 130 loads, taken as a 130-entry load queue
    loc: p001
    quote: "load: spike at 130(pattern 4) and 188(pattern5, 188=130+48(scheduler)+10(dispatch queue)) 130-entry Load Queue"
    derivation: measured
    value: 130
    unit: entries
    supports: [lq.entries]

  - id: c-jc-load-188
    text: >-
      A second load pattern steps at 188, which Chen splits into 130 load queue entries, 48 scheduler entries and 10
      dispatch queue entries
    loc: p001
    quote: "188(pattern5, 188=130+48(scheduler)+10(dispatch queue))"
    derivation: derived
    value: 188
    unit: loads
    supports: []
    notes: Same split as c-dj-lsq-branch-loads-188.

  - id: c-jc-store-107
    text: Two store patterns step at 107, which Chen reads as 60 store queue entries plus 48 scheduler entries less one
    loc: p001
    quote: "store: spike at 107(pattern 2 & 6, 107=60+48(scheduler)-1)"
    derivation: derived
    value: 107
    unit: stores
    supports: []
    notes: Same count as c-dj-lsq-store-107.

  - id: c-jc-store-118
    text: >-
      A third store pattern steps at 118, which is 60 store queue entries plus 48 scheduler and 10 dispatch queue
      entries; the 60 is computed as 118 minus 48 minus 10
    loc: p001
    quote: "118(pattern 7, 60+48(scheduler)+10(dispatch queue)) ... 60 was computed by 118 - 48(scheduler) - 10(dispatch queue) 60-entry Store Queue"
    derivation: derived
    value: 60
    unit: entries
    supports: [sq.entries]

  - id: c-jc-lsu-steps
    text: >-
      In the raw store sweep, pattern 7 holds near 114 up to 118 stores and jumps to about 185 at 119; the load pattern 5
      jumps between 188 and 189 in the same way
    loc: p002
    quote: "7,116,113.30,115.34,122.40 7,117,113.30,114.76,122.20 7,118,113.60,113.79,114.40 7,119,184.50,187.01,198.30 7,120,184.50,187.68,198.40"
    derivation: measured
    value: 118
    unit: stores
    supports: []
    notes: Columns are pattern, size, min, avg and max; the unit of time is not given.

  - id: c-jc-sched-ls-48
    text: The load/store probe fits 58 ops, 48 of them in the schedulable part, so the memory scheduler holds 48
    loc: p001
    quote: "Source: jiegec, 58(10+48) sched size for load & store ... Source: jiegec, 48 sched size for load & store"
    derivation: measured
    value: 48
    unit: entries
    supports: [sched_ls.entries]

  - id: c-jc-dispatch-ls-10
    text: The other 10 of the 58 load/store entries are the memory dispatch queue
    loc: p001
    quote: "Source: jiegec, 58(10+48) sched size for load & store ... 10-entry Memory Dispatch Queue"
    derivation: derived
    value: 10
    unit: entries
    supports: [dispatch.ls_entries]

  - id: c-jc-int-sched-133
    text: >-
      The ALU probe fits 158 ops, 133 of them schedulable, which Chen matches to two 12-entry dispatch queues and
      schedulers of 24, 26, 16, 12, 28 and 28 entries
    loc: p001
    quote: "Source: jiegec, 158(=12+12+24+26+16+12+28+28) sched size for alu ... Source: jiegec, 133(~=134=24+26+16+12+28+28) sched w/o nsq size for alu"
    derivation: measured
    value: 133
    unit: entries
    supports: [sched_int.total_entries]

  - id: c-jc-mul-sched-28
    text: >-
      The integer multiply probe fits 68 ops, 56 of them schedulable, matching two 28-entry schedulers behind one
      12-entry dispatch queue
    loc: p001
    quote: "Source: jiegec, 68(12+28+28) sched size for imul ... Source: jiegec, 56(28+28) sched w/o nsq size for imul"
    derivation: derived
    value: 28
    unit: entries
    supports: []
    contradicts: [sched_int.entries_per_queue]
    notes: Against the 13 per multiply queue of c-mh-v1-sched-int-13.

  - id: c-jc-fp-sched-36
    text: >-
      The FP probe fits 156 ops, 143 of them schedulable, matching one 12-entry FP dispatch queue ahead of four 36-entry
      schedulers
    loc: p001
    quote: "Source: jiegec, 156(=12+36+36+36+36) sched size for fp ... Source: jiegec, 143(~=144=36+36+36+36) sched w/o nsq size for fp dispatch4: 12-entry FP Dispatch Queue"
    derivation: derived
    value: 36
    unit: entries
    supports: []
    contradicts: [sched_fp.entries_per_queue]
    notes: Same data as c-jia-sched-fp-36, here with one 12-entry FP queue rather than two of 6.

  - id: c-jc-rename-620
    text: Chen measures about 620 for the rename history, against Johnson's 623
    loc: p001
    quote: "Source: jiegec, ~620 rename: ~623-entry Rename History"
    derivation: measured
    value: 620
    unit: entries
    approx: true
    supports: [retire.rename_queue]

  - id: c-jc-ls-pipes
    text: Firestorm has two load pipes, one store pipe and one load/store pipe
    loc: p001
    quote: "Source: jiegec 2 Load Pipe 1 Store Pipe 1 Load/Store Pipe"
    derivation: measured
    value: 4
    unit: units
    supports: [lsu.ls_units]

new_params: {}

new_mechanisms: {}

mechanism_claims:
  ras_overflow_clear: [c-jc-ras-sweep]
  lsq_at_issue: [c-jc-load-188, c-jc-store-107, c-jc-store-118, c-jc-lsu-steps]
  dispatch_buffers: [c-jc-dispatch-ls-10]
