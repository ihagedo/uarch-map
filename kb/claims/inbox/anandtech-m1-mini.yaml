# anandtech-m1-mini.yaml
# Andrei Frumusanu, 2020
# Clocks, power, memory bus, latency and single-core DRAM bandwidth measured on the M1 Mac mini.
session: anandtech-m1-mini
source: anandtech-m1-mini

claims:
  - id: c-at-mini-clock
    text: >-
      A Firestorm core runs at 3.2 GHz in single-threaded work, and while thermal headroom lasts all four keep that
      clock under all-core load
    loc: p001
    quote: "We can confirm that in single-threaded workloads, Apple’s Firestorm cores now clock in at 3.2GHz ... As long as there's thermal headroom, this clock also applies to all-core loads"
    derivation: measured
    value: 3.2
    unit: GHz
    supports: [pcluster.clock_max]
    notes: Mac mini.

  - id: c-at-mini-ice-clock
    text: The four Icestorm cores run at 2064 MHz, up from 1823 MHz on the A14
    loc: p001
    quote: "4x 3.2GHz performance cores also seeing 4x Thunder efficiency cores at 2064MHz, also quite a lot higher than 1823MHz on the A14"
    derivation: measured
    value: 2064
    unit: MHz
    supports: []
    chip: icestorm
    notes: The article writes Thunder for the Icestorm cores. Agrees with c-7cpu-ice-clock.

  - id: c-at-mini-st-power
    text: >-
      Single-threaded work such as compiling with GCC adds about 6.3 W of active power on a Firestorm core, and
      DRAM-heavy single-threaded work up to 10.5 W
    loc: p001
    quote: "During average single-threaded workloads on the 3.2GHz Firestorm cores, such as GCC code compilation, we’re seeing device power go up to 10.5W with active power at around 6.3W."
    derivation: measured
    value: 6.3
    unit: W
    approx: true
    supports: []
    notes: >-
      Wall power of the Mac mini minus its 4.2 W idle, so DRAM and conversion losses are included. The DRAM-heavy
      figure is active power too.

  - id: c-at-mini-mt-power
    text: >-
      With all cores loaded, active power is about 18 W in memory-heavy work, about 22 W on average and peaks near 27 W
      in compute-heavy work
    loc: p001
    quote: "In memory-heavy workloads where the CPU utilisation isn’t as high, we’re seeing 18W active power, going up to around 22W in average workloads, and peaking around 27W in compute heavy workloads."
    derivation: measured
    value: 27
    range: [18, 27]
    unit: W
    approx: true
    supports: []
    notes: Wall power minus idle; the author's best guess for a comparable TDP is 20 to 24 W.

  - id: c-at-mini-dram-bus
    text: The M1 runs LPDDR4X-4266 memory over a 128-bit bus of eight 16-bit channels, where the A14 has a 64-bit bus
    loc: p001
    quote: "it’s running on a 128-bit memory bus rather than the mobile 64-bit bus. Across 8x 16-bit memory channels and at LPDDR4X-4266-class memory"
    method: secondhand
    derivation: reported
    value: 8
    unit: channels
    supports: []
    notes: Specification figure; how it was obtained is not stated. Agrees with c-at-m1-dram-bus.

  - id: c-at-mini-peak-bw
    text: The eight channels give the M1 a peak DRAM bandwidth of 68.25 GB/s
    loc: p001
    quote: "this means the M1 hits a peak of 68.25GB/s memory bandwidth"
    derivation: derived
    value: 68.25
    unit: GB/s
    supports: [memctrl.peak_bw]
    notes: Computed from the bus width and data rate, not measured. Agrees with c-mh-v8-m1-bw-66.

  - id: c-at-mini-dram-latency
    text: Full random loads at a 128 MB test depth take 96 ns on the M1, against 102 ns on the A14
    loc: p001
    quote: "measuring 96ns at 128MB full random test depth, compared to 102ns on the A14"
    derivation: measured
    value: 96
    unit: ns
    supports: []
    notes: >-
      Whole load latency at that depth; c-7cpu-dram-latency counts 91 ns on top of the L2 latency, so
      memctrl.dram_latency is left unsupported.

  - id: c-at-mini-l2-partition
    text: >-
      One core cannot use all of the 12 MB L2: its latency starts to rise past about 8 MB, which the author reads as
      Apple still limiting how much of the L2 a single core may use
    loc: p001
    quote: "it seems that Apple continues to do some partitioning as to how much as single core can use as we’re still seeing some latency uptick after 8MB"
    derivation: measured
    value: 8
    unit: MiB
    approx: true
    hedge: "it seems that"
    supports: [l2.core_capacity]
    notes: Agrees in kind with c-mh-v2-l2-transitions (7.5 MiB).

  - id: c-at-mini-slc-16
    text: >-
      The author assumes, without certainty, that the M1's SLC, shared by all blocks on the chip, is a 16 MB cache like
      the A14's, because the latency results behave much like the A14's
    loc: p001
    quote: "We’re not exactly certain, but the test results do behave a lot like on the A14 and thus we assume this is a similar 16MB chunk of cache on the SoC"
    derivation: inferred
    value: 16
    unit: MiB
    hedge: "We’re not exactly certain ... we assume"
    supports: []
    contradicts: [slc.size]
    notes: The same author gives the M1's SLC as 8 MB in the M1 Max review (c-at-max-m1-slc-8).

  - id: c-at-mini-dram-read-bw
    text: One Firestorm core reads from DRAM at up to about 58 GB/s
    loc: p001
    quote: "A single Firestorm achieves memory reads up to around 58GB/s"
    derivation: measured
    value: 58
    unit: GB/s
    approx: true
    supports: [memctrl.dram_load_bw]
    notes: Below the 64 GB/s of c-7cpu-ram-read-bw and c-mh-v2-slc-dram-load-64.

  - id: c-at-mini-dram-write-bw
    text: One Firestorm core writes to DRAM at 33 to 36 GB/s
    loc: p001
    quote: "A single Firestorm achieves memory reads up to around 58GB/s, with memory writes coming in at 33-36GB/s."
    derivation: measured
    value: 34.5
    range: [33, 36]
    unit: GB/s
    supports: []

  - id: c-at-mini-dram-copy-bw
    text: One Firestorm core copies memory at 60 to 62 GB/s, depending on whether scalar or vector instructions are used
    loc: p001
    quote: "Most importantly, memory copies land in at 60 to 62GB/s depending if you’re using scalar or vector instructions."
    derivation: measured
    value: 61
    range: [60, 62]
    unit: GB/s
    supports: []

  - id: c-at-mini-one-core-saturates
    text: A single Firestorm core can almost saturate the M1's memory controllers
    loc: p001
    quote: "The fact that a single Firestorm core can almost saturate the memory controllers is astounding and something we’ve never seen in a design before."
    derivation: measured
    value: true
    supports: []

  - id: c-at-mini-congestion
    text: Several cores using DRAM at once get no more aggregate bandwidth than one core, and congestion lowers it
    loc: p001
    quote: "having multiple cores access things at the same time don’t actually increase the system bandwidth, but actually due to congestion lower the effective achieved aggregate bandwidth"
    derivation: measured
    value: true
    supports: []
    notes: Agrees with c-mh-v2-one-thread-saturates.

new_params: {}

new_mechanisms:
  one_core_dram_saturation:
    name: One core saturates DRAM
    block: memctrl
    status: measured
    description: >-
      A single Firestorm core draws nearly all of the M1's DRAM bandwidth, so more cores add none and congestion lowers
      the total.
    params: [memctrl.dram_load_bw]
    claims: [c-at-mini-one-core-saturates, c-at-mini-congestion]
    sim_switch: null
    detection_rule: >-
      Aggregate DRAM read bandwidth with two to four cores streaming is no higher than with one core, and may be
      lower.

mechanism_claims:
  l2_cachelets: [c-at-mini-l2-partition]
