# branch-predictor-papers.yaml
# Adam Tuby and Adam Morrison, 2025; Lorenz Hetterich and Michael Schwarz, 2022
# The M1 conditional branch predictor reverse engineered, and Spectre on Apple silicon.
session: branch-predictor-papers
source: arxiv-2502-10719

claims:
  - id: c-tm-tage
    text: >-
      The M1 cores' conditional branch predictor is taken to be a TAGE variant, a hypothesis drawn from Apple
      patent filings that the authors say they confirm experimentally
    loc: p008
    quote: "Our analysis assumes that M1 cores employ a TAGE conditional branch predictor (§ 2.3). This hypothesis is based on Apple patent filings [2, 42] and we confirm it experimentally."
    method: patent-reading
    derivation: inferred
    value: tage-like
    supports: [dirpred.kind]
    notes: >-
      Patents cited are US 10,719,327 B1 and US 11,321,095 B2. No separate experiment, only that the TAGE-based 25 %
      aliasing signature and last-provider-component primitive behave as predicted (c-tm-lpc). Both cores.
  - id: c-tm-bruteforce
    text: >-
      Brute-force out-of-place mistraining of a conditional branch on Firestorm succeeded once in about a
      billion attempts, implying a search space near 2^30
    loc: p002
    quote: "We empirically find that brute-force out-of-place mistraining on the M1 can take 1 B attempts to succeed."
    method: branch-sweep
    derivation: measured
    value: 1000000000
    unit: attempts
    approx: true
    supports: []
    notes: >-
      A 26-hour run of BHI's code adapted to conditional branches; Icestorm had 4 successes in 650 M (2^27). The
      authors blame the TAGE multi-component structure, against 2^14-2^17 reported by BHI for Intel cores.
  - id: c-tm-lpc
    text: >-
      Forcing every mistraining attempt into the last (longest-history) TAGE component cuts the brute-force
      attempts needed on Firestorm 32-fold
    loc: p008
    quote: "a brute force search employing our LPC primitive succeeds with 32× and 16× fewer attempts on the Firestorm and Icestorm microarchitectures, respectively"
    method: branch-sweep
    derivation: measured
    value: 32
    unit: x
    supports: []
    notes: >-
      Table 2: Firestorm 33 successes in 1.1 B trials, search space about 2^25. The primitive trains the
      branch both ways with histories that differ only in their oldest bit, so only the full-history component
      can separate them.
  - id: c-tm-ice-lpc
    text: Forcing mistraining into the last TAGE component cuts the brute-force attempts needed on Icestorm 16-fold
    loc: p008
    quote: "a brute force search employing our LPC primitive succeeds with 32× and 16× fewer attempts on the Firestorm and Icestorm microarchitectures, respectively"
    method: branch-sweep
    derivation: measured
    value: 16
    unit: x
    supports: []
    chip: icestorm
    notes: >-
      Table 2: Icestorm 61 successes in 565 M trials, about 2^23; plain brute force gave 4 in 650 M,
      about 2^27 (Table 1).
  - id: c-tm-lpc-pc-bit2
    text: >-
      In a slide of history-length + 1 branches, moving the first branch 4 bytes (changing PC bit 2) flips the
      oldest bit of the history register seen by the last branch
    loc: p007
    quote: "flipping the last bit of the BHR value can be achieved by moving the first branch in the branch slide 4 bytes ahead or behind in memory"
    method: branch-sweep
    derivation: measured
    supports: []
    notes: The paper's M1 implementation of its last-provider-component primitive (c-tm-lpc).

  - id: c-tm-counter-3bit
    text: The direction predictor's saturating prediction counters are 3 bits wide
    loc: p009
    quote: "finding the width of the M1 BPU’s saturating prediction counters, which we find is c = 3"
    method: branch-sweep
    derivation: derived
    value: 3
    unit: bits
    supports: [dirpred.counter_bits]
    notes: >-
      Appendix A.2: a branch with a fixed history whose outcome flips every N iterations mispredicts at
      4/N, i.e. 2^(c-1) = 4 mispredictions per flip. Core not named; stated for both cores by default.
  - id: c-tm-pmc-cond-mispredict
    text: PMC5 with event encoding 0xc5 counts conditional branch mispredictions
    loc: p019
    quote: "Overall, we identify PMC5 event 0xc5 as counting conditional branch mispredictions."
    method: counter
    derivation: measured
    supports: []
    notes: >-
      Found by sweeping event encodings against a random-outcome branch (50 %) and an N-iteration loop branch (1/N);
      0xcb and 0xcd gave similar results. Counters PMC2-PMC9 are selected through PMESR0/PMESR1.
  - id: c-tm-pmc-ind-mispredict
    text: PMC5 with event encoding 0xc6 counts indirect branch mispredictions, exclusive of the conditional event 0xc5
    loc: p019
    quote: "Using analogous experiments, we find that PMC5 event 0xc6 counts indirect branch mispredictions."
    method: counter
    derivation: measured
    supports: []
    notes: The authors verify 0xc5 and 0xc6 never count the same event. 0xcb and 0xce gave similar results.

  - id: c-tm-history-inputs
    text: >-
      The history register takes conditional-branch PC bits 2-24, all 19 bits of the conditional branch offset,
      indirect-branch PC bits 2-5 and 25-30, and indirect-branch target bits 2-30
    loc: p010
    quote: "only bits 2–24 in a conditional branch’s PC address affect the BHR ... only bits 2–5 and 25–30 affect the BHR ... every bit 2–30 affects the BHR ... signed 19-bit field ... all these bits affect the BHR"
    method: branch-sweep
    derivation: measured
    value: "cond PC bits 2-24, cond offset (all 19 bits), indirect PC bits 2-5 and 25-30, indirect target bits 2-30"
    supports: [dirpred.history_inputs]
    notes: >-
      Firestorm, H = 0 (the tested branch right before the spy branch). Bits above 30 could not be swept this way;
      bits 32-46 are excluded separately (c-tm-high-bits-ignored) and bit 31 is left undetermined.
  - id: c-tm-high-bits-ignored
    text: Bits 32-46 of branch PC and target addresses do not affect the history register
    loc: p011
    quote: "Figure 7 shows the results for the Firestorm microarchitecture, which show that bits 32–46 do not affect the BHR."
    method: branch-sweep
    derivation: measured
    supports: [dirpred.history_inputs]
    notes: >-
      Tested for conditional and indirect branch PC and target bits 26-46. User and kernel addresses differ in
      these high bits, so a user-space shadow of a kernel path matching it in the low 32 bits reproduces its
      history.
  - id: c-tm-history-100
    text: Firestorm's branch history length is 100 branches
    loc: p011
    quote: "We conclude that the Firestorm’s branch history length is 100."
    method: branch-sweep
    derivation: measured
    value: 100
    unit: branches
    supports: [dirpred.history]
    notes: >-
      PC bit 2 still affects the history 99 branches back, no PC bit does at 100. Distance counts branches that shift
      the history; not-taken conditional branches do not (c-tm-history-update).
  - id: c-tm-ice-history-60
    text: Icestorm's branch history length is 60 branches
    loc: p011
    quote: "Icestorm results (not shown) indicate that its history length is 60."
    method: branch-sweep
    derivation: measured
    value: 60
    unit: branches
    supports: []
    chip: icestorm
  - id: c-tm-bhr-width
    text: Firestorm's branch history register is 100 bits wide, one bit of shift per history update over 100 branches
    loc: p013
    quote: "It follows from the results of § 6.3.6 and § 6.3.5 that the BHR width of Firestorm and Icestorm cores is 100 and 60 bits, respectively."
    derivation: inferred
    value: 100
    unit: bits
    supports: []
    notes: The authors derive width = shift per update (1 bit) x history length (100); the history length is in c-tm-history-100.
  - id: c-tm-ice-bhr-width
    text: Icestorm's branch history register is 60 bits wide
    loc: p013
    quote: "It follows from the results of § 6.3.6 and § 6.3.5 that the BHR width of Firestorm and Icestorm cores is 100 and 60 bits, respectively."
    derivation: inferred
    value: 60
    unit: bits
    supports: []
    chip: icestorm
    notes: Width = 1-bit shift x 60-branch history length, as the authors derive it.
  - id: c-tm-history-update
    text: >-
      Each history update shifts the register by one bit and XORs in the branch's bits; direct unconditional
      branches shift it, not-taken conditional branches do not
    loc: p012
    quote: "demonstrating that non-taken conditional branches do not shift the BHR ... which shows that direct (unconditional) branches do shift the BHR ... all the immediate offset bits except 2 are XORed to the shifted (by one bit) BHR"
    method: branch-sweep
    derivation: measured
    value: "shift 1 bit and XOR in branch bits per update; not-taken conditional branches do not shift"
    supports: [dirpred.history_update]
    notes: Firestorm figures (Fig. 10, 11). Taken conditional and indirect branches also shift by one bit (c-tm-pc-shift-xor, c-tm-target-shift-xor).
  - id: c-tm-imm-shift-xor
    text: >-
      Bits 0-1 and 3-16 of a conditional branch's offset are XORed, unshifted, into the history register after it
      shifts by one bit
    loc: p011
    quote: "We find that bits 0–1 and 3–16 of a conditional branch’s immediate jump offset use a shift-and-XOR1 update policy."
    method: branch-sweep
    derivation: measured
    supports: [dirpred.history_update]
    notes: >-
      Firestorm (Fig. 10). The bits are not shifted before the XOR: offset bit i stops affecting the history at
      H = 100 - i (Fig. 19). Offset bit 2 does not follow the pattern.
  - id: c-tm-pc-shift-xor
    text: Taken conditional branches XOR their PC bits into the history register after shifting it by one bit
    loc: p020
    quote: "BHR update policy of taken conditional branch PC address bits is shift-and-XOR with a shift value of 1."
    method: branch-sweep
    derivation: measured
    supports: [dirpred.history_update]
    notes: >-
      Table 3 lists conditional PC bits 2-4 and 6-24 as following this policy, unshifted. PC bit i stops
      affecting the history at H = 100 - (i - 2) (Fig. 21). Firestorm.
  - id: c-tm-target-shift-xor
    text: Indirect branches XOR their target bits into the history register after shifting it by one bit
    loc: p021
    quote: "BHR update policy of indirect branch target address bits is shift-and-XOR with a shift value of 1."
    method: branch-sweep
    derivation: measured
    supports: [dirpred.history_update]
    notes: >-
      Table 3 lists target bits 2-20 as following this policy, unshifted. Target bit i stops affecting the
      history at H = 100 - (i - 2) (Fig. 24). Firestorm.
  - id: c-tm-ind-pc-position
    text: >-
      An indirect branch's PC bit i stops affecting the history register at distance H = 100 - (72 - (i - 2)),
      much sooner than conditional-branch PC or indirect target bits, which last about 100 branches
    loc: p021
    quote: "Effect of indirect branch PC address bit i on the BHR is lost at distance H = 100 − (72 − (i − 2)) from the spy branch"
    method: branch-sweep
    derivation: measured
    supports: []
    notes: Firestorm (Fig. 22, which shows bit 2 at H = 27 and H = 28).
  - id: c-tm-not-taken-updates
    text: A not-taken conditional branch, though it does not shift the history register, still changes it in some undetermined way
    loc: p013
    quote: "The results of the experiment (Figure 13) confirm that a non-taken conditional branch does update the BHR in some undetermined manner."
    method: branch-sweep
    derivation: measured
    supports: [dirpred.history_update]
    notes: Firestorm (Fig. 13); test uses 100 taken conditional branches spaced 2^32 or more bytes apart so only the switch branch's outcome differs.

  - id: c-tm-no-user-kernel-isolation
    text: >-
      Firestorm does not isolate conditional-predictor state between user space and kernel: a user process can
      mistrain a kernel branch, and did so to exploit a Spectre v1 gadget in a kext
    loc: p014
    quote: "userspace/kernel isolation appears to exist on the Icestorm microarchitecture, but it does not exist on Firestorm ... we also successfully use userspace out-of-space mistraining on a Firestorm core to exploit an in-kext Spectre v1 gadget"
    method: branch-sweep
    derivation: measured
    supports: []
    notes: >-
      Victim branch in a kext reached by sysctl; the attacker trains a user-space shadow of its branch slide
      matching the kernel addresses in the low 32 bits. Victim misprediction rate 25 % on Firestorm (Fig. 14).
  - id: c-tm-ice-user-kernel-isolation
    text: Icestorm appears to isolate conditional-predictor state between user space and kernel
    loc: p014
    quote: "Figure 14 shows the results, indicating that userspace/kernel isolation appears to exist on the Icestorm microarchitecture"
    method: branch-sweep
    derivation: measured
    hedge: "appears to exist"
    supports: []
    chip: icestorm
    notes: Footnote 6 says a different mistraining technique might still succeed.
  - id: c-tm-no-cross-process-isolation
    text: >-
      Firestorm does not isolate conditional-predictor state between processes: a process mistrained a branch in
      another process and exploited a Spectre v1 gadget there
    loc: p015
    quote: "Figure 15 shows the results, which indicate that cross-BPU isolation does not exist. We further validate these results by successfully using cross-process out-of-space mistraining to exploit a Spectre v1 gadget in another process"
    method: branch-sweep
    derivation: measured
    supports: []
    notes: Both processes bound to the same core, with an identical branch slide mapped at the same address (Fig. 15).
  - id: c-tm-ice-no-cross-process-isolation
    text: Icestorm does not isolate conditional-predictor state between processes
    loc: p003
    quote: "We also find that no cross-process BPU isolation exists on either microarchitecture."
    method: branch-sweep
    derivation: measured
    supports: []
    chip: icestorm
    notes: Fig. 15.
  - id: c-tm-patent-security-tag
    text: >-
      Per the authors' reading of Apple's indirect-predictor security patent, BTB entries carry a security tag of
      the context that made them (exception level against cross-privilege training, a process identifier
      against cross-process training) and mismatched entries are ignored
    loc: p014
    quote: "Apple’s mechanism thus dynamically isolates BTB entries of different security contexts. ... Cross-privilege attacks (e.g., process vs. OS) are blocked by storing the privilege level (EL). ... blocked by storing a process identifier."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      Patent US 11,321,095 B2, same title as us20200192673a1. Not tested on the M1; the paper notes Apple has no
      matching patent for the conditional predictor.

  - id: c-dimva-inplace-pht
    source: dimva22-branch-different
    text: >-
      Nine in-bounds calls train a bounds-check branch enough that the tenth, out-of-bounds call is mispredicted,
      giving a working in-place Spectre-PHT attack on the M1
    loc: p011
    quote: "We call the gadget with an in-bound value 9 times to bias the prediction to predict that the provided index is always in bounds. ... In the 10th call to the gadget, we provide an out-of-bounds index"
    derivation: measured
    value: 9
    unit: training calls
    supports: []
    notes: >-
      M1 Mac mini, macOS 11.2.1; core type not stated. Each value is leaked 4 times to cover imperfect
      misprediction. Leakage 1109 B/s at 13.66 % error on the M1 (Table 3).
  - id: c-dimva-spectre-btb
    source: dimva22-branch-different
    text: An in-place, same-address-space Spectre-BTB attack, mistraining an indirect branch's target, works on the M1
    loc: p002
    quote: "we show a Spectre-PHT and Spectre-BTB implementation on two iPhones and an M1 Mac mini"
    derivation: measured
    supports: []
    notes: >-
      The authors say no hardware or software mitigation exists for their same-address-space, in-place
      Spectre-BTB. Core type not stated.
  - id: c-dimva-csdb
    source: dimva22-branch-different
    text: On the M1, a CSDB barrier after the bounds check stops Spectre-PHT leakage
    loc: p017
    quote: "the M1 Mac mini, CSDB is available and stops the leakage in our proof of concept"
    derivation: measured
    supports: []
    notes: On the A10 and A11 iPhones CSDB has no effect. Core type not stated.
  - id: c-dimva-isb
    source: dimva22-branch-different
    text: An ISB barrier prevents Spectre-PHT exploitation on the M1
    loc: p017
    quote: "The ISB instruction prevents exploitation on both iPhones and the M1 Mac mini."
    derivation: measured
    supports: []
  - id: c-dimva-dmb-dsb
    source: dimva22-branch-different
    text: DMB or DSB on its own does not stop speculative execution past the mispredicted bounds check
    loc: p017
    quote: "Data Memory Barriers (DMB) or DSB alone do not stop speculative execution."
    derivation: measured
    supports: []
    notes: Stated for the tested devices (A10, A11, M1) together.

new_params:
  dirpred.counter_bits:   {block: dirpred, name: Prediction counter width, unit: bits}
  dirpred.history_update: {block: dirpred, name: History register update rule, mechanism: path_history_shift_xor}
  dirpred.history_inputs: {block: dirpred, name: Branch bits folded into history, mechanism: path_history_shift_xor}

new_mechanisms:
  path_history_shift_xor:
    name: Path history register (shift-and-XOR)
    status: measured
    description: The 100-bit history shifts and XORs in branch address bits, not outcomes.
    params: [dirpred.history, dirpred.history_update, dirpred.history_inputs]
    sim_switch: null
    detection_rule: >-
      two paths that differ in one bit of one earlier branch's PC or target give a spy branch with opposite
      outcomes ~0 % mispredicts while the bit is in the history and ~25 % (3-bit counters) once it has aged out
  bpu_isolation:
    name: Branch predictor context isolation
    status: absent
    description: The conditional predictor keeps no privilege or process tag.
    params: []
    sim_switch: null
    detection_rule: >-
      out-of-place mistraining of a victim branch from another privilege level or process, with matching
      low-32-bit addresses and history, gives the victim ~25 % mispredicts when entries are shared and ~0 % when
      they are isolated

mechanism_claims:
  path_history_shift_xor: [c-tm-history-inputs, c-tm-high-bits-ignored, c-tm-history-100, c-tm-bhr-width,
                           c-tm-history-update, c-tm-imm-shift-xor, c-tm-pc-shift-xor, c-tm-target-shift-xor,
                           c-tm-ind-pc-position, c-tm-not-taken-updates, c-tm-lpc-pc-bit2]
  bpu_isolation: [c-tm-no-user-kernel-isolation, c-tm-no-cross-process-isolation, c-tm-ice-user-kernel-isolation,
                  c-tm-ice-no-cross-process-isolation, c-tm-patent-security-tag,
                  c-pat-us20200192673a1-context-encrypted-targets]
