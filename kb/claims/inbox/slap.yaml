# slap.yaml
# Jason Kim, Daniel Genkin and Yuval Yarom, 2025
# Load address prediction tested on the M1 (absent) and reverse engineered on the M2 and M3.
session: slap
source: sp25-slap

claims:
  - id: c-slap-m1-no-lap
    text: >-
      On the M1, a chain of dependent loads runs no faster when its addresses stride than when they are
      random, so the M1 has no load address prediction
    loc: p002
    quote: "On the M1 CPU, we observe no difference in runtime whether the load addresses increment in strides or not."
    method: pointer-chase
    derivation: measured
    value: false
    supports: [lsu.address_prediction]
    notes: >-
      10 to 1,000 dependent loads at a 32 B stride, cycle counts on macOS, median of 100 runs. A WebAssembly rerun on
      an M1 MacBook Pro also found none. Confirms c-mh-v1-no-addr-prediction and c-mh-v2-no-address-prediction.
  - id: c-slap-a14-no-lap
    text: The A14, which uses the Firestorm core, shows no load address prediction, and neither does the A13
    loc: p005
    quote: "A13 Bionic A14 Bionic A15 Bionic A15 Bionic A16 Bionic A17 Pro M4 ✗ ✗ ✓ ✗ ✓ ✓ ✓"
    method: pointer-chase
    derivation: measured
    value: false
    supports: []
    chip: a14
    notes: >-
      A14 in an iPhone 12 (A2172), A13 in an iPhone 11. WebAssembly in Safari with a 1 ms timer, one million
      dependent loads at a 32 B stride.
  - id: c-slap-m1-no-data-spec
    text: >-
      On both M1 core types dependent-load latency grows linearly whatever the load addresses or values, and the
      authors conclude the cores have no load data speculation, value prediction included
    loc: p004
    quote: "a consistent linear increase in latency, which does not differ based on the load addresses or values. ... Thus, we conclude these cores lack load data speculation mechanisms."
    method: pointer-chase
    derivation: inferred
    value: false
    supports: [lsu.value_prediction]
    notes: >-
      The test used striding addresses and striding values only. FLOP found that the M3's value predictor trains
      only on constant values.
  - id: c-slap-ice-no-lap
    text: Icestorm, like Firestorm, shows no speedup for striding dependent loads, so it has no load address prediction
    loc: p004
    quote: "On both core types of the M1 (top left and bottom left), we observe"
    method: pointer-chase
    derivation: measured
    value: false
    supports: []
    chip: icestorm
    notes: The sentence continues with a linear latency increase that does not depend on load addresses or values.
  - id: c-slap-l1d-128
    text: The P-core L1 data cache of the M-series is 128 KiB
    loc: p004
    quote: "The L1 data cache size of the M-series CPUs is 128 KiB for the P-cores and 64 KiB for the E-cores"
    method: secondhand
    derivation: reported
    value: 128
    unit: KiB
    supports: [l1d.size]
    notes: Cites Apple's CPU optimization guide.
  - id: c-slap-ice-l1d-64
    text: The E-core L1 data cache of the M-series is 64 KiB
    loc: p004
    quote: "The L1 data cache size of the M-series CPUs is 128 KiB for the P-cores and 64 KiB for the E-cores"
    method: secondhand
    derivation: reported
    value: 64
    unit: KiB
    supports: []
    chip: icestorm
    notes: Cites Apple's CPU optimization guide.
  - id: c-slap-l1-line-64
    text: The L1 cache line on Apple CPUs is 64 bytes
    loc: p007
    quote: "has a magnitude below 64 bytes. Coincidentally, this is the size of an L1 cache line on Apple CPUs"
    method: secondhand
    derivation: reported
    value: 64
    unit: B
    supports: [l1d.line]
    notes: Stated without a source, as true of Apple CPUs in general.
  - id: c-slap-page-16k
    text: The page size on Apple CPUs is 16 KiB
    loc: p016
    quote: "The page size on Apple CPUs is 16 KiB."
    method: secondhand
    derivation: reported
    value: 16
    unit: KiB
    supports: [dtlb.page_size]
    notes: Stated without a source.
  - id: c-slap-mul-3
    text: Citing Apple's optimization guide, the authors take each MUL to cost 3 cycles
    loc: p008
    quote: "With Apple documentation stating that each mul requires 3 cycles [5, Appendix A]"
    method: secondhand
    derivation: reported
    value: 3
    unit: cycles
    supports: []
    notes: Used to turn MUL counts into training and speculation windows in cycles.
  - id: c-slap-m1-hid11-dmp
    text: Bit 30 of HID11_EL1 disables the data memory-dependent prefetcher on the M1 and M2
    loc: p013
    quote: "bit 30 of the HID11_EL1 system register, which has been shown to disable the DMP on the M1 and M2 CPUs [18, 41]"
    method: secondhand
    derivation: reported
    supports: []
    notes: Cites GoFetch and a post by Hector Martin. The paper adds that the bit can be set only under Linux.
  - id: c-slap-dmp-vs-lap
    text: >-
      The data memory-dependent prefetcher found on Apple CPUs dereferences pointer-like loaded data only as a
      prefetch and does not let younger instructions run past a dependent load
    loc: p009
    quote: "Unlike the LAP, the DMP does not speculate past RAW dependencies, since it is a hardware prefetcher."
    derivation: inferred
    supports: []
    notes: The prefetcher itself is from Augury (M1) and GoFetch.

  - id: c-slap-lap-chips
    text: >-
      Load address prediction is present on Apple's M2, M3 and M4 and on the A15 to A17 P cores
    loc: p001
    quote: "we show that the LAP is present on Apple’s M2-M4 CPUs for Macs and iPads, and the closely related A15-A17 CPUs for iPhones"
    method: pointer-chase
    derivation: measured
    value: true
    supports: []
    chip: m2
    notes: Absent on the M1, A13 and A14 (c-slap-m1-no-lap, c-slap-a14-no-lap). One A15 device lacked it (c-slap-a15-stepping).
  - id: c-slap-m2-lap
    text: On the M2 P cores, a chain of dependent striding loads speeds up sharply after about 120 loads
    loc: p004
    quote: "the latency for the Striding experiment diverges around 120 iterations, where we observe a notable speedup"
    method: pointer-chase
    derivation: measured
    value: 120
    unit: loads
    approx: true
    supports: []
    chip: m2
    notes: Random-order chains keep a linear latency, as on the M1. Relayed by Handley in c-mh-v8-m2-lap-train.
  - id: c-slap-m3-lap-320
    text: The M3 P cores need about 320 striding loads before the dependent chain speeds up, against 120 on the M2
    loc: p004
    quote: "whereas 120 striding loads suffice to activate the prediction mechanism on the M2, we observe this threshold is higher on the M3 where the speedup occurs at 320 iterations"
    method: pointer-chase
    derivation: measured
    value: 320
    unit: loads
    supports: []
    chip: m3
  - id: c-slap-ecores-no-lap
    text: The E cores of the M2 and M3 have no load address prediction
    loc: p013
    quote: "in Section 4.1, we observed that E-cores on the M2 and M3 CPUs do not have the LAP"
    method: pointer-chase
    derivation: measured
    value: false
    supports: []
    chip: m2
    notes: M2 and M3 E cores.
  - id: c-slap-sa-rv
    text: >-
      With random load values but striding addresses, the dependent chain beats the random chain from about 500
      loads on the M2 and M3, so the predictor predicts addresses, not values
    loc: p005
    quote: "At 500 iterations and beyond, though, the SA+RV latency sharply drops below that of Random and stays below."
    method: pointer-chase
    derivation: measured
    value: 500
    unit: loads
    supports: []
    chip: m2
    notes: M2 and M3 P cores, 32 B stride.
  - id: c-slap-a15-stepping
    text: The A15 in an iPhone 13 mini has load address prediction while the A15 in an iPhone 13 does not
    loc: p005
    quote: "However, we observe contrasting results on two devices that were released simultaneously (iPhone 13 Mini and iPhone 13) and have the same A15 Bionic CPU."
    method: pointer-chase
    derivation: measured
    supports: []
    chip: a15
    notes: The authors compare this to stepping differences on Intel and AMD CPUs.
  - id: c-slap-m2-misspec
    text: >-
      After 500 striding training loads at a 32 B stride, the M2 speculatively used data from the mispredicted
      address in 721 of 1,000 runs
    loc: p007
    quote: "we receive the dummy value on all 1,000 runs and the secret value on 721 runs"
    method: other
    derivation: measured
    value: 721
    unit: of 1000 runs
    supports: []
    chip: m2
    notes: >-
      Linked-list gadget with the last node flushed, Flush+Reload channel, Asahi Linux on an isolated M2 P core at
      maximum frequency.
  - id: c-slap-m2-min-train
    text: The M2 load address predictor never fires with fewer than 80 striding training loads
    loc: p007
    quote: "The first is to the left side of the heatmap, when the training length is less than 80."
    method: other
    derivation: measured
    value: 80
    unit: loads
    supports: []
    chip: m2
    notes: Training lengths 20 to 1,000 and strides -320 to 320 B, 1,000 runs each.
  - id: c-slap-m2-stride-255
    text: The M2 load address predictor handles positive and negative strides up to 255 bytes and none of 256 or more
    loc: p007
    quote: "the second and third dead zones are at the top and bottom of the plot, where the absolute value of the stride is 256 bytes and above"
    method: stride-sweep
    derivation: measured
    value: 255
    unit: B
    supports: []
    chip: m2
    notes: Relayed by Handley in c-mh-v8-lap-stride.
  - id: c-slap-m2-stride-bits
    text: The authors conjecture the predictor stores a stride as one sign bit and eight magnitude bits
    loc: p007
    quote: "conjecture that its internal state for the stride is one sign bit with eight (log2 256) magnitude bits"
    derivation: inferred
    value: 9
    unit: bits
    hedge: "conjecture"
    supports: []
    chip: m2
  - id: c-slap-m2-train-500
    text: On the M2 the predictor fires regularly once training exceeds about 500 striding loads, for strides under 256 B
    loc: p007
    quote: "We note a sharp increase in activations across most strides with magnitude less than 256 bytes when the training length exceeds 500."
    method: stride-sweep
    derivation: measured
    value: 500
    unit: loads
    supports: []
    chip: m2
  - id: c-slap-m2-small-stride
    text: >-
      The M2 predictor fires most often for strides under 64 B; the authors conjecture that strides touching a
      line more than once in training help
    loc: p007
    quote: "of frequent activations when the stride has a magnitude below 64 bytes"
    method: stride-sweep
    derivation: measured
    value: 64
    unit: B
    hedge: "we conjecture that"
    supports: []
    chip: m2
  - id: c-slap-m2-page
    text: The M2 predictor keeps training across page boundaries but never predicts an address on a new page
    loc: p008
    quote: "We also demonstrate that the LAP on the M2 maintains training state across page boundaries, but will not generate a prediction on a new page."
    method: other
    derivation: measured
    supports: []
    chip: m2
    notes: >-
      128 B stride with 16 KiB pages: 119 activations per 1,000 when training spans one page, 246 across two,
      none when the predicted address falls on a new page.

new_mechanisms:
  load_address_prediction:
    name: Load address prediction
    status: absent
    description: A PC-tagged predictor loads from a strided address before the real address is known; absent on M1, present from M2/A15.
    params: [lsu.address_prediction]
    sim_switch: null
    detection_rule: >-
      a chain of dependent loads whose addresses stride by 32 B keeps the per-load latency of a random-order chain;
      with the predictor it speeds up after about 120 to 500 loads

mechanism_claims:
  load_address_prediction: [c-slap-m1-no-lap, c-slap-a14-no-lap, c-slap-ice-no-lap, c-slap-lap-chips, c-slap-m2-lap, c-slap-m3-lap-320, c-slap-ecores-no-lap, c-slap-sa-rv, c-slap-a15-stepping, c-slap-m2-misspec, c-slap-m2-min-train, c-slap-m2-stride-255, c-slap-m2-stride-bits, c-slap-m2-train-500, c-slap-m2-small-stride, c-slap-m2-page]
  load_value_prediction: [c-slap-m1-no-data-spec]
  content_directed_prefetch: [c-slap-m1-hid11-dmp, c-slap-dmp-vs-lap]
