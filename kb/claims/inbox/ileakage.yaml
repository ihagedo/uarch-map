# ileakage.yaml
# Jason Kim, Stephan van Schaik, Daniel Genkin and Yuval Yarom, 2023
# Cache organization, L2 inclusion, speculation depth and timer facts for M1 and other Apple chips, from the iLeakage attack paper.
session: ileakage
source: ccs23-ileakage

claims:
  - id: c-ilk-l1i-ways
    text: Timing loops over chains of branches at congruent addresses find a 6-way L1I on the M1 P-cores
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: measured
    value: 6
    unit: ways
    supports: []
    contradicts: [l1i.assoc]
    notes: >-
      M1 (P) row, Mac Mini; M1 Pro, M1 Max, A14 and M2 P-cores also show 6 ways. Disagrees with the 12 ways of
      c-mh-v8-l1i-12way; the registers read by PACMAN say 6 (c-pac-l1i-ways).
  - id: c-ilk-l1i-size
    text: The M1 P-core L1I is 192 KiB in 512 sets, the size taken as the ways times the largest stride that avoids self-eviction
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: derived
    value: 192
    unit: KiB
    supports: [l1i.size]
    notes: M1 (P) row, Mac Mini; sets follow from size, line and ways.
  - id: c-ilk-l1i-line
    text: The M1 P-core L1I line is 64 bytes
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: measured
    value: 64
    unit: B
    supports: [l1i.line]
    notes: >-
      M1 (P) row, Mac Mini. The line is the smallest offset that, applied to half of an over-full congruent set, brings
      a speedup.
  - id: c-ilk-l1d-ways
    text: Timing loops over congruent addresses find an 8-way L1D on the M1 P-cores
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: measured
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: M1 (P) row, Mac Mini; M1 Pro, M1 Max, A14 and M2 P-cores also show 8 ways.
  - id: c-ilk-l1d-size
    text: The M1 P-core L1D is 128 KiB in 256 sets
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: derived
    value: 128
    unit: KiB
    supports: [l1d.size]
    notes: M1 (P) row, Mac Mini; size is ways times the largest stride that avoids self-eviction.
  - id: c-ilk-l1d-line
    text: The M1 P-core L1D line is 64 bytes
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: measured
    value: 64
    unit: B
    supports: [l1d.line]
    notes: M1 (P) row, Mac Mini.
  - id: c-ilk-l2-ways
    text: A minimal eviction set for the M1 P-cluster L2 holds 12 lines, giving 12 ways and 8192 sets
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: other
    derivation: measured
    value: 12
    unit: ways
    supports: [l2.assoc]
    notes: >-
      M1 (P) row, Mac Mini; M1 Pro and M1 Max give the same. Sets follow from the sysctl size and line. The eviction
      sets are found by group testing with a timer or the timerless gadget.
  - id: c-ilk-l2-size
    text: The M1 P-cluster L2 is 12 MiB as reported by sysctl
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: other
    derivation: documented
    value: 12
    unit: MiB
    supports: [l2.size]
    notes: M1 (P) row, Mac Mini; the L2 size and line come from the macOS and iOS sysctl interface.
  - id: c-ilk-l2-line
    text: The M1 P-cluster L2 line is 128 bytes as reported by sysctl, twice the 64 B L1 line
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: other
    derivation: documented
    value: 128
    unit: B
    supports: [l2.line]
    notes: M1 (P) row, Mac Mini. Every chip in the table shows 128 B L2 lines.
  - id: c-ilk-l2-phys-indexed
    text: The L2 is physically indexed, so its sets cannot be found from virtual addresses and need eviction sets
    loc: p005
    quote: "as the L2 cache is physically indexed and we therefore cannot retrieve"
    derivation: reported
    supports: []
    notes: Stated as background, without a test.
  - id: c-ilk-ice-l1i
    text: The M1 E-core L1I is 128 KiB, 8 ways of 256 sets with 64 B lines
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: derived
    value: 128
    unit: KiB
    chip: icestorm
    supports: []
    notes: M1 (E) row; agrees with the register read in c-pac-ice-l1i.
  - id: c-ilk-ice-l1d
    text: The M1 E-core L1D is 64 KiB, 8 ways of 128 sets with 64 B lines
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: derived
    value: 64
    unit: KiB
    chip: icestorm
    supports: []
    notes: M1 (E) row.
  - id: c-ilk-ice-l2
    text: The M1 E-cluster L2 is 4 MiB, 16 ways of 2048 sets with 128 B lines
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: other
    derivation: documented
    value: 4
    unit: MiB
    chip: icestorm
    supports: []
    notes: M1 (E) row; size from sysctl, ways from eviction sets. The M1 Pro and M1 Max E-cluster rows give the same, marked unconfirmed.
  - id: c-ilk-a14-l2
    text: The A14 P-cluster L2 is 8 MiB, 16 ways of 4096 sets with 128 B lines
    loc: p006
    quote: "iPhone 12 (iPhone13,2) A2172 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: other
    derivation: documented
    value: 8
    unit: MiB
    chip: a14
    supports: []
    notes: A14 Bionic (P) row, iPhone 12; size from sysctl, ways from eviction sets. Its P-core L1I and L1D rows match the M1 P-core.
  - id: c-ilk-m2-l2
    text: The M2 P-cluster L2 is 16 MiB, 16 ways of 8192 sets with 128 B lines
    loc: p006
    quote: "MacBook Air (M2, 2022) (Mac14,2) A2681 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: other
    derivation: documented
    value: 16
    unit: MiB
    chip: m2
    supports: []
    notes: M2 (P) row; size from sysctl, ways from eviction sets. Its P-core L1I and L1D rows match the M1 P-core.
  - id: c-ilk-a15-l2
    text: The A15 P-cluster L2 is 12 MiB with 128 B lines, and most likely 12 ways of 8192 sets
    loc: p006
    quote: "iPhone 13 mini (iPhone14,4) A2481 ... we could not confirm the results, but these are the most likely based on other Apple CPUs with similar cache organization"
    method: other
    derivation: documented
    value: 12
    unit: MiB
    hedge: "most likely"
    chip: a15
    supports: []
    notes: A15 Bionic (P) row; the size is from sysctl, while the ways and sets are starred as unconfirmed guesses.

  - id: c-ilk-spec-mul-100
    text: >-
      With a branch condition evicted from the caches, M-series P-cores execute about 100 dependent multiplies under
      speculation before a following probe load is no longer reached
    loc: p005
    quote: "we see that Apple’s M series CPUs can execute about 100 mul instructions under speculation"
    method: other
    derivation: measured
    value: 100
    unit: instructions
    approx: true
    supports: []
    notes: >-
      Stated for the M series as a whole (M1 and M2 alike); Figure 2 plots each chip with the condition evicted from
      L1 or from L2. 1000 trials per mul count, timed with the privileged cycle counter.
  - id: c-ilk-spec-300
    text: Taking 3 cycles per multiply, the authors put the speculation window on recent Apple cores at up to about 300 cycles
    loc: p002
    quote: "modern Apple hardware has deep pipelines, with speculation windows running as long as 300 cycles"
    derivation: derived
    value: 300
    unit: cycles
    approx: true
    supports: []
    notes: >-
      100 multiplies (c-ilk-spec-mul-100) at Johnson's 3-cycle mul latency; the method section words the same product
      as about 300 instructions.

  - id: c-ilk-l2-inclusive
    text: >-
      Traversing an L2 eviction set on one core evicts the victim's line from another core's L1, so the M1 P-cluster L2
      is inclusive of the L1s
    loc: p008
    quote: "Indeed, we find that the L2 cache of the Apple M1 is inclusive of the L1 caches."
    method: other
    derivation: measured
    value: inclusive
    hedge: "strongly indicate"
    supports: []
    contradicts: [l2.inclusion]
    notes: >-
      Cross-core test with a control set that leaves the victim alone. Disagrees with the non-inclusive,
      non-exclusive readings of c-mh-v3-l2-covering-tags-hint and c-mh-v3-dram-fill-l1-only.
  - id: c-ilk-l2-half-line
    text: >-
      Touching only one 64 B half of each 128 B L2 line in the eviction set evicts the victim's L1 copy only now and
      then; touching both halves roughly triples the eviction rate
    loc: p008
    quote: "while accessing half of an L2 cache line occasionally results in evictions, accessing both halves approximately triples the success rate"
    method: other
    derivation: measured
    value: 3
    unit: x
    approx: true
    supports: []
  - id: c-ilk-l2-three-passes
    text: One or two traversals of an L2 eviction set do not always evict the victim, while three always do
    loc: p008
    quote: "accessing the eviction set more often results in higher eviction rates, with 3 access iterations guaranteeing eviction"
    method: other
    derivation: measured
    value: 3
    unit: traversals
    supports: []
    notes: The set is shuffled before each traversal, and a spinlock hands control between attacker and victim threads.

  - id: c-ilk-timer-42ns
    text: Unprivileged code on Apple systems gets only mach_absolute_time(), a 24 MHz (42 ns) timer
    loc: p003
    quote: "unprivileged code can only access the timer provided by mach_absolute_time(), which PACMAN reported to have a resolution of 24 MHz [64], or 42 ns"
    method: secondhand
    derivation: reported
    value: 42
    unit: ns
    supports: []
    notes: Repeats PACMAN's system counter frequency (c-pac-cntpct-24mhz).
  - id: c-ilk-kperf-cycles
    text: Privileged native code on macOS and iOS can read a cycle-accurate counter through the kperf API
    loc: p003
    quote: "Both macOS and iOS allow privileged native code to read a cycle-accurate timer which is accessible via the kperf API"
    method: secondhand
    derivation: reported
    supports: []
  - id: c-ilk-l1d-plru
    text: Apple L1D caches use a pseudo-LRU replacement policy, which earlier work turned into a stable covert channel
    loc: p004
    quote: "abuses the pseudo least recently used (pLRU) eviction strategy of L1-D caches to construct a particularly stable covert channel on Intel and Apple CPUs"
    method: secondhand
    derivation: reported
    value: pLRU
    supports: [l1d.replacement]
    notes: From Google's Leaky.page work; iLeakage's own M1 results rest on this channel.
  - id: c-ilk-no-meltdown
    text: Unlike early Apple cores, recent ones show no sign of Meltdown-style reads across address spaces
    loc: p013
    quote: "While early versions of Apple hardware were susceptible to Meltdown [4], there is no indication of such vulnerabilities in newer Apple CPUs."
    derivation: inferred
    hedge: "there is no indication"
    supports: []

mechanism_claims:
  l2_physical_index: [c-ilk-l2-phys-indexed]
  l2_half_lines: [c-ilk-l2-half-line]
  l2_core_lru: [c-ilk-l2-three-passes]
  spec_fault_no_access: [c-ilk-no-meltdown]
