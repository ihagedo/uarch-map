  - id: c-ilk-l2-ways
    text: A minimal eviction set for the M1 P-cluster L2 holds 12 lines, giving 12 ways and 8192 sets
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: other
    derivation: measured
    value: 12
    unit: ways
    supports: [l2.assoc]
    notes: >-
      M1 (P) row, Mac Mini; M1 Pro and M1 Max give the same. Sets follow from the sysctl size and line. The eviction
      sets are found by group testing with a timer or the timerless gadget.
