# ileakage.yaml
# Jason Kim, Stephan van Schaik, Daniel Genkin and Yuval Yarom, 2023
# Cache organization, L2 inclusion, speculation depth and timer facts for M1 and other Apple chips, from the iLeakage attack paper.
session: ileakage
source: ccs23-ileakage

claims:
  - id: c-ilk-l1i-ways
    text: Timing loops over chains of branches at congruent addresses find a 6-way L1I on the M1 P-cores
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: measured
    value: 6
    unit: ways
    supports: []
    contradicts: [l1i.assoc]
    notes: >-
      M1 (P) row, Mac Mini; M1 Pro, M1 Max, A14 and M2 P-cores also show 6 ways. Disagrees with the 12 ways of
      c-mh-v8-l1i-12way; the registers read by PACMAN say 6 (c-pac-l1i-ways).
  - id: c-ilk-l1i-size
    text: The M1 P-core L1I is 192 KiB in 512 sets, the size taken as the ways times the largest stride that avoids self-eviction
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: derived
    value: 192
    unit: KiB
    supports: [l1i.size]
    notes: M1 (P) row, Mac Mini; sets follow from size, line and ways.
  - id: c-ilk-l1i-line
    text: The M1 P-core L1I line is 64 bytes
    loc: p006
    quote: "Mac Mini (M1, 2020) (Macmini9,1) A2348 ... Table 1: The cache organization of various Apple CPUs. W: Ways, S: Sets, CL: Cache Line size."
    method: stride-sweep
    derivation: measured
    value: 64
    unit: B
    supports: [l1i.line]
    notes: >-
      M1 (P) row, Mac Mini. The line is the smallest offset that, applied to half of an over-full congruent set, brings
      a speedup.
