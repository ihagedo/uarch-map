# handley-vol3-core.yaml
# Maynard Handley, 2025
# The P-cluster around the cores: L2, snoops and coherence (AArch64-Explore vol 3).
session: handley-vol3-core
source: handley-vol3

claims:
  - id: c-mh-v3-barrier-colors
    text: >-
      Per a 2012 Apple patent, barriers tag memory requests with a color that changes at each barrier, and no request
      of a later color completes until every request of the earlier color has
    loc: p008
    quote: "mark requests as they come in via some tag that changes when a barrier is encountered ... not allow any request with a tag later than N to complete until all requests tagged as N are complete"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9582276B2 (2012), speculative and architectural color values.
  - id: c-mh-v3-barrier-l1-l2
    text: >-
      Apple appears to enforce barrier ordering between the L1 and the L2, so the L2 and beyond see the correct order
      while accesses between the LSU and the L1 stay free to reorder
    loc: p008
    quote: "what Apple appear to do is implement the barrier between the L1 and L2, ensuring that the outside world (ie L2 and beyond) see correct ordering"
    method: patent-reading
    derivation: inferred
    hedge: "appear to"
    supports: []
    notes: Handley assumes this orders the cache's MESI state changes and snoop responses.
  - id: c-mh-v3-pio-strands
    text: >-
      Per a 2009 patent, a PIO controller labels buffered PIO writes so writes to one peripheral stay in order while
      writes to different peripherals interleave
    loc: p009
    quote: "a PIO controller, and a labelling of PIO transactions, that allows for reordering between strands but not within strands"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US8032673B2 (2009). Handley reads the patent's source ID as a destination ID.
  - id: c-mh-v3-dsb-excluded-region
    text: >-
      Per a 2020 patent, system registers can mark an address region as IO-like, and a DSB flag selects a strong form
      that orders all loads and stores or a mild form that need not wait for IO accesses
    loc: p010
    quote: "one or more system registers that allow defining a region of space as IO-like ... to distinguish between a “strong” DSB"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20220083338A1 (2020). With the mild form a core can acknowledge a remote DSB before its slow IO accesses
      complete.
  - id: c-mh-v3-remote-dsb
    text: >-
      A DSB that involves other cores reaches them as an interrupt; each appears to discard its front end, drain its
      back end and all cache transactions, then acknowledge and resume fetch
    loc: p011
    quote: "the current solution appears to be essentially to throw away everything in the front-end, wait for all instructions in the back end to complete"
    method: patent-reading
    derivation: inferred
    hedge: "appears to be"
    supports: []
    notes: >-
      Local barriers can use the color scheme; DSBs sent to other cores have no such shortcut. Flushing the front end
      also covers fetched instructions from a page that just became non-executable.
  - id: c-mh-v3-fused-stxr-barrier
    text: >-
      Per a 2010 patent, a store-exclusive and the barrier after it are fused into one operation that needs only one
      trip out to the point of coherency
    loc: p011
    quote: "The solution is to fuse them together to create a single op (understood by the caches and the fabric) that only requires one such expensive outward trip."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20110208915A1 (2010); Handley calls the details doubtless obsolete. The fusion happens in the LSU when no load
      or store lies between the two.
  - id: c-mh-v3-load-poison
    text: >-
      Per a 2013 patent, each load carries a poison bit that is set if its cache line is modified before the load
      becomes non-speculative, and the load then recovers by replay or flush
    loc: p013
    quote: 'Every load has associated with it a "poison bit", and if the cache line from which the load was read is modified before the load becomes non-speculative, then the poison bit is set'
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US9383995B2 (2013), extended to non-cacheable loads by US10747535B1 (2016). It keeps an older load from seeing
      newer data than a younger load to the same address.
  - id: c-mh-v3-wfe-poison
    text: >-
      Per a 2014 patent, loads after a WFE may execute before the core wakes; on waking the LSU checks for poisoned
      loads, so part of the LSU must stay awake to match snooped Modified lines against the load queue
    loc: p013
    quote: "after we wake up frome the WEV, we check the LSU to see if any loads have poison bits associated with them, and Recover appropriately"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9501284B2 (2014). Handley writes WEV for the wait-for-event instruction.
  - id: c-mh-v3-lsq-cam-filter
    text: >-
      Per a 2019 patent, the load/store queue keeps one bit for whether any entry is poisoned, and summary values such
      as the oldest valid load age, so most searches of the queue can be skipped
    loc: p014
    quote: "the LSQ tracks a single bit as to whether any entry in the queue is poisoned, and behaves differently in these two cases"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20200264888A1 (2019), CAM filtering based on microarchitectural state.
  - id: c-mh-v3-l2-dup-tags
    text: >-
      Per a 2010 patent, the L2 holds duplicate tags for the L1s of its cores behind a coherence point on the fabric,
      where the 2006 design routed every snoop from one core straight to the L2 and the other core
    loc: p015
    quote: "we now have a Coherence Point on the fabric ... Now the L2 holds duplicate tags for the L1’s of the various cores attached to it"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9317102B2 (2010), compared with US7752474B2 (2006).
  - id: c-mh-v3-l2-snoop-filter
    text: >-
      With its duplicate L1 tags the L2 filters out most snoops as irrelevant to the other cores, which saves energy
      and may let the L1 handle its now rare snoops on a slower path
    loc: p015
    quote: "a snoop from one core can be handled by the L2 (which can filter out most snoops as being irrelevant to any other core, and so can discard them)"
    method: patent-reading
    derivation: inferred
    hedge: "maybe even allows"
    supports: []
  - id: c-mh-v3-l1-line-counters
    text: >-
      Per the 2010 patent, the L1 counts its valid and modified lines, presumably to decide how soon the cache can be
      put to sleep
    loc: p015
    quote: "the L1 now has various counters of things like how many valid blocks and how many modified blocks it contains"
    method: patent-reading
    derivation: inferred
    hedge: "presumably"
    supports: []
  - id: c-mh-v3-l1-flush-walk
    text: >-
      Flushing the L1 in the 2006 and 2010 designs walks every way of every set, presumably one per cycle, and can stop
      early only once the modified-line count reaches zero
    loc: p015
    quote: "flushing the cache seemed to require cycling through every way of every set (presumably one per cycle) asking that way to flush itself if it is modified"
    method: patent-reading
    derivation: inferred
    hedge: "seemed to require ... presumably"
    supports: []
  - id: c-mh-v3-snoop-while-l1-sleeps
    text: >-
      Because the L2 filters snoops, a sleeping core's L1 can stay powered but unclocked and mostly need not be woken
      to answer snoops
    loc: p015
    quote: "snoops can be handled by the L2 while the L1 sleeps, and mostly without having to wake the L1"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      Handley's power ladder: clock gating for very short naps, a retained (unclocked, likely undervolted) L1 for
      longer sleeps, then flush and power off.
  - id: c-mh-v3-l1-flush-engine
    text: >-
      Per a 2013 patent, an asynchronous flush engine copies a core's modified L1 lines to the L2 while the core is
      partly powered down, then the core powers off fully
    loc: p015
    quote: "Now we have a separate asynchronous engine that allows the main CPU to partially power down while the engine copies all modified lines out to L2, before fully powering down the core."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20140195737A1 (2013). The L1 and the engine must keep handling snoops on not yet written lines until power
      off.
  - id: c-mh-v3-flush-engine-in-l2
    text: >-
      The flush engine belongs to the L2, not to each core: it pulls modified lines out of an L1, finding them through
      the L2's duplicate L1 tags, so one engine serves the whole cluster
    loc: p016
    quote: "the flush engine is associated with the L2 core rather than the L1 cores. Thus, in a sense, it pulls modified lines from the L1"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-l2-flush-to-slc
    text: >-
      When all the L2's clients sleep, the flush engine walks the L2 tags and pushes modified lines to the SLC until it
      has matched the maintained count of modified lines, and then the whole L2 can shut down
    loc: p016
    quote: "if all the clients of the L2 go to sleep, then after a while it makes sense to also shut down the entire L2 ... the flush engine gets repurposed for that job"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-dup-tag-power
    text: >-
      Per a 2013 patent, once a core's L1 has lost power the L2 also powers off the duplicate tags it keeps for that
      L1, since there is nothing left to snoop
    loc: p016
    quote: "once an L1 client has lost power, there's no point in snooping for that client any more ... Apple pulls the power on the duplicate tags"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20140189411A1 (2013), power control for cache structures.
  - id: c-mh-v3-flush-without-sleep
    text: >-
      Per a 2018 patent, one extra bit in the flush control register, which Handley assumes is at L2 level, lets the
      sleep flush machinery flush caches for software maintenance without putting the core to sleep
    loc: p016
    quote: "we add one extra bit to this control register so that the flush machinery goes through everything as before, except with that bit set, it omits the steps that before would put the CPU to sleep"
    method: patent-reading
    derivation: inferred
    hedge: "I assume L2-level"
    supports: []
    notes: US10552323B1 (2018). Handley thinks it serves I-cache and L1 maintenance, perhaps not TLB.
  - id: c-mh-v3-sleep-invalidate-queue
    text: >-
      Per a 2020 patent, a unit outside the core, which Handley assumes is the L2, records I-cache and TLB
      invalidations for a sleeping core and feeds them to it on waking, flushing the whole I-cache or TLB if the record
      overflows
    loc: p017
    quote: "external to the CPU (I assume the L2 since it's doing this sort of work in various other cases) records the various I-cache and TLB invalidation requests"
    method: patent-reading
    derivation: inferred
    hedge: "I assume"
    supports: []
    notes: US20220066941A1 (2020), storage array invalidation maintenance.
  - id: c-mh-v3-fiu-throttle
    text: >-
      Per a 2018 patent, cache and TLB maintenance requests for a core wait in a per-cluster Fabric Interface Unit, and
      a core that has taken enough of them refuses more until counters show it has made progress on normal code
    loc: p017
    quote: "something the patent calls The FIU, Fabric Interface Unit, which is a per-processor-complex object ... successive maintenance requests are held in a queue in the FIU, not the CPU"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US11080188B1 (2018). Handley reads it as protection against a guest OS flooding other cores with maintenance
      requests.
  - id: c-mh-v3-deferred-invalidate-poison
    text: >-
      Per a 2021 patent, a cache marks lines hit by invalidation requests as poisoned and synchronizes them in the
      background, stalling only accesses to poisoned lines and any barrier that needs full synchronization
    loc: p018
    quote: "rather than the cache handling each invalidation request immediately, it marks the relevant cache line as “poisoned”"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20230017473A1 (2021), filed after the M1 shipped; Handley suggests both this and the FIU scheme may end up implemented.
  - id: c-mh-v3-drowsy-l2
    text: >-
      The L2 is run as a drowsy cache: banks idle for some time sleep at a voltage that retains data and need a cycle
      or two to wake on access
    loc: p018
    quote: "banks that haven't been accessed for some time are put to sleep, with enough voltage to retain data, but requiring a cycle or two to wake up on access"
    method: patent-reading
    derivation: inferred
    value: 1.5
    range: [1, 2]
    unit: cycles
    supports: []
  - id: c-mh-v3-l2-sleep-by-way
    text: >-
      The unit put to sleep is one way of every set: with each way in its own independently powered bank, sleeping a
      bank leaves the other ways fully active and costs a wake-up cycle for lines in the sleeping way
    loc: p018
    quote: "The unit that is actually put to sleep is a way in each set."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Handley's 8-way L2 here is an illustration.
  - id: c-mh-v3-l2-sleep-leakage
    text: >-
      Per a 2014 patent, the idle count before an L2 bank sleeps is set from the part's characterized leakage and the
      temperature measured just before, so a leakier or hotter L2 sleeps banks sooner
    loc: p019
    quote: "Based on the temperature and the leakiness of the L2, an idle count is established."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9513693B2 (2014), L2 cache retention mode.
  - id: c-mh-v3-l2-12-ways-2014
    text: >-
      Per a 2014 patent, Apple's L2 then had 12 ways in three separately powered groups, so a third or two thirds of
      the cache could be powered down
    loc: p019
    quote: "at that time Apple's L2 had 12 ways, and these were split into three separately powered collections, so that either one third or two thirds of the cache could be powered down"
    method: patent-reading
    derivation: inferred
    value: 12
    unit: ways
    hedge: "Details have surely changed since then"
    supports: []
    notes: US20150309939A1 (2014), selective cache way-group power down.
  - id: c-mh-v3-l2-thirds
    text: >-
      Apple still seems to run the L2 and the L2 TLB in thirds (full, two thirds or one third active), which Handley
      gives as the reason both sizes are multiples of 3
    loc: p019
    quote: "Apple still seems to operate L2 (and TLB2) at a 3-way granularity, that is each of these can run at full capacity, at 2/3, or at 1/3 ... Hence L2 and TLB2 sizes being multiples of 3"
    method: patent-reading
    derivation: inferred
    value: 3
    unit: groups
    hedge: "seems to"
    supports: [l2.power_groups]
    notes: The idle third is either asleep or powered off. Consistent with the 12 MiB L2 and the 3072-entry L2 TLB.
  - id: c-mh-v3-l2-powerdown-counters
    text: >-
      Per the 2014 patent, three counters of references to each way group pick the third to power down, and three more
      count hits to the MRU, middle and LRU four ways of all sets to decide whether to power down at all
    loc: p019
    quote: "There are two orthogonal sets of three counters. One set counts the number of references to each of the three physical banks. The lowest value tells us which bank will be powered down."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      Modified lines in the chosen group are flushed first; the patent's cost also weighs lines held in L1s and how
      busy the group has been.
  - id: c-mh-v3-l2-powerup
    text: >-
      A powered-down part of the L2 comes back when the L2 misses often, with further tests for whether the misses
      involve reused lines rather than compulsory or streaming misses
    loc: p020
    quote: "Obviously the first signal is that you are missing frequently in the L2 (suggesting your L2 is too small)"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-slc-dup-tags-l2
    text: >-
      The SLC snoop-filters the L2s with duplicate L2 tags of its own, powered by way, so the matching way group of the
      duplicate tags powers down with the L2's
    loc: p020
    quote: "the SLC snoop-filters the L2, using a set of duplicated tags stored with the SLC. These duplicate tags are also powered by way"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9823730B2 (2015), power management of cache duplicate tags.
  - id: c-mh-v3-sparse-zero-lines
    text: >-
      A 2017 patent records all-zero line writes as a bit in the line's tag without writing the data array and serves
      reads of such lines without reading it; Handley thinks its diagrams look like the L2
    loc: p020
    quote: "don’t perform the write, instead note the line (eg by setting a bit in the cache line tag)"
    method: patent-reading
    derivation: inferred
    hedge: "to my eye, look L2-'ish"
    supports: []
    notes: US10691610B2 (2017). Vol 2 found no speed difference with all-zero data (c-mh-v2-zero-data).
  - id: c-mh-v3-sparse-loser-bank
    text: >-
      The same patent keeps invalid and all-zero lines in one loser bank that stays powered off until real data must
      be stored there, and repacks data later to power it down again
    loc: p021
    quote: 'maintain one cache bank as the "loser" banks holding the invalid lines and the "all zero" lines'
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-a10-shared-l2
    text: >-
      A 2017 patent describes the A10, whose efficiency cores used the performance cores' L2 as their own, so that L2
      had to stay powered whenever the efficiency cores ran
    loc: p022
    quote: "it describes the A10 (and only the A10). The idea is we have performance cores with an associated L2, and efficiency cores that use the L2 of the performance cores as their L2."
    method: patent-reading
    derivation: inferred
    chip: a10
    supports: []
    notes: US10147464B1 (2017). Running the shared L2 at its own frequency means buffering between clock domains.
  - id: c-mh-v3-cluster-shared-frequency
    text: >-
      Cores that share an L2 must either all run at one frequency or pay a much higher L2 access cost for buffering
      across clock domains
    loc: p022
    quote: "When cores share an L2 (and other hardware), either they all run at the same frequency, or the cost to access the L2 is substantially higher because of buffering across clock domains."
    derivation: inferred
    supports: []
    notes: Handley asks whether four is the right number of cores per shared L2 and frequency domain.
  - id: c-mh-v3-slc-neither-incl-excl
    text: >-
      Apple's cache levels are neither inclusive nor exclusive; the SLC keeps tags for the contents of every L2 but not
      the data, so reading such a line means asking that L2
    loc: p022
    quote: "What Apple do, however, is neither exclusive nor inclusive. ... This definitely happens for the SLC, which has tags that give the contents of all the L2s, but not the lines"
    method: patent-reading
    derivation: inferred
    value: non-inclusive, non-exclusive
    supports: [slc.inclusion]
    notes: For lookup the SLC contains the L2s, for data it does not. 7-cpu suggests an exclusive SLC (c-7cpu-slc-exclusive).
  - id: c-mh-v3-l2-covering-tags-hint
    text: >-
      There are hints that the L2 likewise keeps covering tags for the L1s without holding all their data, but no
      patent Handley found says so unequivocally
    loc: p022
    quote: "There are hints that the L2 also does this relative to the L1 (so it has covering tags, but may not include the L1 line data)"
    method: patent-reading
    derivation: inferred
    value: non-inclusive, non-exclusive
    hedge: "There are hints"
    supports: [l2.inclusion]
    notes: He adds that this may have changed over the years.
  - id: c-mh-v3-snoop-levels
    text: >-
      Core-to-core snooping mostly stays inside a cluster, handled by that cluster's L2 for its four cores, while
      snoops between clusters or between different IP blocks are filtered at the SLC level
    loc: p023
    quote: "core to core snooping will mostly occur within a core cluster, and can be handled well by having the L2 for that cluster snoop for all 4 processors of the cluster"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-coherence-point
    text: >-
      The snooping attributed to the SLC is done by the Coherence Point, once closely tied to the SLC and increasingly
      a separate unit
    loc: p023
    quote: "The snooping is performed by what’s called the Coherence Point, which in the past was closely associated with the SLC, but has become more and more a separate entity."
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-four-hop
    text: >-
      Per a 2013 patent, a request for a line held in another CPU's cache goes to the SLC, whose duplicate tags locate
      it; the line moves from that cache to the SLC and then to the requester, a four-hop protocol
    loc: p023
    quote: "If you count the interactions, you can call this a “four hop” protocol."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20150067246A1 (2013), black box duplicate tags. Passing through the SLC lets it keep a copy, which matters
      less as L2s have grown.
  - id: c-mh-v3-three-hop
    text: >-
      A 2020 patent adds a three-hop protocol in which the SLC tells the owning CPU to send the line straight to the
      requester, bypassing the SLC
    loc: p023
    quote: "a 2020 patent for a new Apple three hop cache protocol ... then E sends the data directly to P bypassing the SLC"
    method: patent-reading
    derivation: inferred
    hedge: "This may or may not be in the M1"
    supports: []
    notes: Handley says it may be only for the M2 and later. See c-mh-v3-scalable-coherence.
  - id: c-mh-v3-ctt-queues
    text: >-
      In the 2013 duplicate-tag design every request enters a Current Transaction Table and is checked against the
      duplicate tags; a miss goes on to the memory interface, a hit is routed to the cache holding the line
    loc: p024
    quote: "All memory requests first hit the CTT (Current Transaction Table). The simplest sort of request will be placed in the IRQ (Incoming Request Queue), and have the request address tested against the DTs (Duplicate Tags)."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      Data returned from another cache passes through a copyback queue to the requester; a state machine keeps the
      steps in order.
  - id: c-mh-v3-victim-addq
    text: >-
      A modified victim's address waits in a victim address queue, removed from the duplicate tags, until its data is
      safe in the SLC or DRAM, and requests to that address are held meanwhile
    loc: p024
    quote: "From now until we’re done, if another request comes in matching an address in Victim AddQ, the new request is paused until the address in VictimAddQ is no longer present"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-parallel-coherence-pipes
    text: >-
      Per a 2018 patent, an incoming snoop is checked against a cache's own tags and its duplicate tags at the same
      time
    loc: p025
    quote: 'The patent says "look at both simultaneously", with a bunch of complications that then result'
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20200081838A1 (2018). Complications: both tag sets hit, the line is locked by a load exclusive, or the request
      has passed the global ordering point.
  - id: c-mh-v3-slc-four-slices
    text: >-
      The 2018 patent's figure, probably close to the current SLC, shows one pool of request queues feeding four
      arbiters that route requests to four slices
    loc: p026
    quote: 'Four arbitrators (in principle there could be more, but four seems reasonable for an M1 class SoC) route these requests to one of four "slices".'
    method: patent-reading
    derivation: inferred
    value: 4
    unit: slices
    hedge: "four seems reasonable for an M1 class SoC"
    supports: []
  - id: c-mh-v3-slc-slice-hash
    text: >-
      Handley's guess is that physical address bits 6 and 7 pick the slice in the simplest case, or a hash of more
      bits, which on Pro, Max and Ultra also spreads lines across SLCs
    loc: p026
    quote: "use bits 6 and 7 to choose one of the 4 arbitrators and slices. But of course one can use a more complicated hash that uses more address bits."
    derivation: inferred
    hedge: "an obvious way to think about this"
    supports: []
    notes: His example assumes a 64 B line; nobody states the actual selection.
  - id: c-mh-v3-l2-incl-instr-2007
    text: Per a 2007 patent, the L2 is inclusive for instructions
    loc: p027
    quote: "what that says, among other things is that the L2 is ... inclusive for instructions"
    method: patent-reading
    derivation: inferred
    hedge: "may or may still hold"
    supports: []
    notes: US7702858B2 (2007). Handley sees no point in it, unless as a way to keep instruction lines in the L2 longer.
  - id: c-mh-v3-l2-victim-data-2007
    text: >-
      Per the same 2007 patent, the L2 is a victim cache for data: lines fill the L1 directly from their source and
      reach the L2 only when evicted from the L1
    loc: p027
    quote: "victim for data. In other words a data line is loaded directly from its source (let’s say DRAM) into L1, without being stored in L2."
    method: patent-reading
    derivation: inferred
    hedge: "may or may still hold"
    supports: []
    notes: A line reloaded from the L2 then sits in both caches.
  - id: c-mh-v3-l2-pending-tag-2013
    text: >-
      Per a 2013 patent, on a miss in both L1 and L2 the L2 allocates a tag marked pending without the data, and the
      L1 copy is marked clean-evict so it is copied to the L2 when the L1 evicts it
    loc: p028
    quote: "a tag is allocated for the line, but the data is not copied into the line. The tag is marked with a “pending” bit."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20150149722A1 (2013), delaying cache data array updates.
  - id: c-mh-v3-selective-victim
    text: >-
      Per a companion 2013 patent, each L1 set tracks how actively its lines are used, and clean lines from little-used
      sets are dropped rather than copied to the L2, as they also are when L1-L2 traffic is heavy
    loc: p028
    quote: "under these conditions of low usage, when a clean line is to be overwritten in L1, it is not copied up to L2"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20150149721A1, granted as US9298620B2 (2013). The pending L2 tag then turns invalid, so no useful L2 line is
      lost to it.
  - id: c-mh-v3-l2-dup-tags-unclear
    text: >-
      Whether the L2 keeps duplicate L1 tags is unclear: the 2013 victimization patent does not use them, while the
      2013 flush-engine patent states plainly that the L2 has them
    loc: p029
    quote: "The main issue that is uncertain is whether L2 has duplicate tags like the SLC ... patent very definitely states that there are L1 duplicate tags in the L2"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-l1-2048-lines
    text: The L1 data cache holds 2048 lines
    loc: p029
    quote: "There are 2048 lines in the L1."
    derivation: derived
    value: 2048
    unit: lines
    supports: []
    notes: Equals 128 KiB in 64 B lines (l1d.size, l1d.line).
  - id: c-mh-v3-flush-dirty-only
    text: >-
      The 2013 flush engine writes back only dirty L1 lines before power-off, extracting them by telling the L1 each
      line has been snooped, a method that cannot move clean lines
    loc: p029
    quote: "The 2013 Flush Engine patent suggests that only dirty lines are written back to L2 ... indicating that the line has been snooped, so that it needs to be written to the L2"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-dram-fill-l1-only
    text: >-
      Handley's summary of the current flow: data fetched from DRAM is installed in the L1 only, not in the L2 or the
      SLC
    loc: p029
    quote: "when the L1 makes a request for data that has to come all the way from DRAM, that data + will NOT be installed in the SLC + will NOT be installed in the L2"
    method: patent-reading
    derivation: inferred
    value: non-inclusive, non-exclusive
    hedge: "seems to be something like"
    supports: [l2.inclusion]
    notes: He calls the picture somewhat unsatisfactory and likely to have changed many times.
  - id: c-mh-v3-l1-victim-to-l2
    text: >-
      A line cast out of the L1 may go to the L2 as a victim if it looks useful and the L1-L2 path is not backed up,
      and an L2 castout may likewise go to the SLC as a victim
    loc: p029
    quote: "it could be sent to L2 as a victim cache, depending on whether the line appears to be useful and if transporting it to L2 is not too expensive"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-full-line-write-l2
    text: >-
      A newly created 64 B line written quickly by a core appears to be written whole to the L2 without allocating in
      the L1; partial writes update the L1 copy
    loc: p029
    quote: "a completely newly created line (64B of rapidly written data) is created on the L1. This appears to be written as a complete line to L2 without allocating in L1."
    method: patent-reading
    derivation: inferred
    hedge: "appears to be"
    supports: []
  - id: c-mh-v3-l2-writeback-path
    text: >-
      A modified line cast out of the L2 is written back either straight to the memory controller or to the SLC, which
      writes it to DRAM later
    loc: p030
    quote: "when a modified line is cast out of L2, it has to be a writeback of course. Under some conditions could go straight to the Memory Controller"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-prefetch-two-targets
    text: >-
      The prefetch unit beside the L1 issues two streams, a high-confidence one into the L1 and a lower-confidence or
      later one into the L2; L2 prefetches never used carry a prefetch bit and are not saved to the SLC
    loc: p030
    quote: "prefetches are generated in the Prefetch Unit (associated with L1) as two different streams, one targeting the L1 (high confidence, needed immediately), one targeting the L2"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Whether L1-targeted lines also allocate in the L2 Handley does not know.
  - id: c-mh-v3-prefetch-no-slc
    text: >-
      The newest prefetcher targets only the L1 and L2, not the SLC, and fetches TLB entries only as a side effect of
      translating its virtual-address stream
    loc: p030
    quote: "The newest prefetcher design seems to have no interest in the SLC; it targets only L1 and L2"
    method: patent-reading
    derivation: inferred
    hedge: "seems to"
    supports: []
    notes: Agrees with vol 2 (c-mh-v2-prefetch-not-slc, c-mh-v2-no-tlb2-prefetcher).
  - id: c-mh-v3-slc-victim-allocator
    text: >-
      Per a 2018 patent, each cluster's L2 has an Allocator whose counters (L2 demand misses, dirty share of evictions,
      prefetch accuracy, streaming prefetches) decide whether L2 victims go to the SLC or bypass it
    loc: p030
    quote: "each cluster L2 has dedicated hardware called an Allocator containing multiple counters tracking various things"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US10963392B1 (2018). With little expected reuse, clean victims are dropped and dirty ones go straight to DRAM,
      bypassing the SLC.
  - id: c-mh-v3-clean-victim-modes
    text: >-
      Handley expects the M1 to track line usefulness at both L1 and L2 and not to write clean victims that have not
      proved useful out to the next cache, toggling between keeping and dropping clean victims
    loc: p031
    quote: "One expects that in the M1 the best aspects of all these designs are used at both the L1 and L2 levels"
    method: patent-reading
    derivation: inferred
    hedge: "One expects"
    supports: []
  - id: c-mh-v3-l2-inclusive-2013
    text: >-
      Around 2013 and 2014 (the A7 and A8 generation) the L2 was inclusive, so replacement avoided lines also held in
      an L1; whether it still is remains unclear
    loc: p031
    quote: "if your L2 is inclusive (as it was say around 2013..2014 so around A7, A8 generation; unclear today) then you should not replace a line that is an inclusive line"
    method: patent-reading
    derivation: inferred
    hedge: "unclear today"
    chip: a7
    supports: []
  - id: c-mh-v3-line-state-bits
    text: >-
      Apple's per-line state includes bits marking a line as part of a stream, brought in by a prefetcher, or having
      made a trip (into the L1, evicted to the L2, back into the L1)
    loc: p032
    quote: "Along with the other data stored by Apple for each cache line we have bits that indicate ... the line has made a “trip”"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-l2-lru-placement
    text: >-
      Per a 2013 patent, an incoming L2 line is placed at an LRU position chosen from its history, low for lines not
      expected to be reused and high (LRU7 in an 8-way example) for likely useful ones
    loc: p032
    quote: "If we place a new line at LRU0, that’s saying that we will accept the line in the L2, but we’re not very confident it will be useful"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US9563575B2 (2013). Lines enter the L2 as L1 victims, so arrival alone does not show usefulness. Vol 2 timing
      suggested random L2 replacement on the M1 (c-mh-v2-l2-random-repl).
  - id: c-mh-v3-l2-stream-lru0
    text: >-
      A streaming line evicted from the L1 enters the L2 at LRU0 and moves up one step if reused, so a long stream
      replaces only earlier stream lines and can displace about an eighth, or perhaps a quarter, of the L2
    loc: p034
    quote: "the stream can only wipe out one 1/8th (or maybe 1/4) of the L2 cache, it can’t remove the other 7/8th of useful material in the cache"
    method: patent-reading
    derivation: inferred
    hedge: "or maybe 1/4"
    supports: []
  - id: c-mh-v3-l2-prefetch-slots
    text: >-
      Prefetched lines that have not been used get the four lowest LRU slots, on the view that they are low-confidence
      prefetches and should be used soon if at all
    loc: p034
    quote: "Prefetches we are slightly more tolerant of. They get the four lowest slots to hang around in"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-l2-trip-lines
    text: >-
      Even lines that have made a trip can occupy only three quarters of the L2 until a hit in the L2 promotes them to
      LRU7
    loc: p034
    quote: "even the probably useful trip lines only get access to 3/4 of the cache"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-true-lru
    text: The 2013 replacement patent assumes true LRU ordering but does not say how it is built
    loc: p035
    quote: "The patents talks about using a “true LRU”, but does not explain how this is done."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Handley's alternative, a random choice among lines below a desirability score, is his own proposal.
  - id: c-mh-v3-l2-cpu-quota
    text: >-
      Per a 2014 follow-up, each L2 line also records which CPU last accessed it, each CPU has a line quota, and
      replacement takes the least recently used line among CPUs over quota
    loc: p035
    quote: "adds to the other per-line state, an ID for which CPU most recently accessed each line. Each CPU has a cache line quota"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20150309944A1 (2014), methods for cache line eviction.
  - id: c-mh-v3-superways
    text: >-
      Handley reads a 2020 patent as grouping the ways of a highly associative cache into a few super-ways ranked by
      LRU, a hash fixing each line's slot within a super-way, which saves LRU bits and suits powering down the coldest
      way group
    loc: p037
    quote: "we can save a whole lot of LRU-ordering bits by use of the super-ways; and we can make the cache shutdown mechanism more efficient"
    method: patent-reading
    derivation: inferred
    hedge: "all the above is conjecture!"
    supports: []
    notes: >-
      US11144476B2 (2020), LRU ranking in a multi-port cache. His 256 sets, 128 ways and four super-ways of 32 are
      made-up numbers.
  - id: c-mh-v3-moesi
    text: >-
      Apple has likely used MOESI since at least the A6 and A7, whose Owned state lets a modified line pass directly
      from one cache to another
    loc: p038
    quote: "it seems likely that, from at least the A6 and A7 days, Apple was using MOESI as their cache"
    method: patent-reading
    derivation: inferred
    value: MOESI
    hedge: "it seems likely"
    supports: [chip.coherence_protocol]
  - id: c-mh-v3-directory
    text: >-
      Apple's coherence is in effect a directory protocol, the duplicate tags in the coherence point serving as the
      directory, although Apple calls it snooping
    loc: p038
    quote: "Apple essentially uses a directory protocol (the Duplicate Tags stored in the Coherence Point, as will be discussed in massive detail when we cover the Fabric/SLC/Memory Controller, are essentially a directory)"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-page-unshared-snoop
    text: >-
      A 2009 patent marks never-shared pages in the page tables, carried through the TLB to the cache, so lines in
      them skip snoop broadcasts; Handley wonders whether the M1 has it
    loc: p039
    quote: "Most pages are never shared, so suppose we indicate in the page tables, propagated to the TLB and then to the cache, that pages are not shared."
    method: patent-reading
    derivation: inferred
    hedge: "So maybe it's present in the M1?"
    supports: []
    notes: US20100235586A1 (2009). Handley guesses it served the dual-package Mac Pro, not phones.
  - id: c-mh-v3-sharing-tracking
    text: >-
      A 2011 patent has each device learn from snoop traffic which lines others may hold and suppress snoops for lines
      no one else can have, refining the tracking granularity per address range from statistics
    loc: p039
    quote: "if it knows that no other device can be holding a particular line, snoop broadcasts related to that line can be suppressed"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US8856456B2 (2011), aimed at coherence between a CPU and a GPU.
  - id: c-mh-v3-scalable-coherence
    text: >-
      A 2020 patent defines a protocol built on MOESI that allows several outstanding transactions per line; each
      snoop carries the expected state change, so a cache can detect a snoop that arrived out of order and wait
    loc: p039
    quote: "multiple transactions to a specific cache line may be outstanding ... What Apple do instead is to include, with each Snoop transaction, the state the line is supposed to be in"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20220083472A1 (2020), scalable cache coherency protocol. Handley sees it suited to something the size of an
      M1 Ultra.
  - id: c-mh-v3-sideways-fill
    text: >-
      The same protocol lets fill and copyback messages name a target device, so data moves sideways from cache to
      cache, merging MOESI with MESIF-style forwarding of clean lines
    loc: p040
    quote: "This aspect of the protocol is essentially a merging of MOESI (allow sharing of modified lines) and MERSI/MESIF (allow sideways transfer of non-modified lines)."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Extended shared states decide which sharer forwards a clean line; some message pairs are bundled into one.
  - id: c-mh-v3-inter-cluster-snoop
    text: >-
      A 2020 patent shortens some inter-cluster transfers: a NoC arbitration node between a cluster and the SLC copies
      certain snoop responses and returns one to the requester as if from the SLC
    loc: p040
    quote: "This patent uses a hack to convert some of the four-hop transactions that should route through the SLC to faster three-hop transactions."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US11016913B1 (2020), inter cluster snoop latency reduction.
  - id: c-mh-v3-cache-as-ram
    text: >-
      A 2019 patent lets a cache map address ranges onto some of its lines through in-cache registers, so that
      device DMA can land directly in the cache instead of DRAM
    loc: p041
    quote: "allow a cache ... to have certain address ranges mapped (via in-cache registers) to some lines of the cache"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US10922232B1 (2019). The patent covers L1 to L3, with L1 examples; its focus is ordering memory and IO requests
      to such a cache without deadlock.
  - id: c-mh-v3-dma-into-l2
    text: >-
      Unlike Intel's automatic DDIO into the L3, Apple's scheme seems to need a driver to set up the mapping and puts
      the data in the L2, which Handley thinks the SLC's duplicate tags make possible
    loc: p042
    quote: "Intel’s scheme goes to L3, whereas Apple’s scheme goes to L2. I’m guessing this is feasible ... because of the duplicate tags"
    method: patent-reading
    derivation: inferred
    hedge: "I’m guessing"
    supports: []
  - id: c-mh-v3-slc-dynamic-ram
    text: >-
      A 2021 patent maps a physical address range into a cache, probably the SLC, on demand, for example for camera
      frames read by the GPU or encoder; removing the range clears the lines and makes the range invalid
    loc: p042
    quote: "the ability to map a physical address range into a cache (probably SLC) rather than DRAM"
    method: patent-reading
    derivation: inferred
    hedge: "probably SLC"
    supports: []
    notes: >-
      US20230067307A1 (2021). It also suggests keeping alternate lines of a large buffer in the SLC to interleave hits
      with DRAM misses.
  - id: c-mh-v3-slc-tagless-ram
    text: >-
      A 2009 patent sets part of the SLC aside as tagless memory reached through range registers, mainly for the GPU
      and image processor; Handley would not be surprised if the M1 has both this and the 2019 scheme
    loc: p043
    quote: "this storage isn't used like traditional cache storage, and so doesn't require tags; rather a few range registers in the SLC can route addresses as appropriate to this storage"
    method: patent-reading
    derivation: inferred
    hedge: "I wouldn't be surprised if both are present on the M1"
    supports: []
    notes: US20110010504A1 (2009), combined transparent/non-transparent cache.
  - id: c-mh-v3-display-from-slc
    text: >-
      Per a 2013 patent, when the display buffer is static the system copies it into the SLC and the display
      controller reads from the SLC instead of DRAM
    loc: p044
    quote: "When the system detects that the contents of the display buffer are static, the display buffer is copied to the SLC, and the display controller runs out of SLC rather than DRAM."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US9261939B2 (2013). Related patents sleep the SLC arrays not being read and detect a static screen by a CRC
      unchanged for N frames.
  - id: c-mh-v3-replacement-policy-bit
    text: >-
      Per a 2009 patent, a bit in each cache set selects LRU or a limited FIFO for streams, set per request from the
      page tables or from range registers in the MMU
    loc: p044
    quote: "provide a bit specifying the replacement policy for this particular cache set"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US8392658B2 (2009). Handley suspects large caches gain more from hashed, low-associativity placement.
  - id: c-mh-v3-cache-filter
    text: >-
      Per a 2019 patent, software names an address range to filter and the cache keeps only a fraction of its lines on
      write, passing the rest to DRAM, so a data set too big for the cache still gets some hits
    loc: p045
    quote: "you describe the address range you want to “filter” and the cache HW should do the rest for you, deciding which lines to retain on write and which to pass through to DRAM"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US11256629B2 (2019). The SLC can skip tag checks for filtered addresses it knows it does not hold.
  - id: c-mh-v3-fill-source-telemetry
    text: >-
      Per a 2019 patent, per-core counters track where L1 misses are filled from (another L1 or the cluster L2, another
      cluster, the SLC or DRAM) to steer DRAM, fabric and cluster frequencies and thread placement
    loc: p046
    quote: "describing per-core counters that track these cache fill sources"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10942850B2 (2019), performance telemetry aided processing.
  - id: c-mh-v3-cluster-clock-shared
    text: >-
      A whole cluster changes frequency together, so a single core can only be slowed by gating its clock to every
      second or fourth edge, which saves switching power but not voltage
    loc: p046
    quote: "the frequency of an entire cluster has to change together, so it’s hard to directly slow down a single core"
    derivation: inferred
    value: per cluster
    supports: [pcluster.clock_domain]
  - id: c-mh-v3-telemetry-l3-design
    text: >-
      The same 2019 patent shows two clusters of four cores with a per-core L2 and a per-cluster L3, unlike other Apple
      patents, which makes Handley wonder whether it shows a fourth-generation design
    loc: p047
    quote: "It describes a design with - two clusters - four cores in each cluster - a per-core L2 and - a shared per-cluster L3 (which the patent calls LLC)"
    method: patent-reading
    derivation: inferred
    hedge: "it makes one wonder if we are seeing an aspect of the 4th gen design"
    supports: []
    notes: Handley groups Apple patents into designs up to the A6, the A7 to A10, and the A11 to M1; this one fits none.
  - id: c-mh-v3-ecluster-uses-pl2
    text: >-
      Handley reads a 2017 patent as letting the E cluster use the P cluster's L2 while the P cores sleep, the P L2's
      DVFS state following the P cores when any is awake and set for the E cores otherwise
    loc: p047
    quote: "the P cluster’s L2 is available to (and used by) the E cluster ... if one or more P cores is awake, set the P L2 DVFS state to match the P cores"
    method: patent-reading
    derivation: inferred
    hedge: "as I interpret it"
    supports: []
    notes: >-
      US10147464B1 (2017), the patent he earlier tied to the A10; here he applies it to phones, iPads and M1 laptops
      and suggests benchmarks could test it.
  - id: c-mh-v3-mmu-at-slc
    text: >-
      Apple appears to split the MMU: TLBs act as small L1 caches while the page walkers form one shared unit at the
      SLC and memory-controller level, serving every client on the chip
    loc: p047
    quote: "the TLB is something like a simple L1 cache, while the rest of the MMU (page walkers and suchlike) appears to be a unitary entity living up at the SLC/memory controller level"
    method: patent-reading
    derivation: inferred
    hedge: "I can’t be sure of the details"
    supports: []
    notes: Based in part on US9652560B1 (2011), a non-blocking MMU beside the SLC. See c-mh-v3-atu-in-cluster.
  - id: c-mh-v3-sprr-index
    text: >-
      Per a 2019 patent (APRR/SPRR), a page carries a permission index into a short 4-entry table instead of
      permission bits, so one core can switch a page's permissions without a TLB shootdown
    loc: p050
    quote: 'a page no longer has a set of permission bits, rather it has a "permission index" ... the first part of the index is used to index a (short, 4 entry) table'
    method: patent-reading
    derivation: inferred
    value: 4
    unit: entries
    supports: []
    notes: >-
      US20210064539A1 (2019), unified address translation. Two halves of the index serve A and B conditions; B is set
      briefly on the core changing the page.
  - id: c-mh-v3-atu-in-cluster
    text: >-
      Handley reads the 2019 patent as moving the address translation unit out of the core: a core keeps a small L1
      TLB, and misses go to the cluster (L2) level, which holds a large L2 TLB shared by its cores and the page walkers
    loc: p052
    quote: "If the L1 TLB misses, the request goes up to the Processor Complex (ie L2 cache) which will have a large L2 TLB, shared across the cores that share the L2 cache, the page walkers"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20210064539A1 (2019). Agrees with vol 2 (c-mh-v2-tlb2-per-cluster). Handley suggests a shared ATU might filter TLB
      shootdowns as the L2 filters L1 snoops.
  - id: c-mh-v3-slc-io-coherence
    text: >-
      The SLC holds the coherence point and tags of the other caches (the P and E L2s), so a peripheral reading a
      buffer still in a CPU's L1 gets the data through the SLC from that L2 and L1, with no software flush
    loc: p056
    quote: "the SLC will see that address A is present within an L2 tag, and so will request the data from the L2, which will request it from the L1"
    derivation: inferred
    supports: []
    notes: Only Device memory is then truly uncacheable.
  - id: c-mh-v3-uncached-load-merge
    text: >-
      Per a 2019 patent, each cache controller has a pool of buffers for uncacheable loads, merging later loads to the
      same line until a timer expires or a full-width load is built
    loc: p058
    quote: "there is a pool of buffers in each cache controller for the use of uncachable loads ... when a load is placed in one of these buffers a timer starts"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20210056024A1 (2019), serial miss requests in a non-coherent memory system.
  - id: c-mh-v3-l2-line-patent
    text: >-
      A 2015 Apple patent on L2 request ordering gives the L2 line as 128 B; vol 2 measured 64 B L1 lines and had
      assumed the same for L2 and SLC, and the SLC line stays unresolved
    loc: p058
    quote: "The patent tells us that the L2 cache line is 128B"
    method: patent-reading
    derivation: inferred
    value: 128
    unit: B
    supports: [l2.line]
    notes: US10127153B1 (2015), cache dependency handling. Agrees with c-mh-v2-l2-line-128 and c-mh-v3-l2-line-128.
  - id: c-mh-v3-l2-order-unit
    text: >-
      Per the 2015 patent, requests queued at the L2 from its L1 clients are ordered per 128 B L2 line: in order within
      a line, out of order across lines
    loc: p059
    quote: "requests that go to the same L2 line must be handled in order, but can be handled out of order relative to requests touching any other L2 line"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: A write to half an L2 line changes state for the whole line, which is why the L2 line, not the L1 line, is the unit.
  - id: c-mh-v3-l2-half-line-bypass
    text: >-
      When a write to one half of an L2 line and a later read of the other half come from the same core, the read may
      go first, since they are separate L1 lines; from different cores the read waits
    loc: p059
    quote: "if the read and write are to the same core, then we know that there is no conceptual problem, as far as the L1 is concerned, these are separate lines"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-no-buses
    text: >-
      There seems no reason to think the M1 has physical buses, except perhaps for debug or very slow peripherals; its
      interconnect is a network on chip
    loc: p060
    quote: "There seems no reason to believe there are any physical buses on an M1 (perhaps there are for very specialized tasks like debug and for very slow peripherals like buttons?)"
    derivation: inferred
    hedge: "There seems no reason to believe"
    supports: []
  - id: c-mh-v3-l2-switch
    text: >-
      Apple places each CPU cluster below an L2 that acts as a switch between the cluster's cores and the rest of the
      SoC
    loc: p066
    quote: "Apple clusters CPU’s below an L2 that acts as a Switch between the cores of a cluster and the rest of the SoC"
    derivation: inferred
    supports: []
  - id: c-mh-v3-device-store-path
    text: >-
      A store to Device memory, once non-speculative, skips the cache and goes through the L2 onto the NoC as a small
      write message, its physical address mapped to a destination block ID around the L2 exit or NoC entry
    loc: p066
    quote: "the store, once it becomes non-speculative, rather than storing its data in the cache will immediately send it out to the L2 and then onto the NoC"
    derivation: inferred
    hedge: "the details are so low level they are never made clear"
    supports: []
    notes: Handley compares the address lookup with the System Address Map in Arm's CMN-600.

new_params:
  l2.inclusion:            {block: l2, name: L2 inclusion of L1 contents}
  l2.power_groups:         {block: l2, name: Separately powered L2 way groups, unit: groups}
  slc.inclusion:           {block: slc, name: SLC inclusion of L2 contents}
  chip.coherence_protocol: {block: chip, name: Coherence protocol}

new_mechanisms:
  barrier_colors:
    name: Color-tagged barriers at the L1-L2 boundary
    status: speculative
    description: Barriers advance a color tag on memory requests, and ordering is enforced between the L1 and the L2, not in the LSU.
    params: []
    patents: [US9582276B2]
    sim_switch: null
    detection_rule: a DMB between stores that hit in the L1 costs little, while one between stores that miss to the L2 waits for the earlier misses
  load_poison_bits:
    name: Load poison bits for load-load ordering
    status: speculative
    description: A load whose line is modified by another core before it becomes non-speculative is poisoned and replayed or flushed.
    params: []
    patents: [US9383995B2, US10747535B1, US9501284B2, US20200264888A1]
    sim_switch: null
    detection_rule: same-address loads on one core take extra machine clears only when another core writes the line between them
  l2_snoop_filter:
    name: L2 duplicate L1 tags (snoop filter and flush engine)
    status: speculative
    description: The L2 keeps duplicate tags of its cores' L1s, filters snoops for them, and drives a flush engine that pulls dirty L1 lines before a core powers down.
    params: [l2.inclusion]
    patents: [US9317102B2, US20140195737A1, US20140189411A1, US10552323B1, US20220066941A1]
    sim_switch: null
    detection_rule: an idle core keeps its L1 contents through the other cores' sharing traffic, and stores to lines no other L1 holds see no snoop delay
  l2_way_power:
    name: L2 way-group sleep and power-down
    status: speculative
    description: L2 ways sit in three separately powered groups that sleep after an idle count set by leakage and temperature, or power off when use is concentrated.
    params: [l2.power_groups]
    patents: [US9513693B2, US20150309939A1]
    sim_switch: null
    detection_rule: >-
      after an idle stretch the first L2 hits take one or two extra cycles, and after long light load the usable L2
      capacity drops to two thirds or one third until miss pressure restores it
  l2_victim_fill:
    name: L2 as a selective victim cache for L1 data
    status: speculative
    description: DRAM fills go to the L1 only; L1 castouts enter the L2 as victims, clean ones only when their set has shown reuse and the L1-L2 path is free.
    params: [l2.inclusion]
    patents: [US7702858B2, US20150149722A1, US20150149721A1, US10963392B1]
    sim_switch: null
    detection_rule: one pass over a footprint larger than the L1 leaves little for a second pass to hit in the L2, while repeated passes build up L2 hits
  l2_insertion_priority:
    name: L2 insertion position by line history
    status: speculative
    description: L2 victims enter at LRU positions chosen by stream, prefetch and trip bits, so streams and unused prefetches cycle through a few ways.
    params: [l2.replacement]
    patents: [US9563575B2, US20150309944A1, US11144476B2]
    sim_switch: null
    detection_rule: a streaming pass over many MiB evicts only an eighth to a quarter of a resident L2 working set

