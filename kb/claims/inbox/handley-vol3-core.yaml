# handley-vol3-core.yaml
# Maynard Handley, 2025
# The P-cluster around the cores: L2, snoops and coherence (AArch64-Explore vol 3).
session: handley-vol3-core
source: handley-vol3

claims:
  - id: c-mh-v3-barrier-colors
    text: >-
      Per a 2012 Apple patent, barriers tag memory requests with a color that changes at each barrier, and no request
      of a later color completes until every request of the earlier color has
    loc: p008
    quote: "mark requests as they come in via some tag that changes when a barrier is encountered ... not allow any request with a tag later than N to complete until all requests tagged as N are complete"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9582276B2 (2012), speculative and architectural color values.
  - id: c-mh-v3-barrier-l1-l2
    text: >-
      Apple appears to enforce barrier ordering between the L1 and the L2, so the L2 and beyond see the correct order
      while accesses between the LSU and the L1 stay free to reorder
    loc: p008
    quote: "what Apple appear to do is implement the barrier between the L1 and L2, ensuring that the outside world (ie L2 and beyond) see correct ordering"
    method: patent-reading
    derivation: inferred
    hedge: "appear to"
    supports: []
    notes: Handley assumes this orders the cache's MESI state changes and snoop responses.
  - id: c-mh-v3-pio-strands
    text: >-
      Per a 2009 patent, a PIO controller labels buffered PIO writes so writes to one peripheral stay in order while
      writes to different peripherals interleave
    loc: p009
    quote: "a PIO controller, and a labelling of PIO transactions, that allows for reordering between strands but not within strands"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US8032673B2 (2009). Handley reads the patent's source ID as a destination ID.
  - id: c-mh-v3-dsb-excluded-region
    text: >-
      Per a 2020 patent, system registers can mark an address region as IO-like, and a DSB flag selects a strong form
      that orders all loads and stores or a mild form that need not wait for IO accesses
    loc: p010
    quote: "one or more system registers that allow defining a region of space as IO-like ... to distinguish between a “strong” DSB"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20220083338A1 (2020). With the mild form a core can acknowledge a remote DSB before its slow IO accesses
      complete.
  - id: c-mh-v3-remote-dsb
    text: >-
      A DSB that involves other cores reaches them as an interrupt; each appears to discard its front end, drain its
      back end and all cache transactions, then acknowledge and resume fetch
    loc: p011
    quote: "the current solution appears to be essentially to throw away everything in the front-end, wait for all instructions in the back end to complete"
    method: patent-reading
    derivation: inferred
    hedge: "appears to be"
    supports: []
    notes: >-
      Local barriers can use the color scheme; DSBs sent to other cores have no such shortcut. Flushing the front end
      also covers fetched instructions from a page that just became non-executable.
  - id: c-mh-v3-fused-stxr-barrier
    text: >-
      Per a 2010 patent, a store-exclusive and the barrier after it are fused into one operation that needs only one
      trip out to the point of coherency
    loc: p011
    quote: "The solution is to fuse them together to create a single op (understood by the caches and the fabric) that only requires one such expensive outward trip."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20110208915A1 (2010); Handley calls the details doubtless obsolete. The fusion happens in the LSU when no load
      or store lies between the two.
  - id: c-mh-v3-load-poison
    text: >-
      Per a 2013 patent, each load carries a poison bit that is set if its cache line is modified before the load
      becomes non-speculative, and the load then recovers by replay or flush
    loc: p013
    quote: 'Every load has associated with it a "poison bit", and if the cache line from which the load was read is modified before the load becomes non-speculative, then the poison bit is set'
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US9383995B2 (2013), extended to non-cacheable loads by US10747535B1 (2016). It keeps an older load from seeing
      newer data than a younger load to the same address.
  - id: c-mh-v3-wfe-poison
    text: >-
      Per a 2014 patent, loads after a WFE may execute before the core wakes; on waking the LSU checks for poisoned
      loads, so part of the LSU must stay awake to match snooped Modified lines against the load queue
    loc: p013
    quote: "after we wake up frome the WEV, we check the LSU to see if any loads have poison bits associated with them, and Recover appropriately"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9501284B2 (2014). Handley writes WEV for the wait-for-event instruction.
  - id: c-mh-v3-lsq-cam-filter
    text: >-
      Per a 2019 patent, the load/store queue keeps one bit for whether any entry is poisoned, and summary values such
      as the oldest valid load age, so most searches of the queue can be skipped
    loc: p014
    quote: "the LSQ tracks a single bit as to whether any entry in the queue is poisoned, and behaves differently in these two cases"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20200264888A1 (2019), CAM filtering based on microarchitectural state.
  - id: c-mh-v3-l2-dup-tags
    text: >-
      Per a 2010 patent, the L2 holds duplicate tags for the L1s of its cores behind a coherence point on the fabric,
      where the 2006 design routed every snoop from one core straight to the L2 and the other core
    loc: p015
    quote: "we now have a Coherence Point on the fabric ... Now the L2 holds duplicate tags for the L1’s of the various cores attached to it"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9317102B2 (2010), compared with US7752474B2 (2006).
  - id: c-mh-v3-l2-snoop-filter
    text: >-
      With its duplicate L1 tags the L2 filters out most snoops as irrelevant to the other cores, which saves energy
      and may let the L1 handle its now rare snoops on a slower path
    loc: p015
    quote: "a snoop from one core can be handled by the L2 (which can filter out most snoops as being irrelevant to any other core, and so can discard them)"
    method: patent-reading
    derivation: inferred
    hedge: "maybe even allows"
    supports: []
  - id: c-mh-v3-l1-line-counters
    text: >-
      Per the 2010 patent, the L1 counts its valid and modified lines, presumably to decide how soon the cache can be
      put to sleep
    loc: p015
    quote: "the L1 now has various counters of things like how many valid blocks and how many modified blocks it contains"
    method: patent-reading
    derivation: inferred
    hedge: "presumably"
    supports: []
  - id: c-mh-v3-l1-flush-walk
    text: >-
      Flushing the L1 in the 2006 and 2010 designs walks every way of every set, presumably one per cycle, and can stop
      early only once the modified-line count reaches zero
    loc: p015
    quote: "flushing the cache seemed to require cycling through every way of every set (presumably one per cycle) asking that way to flush itself if it is modified"
    method: patent-reading
    derivation: inferred
    hedge: "seemed to require ... presumably"
    supports: []
  - id: c-mh-v3-snoop-while-l1-sleeps
    text: >-
      Because the L2 filters snoops, a sleeping core's L1 can stay powered but unclocked and mostly need not be woken
      to answer snoops
    loc: p015
    quote: "snoops can be handled by the L2 while the L1 sleeps, and mostly without having to wake the L1"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      Handley's power ladder: clock gating for very short naps, a retained (unclocked, likely undervolted) L1 for
      longer sleeps, then flush and power off.
  - id: c-mh-v3-l1-flush-engine
    text: >-
      Per a 2013 patent, an asynchronous flush engine copies a core's modified L1 lines to the L2 while the core is
      partly powered down, then the core powers off fully
    loc: p015
    quote: "Now we have a separate asynchronous engine that allows the main CPU to partially power down while the engine copies all modified lines out to L2, before fully powering down the core."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20140195737A1 (2013). The L1 and the engine must keep handling snoops on not yet written lines until power
      off.
  - id: c-mh-v3-flush-engine-in-l2
    text: >-
      The flush engine belongs to the L2, not to each core: it pulls modified lines out of an L1, finding them through
      the L2's duplicate L1 tags, so one engine serves the whole cluster
    loc: p016
    quote: "the flush engine is associated with the L2 core rather than the L1 cores. Thus, in a sense, it pulls modified lines from the L1"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-l2-flush-to-slc
    text: >-
      When all the L2's clients sleep, the flush engine walks the L2 tags and pushes modified lines to the SLC until it
      has matched the maintained count of modified lines, and then the whole L2 can shut down
    loc: p016
    quote: "if all the clients of the L2 go to sleep, then after a while it makes sense to also shut down the entire L2 ... the flush engine gets repurposed for that job"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-dup-tag-power
    text: >-
      Per a 2013 patent, once a core's L1 has lost power the L2 also powers off the duplicate tags it keeps for that
      L1, since there is nothing left to snoop
    loc: p016
    quote: "once an L1 client has lost power, there's no point in snooping for that client any more ... Apple pulls the power on the duplicate tags"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20140189411A1 (2013), power control for cache structures.
  - id: c-mh-v3-flush-without-sleep
    text: >-
      Per a 2018 patent, one extra bit in the flush control register, which Handley assumes is at L2 level, lets the
      sleep flush machinery flush caches for software maintenance without putting the core to sleep
    loc: p016
    quote: "we add one extra bit to this control register so that the flush machinery goes through everything as before, except with that bit set, it omits the steps that before would put the CPU to sleep"
    method: patent-reading
    derivation: inferred
    hedge: "I assume L2-level"
    supports: []
    notes: US10552323B1 (2018). Handley thinks it serves I-cache and L1 maintenance, perhaps not TLB.
  - id: c-mh-v3-sleep-invalidate-queue
    text: >-
      Per a 2020 patent, a unit outside the core, which Handley assumes is the L2, records I-cache and TLB
      invalidations for a sleeping core and feeds them to it on waking, flushing the whole I-cache or TLB if the record
      overflows
    loc: p017
    quote: "external to the CPU (I assume the L2 since it's doing this sort of work in various other cases) records the various I-cache and TLB invalidation requests"
    method: patent-reading
    derivation: inferred
    hedge: "I assume"
    supports: []
    notes: US20220066941A1 (2020), storage array invalidation maintenance.
  - id: c-mh-v3-fiu-throttle
    text: >-
      Per a 2018 patent, cache and TLB maintenance requests for a core wait in a per-cluster Fabric Interface Unit, and
      a core that has taken enough of them refuses more until counters show it has made progress on normal code
    loc: p017
    quote: "something the patent calls The FIU, Fabric Interface Unit, which is a per-processor-complex object ... successive maintenance requests are held in a queue in the FIU, not the CPU"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US11080188B1 (2018). Handley reads it as protection against a guest OS flooding other cores with maintenance
      requests.
  - id: c-mh-v3-deferred-invalidate-poison
    text: >-
      Per a 2021 patent, a cache marks lines hit by invalidation requests as poisoned and synchronizes them in the
      background, stalling only accesses to poisoned lines and any barrier that needs full synchronization
    loc: p018
    quote: "rather than the cache handling each invalidation request immediately, it marks the relevant cache line as “poisoned”"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20230017473A1 (2021), filed after the M1 shipped; Handley suggests both this and the FIU scheme may end up implemented.
  - id: c-mh-v3-drowsy-l2
    text: >-
      The L2 is run as a drowsy cache: banks idle for some time sleep at a voltage that retains data and need a cycle
      or two to wake on access
    loc: p018
    quote: "banks that haven't been accessed for some time are put to sleep, with enough voltage to retain data, but requiring a cycle or two to wake up on access"
    method: patent-reading
    derivation: inferred
    value: 1.5
    range: [1, 2]
    unit: cycles
    supports: []
  - id: c-mh-v3-l2-sleep-by-way
    text: >-
      The unit put to sleep is one way of every set: with each way in its own independently powered bank, sleeping a
      bank leaves the other ways fully active and costs a wake-up cycle for lines in the sleeping way
    loc: p018
    quote: "The unit that is actually put to sleep is a way in each set."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Handley's 8-way L2 here is an illustration.
  - id: c-mh-v3-l2-sleep-leakage
    text: >-
      Per a 2014 patent, the idle count before an L2 bank sleeps is set from the part's characterized leakage and the
      temperature measured just before, so a leakier or hotter L2 sleeps banks sooner
    loc: p019
    quote: "Based on the temperature and the leakiness of the L2, an idle count is established."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9513693B2 (2014), L2 cache retention mode.
  - id: c-mh-v3-l2-12-ways-2014
    text: >-
      Per a 2014 patent, Apple's L2 then had 12 ways in three separately powered groups, so a third or two thirds of
      the cache could be powered down
    loc: p019
    quote: "at that time Apple's L2 had 12 ways, and these were split into three separately powered collections, so that either one third or two thirds of the cache could be powered down"
    method: patent-reading
    derivation: inferred
    value: 12
    unit: ways
    hedge: "Details have surely changed since then"
    supports: []
    notes: US20150309939A1 (2014), selective cache way-group power down.
  - id: c-mh-v3-l2-thirds
    text: >-
      Apple still seems to run the L2 and the L2 TLB in thirds (full, two thirds or one third active), which Handley
      gives as the reason both sizes are multiples of 3
    loc: p019
    quote: "Apple still seems to operate L2 (and TLB2) at a 3-way granularity, that is each of these can run at full capacity, at 2/3, or at 1/3 ... Hence L2 and TLB2 sizes being multiples of 3"
    method: patent-reading
    derivation: inferred
    value: 3
    unit: groups
    hedge: "seems to"
    supports: [l2.power_groups]
    notes: The idle third is either asleep or powered off. Consistent with the 12 MiB L2 and the 3072-entry L2 TLB.
  - id: c-mh-v3-l2-powerdown-counters
    text: >-
      Per the 2014 patent, three counters of references to each way group pick the third to power down, and three more
      count hits to the MRU, middle and LRU four ways of all sets to decide whether to power down at all
    loc: p019
    quote: "There are two orthogonal sets of three counters. One set counts the number of references to each of the three physical banks. The lowest value tells us which bank will be powered down."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      Modified lines in the chosen group are flushed first; the patent's cost also weighs lines held in L1s and how
      busy the group has been.
  - id: c-mh-v3-l2-powerup
    text: >-
      A powered-down part of the L2 comes back when the L2 misses often, with further tests for whether the misses
      involve reused lines rather than compulsory or streaming misses
    loc: p020
    quote: "Obviously the first signal is that you are missing frequently in the L2 (suggesting your L2 is too small)"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-slc-dup-tags-l2
    text: >-
      The SLC snoop-filters the L2s with duplicate L2 tags of its own, powered by way, so the matching way group of the
      duplicate tags powers down with the L2's
    loc: p020
    quote: "the SLC snoop-filters the L2, using a set of duplicated tags stored with the SLC. These duplicate tags are also powered by way"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9823730B2 (2015), power management of cache duplicate tags.
  - id: c-mh-v3-sparse-zero-lines
    text: >-
      A 2017 patent records all-zero line writes as a bit in the line's tag without writing the data array and serves
      reads of such lines without reading it; Handley thinks its diagrams look like the L2
    loc: p020
    quote: "don’t perform the write, instead note the line (eg by setting a bit in the cache line tag)"
    method: patent-reading
    derivation: inferred
    hedge: "to my eye, look L2-'ish"
    supports: []
    notes: US10691610B2 (2017). Vol 2 found no speed difference with all-zero data (c-mh-v2-zero-data).
  - id: c-mh-v3-sparse-loser-bank
    text: >-
      The same patent keeps invalid and all-zero lines in one loser bank that stays powered off until real data must
      be stored there, and repacks data later to power it down again
    loc: p021
    quote: 'maintain one cache bank as the "loser" banks holding the invalid lines and the "all zero" lines'
    method: patent-reading
    derivation: inferred
    supports: []

new_params:
  l2.inclusion:            {block: l2, name: L2 inclusion of L1 contents}
  l2.power_groups:         {block: l2, name: Separately powered L2 way groups, unit: groups}

new_mechanisms:
  barrier_colors:
    name: Color-tagged barriers at the L1-L2 boundary
    status: speculative
    description: Barriers advance a color tag on memory requests, and ordering is enforced between the L1 and the L2, not in the LSU.
    params: []
    patents: [US9582276B2]
    sim_switch: null
    detection_rule: a DMB between stores that hit in the L1 costs little, while one between stores that miss to the L2 waits for the earlier misses
  load_poison_bits:
    name: Load poison bits for load-load ordering
    status: speculative
    description: A load whose line is modified by another core before it becomes non-speculative is poisoned and replayed or flushed.
    params: []
    patents: [US9383995B2, US10747535B1, US9501284B2, US20200264888A1]
    sim_switch: null
    detection_rule: same-address loads on one core take extra machine clears only when another core writes the line between them
  l2_snoop_filter:
    name: L2 duplicate L1 tags (snoop filter and flush engine)
    status: speculative
    description: The L2 keeps duplicate tags of its cores' L1s, filters snoops for them, and drives a flush engine that pulls dirty L1 lines before a core powers down.
    params: [l2.inclusion]
    patents: [US9317102B2, US20140195737A1, US20140189411A1, US10552323B1, US20220066941A1]
    sim_switch: null
    detection_rule: an idle core keeps its L1 contents through the other cores' sharing traffic, and stores to lines no other L1 holds see no snoop delay
  l2_way_power:
    name: L2 way-group sleep and power-down
    status: speculative
    description: L2 ways sit in three separately powered groups that sleep after an idle count set by leakage and temperature, or power off when use is concentrated.
    params: [l2.power_groups]
    patents: [US9513693B2, US20150309939A1]
    sim_switch: null
    detection_rule: >-
      after an idle stretch the first L2 hits take one or two extra cycles, and after long light load the usable L2
      capacity drops to two thirds or one third until miss pressure restores it

mechanism_claims:
  barrier_colors: [c-mh-v3-barrier-colors, c-mh-v3-barrier-l1-l2]
  load_poison_bits: [c-mh-v3-load-poison, c-mh-v3-wfe-poison, c-mh-v3-lsq-cam-filter]
  l2_snoop_filter: [c-mh-v3-l2-dup-tags, c-mh-v3-l2-snoop-filter, c-mh-v3-l1-line-counters, c-mh-v3-l1-flush-walk, c-mh-v3-snoop-while-l1-sleeps, c-mh-v3-l1-flush-engine, c-mh-v3-flush-engine-in-l2, c-mh-v3-l2-flush-to-slc, c-mh-v3-dup-tag-power, c-mh-v3-flush-without-sleep, c-mh-v3-sleep-invalidate-queue]
  l2_way_power: [c-mh-v3-drowsy-l2, c-mh-v3-l2-sleep-by-way, c-mh-v3-l2-sleep-leakage, c-mh-v3-l2-12-ways-2014,
                 c-mh-v3-l2-thirds, c-mh-v3-l2-powerdown-counters, c-mh-v3-l2-powerup]
  coherence_duplicate_tags: [c-mh-v3-slc-dup-tags-l2]
