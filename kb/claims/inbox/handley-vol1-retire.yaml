  - id: c-mh-v1-retire-nops-56
    text: >-
      After a blocking FSQRT delay, the restart delay grows by 8 cycles per 450 NOPs queued behind it, so Retire
      clears about 56 NOPs per cycle
    loc: p118
    quote: "So the time it takes the ROB to clear 450 NOPs is 8 cycles, ie the machine clears 450/8=56 NOPs/cycle!"
    method: wong-probe
    filler: nop
    derivation: measured
    value: 56
    unit: instructions/cycle
    supports: []
    notes: >-
      Baseline restart delay 20 cycles; 33-FSQRT delay, 0-1800 NOPs, then 370 ADDs to use up registers.
  - id: c-mh-v1-rob-rows
    text: The ROB is best modelled as about 330 rows of instruction slots
    loc: p119
    quote: "the ROB is best thought of as consisting of ~330 \"rows\" where each row can hold 7 instructions."
    derivation: derived
    value: 330
    unit: groups
    approx: true
    hedge: best thought of
    supports: [retire.groups]
    notes: The NOP window gives ~324 rows (324*7=2268, c-mh-v1-nop-window); Handley says the load/store and branch probes supply the evidence
  - id: c-mh-v1-rob-row-slots
    text: Each ROB row holds up to 7 instructions, only the last (failable) slot doing real recovery work
    loc: p119
    quote: "only the failable slot of a 7-entry row of the ROB actually matters; the other 6 slots just hold"
    derivation: derived
    value: 7
    unit: uops
    supports: [retire.group_max_uops]
  - id: c-mh-v1-rob-failable-slot
    text: >-
      Failable instructions (branches, loads and stores) must take the last slot of a ROB row; other instructions
      may take any slot
    loc: p119
    quote: "Most instructions can go in any slot, but \"failable\" instructions must go in the last slot (which provides extra storage)."
    derivation: inferred
    supports: []
    notes: >-
      Even an unconditional B .+4 takes the failable slot. Differs from Johnson (c-dj-retire-groups, and the
      retire_groups description), who has memory uops starting a group and only branches ending one.
  - id: c-mh-v1-retire-rows-per-cycle
    text: Retire clears 8 ROB rows per cycle, so between 8 and 56 instructions
    loc: p119
    quote: "So a better way to think of Retire is that Retire can clear 8 ROB rows per cycle."
    derivation: derived
    value: 8
    unit: groups/cycle
    supports: [retire.rate_groups]
    notes: From the 56 NOPs/cycle drain and 7-slot rows
  - id: c-mh-v1-rob-row-counter
    text: >-
      The six non-failable slots of a row may not be stored at all: each of ~330 entries could hold the failable
      instruction and a 3-bit count of the others; not visible to tests
    loc: p119
    quote: "We can treat the ROB as ~330 entries which hold a pair (failable instruction, 3-bit counter)"
    derivation: inferred
    hedge: "seems a reasonable way to save a few transistors"
    supports: []
    notes: Suggested to Handley by Arthur V.
  - id: c-mh-v1-reg-free-rate
    text: >-
      Retire frees FP physical registers and their History File slots at about 16 per cycle: each extra 70 FABS
      behind the delay adds about 4 cycles
    loc: p121
    quote: >-
      I think it's legitimate to see clearing 70 FABS from the ROB as taking 4 cycles, so 17.5 clearances/cycle.
      Probably best to read that as 16 per cycle.
    method: wong-probe
    filler: fabs
    derivation: derived
    value: 16
    unit: entries/cycle
    hedge: "Probably best to read that as 16 per cycle."
    supports: [retire.rate_renames]
    notes: 50 extra CMPs add about 3 cycles (50/16), which Handley takes as confirmation; consistent with c-mh-v1-reg-free-16
  - id: c-mh-v1-hf-free-rate
    text: >-
      FMOV filler, whose History File entries free no register, gives the same delay as FABS, so History File slots
      are freed at 16 per cycle whether or not a register is released
    loc: p122
    quote: >-
      It appears that HF slots and registers are both freed at 16/cycle, there's no faster path for HF slots that
      are not freeing a physical register.
    method: wong-probe
    filler: fmov
    derivation: derived
    value: 16
    unit: entries/cycle
    hedge: It appears
    supports: [retire.rate_renames]
    notes: Filler FMOV d31, d30 in place of FABS
  - id: c-mh-v1-kip-930
    text: An ADD + FABS + STR mix reaches about 310 iterations, ~930 instructions, in flight before it stalls
    loc: p123
    quote: "we can in fact reach about 310 iterations of this before he see a jump! So ~930 realistic'ish instructions!"
    method: wong-probe
    filler: add+fabs+str
    derivation: measured
    value: 930
    unit: instructions
    approx: true
    hedge: "It might be possible to go slightly beyond this"
    supports: []
    notes: >-
      A lower bound for realistic code (History File slots for ADD and FABS, failable ROB slots for STR); Handley
      did not push further. Compare retire.issuing_window (~1000, Johnson).

  - id: c-mh-v1-int-prf-movimm
    text: "MOV x0, #1 filler maxes out at around 418 registers, about 38 more than ADDs"
    loc: p100
    quote: "The unexpected case is MOV x0, #1, which maxes out at around 418 physical registers."
    method: wong-probe
    filler: mov-imm
    derivation: measured
    value: 418
    unit: registers
    approx: true
    supports: []
    notes: >-
      Not the register file size: Handley reads the 418 as ~380 integer registers plus ~36 immediate registers
      (c-mh-v1-iregs-36).

new_params:
  int_prf.banks: {block: int_prf, name: Register file banks, unit: banks}

new_mechanisms:
  banked_prf_power:
    name: Banked register file with bank power gating
    status: speculative
    description: The register file has four banks that power down separately; waking one costs two or three cycles.
    params: [int_prf.banks, int_prf.total]
    sim_switch: null
    detection_rule: a small extra delay at the register-exhaustion knee that appears or vanishes when the delay changes by one cycle

