  - id: c-mh-v1-history-file
    text: >-
      A unit of ADD + FABS + 1/3 CMP jumps after 266 units, about 620 register allocations, with none of the int, FP
      or flags files exhausted, so a communal structure of ~620 entries is used by every register-writing
      instruction
    loc: p058
    quote: >-
      266*(2+1/3) =620 register allocations! ... there is some communal structure related to the allocation of
      registers, of size ~620 entries
    method: wong-probe
    filler: add+fabs+cmp
    derivation: measured
    value: 620
    unit: entries
    approx: true
    supports: [retire.rename_queue]
    notes: >-
      Measured in the "Register File Size (All Registers)" test. At the jump 266 int, 266 FP and 87 flags
      registers are in use. Handley names it the History File (see c-mh-v1-620-history-file-patent).

  - id: c-mh-v1-hf-walk
    text: >-
      Recovery rewinds a History File of register-mapping changes (Akkary's HBMAP+WALK) kept apart from the ROB and
      sized separately, with ROB entries pointing to History File entries
    loc: p061
    quote: >-
      HBMAP+WALK is essentially what Apple uses ... Apple separates those changes from the ROB into a separately
      sized History File, with a pointer in each ROB entry pointing to a History File entry
    derivation: inferred
    hedge: "or something like that"
    supports: []
    notes: >-
      The History File also marks when physical registers can be freed; Apple is the only
      company Handley knows of using one
  - id: c-mh-v1-adds-two-hf
    text: >-
      A FABS + ADD + 1/2 ADDS probe jumps at about 208 units (620/3 = 206), so flag-setting ALU instructions such
      as ADDS take two History File slots
    loc: p062
    quote: >-
      Instructions that both perform some other calculation and set the flags register (ie have two destination
      registers) require two HF slots.
    method: wong-probe
    filler: fabs+add+adds
    derivation: measured
    supports: []
  - id: c-mh-v1-hf-slot-rule
    text: >-
      History File slots are taken one per register rename: none for stores, PRFM or most special-register writes,
      one for a load, two for a load pair
    loc: p062
    quote: >-
      zero HF slots for stores ... one HF slot for standard loads ... two HF slots slots for load pair (which takes
      two destination registers). These are all confirmed.
    method: wong-probe
    derivation: measured
    supports: []
    notes: Agrees with Johnson's rename retire queue costs (c-dj-rename-cost); special registers "somewhat", some are renamed
  - id: c-mh-v1-spr-speculative-writes
    text: >-
      Per Apple's patent, flags moves are handled near the rename map, and other special-register writes proceed
      out of order into speculative storage and become permanent at retire, avoiding serialization
    loc: p062
    quote: >-
      Some easy cases (most obviously moving data to and from the flags register) are treated via machinery close
      to the Rename Mapping machinery.
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10838723B1 (2019); not tested on the M1 here
  - id: c-mh-v1-crack-merge
    text: >-
      Per Apple's patent, ADDS and LDP count as two for rename and the History File but execute as one, while ADD
      (shifted) counts as one for allocation and retire but executes as two, the shift result taken off the bypass
      without a register
    loc: p063
    quote: >-
      an ADDS or a LDP (load pair) want to be treated as two instructions for the purposes of register allocation
      (Rename) and deallocation (History File) but as a single instruction for the purposes of execute.
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US9223577B2 (2012). Handley says register-free bypass is used today only for a few cracked instructions
      (US10691457B1)
  - id: c-mh-v1-extr-intermediate
    text: EXTR, unlike ADD (shifted), allocates a physical register for its intermediate result
    loc: p063
    quote: "the EXTR instruction ... does allocate a genuine intermediate register"
    derivation: inferred
    supports: []
    notes: No method given
  - id: c-mh-v1-mov-last-reference
    text: >-
      For eliminated moves the M1 appears to use the last-physical-register-reference scheme rather than the older
      register duplication array or reference counts, with no limit on how many registers are duplicated
    loc: p065
    quote: >-
      The M1 appears to implements this more elegant scheme, and appears to show none of the limits one might
      expect from the two prior schemes.
    method: patent-reading
    derivation: inferred
    hedge: appears to
    supports: []
    notes: >-
      US20210064376A1 (2019) over US20130275720A1 (RDA, ~8 entries) and US20160026463A1 (free-list counts).
      Handley guesses the mapping lookup is a bit matrix, not a CAM.

  - id: c-mh-v1-no-width-split
    text: >-
      Apple's first 64-bit cores split the integer register file into about 40% 32-bit and 60% 64-bit registers;
      Handley finds no sign of that split on the M1
    loc: p105
    quote: >-
      in Apple's first 64-bit cores, the integer file was in fact split about 40% 32-bit registers and 60% 64-bit
      registers! ... Apple no longer does that (at least I can find no evidence for it)
    derivation: inferred
    hedge: "at least I can find no evidence for it"
    supports: []
    notes: US9639369B2 (2013)
  - id: c-mh-v1-prf-banks
    text: >-
      The physical register file is split into four banks that can be powered on or off individually, with
      allocation steered to keep as few banks active as possible
    loc: p107
    quote: >-
      we split our register file into multiple banks (the patent suggests 4, and I suspect that's still the case;
      it matches the results I have seen)
    method: patent-reading
    derivation: inferred
    value: 4
    unit: banks
    hedge: "I suspect that's still the case"
    supports: [int_prf.banks]
    notes: US10372500B1 (2016); Handley ties the delay glitch near 380 ADDs to it (c-mh-v1-bank-powerup)
  - id: c-mh-v1-free-list-scanners
    text: >-
      Per Apple's register-allocation patents, free registers are tracked in bitvectors searched by scanners (eight
      in the 2016 version), recently returned registers are reused first, and the bitvectors map onto banks so
      allocation stays in one powered bank
    loc: p107
    quote: >-
      rearranges the mapping of these bitvectors into the register banks so that all the (now eight rather than
      six) scanners are likely to find free registers in the same single bank
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20120143874A1 (2010), US20140013085A1 (2012), US10372500B1 (2016); "returning physical registers"
  - id: c-mh-v1-bank-powerup
    text: >-
      The small bump near 380 ADDs with a 46-cycle (not a 45-cycle) delay is allocation exhausting the one powered
      bank and waiting two or three cycles for another bank to power up
    loc: p108
    quote: >-
      Presumably the system copes by powering up one of the powered down banks, and that takes two or three cycles,
      generating the glitch we see.
    method: wong-probe
    filler: add
    derivation: inferred
    value: 2.5
    unit: cycles
    approx: true
    hedge: Presumably
    supports: []
    notes: >-
      Range two to three cycles. The model assumes 3/4 of ~380 registers (285) sit in the ROB
      during the delay. Handley is "open to alternative explanations".

