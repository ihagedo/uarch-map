# handley-vol1-retire.yaml
# Maynard Handley, 2025
# Retire queue, register files and history file (M1 Explainer vol 1).
session: handley-vol1-retire
source: handley-vol1

claims:
  - id: c-mh-v1-opt-guide-dtlb
    text: Citing Apple's CPU Optimization Guide, the M1 L1 data TLB has 160 entries
    loc: p002
    quote: "Likewise for L1D TLB M1 had 160 entries, A14 had 256 entries"
    method: secondhand
    derivation: reported
    value: 160
    unit: entries
    supports: [dtlb.l1_entries]
    notes: Handley relaying Apple's CPU Optimization Guide (apple-opt-guide)
  - id: c-mh-v1-opt-guide-a14-dtlb
    text: Citing Apple's CPU Optimization Guide, the A14 L1 data TLB has 256 entries, unlike the M1's 160
    loc: p002
    quote: "Likewise for L1D TLB M1 had 160 entries, A14 had 256 entries (as did M2, M3, and A15)"
    method: secondhand
    derivation: reported
    value: 256
    unit: entries
    chip: a14
    supports: []
    notes: Same Firestorm core, different dTLB size per Apple's guide; M2, M3 and A15 also 256
  - id: c-mh-v1-opt-guide-a14-slc
    text: Citing Apple's CPU Optimization Guide, the A14 has a 16 MiB system level cache
    loc: p002
    quote: "For example the A14 had 16MiB SLC"
    method: secondhand
    derivation: reported
    value: 16
    unit: MiB
    chip: a14
    supports: []
    notes: Handley relaying Apple's guide; A15 32 MiB, A16 24 MiB in the same sentence

  - id: c-mh-v1-security-tag-details
    text: >-
      Claiming registers with MOV xn, xn does not avoid the slow path for reading unclaimed registers (MOV xn, #0
      does), and leaving FP registers unclaimed causes no slowdown
    loc: p004
    quote: >-
      What if we use something like MOV xn, xn, rather than the current MOV xn, #0, to force the overwrite? That
      does not work! ... I can't generate the same sort of disaster by not forcing ownership of the FP registers
    method: throughput
    derivation: measured
    hedge: "My bet is on MOV xn, xn, being mapped to NOP."
    supports: []
    notes: >-
      Handley reads the FP result as the OS or interrupt not touching FP registers; he prefers the security-tag
      explanation over hardware context switching

  - id: c-mh-v1-l2-latency-aside
