# handley-vol1-retire.yaml
# Maynard Handley, 2025
# Retire queue, register files and history file (M1 Explainer vol 1).
session: handley-vol1-retire
source: handley-vol1

claims:
  - id: c-mh-v1-opt-guide-dtlb
    text: Citing Apple's CPU Optimization Guide, the M1 L1 data TLB has 160 entries
    loc: p002
    quote: "Likewise for L1D TLB M1 had 160 entries, A14 had 256 entries"
    method: secondhand
    derivation: reported
    value: 160
    unit: entries
    supports: [dtlb.l1_entries]
    notes: Handley relaying Apple's CPU Optimization Guide (apple-opt-guide)
  - id: c-mh-v1-opt-guide-a14-dtlb
    text: Citing Apple's CPU Optimization Guide, the A14 L1 data TLB has 256 entries, unlike the M1's 160
    loc: p002
    quote: "Likewise for L1D TLB M1 had 160 entries, A14 had 256 entries (as did M2, M3, and A15)"
    method: secondhand
    derivation: reported
    value: 256
    unit: entries
    chip: a14
    supports: []
    notes: Same Firestorm core, different dTLB size per Apple's guide; M2, M3 and A15 also 256
  - id: c-mh-v1-opt-guide-a14-slc
    text: Citing Apple's CPU Optimization Guide, the A14 has a 16 MiB system level cache
    loc: p002
    quote: "For example the A14 had 16MiB SLC"
    method: secondhand
    derivation: reported
    value: 16
    unit: MiB
    chip: a14
    supports: []
    notes: Handley relaying Apple's guide; A15 32 MiB, A16 24 MiB in the same sentence

  - id: c-mh-v1-security-tag-details
    text: >-
      Claiming registers with MOV xn, xn does not avoid the slow path for reading unclaimed registers (MOV xn, #0
      does), and leaving FP registers unclaimed causes no slowdown
    loc: p004
    quote: >-
      What if we use something like MOV xn, xn, rather than the current MOV xn, #0, to force the overwrite? That
      does not work! ... I can't generate the same sort of disaster by not forcing ownership of the FP registers
    method: throughput
    derivation: measured
    hedge: "My bet is on MOV xn, xn, being mapped to NOP."
    supports: []
    notes: >-
      Handley reads the FP result as the OS or interrupt not touching FP registers; he prefers the security-tag
      explanation over hardware context switching

  - id: c-mh-v1-l2-latency-aside
    text: An L2 hit takes around 15 cycles on the M1
    loc: p012
    quote: "the machine will not have to halt on a miss to L2 cache (around 15 cycles for M1)"
    derivation: reported
    value: 15
    unit: cycles
    approx: true
    hedge: around
    supports: []
    contradicts: [l2.latency]
    notes: >-
      Passing figure in the introductory ROB-size discussion, no method stated; 7-cpu gives 18 cycles
      (c-7cpu-l2-latency). Vol 2 measures the cache hierarchy.
  - id: c-mh-v1-slc-latency-aside
    text: A hit in the system level cache takes around 90 cycles on the M1
    loc: p012
    quote: "will usually cover the delay to the System Cache (around 90 cycles for M1)"
    derivation: reported
    value: 90
    unit: cycles
    approx: true
    hedge: around
    supports: [slc.latency]
    notes: Passing figure in the introductory ROB-size discussion, no method stated

  - id: c-mh-v1-sched-queue-36
    text: >-
      Each execution unit has its own scheduling queue of 36 entries, small next to Intel's 97 but more in total
    loc: p014
    quote: "separate queues in front of each. Each scheduling queue may sound small (36 entries compared to say Intel's 97)"
    method: secondhand
    derivation: reported
    value: 36
    unit: entries
    supports: []
    contradicts: []
    notes: >-
      From Johnson's diagram. Handley later halves the non-load/store sizes, since a queue pair looks like one queue:
      ~18 per FP queue, ~13 per integer queue (c-mh-v1-sched-johnson-2x).
  - id: c-mh-v1-14-units
    text: >-
      The M1 has fourteen execution units, each with its own scheduling queue, so it can issue up to 14 per cycle,
      against a sustained width of 8
    loc: p018
    quote: "there are fourteen units, each has an independent scheduling queue ... In the case of the M1, this is 8, not 14."
    method: secondhand
    derivation: reported
    value: 14
    unit: units
    supports: []
    notes: Unit count taken from Johnson's Firestorm page; 6 integer + 4 FP/SIMD + 4 load/store
  - id: c-mh-v1-read-at-issue
    text: >-
      Per Apple patents, operands are read from the register file at issue, not earlier, and scheduling tracks
      dependencies by instruction (scheduler) numbers rather than physical register numbers
    loc: p017
    quote: >-
      Apple patents explicitly say that registers are read at Issue time, not early; and they strongly suggest
      that scheduling is based on instruction numbers (called SCH#'s)
    method: patent-reading
    derivation: inferred
    hedge: strongly suggest
    supports: []
    notes: Patents cited are US9940262B2 and US8555040B2
  - id: c-mh-v1-fetch-16
    text: >-
      Fetch can probably bring in up to 16 instructions (one I-cache line) per cycle, one line per cycle, above
      the sustained width of 8
    loc: p019
    quote: >-
      Fetch can probably pull in a maximum width of 16 instructions (one cache line) in one cycle ... only one
      I-cache line is accessed per cycle
    derivation: inferred
    value: 16
    unit: instr/cycle
    hedge: probably
    supports: []
    contradicts: []
    notes: >-
      Forward reference to the Fetch discussion in vol 4 (c-mh-v4-fetch-16), no measurement here. Johnson's 8 is a
      pipeline width (c-dj-width), so this may be peak versus sustained fetch. The line size in bytes is not stated.

  - id: c-mh-v1-split-power-gating
    text: >-
      Both the register files and the L2 are split into independently managed pieces; the core runs from a
      fraction of each (e.g. a quarter of the register file, a third of the L2) and powers up the rest only when
      metrics show it would help
    loc: p025
    quote: >-
      they are in fact split into multiple independently managed smaller pieces ... or one third of the L2, with
      the rest powered down and taking no energy
    derivation: inferred
    supports: []
    notes: The fractions are given as examples ("eg"); see c-mh-v1-prf-banks for the four-bank register file
  - id: c-mh-v1-nop-rob-slot
    text: >-
      The M1 neither drops NOPs at decode nor fuses them with the next instruction (as recent Arm cores do); each
      NOP takes its own ROB slot
    loc: p027
    quote: >-
      Apple appears not to do this, at least not as of M1 ... so Apple don't do that, they apparently allocate a
      ROB slot to each NOP
    derivation: inferred
    hedge: apparently
    supports: []
    notes: The NOP window (c-mh-v1-nop-window) depends on this
  - id: c-mh-v1-llvm-fusions
    text: >-
      LLVM lists address, arithmetic-logic, CC-select and literal fusions for the A14, but whether the A14/M1
      implements them is unclear: latency and throughput tests show no gain
    loc: p028
    quote: >-
      It's unclear whether these fusions are present in A14/M1 (or in later chips). People investigating latency
      or throughput report no obvious improvement from these fusions
    method: secondhand
    derivation: reported
    hedge: "It's unclear whether these fusions are present in A14/M1"
    supports: []
    notes: >-
      FeatureFuseAddress, FeatureFuseArithmeticLogic, FeatureFuseCCSelect, FeatureFuseLiterals in AArch64.td.
      Handley suggests they could amplify History File capacity rather than cut latency; untested
  - id: c-mh-v1-hf-common-limit
    text: >-
      The History File, which records destination-register allocations, is perhaps the most common limit on how
      far the M1 can reorder
    loc: p029
    quote: >-
      perhaps the most common constraint as to how aggressively the M1 can reorder instructions is the size of
      the History File
    derivation: inferred
    hedge: perhaps
    supports: []
    notes: Handley later restates it as either the ~330 failable ROB slots or the History File limiting real code
  - id: c-mh-v1-fusion-patent
    text: >-
      Per Apple's arithmetic-branch fusion patent, fusion is detected at Decode and applied at Map by rewriting one
      instruction (CBZ into a SUB-CBZ) and discarding the other; ROB slots are already allocated, but the pair
      needs one scheduler slot and gives its result in one cycle
    loc: p031
    quote: >-
      fusion detection occurs at Decode and is implemented at Map ... only one Scheduling slot is required, not
      two, and the result is available in once cycle, not two
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9672037B2 (2013)

  - id: c-mh-v1-nop-throughput
    text: A stream of NOPs runs at 8 per cycle
    loc: p035
    quote: "We would expect that this should run at 8 NOPs/cycle, and that's exactly what we see."
    method: throughput
    filler: nop
    derivation: measured
    value: 8
    unit: instr/cycle
    supports: []
    notes: Handley also says NOPs take ROB slots yet run at 8/cycle, "presumably limited by Decode"
  - id: c-mh-v1-nop-window
    text: >-
      Behind a chained-FSQRT delay block, NOP filler first shows a timing glitch at 2228 NOPs, between the 2178 and
      2274 NOPs predicted for 21 and 22 FSQRTs, so the ROB holds about that many NOPs
    loc: p040
    quote: "We see trouble at 2228 between these two, so our ROB size is somewhere between these two."
    method: wong-probe
    filler: nop
    derivation: measured
    value: 2228
    unit: instructions
    approx: true
    hedge: "somewhere between these two"
    supports: [retire.nop_window]
    notes: >-
      Delay: chained FSQRT.D, 13 cycles each, 22 in the analysis. Handley concludes "The ROB is ~2274 instructions in
      size", ~324 rows of 7, later ~330 rows (c-mh-v1-rob-rows).

  - id: c-mh-v1-add-throughput
    text: Independent integer ADDs run at 6 per cycle
    loc: p049
    quote: "No surprises, the primary notable fact is the slope (6 independent integer adds/cycle)."
    method: throughput
    filler: add
    derivation: measured
    value: 6
    unit: instr/cycle
    supports: [eu_int.count]
  - id: c-mh-v1-int-prf-add
    text: >-
      With a delay block, independent ADD x0, x5, x5 filler jumps at ~378-380 instructions, read as the integer
      physical register file size
    loc: p050
    quote: "there's some sort of limitation at around 380 ADDs (seems like physical registers)"
    method: wong-probe
    filler: add
    derivation: measured
    value: 380
    unit: registers
    approx: true
    hedge: "seems like physical registers"
    supports: [int_prf.total]
    notes: >-
      The jump is at ~378 (=63*6) and Handley assumes "the actual physical register count is say 380".
      He later repeats that ADDs (register or immediate operand) "max out at around 380 physical registers".
  - id: c-mh-v1-regs-freed-at-retire
    text: >-
      Integer physical registers are freed at Retire, held while the head of the ROB is blocked, not as soon as
      all their readers have completed
    loc: p050
    quote: >-
      we've also learned that registers are deallocated at Retire (deallocation is delayed by the Head of ROB
      blocking) rather than some more ambitious schemes
    method: wong-probe
    filler: add
    derivation: measured
    hedge: "assuming the above point"
    supports: []
  - id: c-mh-v1-fabs-throughput
    text: Independent FABS run at 4 per cycle, and an ADD+FABS mix is throttled by the four FP pipes
    loc: p055
    quote: "shows a slope of 4 ops/cycle. We are throttled by the 4 fp pipes."
    method: throughput
    filler: fabs
    derivation: measured
    value: 4
    unit: instr/cycle
    supports: [eu_fp.count]
    notes: FABS alone gives the same 4/cycle slope
  - id: c-mh-v1-fp-prf
    text: With an integer (UDIV) delay block, FABS filler jumps at about 432, the FP/SIMD physical register file size
    loc: p055
    quote: "we see that the fp register file is perhaps closer to 432 or so in size."
    method: wong-probe
    filler: fabs
    derivation: measured
    value: 432
    unit: registers
    approx: true
    hedge: "perhaps closer to 432 or so"
    supports: [fp_prf.total]
    notes: With an FSQRT delay block the jump spans 403-425, centred ~415, because the delay holds FP registers
  - id: c-mh-v1-shared-pool-624
    text: >-
      An ADD+FABS probe jumps at about 312 pairs, short of both register files, so a pool of ~624 entries is shared
      by integer and FP register writes
    loc: p056
    quote: "There's an additional resource that constrains us, a pool of ~624 somethings that's shared by int and fp registers."
    method: wong-probe
    filler: add+fabs
    derivation: measured
    value: 624
    unit: entries
    approx: true
    supports: [retire.rename_queue]
  - id: c-mh-v1-flags-prf
    text: CMP filler exhausts the flags physical register file at about 124-128 entries
    loc: p056
    quote: "However the jump is at ~124 (128?) physical flags registers."
    method: wong-probe
    filler: cmp
    derivation: measured
    value: 128
    unit: registers
    approx: true
    hedge: "(128?)"
    supports: [flags_prf.total]
    notes: Jump measured at ~124; Handley uses ~128 from then on
  - id: c-mh-v1-cmp-throughput
    text: Independent CMP x0, x0 run at 3 per cycle
    loc: p056
    quote: "So no real surprises. This time the slope of the lines is 3 instructions per cycle"
    method: throughput
    filler: cmp
    derivation: measured
    value: 3
    unit: instr/cycle
    supports: []
  - id: c-mh-v1-frontend-8
    text: >-
      CMP+ADD+FABS triplets with no delay run at 8 instructions per cycle (600 triplets in 225 cycles), limited by
      the 8-wide Decode/Map front end
    loc: p057
    quote: "The limiting point is the 8-wide front end (Decode, Map) of the machine."
    method: throughput
    derivation: measured
    value: 8
    unit: instr/cycle
    supports: [decode.width, rename.width]

new_params:
  int_prf.banks: {block: int_prf, name: Register file banks, unit: banks}

new_mechanisms:
  banked_prf_power:
    name: Banked register file with bank power gating
    status: speculative
    description: The register file has four banks that power down separately; waking one costs two or three cycles.
    params: [int_prf.banks, int_prf.total]
    sim_switch: null
    detection_rule: a small extra delay at the register-exhaustion knee that appears or vanishes when the delay changes by one cycle

mechanism_claims:
  retire_groups: [c-mh-v1-nop-rob-slot, c-mh-v1-nop-window]
  rename_retire_queue: [c-mh-v1-shared-pool-624, c-mh-v1-hf-common-limit, c-mh-v1-regs-freed-at-retire]
  register_security_tag: [c-mh-v1-security-tag-details]
  banked_prf_power: [c-mh-v1-split-power-gating]
