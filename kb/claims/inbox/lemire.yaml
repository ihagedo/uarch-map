# lemire.yaml
# Daniel Lemire, 2021
# Memory-level parallelism of one core on the M1, M2 and M4, and the cost of a second access next to a random one.
session: lemire
source: lemire-m1-mlp

claims:
  - id: c-lem-m1-mlp-28
    text: One M1 core keeps about 28 random memory accesses in flight at once, possibly more
    loc: p001
    quote: "It looks like a single core has about 28 levels of memory parallelism ... and possibly more."
    derivation: measured
    value: 28
    unit: accesses
    approx: true
    hedge: "It looks like ... and possibly more"
    supports: []
    notes: >-
      A lower bound on misses in flight beyond the L1D from one core, not an L1D miss-buffer count (mshr.outstanding).
      The test is not described here; his lane test stops at 28 lanes (c-lem-m2-lanes).

  - id: c-lem-m1-adjacent
    text: >-
      In random byte gathers over a 1 GB array, also reading the byte after each address makes a 2-wise gather 40%
      slower, 8.9 to 12.5 ns per iteration, close to a 3-wise gather at 13.0 ns, so a second access next to a random
      one is not free
    loc: p001
    quote: "2-wise | 8.9 ns ... 2-wise + | 12.5 ns ... the last one is 40% more expensive than the first 2-wise function. It contradicts our prediction."
    method: throughput
    derivation: measured
    value: 40
    unit: "%"
    hedge: "The run-to-run variability is relatively high on such a test"
    supports: []
    notes: He gives no cause; the extra reads target the byte after each random address.

  - id: c-lem-m2-lanes
    source: lemire-m2-m4-mlp
    text: >-
      Split into lanes, a random pointer chase over an array of over 33 million 64-bit words shows one M2 core visibly
      sustaining 28 lanes, the most the test runs because more lanes are too noisy
    loc: p001
    quote: "I have to limit the number of lanes since beyond a certain point, there is too much noise. A maximum of 28 lanes works well. ... Both processors can visibly sustain 28 lanes."
    method: pointer-chase
    derivation: measured
    value: 28
    unit: lanes
    approx: true
    hedge: "I have to limit the number of lanes since beyond a certain point, there is too much noise"
    supports: []
    chip: m2
    notes: A floor, not a limit, since the test stops at 28 lanes. Same figure as the M1 (c-lem-m1-mlp-28).

  - id: c-lem-m4-lanes
    source: lemire-m2-m4-mlp
    text: One M4 core also sustains the full 28 lanes and runs the test only about 15% faster than the M2
    loc: p001
    quote: "the difference between the M4 and the M2 is not enormous (about 15%). Both processors can visibly sustain 28 lanes."
    method: pointer-chase
    derivation: measured
    value: 28
    unit: lanes
    approx: true
    supports: []
    chip: m4
    notes: The M4 uses LPDDR5X memory, the M2 LPDDR5. The test stops at 28 lanes.

new_params: {}
new_mechanisms: {}
mechanism_claims: {}
