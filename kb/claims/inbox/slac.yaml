# slac.yaml
# Tianhong Xu et al., 2026
# M1 SLC sets, ways, hashed set index and replacement, and how CPU and GPU accesses fill it.
session: slac
source: ccs26-slac

claims:
  - id: c-slac-sets
    text: >-
      Grouping lines by which GPU-filled SLC lines they evict, over a region 1.2 times the SLC size, gives 4,096
      groups, so the M1 SLC has 4,096 sets and a 12-bit set index
    loc: p005
    quote: "We set |Btest | to 1.2× the SLC size in our experiments. The clustering yields 4,096 clusters, indicating 4,096 SLC sets and therefore a 12bit set index."
    method: other
    derivation: measured
    value: 4096
    unit: sets
    supports: [slc.sets]
    notes: 8 GB M1. Each test line's eviction profile is read by timing CPU loads of a GPU-filled buffer.

  - id: c-slac-ways
    text: The M1 SLC is 16-way set associative, so filling it takes 65,536 line-sized blocks
    loc: p006
    quote: "With the Apple M1 SLC set associativity of 16 and 4,096 cache sets, SLC_ES contains 4,096 × 16 = 65,536 memory addresses in total"
    derivation: measured
    value: 16
    unit: ways
    supports: [slc.assoc]
    notes: >-
      Used throughout priming and probing, where 16 lines fill a set and evict all primed lines; no separate way-count
      test is described.

  - id: c-slac-size
    text: The paper's M1 diagram shows an 8 MB SLC shared by both CPU clusters and the GPU
    loc: p003
    quote: "8MB System Level Cache 8GB Unified Memory ... The SLC is shared across the two clusters and the GPU"
    method: secondhand
    derivation: reported
    value: 8
    unit: MiB
    supports: [slc.size]
    notes: Background figure without a source; the paper's own tests give 4,096 sets of 16 ways (c-slac-sets, c-slac-ways).

  - id: c-slac-line-128
    text: The index recovery takes the SLC line as 128 B and treats physical address bits 0 to 6 as the line offset
    loc: p005
    quote: "With 128-byte cache lines, the lowest 7 bits are offset bits, leaving 26 candidate bits contributing to the 12-bit SLC set index."
    derivation: inferred
    value: 128
    unit: B
    supports: [slc.line]
    notes: Assumed, not tested.

  - id: c-slac-index-hash
    text: >-
      Every one of the 12 SLC set-index bits is an XOR of several physical address bits between bit 7 and bit 32, and
      the hash spreads addresses nearly evenly over the sets
    loc: p004
    quote: "Section 3.3 shows that all 12 SLC set-index bits are computed by hash functions over multiple address bits"
    method: other
    derivation: measured
    value: "12 bits, each an XOR of several PA bits from 7 to 32"
    supports: []
    notes: >-
      One functionally equivalent set of 12 functions is recovered (Figure 4) from the physical addresses of each
      group, on an 8 GB M1 whose physical addresses use 33 bits.

  - id: c-slac-index-low-bits
    text: >-
      Each of the lower six SLC index functions takes one address bit from bits 7 to 12, so the 128 B lines of an
      aligned power-of-two block map to a contiguous run of distinct sets
    loc: p011
    quote: "Figure 4 shows that on Apple M1, for the lower 6 SLC set index bits, each is directly obtained from one address bit (within 7–12)."
    method: other
    derivation: measured
    value: "index bits 0-5 each take one of PA bits 7-12"
    supports: []
    notes: >-
      Contradicts the mechanism's 512 B line: neighbouring 128 B lines fall in different sets, not under one tag
      (c-mh-v8-slc-line-512). Also disagrees with c-exam-index-above-13.

  - id: c-slac-repl-lru
    text: >-
      GPU kernels that touch twice a set's ways in controlled orders, probed from the CPU, show SLC eviction follows
      access order: lines accessed earlier are replaced first, as under LRU
    loc: p005
    quote: "Across configurations, eviction is consistently access-order-dependent: lines accessed earlier are replaced before those accessed more recently, which is consistent with an LRU replacement policy"
    method: other
    derivation: measured
    value: LRU
    supports: []
    contradicts: [slc.replacement]
    notes: >-
      Lines placed by GPU reads. Disagrees with EXAM's pseudo-random finding (c-exam-repl-random) and with the patent
      reading c-mh-v3-slc-replacement.

  - id: c-slac-cpu-fill-via-l2
    text: >-
      A CPU load always fills the L2, and a line enters the SLC only when a full L2 set evicts it, so priming the SLC
      from the CPU takes a second set of lines that pushes the first out of the L2
    loc: p006
    quote: "the SLC acts as a backup buffer: when the CPU loads data from memory, it always goes to the L2 cache. Only when an L2 cache set is full, an older cache line is evicted to the SLC"
    method: other
    derivation: measured
    value: L2 victims
    supports: [slc.allocation]
    notes: Restates EXAM (c-exam-l2-victim-fill); the two-step CPU priming built on it fills the whole SLC.

  - id: c-slac-gpu-read-fills
    text: >-
      A line first read by the GPU sits in the SLC: the CPU's first access to it hits in the SLC, and later CPU
      accesses hit in the core's own caches
    loc: p004
    quote: "When the CPU first accesses data previously accessed only by the GPU, the access results in an SLC hit. Subsequent CPU accesses to the same data are then consistently served by the local caches."
    method: other
    derivation: measured
    value: true
    supports: []
    notes: Contradicts c-mh-v3-cpu-no-slc-alloc for GPU misses, which it says never allocate in the SLC.

  - id: c-slac-gpu-keeps-slc-copy
    text: >-
      When the GPU reads a CPU line that sits in the SLC, the SLC keeps its copy: the CPU's next access still hits in
      the SLC
    loc: p004
    quote: "After the GPU accesses data originally residing in the SLC, the CPU’s first subsequent access results in an SLC hit, and later accesses yield CPU local cache hits, indicating that GPU access does not invalidate the SLC copy"
    method: other
    derivation: measured
    value: true
    supports: []
    notes: The authors add that the line only changes to a shared state.

  - id: c-slac-gpu-snoop-l2
    text: >-
      After the GPU reads a line held in a CPU L2, the CPU keeps hitting in its own caches; the authors read this as
      the GPU taking the line straight from the L2 by coherence and leaving the CPU copy shared
    loc: p004
    quote: "subsequent CPU accesses continue to hit in local caches, and no new copy of the line appears in the SLC ... the GPU reads the line directly from the CPU L2 cache"
    method: other
    derivation: measured
    value: true
    supports: []
    notes: The shared state is the authors' reading, citing Apple coherence patents. Agrees with c-mh-v6-slc-coherent-gpu.

  - id: c-slac-no-slc-copy
    text: >-
      A GPU read of a buffer the CPU holds in its caches leaves a GPU-filled SLC buffer in place, so the GPU gets
      CPU-held lines through coherence without allocating them in the SLC
    loc: p014
    quote: "This means no new SLC copy is created when the target is already present in CPU private caches; the GPU obtains the data via the coherence path, and the CPU lines remain resident."
    method: other
    derivation: measured
    value: true
    supports: []
    notes: >-
      Both buffers about the SLC size. The authors call it an unusual non-inclusive behaviour on the GPU side,
      qualifying c-exam-gpu-inclusive. Agrees with c-mh-v3-slc-io-coherence.

  - id: c-slac-gpu-write-no-alloc
    text: GPU writes do not allocate lines in the SLC
    loc: p007
    quote: "However, GPU write-only cannot prime the SLC. Our experiments show that the GPU write operations do not allocate cache lines into the SLC."
    method: other
    derivation: measured
    value: true
    supports: []
    notes: >-
      Contradicts the mechanism for GPU writes: c-mh-v3-dma-write-slc has writes from non-CPU blocks stored in the
      SLC. A read after a write in the same kernel did not reliably bring the line in either.

  - id: c-slac-gpu-write-invalidates
    text: >-
      A GPU write removes stale copies of a line from the CPU caches and the SLC, so a following GPU read brings the
      line into the SLC; the authors' GPU-side priming relies on this
    loc: p007
    quote: "the first kernel writes to all SLC_ES memory blocks to invalidate any stale CPU private-cache copies or SLC copies, and the second kernel reads the same SLC_ES addresses to load these memory blocks into the SLC cache lines"
    derivation: inferred
    supports: []
    notes: The design reason for the write pass; the priming it enables gives a clean SLC state.

  - id: c-slac-background-evictions
    text: >-
      With no victim running, background work such as display updates still evicts a stable 1 to 4 lines per SLC set
      between priming and probing
    loc: p008
    quote: "even in the absence of a victim workload, a small number of cache lines (typically 1 to 4 per set) are evicted by persistent background activities such as display-related work, and these evictions are stable across runs"
    method: other
    derivation: measured
    value: 2.5
    range: [1, 4]
    unit: lines per set
    hedge: "typically"
    supports: []

  - id: c-slac-l2-index
    text: >-
      Citing earlier work, the paper says the L2 takes most set-index bits straight from physical address bits 7 to 13
      and 16 to 19 and hashes the other two from higher bits
    loc: p006
    quote: "The L2 cache derives most of its set index bits directly from physical address bits 7–13 and 16–19, while the remaining two index bits are generated through hashing over higher physical address bits"
    method: secondhand
    derivation: reported
    supports: []
    notes: Cites S2C (c-s2c-l2-index).

new_params:
  slc.sets: {block: slc, name: SLC sets, unit: sets}
  slc.assoc: {block: slc, name: SLC associativity, unit: ways}

new_mechanisms:
  slc_hashed_index:
    name: Hashed SLC set index
    block: slc
    status: measured
    description: >-
      The SLC picks one of 4,096 sets with 12 index bits, each an XOR of several physical address bits from bit 7 up,
      so addresses spread nearly evenly over the sets.
    params: [slc.sets]
    claims: [c-slac-sets, c-slac-index-hash]
    sim_switch: null
    detection_rule: >-
      SLC eviction sets fall into 4,096 congruence classes, and a buffer strided by up to 8 KiB still reaches about
      90% of the SLC.

mechanism_claims:
  slc_line_states: [c-slac-index-low-bits]
  slc_victim_fill: [c-slac-cpu-fill-via-l2, c-slac-gpu-read-fills, c-slac-gpu-keeps-slc-copy]
  coherence_duplicate_tags: [c-slac-gpu-snoop-l2, c-slac-gpu-write-invalidates]
  slc_memory_side: [c-slac-no-slc-copy, c-slac-gpu-write-no-alloc]
  l2_physical_index: [c-slac-l2-index]
