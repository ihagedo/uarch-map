# augury.yaml
# Jose Rodrigo Sanchez Vicarte et al., 2022
# The M1's array-of-pointers data memory-dependent prefetcher, measured from user space.
session: augury
source: sp22-augury

claims:
  - id: c-aug-dmp-exists
    text: The Firestorm cores have a single-level pointer-chasing prefetcher that recognises streaming or strided reads over an array of pointers and prefetches what later pointers point to
    loc: p001
    quote: "the Apple M1, M1 Max, M1 Pro, and A14 processors possess an Array-of-Pointers (AoP) prefetcher that recognizes streaming and striding reads and dereferences over an array of pointers"
    derivation: measured
    supports: []
    notes: Seen on M1, M1 Pro, M1 Max and A14.
  - id: c-aug-firestorm-only
    text: The DMP is present only on the Firestorm cores
    loc: p007
    quote: "We find the DMP to be present solely on Firestorm cores."
    derivation: measured
    supports: []
  - id: c-aug-icestorm-none
    text: Icestorm cores show no DMP speedup on the same array-of-pointers test
    loc: p008
    quote: "these speedups vanish when we run the same experiment on the M1's Icestorm cores"
    derivation: measured
    supports: []
    chip: icestorm
  - id: c-aug-single-level
    text: The DMP dereferences one level only; tests for two-level pointer chasing and for index-based indirection found neither
    loc: p009
    quote: "Both of the above experiments did not indicate the presence of other styles of DMP."
    derivation: measured
    value: 1
    unit: levels
    supports: [prefetch.dmp_levels]
  - id: c-aug-fills-l2
    text: Lines the DMP prefetches are found at L2 hit latency, so it prefetches into the L2 and probably sits beside it
    loc: p008
    quote: "the DMP prefetches into the L2 cache and is likely built alongside the L2."
    derivation: measured
    hedge: "likely"
    supports: []
    notes: Placement beside the L2 is the authors' inference from the fill level.
  - id: c-aug-stride-pf-l1
    text: A separate classical stride prefetcher fills the L1 and has its own depth and confidence, apart from the DMP
    loc: p008
    quote: "the M1 contains a separate classical (stride) prefetcher that prefetches data into the L1 cache"
    derivation: measured
    supports: []
  - id: c-aug-min-accesses
    text: The DMP activates only after at least three pointers in the array have been dereferenced
    loc: p009
    quote: "the DMP has a minimum confidence threshold of 3 accesses to activate at all"
    derivation: measured
    value: 3
    unit: accesses
    supports: [prefetch.dmp_min_accesses]
  - id: c-aug-depth-confidence
    text: How many pointers ahead the DMP prefetches grows with the number of matching accesses seen
    loc: p010
    quote: "the number of entries the DMP is willing to prefetch and dereference (depth) is clearly proportional to the number of accesses"
    derivation: measured
    supports: []
  - id: c-aug-align-8
    text: The DMP builds no confidence unless the pointers in the array sit on 8-byte boundaries
    loc: p009
    quote: "The M1 DMP will not build confidence if the addresses of the pointers in the AoP are not aligned to eight-byte boundaries."
    derivation: measured
    value: 8
    unit: B
    supports: []
  - id: c-aug-not-ip-indexed
    text: The DMP is not indexed by instruction address; an unrolled straight-line sequence of loads still trains it
    loc: p009
    quote: "We observed that the M1 DMP is not IP indexed."
    derivation: measured
    supports: []
  - id: c-aug-speculative-train
    text: Loads that are executed speculatively and later squashed are enough to activate the DMP
    loc: p009
    quote: "the DMP can be activated using only speculative memory accesses that are eventually squashed"
    derivation: measured
    supports: []
  - id: c-aug-barriers-block
    text: System calls or instruction and data barriers between the array accesses stop the DMP activating; delays, unrelated arithmetic and other loads do not
    loc: p009
    quote: "system calls and serialization such as instruction and data synchronization barriers4 placed between accesses to pointers in the AoP prevents the DMP from activating"
    derivation: measured
    supports: []
  - id: c-aug-backward
    text: The DMP also activates when the array of pointers is walked backwards
    loc: p010
    quote: "we found that the DMP will also activate when traversing an AoP backwards"
    derivation: measured
    supports: []
  - id: c-aug-max-distance
    text: With an 8 KiB stride the DMP reaches pointers up to 64 KiB, eight pointers, past the end of the trained array
    loc: p010
    quote: "a stride of 64 cache lines (8 KiB) enables the DMP to reach (access and dereference) a pointer 64 KiB (i.e., 8 pointers deep) away"
    derivation: measured
    value: 64
    unit: KiB
    supports: [prefetch.dmp_max_distance]
    notes: Table I gives the reach for each stride from 8 B to 8 KiB; it is not monotonic in stride.
  - id: c-aug-max-stride
    text: The DMP does not activate for strides larger than 8 KiB
    loc: p010
    quote: "We did not see the DMP activate for strides larger than 8 KiB (1024 pointers)."
    derivation: measured
    value: 8192
    unit: B
    supports: [prefetch.dmp_max_stride]
  - id: c-aug-pow2-stride
    text: The DMP activates only when the stride, counted in cache lines, is a power of two
    loc: p010
    quote: "the DMP does not activate when the stride, at cache line granularity, is not a power of two"
    derivation: measured
    supports: []
  - id: c-aug-16k-deadzone
    text: The DMP skips pointers held in the 128 bytes just after a 16 KiB boundary of the array, though it dereferences pointers on both sides of that gap
    loc: p011
    quote: "the DMP does not dereference pointers located in the 128 bytes immediately after the 16 KiB page boundary"
    derivation: measured
    value: 128
    unit: B
    supports: []
  - id: c-aug-2m-retrain
    text: The DMP never dereferences pointers past a 2 MiB boundary of the array; its confidence resets there and must be rebuilt
    loc: p011
    quote: "The DMP will not dereference any pointers past a 2 MiB boundary of the AoP. When a training loop crosses this boundary, the DMP's confidence resets"
    derivation: measured
    supports: []
  - id: c-aug-stride-crosses-16k
    text: The L1 stride prefetcher prefetches array lines across a 16 KiB page boundary
    loc: p011
    quote: "the L1 stride prefetcher (Section V-F1) prefetches AoP lines across the 16 KiB boundary"
    derivation: measured
    supports: []
  - id: c-aug-va-range
    text: Under macOS the DMP ignores pointer values between 0x280000000 and 0x7fe840004000; under Asahi Linux it follows pointers above 0xffff3f2b0000 but not below 0x280000000
    loc: p011
    quote: "on MacOS, the DMP will not dereference pointers contained in the AoP which have a virtual address between 0x280000000 and 0x7fe840004000"
    derivation: measured
    hedge: "we do not have an explanation"
    supports: []
  - id: c-aug-line-granularity
    text: The DMP uses a pointer value only down to L2 line granularity, the top 57 bits, and only if it is a valid virtual address
    loc: p011
    quote: "Only the top 57 bits of the address/value (i.e., L2 cacheline granularity) is transmitted, and only if they are a valid virtual address."
    derivation: inferred
    supports: []
  - id: c-aug-tlb-fill
    text: DMP prefetches walk the page tables and fill the TLB for the target pointers; a later access to such a target took about 28 cycles against about 111 when its TLB entry had been dropped
    loc: p012
    quote: "we conclude that the DMP does fill TLB entries"
    derivation: measured
    supports: []
    notes: Means of 27.95 and 110.83 PMC cycles over 250 runs each.
  - id: c-aug-not-disableable
    text: As far as the authors know, the DMP cannot be turned off by a software update
    loc: p013
    quote: "This DMP, to our knowledge, cannot be disabled via software updates."
    derivation: inferred
    hedge: "to our knowledge"
    supports: []
  - id: c-aug-l2-line
    text: L2 lines are 128 bytes
    loc: p004
    quote: "we found that L2 lines are 128 bytes"
    derivation: measured
    value: 128
    unit: B
    supports: [l2.line]
  - id: c-aug-l1-line
    text: L1 data cache lines are 64 bytes
    loc: p004
    quote: "and L1 lines are 64 bytes."
    derivation: measured
    value: 64
    unit: B
    supports: [l1d.line]
  - id: c-aug-l1-pair-fill
    text: An L1D fill brings in two adjacent 64-byte lines, each of which can then be evicted on its own
    loc: p004
    quote: "When filling L1d lines, two adjacent L1d lines are brought in at a time, and both are independently evictable."
    derivation: measured
    supports: []
    notes: GoFetch (c-gf-other-half-l2) finds the other half of the 128 B L2 line goes only to the L2.
  - id: c-aug-l1-8way
    text: The L1D is believed to be 8-way set associative, from experience building eviction sets
    loc: p004
    quote: "We also believe that the L1 is 8-way associative and the L2 is 16-way associative from our experience building eviction sets"
    derivation: inferred
    value: 8
    unit: ways
    hedge: "We also believe"
    supports: [l1d.assoc]
  - id: c-aug-l2-16way
    text: The L2 is believed to be 16-way set associative, from experience building eviction sets
    loc: p004
    quote: "We also believe that the L1 is 8-way associative and the L2 is 16-way associative from our experience building eviction sets"
    derivation: inferred
    value: 16
    unit: ways
    hedge: "We also believe"
    supports: [l2.assoc]
    notes: GoFetch, from the same lab, gives 12 ways (c-gf-l2-12way).
  - id: c-aug-l2-size
    text: The four Firestorm cores share a 12 MiB L2
    loc: p004
    quote: "The four Firestorm cores share a 12 MiB L2, and the Icestorm cores share 4 MiB."
    method: secondhand
    derivation: reported
    value: 12
    unit: MiB
    supports: [l2.size]
  - id: c-aug-ice-l2-size
    text: The four Icestorm cores share a 4 MiB L2
    loc: p004
    quote: "The four Firestorm cores share a 12 MiB L2, and the Icestorm cores share 4 MiB."
    method: secondhand
    derivation: reported
    value: 4
    unit: MiB
    supports: []
    chip: icestorm
  - id: c-aug-l1-sizes
    text: Each Firestorm core has a private 192 KiB L1 instruction cache and a 128 KiB L1 data cache
    loc: p004
    quote: "Each Firestorm core has a private 192 KiB L1 instruction cache and 128 KiB L1 data cache [11]."
    method: secondhand
    derivation: reported
    value: 128
    unit: KiB
    supports: [l1d.size, l1i.size]
    notes: Cites Apple's M1 launch event. The value field holds the L1D size.
  - id: c-aug-dram-scaling
    text: DRAM access times vary widely and fall under heavier DRAM load, which the authors put down to DRAM frequency scaling
    loc: p004
    quote: "We find that increasing the pressure on DRAM can reduce the average access time more than amortizing measurement costs would anticipate."
    derivation: measured
    supports: []
    notes: Attributed to DRAM controller frequency scaling reported by Hector Martin.
  - id: c-aug-no-smt
    text: The M1 has no simultaneous multithreading
    loc: p004
    quote: "does not support any form of Simultaneous Multi-Threading (SMT)."
    derivation: reported
    method: secondhand
    supports: []
  - id: c-aug-clock
    text: Apple gives the Firestorm cores a maximum clock of 3.2 GHz
    loc: p007
    quote: "Apple reporting a maximum clock speed of 3.2 GHz for the Firestorm cores"
    method: secondhand
    derivation: reported
    value: 3.2
    unit: GHz
    supports: [pcluster.clock_max]
  - id: c-aug-a14
    text: The same DMP is present on the A14
    loc: p003
    quote: "We have confirmed that our findings apply to the A14 (iPhone 12) and the new M1 Max at a minimum."
    derivation: measured
    supports: []
    chip: a14

new_params:
  prefetch.dmp_levels:        {block: prefetch, name: DMP dereference levels, unit: levels, mechanism: content_directed_prefetch}
  prefetch.dmp_min_accesses:  {block: prefetch, name: DMP activation threshold, unit: accesses, mechanism: content_directed_prefetch}
  prefetch.dmp_max_stride:    {block: prefetch, name: DMP maximum stride, unit: B, mechanism: content_directed_prefetch}
  prefetch.dmp_max_distance:  {block: prefetch, name: DMP maximum reach past the trained array, unit: KiB, mechanism: content_directed_prefetch}

mechanism_claims:
  content_directed_prefetch: [c-aug-dmp-exists, c-aug-firestorm-only, c-aug-single-level, c-aug-fills-l2, c-aug-min-accesses,
    c-aug-depth-confidence, c-aug-align-8, c-aug-not-ip-indexed, c-aug-max-distance, c-aug-max-stride, c-aug-2m-retrain,
    c-aug-tlb-fill]
