# dougall-amx.yaml
# Dougall Johnson, 2020
# How the M1 cores send work to AMX, its register state, FMA timing and the cost of mixing core and AMX memory accesses.
session: dougall-amx
source: dougall-amx

claims:
  - id: c-dj-amx-nonspec
    text: AMX is a non-speculative coprocessor, and the cores post its operations to it through their store units
    loc: p001
    quote: "AMX functions as a non-speculative coprocessor, with operations posted to it ... via the store units of the CPU cores."
    derivation: measured
    supports: []
  - id: c-dj-amx-fuse-port
    text: Two AMX instructions that are not loads or stores can fuse so that together they take a single store port
    loc: p001
    quote: "Non-load/store AMX instructions can be ... fused with other non-load/store AMX instructions, to only use one store ... port."
    derivation: measured
    supports: []
    notes: Agrees with c-dj-fusion-amx and adds that the fused pair uses one store port.
  - id: c-dj-amx-prefetch
    text: AMX operations do not go through the core's out-of-order execution, so a core prefetch placed just before an AMX load or store can help, since prefetches do execute out of order
    loc: p001
    quote: "Because it doesn't go through the main processors out-of-order execution, it ... can be beneficial to add prefetch instructions (which do) immediately before ... AMX stores (and loads)."
    derivation: inferred
    hedge: "can be beneficial"
    supports: []
  - id: c-dj-amx-gpr-operand
    text: Every AMX operation except enable and disable takes one 64-bit general register whose bits hold the operation's parameters, such as the address of a load or store
    loc: p001
    quote: "All other operations (op=0-16 and op=18-22) seem to take a 64-bit register ... number (X0-X30 or 31=XZR) as the operand. ... This register is typically a bitfield containing further parameters to the ... operation."
    derivation: measured
    hedge: "seem to"
    supports: []
  - id: c-dj-amx-p-unit
    text: The four Firestorm cores of the M1 share one AMX coprocessor
    loc: p001
    quote: "The M1 has two AMX coprocessors, one used by the four Firestorm cores, and"
    derivation: measured
    value: 1
    unit: units
    supports: [amx.units]
    notes: Agrees with c-mh-v8-amx-per-cluster.
  - id: c-dj-amx-e-unit
    text: The four Icestorm cores of the M1 share a second, separate AMX coprocessor
    loc: p001
    quote: "The M1 has two AMX coprocessors ... another used by the four Icestorm cores."
    derivation: measured
    value: 1
    unit: units
    supports: []
    chip: icestorm
    notes: c-mh-v8-amx-per-cluster and amx_shared_contexts count only P-cluster units; this adds a unit for the E-cluster.
  - id: c-dj-amx-four-copies
    text: Each AMX coprocessor keeps four copies of the architectural register state, one for each core of its cluster
    loc: p001
    quote: "Each coprocessor stores four copies ... of the architectural register state, one for each core."
    derivation: measured
    value: 4
    unit: sets
    supports: [amx.register_sets]
    notes: Agrees with c-mh-v8-amx-reg-sets.
  - id: c-dj-amx-l2
    text: The AMX coprocessors reach memory through the same L2 cache as the cores
    loc: p001
    quote: "These access memory ... via the same L2 cache as the cores"
    derivation: measured
    supports: []
  - id: c-dj-amx-clock
    text: The AMX coprocessors seem to run at about the same clock as the cores
    loc: p001
    quote: "seem to run at around the same clock ... speed as the cores."
    derivation: measured
    hedge: "seem to"
    supports: []
  - id: c-dj-amx-latency
    text: The P-cluster AMX is an array of pipelined FMAs with a latency of four cycles
    loc: p001
    quote: "The performance-variant consists of an array of 4-cycle latency, pipelined ... FMAs"
    derivation: measured
    value: 4
    unit: cycles
    supports: [amx.fma_latency]
    notes: Agrees with c-mh-v8-amx-fma-4.
  - id: c-dj-amx-fma-tput
    text: The P-cluster AMX completes one fp32 or fp64 FMA instruction per cycle
    loc: p001
    quote: "giving a throughput of one FMA32 or FMA64 instruction per cycle"
    derivation: measured
    value: 1
    unit: instr/cycle
    supports: [amx.fma_throughput]
  - id: c-dj-amx-fma16
    text: The P-cluster AMX completes only one fp16 FMA instruction every two cycles
    loc: p001
    quote: "only one FMA16 instruction every two cycles."
    derivation: measured
    value: 2
    unit: cycles/instr
    supports: []
  - id: c-dj-amx-e-latency
    text: The E-cluster AMX also has a four-cycle fp32 and fp64 FMA latency
    loc: p001
    quote: "The efficiency-variant still has 4-cycle FMA32/FMA64 latency"
    derivation: measured
    value: 4
    unit: cycles
    supports: []
    chip: icestorm
  - id: c-dj-amx-e-tput
    text: The E-cluster AMX completes one fp32 or fp64 FMA instruction every four cycles and one fp16 FMA every eight
    loc: p001
    quote: "only perform one FMA32 or FMA64 instruction every four cycles, or one ... FMA16 instruction every eight cycles."
    derivation: measured
    value: 4
    unit: cycles/instr
    supports: []
    chip: icestorm
  - id: c-dj-amx-indep-z
    text: One core reaches one FMA per cycle only when successive FMAs write independent parts of Z, chosen with a Z offset
    loc: p001
    quote: "To achieve 1-cycle throughput from a single core, the destinations must be ... independent (using a Z offset)."
    derivation: measured
    supports: []
  - id: c-dj-amx-more-cores
    text: Operations that use too much of Z run slower from one core, and spreading them over several cores, each with its own Z, raises throughput
    loc: p001
    quote: "Operations which use too much of the Z ... register will have lower throughput. Throughput can also be improved using ... different cores (and therefore entirely different Z registers)."
    derivation: measured
    supports: []
  - id: c-dj-amx-mac16-32
    text: An expanding 16-bit to 32-bit FMA fills all of Z with 1024 results, so one core issues one every four cycles and two P-cores together one every two
    loc: p001
    quote: "an expanding 16-bit -> 32-bit FMA uses the full Z register ... so has a throughput of one every four cycles, ... but this can be doubled to one every two cycles by running on two"
    derivation: measured
    value: 4
    unit: cycles/instr
    supports: []
  - id: c-dj-amx-ooo
    text: AMX has some out-of-order execution, from a buffer of roughly 28 to 32 operations
    loc: p001
    quote: "There is some out-of-order execution capability on the co-processor (currently ... estimated at a 28 to 32 operation buffer, with very low confidence)."
    derivation: measured
    value: 30
    unit: ops
    approx: true
    range: [28, 32]
    hedge: "with very low confidence"
    supports: [amx.ooo_buffer]
  - id: c-dj-amx-fma-overlap
    text: Thanks to this out-of-order capability, four FMAs fit inside the 9-cycle window of an X and Y load at almost no extra cost
    loc: p001
    quote: "Because of the out-of-order capabilities, performing four fmas fits within ... this 9-cycle window at essentially no extra cost"
    method: throughput
    derivation: measured
    value: 9
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-ldst-bound
    text: AMX loads and stores, not arithmetic, seem to limit AMX throughput
    loc: p001
    quote: "Loads and stores seem to be the bottleneck."
    derivation: measured
    hedge: "seem to be"
    supports: []
  - id: c-dj-amx-l1-penalty
    text: AMX loads and stores appear to go through the L2, paying a slight penalty when the data sits in a core's L1
    loc: p001
    quote: "but appear to go via L2, with slight penalties ... for data in L1."
    derivation: measured
    hedge: "appear to"
    supports: []
    notes: Agrees with c-mh-v3-amx-from-l2.
  - id: c-dj-amx-ldxy-9
    text: At best a loop loads 128 bytes into X and 128 bytes into Y every 9 cycles
    loc: p001
    quote: "At best I've seen loads of 0x80 bytes to x and 0x80 bytes to y in 9 cycles"
    method: throughput
    derivation: measured
    value: 9
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-stx-28
    text: A loop of AMX stores from X takes 28 cycles per iteration with only a nop or add before each store, against 9 for the matching load loop
    loc: p001
    quote: "nop/add before AMXSTX: 28 cycles/iter"
    method: throughput
    derivation: measured
    value: 28
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-mix-slow
    text: Mixing core loads and stores with AMX loads and stores slows things down badly, presumably from the synchronization that keeps memory consistent between them
    loc: p001
    quote: "Mixing loads and stores on the main processor with co-processor loads and stores ... causes big slowdowns, presumably due to the synchronization needed to ensure a ... consistent view of memory."
    derivation: measured
    hedge: "presumably"
    supports: []
  - id: c-dj-amx-str-ldx
    text: A non-aliasing core store before each AMX X load slows the loop from 9 to 47 cycles per iteration
    loc: p001
    quote: "nop/add before AMXLDX: 9 cycles/iter ... str before AMXLDX (no-aliasing): 47 cycles/iter"
    method: throughput
    derivation: measured
    value: 47
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-str-ldx-alias
    text: An aliasing core store before each AMX X load slows the loop to 93 or 103 cycles per iteration
    loc: p001
    quote: "str before AMXLDX (aliasing): 93 or 103 cycles/iter"
    method: throughput
    derivation: measured
    value: 98
    unit: cycles/iter
    range: [93, 103]
    supports: []
  - id: c-dj-amx-ldr-ldx
    text: A non-aliasing core load before each AMX X load costs little, 11 cycles per iteration against 9
    loc: p001
    quote: 'ldr before AMXLDX (no-"aliasing"): 11 cycles/iter'
    method: throughput
    derivation: measured
    value: 11
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-ldr-ldx-alias
    text: An aliasing core load before each AMX X load slows the loop to 66 cycles per iteration
    loc: p001
    quote: 'ldr before AMXLDX ("aliasing"): 66 cycles/iter'
    method: throughput
    derivation: measured
    value: 66
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-str-stx
    text: A non-aliasing core store before each AMX X store slows the loop from 28 to 48 cycles per iteration
    loc: p001
    quote: "str before AMXSTX (no-aliasing): 48 cycles/iter"
    method: throughput
    derivation: measured
    value: 48
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-str-stx-alias
    text: An aliasing core store before each AMX X store slows the loop to 115 cycles per iteration
    loc: p001
    quote: "str before AMXSTX (aliasing): 115 cycles/iter"
    method: throughput
    derivation: measured
    value: 115
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-ldr-stx
    text: A non-aliasing core load before each AMX X store slows the loop from 28 to 31 cycles per iteration
    loc: p001
    quote: "ldr before AMXSTX (no-aliasing): 31 cycles/iter"
    method: throughput
    derivation: measured
    value: 31
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-ldr-stx-alias
    text: An aliasing core load before each AMX X store slows the loop to 112 cycles per iteration
    loc: p001
    quote: "ldr before AMXSTX (aliasing): 112 cycles/iter"
    method: throughput
    derivation: measured
    value: 112
    unit: cycles/iter
    supports: []
  - id: c-dj-amx-state
    text: The AMX state is two 512-byte registers, X and Y, and one 4096-byte register, Z
    loc: p001
    quote: 'The coprocessor state consists of two 0x200 byte "registers", amx0 ("x") ... and amx1 ("y"), and one 0x1000 byte register amx2 ("z").'
    derivation: measured
    value: 4096
    unit: B
    supports: []
  - id: c-dj-amx-apple-z
    text: Apple's headers describe Z as 64 registers in an M-by-N matrix, each 64-byte row of X, Y and Z being one register
    loc: p001
    quote: 'describe only "z" as being "64 registers in an M-by-N ... matrix"'
    derivation: documented
    value: 64
    unit: registers
    supports: []
  - id: c-dj-amx-enable
    text: AMX must be enabled with its own instruction first, and any other AMX instruction run while it is disabled is an illegal instruction
    loc: p001
    quote: 'If instructions other than "enable" are executed when AMX is not enabled, ... they are treated as illegal instructions.'
    derivation: measured
    supports: []
  - id: c-dj-amx-ldst-size
    text: An AMX load or store moves 64 bytes, or an aligned 128 bytes when a flag bit is set
    loc: p001
    quote: "a 1-bit flag in bit 62 (acting as an 0x40 byte load/store ... when zero, or an 0x80 byte (but aligned) load/store when one)."
    derivation: measured
    supports: []
  - id: c-dj-amx-fma-shapes
    text: An fp64 multiply-add forms an 8x8 outer product of 64 results, and an fp32 one a 16x16 product of 256 results, added into spaced rows of Z
    loc: p001
    quote: "8x8 double multiplies for 64 results, added ... 16x16 float multiplies for 256 results, added"
    derivation: measured
    supports: []
  - id: c-dj-amx-extr
    text: Two move operations copy a 64-byte row from Z or Y into X, or a 64-byte column of Z (or a row of X) into Y, without going through memory
    loc: p001
    quote: "move a 64-byte row from z or y to x ... move a 64-byte column from z to x or y, or move a 64-byte row from x to y"
    derivation: measured
    supports: []

new_params:
  amx.fma_latency: {block: amx, name: AMX FMA latency, unit: cycles}
  amx.fma_throughput: {block: amx, name: AMX fp32/fp64 FMA instructions per cycle, unit: instr/cycle}
  amx.ooo_buffer: {block: amx, name: AMX out-of-order buffer, unit: ops}

new_mechanisms:
  amx_z_dependency_window:
    name: AMX out-of-order window without Z renaming
    block: amx
    status: measured
    description: >-
      AMX reorders operations within a small buffer but does not rename Z, so an operation into a Z range waits
      out the 4-cycle FMA latency of the last one there, and a core needs four independent Z ranges to issue an
      outer product every cycle.
    params: [amx.fma_latency, amx.fma_throughput, amx.ooo_buffer]
    claims: [c-dj-amx-latency, c-dj-amx-fma-tput, c-dj-amx-fma16, c-dj-amx-indep-z, c-dj-amx-more-cores,
             c-dj-amx-mac16-32, c-dj-amx-ooo, c-dj-amx-fma-overlap]
    sim_switch: null
    detection_rule: >-
      One core's outer-product throughput rises in step with the number of independent Z accumulators up to four
      and then stays flat, while a second core's own Z adds more.

mechanism_claims:
  amx_lsu_issue: [c-dj-amx-nonspec, c-dj-amx-fuse-port, c-dj-amx-prefetch, c-dj-amx-gpr-operand]
  amx_shared_contexts: [c-dj-amx-p-unit, c-dj-amx-e-unit, c-dj-amx-four-copies]
  amx_datapath: [c-dj-amx-l2, c-dj-amx-l1-penalty, c-dj-amx-ldst-bound, c-dj-amx-ldxy-9, c-dj-amx-stx-28,
                 c-dj-amx-state, c-dj-amx-apple-z, c-dj-amx-e-latency, c-dj-amx-e-tput]
  coprocessor_ordering_table: [c-dj-amx-mix-slow, c-dj-amx-str-ldx, c-dj-amx-str-ldx-alias, c-dj-amx-ldr-ldx,
                               c-dj-amx-ldr-ldx-alias, c-dj-amx-str-stx, c-dj-amx-str-stx-alias,
                               c-dj-amx-ldr-stx, c-dj-amx-ldr-stx-alias]
  amx_op_set: [c-dj-amx-enable, c-dj-amx-ldst-size, c-dj-amx-fma-shapes, c-dj-amx-extr]
