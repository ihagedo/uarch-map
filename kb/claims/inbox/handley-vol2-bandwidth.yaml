# handley-vol2-bandwidth.yaml
# Maynard Handley, 2025
# Load, store and copy bandwidth from L1 to DRAM (M1 Explainer vol 2).
session: handley-vol2-bandwidth
source: handley-vol2

claims:
  - id: c-mh-v2-l1-bw-internet
    text: >-
      Handley puts the M1's L1 load bandwidth at 150 GB/s and attributes internet reports of ~100 GB/s to reduction
      code that limits the loop before the cache does
    loc: p090
    quote: "I think insufficient attention to this fact is why some internet reports for the M1 show its L1 load bandwidth as ~100GB/s rather than the 150GB/s it’s really capable of."
    derivation: measured
    value: 150
    unit: GB/s
    approx: true
    hedge: "I think"
    supports: []
    notes: The measurement behind the 150 GB/s is the LDPQ loop.
  - id: c-mh-v2-zero-data
    text: >-
      Runs over all-zero data were neither faster nor slower than runs over non-zero data, so no performance
      special case for zeroed lines was found
    loc: p091
    quote: "I did not discover any interesting cases where zero’d data is faster (or slower) than no-zero’d data."
    method: throughput
    derivation: measured
    supports: []
    notes: >-
      Tested against Apple's sparse-data patent US10691610B2; Handley suggests it may be unimplemented or save
      power only.
  - id: c-mh-v2-clock-variation
    text: >-
      During the bandwidth runs the clock mostly stays between 3 and 3.2 GHz, but after long memory-bound stretches
      with little CPU activity it drops as low as 2.11 GHz or even 1.74 GHz
    loc: p093
    quote: "for the most part the frequency stays between 3 and 3.2 GHz ... the frequency drops to as low as 2.11GHz or even 1.74GHz"
    method: other
    derivation: measured
    supports: []
    notes: The harness records both cycles and real time, giving the frequency per run.
  - id: c-mh-v2-l1-bw-150-ceiling
    text: >-
      Under ideal conditions the core reaches the 150 GB/s case from L1, about six 8 B loads per cycle, but no
      higher
    loc: p095
    quote: "We see that the CPU can clearly (under ideal conditions) hit the 150GB/s case (~6 8B loads/cycle) but no higher."
    method: throughput
    derivation: measured
    value: 150
    unit: GB/s
    approx: true
    supports: []
    notes: >-
      The theoretical cases on the same page are 24 B/cycle (~75 GB/s) for three 8 B loads, 48 B/cycle (150 GB/s)
      for three load pairs and 96 B/cycle (300 GB/s) for three vector pairs; the measured ceiling is the middle one.
  - id: c-mh-v2-l1-load-paths
    text: >-
      Two load units and the load/store unit give three loads per cycle, over three 16 B load paths from the L1D to
      the LSU; a load vector pair is cracked in the LSU into two 16 B cache transactions
    loc: p095
    quote: "two dedicated load units, and one ambidextrous unit, so we can perform 3 ... three load paths from the L1D to the LSU, each 16B wide"
    derivation: inferred
    value: 3
    unit: loads/cycle
    supports: [lsu.loads_per_cycle]
    notes: Offered as the explanation for the 150 GB/s ceiling (48 B/cycle = three 16 B paths).
  - id: c-mh-v2-naive-reduction-100
    text: >-
      The naive sum loop and the STL accumulate() version compile to the same vectorized LDPQ code and run at about
      100 GB/s (32 B/cycle) from L1
    loc: p097
    quote: "(we'd hope so given identical assembly) and run at essentially 100GB/s (ie 32B/cycle"
    method: throughput
    derivation: measured
    value: 32
    unit: B/cycle
    approx: true
    supports: []
    notes: >-
      Code-limited, not a cache limit: Handley's realistic-code figure. Kernel per iteration: two LDPQ, four
      two-lane vector adds, SUBS, B.NE.
  - id: c-mh-v2-scalar-reduction-width
    text: >-
      The hand-split 8-way scalar reduction cannot vectorize; three scalar load pairs need six adds plus loop
      overhead per cycle, so it is limited by machine width, not by the LSU or cache
    loc: p097
    quote: "M1 is wide, but it is not (3+6+2 wide!) So we’re no longer throttled by LSU or cache issues ... simply by the width of the machine compared to the width of our inner loop."
    derivation: inferred
    supports: []
    notes: The Reduction 8Wide table rows run at about 74-76 GB/s.
  - id: c-mh-v2-ldp-32
    text: >-
      Assembly loops of LDP or LDNP (scalar pairs, 16 B per load) run at about 110 GB/s from L1, about 32 B per cycle
      plus 10%
    loc: p098
    quote: "The first two loops (running at about 110GB/s) are loops of either ... They give us basically 32B(+ about 10%) per cycle."
    method: throughput
    derivation: measured
    value: 110
    unit: GB/s
    approx: true
    supports: []
  - id: c-mh-v2-ldnp-l1-ignored
    text: The non-temporal hint makes no difference to loads that hit in L1 (LDNP matches LDP, LDNPQ matches LDPQ)
    loc: p098
    quote: "You’d think the N would be irrelevant for loads that hit in L1, and that’s what we see."
    method: throughput
    derivation: measured
    supports: []
    notes: Handley adds the guess that the L1 ignores the hint when the data is already in cache.
  - id: c-mh-v2-ldpq-48
    text: >-
      Assembly loops of LDPQ or LDNPQ (vector pairs, 32 B per load) run at almost 150 GB/s from L1, almost 48 B per
      cycle
    loc: p098
    quote: "And these two little monsters manages to run at almost 150GB/s, almost 48B/cycle!"
    method: throughput
    derivation: measured
    value: 48
    unit: B/cycle
    approx: true
    hedge: almost
    supports: [l1d.load_bw]
    notes: A later table shows LDPQ at 47.59 B/cycle (152 GB/s) at an 87 KB footprint.
  - id: c-mh-v2-ldpq-cracked-lsu
    text: >-
      Counters show an LDPQ retires as one instruction (one ROB slot) but sends two uops through the load unit, so the
      vector load pair is cracked inside the LSU into two single-vector loads; an LDP is one instruction and one
      load-unit uop
    loc: p100
    quote: "this means the vector load pair is cracked inside the LSU (so one LDP Qx, Qy is a single ROB instruction but is split in the LSU into two uOps that each load a single vector"
    method: counter
    derivation: inferred
    hedge: "To my mind"
    supports: []
    notes: >-
      Retired loads 1/4 and load-unit uops (LD_UNIT_UOP) 1/2 per int64 for LDPQ; 1/2 and 1/2 for LDP.
      Handley does not know whether the split comes after the TLB lookup.
  - id: c-mh-v2-reduction-simd-latency
    text: >-
      Every SIMD operation on the M1, even ADD or ABS, has two-cycle latency, and this dependency chain, not the
      cache, holds the compiler's vectorized reductions to about 100 GB/s
    loc: p100
    quote: "On the M1 every SIMD operation, even the most simple (like ADD or ABS), has a latency of two cycles."
    derivation: inferred
    value: 2
    unit: cycles
    supports: []
    notes: >-
      Latency figure stated without a method on this page. The naive and STL loops start faster at very small
      depths because queued work carries over.
  - id: c-mh-v2-antinaive-150
    text: >-
      AntiNaive (two independent vectorizable sums) and the 2-, 3- and 4-array reductions approach the 150 GB/s L1
      limit because their loops are unrolled enough to hide the SIMD add latency
    loc: p101
    quote: "they all do adequately well in approaching the 150GB/s limit ... the loop is unrolled enough that it’s not limited by the latency of the SIMD adds."
    method: throughput
    derivation: measured
    value: 150
    unit: GB/s
    approx: true
    supports: []
  - id: c-mh-v2-multiarray-falloff
    text: >-
      The 2- to 4-array reductions fall off inside the L1 range with no L1 misses while the load-unit uop count
      rises well above its usual 0.5; Handley's best guess is aggressive L1D sub-array power-down whose wake-up
      tracking is confused by several sequential streams, so loads are rejected for a cycle
    loc: p103
    quote: "for these three reduction cases the value jumps much higher ... My best guess is that it represents our usual fallback when we can’t understand something, namely energy savings."
    method: counter
    derivation: inferred
    hedge: "My best guess"
    supports: []
    notes: >-
      Array placement was chosen to rule out bank or set alignment. Elsewhere Handley reads a high opLd as bank
      collisions, which he says makes no sense here. The effect goes away once data comes from L2.
  - id: c-mh-v2-l2-transitions
    text: >-
      Bandwidth curves change value together at about 3 MiB, 7.5 MiB and ~16 MiB of footprint, as one core moves from
      inner L2 to outer L2 to SLC to DRAM
    loc: p103
    quote: "the graphs stay in sync (and change value) at the expected sorts of places (3MiB, 7.5MiB, ~16MiB) as we switch from inner L2 to outer L2 to SLC to DRAM"
    method: throughput
    derivation: measured
    value: 7.5
    unit: MiB
    approx: true
    supports: [l2.core_capacity]
    notes: Multi-array reduction curves, footprints to 128 MiB. 3 MiB is the inner L2, ~16 MiB the end of the SLC.

  - id: c-mh-v2-l2-load-range
    text: >-
      Past 128 KiB, out to about 8 MB, loads come from L2 and run at about 77 to 87 GB/s depending on the code path;
      code details matter much less than in L1
    loc: p104
    quote: "Within the L2 region, precise code details no longer matter as much ... about 77 to 87GB/s depending on the exact code path"
    method: throughput
    derivation: measured
    value: 82
    unit: GB/s
    approx: true
    range: [77, 87]
    supports: [l2.load_bw]
    notes: Range 77-87 GB/s over the reduction kernels; the non-temporal loads are the low outliers.
  - id: c-mh-v2-temporal-prefetch-l1
    text: >-
      Throughout the L2 range ordinary sequential loads are prefetched into L1 in time: the L1 miss count stays near
      zero
    loc: p106
    quote: "Throughout the L2 range, the standard code appears to be prefetched exactly as one would hope; data is (mostly) in L1 by the time one wants it"
    method: counter
    derivation: measured
    supports: []
    notes: L1D_CACHE_MISS_LD about 0.01-0.03 per int64 for LDPQ between 170 KB and 7 MB.
  - id: c-mh-v2-nt-load-no-l1-prefetch
    text: >-
      In the L2 range the non-temporal loads (LDNP, LDNPQ) are clearly slower and miss in L1 far more often than
      ordinary loads, so their lines seem not to be prefetched into L1 (either fetched only to L2 or not prefetched
      at all)
    loc: p106
    quote: "the poorly performing non-temporal cases miss in L1 substantially more often than the equivalent “temporal load” cases ... whereas for the non-temporal loads, Apple seems to not even prefetch the data."
    method: counter
    derivation: inferred
    hedge: "seems to"
    supports: []
    notes: >-
      LDNPQ vs LDPQ tables: same 150 GB/s in L1, LDNPQ falling to about 65-68 GB/s by 1-5 MB with a
      rising L1 miss count. No L2-miss counter is known, so the two readings cannot be separated.
  - id: c-mh-v2-l2-load-85
    text: Load bandwidth in the L2 region (about 128 KiB to 7 MiB) is about 85 GB/s, roughly 6/7 of the L1 bandwidth
    loc: p107
    quote: "We see that the bandwidth in the L2 region (say 128K to maybe 7M or so) is about 85GB/s. This is about 6/7 of the L1 bandwidth."
    method: throughput
    derivation: measured
    value: 85
    unit: GB/s
    approx: true
    supports: [l2.load_bw]
  - id: c-mh-v2-l2-l1-read-32b
    text: >-
      Handley assumes a 32 B wide read path from L2 to L1, which would give 100 GB/s and move a 64 B L1 line in two
      cycles
    loc: p107
    quote: "Assume that the read path from L2 to L1 is 32B in width. ... Transferring a single L1 line (64B) should take two cycles."
    derivation: inferred
    value: 32
    unit: B/cycle
    hedge: "Assume"
    supports: [l2.l1_path_width]
    notes: One extra cycle of overhead per line would give about 2/3 of 100 GB/s; the measured ~85 GB/s needs less.
  - id: c-mh-v2-l2-overhead-l1-side
    text: >-
      Handley places the L2 load shortfall (about 100 to 85 GB/s) on the L1 side: writing prefetched lines from the
      specialty buffers into the L1 blocks LSU access to those banks and causes bank collisions
    loc: p107
    quote: "My guess is that the reduction from 100GB/s to 85 GB/s perhaps lies in imperfect co-ordination between the LSU (which is continually sending loads to the cache as fast as possible) and the pool of specialty buffers"
    derivation: inferred
    hedge: "My guess is that ... perhaps"
    supports: []
    notes: This one-lost-cycle-in-seven overhead is absent for L2 stores (c-mh-v2-l2-store-no-overhead).
  - id: c-mh-v2-l1-bw
    text: >-
      As a rule of thumb, perfect L1 load bandwidth is about 48 B/cycle (~150 GB/s); realistic code gets about
      32 B/cycle (~100 GB/s), limited by SIMD latency or non-load work
    loc: p107
    quote: "perfect L1 load bandwidth at ~150GB/s (48B/cycle) ... realistic L1 load bandwidth at ~100GB/s (32B/cycle limited by SIMD latency"
    method: throughput
    derivation: measured
    value: 48
    unit: B/cycle
    approx: true
    supports: [l1d.load_bw]
    notes: >-
      Rule-of-thumb summary of the LDPQ runs (c-mh-v2-ldpq-48). Same list puts L2 load bandwidth at ~80% of the realistic
      L1 figure.
  - id: c-mh-v2-l2-inner-bw
    text: >-
      Load bandwidth curves start to droop at about 3 MiB on the way to 8 MiB, so each core sees an inner L2 of
      3 MiB and a slightly slower outer L2
    loc: p107
    quote: "they start to droop at around 3MiB on their way to 8MiB ... the general pattern is that there’s an “inner L2” of 3MiB, and an “outer L2”, that’s slightly slower."
    method: throughput
    derivation: measured
    value: 3
    unit: MiB
    approx: true
    supports: [l2.inner_slice]
    notes: >-
      The latency section only mentions the 3 MiB "near-L2" in passing. The one-quarter-of-12-MiB reading is the
      cachelet model (c-mh-v2-l2-cachelets).
  - id: c-mh-v2-l2-cachelets
    text: >-
      Handley models the 12 MiB L2 as four 3 MiB cachelets, one per core, each split in half: one half for its own
      core, the other spare L2 for the other three; a lone core then sees 3 MiB inner plus 4.5 MiB outer, 7.5 MiB
    loc: p108
    quote: "Half of the 3MiB cachelet is devoted to a particular core; the other half is allowed to act as excess L2 for the remaining three cores ... a total L2 (per core) of 7.5MiB"
    derivation: inferred
    value: 7.5
    unit: MiB
    hedge: "My guess for this is"
    supports: [l2.core_capacity]
    notes: >-
      Handley does not know how lines are placed in inner vs outer L2 or how cores compete; he compares it to IBM
      Telum. The win he sees: inner-L2 latency stays low and the outer L2 is hidden by the prefetcher.
  - id: c-mh-v2-a14-l2-effective
    text: >-
      The same partitioning fits the A14: its 8 MiB L2 for two P-cores is considered 6 MiB effective, 4 MiB inner and
      2 MiB outer from half of the other cachelet
    loc: p108
    quote: "the A14 (8MiB total L2, two P-cores, is considered to have 6MiB of “effective” L2. This would again consist of 4 MiB of inner cache, and 2MiB of “outer cache”"
    derivation: inferred
    value: 6
    unit: MiB
    chip: a14
    supports: []
    notes: Where the 6 MiB effective figure comes from is not said.
  - id: c-mh-v2-inner-l2-latency
    text: >-
      Inner-L2 latency is lower, apparently 18 cycles, and outer-L2 latency is not much higher and is hidden while the
      prefetcher is active
    loc: p108
    quote: "the latency for the inner L2 is smaller (apparently 18 cycles), while the latency for the outer L2 isn’t that much larger, and is hidden as long as the prefetcher is active"
    derivation: reported
    value: 18
    unit: cycles
    hedge: apparently
    supports: [l2.latency]
    notes: >-
      No method or source on this page; agrees with 7-cpu's 18 cycles. The latency section has
      Handley's own probes.

  - id: c-mh-v2-slc-size
    text: The most reliable SLC size Handley has seen for the M1 is 8 MiB, so cached behaviour should extend to ~16 MiB
    loc: p115
    quote: "The most reliable number I’ve seen for the size of the SLC in M1 is 8MiB."
    method: secondhand
    derivation: reported
    value: 8
    unit: MiB
    supports: [slc.size]
  - id: c-mh-v2-slc-dram-load-64
    text: Load bandwidth drops from about 85 GB/s in L2 to about 64 GB/s once the footprint is in the SLC or DRAM
    loc: p115
    quote: "that seems enough to explain the reduction in throughput, from about 85GB/s in L2 to ~64GB/s in SLC/DRAM."
    method: throughput
    derivation: measured
    value: 64
    unit: GB/s
    approx: true
    supports: [slc.load_bw, memctrl.dram_load_bw]
    notes: Single core, reduction kernels, footprints to 512 MB.
  - id: c-mh-v2-slc-matched-dram
    text: >-
      SLC bandwidth is not notably different from DRAM bandwidth; Apple appears to match the SLC's bandwidth to
      DRAM's
    loc: p115
    quote: "the SLC does not have a notably different bandwidth from DRAM (in fact it looks like Apple essentially matches the SLC bandwidth to the DRAM bandwidth)."
    method: throughput
    derivation: measured
    hedge: "it looks like"
    supports: []
    notes: >-
      Handley guesses that on the M1 the NoC and SLC run no faster than needed to match DRAM, hence ~65-70
      GB/s rather than the L2's ~100.
  - id: c-mh-v2-slc-link-64b
    text: >-
      Handley guesses the SLC connects to the L2 over a 64 B bus at about half the CPU clock rather than 32 B at full
      clock; asynchronous clocking and NoC overhead then explain the drop to ~64 GB/s
    loc: p115
    quote: "My guess is that the SLC is actually connected to the L2 via a bus that’s 64B wide rather than 32B. This would allow it to run at half the frequency of the CPU"
    derivation: inferred
    value: 64
    unit: B
    hedge: "My guess is that"
    supports: []
    notes: >-
      He allows a 32 B link at core frequency as the alternative but thinks wider and slower more likely. He
      sketches the Pro/Max NoC as 64 B at ~1.6 GHz.
  - id: c-mh-v2-m1max-flat-bw
    text: >-
      M1 Pro and Max show no drop past L2: DRAM delivers ~100 GB/s, like L2, so bandwidth is flat from L2 to DRAM;
      each SLC+memory unit appears able to deliver 100 GB/s
    loc: p115
    quote: "On M1 Pro and Max we do not see this dropoff. SLC bandwidth is still matched to DRAM, but DRAM is now at ~100 GB/s, as is L2, and bandwidth is essentially flat from L2 to DRAM!"
    method: secondhand
    derivation: reported
    value: 100
    unit: GB/s
    approx: true
    chip: m1max
    supports: []
    notes: >-
      Also M1 Pro. The page does not say whose measurement; Handley later reads AnandTech's M1 Max graphs (c-mh-v2-m1max-core-100). A single P cluster
      cannot take more than ~100 GB/s.
  - id: c-mh-v2-nt-load-dram-10pct
    text: In DRAM the non-temporal loads go from worst to best, perhaps 10% more bandwidth than ordinary loads
    loc: p115
    quote: "Note that once we hit DRAM the previously sub-optimal non-temporal loads become optimal delivering perhaps 10% better bandwidth."
    method: throughput
    derivation: measured
    value: 10
    unit: "%"
    approx: true
    hedge: perhaps
    supports: []
    notes: His guess is that NT lines are installed in no cache on the way, so no bandwidth goes to moving victims.
  - id: c-mh-v2-lpddr4x-peak
    text: >-
      The M1 appears to use standard LPDDR4x at 4266 MT/s on a 16 B interface, a peak of 4266 x 16 B = 68.256 GB/s
    loc: p115
    quote: "Apple appears to be using more or less standard LPDDR4x at 4266MT/s, which converts to a maximum possible bandwidth of 4266*16B=68.256GB/s."
    method: secondhand
    derivation: reported
    value: 68.256
    unit: GB/s
    hedge: "appears to be"
    supports: []
  - id: c-mh-v2-dram-efficiency
    text: Measured DRAM bandwidth is about 94% of the LPDDR4x-4266 peak
    loc: p115
    quote: "So they're getting about 94% bandwidth efficiency out of their DRAM, which is astonishingly high!"
    method: throughput
    derivation: measured
    value: 94
    unit: "%"
    approx: true
    supports: []
  - id: c-mh-v2-m1max-lpddr5
    text: M1 Pro and Max move to LPDDR5 at 6400 MT/s, a peak of 102.4 GB/s per memory controller, with two or four controllers
    loc: p116
    quote: "with the Max and Pro this switches to LPDDR5 at 6400MT/s, giving a maximum possible bandwidth of 6400*16B=102.4GB/s (times two or four memory controllers)."
    method: secondhand
    derivation: reported
    value: 102.4
    unit: GB/s
    chip: m1max
    supports: []
    notes: Two controllers on M1 Pro, four on M1 Max.
  - id: c-mh-v2-l2-scalar
    text: The M1's ~85 GB/s L2 load bandwidth is available even to code using scalar registers
    loc: p118
    quote: "compare with Apple’s 85GB/s or so ... whereas the Apple result is available even for code using scalar registers"
    derivation: measured
    value: 85
    unit: GB/s
    approx: true
    supports: []
    notes: >-
      From the Tiger Lake comparison (Intel ~140 GB/s from L2, but only with AVX256 code). Restates c-mh-v2-l2-load-85.

  - id: c-mh-v2-two-stores-per-cycle
    text: With one store unit and one load/store unit, the core can process at most two stores per cycle
    loc: p119
    quote: "the core has one store unit, and one ambidextrous unit, so we’d expect the maximum rate at which stores can be processed is two per cycle."
    derivation: inferred
    value: 2
    unit: stores/cycle
    supports: [lsu.stores_per_cycle]
  - id: c-mh-v2-l1-store-32
    text: The best fill loops reach the ideal L1 store limit of 32 B per cycle, 100 GB/s
    loc: p120
    quote: "there are clearly cases that are able to reach the ideal limit (store 32B of data/cycle=100GB/s), and cases that don’t do so well."
    method: throughput
    derivation: measured
    value: 32
    unit: B/cycle
    supports: [l1d.store_bw]
    notes: Naive Fill2 (eight stp q0, q0 per iteration) gets essentially there.
  - id: c-mh-v2-naive-fill-90
    text: >-
      The compiler's fill loop (two stp q0, q0 per iteration) reaches about 90 GB/s, not the optimum; Handley puts
      it down to only two stores entering the queues per cycle, since one taken branch is processed per cycle, so
      nothing is queued to ride out glitches
    loc: p121
    quote: "this performs well, at about 90GB/s (the blue curve) but not optimally. ... the first case results in, per cycle, only two stores placed in the various queues"
    method: throughput
    derivation: measured
    value: 90
    unit: GB/s
    approx: true
    hedge: "I think"
    supports: []
    notes: The idiomatic C++ fill compiles to the same loop and behaves the same.
  - id: c-mh-v2-store-path-16b
    text: >-
      A fill writing only 48 B of each 64 B line (three stp x0, x0) runs as fast as full-line vector fills, so there
      is no wider line-at-a-time path from the store queue to the L1D; stores use the 16 B store path
    loc: p121
    quote: "this implies that there is no special path from the STQ to the L1D that can transfer entire cache lines at a higher rate ... rather than using the baseline store 16B wide transfer path"
    method: throughput
    derivation: inferred
    value: 16
    unit: B
    supports: []
  - id: c-mh-v2-nt-stores-slc
    text: >-
      STNP and STNPQ loops run at about SLC/DRAM bandwidth even in the L1 range, suggesting lines filled in the store
      queue go straight to the SLC without being allocated in L1 or L2
    loc: p122
    quote: "The two non-temporal cases run at about SLC or DRAM bandwidth ... they are probably transferred all the way to SLC without ever being allocated in L1 or L2?"
    method: throughput
    derivation: measured
    hedge: "probably"
    supports: []
  - id: c-mh-v2-full-line-to-dram
    text: >-
      When successive stores in the store queue fill a whole line, the line is written straight out to DRAM/SLC, not
      to L2, and is not counted as an L1 writeback; a copy already in L1 appears to be invalidated
    loc: p126
    quote: "as far as I can tell, the line is not written to L2, it is written all the way out to DRAM (or SLC, which amounts to the same thing) ... As far as I can tell M1 chooses invalidation"
    method: counter
    derivation: inferred
    hedge: "as far as I can tell"
    supports: []
    notes: >-
      Counters used: L1 store misses (l1MsSt), L1 writebacks (l1WbSt), non-temporal stores (stNT). A partially
      written line instead goes through L1 and is later written back.
  - id: c-mh-v2-store-stream-detect
    text: >-
      The core detects streams of stores that are not jumbled and converts them to non-temporal stores on its own
    loc: p127
    quote: "the CPU transparently detects streams of stores (as long as they aren’t “jumbled”) and converts them to non-temporal stores"
    method: counter
    derivation: measured
    supports: []
    notes: >-
      Naive Fill and Fill STPQ (two and four STPQ per iteration) show stNT near 0.5 per int64 and no writebacks.
  - id: c-mh-v2-nt-store-bypass
    text: Non-temporal stores bypass L1, and Handley thinks also L2
    loc: p127
    quote: "So what’s definitely established is ... nontemporal stores bypass L1 (and I think also L2)"
    method: counter
    derivation: measured
    hedge: "I think"
    supports: []
    notes: The L2 part is the hedged one.
  - id: c-mh-v2-store-stream-warmup
    text: >-
      Detecting a store stream takes a few cycles, so the first stores of a fill are partly done in cache, giving
      noise at small depths
    loc: p127
    quote: "it takes a few cycles to confidently detect a stream of stores, hence the “noise” (not all stores ... to non-temporal, some stores being performed in cache) for the first few entries"
    method: counter
    derivation: measured
    supports: []
  - id: c-mh-v2-fill2-jumbled
    text: >-
      A fill unrolled to eight STPQ per iteration is never converted to non-temporal stores and its lines go through
      L1 with writebacks, which Handley puts down to full scheduling queues jumbling the store order; unrolling by
      four instead restores streaming
    loc: p127
    quote: "To test this theory I made a very slight tweak to Naive Fill 2 so that it unrolled to an inner loop of 4 rather than 8 STPQ, and the prediction was born out"
    method: counter
    derivation: measured
    hedge: "My best guess"
    supports: []
    notes: >-
      Naive Fill2 has stNT 0 and l1WbSt ~0.13 beyond L1, about 60 GB/s in L2 and ~28 GB/s in DRAM,
      against ~98 GB/s in L1. The hedge is on the cause.
  - id: c-mh-v2-stnpq-dram-speed
    text: >-
      Explicit non-temporal STNPQ stores lose the startup noise but also the L1 performance: they run at DRAM speed
      at every depth
    loc: p128
    quote: "Suppose we tell the system from the start that we have a non-temporal stream? Then we lose that “startup” noise. But we also lose L1 performance! Basically we always run at DRAM speeds."
    method: throughput
    derivation: measured
    supports: []
    notes: >-
      About 64-65 GB/s from 8 KB upward. Handley finds no case where STNPQ is worthwhile and has not seen
      it in library or compiler output.
  - id: c-mh-v2-large-store-policy
    text: >-
      Handley's reading of the store policy: small stores gather and stay in cache; a stream of large (STPQ) stores
      is first captured in L1, but once it looks set to exceed L1 it is pushed all the way to DRAM, apparently not to
      L2
    loc: p128
    quote: "if it looks like the store stream will exceed the capacity of L1, then we stop trying to store in L1 and push the stores out all the way to DRAM"
    derivation: inferred
    hedge: "appears to be something like"
    supports: []
    notes: Not to L2, since he thinks that would keep ~100 GB/s.
  - id: c-mh-v2-partial-fill
    text: >-
      A fill that writes three of the four quadrants of each line cannot be aggregated or streamed: counters show no
      non-temporal stores, constant writebacks, and stores mostly to lines already in L1
    loc: p129
    quote: "And we see this in the numbers – no non-temporal stores, constant stream of writebacks, and many of the stores are to addresses that are already in L1"
    method: counter
    derivation: measured
    supports: []
    notes: "~96-98 GB/s in L1, ~52 GB/s in L2, ~21-23 GB/s in DRAM."
  - id: c-mh-v2-l2-store-100
    text: In the best case the ~100 GB/s (32 B/cycle) L1 store bandwidth roughly persists into L2, at least to the 3 MiB inner L2
    loc: p132
    quote: "for the optimal case the L1 store bandwidth (~100GB/s = 32B/cycle) kinda persists all the way to L2 (at least out to the inner L2 of 3MB or so)."
    method: throughput
    derivation: measured
    value: 100
    unit: GB/s
    approx: true
    hedge: kinda
    supports: [l2.store_bw]
    notes: Store data is noisy; Handley has seen almost 100 GB/s persist to ~3 MiB in other runs.
  - id: c-mh-v2-l2-store-no-overhead
    text: The one-lost-cycle-in-seven overhead of sustained L2 loads does not appear for L2 stores
    loc: p132
    quote: "The occasional overhead (one lost cycle every seven cycles or so) that we saw for sustained L2 loads is not present here in L2 stores."
    method: throughput
    derivation: measured
    supports: []
  - id: c-mh-v2-outer-l2-store
    text: In the outer L2, store bandwidth drops to maybe 80 GB/s
    loc: p132
    quote: "For the outer L2 this drops to maybe 80 GB/s"
    method: throughput
    derivation: measured
    value: 80
    unit: GB/s
    approx: true
    hedge: maybe
    supports: []
  - id: c-mh-v2-slc-dram-store
    text: Store bandwidth falls to about 65 GB/s in the SLC and DRAM
    loc: p132
    quote: "falling to about 65GB/s for SLC and DRAM"
    method: throughput
    derivation: measured
    value: 65
    unit: GB/s
    approx: true
    supports: []
  - id: c-mh-v2-slc-store-vs-load
    text: >-
      In the SLC and DRAM range the best store curve matches loads but a few percent higher, and holds out to DRAM
    loc: p136
    quote: "For the SLC and DRAM region, for the best case curve, we see performance essentially like for loads, but a few percent higher."
    method: throughput
    derivation: measured
    supports: []
    notes: >-
      Handley imagines the L2 packing two lines per NoC packet for stores, cutting NoC and clock-crossing
      overhead.

  - id: c-mh-v2-dczva-rate
    text: >-
      A stream of DC ZVA sustains about two instructions (two 64 B lines) per three cycles, about 134 GB/s, better
      than ordinary stores but short of one per cycle (200 GB/s)
    loc: p133
    quote: "It looks like we can sustain about 2/3 of a DC ZVA per cycle, or to put it differently, we can execute two such instructions in three cycles (that would give about 128B/3~=42B/s~=134GB/s)"
    method: throughput
    derivation: measured
    value: 134
    unit: GB/s
    approx: true
    hedge: "It looks like"
    supports: []
    notes: Ordinary stores zero a line in two cycles at 32 B/cycle; DC ZVA takes 1.5.
  - id: c-mh-v2-dczva-l2-alloc
    text: >-
      DC ZVA appears to allocate zeroed lines directly in L2, probably through a cache-protocol state change rather
      than a data transfer; counters show no writebacks
    loc: p135
    quote: "DC ZVA allocates zeroed lines directly in L2 (probably by extensions to the cache protocol rather than by transferring data). Looking at the performance monitor data confirms no writebacks."
    method: counter
    derivation: inferred
    hedge: probably
    supports: []
    notes: >-
      1.5 cycles per line, below the 2 cycles a 32 B transfer needs, is his evidence for a protocol shortcut.
      The fast path reaches only L2, not the SLC. Compared to Arm's streaming mode.
  - id: c-mh-v2-dczva-with-load
    text: >-
      When the lines to be zeroed were just read, DC ZVA is slow at every depth: beyond L1 each line is loaded and
      written back, losing the zero-allocate path
    loc: p135
    quote: "As soon as we leave L1, each line has to be loaded, and the write back to L2 or SLC/DRAM is recorded in the performance monitor data as a writeback"
    method: counter
    derivation: measured
    supports: []
  - id: c-mh-v2-dczva-with-store
    text: Interleaving DC ZVA with ordinary STPQ stores runs at normal store speed, not at DC ZVA speed
    loc: p135
    quote: "As we can see, the results are not terrible, but they run at standard store speed, not at the higher speed of a stream of DC ZVA."
    method: throughput
    derivation: measured
    supports: []
    notes: Four DC ZVA then four STPQ per iteration; it falls apart beyond the SLC, which Handley cannot explain.
  - id: c-mh-v2-l1d-line-dczva
    text: L1 cache line length is 64 B, not the 128 B widely reported; DC ZVA clears 64 B
    loc: p134
    quote: "DC ZVA wipes 64B of data, not 128B. Another concrete piece of evidence that Apple’s L1 cache line width (at least for the M1 P core) is actually 64B, contra to what is reported in some places on the internet."
    method: other
    derivation: measured
    value: 64
    unit: B
    supports: [l1d.line]
    notes: >-
      Earlier vol 2 pages assume 64 B lines and point forward to experiments; this DC ZVA test is one.
  - id: c-mh-v2-l2-line-128-bw
    text: The L2 line is 128 B, and probably so for the rest of the SoC including the SLC, against 64 B for the L1
    loc: p134
    quote: "In fact the final resolution to this issue is that the L1 cache line length is 64B, the cache line length for the L2 (and probably the rest of the SoC, including eg the SLC) is 128B."
    derivation: inferred
    value: 128
    unit: B
    hedge: probably
    supports: [l2.line]
    notes: >-
      No test for the L2 figure on this page; the prefetcher-patent section dates the 128 B L2 line to around the
      A10. The hedge applies to the SLC.

  - id: c-mh-v2-flip-bw
    text: >-
      Line-flip kernels (each line read and written back reversed) run at about 150 GB/s in L1, 110 GB/s in L2,
      100 GB/s in the SLC and 60 GB/s in DRAM
    loc: p139
    quote: "Immediately obvious points are that the L1 performance is about 150GB/s, the L2 performance is about 110GB/s, the SLC performance is about 100GB/s, falling to about 60GB/s in DRAM."
    method: throughput
    derivation: measured
    value: 150
    unit: GB/s
    approx: true
    supports: [l1d.copy_bw]
    notes: >-
      Value is the L1 figure. Flip CL (permute and no permute) and Flip Address range; two LDP + two STP of q
      registers per iteration.
  - id: c-mh-v2-l1-copy-chokepoint
    text: >-
      Copying in L1 reaches ~150 GB/s, not the 200 GB/s of 100 GB/s loads plus 100 GB/s stores: two lines take five
      cycles instead of four, a chokepoint Handley did not expect given separate load and store paths
    loc: p139
    quote: "There appears to be a chokepoint in L1. I would expect have expected we could sustain 200GB/s in L1 ... Two lines should take four cycles but we get the number we see if we assume two lines takes five cycles."
    derivation: inferred
    supports: []
  - id: c-mh-v2-flip-partial
    text: >-
      A flip that leaves part of each line unwritten, so no full line goes to L2, is still pegged just over 150 GB/s,
      so L1-to-L2 line writes are not the L1 copy limit
    loc: p140
    quote: "I tested this by modifying Flip CL to only write back some of the cache line not completely overwrite the cache line ... we’re still pegged at just slightly over 150GB/s."
    method: throughput
    derivation: measured
    value: 150
    unit: GB/s
    approx: true
    supports: []
  - id: c-mh-v2-copy-store-stream-bypass
    text: >-
      Copies fall off at 128 KiB, not at the 64 KiB a cache holding source and destination lines would give (nor at
      half the L2 or SLC), so full-line store streams bypass the caches to DRAM even within a copy, and the stream
      detector tracks store addresses only
    loc: p140
    quote: "Look at the way the performance falls off at 128kiB. ... the overwritten line is bypassed all the way to DRAM ... track only stores addresses (not all addresses)"
    derivation: inferred
    hedge: "suggests to me"
    supports: []
  - id: c-mh-v2-coherence-hypothesis
    text: >-
      Handley's best, weak hypothesis for the copy limits is coherence processing in L1 or L2, perhaps running every
      other cycle because a line crosses the 32 B L1-L2 paths only every two cycles
    loc: p140
    quote: "My current best (not great) hypothesis is that the constraint is processing coherence in either L1 or L2."
    derivation: inferred
    hedge: "My current best (not great) hypothesis"
    supports: []
    notes: He calls the story "pretty flimsy". He offers the same explanation for the ~100 GB/s L2 limit on mixed traffic (c-mh-v2-unbalanced-l2-100).
  - id: c-mh-v2-naive-copy-2ops
    text: >-
      The compiler turns the naive copy loop into LDR q0; STR q0; SUBS; B.NE, and with one taken branch per cycle
      that issues only two memory ops per cycle
    loc: p141
    quote: "Recall that the CPU can only handle one taken branch per cycle, so the net result is that we only issue two (rather than four) memory ops per cycle!"
    derivation: inferred
    supports: []
  - id: c-mh-v2-copy-l1-170
    text: >-
      Unrolled copies (LDP/STP of q-register pairs), memcpy() and STL copy approach 170 GB/s at about 64 KiB, short of
      200 GB/s
    loc: p141
    quote: "We don’t reach the 200GB/s that one might hope for, but at around 64kiB we get close at about 170GB/s."
    method: throughput
    derivation: measured
    value: 170
    unit: GB/s
    approx: true
    supports: []
    notes: Peak of the best copy code, very noisy; Handley's rule-of-thumb L1 copy figure is 150 GB/s.
  - id: c-mh-v2-l2-copy-100
    text: >-
      Within L2, copies settle just over 100 GB/s, more than a single 32 B/cycle L1-L2 link could carry
    loc: p147
    quote: "the long term (within L2) pattern is just over 100GB/s; which is better than what’s possible if we assume a link between L1 and L2 of 32B/s!"
    method: throughput
    derivation: measured
    value: 100
    unit: GB/s
    approx: true
    supports: []
    notes: Naive Copy, Naive Copy2, memcpy() and STL copy, linear-axis plot.
  - id: c-mh-v2-l1-l2-split-paths
    text: The L1 and L2 must be joined by separate read and write paths, each 32 B wide
    loc: p147
    quote: "I think we have to assume separate read and write paths from L1 to L2, each 32B in width."
    derivation: inferred
    value: 32
    unit: B/cycle
    hedge: "I think we have to assume"
    supports: [l2.l1_path_width]
    notes: >-
      Handley's summary: about one line read and one line written every four cycles, slightly more than even a
      perfect shared 32 B/cycle link could give.
  - id: c-mh-v2-ldnt-copy-l2
    text: >-
      memcpy() and STL copy use non-temporal loads (LDNT) where the naive loops use plain loads, and this clearly
      helps from 128 KiB out to about 1500 KiB
    loc: p147
    quote: "The Naive Code (both versions) use LD and ST; the memcpy() and STL differ in that they use LDNT and ST, ie they use a non-temporal load. This clearly helps in the range from 128kIB out to about 1500kiB."
    method: throughput
    derivation: measured
    supports: []
  - id: c-mh-v2-nt-load-buffer-model
    text: >-
      Handley's model for the LDNT gain: the L1 keeps its 128 KiB of load data and later non-temporal loads are fed to
      the LSU from the prefetch buffers without replacing L1 lines, so part of the footprint still runs at L1 speed
    loc: p148
    quote: "In the second model the cache holds onto 128 kiB of data and all loads after that point are routed from the prefetch specialty buffers to the LSU, without replacing L1 lines."
    derivation: inferred
    supports: []
    notes: >-
      Both of his models assume stores are silently made non-temporal, so the L1 holds only load data. The
      plain-load copies fit the other model, a strictly LRU L1 with no reuse.
  - id: c-mh-v2-copy-beyond-l2
    text: >-
      Beyond L2, copy bandwidth drops to about 60 GB/s over the SLC and DRAM, and here non-temporal loads are clearly
      worse than ordinary loads
    loc: p149
    quote: "Beyond L2 performance drops to about 60GB/s over the SLC and DRAM range. One thing we see is that in this range non-temporal loads are unequivocally worse than temporal loads."
    method: throughput
    derivation: measured
    value: 60
    unit: GB/s
    approx: true
    supports: []
  - id: c-mh-v2-l2-random-repl
    text: >-
      Handley thinks the L2 uses random rather than LRU replacement: ordinary loads keep partly hitting in L2 between
      8 and 16 MiB, while non-temporal loads, never installed in L2, drop straight to SLC bandwidth
    loc: p149
    quote: "the L2 replacement is random rather than LRU, giving the reverse of the effect we saw earlier moving from L1 to L2."
    derivation: inferred
    value: random
    hedge: "I think"
    supports: [l2.replacement]
  - id: c-mh-v2-copy-no-turnaround
    text: >-
      Copy costs nothing over pure load or store traffic at the NoC/SLC or in DRAM, so the memory controller hides
      DRAM read-write switching well
    loc: p149
    quote: "Finally we see no real cost to copy as opposed to pure load/store traffic, either at the NoC (and so SLC performance) or in DRAM. ... we seem to see a good memory controller here."
    method: throughput
    derivation: measured
    supports: []
  - id: c-mh-v2-memmove-160
    text: >-
      memmove() shifting data down by 16 to 256 B copies at about 160 GB/s in L1; the 8 B shift, which splits some
      16 B loads across lines, still gets 150 GB/s
    loc: p149
    quote: "they essentially cluster together giving perfect copy performance of 160GB/s or so. Even the misaligned 8B case ... you still get 150GB/s!"
    method: throughput
    derivation: measured
    value: 160
    unit: GB/s
    approx: true
    supports: []
  - id: c-mh-v2-memmove-nt-dropped
    text: >-
      memmove() runs the same bcopy code as memcpy(), with loads marked non-temporal, but counters show no
      non-temporal loads for memmove; Handley infers the hardware drops the hint when it sees the lines reused
    loc: p151
    quote: "we see that this number is as expected (essentially all loads non-temporal) for the C Copy and STL code, but is zero for the memmove code, even though they all route to the same inner loop"
    method: counter
    derivation: inferred
    hedge: "Perhaps"
    supports: []
    notes: >-
      memmove drops sharply to ~100 GB/s at the L1 boundary and tracks the Flip curves, unlike memcpy's drawn-out
      LDNT transition. He credits the prefetcher.
  - id: c-mh-v2-m1max-core-100
    text: From AnandTech's M1 Max data, a single M1 Max core sustains 100 GB/s out to the SLC and DRAM
    loc: p152
    quote: "A single M1M core can now sustain 100GB/s out to DRAM and the SLC. So the NoC can sustain that."
    method: secondhand
    derivation: reported
    value: 100
    unit: GB/s
    chip: m1max
    supports: []
    notes: AnandTech M1 Max review. The same copy test shows 150 GB/s in L1.
  - id: c-mh-v2-one-thread-saturates
    text: The M1 saturates its SLC and DRAM bandwidth at 65 GB/s with one thread; more threads add nothing
    loc: p153
    quote: "The M1 saturates its SLC and DRAM bandwidth at 65GB/s with just one thread, further threads see no improvement."
    method: secondhand
    derivation: reported
    value: 65
    unit: GB/s
    approx: true
    supports: [slc.load_bw, memctrl.dram_load_bw]
    notes: >-
      Stated next to AnandTech's M1 Max thread-scaling graph, where a second thread nearly doubles bandwidth; the
      page does not say whether the M1 thread-scaling result is Handley's own.
  - id: c-mh-v2-m1max-slc-split
    text: >-
      On M1 Pro and Max the SLC and its memory controller are split into two (Pro) or four (Max) independent,
      address-striped units, which the die shots confirm
    loc: p154
    quote: "The natural assumption is that “the” SLC (and associated memory controller) are now split into (two for the Pro, four for the Max) independent entities striped by address"
    derivation: inferred
    value: 4
    unit: units
    chip: m1max
    supports: []
    notes: Two on M1 Pro. Stripe granularity unknown (?64 B to ?512 B).
  - id: c-mh-v2-slc-even-odd
    text: The SLC and memory controller are split into even and odd halves by cache line, Apple's common pattern
    loc: p154
    quote: "the SLC and memory controller are split into Apple’s common pattern of even and odd halves by cache line"
    derivation: reported
    supports: []
    notes: Handley refers to his own discussion elsewhere; not argued on this page.

  - id: c-mh-v2-unbalanced-l1-170
    text: >-
      Unbalanced kernels (three loads and one store per cycle) approach almost 170 GB/s in L1, against about 150 GB/s
      for balanced copies
    loc: p156
    quote: "we can approach almost 170 GB/s in L1 for unbalanced operations (specifically three loads plus one store)."
    method: throughput
    derivation: measured
    value: 170
    unit: GB/s
    approx: true
    hedge: almost
    supports: []
    notes: Add Op (C=A+B) and FMAC Op (D=A+B|C, no real multiply); depth axis rescaled by hand.
  - id: c-mh-v2-unbalanced-l2-100
    text: >-
      The unbalanced kernels run at about 100 GB/s in L2, the same ~100 GB/s seen for other mixes, which Handley
      attributes to passing coherence information between L1 and L2 rather than to data bandwidth
    loc: p156
    quote: "We also see that these unbalanced ops run at around 100GB/s in L2, the same sort of ~100GB/s we seem to always see"
    method: throughput
    derivation: measured
    value: 100
    unit: GB/s
    approx: true
    supports: []
    notes: The coherence explanation is hedged ("I think ... ? (Anyone else have a better theory?)").
  - id: c-mh-v2-shared-load-store-path
    text: >-
      DRAM, and probably the NoC and SLC, use one shared path for loads and stores, so running loads alongside stores
      does not add bandwidth there
    loc: p157
    quote: "NoC (and thus SLC) is probably like DRAM – a common path uses for loads and stores, not separate load and store paths, so same effect there."
    derivation: inferred
    hedge: probably
    supports: []
    notes: The L1-L2 link he guesses to have separate load and store paths, while saying he does not know how it is built.
  - id: c-mh-v2-add-overwrite-200
    text: >-
      With A=A+B, each store lands on the line loaded a cycle earlier, the stores overlap loads at no visible cost,
      and L1 throughput reaches almost 200 GB/s
    loc: p158
    quote: "In this case Apple’s magic L1 cache should be able to kick in, so that the cost of the stores is essentially invisible, being overlapped with loads from the same line. And indeed it does. Damn! Almost 200 GB/s!"
    method: throughput
    derivation: measured
    value: 200
    unit: GB/s
    approx: true
    hedge: almost
    supports: []
    notes: Same for FMAC Overwrite; L2 is also slightly better for both.

  - id: c-mh-v2-bw-summary-dram
    text: DRAM and SLC give about 60-68 GB/s whatever the access pattern
    loc: p158
    quote: "DRAM and SLC give you about 60..68GB/s regardless of what you do"
    method: throughput
    derivation: measured
    value: 64
    unit: GB/s
    approx: true
    supports: [slc.load_bw, memctrl.dram_load_bw]
    notes: Range 60-68 GB/s; value is the midpoint.
  - id: c-mh-v2-bw-summary-l2-load
    text: L2 gives about 85 GB/s for loads
    loc: p158
    quote: "L2 can give you 85 GB/s (load)"
    method: throughput
    derivation: measured
    value: 85
    unit: GB/s
    approx: true
    supports: [l2.load_bw]
  - id: c-mh-v2-bw-summary-l2-store
    text: L2 gives about 100 GB/s for stores
    loc: p158
    quote: "L2 can give you 85 GB/s (load), 100GB/s (store)"
    method: throughput
    derivation: measured
    value: 100
    unit: GB/s
    approx: true
    supports: [l2.store_bw]
  - id: c-mh-v2-bw-summary-l2-copy
    text: L2 gives about 135 GB/s for copies, and 90-110 GB/s for more unbalanced load/store mixes
    loc: p158
    quote: "L2 can give you 85 GB/s (load), 100GB/s (store), 135 GB/s (copy), with worse results (90..110) GB/s as we moved to a more unbalanced mix of loads and stores"
    method: throughput
    derivation: measured
    value: 135
    unit: GB/s
    approx: true
    supports: []
    notes: >-
      135 is above the copy figures earlier in the section (~110 GB/s for flips, c-mh-v2-flip-bw; just over 100 GB/s for
      copies, c-mh-v2-l2-copy-100); the text does not reconcile them.
  - id: c-mh-v2-bw-summary-l1-copy
    text: L1 gives about 150 GB/s for copies
    loc: p158
    quote: "L1 can give you 110GB/s (load), 100GB/s (store), 150 GB/s (copy)"
    method: throughput
    derivation: measured
    value: 150
    unit: GB/s
    approx: true
    supports: [l1d.copy_bw]
  - id: c-mh-v2-bw-summary-l1-load
    text: >-
      The summary gives L1 load bandwidth as about 110 GB/s, with 100 GB/s for stores and 200 GB/s for the best mix of
      two loads and one store to a loaded line
    loc: p158
    quote: "L1 can give you 110GB/s (load), 100GB/s (store), 150 GB/s (copy), 200GB/s (optimal mix of two loads, one store to the same as a load address)"
    method: throughput
    derivation: measured
    value: 110
    unit: GB/s
    approx: true
    supports: []
    notes: >-
      110 GB/s matches the LDP and realistic-code results; the perfect LDPQ figure is ~150 GB/s, 48 B/cycle
      (c-mh-v2-l1-bw).

new_params:
  l1d.store_bw:          {block: l1d, name: L1D store bandwidth, unit: B/cycle}
  l1d.copy_bw:           {block: l1d, name: L1D copy bandwidth (load+store), unit: GB/s}
  l2.load_bw:            {block: l2, name: L2 load bandwidth (one core), unit: GB/s}
  l2.store_bw:           {block: l2, name: L2 store bandwidth (one core), unit: GB/s}
  l2.l1_path_width:      {block: l2, name: L1-L2 path width (each direction), unit: B/cycle}
  l2.core_capacity:      {block: l2, name: L2 capacity seen by one core, unit: MiB}
  l2.replacement:        {block: l2, name: L2 replacement policy}
  slc.load_bw:           {block: slc, name: SLC load bandwidth (one core), unit: GB/s}
  memctrl.dram_load_bw:  {block: memctrl, name: DRAM load bandwidth (one core), unit: GB/s}

new_mechanisms:
  l2_cachelets:
    name: Per-core L2 cachelets (inner and outer L2)
    status: speculative
    description: The 12 MiB L2 behaves as four 3 MiB cachelets, one beside each core.
    params: [l2.inner_slice, l2.core_capacity]
    sim_switch: null
    detection_rule: single-core bandwidth sweeps step at ~3 MiB and ~7.5 MiB, short of the 12 MiB L2
  dczva_l2_zero:
    name: DC ZVA zero-allocates lines in L2
    status: inferred
    description: DC ZVA allocates zeroed lines directly in the L2.
    params: []
    sim_switch: null
    detection_rule: a DC ZVA stream beats the plain-store fill rate beyond L1 and shows no L1 writebacks
  nt_load_handling:
    name: Non-temporal loads skip L1 fill
    status: inferred
    description: Non-temporal loads are not prefetched into the L1.
    params: []
    sim_switch: null
    detection_rule: LDNPQ vs LDPQ sweep is equal in L1, LDNPQ lower in L2 with a higher L1 miss count, higher in DRAM

mechanism_claims:
  streaming_store_nt: [c-mh-v2-nt-stores-slc, c-mh-v2-full-line-to-dram, c-mh-v2-store-stream-detect,
                       c-mh-v2-nt-store-bypass, c-mh-v2-store-stream-warmup, c-mh-v2-fill2-jumbled,
                       c-mh-v2-stnpq-dram-speed, c-mh-v2-large-store-policy, c-mh-v2-partial-fill,
                       c-mh-v2-copy-store-stream-bypass]
  l2_cachelets: [c-mh-v2-l2-inner-bw, c-mh-v2-l2-cachelets, c-mh-v2-l2-transitions, c-mh-v2-a14-l2-effective]
  dczva_l2_zero: [c-mh-v2-dczva-rate, c-mh-v2-dczva-l2-alloc, c-mh-v2-dczva-with-load, c-mh-v2-dczva-with-store]
  nt_load_handling: [c-mh-v2-ldnp-l1-ignored, c-mh-v2-nt-load-no-l1-prefetch, c-mh-v2-nt-load-dram-10pct,
                     c-mh-v2-ldnt-copy-l2, c-mh-v2-nt-load-buffer-model, c-mh-v2-copy-beyond-l2,
                     c-mh-v2-memmove-nt-dropped, c-mh-v2-l2-random-repl]
