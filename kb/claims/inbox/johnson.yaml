# johnson.yaml
# Dougall Johnson, 2021-2023
# The Firestorm overview and the load and store queue measurements.
session: johnson
source: dougall-firestorm

claims:

  - id: c-dj-width
    text: Firestorm's pipeline width is eight instructions (uops) per cycle
    loc: "#other-limits"
    quote: "Firestorm has a pipeline width of eight instructions per cycle. Uops per cycle: 8"
    method: counter
    derivation: measured
    value: 8
    unit: instr/cycle
    supports: [fetch.width, decode.width, rename.width]
    notes: >-
      Johnson gives one pipeline width, not separate fetch/decode/rename widths. Method from #firestorm-pipeline-overview
      (uops counted with the RETIRE_UOP counter against the 8 uops/cycle limit).
  - id: c-dj-taken
    text: Firestorm sustains one taken branch per cycle
    loc: "#other-limits"
    quote: "Uops per cycle: 8 Taken branches per cycle: 1"
    derivation: measured
    value: 1
    unit: branches/cycle
    supports: [fetch.taken_per_cycle]
    notes: The page does not say how this was measured.
  - id: c-dj-int-prf
    text: The integer physical register file holds about 380 to 394 registers
    loc: "#other-limits"
    quote: "Integer physical register file size: ~380-394? ... These numbers mostly come from my M1 buffer size measuring tool"
    method: wong-probe
    filler: int
    derivation: measured
    value: 387
    unit: registers
    approx: true
    hedge: "?"
    range: [380, 394]
    supports: [int_prf.total]
    notes: Johnson gives the range ~380-394 with a question mark; value is the midpoint.
  - id: c-dj-fp-prf
    text: The FP/SIMD physical register file holds about 432 registers
    loc: "#other-limits"
    quote: "FP/SIMD physical register file size: ~432? ... These numbers mostly come from my M1 buffer size measuring tool"
    method: wong-probe
    filler: simd
    derivation: measured
    value: 432
    unit: registers
    approx: true
    hedge: "?"
    supports: [fp_prf.total]
  - id: c-dj-flags-prf
    text: The flags physical register file holds about 128 registers
    loc: "#other-limits"
    quote: "Flags physical register file size: ~128 ... These numbers mostly come from my M1 buffer size measuring tool"
    method: wong-probe
    filler: flags
    derivation: measured
    value: 128
    unit: registers
    approx: true
    supports: [flags_prf.total]
  - id: c-dj-branches
    text: About 144 branches can be in flight
    loc: "#other-limits"
    quote: "In-flight branches: ~144 ... These numbers mostly come from my M1 buffer size measuring tool"
    method: wong-probe
    filler: branch
    derivation: measured
    value: 144
    unit: branches
    approx: true
    supports: [retire.inflight_branches]
  - id: c-dj-loads
    text: About 130 loads can be in flight
    loc: "#other-limits"
    quote: "In-flight loads: ~130 ... These numbers mostly come from my M1 buffer size measuring tool"
    method: wong-probe
    filler: load
    derivation: measured
    value: 130
    unit: entries
    approx: true
    supports: [lq.entries]
    notes: The page points to the load/store queue blog post for detail (see c-dj-lsq-lq-130).
  - id: c-dj-stores
    text: About 60 stores can be in flight
    loc: "#other-limits"
    quote: "In-flight stores: ~60 These numbers mostly come from my M1 buffer size measuring tool"
    method: wong-probe
    filler: store
    derivation: measured
    value: 60
    unit: entries
    approx: true
    supports: [sq.entries]
    notes: The page points to the load/store queue blog post for detail (see c-dj-lsq-sq-60).

  - id: c-dj-retire-groups
    text: The coalesced retire queue holds about 330 retire groups
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "The coalesced retire queue consists of ~330 such groups."
    method: wong-probe
    derivation: measured
    value: 330
    unit: groups
    approx: true
    supports: [retire.groups]
    notes: >-
      The page names no filler; the LSQ post reaches this limit with ~329 loads or stores under an FSQRT delay
      (c-dj-lsq-fsqrt-329). Group boundaries are c-dj-group-boundaries.
  - id: c-dj-group-size
    text: A retire group may contain up to seven uops
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "Firestorm coalesces uops into retire groups, which all retire together. A retire group may contain up to seven uops."
    method: wong-probe
    derivation: derived
    value: 7
    unit: uops
    supports: [retire.group_max_uops]
    notes: Seven-uop groups are only observed for eliminated instructions (c-dj-group-issuing).
  - id: c-dj-nop-window
    text: The coalesced retire queue allows an out-of-order window of over 2200 nop instructions
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "This allows an out-of-order window of ... or over 2200 nop instructions."
    method: wong-probe
    filler: nop
    derivation: measured
    value: 2200
    unit: instructions
    approx: true
    hedge: "over 2200"
    supports: [retire.nop_window]
    notes: A lower bound ("over").
  - id: c-dj-issuing-window
    text: The coalesced retire queue allows an out-of-order window of just over 1000 contrived instructions that issue
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "This allows an out-of-order window of just over 1000 (contrived) instructions that issue"
    method: wong-probe
    filler: issuing uops
    derivation: measured
    value: 1000
    unit: uops
    approx: true
    hedge: "just over 1000"
    supports: [retire.issuing_window]
  - id: c-dj-rename-retire
    text: The rename retire queue allows up to about 623 renames in flight
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "This is tracked in a separate structure, called the \"rename retire queue\", which allows for up to ~623 renames."
    method: wong-probe
    filler: register-writing
    derivation: measured
    value: 623
    unit: entries
    approx: true
    supports: [retire.rename_queue]
    notes: >-
      The every-write-needs-an-entry rule is c-dj-rename-cost. Also listed in #other-limits as "In-flight renames:
      ~623".
  - id: c-dj-retire-rate
    text: Retirement is measured at up to eight coalesced retire queue entries per cycle
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "Retirement-rate is measured at up to eight coalesced retire queue entries per cycle"
    derivation: measured
    value: 8
    unit: groups/cycle
    supports: [retire.rate_groups]
    notes: The page says "measured" but not how.
  - id: c-dj-rename-rate
    text: Retirement is measured at up to sixteen rename retire queue entries per cycle
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "or up to sixteen rename retire queue entries per cycle"
    derivation: measured
    value: 16
    unit: entries/cycle
    supports: [retire.rate_renames]
    notes: The page says "measured" but not how.

  - id: c-dj-int-units
    text: Firestorm has six integer units (1 to 6), each with ALU and ubfm/sbfm
    loc: "#firestorm-units"
    quote: "Integer units: 1: alu + ubfm/sbfm + flags + branch ... 6: alu + ubfm/sbfm + mul + madd + crc + bfm/extr"
    method: counter
    derivation: measured
    value: 6
    unit: units
    supports: [eu_int.count]
    notes: >-
      The page says issues are measured with SCHEDULE_UOP and per-class issue counters. Unit roles are c-dj-int-roles.
  - id: c-dj-ls-units
    text: >-
      Firestorm has four load/store units handling up to 128-bit accesses: unit 7 store and AMX, unit 8 load/store
      and AMX, units 9 and 10 load only
    loc: "#firestorm-units"
    quote: "Load/store units (up to 128-bit loads and stores ... 7: store + amx 8: load/store + amx 9: load 10: load"
    method: counter
    derivation: measured
    value: 4
    unit: units
    supports: [lsu.ls_units]
    notes: Method as for c-dj-int-units.
  - id: c-dj-fp-units
    text: Firestorm has four FP/SIMD units (11 to 14)
    loc: "#firestorm-units"
    quote: "SIMD units: 11: fp/simd 12: fp/simd 13: fp/simd + fcsel + to-gpr 14: fp/simd"
    method: counter
    derivation: measured
    value: 4
    unit: units
    supports: [eu_fp.count]
    notes: >-
      Unit roles are c-dj-fp-roles. For unit 14 the page lists reciprocal and reciprocal-square-root estimates (frecpe,
      frsqrte, urecpe, ursqrte), not fsqrt.

  - id: c-dj-mov-elim
    text: >-
      64-bit register moves (mov x0, x1) are usually handled by renaming; mov w0, w1, mov x0, xzr and adr/adrp are not
      eliminated
    loc: "#elimination"
    quote: "mov x0, x1 (usually handled by renaming, 64-bit version only) ... not eliminated, including adr/adrp, mov w0, w1 and mov x0, xzr"
    method: counter
    derivation: measured
    value: true
    hedge: "usually"
    supports: [rename.mov_elimination]
  - id: c-dj-zero-idiom
    text: "mov x0, #0 (and its 32-bit form) and movi v0.16b, #0 (and other types) are handled by renaming"
    loc: "#elimination"
    quote: "mov x0, #0 (handled by renaming, as is 32-bit version) ... movi v0.16b, #0 (handled by renaming, including other types)"
    method: counter
    derivation: measured
    value: true
    supports: [rename.zero_idiom]
    notes: mov x0, xzr is not eliminated (c-dj-mov-elim).
  - id: c-dj-mov-imm
    text: >-
      Immediate moves (mov x0, #imm, 32- and 64-bit, including bitwise/movz/movn aliases) are handled by renaming at
      most twice per eight instructions
    loc: "#elimination"
    quote: "mov x0, #123 (handled by renaming at a max of 2 per 8 instructions, both 32-bit and 64-bit. Includes all tested immediate \"mov\" aliases e.g. bitwise/movz/movn)"
    method: counter
    derivation: measured
    value: 2
    unit: per 8 instr
    supports: [rename.mov_imm_limit]

  - id: c-dj-fusion
    text: >-
      Certain consecutive instruction pairs issue as one uop: flag-setting ALU + b.cc, ALU + cbz/cbnz, aese + aesmc,
      aesd + aesimc, aese/aesd + eor, pmull + eor, and amx + amx
    loc: "#instruction-fusion"
    quote: "Certain instructions are able to issue as one uop if they appear consecutively in the instruction stream."
    method: counter
    derivation: measured
    value: "flag-ALU+b.cc, ALU+cbz/cbnz, aese+aesmc, aesd+aesimc, aes+eor, pmull+eor, amx+amx"
    supports: [rename.fusion]
    notes: >-
      Conditions and non-fused pairs: c-dj-fusion-read-limit, c-dj-fusion-cbz, c-dj-fusion-crypto, c-dj-fusion-amx,
      c-dj-fusion-branch-limits and c-dj-no-fusion.

  - id: c-dj-l1d-latency
    text: A load's result can feed the base address of another load with 3-cycle latency
    loc: "#complex-latencies"
    quote: "Loads may be passed to the base address of other loads with 3c latency (which is nice for linked lists)"
    derivation: measured
    value: 3
    unit: cycles
    supports: [l1d.latency]
    notes: >-
      The 4c ALU-chain latency is c-dj-load-alu-latency. The page gives no method for latencies.

  - id: c-dj-pipeline-flow
    text: >-
      Instructions decode to one or more uops, which are mapped, renamed and placed in a dispatch queue, then dispatched
      to a scheduler, issue when their operands are ready, and are marked completed in the reorder buffer, which
      releases entries in order
    loc: "#firestorm-pipeline-overview"
    quote: "Typically, an instruction is decoded to one or more uops, each uop is mapped and renamed and placed into a dispatch queue. These uops are then dispatched from the queue to a scheduler."
    derivation: inferred
    supports: []
  - id: c-dj-issue-counters
    text: >-
      Issues are counted by the documented SCHEDULE_UOP counter, and three undocumented counters count issues to the
      integer, load/store and SIMD units separately; uops are counted by RETIRE_UOP
    loc: "#firestorm-pipeline-overview"
    quote: "can be measured using the documented SCHEDULE_UOP counter. Three undocumented counters measure issues to the integer, load/store, and simd units separately"
    method: counter
    derivation: measured
    supports: []
  - id: c-dj-unit-issue-limit
    text: Each execution unit accepts one issue per cycle
    loc: "#firestorm-pipeline-overview"
    quote: "Issues count towards the \"execution unit\" limits (one issue per unit per cycle)"
    method: counter
    derivation: measured
    value: 1
    unit: issues/cycle per unit
    supports: []
  - id: c-dj-fewer-issues
    text: Most instructions issue once per uop, but nop, ldp and fused instructions have fewer issues than uops
    loc: "#firestorm-pipeline-overview"
    quote: "most instructions have the same number of issues as uops, but some have fewer (e.g. nop, ldp, and fused instructions)"
    method: counter
    derivation: measured
    supports: []
  - id: c-dj-shift-extend-issues
    text: ALU operations with an optional shift or extend have more issues than uops
    loc: "#firestorm-pipeline-overview"
    quote: "some instructions have more issues than uops, e.g ALU operations with an optional shift or extend"
    method: counter
    derivation: measured
    supports: []
  - id: c-dj-issue-peak
    text: Because shifted/extended ALU ops issue more than once per uop, Firestorm can sustain 11 issues per cycle in contrived cases
    loc: "#firestorm-pipeline-overview"
    quote: "which allows Firestorm to sustain 11 issues per cycle in contrived cases"
    method: counter
    derivation: measured
    value: 11
    unit: issues/cycle
    supports: []

  - id: c-dj-int-roles
    text: >-
      All six integer units do ALU and ubfm/sbfm; units 1-3 set flags; 1 and 2 take branches, adr and msr/mrs nzcv;
      1 also mrs; 2 indirect branches and pointer authentication; 3 and 4 probably moves from SIMD/FP; 5 and 6 multiply;
      5 divide; 6 madd, crc and bfm/extr
    loc: "#firestorm-units"
    quote: "1: alu + ubfm/sbfm + flags + branch ... indirect branch + ptrauth ... mov-from-simd/fp? ... 5: alu + ubfm/sbfm + mul + div 6: ... mul + madd + crc + bfm/extr"
    method: counter
    derivation: measured
    value: "1-6 alu, ubfm/sbfm; 1-3 flags; 1-2 branch, adr, msr/mrs nzcv; 1 mrs; 2 indirect branch, ptrauth; 3-4 mov-from-simd/fp?; 5-6 mul; 5 div; 6 madd, crc, bfm/extr"
    hedge: "mov-from-simd/fp?"
    supports: [eu_int.roles]
  - id: c-dj-fp-roles
    text: >-
      All four SIMD units do FP/SIMD; units 13 and 14 add fcsel and moves to GPRs; unit 14 alone adds fcmp/fcmpe,
      fdiv, frecpe, frsqrte, fjcvtzs, ursqrte, urecpe and sha
    loc: "#firestorm-units"
    quote: "13: fp/simd + fcsel + to-gpr 14: fp/simd + fcsel + to-gpr + fcmp/e + fdiv + frecpe + frsqrte + fjcvtzs + ursqrte + urecpe + sha"
    method: counter
    derivation: measured
    value: "11-14 fp/simd; 13-14 fcsel, to-gpr; 14 fcmp/e, fdiv, frecpe, frsqrte, fjcvtzs, ursqrte, urecpe, sha"
    supports: [eu_fp.roles]
  - id: c-dj-agu-shift
    text: "Load/store address generation includes register shifts up to LSL #3"
    loc: "#firestorm-units"
    quote: "Load/store units (up to 128-bit loads and stores, including address generation with shifts up to LSL #3)"
    method: counter
    derivation: measured
    value: 3
    unit: max LSL shift
    supports: []

  - id: c-dj-fusion-read-limit
    text: >-
      Flag-setting ALU ops (adds/subs/ands/cmp/tst) fuse with a following b.cc; fusion is complete only when the fused
      instructions read no more than 4 registers per 6 instructions
    loc: "#instruction-fusion"
    quote: "adds/subs/ands/cmp/tst + b.cc (complete fusion when fused instructions read no more than 4 registers per 6 instructions)"
    method: counter
    derivation: measured
    value: 4
    unit: regs per 6 instr
    supports: [rename.fusion_read_limit]
  - id: c-dj-fusion-cbz
    text: >-
      ALU ops (add/sub/and/orr/eor/bic etc., including flag-setting variants) usually fuse with a following cbz/cbnz when
      their destination is the cbz operand
    loc: "#instruction-fusion"
    quote: "add/sub/and/orr/eor/bic/etc. + cbnz/cbz (usually fused, if destination matches cbz operand. also works with instruction variants that set flags)"
    method: counter
    derivation: measured
    hedge: "usually"
    supports: []
  - id: c-dj-fusion-crypto
    text: >-
      aese + aesmc, aesd + aesimc, aese/aesd + eor and pmull + eor usually fuse when the second instruction overwrites
      the first's destination in a matching operand pattern
    loc: "#instruction-fusion"
    quote: "aese + aesmc (usually fused if operands match pattern \"A, B ; A, A\") ... pmull + eor (usually fused if operands match pattern \"A, B, C ; A, A, D\" or \"A, B, C ; A, D, A\")"
    method: counter
    derivation: measured
    hedge: "usually"
    supports: []
  - id: c-dj-fusion-amx
    text: Pairs of AMX instructions fuse, except AMX loads and stores, probably into something like an stp
    loc: "#instruction-fusion"
    quote: "amx + amx (excluding loads and stores - probably fuses to something like a stp)"
    method: counter
    derivation: measured
    hedge: "probably"
    supports: []
  - id: c-dj-fusion-branch-limits
    text: Branch fusion does not happen with implicit shift or extend, nor with instructions that read flags such as adc
    loc: "#instruction-fusion"
    quote: "Branch fusion does not work with implicit shift or extend, nor instructions that read flags (like adc)"
    method: counter
    derivation: measured
    supports: []
  - id: c-dj-no-fusion
    text: adrp + add, mov + movk, mul + umulh and udiv + msub are not fused
    loc: "#instruction-fusion"
    quote: "Other tested patterns are not fused, including adrp + add, mov + movk, mul + umulh, and udiv + msub."
    method: counter
    derivation: measured
    supports: []

  - id: c-dj-vec-mov-elim
    text: Full-width vector register moves (mov v0.16b, v1.16b, also v0.8h etc.) are usually handled by renaming; v0.8b moves are not
    loc: "#elimination"
    quote: "mov v0.16b, v1.16b (usually handled by renaming. Includes other full-width types e.g. v0.8h but not v0.8b)"
    method: counter
    derivation: measured
    value: true
    hedge: "usually"
    supports: [rename.mov_elimination]
  - id: c-dj-nop-b-no-issue
    text: nop and unconditional b never issue
    loc: "#elimination"
    quote: "Certain instructions do not need to issue: ... nop (never issues) b (unconditional branch never issues)"
    method: counter
    derivation: measured
    supports: []

  - id: c-dj-load-alu-latency
    text: When a load is chained with ALU operations instead of feeding another load's base address, its latency is 4 cycles
    loc: "#complex-latencies"
    quote: "Loads may be passed to the base address of other loads with 3c latency ... but chaining with ALU operations gives a latency of 4c."
    derivation: measured
    value: 4
    unit: cycles
    supports: [l1d.latency_alu]
  - id: c-dj-ldp-second-dest
    text: The second destination register of an LDP always has 4-cycle latency
    loc: "#complex-latencies"
    quote: "(Although the second destination register in an LDP always has 4c latency.)"
    derivation: measured
    value: 4
    unit: cycles
    supports: []
  - id: c-dj-index-shift-penalty
    text: >-
      A load takes one extra cycle when its index register comes from a shift-like instruction; addition and bitwise
      producers carry no penalty
    loc: "#complex-latencies"
    quote: "Loads may have an extra 1-cycle of latency when the index register is the output of a shift-like instruction. Addition and bitwise operations do not have this penalty."
    derivation: measured
    value: 1
    unit: cycles
    supports: []
    notes: Johnson says other latency chains had not been tested.
  - id: c-dj-madd-acc-latency
    text: A MADD result feeds the addend of a following MADD with 1-cycle latency, but has 3-cycle latency into other instructions
    loc: "#complex-latencies"
    quote: "MADD's output can be passed to its third operand (the addend) with 1c latency, but if it's chained with other instructions it has 3c latency."
    derivation: measured
    value: 1
    unit: cycles
    supports: []
  - id: c-dj-int-simd-roundtrip
    text: An integer-to-SIMD/FP-and-back round trip can take as little as 7 cycles, for example when chaining flags operations
    loc: "#complex-latencies"
    quote: "Integer to SIMD/FP roundtrip latency can be as low as 7c (e.g. when chaining flags operations)."
    derivation: measured
    value: 7
    unit: cycles
    hedge: "as low as"
    supports: []

  - id: c-dj-rob-model
    text: >-
      Firestorm's reorder buffer is unconventional: a ~330-entry coalesced retire queue of retire groups plus a
      ~623-entry rename retire queue
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "Firestorm uses an unconventional reorder buffer, which I described as a ~330 entry \"coalesced retire queue\" and a ~623 \"rename retire queue\""
    derivation: inferred
    value: "coalesced retire queue + rename retire queue"
    supports: [retire.model]
  - id: c-dj-reclaim-table
    text: Johnson equates the ~623-entry rename retire queue with a Physical Register Reclaim Table
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "a ~623 \"rename retire queue\" (equivalent to a \"Physical Register Reclaim Table\")"
    derivation: inferred
    supports: []
  - id: c-dj-group-boundaries
    text: >-
      Uops that can fail before retiring (such as memory accesses) must start a retire group, and uops that can fail
      after retiring (such as conditional branches) must end one
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "Uops which can fail before retiring (such as memory accesses) must appear at the start of a group, and uops that can fail after retiring (such as conditional branches) must appear at the end of a group."
    method: wong-probe
    derivation: inferred
    supports: []
  - id: c-dj-ooo-commit
    text: >-
      Non-speculative loads and stores may commit out of order, before retirement; once a store has completed, the
      architectural state must have advanced past it
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "loads and stores may commit out-of-order if they are non-speculative. This has some interesting implications. In particular, once a store has \"completed\", the architectural state must have advanced past that point."
    derivation: inferred
    supports: []
    notes: Johnson refers to his load/store queue blog post for the evidence.

  - id: c-dj-lsq-alloc-issue
    source: dougall-lsq-post
    text: Load and store queue entries are allocated when the ops issue from the scheduler, not at rename or dispatch
    loc: p001
    quote: "discovered that load and store queue entries are allocated when the ops issue from the scheduler"
    method: wong-probe
    derivation: derived
    value: at issue
    supports: [lsu.allocation]
    notes: >-
      Intro, before the first heading. Reasoning in #final-notes: the 58-instruction gap between loads+loads and
      fsqrts+loads means loads keep entering the scheduler after the queue is full, "So I conclude that the resources
      are allocated late."
  - id: c-dj-lsq-lq-130
    source: dougall-lsq-post
    text: >-
      With two cache-missing loads as the delay, 128 loads fit between them before a stall; counting both delay loads,
      the load queue holds 130 entries
    loc: "#fighting-loads-with-loads"
    quote: "Since the first load, 128 other loads, and the last load are in flight at the same time, I'd call this a load queue size of 130"
    method: wong-probe
    filler: load
    derivation: measured
    value: 130
    unit: entries
    supports: [lq.entries]
    notes: >-
      Delay: two independent cache-missing loads; filler: loads. Johnson: "I still believe this to be correct". The
      FSQRT + dependent-branch probe gives 188 = 130 + 58 (c-dj-lsq-branch-loads-188).
  - id: c-dj-lsq-store-107
    source: dougall-lsq-post
    text: >-
      With cache-missing loads as the delay, 107 stores fit between them before a stall; Johnson withdrew his earlier
      reading of this as a 107-entry store queue
    loc: "#fighting-loads-with-loads"
    quote: "128 loads or 107 stores could run, without stopping the final long-latency load from executing in parallel ... I incorrectly called this a 107 entry store queue."
    method: wong-probe
    filler: store
    derivation: measured
    value: 107
    unit: stores
    supports: []
    notes: >-
      Delay: two cache-missing loads; filler: stores. Explained as 60 store-queue entries plus 47 scheduler entries
      (c-dj-lsq-scheduler-47); the base-register effect is c-dj-lsq-x29-base.
  - id: c-dj-lsq-sched-48
    source: dougall-lsq-post
    text: The load/store scheduler has 48 entries
    loc: "#schedulers-and-dispatch-queues"
    quote: "the load/store scheduler has 48 entries ... I found the last point at which an independent load could still fit into the scheduler and run, to find the scheduler size."
    method: wong-probe
    filler: loads or stores with addresses dependent on the delay
    derivation: measured
    value: 48
    unit: entries
    supports: [sched_ls.entries]
    notes: >-
      Delay: a long-latency chain; filler: loads or stores whose addresses depend on it; probe: one independent load
      that still runs. Repeated in #fighting-stores-with-square-roots.
  - id: c-dj-lsq-dispatch-10
    source: dougall-lsq-post
    text: The load/store dispatch queue in front of the scheduler has 10 entries
    loc: "#schedulers-and-dispatch-queues"
    quote: "with a 10 entry dispatch queue ... the number of extra load/stores, once the scheduler was full, that were required to block independent floating-point operations. That gives the dispatch queue size."
    method: wong-probe
    filler: loads or stores with addresses dependent on the delay
    derivation: measured
    value: 10
    unit: entries
    supports: [dispatch.ls_entries]
    notes: >-
      Delay: a long-latency chain; filler: dependent loads/stores beyond a full scheduler; probe: independent FP ops
      that get blocked. Mixing op types separates the queues.
  - id: c-dj-lsq-dispatch-stall
    source: dougall-lsq-post
    text: >-
      An op that finds both its scheduler and its dispatch queue full stalls the frontend: no further ops enter any
      dispatch queue until that queue has room
    loc: "#schedulers-and-dispatch-queues"
    quote: "But if the scheduler and dispatch queue are full, and we have an op that needs to go to that queue, we stall. This means no more ops can enter any dispatch queues until there is room in that queue."
    derivation: inferred
    supports: []
  - id: c-dj-lsq-fsqrt-329
    source: dougall-lsq-post
    text: >-
      With chains of square roots as the delay, about 329 loads or stores fit between them, the same limit for mixed
      loads and stores; Johnson attributes it to the coalescing retire queue, not the load/store queues
    loc: "#fighting-stores-with-square-roots"
    quote: "about 329 loads or stores can run between floating point operations, without forcing the two long-latency chains to run completely in parallel"
    method: wong-probe
    filler: loads or stores (also mixed)
    derivation: measured
    value: 329
    unit: loads or stores
    approx: true
    hedge: "about"
    supports: []
    notes: >-
      Delay: long-latency FP chains (fsqrt, per the heading and #final-notes); filler: independent loads or stores.
      Exceeds the 130/60 queue sizes, so queue entries are freed before retirement (c-dj-lsq-release-nonspec).
  - id: c-dj-lsq-release-nonspec
    source: dougall-lsq-post
    text: >-
      Loads and stores complete, freeing their load/store queue entries but not their retire queue entries, once they
      are non-speculative
    loc: "#fighting-stores-with-square-roots"
    quote: "I'm guessing that loads and stores can complete (free their load/store queue entries, but not their retire queue entries) once they are non-speculative."
    method: wong-probe
    derivation: inferred
    hedge: "I'm guessing"
    supports: []
    notes: >-
      Tested by making the loads/stores speculative: one initial load/store whose address depends on the delay, or (in
      the write-up) a branch dependent on it (c-dj-lsq-branch-loads-188).
  - id: c-dj-lsq-release-in-order
    source: dougall-lsq-post
    text: Load/store completion that frees queue entries happens in order relative to other loads and stores
    loc: "#fighting-stores-with-square-roots"
    quote: "I believe this completion is in-order relative to other loads and stores."
    derivation: inferred
    hedge: "I believe"
    supports: []
    notes: The intro states it as entries "released once they are non-speculative and all earlier loads and stores have been released".
  - id: c-dj-lsq-branch-loads-188
    source: dougall-lsq-post
    text: With a square-root delay and a branch dependent on it keeping the loads speculative, 188 loads fit before a stall
    loc: "#fighting-stores-with-square-roots"
    quote: "adding a branch, dependent on the result of the first long-latency operation ... we can run 188 loads or 118 stores without forcing the two long-latency chains to run completely in parallel"
    method: wong-probe
    filler: load
    derivation: measured
    value: 188
    unit: loads
    supports: []
    notes: >-
      Delay: FSQRT chain plus a dependent B.cc (chained via FCMP, per #the-data, since FMOV might interfere); filler:
      loads. 188 = 130 queue + 48 scheduler + 10 dispatch queue.
  - id: c-dj-lsq-branch-stores-118
    source: dougall-lsq-post
    text: With a square-root delay and a branch dependent on it keeping the stores speculative, 118 stores fit before a stall
    loc: "#fighting-stores-with-square-roots"
    quote: "This will ensure the loads and stores cannot become non-speculative, and keep their queue entries. In this test we see we can run 188 loads or 118 stores"
    method: wong-probe
    filler: store
    derivation: measured
    value: 118
    unit: stores
    supports: []
    notes: >-
      Delay: FSQRT chain plus a dependent B.cc (chained via FCMP); filler: stores. 118 = 60 store queue + 58.
  - id: c-dj-lsq-extra-58
    source: dougall-lsq-post
    text: >-
      The 58 entries beyond the queue sizes are the 48-entry load/store scheduler plus its 10-entry dispatch queue:
      integer and FP work continues while they fill, and the next load/store stalls the machine
    loc: "#fighting-stores-with-square-roots"
    quote: "If the load/store scheduler and dispatch queue are full, the integer and floating point units can continue operating. But if we hit one more load/store, the machine stalls ... This explains the 58 extra entries."
    method: wong-probe
    derivation: inferred
    value: 58
    unit: entries
    supports: []
  - id: c-dj-lsq-sq-60
    source: dougall-lsq-post
    text: Subtracting the 58 scheduler and dispatch-queue entries from the 118-store result, the store queue has 60 entries
    loc: "#fighting-stores-with-square-roots"
    quote: "By this logic (subtracting 58 for the size of the scheduler and dispatch queue), the store queue has only 60 entries."
    method: wong-probe
    filler: store
    derivation: derived
    value: 60
    unit: entries
    supports: [sq.entries]
    notes: >-
      Delay: FSQRT chain plus a dependent branch; filler: stores; 118 - 58. Johnson's summary: "130 load queue entries
      and 60 store queue entries".
  - id: c-dj-lsq-scheduler-47
    source: dougall-lsq-post
    text: >-
      The earlier 107-store result is 60 store-queue entries plus 47: a probe load can still enter and issue while the
      48-entry scheduler has one free entry, but not once it is full
    loc: "#fighting-stores-with-square-roots"
    quote: "So why did we think it had 47 more? Because if the 48 entry scheduler is almost full, but has one free entry, then a load can enter the scheduler, and then issue from the scheduler and execute"
    derivation: inferred
    value: 47
    unit: entries
    supports: []
  - id: c-dj-lsq-x29-base
    source: dougall-lsq-post
    text: >-
      With cache-missing loads as the delay, the store probe gives 60 when the second delay load is based on X29 and the
      stores on X29 or SP, but 107 when either base register is X3 (same values)
    loc: "#an-uncomfortable-surprising-discovery"
    quote: "I tried to reproduce the \"107 entry store queue\" result, but the result I got was 60 entries ... Changing either or both registers back to X3 (even though the values did not change) gave me 107 again."
    method: wong-probe
    filler: store
    derivation: measured
    value: 60
    unit: stores
    hedge: "take this section with a grain of salt"
    supports: []
    notes: >-
      Delay: two cache-missing loads (second one X29 + variable offset); filler: stores at X29 or SP + constant offset.
      In a July 2022 update Johnson could not reproduce this section on an M1 Max and suspects hardware or software
      revisions.
  - id: c-dj-lsq-x29-prediction
    source: dougall-lsq-post
    text: >-
      Memory dependency prediction appears to special-case X29 (the frame pointer): the load waits until it knows no
      older store aliases it, which it can check for up to 60 speculative stores but not 61
    loc: "#an-uncomfortable-surprising-discovery"
    quote: "X29 is typically used as the stack frame base pointer, and I suspect the memory dependency prediction has a special case for this, and makes the load wait until it knows the store doesn't alias it."
    derivation: inferred
    value: suspected X29 special case
    hedge: "I suspect"
    supports: [lsu.disambiguation]
    notes: Same M1 Max non-reproduction caveat as c-dj-lsq-x29-base. The intro calls it "a trick for manipulating load/store alias prediction".
  - id: c-dj-lsq-mov-counter
    source: dougall-lsq-post
    text: Apple's PMU has a MEMORY_ORDER_VIOLATION event, described as incorrect speculation between a store and a dependent load
    loc: "#an-uncomfortable-surprising-discovery"
    quote: "Apple provides a performance counter for this. It's called MEMORY_ORDER_VIOLATION and described as \"Incorrect speculation between store and dependent load\"."
    method: vendor-doc
    derivation: documented
    supports: []
  - id: c-dj-lsq-prf-not-late
    source: dougall-lsq-post
    text: >-
      Physical register file probes show no delay-type dependence (int+int vs int+float), so registers are neither
      allocated late nor freed early
    loc: "#final-notes"
    quote: "I do not see this kind of pattern when measuring physical register file sizes (e.g. comparing int+int vs int+float), so I believe they are neither allocated late, nor freed early."
    method: wong-probe
    derivation: inferred
    hedge: "I believe"
    supports: []

  - id: c-dj-ice-lq-30
    source: dougall-lsq-post
    text: Icestorm's load queue has 30 entries
    loc: "#fighting-stores-with-square-roots"
    quote: "The same logic works for Icestorm, where we see 30 load queue entries and 18 store queue entries"
    method: wong-probe
    filler: load
    derivation: measured
    value: 30
    unit: entries
    supports: []
    chip: icestorm
  - id: c-dj-ice-sq-18
    source: dougall-lsq-post
    text: Icestorm's store queue has 18 entries
    loc: "#fighting-stores-with-square-roots"
    quote: "The same logic works for Icestorm, where we see 30 load queue entries and 18 store queue entries"
    method: wong-probe
    filler: store
    derivation: measured
    value: 18
    unit: entries
    supports: []
    chip: icestorm
    notes: The X29-based probe also measures 18 on Icestorm (#an-uncomfortable-surprising-discovery).
  - id: c-dj-ice-sched-ls-18
    source: dougall-lsq-post
    text: Icestorm's load/store scheduler has 18 entries
    loc: "#fighting-stores-with-square-roots"
    quote: "18 store queue entries (with an 18 entry scheduler and a 6 entry dispatch queue)"
    method: wong-probe
    derivation: measured
    value: 18
    unit: entries
    supports: []
    chip: icestorm
  - id: c-dj-ice-dispatch-ls-6
    source: dougall-lsq-post
    text: Icestorm's load/store dispatch queue has 6 entries
    loc: "#fighting-stores-with-square-roots"
    quote: "with an 18 entry scheduler and a 6 entry dispatch queue"
    method: wong-probe
    derivation: measured
    value: 6
    unit: entries
    supports: []
    chip: icestorm
  - id: c-dj-group-issuing
    source: dougall-firestorm
    text: >-
      Groups of seven uops are only observed for eliminated instructions; issuing uops are limited to roughly
      four per retire group
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "with issuing uops limited to roughly four per group"
    method: wong-probe
    derivation: measured
    value: 4
    approx: true
    unit: uops
    hedge: "roughly four"
    supports: [retire.group_issuing_uops]
    notes: >-
      330 groups at four issuing uops is ~1,320, not the "just over 1000" issuing window the same paragraph
      gives; three per group (~990) fits that window
  - id: c-dj-rename-cost
    source: dougall-firestorm
    text: >-
      Every architectural register write takes a rename retire queue entry, eliminated or not: cbz and str
      take none, add and mov one, adds and ldp two
    loc: "#completion-and-the-reorder-buffer-rob"
    quote: "cbz or str do not require entries, add and mov need one entry, and adds or ldp need two entries"
    method: wong-probe
    derivation: measured
    supports: []

