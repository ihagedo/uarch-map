# xnu.yaml
# Apple, 2025
# What Apple's XNU kernel says about its cores: A8 to A13 errata tunables, sleep and IPI controls, L1 sizes and cache maintenance.
session: xnu
source: xnu

claims:
  - id: c-xnu-a8-loop-buffer
    text: Typhoon has a loop buffer, and XNU turns it off (HID0 LoopBuffDisb) to avoid an LSP bug that could wedge the core when CONTEXTIDR is written
    loc: p003
    quote: "Disable LSP flush with context switch to work around bug in LSP ... that can cause Typhoon to wedge when CONTEXTIDR is written. ... orr x12, x12, ARM64_REG_HID0_LoopBuffDisb"
    derivation: documented
    chip: a8
    supports: []
    notes: Earlier core (A8, Typhoon). Set in the APPLETYPHOON block of start.s at tag xnu-6153.141.1.
  - id: c-xnu-a8-l2-starvation
    text: Typhoon's L2 has a starvation mode that a snoop evicting an exclusive-monitor line can trigger, and XNU turns that trigger off
    loc: p003
    quote: "mrs x12, ARM64_REG_HID3 orr x12, x12, ARM64_REG_HID3_DisXmonSnpEvictTriggerL2StarvationMode"
    derivation: documented
    chip: a8
    supports: []
    notes: Earlier core (A8). Read from the bit name; Xmon is taken as the exclusive monitor.
  - id: c-xnu-a8-hwp-ld-st
    text: Typhoon has separate hardware-prefetch disable bits for loads and for stores, and XNU clears both so the prefetchers stay on
    loc: p003
    quote: "and x12, x12, (~ARM64_REG_HID5_DisHwpLd) and x12, x12, (~ARM64_REG_HID5_DisHwpSt)"
    derivation: inferred
    chip: a8
    supports: []
    notes: Earlier core (A8). HWP read as hardware prefetch from the bit names.
  - id: c-xnu-a8-dataset-id
    text: Core memory requests carry a memcache (SLC) data set ID, and XNU changes its default from 0 to 15 on Typhoon
    loc: p003
    quote: "Change the default memcache data set ID from 0 to 15"
    derivation: documented
    chip: a8
    supports: []
    notes: Earlier core (A8). The Twister (A9) block sets the same default in four data set ID fields of HID8.
  - id: c-xnu-a9-fmul
    text: Twister's NEX unit has a fast FP multiply mode, and XNU turns it off for a 4-cycle multiply latency that avoids denormal stalls
    loc: p003
    quote: "Use 4-cycle MUL latency to avoid denormal stalls ... orr x12, x12, #ARM64_REG_HID7_disNexFastFmul"
    derivation: documented
    value: 4
    unit: cycles
    chip: a9
    supports: []
    notes: Earlier core (A9). The bit name ties NEX to the FP multiplier, which is why NEX is read as the FP/SIMD unit elsewhere.
  - id: c-xnu-a10-edb-snoop
    text: Hurricane reserves EDB credits for snoops (HID5 CrdEdbSnpRsvd), and XNU raises the reservation to lower the risk of starvation
    loc: p003
    quote: "Increase Snoop reservation in EDB to reduce starvation risk ... orr x12, x12, ARM64_REG_HID5_CrdEdbSnpRsvd_VALUE"
    derivation: documented
    chip: a10
    supports: []
    notes: Earlier core (A10). EDB is probably the eviction data buffer for dirty L1 victims, a reading of the name.
  - id: c-xnu-a10-ic-prefetch
    text: Hurricane has an instruction-cache prefetcher with a configurable depth, which XNU sets to 1, and a mode that limits it to one branch
    loc: p003
    quote: "IC prefetch configuration ... orr x12, x12, (1 << ARM64_REG_HID0_ICPrefDepth_bshift) orr x12, x12, ARM64_REG_HID0_ICPrefLimitOneBrn"
    derivation: inferred
    value: 1
    chip: a10
    supports: []
    notes: Earlier core (A10). What the depth counts (lines or branches) is not stated; read from the field names.
  - id: c-xnu-a10-aes-fusion
    text: Hurricane can fuse AES pairs that span two decode groups, and XNU turns that cross-group fusion off
    loc: p003
    quote: "disable crypto fusion across decode groups ... orr x12, x12, ARM64_REG_HID1_disAESFuseAcrossGrp"
    derivation: documented
    chip: a10
    supports: []
    notes: Earlier core (A10). Fusion that crosses a decode-group boundary is the case switched off.
  - id: c-xnu-a10x-dczva-cmd
    text: On the A10X (Myst) DC ZVA can go out as a command only, without data, and XNU clears the bit that would disable this
    loc: p003
    quote: "Clear DisDcZvaCmdOnly ... Per Myst A0/B0 tunables document ... and x12, x12, ~ARM64_REG_HID3_DisDcZvaCmdOnly"
    derivation: inferred
    chip: a10
    supports: []
    notes: Earlier core (A10X, board T8011). Command-only read from the bit name; a zeroing command without data fits zeroing at the L2.
  - id: c-xnu-a11-wkdm-colors
    text: On Skye the bus interface returns WKdm write acknowledgements per color, and acknowledgements for both colors can assert together
    loc: p003
    quote: "WKdm write ack lost when bif_wke_colorWrAck_XXaH asserts concurrently for both colors"
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11, all Skye cores). Two colors on write acknowledgements is weak support for color-tagged ordering.
  - id: c-xnu-a11-wkdm-strict
    text: Skye has a WKdm compression engine (WKE) attached to the bus interface (BIF), and XNU forces it into strict ordering
    loc: p003
    quote: "SW WAR/eval: WKdm write ack lost ... orr x12, x12, #ARM64_REG_HID8_WkeForceStrictOrder"
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11). WKE read as the WKdm engine from the signal name bif_wke.
  - id: c-xnu-smb-drain
    text: >-
      On Skye E-cores a store can be held in an SMB, where it can be invalidated, and the SMB drains by a threshold field that XNU
      sets to zero
    loc: p003
    quote: "Atomic launch eligibility is erroneously taken away when a store at SMB gets invalidated ... and x12, x12, ~(ARM64_REG_EHID11_SmbDrainThresh_mask)"
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11 E-core, Mistral). SMB is read as a store merge buffer; the erratum also shows atomics have a launch eligibility tied to it.
  - id: c-xnu-a11-fill-bypass
    text: Skye's E-cluster L2 can bypass fill data from either of two pipes straight to an E-core, and XNU turns the bypass off on early silicon
    loc: p003
    quote: "Disable downstream fill bypass logic ... L2E fill bypass collision from both pipes to ecore"
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11 E-cluster), revisions before B0 only.
  - id: c-xnu-a11-nfp-ret-fwd
    text: Skye E-cores forward return addresses to the next fetch predictor (NFP), and XNU turns this off on early silicon
    loc: p003
    quote: "Disable forwarding of return addresses to the NFP ... orr x12, x12, ARM64_REG_EHID0_nfpRetFwdDisb"
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11 E-core), revisions before B0 only, after a bug where fetch took an illegal VA exception.
  - id: c-xnu-a11-clkdiv-gating
    text: Skye cores have clock-divider gating, which XNU turns off on early silicon because of a cluster power-down bug
    loc: p003
    quote: "Disable clock divider gating ... orr x12, x12, ARM64_REG_HID6_DisClkDivGating"
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11), revisions before B0. The name only; how the divider gates the clock is not stated.
  - id: c-xnu-a11-acc-link-fsm
    text: >-
      Powering down a Skye cluster (ACC) runs a link state machine that goes from going-down to cancel, and an upstream drain
      request can arrive during that switch
    loc: p003
    quote: "ACC power down issue when link FSM switches from GO_DN to CANCEL and at the same time upStreamDrain request is set."
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11). Shows a cluster power-down handshake with the fabric link that can be cancelled.
  - id: c-xnu-a11-clock-dither
    text: Skye clusters dither their clock, and XNU turns dithering off on early silicon after LLC PIO errors
    loc: p003
    quote: "Disable clock dithering ... [Tunable] Skye A0: Linux: LLC PIO Errors"
    derivation: documented
    chip: a11
    supports: []
    notes: Earlier core (A11), set in ACC_OVRD and the E-block override. Confirms clock dithering on an earlier core (c-mh-v3-clock-dither).
  - id: c-xnu-a12-br-kill-limit
    text: Vortex P-cores have a branch kill limit, which XNU enables to stop data corruption from incorrect branch predictor resolution
    loc: p003
    quote: "rdar://problem/36716477: data corruption due to incorrect branch predictor resolution ... orr x12, x12, ARM64_REG_HID1_enaBrKillLimit"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier core (A12 Vortex), all Aruba parts and Cyprus B0 or later. What the limit counts is not stated.
  - id: c-xnu-a12-iex-clock-gating
    text: Vortex clock-gates its integer execution (IEX) logic, and XNU forces all IEX level-3 clocks on after segfaults caused by the gating
    loc: p003
    quote: "rdar://problem/34435356: segfaults due to IEX clock-gating ... orr x12, x12, ARM64_REG_HID1_rccForceAllIexL3ClksOn"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier core (A12 P-core). IEX read as the integer execution units.
  - id: c-xnu-a12-prefetch-pipe-gating
    text: Tempest E-cores clock-gate the prefetcher training pipe with an extended power-saving mode, and XNU reverts it to the default gating
    loc: p003
    quote: "Disable the extension of prefetcher training pipe clock gating, revert to default gating ... orr x12, x12, ARM64_REG_EHID10_rccDisPwrSavePrfClkOff"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier core (A12 E-core). The A13 block does the same on its E-cores.
  - id: c-xnu-a12-bif-skid
    text: The A12X bus interface (BIF) has a fill buffer with a skid buffer behind it, and XNU enables stall logic so the skid buffer cannot overflow
    loc: p003
    quote: "Enable BIF fill buffer stall logic to prevent skid buffer overflow (Aruba A1 only) ... orr x12, x12, ARM64_REG_HID5_EnableDnFIFORdStall"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier chip (A12X Aruba, board T8027), A1 silicon only. The bit names a downstream FIFO read stall.
  - id: c-xnu-a12-ordered-ld
    text: >-
      XNU makes A12 cores hold ordered loads in the LSU until all older loads have completed, because the AF2 fabric's ordering
      rules allow Arm device-ordering violations
    loc: p003
    quote: "Prevent ordered loads from being dispatched from LSU until all prior loads have completed. ... AF2 ordering rules allow ARM device ordering violations"
    derivation: documented
    chip: a12
    supports: []
    notes: >-
      Earlier cores (A12 P and E cores, HID4 ForceNsOrdLdReqNoOlderLd); the A13 block sets it on both core types too. Without the
      bit, ordered loads leave the LSU earlier and rely on the fabric for order.
  - id: c-xnu-a12-poison-barrier
    text: On Vortex an older load barrier is meant to redirect a younger load that crosses a poisoned cache line, and it failed to
    loc: p003
    quote: "[Cyprus Tunable] Poisoned cache line crossing younger load is not redirected by older load-barrier"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier core (A12 P-core). Shows poisoned lines and barrier-driven redirects of younger loads in shipped silicon.
  - id: c-xnu-a12-color-opt
    text: Vortex and Tempest have a color optimization (HID3 and EHID3 ColorOpt) that XNU turns off to fix the poisoned-load redirect errata
    loc: p003
    quote: "Poisoned cache line crossing younger load is not redirected by older load-barrier ... orr x12, x12, ARM64_REG_HID3_DisColorOpt"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier cores (A12). The E-core sets EHID3 DisColorOpt for the load-acquire erratum. A color optimization tied to barriers fits color-tagged ordering.
  - id: c-xnu-a12-poison-acquire
    text: On Tempest E-cores an older load-acquire is meant to redirect a poisoned younger load, and it failed to
    loc: p003
    quote: "rdar://problem/36595004: Poisoned younger load is not redirected by older load-acquire"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier core (A12 E-core). Load-acquire as well as load barriers redirects poisoned younger loads.
  - id: c-xnu-a12-uc-unaligned-store
    text: Vortex launches uncacheable unaligned stores early, and XNU turns that off because it broke load-load ordering
    loc: p003
    quote: "disable faster launches of uncacheable unaligned stores to workaround load/load ordering violation ... orr x12, x12, ARM64_REG_HID11_DisX64NTLnchOpt"
    derivation: documented
    chip: a12
    supports: []
    notes: Earlier core (A12 P-core); the A13 P-core sets the same bit. The bit name points at stores that cross a 64 B line.
  - id: c-xnu-a13-stnt-threshold
    text: Lightning's LSU has a store non-temporal (STNT) widget that counts contiguous stores, and XNU sets its counter threshold to 3
    loc: p003
    quote: "Post-silicon tuning of STNT widget contiguous counter threshold ... orr x12, x12, 3 << ARM64_REG_HID4_CnfCntrThresh_shift"
    derivation: documented
    value: 3
    chip: a13
    supports: []
    notes: Earlier core (A13 Lightning, Cebu B0/B1). XNU also turns the widget off for unaligned stores (HID9 DisSTNTWidgetForUnalign).
  - id: c-xnu-a13-stnt-disable
    text: Lightning's store non-temporal widget downgrades stores to non-temporal, and XNU turns it off entirely on the P-cores
    loc: p003
    quote: "rdar://problem/51690962: Disable Store-Non-Temporal downgrade widget ... orr x12, x12, ARM64_REG_HID4_DisSTNTWidget"
    derivation: documented
    chip: a13
    supports: []
    notes: Earlier core (A13 P-core). Set in the same block that tunes the widget's threshold.
  - id: c-xnu-a13-x64-barrier
    text: On Lightning, loads that cross a 64 B line could break barrier load ordering, fixed by a chicken bit
    loc: p003
    quote: "Barrier Load Ordering property is not satisfied for x64-loads ... orr x12, x12, ARM64_REG_HID9_EnableFixBug47221499"
    derivation: documented
    chip: a13
    supports: []
    notes: Earlier core (A13 P-core). x64 read as crossing a 64 B boundary, as in the kpep event LDST_X64_UOP.
  - id: c-xnu-a13-rf-bank-multipass
    text: >-
      Lightning's register-file banks can conflict with multipass issue, and the forward-progress widget for that conflict
      missed livelocks of three or more cycles
    loc: p003
    quote: "RF bank and Multipass conflict forward progress widget does not handle 3+ cycle livelock"
    derivation: documented
    chip: a13
    supports: []
    notes: Earlier core (A13 P-core). Shows a banked register file with read conflicts, not its bank count or power.
  - id: c-xnu-a13-xpick-rs45
    text: >-
      Lightning's reservation stations 4 and 5 can cross-pick work for each other, and RS4 has a secondary mode; XNU enables
      both to break the livelock
    loc: p003
    quote: "orr x12, x12, ARM64_REG_HID16_EnRs4Sec and x12, x12, ~ARM64_REG_HID16_DisxPickRs45 orr x12, x12, ARM64_REG_HID16_EnMPxPick45"
    derivation: inferred
    chip: a13
    supports: []
    notes: Earlier core (A13 P-core). Read from the bit names; the same write also sets EnMPCyc7.
  - id: c-xnu-a13-nex-pg
    text: Lightning P-cores power-gate the NEX unit, and XNU adds 4 dummy pre-cycles because the gating upset temperature-sensor readings
    loc: p003
    quote: "configure dummy cycles to work around incorrect temp sensor readings on NEX power gating ... orr x12, x12, 4 << ARM64_REG_HID13_PreCyc_shift"
    derivation: documented
    value: 4
    unit: cycles
    chip: a13
    supports: []
    notes: Earlier core (A13 P-core). NEX read as the FP/SIMD unit (see c-xnu-a9-fmul). Current XNU says NEX power gating is not available on E-cores.
  - id: c-xnu-a13-leq-credits
    text: Lightning hands out LEQ entries by credits and can throttle them, and XNU makes the throttling aggressive to work around a credit leak
    loc: p003
    quote: "enable aggressive LEQ throttling to work around LEQ credit leak ... orr x12, x12, ARM64_REG_HID16_leqThrottleAggr"
    derivation: documented
    chip: a13
    supports: []
    notes: Earlier core (A13 P-core). LEQ read as the load execution queue.
  - id: c-xnu-a13-amx-fusion
    text: >-
      Lightning fuses a direct branch with an AMX (EAS) instruction, which went wrong at a cross-beat location, and the bit XNU
      sets to stop it is named CacheFusionDisable
    loc: p003
    quote: "Incorrect fusing of a direct branch with AMX/EAS instruction at cross-beat location ... orr x12, x12, ARM64_REG_HID0_CacheFusionDisable"
    derivation: documented
    chip: a13
    supports: []
    notes: Earlier core (A13 P-core). The bit name hints that fusion is marked in the I-cache, and a beat is probably one fetch read of a line.
  - id: c-xnu-a13-sibling-merge
    text: The A13 cluster's LLC merges sibling fills, which can let an uncacheable load break Arm ordering, so XNU turns the merge off
    loc: p003
    quote: "[Cebu ACC Errata] Sibling Merge in LLC can cause UC load to violate ARM Memory Ordering Rules. ... orr x12, x12, ARM64_REG_HID5_DisFill2cMerge"
    derivation: documented
    chip: a13
    supports: []
    notes: Earlier chip (A13, all cores). LLC is the cluster L2 in Apple's names; sibling is probably the other 64 B half of a 128 B line, a reading.
  - id: c-xnu-a13-uc-stlf
    text: Thunder E-cores forward stores to loads even for uncacheable memory, and XNU stops this by forcing such stores to drain first
    loc: p003
    quote: "Prevent store-to-load forwarding for UC memory to avoid barrier ordering violation ... orr x12, x12, ARM64_REG_EHID10_ForceWStDrainUc"
    derivation: documented
    chip: a13
    supports: []
    notes: Earlier core (A13 E-core), only on two-cluster parts.
  - id: c-xnu-fs-l1i-256
    text: Apple's kernel header gives Firestorm a 256 KB instruction cache
    loc: p004
    quote: "I-Cache, 256KB for Firestorm, 128KB for Icestorm, 6-way."
    derivation: documented
    value: 256
    unit: KiB
    supports: []
    contradicts: [l1i.size]
    notes: A comment in proc_reg.h. The measured and cache-register value is 192 KiB (c-pac-l1i-size, c-ilk-l1i-size).
  - id: c-xnu-fs-l1i-6way
    text: Apple's kernel header gives the Firestorm and Icestorm instruction caches 6 ways
    loc: p004
    quote: "I-Cache, 256KB for Firestorm, 128KB for Icestorm, 6-way."
    derivation: documented
    value: 6
    unit: ways
    supports: []
    contradicts: [l1i.assoc]
    notes: The 6-way follows both sizes, as in the other cores' comments. Agrees with c-pac-l1i-ways and c-ilk-l1i-ways against the inferred 12.
  - id: c-xnu-fs-l1d-160
    text: Apple's kernel header gives Firestorm a 160 KB data cache
    loc: p004
    quote: "D-Cache, 160KB for Firestorm, 8-way. 64KB for Icestorm, 6-way."
    derivation: documented
    value: 160
    unit: KiB
    supports: []
    contradicts: [l1d.size]
    notes: A comment in proc_reg.h. Every measurement gives 128 KiB (l1d.size).
  - id: c-xnu-fs-l1d-8way
    text: Apple's kernel header gives the Firestorm data cache 8 ways
    loc: p004
    quote: "D-Cache, 160KB for Firestorm, 8-way. 64KB for Icestorm, 6-way."
    derivation: documented
    value: 8
    unit: ways
    supports: [l1d.assoc]
  - id: c-xnu-fs-line-64
    text: XNU uses a 64 B line for both the Firestorm instruction and data caches
    loc: p004
    quote: "I-Cache, 256KB for Firestorm ... #define MMU_I_CLINE 6 /* cache line size as 1<<MMU_I_CLINE (64) */ /* D-Cache, 160KB for Firestorm ... #define MMU_CLINE 6 /* cache line size is 1<<MMU_CLINE (64) */"
    derivation: documented
    value: 64
    unit: B
    supports: [l1i.line, l1d.line]
  - id: c-xnu-is-l1i
    text: Apple's kernel header gives Icestorm a 128 KB, 6-way instruction cache
    loc: p004
    quote: "I-Cache, 256KB for Firestorm, 128KB for Icestorm, 6-way."
    derivation: documented
    value: 128
    unit: KiB
    chip: icestorm
    supports: []
  - id: c-xnu-is-l1d
    text: Apple's kernel header gives Icestorm a 64 KB, 6-way data cache
    loc: p004
    quote: "D-Cache, 160KB for Firestorm, 8-way. 64KB for Icestorm, 6-way."
    derivation: documented
    value: 64
    unit: KiB
    chip: icestorm
    supports: []
  - id: c-xnu-a13-l1i
    text: Apple's kernel header gives Lightning a 192 KB, 6-way instruction cache
    loc: p004
    quote: "I-Cache, 192KB for Lightning, 96KB for Thunder, 6-way."
    derivation: documented
    value: 192
    unit: KiB
    chip: a13
    supports: []
    notes: Earlier core (A13). Thunder, its E-core, gets 96 KB.
  - id: c-xnu-a13-l1d
    text: Apple's kernel header gives Lightning a 128 KB, 8-way data cache
    loc: p004
    quote: "D-Cache, 128KB for Lightning, 8-way. 48KB for Thunder, 6-way."
    derivation: documented
    value: 128
    unit: KiB
    chip: a13
    supports: []
    notes: Earlier core (A13). Thunder gets 48 KB, 6-way.
  - id: c-xnu-m2-l1i
    text: Apple's kernel header gives Avalanche a 192 KB, 6-way instruction cache
    loc: p004
    quote: "I-Cache, 192KB for Avalanche, 128KB for Blizzard, 6-way."
    derivation: documented
    value: 192
    unit: KiB
    chip: m2
    supports: []
    notes: Avalanche is the M2 P-core; Blizzard, its E-core, gets 128 KB.
  - id: c-xnu-m2-l1d
    text: Apple's kernel header gives Avalanche a 128 KB, 8-way data cache
    loc: p004
    quote: "D-Cache, 128KB for Avalanche, 8-way. 64KB for Blizzard, 8-way."
    derivation: documented
    value: 128
    unit: KiB
    chip: m2
    supports: []
    notes: Blizzard gets 64 KB, 8-way.
  - id: c-xnu-eret-no-sls
    text: On Apple cores an SB or ISB after ERET is technically unnecessary to stop straight-line speculation past the exception return
    loc: p004
    quote: 'It prevents "straight-line speculation" (an Arm term) past the ERET. ... sb // Technically unnecessary on Apple micro-architectures, may restrict mis-speculation on other architectures'
    derivation: documented
    supports: []
    notes: Generic code for all Apple cores. Read as the cores not running on past an ERET.
  - id: c-xnu-six-nops
    text: When SB is unavailable XNU follows ERET with an ISB and six NOPs, which its comment says pad out and terminate the instruction decode group
    loc: p004
    quote: "isb // ISB technically unnecessary on Apple micro-architectures, may restrict mis-speculation on other architectures nop // Sequence of six NOPs to pad out and terminate instruction decode group"
    derivation: documented
    value: 6
    unit: instructions
    supports: []
    notes: Generic fallback for Apple cores built without SB; cores with SB skip it. The comment does not say which core's decode group the NOPs are sized for.
  - id: c-xnu-wfi-power-down
    text: Before its final WFI on sleep or shutdown, a core's CPU_OVRD power-down field is set to force-down, so the WFI powers the core off
    loc: p002
    quote: 'Set "OK to power down" (<rdar://problem/12390433>) mrs x9, CPU_OVRD orr x9, x9, #(ARM64_REG_CYC_OVRD_ok2pwrdn_force_down)'
    derivation: documented
    supports: []
    notes: Generic code for all Apple cores; builds defining NO_CPU_OVRD skip it.

new_mechanisms:
  store_merge_buffer:
    name: Store merge buffer
    block: sq
    chip: a11
    status: inferred
    description: Stores wait in a store merge buffer (SMB) that drains by a programmable threshold, and a store held there can be invalidated.
    params: []
    claims: [c-xnu-smb-drain]
    sim_switch: null
    detection_rule: >-
      A burst of stores to one small chunk of a line writes the L1D fewer times than it has stores, so it outruns the L1D store
      rate until the drain threshold forces the buffer out.
  snoop_starvation_guard:
    name: Snoop starvation safeguards
    block: l2
    chip: a10
    status: inferred
    description: >-
      The L2 has a starvation mode that snoop evictions of exclusive-monitor lines can trigger, and the core reserves
      eviction-buffer credits for snoops so they are not starved.
    params: []
    claims: [c-xnu-a8-l2-starvation, c-xnu-a10-edb-snoop]
    sim_switch: null
    detection_rule: >-
      LDXR/STXR loops on one line while another core floods it with snoops would show stretches of no progress ended by a
      sudden recovery when the starvation mode starts.
  cluster_sleep_states:
    name: Core and cluster sleep states
    block: power
    status: inferred
    description: >-
      WFI either only clock-gates a core or lets it power down, chosen in CPU_OVRD; cluster deep sleep sets ACC_OVRD fields for
      the L2 flush, SRM and CPM power-down and link train-down, and branch predictor state can be kept across cluster sleep.
    params: []
    claims: [c-xnu-wfi-power-down, c-xnu-a11-acc-link-fsm]
    sim_switch: null
    detection_rule: >-
      Wake-up delay after idle falls into distinct levels (clock-gated, core powered down, cluster in deep sleep), and branch
      mispredicts right after a cluster wake show whether predictor state survived.
  exec_clock_gating:
    name: Clock gating of idle execution pipes
    block: eu_int
    chip: a12
    status: inferred
    description: >-
      Integer execution (IEX) clocks and the prefetcher training pipe are clock-gated when idle, with tunables that force the
      clocks on or limit the gating.
    params: []
    claims: [c-xnu-a12-iex-clock-gating, c-xnu-a12-prefetch-pipe-gating]
    sim_switch: null
    detection_rule: >-
      The first integer ops after a long stretch of non-integer work issue a cycle or more late, a delay that a steady
      integer loop never shows.

