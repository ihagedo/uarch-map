# handley-vol3-fabric.yaml
# Maynard Handley, 2025
# Fabric QoS and DRAM scheduling, AMX internals, clocks, interrupts and page compression from Apple patents (AArch64-Explore vol 3).
session: handley-vol3-fabric
source: handley-vol3

claims:
  - id: c-mh-v3-sideways-hold
    text: >-
      Handley assumes that data moved sideways from one cluster to another can be tagged as needing ordering, held
      invisible in the receiving L1 until the coherence point's ordered response arrives
    loc: p148
    quote: "it can be tagged as requiring ordering, in which case it will be placed in some temporary holding location in the relevant L1, but not yet visible"
    derivation: inferred
    hedge: "I assume"
    supports: []
    notes: The inter-cluster snoop patent (US11016913B1) does not describe this.
  - id: c-mh-v3-snoop-qos
    text: >-
      Per a 2018 patent, snoop requests carry a QoS, presumably inherited from the request that caused them, and once
      a priority snoop enters a snooper's queue only a limited number of non-priority snoops are served before it
    loc: p148
    quote: "once a priority snoop enters the queue, only a limited number of non-priority snoops are allowed to be serviced before the priority snoop is serviced"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10795818B1 (2018).
  - id: c-mh-v3-iso-windows
    text: >-
      Per a 2018 patent, isochronous clients tell the memory controller their bandwidth and buffering needs, and it
      assigns each a time slot (transaction window) in which to send requests without colliding with the others
    loc: p148
    quote: "assigns time slots (Transaction Windows) to each client during which they should send out their requests"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US11086534B2 (2018). A client that falls behind is granted a one-time burst, for example twice its usual transactions.
  - id: c-mh-v3-write-credit-reply
    text: >-
      Per a 2018 patent, a write returns no data to give a credit back, so the memory controller replies when it
      enqueues the write, and the reply reports how many write credits remain
    loc: p149
    quote: "a reply is sent when the write request is enqueued. - this reply gives some sort of information about the number of write credits left"
    method: patent-reading
    derivation: inferred
    hedge: "The patent is somewhat vague on details"
    supports: []
    notes: US10437758B1 (2018). Credits belong to request streams defined by requester ID, flow ID and QoS, and run from the memory controller to the requester.
  - id: c-mh-v3-buffer-lending
    text: >-
      Per a 2018 patent, the central bandwidth controller notices a producer, such as a bursty CPU writing past its
      caches, using more fabric buffers than allotted and lends it buffers other requesters are not using, so back
      pressure does not stall the CPU
    loc: p150
    quote: "have the central bandwidth controller not just allocate bandwidth but also notice situations where more buffers are being consumed than expected"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10963172B2 (2018).
  - id: c-mh-v3-edge-limits
    text: >-
      Per a 2020 patent, a central manager hands out bandwidth as credits allocated and retracted at the edge of the
      fabric, throttling packets before they enter rather than buffering them inside
    loc: p150
    quote: "the 2020 scheme seems to operate at a more abstract level on the basis of credits that are allocated and retracted at the edge of the fabric"
    method: patent-reading
    derivation: inferred
    hedge: "seems to"
    supports: []
    notes: US20210326169A1 (2020), which Handley reads as an update of the 2018 buffer-allocation scheme.
  - id: c-mh-v3-critical-client
    text: >-
      Per a late 2020 patent, while a critical client such as audio is active, the bandwidth allocations of the other
      clients in its virtual channel, the CPU among them, are cut back
    loc: p150
    quote: "the bandwidth allocations given to other ... are dialed back ... to be reverted when the critical ... stops using the fabric"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20220107836A1 (2020).
  - id: c-mh-v3-retry-table
    text: >-
      Per a 2019 patent, a fabric transaction that wins arbitration but cannot get its resource moves from the
      Transaction Table to a Retry Table; if that is full it stays locked in place, a per-source counter rises, and a
      source that runs the counter too high is throttled
    loc: p151
    quote: "if the transaction that was selected by Arbitration is unable to move forward because the required resource is not available, the transaction moves to a Retry Table"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US11275616B2 (2019). Handley reads it as a fallback for over-committed credits, such as DRAM credits spent on requests the SLC serves.
  - id: c-mh-v3-dram-vc-category
    text: >-
      Per a 2018 patent, memory-controller transactions belong to virtual channels of class realtime, low latency or
      bulk, carry one of four priorities, and are queued per DRAM bank, with arbitration and aging per bank and channel
    loc: p152
    quote: "Transactions within a Virtual Channel have one of four priorities ... Within the Memory Controller, transactions are grouped by target Bank"
    method: patent-reading
    derivation: inferred
    value: 4
    unit: priorities
    supports: []
    notes: US10545701B1 (2018).
  - id: c-mh-v3-dram-bank-arb
    text: >-
      Each DRAM bank picks its highest-category request, breaking ties by least recently used channel; the winning
      channel drops one category in that bank and regains it once demoted in every bank, and the controller spreads
      requests over as many banks as possible each cycle
    loc: p153
    quote: "once a VC wins for a bank, the entire channel (within that bank) gets its Category demoted one level"
    method: patent-reading
    derivation: inferred
    hedge: "as I understand it"
    supports: []
    notes: Same patent (US10545701B1); more detail in US20200081622A1 (2018).
  - id: c-mh-v3-latency-tolerance
    text: >-
      Priority overrides in the memory controller are gated by a Current Latency Tolerance: when it is low only
      realtime channels are upgraded, in a middle range none are, and when it is high low-latency requesters such as
      the CPU may be upgraded
    loc: p153
    quote: "For high values of Current Latency Tolerance (Realtime requestors have ample bandwidth) we allow Low Latency requestors (eg the CPU) to get priority upgrades"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Same 2018 patent. Realtime upgrades are allowed more freely ahead of known disruptions such as DRAM recalibration.
  - id: c-mh-v3-turn-latency
    text: >-
      Besides write-queue watermarks, the decision to leave write mode early and turn to reads weighs the Current
      Latency Tolerance and how many high-priority low-latency reads are waiting
    loc: p153
    quote: "we now also look at the Current Latency Tolerance and the number of Low Latency but high priority Read requests"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-write-queue-freeze
    text: >-
      The memory controller does not drain its write queue before sleeping; the queue is frozen while the controller
      and the DRAM (in self-refresh) sleep, and resumes on wake
    loc: p154
    quote: "the write queue is simply frozen in the Memory Controller ... to continue as before once we return from sleep"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Handley ties this to sleep transitions that now happen at millisecond intervals.
  - id: c-mh-v3-raw-merge
    text: >-
      A read that overlaps a queued partial write goes to DRAM ahead of the write, and the write data is merged into
      the read data on the way out of the memory controller
    loc: p154
    quote: "The read is allowed to proceed ahead of the write, so that the full read data is available. On the exit path from the Memory Controller, the write data is then merged into the read data"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-write-merge
    text: >-
      Several writes to the same address are merged in the memory controller, using their byte enables, into one
      DRAM write
    loc: p154
    quote: "if multiple writes exist to the same address, they will be merged in the memory controller to one request before that is submitted to DRAM"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-refresh-window
    text: >-
      Bank refreshes are placed flexibly within a refresh window: as its counter runs down they are slipped first into
      write turns, then into read turns, and finally forced, with a shorter window and a lookahead once time runs short
    loc: p155
    quote: "Once this counter is not quite so high, we consider submitting Refresh requests during a Write turn ... If the counter gets even lower, now we start to consider Refresh requests during a Read turn"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-access-efficiency
    text: >-
      Per a 2018 patent, after each read turn and write turn the memory controller compares its access efficiency with
      a target, favouring latency in the next round when above it and bandwidth (fewer reads per read turn, more
      writes per write turn) when below
    loc: p155
    quote: "we then compare it with a target efficiency. If we are higher than the target, then we can run the next round of accesses so as to prioritize latency"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10678478B2 (2018).
  - id: c-mh-v3-rmw-last-read
    text: >-
      Partial writes that need a read-modify-write are scheduled as the last reads of a read turn, so the merged line
      is ready to write once the DRAM has turned to write mode
    loc: p156
    quote: "you specifically schedule these as the last element of a sequence of reads"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Same 2018 patent. Handley does not know the DRAM minimum access unit on the M1 and assumes 64 B for his example.
  - id: c-mh-v3-dram-linked-lists
    text: >-
      Per a 2018 patent, requests chosen per bank are linked into several lists at once, such as one per open DRAM
      page and one per virtual channel; the controller walks the page list until it runs out, then picks the next
      channel, realtime before low latency before bulk unless a channel head is too old
    loc: p156
    quote: "the same request may be placed at the end of a list of reads that all target a particular DRAM page, and at the end of a separate list for this particular Virtual Channel"
    method: patent-reading
    derivation: inferred
    hedge: "I think the idea is something like"
    supports: []
    notes: US10817219B2 (2018).
  - id: c-mh-v3-page-streak-cap
    text: >-
      Channel heads whose request has a following page hit are favoured, and a counter ends a run of page hits that
      grows too long, so one requester with good locality cannot hold the bank
    loc: p157
    quote: "we have a counter that tracks this and, if it reaches high enough, kills use of that page list and returns us to the search over the list of Virtual Channels"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-rt-amplification
    text: >-
      Per a 2022 patent, realtime bandwidth budgets add an amplification factor for requests that hit in the SLC's
      duplicate tags and turn one DRAM access into several NoC transactions, so the NoC is not oversubscribed
    loc: p159
    quote: "some sort of amplification factor that will vary over time depending on exactly how RT traffic is being moved around"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20230325086A1 (2022). The patent's baseline has several SLC slices and memory controllers under a closed-loop latency tolerance controller.
  - id: c-mh-v3-bw-fabric-clock
    text: >-
      Per a 2012 patent, the central bandwidth management controller also raises or lowers the fabric clock, with
      hysteresis, besides throttling requesters
    loc: p162
    quote: "but also dynamically shifting the speed of the fabric to faster or slower (of course to save power if possible), and using hysteresis"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20140086070A1 (2012). Adds to c-mh-v3-bw-controller.
  - id: c-mh-v3-retry-id
    text: >-
      Per a 2005 patent, a fabric Retry response names the transaction blocking the request; the requester keeps that
      ID with the pending request in a small table and resubmits once it sees the response carrying that ID
    loc: p163
    quote: "this TransactionID is stored, along with the pending request, in a small table on Processor B"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US7529866B2 (2005).
  - id: c-mh-v3-cdc-predict
    text: >-
      Per 2005 and 2007 patents, clock-domain crossings predict the other clock's edges from recorded history instead
      of using stateless synchronizers that cost at least two cycles, and pass only one-bit pointer-increment events
      through small event FIFOs of about 4 or 8 entries
    loc: p164
    quote: "you can then predict the transitions of the other clock domain and when it is safe to transfer data from one side to the other, without the enforced delays of the traditional scheme"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US7500044B2 (2005) and US20080198671A1 (2007); a 2015 patent (US20160328182A1) lets most of the crossing logic sleep.
  - id: c-mh-v3-arb-weights
    text: >-
      Per a 2020 patent, a fabric arbiter first serves, round robin, each traffic class whose minimum-progress counter
      for the epoch is still positive, then grants by weight countdown, the example weights being 100 for realtime,
      20 for low latency and 1 for bulk
    loc: p165
    quote: "Each class is given a weight (eg 100 for Real Time, 20 for Low Latency, and 1 for Bulk traffic)"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10972408B1 (2020). The OS can tune the weights. Adds detail to c-mh-v3-fabric-arbitration.
  - id: c-mh-v3-fabric-tiers
    text: >-
      Handley guesses the fabric is layered: a coherent Apple Fabric for memory, SLC, CPU and GPU, bridged to a
      non-coherent AXI-based IO fabric, which bridges in turn to PCIe and USB
    loc: p167
    quote: "the highest performance region of the fabric (Memory, SLC, CPU, GPU) is Apple Fabric, and is about maximum bandwidth, minimum latency, and coherency"
    derivation: inferred
    hedge: "I’m guessing"
    supports: []
  - id: c-mh-v3-voltage-detect
    text: >-
      Per a 2010 patent, a sensor tells the power manager when a raised voltage has settled before the frequency goes
      up, and the frequency increase is abandoned if the voltage never reaches its target
    loc: p201
    quote: "a dedicated sensor circuit that informs the PMU when the voltage has reached its target"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US8892922B2 (2010).
  - id: c-mh-v3-timebase-sync
    text: >-
      Per a 2015 patent, the SoC keeps several local timebases, resynchronized periodically so they never
      drift far apart, run backwards or jump too far
    loc: p201
    quote: "the system provides for multiple local timebases, along with periodic resynchronizations to ensure that they do not drift too far apart"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20170168520A1 (2015).
  - id: c-mh-v3-clpc-knobs
    text: >-
      Per a 2016 patent, the closed-loop performance controller's knobs are how many cores are powered, core DVFS, and
      the frequency of the SoC fabric and DRAM
    loc: p205
    quote: "how many cores to power up ... modifying the frequency of the SoC fabric and the DRAM"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a10
    notes: US20170357302A1 (2016), which Handley places on A7 to A10 class chips, before clusters.

mechanism_claims:
  fabric_qos_credits: [c-mh-v3-snoop-qos, c-mh-v3-iso-windows, c-mh-v3-write-credit-reply, c-mh-v3-buffer-lending,
    c-mh-v3-edge-limits, c-mh-v3-critical-client, c-mh-v3-retry-table, c-mh-v3-dram-vc-category,
    c-mh-v3-latency-tolerance, c-mh-v3-rt-amplification, c-mh-v3-bw-fabric-clock, c-mh-v3-arb-weights]
  coherence_duplicate_tags: [c-mh-v3-sideways-hold]
