    quote: "page directory cache: cover 768 MB = (24 items * 32 MB block). Miss penalty = 24 ? cycles (page walk to L2 cache ? )."
    derivation: measured
    value: 24
    unit: entries
    hedge: "24 ? cycles (page walk to L2 cache ? )"
    supports: []
    notes: 16 KB pages
  - id: c-7cpu-latency-curve-l2
    source: 7cpu-m1
    text: >-
      In the latency sweep, latency is 3 cycles at 128 KB, 11 at 256 KB (where the L2 adds 15), 15 at 512 KB,
      16 at 1 MB, 17 at 2 MB, 20 at 4 MB (L1 TLB miss, +6) and 23 at 8 MB
    loc: "#16-kb-pages-mode-firestorm-big-core"
    quote: "128 K 3 256 K 11 8 + 15 (L2) 512 K 15 4 1 M 16 1 2 M 17 1 4 M 20 3 + 6 (L1 TLB miss) 8 M 23 3"
    derivation: measured
    supports: []
    notes: 16 KB pages
  - id: c-7cpu-latency-curve-dram
    source: 7cpu-m1
    text: >-
      Beyond 8 MB the sweep reads 24 cycles + 9 ns at 16 MB, 24 + 44 ns at 32 MB (RAM, +91 ns), 32 + 66 ns at
      64 MB (L2 TLB miss, +26), 55 + 90 ns at 1 GB (directory cache miss, +24) and 64 + 91 ns at 2 GB
    loc: "#16-kb-pages-mode-firestorm-big-core"
    quote: "16 M 24 + 9 ns 1 + 9 ns 32 M 24 + 44 ns 0 + 35 ns + 91 ns (RAM) 64 M 32 + 66 ns 8 + 22 ns + 26 (L2 TLB miss)"
    derivation: measured
    supports: []
    notes: 16 KB pages; the 1 GB and 2 GB rows come from the same table

  - id: c-7cpu-mispredict
    source: 7cpu-m1
    text: Firestorm's branch misprediction penalty is 13 cycles
    loc: "#misc-firestorm-big-core"
    quote: "Branch misprediction penalty = 13 cycles"
    derivation: measured
    value: 13
    unit: cycles
    supports: [dirpred.mispredict_penalty]
  - id: c-7cpu-8b-cross
    source: 7cpu-m1
    text: An access that crosses an 8-byte range pays a 1-cycle penalty
    loc: "#misc-firestorm-big-core"
    quote: "8-bytes range cross penalty = 1 cycle"
    derivation: measured
    value: 1
    unit: cycles
    supports: []
  - id: c-7cpu-l1-read-tput
    source: 7cpu-m1
    text: Parallel random L1 reads take 0.34 cycles per access
    loc: "#misc-firestorm-big-core"
    quote: "L1 B/W (Parallel Random Read) = 0.34 cycles per one access"
    derivation: measured
    value: 0.34
    unit: cycles/access
    supports: []
  - id: c-7cpu-l1-write-tput
    source: 7cpu-m1
    text: L1 write throughput is 0.5 cycles per write
    loc: "#misc-firestorm-big-core"
    quote: "L1 Write throughput = 0.5 cycles per one write"
    derivation: measured
    value: 0.5
    unit: cycles/write
    supports: []
  - id: c-7cpu-l2-read-bw
    source: 7cpu-m1
    text: L2-to-L1 reads take 2.0 cycles per cache line, for both parallel random reads and 64-byte-step reads
    loc: "#misc-firestorm-big-core"
    quote: "L2->L1 B/W (Parallel Random Read) = 2.0 cycles per cache line - L2->L1 B/W (Read, 64 bytes step) = 2.0 cycles per cache line"
    derivation: measured
    value: 2.0
    unit: cycles/line
    supports: []
  - id: c-7cpu-l2-write-bw
    source: 7cpu-m1
    text: Writes to the L2 with a 64-byte step take 2.0 cycles per write
    loc: "#misc-firestorm-big-core"
    quote: "L2 Write (Write, 64 bytes step) = 2.0 cycles per write"
    derivation: measured
    value: 2.0
    unit: cycles/write
    supports: []
  - id: c-7cpu-slc-read-bw
    source: 7cpu-m1
    text: Parallel random reads from the SLC (7-cpu's L3) into L1 take 5 cycles per cache line
    loc: "#misc-firestorm-big-core"
    quote: "L3->L1 B/W (Parallel Random Read) = 5 cycles per cache line"
    derivation: measured
    value: 5
    unit: cycles/line
    supports: []
  - id: c-7cpu-ram-random-read
    source: 7cpu-m1
    text: Parallel random DRAM reads take 4 ns per line, the line probably being 128 bytes
    loc: "#misc-firestorm-big-core"
    quote: "RAM Read B/W (Parallel Random Read) = 4 ns / access line (128 bytes ?)"
    derivation: measured
    value: 4
    unit: ns/line
    hedge: "128 bytes ?"
    supports: []
  - id: c-7cpu-ram-read-bw
    source: 7cpu-m1
    text: Sequential DRAM read bandwidth from one Firestorm core is 64 GB/s with 16-64 byte steps
    loc: "#misc-firestorm-big-core"
    quote: "RAM Read B/W (Read, 16-64 Bytes step) = 64 GB/s"
    derivation: measured
    value: 64
    unit: GB/s
    supports: [memctrl.dram_load_bw]
  - id: c-7cpu-ram-chase-bw
    source: 7cpu-m1
    text: A pointer chase through DRAM with a 64-byte step reaches 52 GB/s thanks to hardware prefetch
    loc: "#misc-firestorm-big-core"
    quote: "RAM Read B/W (Read, 64 Bytes step - pointer chasing) = 52 GB/s (HW prefetch)"
    derivation: measured
    value: 52
    unit: GB/s
    supports: []
  - id: c-7cpu-ram-write-bw
    source: 7cpu-m1
    text: Full DRAM writes with an 8-byte step reach 32-63 GB/s
    loc: "#misc-firestorm-big-core"
    quote: "RAM Write B/W (Write, full, 8 Bytes step) = 32-63 GB/s"
    derivation: measured
    value: 47.5
    unit: GB/s
    approx: true
    supports: []
    notes: range 32-63 GB/s (midpoint given)
  - id: c-7cpu-ram-partial-write-bw
    source: 7cpu-m1
    text: Partial DRAM writes with a 16-64 byte step reach 29 GB/s
    loc: "#misc-firestorm-big-core"
    quote: "RAM Write B/W (Write, partial, 16-64 Bytes step) = 29 GB/s"
    derivation: measured
    value: 29
    unit: GB/s
    supports: []

  - id: c-7cpu-clock-multi
    source: 7cpu-m1
    text: 7-Zip's clock estimate is about 3200 MHz with one thread, 3092 MHz with two threads and 2983 MHz with four
    loc: "#7-zip-benchmark"
    quote: "1T CPU Freq (MHz): 3197 3202 3201 3200 ... 2T CPU Freq (MHz): 199% 3092 199% 3091 ... 4T CPU Freq (MHz): 399% 2983 399% 2984"
    derivation: measured
    value: 2983
    unit: MHz
    supports: []
    notes: value is the four-thread figure; the page does not say which cores ran the threads

