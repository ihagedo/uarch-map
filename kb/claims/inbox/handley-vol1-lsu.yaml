    loc: p184
    quote: "Even when we do overflow the LSDP, as long as loads are predicted by default never to match unknown store addresses we should still see no interference ... nice smooth two pairs processed per cycle"
    method: throughput
    derivation: measured
    value: 2
    unit: pairs/cycle
    supports: []
  - id: c-mh-v1-ordering-flush-25
    text: >-
