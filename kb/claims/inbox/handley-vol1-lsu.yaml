    loc: p195
    quote: "it can hold about 74 pairs of (storePC, loadPC) - it prevents both Flushes (catastrophic) and Replays"
    method: throughput
    derivation: measured
    value: store/load PC-pair predictor
    supports: [lsu.disambiguation]
