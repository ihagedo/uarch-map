  - id: c-mh-v1-sched-ls-4x12
    text: >-
      The load-store scheduler drawn as one 48-entry queue is four 12-entry queues, each fed one op per cycle by the
      dispatch buffer and paired so a queue can issue from its partner; this explains the 4-wide stretch from N 330 to 420
    loc: p161
    quote: "this apparently monolithic queue is actually four queues each 12 entries in size"
    method: wong-probe
    derivation: inferred
    value: 4
    unit: queues
    hedge: "My guess is"
    supports: [sched_ls.queues]
    notes: Also stated earlier (c-mh-v1-sched-ls-split-48). 4 x 12 = 48, consistent with c-mh-v1-sched-ls-48
  - id: c-mh-v1-sched-ls-pairs
    text: >-
      Handley's model of the A14/M1 load-store scheduling queues is two pairs, a store/AMX queue with a load queue
      and a store/AMX/load queue with a load queue, the third load pipe reusing store machinery
    loc: p163
    quote: "So we land up, finally, with a structure that looks like (SA0 L2) (SAL1 L3)"
    derivation: inferred
    value: (SA0 L2) (SAL1 L3)
    hedge: "this is a conceptual model!"
    supports: []
    notes: >-
      Explains the drop to 3 loads/cycle at N of about 420 (the SA0 queue fills with loads that never issue). Excess
      buffer past the queues: 10 dispatch + 12 (one L queue) for loads, 10 + 24 (two S queues) for stores.

  - id: c-mh-v1-lsdp-patent-256
    text: >-
      Apple's 2012 dependence-predictor patent describes a 256-entry fully associative table of store/load pairs,
      each side keyed by a hash of PC and register (24 low PC bits folded 12 xor 12)
    loc: p137
    quote: "We learn that (for this implementation) the size of the LSDP table is 256 entries."
    method: patent-reading
    derivation: inferred
    value: 256
    unit: entries
    supports: []
    notes: US20130326198A1 (2012). Not the M1 size; Handley measures ~74 entries (c-mh-v1-lsdp-74-delayed-data)
  - id: c-mh-v1-lsdp-arming
    text: >-
      In the 2012 design a store at Rename arms every matching predictor entry; a load at Rename that matches an
      armed entry takes a dependency on that store and cannot execute until the store does
    loc: p138
    quote: 'every store, as it flows through Rename constructs the PC+register id hash, - probes the LSDP CAM, and - sets an "armed" bit on every match'
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20130326198A1
  - id: c-mh-v1-lsdp-confidence
    text: >-
      Each predictor entry has a confidence field, raised when a load that matched an armed entry gets its data from
      the store queue and lowered when it gets it from the L1D; low-confidence entries do not arm and are replaced first
    loc: p139
    quote: "If it acquires the data from the store queue, then we increment confidence ... But if the load acquires the data from the L1D, then we decrement confidence"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9128725B2 (2012); low-confidence behaviour from US20130326198A1
  - id: c-mh-v1-lsdp-replay-entries
    text: >-
      The predictor also trains on loads that replayed for want of store data, not only on ordering flushes; entries
      carry a replay-or-flush bit, and replay entries need higher confidence before they delay a load
    loc: p141
    quote: "So for Replay entries, we require a rather higher confidence value before we force the load to depend on the store."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10437595B1 (2016)
  - id: c-mh-v1-replay-shadow-window
    text: >-
      Instructions issued speculatively behind a load stay in their scheduling queue under a shifting-bit timer
      (the "shadow kill window") and leave only if the load succeeds; otherwise they reissue when it replays
    loc: p143
    quote: "when an instruction dependent on a load begins execution, it is not removed from the scheduling queue"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10514925B1 (2016); inherited by dependents of dependents
  - id: c-mh-v1-leq-bank-per-pipe
    text: >-
      The load execution queue that holds loads for replay has one bank per load pipe, each acting as an extension
      of its scheduling queue, while the larger load retirement queue holds loads for ordering checks
    loc: p146
    quote: "This queue inherits the structure described above, one bank per Load Pipe."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Reading of US20200394039A1; the A14's third load pipe needs a third LEQ bank
  - id: c-mh-v1-late-ordering-check-patent
    text: >-
      Apple's 2019 ordering-violation patent repeats the load/store address check when the load's data would reach
      its register, a few cycles later, so a store address that resolves in between causes a replay, not a flush
    loc: p147
    quote: "suppose we move the test instead to the cycle at which the data would be stored into a register"
    method: patent-reading
    derivation: inferred
    hedge: "maybe 3 cycles under normal conditions"
    supports: []
    notes: US10983801B2. The later check also catches aliases that only show in physical addresses
  - id: c-mh-v1-rlb-patent
    text: >-
      A 2020 patent adds a small Replay Load Buffer beside the load-store reservation station that reissues a
      replaying load in step with its store-data op, two cycles after the store data issues instead of seven
    loc: p149
    quote: "Note how it's seven cycle from the IS(issue) of the StoreData till the IS of the dependent Load. With the new timeline we are able to ISsue the load only two cycles later."
    method: patent-reading
    derivation: inferred
    value: 2
    unit: cycles
    supports: []
    notes: US11175917B1 (2020); Handley does not tie it to a chip

  - id: c-mh-v1-ls-pairs-2-per-cycle
    text: >-
      Independent store/load pairs to different addresses run at two pairs (two stores and two loads) per cycle,
