    loc: p186
    quote: "We see an initial slightly faster regime, about 1.5 pairs per cycle, for N<~70..80. Then about 1.2 pairs per cycle."
    method: throughput
    derivation: measured
    value: 1.5
    unit: pairs/cycle
    approx: true
    supports: []
  - id: c-mh-v1-eor-not-zero-idiom
    text: >-
      On M1 an EOR of a register with itself is not a zeroing or dependency-breaking idiom: it takes a cycle and
      chains on its input
    loc: p187
    quote: "on M1, unlike x86, xor is not a zero'ing or dependency breaking idiom, so EOR takes one cycle"
    derivation: measured
    value: false
    supports: []
    notes: Used as a one-cycle delay element in the EOR sweep (c-mh-v1-late-check-window), where each added EOR lengthens the iteration
  - id: c-mh-v1-late-check-window
    text: >-
      A late load/store address check catches loads that ran two to four cycles ahead of an aliasing store's
      address and turns them into replays instead of flushes
    loc: p195
    quote: "there is also late checking of whether loads might have collided with stores (catching cases where the load is two, three, even four cycles early; and converting them into Replays)"
    method: throughput
    derivation: measured
    value: 4
    unit: cycles
    supports: []
    notes: >-
      EOR sweep: 0-3 cycles of store-address delay give ~0.8 to ~1.5 cycles per iteration; at 4 every
      pair replays (a little over 4 cycles); at 5 some flush (10 cycles); at 6 every pair flushes once the predictor overflows
  - id: c-mh-v1-lsdp-pc-pairs
    text: >-
      M1 has a load-store dependence predictor holding about 74 (store PC, load PC) pairs that delays
