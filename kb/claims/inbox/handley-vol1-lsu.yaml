    loc: p181
    quote: "The initial regime can support about 70..80 load/store pairs. While in that regime the cost of a single load/store pair is about 4 cycles"
    method: throughput
    derivation: measured
    value: 4
    unit: cycles
    approx: true
    supports: []
    notes: >-
