    loc: p173
    quote: "we see a throughput of 800 store+load pairs takes essentially 400 cycles, so two pairs (four memory ops) per cycle"
    method: throughput
    derivation: measured
    value: 2
    unit: pairs/cycle
    supports: []
    notes: STR x10,[x2]; LDR x11,[x3]; also LDR x10 and mixed w/x widths
