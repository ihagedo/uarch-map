  - id: c-cc-oryon-m1-decode-8
    source: cnc-oryon
    text: Firestorm's L1I feeds an eight-wide decoder
    loc: "#fetch-and-decode"
    quote: "Oryon and Apple's Firestorm cores use a very similar strategy. Both have a huge 192 KB L1 instruction cache feeding a 8-wide decoder."
    method: secondhand
    derivation: reported
    value: 8
    unit: instr/cycle
