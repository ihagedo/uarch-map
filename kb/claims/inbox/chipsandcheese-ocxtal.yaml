  - id: c-cc-oryon-m1-l1i-miss-fetch
    source: cnc-oryon
    text: Code fetch bandwidth on M1 falls far lower once the code footprint misses the L1i
    loc: "#fetch-and-decode"
    quote: "Credit to Dougall for contributing the M1 Max test result. ... Oryon and M1 have much lower code fetch bandwidth after a L1i miss."
    method: throughput
    derivation: measured
    supports: []
    notes: >-
      M1 Max result contributed by Dougall Johnson; the text gives no M1 number (Zen 4 sustains more than
      12 bytes per cycle even from L3)
  - id: c-cc-oryon-m1-int-sched-134
    source: cnc-oryon
    text: Firestorm has 134 scheduler entries for basic integer operations
    loc: "#out-of-order-execution"
    quote: "Oryon can bring an incredible 120 scheduler entries to bear for basic integer operations alone. It's just short of Firestorm's 134 entries"
    method: secondhand
    derivation: reported
    value: 134
    unit: entries
    supports: [sched_int.total_entries]
    notes: >-
      Taken from Johnson's scheduler diagram, which the article reproduces; whether the count includes the
      non-scheduling dispatch queue is not stated
  - id: c-cc-oryon-m1-fp-sched
    source: cnc-oryon
    text: >-
      Firestorm's FP/vector schedulers are smaller than Oryon's 192 entries, backed by a non-scheduling queue
      that delays stalls at rename
    loc: "#out-of-order-execution"
    quote: "Firestorm also stands apart in using smaller (though still large in an absolute sense) schedulers, and compensating for that with a non-scheduling queue that can delay a stall at the rename stage."
    method: secondhand
    derivation: reported
    supports: []
  - id: c-cc-oryon-m1-agu-sched
    source: cnc-oryon
    text: >-
      Firestorm's AGU scheduling queues and non-scheduling queue together hold fewer micro-ops than Oryon's four
      16-entry AGU schedulers
    loc: "#out-of-order-execution"
    quote: "four 16 entry schedulers are nothing to sneeze at. Together, those schedulers can hold more micro-ops than Firestorm's AGU scheduling and non-scheduling queues combined."
    method: secondhand
    derivation: reported
    supports: []
  - id: c-cc-oryon-m1-l1d-128
    source: cnc-oryon
    text: Firestorm has a 128 KB L1 data cache
    loc: "#cache-and-memory-access"
    quote: "Firestorm has a bigger 128 KB L1, but Oryon's L1 is still much larger"
    method: secondhand
    derivation: reported
    value: 128
    unit: KiB
    supports: [l1d.size]

  - id: c-cc-gcc-l1i-192
    source: cnc-golden-cove-caches
    text: M1 has a 192 KB L1 instruction cache
    loc: "#use-apple-m1-max-s-caches"
    quote: "Adding the 192 KB L1i and 128 KB L1D gives 320 KB of total capacity."
    method: secondhand
    derivation: reported
    value: 192
    unit: KiB
    supports: [l1i.size]
    notes: Sizes used for a ChampSim model of M1 Max's caches
  - id: c-cc-gcc-l1d-128
    source: cnc-golden-cove-caches
    text: M1 has a 128 KB L1 data cache
    loc: "#use-apple-m1-max-s-caches"
    quote: "Adding the 192 KB L1i and 128 KB L1D gives 320 KB of total capacity."
    method: secondhand
    derivation: reported
    value: 128
    unit: KiB
    supports: [l1d.size]
    notes: Sizes used for a ChampSim model of M1 Max's caches
  - id: c-cc-gcc-l1d-3c
    source: cnc-golden-cove-caches
    text: M1's L1D has three-cycle latency
    loc: "#use-apple-m1-max-s-caches"
    quote: "On top of that, M1's L1D has 3 cycle latency."
    method: secondhand
    derivation: reported
    value: 3
    unit: cycles
    supports: [l1d.latency]
  - id: c-cc-gcc-l2-llc
    source: cnc-golden-cove-caches
    text: >-
      Given its size and the system level cache's high latency, M1's L2 acts as the CPU cluster's last-level
      cache; its latency matches Gracemont's L2 (AnandTech data)
    loc: "#use-apple-m1-max-s-caches"
    quote: "From the L2 cache's size and the system level cache's high latency, it looks like M1's L2 functions as a last level cache for the CPU cluster."
    derivation: inferred
    hedge: "it looks like"
    supports: []
  - id: c-cc-gcc-m1max-slc-48
    source: cnc-golden-cove-caches
    text: M1 Max has a 48 MB system level cache
    loc: "#use-apple-m1-max-s-caches"
    quote: "M1 Max's 48 MB system level cache seems to fill the same role as eDRAM on Intel's big iGPU SKUs"
    method: secondhand
    derivation: reported
    value: 48
    unit: MiB
    chip: m1max
    supports: []
    notes: M1 Max value for slc.size
  - id: c-cc-gcc-m1max-slc-gpu
    source: cnc-golden-cove-caches
    text: >-
      M1 Max's SLC sits near the memory controller, with latency too high to suit CPU accesses; it looks
      aimed at the GPU
    loc: "#use-apple-m1-max-s-caches"
    quote: "Because it's placed close to the memory controller, it suffers high latency that makes it non-ideal for CPU accesses. Instead, it looks targeted towards M1 Max's huge integrated GPU."
    derivation: inferred
    hedge: "looks targeted"
    chip: m1max
    supports: []

  - id: c-cc-clk-m1-cores
    source: cnc-clock-ramp
    text: M1 has four Firestorm cores
    loc: "#apple-s-m1"
    quote: "Its four Firestorm cores feature a very wide and deep architecture running at low clocks"
    method: secondhand
    derivation: reported
    value: 4
    unit: cores
    supports: []
  - id: c-cc-clk-m1-max-clock
    source: cnc-clock-ramp
    text: M1's Firestorm cores reach a maximum clock of 3.2 GHz
    loc: "#apple-s-m1"
    quote: "gradually increase frequency until they reach their maximum 3.2 GHz clock slightly after 100 ms."
    method: other
    derivation: measured
    value: 3.2
    unit: GHz
    supports: [pcluster.clock_max]
    notes: >-
      Run by Dougall Johnson on an M1 Mac Mini; the test infers clock from the time to run a known number of
      dependent integer adds
  - id: c-cc-clk-m1-ramp
    source: cnc-clock-ramp
    text: >-
      From idle, Firestorm clocks start rising after about 20 ms and climb gradually to maximum slightly after
      100 ms, with much run-to-run variation
    loc: "#apple-s-m1"
    quote: "the Firestorm cores start increasing their clocks after about 20 ms, and gradually increase frequency until they reach their maximum 3.2 GHz clock slightly after 100 ms"
    method: other
    derivation: measured
    value: 100
    unit: ms
    approx: true
    hedge: "Generally"
    supports: []
    notes: Sometimes just above 2 GHz after 20-30 ms; Mac Mini on wall power
  - id: c-cc-clk-m1max-layout
    source: cnc-clock-ramp
    text: M1 Max adds a second quad-core Firestorm cluster and has two Icestorm cores
    loc: "#apple-s-m1-max"
    quote: "M1 Max adds another quad core Firestorm cluster, drops the little (Icestorm) core count to two, and massively increases the GPU size."
    method: secondhand
    derivation: reported
    chip: m1max
    supports: []
  - id: c-cc-clk-m1max-max-clock
    source: cnc-clock-ramp
    text: M1 Max's Firestorm cores ramp to 3.23 GHz in High Power mode
    loc: "#apple-s-m1-max"
    quote: "After that, M1 Max stays at 2.67 GHz if it's set to \"Low Power\", or slowly ramps to 3.23 GHz if \"High Power\" is set."
    method: other
    derivation: measured
    value: 3.23
    unit: GHz
    chip: m1max
    supports: []
    notes: M1 Max value for pcluster.clock_max; run by Dougall Johnson
  - id: c-cc-clk-m1max-low-power
    source: cnc-clock-ramp
    text: In Low Power mode M1 Max appears capped at 2.67 GHz, with the boost behaviour otherwise unchanged
    loc: "#apple-s-m1-max"
    quote: "M1 Max appears to be capped to 2.67 GHz, but boosting behavior doesn't change beyond stopping at 2.67 GHz."
    method: other
    derivation: measured
    value: 2.67
    unit: GHz
    hedge: "appears to be"
    chip: m1max
    supports: []
  - id: c-cc-clk-m1max-ramp
    source: cnc-clock-ramp
    text: On its best runs M1 Max reaches 2.67 GHz in just over 10 ms from idle
    loc: "#apple-s-m1-max"
    quote: "On the best runs, it reaches 2.67 GHz in just over 10 ms."
    method: other
    derivation: measured
    value: 10
    unit: ms
    approx: true
    chip: m1max
    supports: []
    notes: 3.23 GHz after 43 ms on one run; nearly 100 ms to 3.2 GHz on others
  - id: c-cc-clk-m1max-hw-boost
    source: cnc-clock-ramp
    text: Apple may control boosting in hardware, since M1 Max reaches an intermediate frequency step in just over 10 ms
    loc: "#final-words"
    quote: "Apple may have hardware control over speed boosting, since M1 Max is able to hit an intermediate frequency step in just over 10 ms."
    derivation: inferred
    hedge: "may have"
    chip: m1max
    supports: []

new_params:
  btb.l0_footprint: {block: btb, name: Zero-bubble code footprint, unit: KiB}
  sched_int.total_entries: {block: sched_int, name: Integer scheduler entries (total), unit: entries}
  l1d.latency_simd: {block: l1d, name: L1D hit latency (FP/SIMD load), unit: cycles}
  lsu.store_load_latency: {block: lsu, name: Store-to-load latency (same address), unit: cycles}

new_mechanisms:
  l1i_coupled_btb:
    name: Branch targets tied to the L1I
    status: inferred
    description: A branch that misses the first-level BTB takes its target from the L1I, with a two-cycle bubble.
    params: [btb.l0_entries, btb.l1_entries, btb.taken_bubble, btb.l0_footprint]
    sim_switch: null
    detection_rule: taken-branch latency steps with code footprint (branch spacing) more than with branch count

mechanism_claims:
  l1i_coupled_btb: [c-ox-btb-1024, c-ox-btb-miss-bubble, c-cc-oryon-m1-taken-footprint, c-mh-v4-btb-l0]
