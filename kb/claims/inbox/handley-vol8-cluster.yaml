# handley-vol8-cluster.yaml
# Maynard Handley, 2025
# AMX and SME after the M1, cluster scheduling, memory power and later front-end patents (AArch64-Explore vol 8).
session: handley-vol8-cluster
source: handley-vol8

claims:
  - id: c-mh-v8-fetch-16
    text: >-
      Apple's current front end aims to fetch about 10 instructions per cycle on average and can sometimes fetch as
      many as 16 contiguous instructions spanning two I-cache lines
    loc: p003
    quote: "sometimes we can load perhaps as many as 16 contiguous instructions, spanning two I-cache lines, to compensate for occasional bubble cycles"
    derivation: inferred
    value: 16
    unit: instructions
    hedge: "perhaps"
    supports: []
    chip: post-m1
    notes: From his summary of the front end after the M1's successors; no chip named.
  - id: c-mh-v8-wrong-path-reuse
    text: >-
      Per a 2023 patent, after a mispredicted short forward branch, loads past the reconvergence point whose address
      chain does not depend on the wrongly executed code keep their loaded values instead of executing again
    loc: p072
    quote: "Suppose also the chain of instructions that led to the load does not depend on ... altered in short code. Then the already loaded value in the register should be legitimate!"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20240354109A1 (2023). Handley does not know whether the M4 has it.
  - id: c-mh-v8-wrong-path-branches
    text: >-
      The same patent records the outcomes of branches executed in the reconverged region and hands them to fetch
      with the redirect, so they are known rather than predicted
    loc: p072
    quote: "we track the outcomes of whatever branch comparisons were performed in the converged region, and pass those back to the I-fetch unit"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20240354109A1 (2023). Handley expects indirect-branch targets to be recorded next, which the patent does not mention.
  - id: c-mh-v8-dram-temp
    text: >-
      Per a 2022 patent, Apple adds temperature sensors accurate to 0.1 or 0.01 K on the DRAM, against the roughly 5 K
      steps the DRAM reports itself, so memory requests can be throttled just below the danger temperature
    loc: p078
    quote: "To fix this Apple places addition (much more sensitive, to .1 or .01K) thermocouples on the DRAM"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12055988B1 (2022).
  - id: c-mh-v8-m4-sme-decode
    text: >-
      The M4 supports SME mostly through instruction decoding, with little change to the AMX hardware
    loc: p088
    quote: "the M4 supports SME. This doesn’t change the hardware much, just the instruction decoder details"
    derivation: inferred
    supports: []
    chip: m4
  - id: c-mh-v8-m4-sme-regs
    text: >-
      In SME terms the M4's AMX has 32 Z registers of 512 bits, 16 predicate registers and a 64-row ZA array that
      forms eight 8x8 fp64 tiles
    loc: p088
    quote: "AMX (SME2/M4 version) gives us 32 Z-registers ... that are 512b long (ie can hold 8 FP64 values), along with 16 predicate registers"
    method: secondhand
    derivation: reported
    value: 512
    unit: bits
    supports: []
    chip: m4
  - id: c-mh-v8-matmul-loop
    text: >-
      Per a 2022 patent, one instruction could perform the outer-product accumulates for every pair of vectors in two
      loaded vector groups, optionally set up by a separate configuration register, to cut instruction traffic from
      the core to AMX
    loc: p090
    quote: "performs the relevant vector-by-vector outer product and accumulate for all the different pairs of vectors in the two vector groups"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20240103858A1 (2022). Handley thinks about 16, maybe 64, successive accumulates per instruction is the practical limit.
  - id: c-mh-v8-amx-six-sets
    text: >-
      AMX keeps a full register set for every core of its cluster, six on chips whose P-clusters have six cores,
      though almost none are in use at once
    loc: p091
    quote: "AMX has the unfortunate situation that it has to provide 4 (now 6 as clusters have grown larger) replicates of a large footprint of registers"
    derivation: inferred
    value: 6
    unit: register sets
    supports: []
    chip: m3pro
    notes: Six-core P-clusters appear on the M3 Pro and Max (c-mh-v8-m3pro-6core). Compare c-mh-v8-amx-reg-sets, four on the M1.
  - id: c-mh-v8-amx-m3-throughput
    text: >-
      On the M3 and M4, AMX can apparently run two loads or stores (128 B of data to or from the L2) alongside either
      one outer product or two vector operations
    loc: p091
    quote: "the capacity of AMX seems to be something like the ability to execute ... two load/store type instructions (so 128B of data movement to L2) along with either an outer product or two vector-vector operations"
    derivation: inferred
    value: 2
    unit: loads/stores per cycle
    hedge: "seems to be something like"
    supports: []
    chip: m3
    notes: Also stated for the M4.
  - id: c-mh-v8-stall-boost
    text: >-
      Per a 2020 patent, the OS tracks how much each core stalls on the SLC or DRAM and raises the NoC and DRAM
      frequency in response, updating a 2016 patent that doubled DRAM speed for a frequently stalled core
    loc: p092
    quote: "tracks the extent to which each core is stalling because it is waiting of either SLC or DRAM, and in response to this boosts the frequency of the NoC and/or DRAM"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20210157700A1 (2020); Handley also links it to a 2019 cache telemetry patent.
  - id: c-mh-v8-cluster-fill-ratio
    text: >-
      The same patent raises the performance of another cluster, such as the E-cluster, when a large enough share of
      a core's cache fills (the coherent cluster fill ratio) comes from it, as when an E-core producer feeds a P-core
      consumer
    loc: p093
    quote: "a large enough ... then the E-cluster gets a performance boost"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20210157700A1 (2020).
  - id: c-mh-v8-energy-heuristic
    text: >-
      To choose between speeding up the NoC and DRAM for throughput code and slowing a stalled core running
      latency-bound code such as pointer chasing, the OS looks at the core's energy use; heavy SIMD work marks
      throughput code
    loc: p094
    quote: "The heuristic the OS uses is to essentially look at how much energy the core is burning"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Same 2020 patent (US20210157700A1).
  - id: c-mh-v8-amx-queue-monitor
    text: >-
      Per a 2021 patent, a monitor in the AMX unit, and a similar one in the bus interface unit, tells the OS when its
      queue is overloaded by more than one core of the cluster, so the OS can move a thread to another cluster
    loc: p094
    quote: "there is a monitor within the AMX unit that is detecting, on average, how full is the queue of pending instructions, and whether the instructions are split across more than one source core"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20230040310A1 (2021). The patent names L2 oversubscription as a third case without saying how to detect it.
  - id: c-mh-v8-amx-fma-4
    text: >-
      Dependent AMX multiply-adds into the same accumulator issue four cycles apart, so a lone small matrix multiply
      leaves AMX execution slots idle
    loc: p095
    quote: "there will be a four cycle latency between the each multiply-add and the next time we can submit such an add"
    derivation: inferred
    value: 4
    unit: cycles
    supports: []
    notes: No method given; stated for AMX in general, with a 16x16 fp32 example.
  - id: c-mh-v8-m4-amx-cosched
    text: >-
      The M4, unlike earlier chips, readily runs two AMX threads on one AMX unit when one thread leaves execution
      slots idle, instead of waking a second unit
    loc: p095
    quote: "This appears to have been done on the M4 (but not earlier), which is much more aggressive about co-scheduling AMX threads on the same AMX unit"
    derivation: inferred
    hedge: "This appears to have been done"
    supports: []
    chip: m4
  - id: c-mh-v8-perf-islands
    text: >-
      Per a 2022 patent, chips with several P-clusters can run a demanding thread on one P-cluster and a less
      demanding one on a slower clocked P-cluster, rotating clusters now and then to cool the hot one; the M1 must run
      both in its one P-cluster at the high clock
    loc: p095
    quote: "for the Pro/Max/Ultra you can put the demanding thread on one P cluster, and the less demanding thread on a lower clocked different"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20230067109A1 (2022).
  - id: c-mh-v8-ipv-encoding
    text: >-
      An insertion/promotion vector for an 8-way set holds, for each of the 8 places in the replacement order, the
      place a hit line moves to, plus the place a new line is inserted; eviction is always from the least desirable
      place
    loc: p138
    quote: "This short array describing a replacement algorithm is referred to as an IPV (Insert/Promotion Vector)"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12222875B1 (2023). In this encoding LRU has every entry and the insertion place at 0.
  - id: c-mh-v8-fusion-buffer
    text: >-
      Per a 2024 patent, an AMX/SME permute-style operation and the compute operation that uses its result are
      dispatched together, so the permuted vector goes straight from the permute unit to the compute array and is not
      written back if the compute overwrites it
    loc: p160
    quote: "capture a sequence of operations that begin with a permute-style operation, followed by a compute-style operation using the permuted vector"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20250103338A1 (2024); a companion patent (US20250103551A1) describes the permute unit.
  - id: c-mh-v8-sme-latency-15
    text: >-
      In Apple's implementation the SSVE and SME Z registers sit in the separate AMX coprocessor, about 15 cycles of
      latency from each core
    loc: p161
    quote: "the Z registers are now in a separate co-processor isolated from each core by 15 cycles or so of latency"
    derivation: inferred
    value: 15
    unit: cycles
    approx: true
    supports: []
    chip: m4
  - id: c-mh-v8-streaming-neon
    text: >-
      Per Apple's 2025 optimization guide, Z registers exist only in streaming mode, entering streaming mode
      clears the NEON registers, and using NEON registers while streaming is illegal and crashes
    loc: p161
    quote: "starting up streaming mode (SSVE or SME) makes the Z registers available and CLEARS the NEON registers"
    method: secondhand
    derivation: reported
    supports: []
    chip: m4
    notes: From Table 4.4 of Apple's CPU optimization guide. Handley adds that the Arm spec requires the same steps.
  - id: c-mh-v8-mem-usage-hints
    text: >-
      Per a 2024 patent, every IP block reports its current and expected memory usage to the central power manager
      in a common form, so DRAM, memory controller and fabric-link power decisions need not rest on recent
      memory-controller history alone
    loc: p245
    quote: "to indicate to the central power manager its current and future expected memory usage"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20250104742A1 (2024).
  - id: c-mh-v8-dram-vs-cpu-power
    text: >-
      Per a 2023 patent, the power manager gathers performance, per-unit power and sensitivity statistics to decide
      whether extra power is better spent raising the DRAM or the CPU frequency
    loc: p245
    quote: "suppose I am willing to spend one extra unit of power. Is that power best spent on running DRAM faster or running the CPU faster?"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20250093932A1 (2023).

mechanism_claims:
  ipv_replacement: [c-mh-v8-ipv-encoding]
  control_independence: [c-mh-v8-wrong-path-reuse, c-mh-v8-wrong-path-branches]
  amx_op_set: [c-mh-v8-matmul-loop, c-mh-v8-fusion-buffer]
  amx_shared_contexts: [c-mh-v8-amx-six-sets, c-mh-v8-amx-queue-monitor, c-mh-v8-m4-amx-cosched]
  amx_datapath: [c-mh-v8-amx-m3-throughput]
  perf_controller: [c-mh-v8-stall-boost, c-mh-v8-cluster-fill-ratio, c-mh-v8-energy-heuristic,
    c-mh-v8-perf-islands, c-mh-v8-dram-vs-cpu-power]
  dram_power_states: [c-mh-v8-mem-usage-hints]
