# handley-vol3-memory.yaml
# Maynard Handley, 2025
# Memory controllers, the fabric and the SLC (AArch64-Explore vol 3).
session: handley-vol3-memory
source: handley-vol3

claims:
  - id: c-mh-v3-request-path
    text: >-
      A normal memory request passes from the core through L1 and L2 into the Switch, then to Coherence, which checks
      every other L1/L2, then to the SLC, then to the memory controller
    loc: p070
    quote: "It flows from the CPU through L1, through L2, into the Switch which sends it to Coherence."
    derivation: inferred
    hedge: "as a mental model"
    supports: []
    notes: Four layers in order Switch, Coherence, SLC, memory controller; Apple has moved more of the upper three into the NoC itself

  - id: c-mh-v3-device-bypass
    text: >-
      Device-memory requests from the core bypass L1 and L2 and go straight to the Switch, which routes them to the
      target hardware without passing Coherence, the SLC or the memory controller
    loc: p070
    quote: "Device Memory messages bypass Coherence, the SLC and the Memory Controller because they have nothing to do with any of that stuff."
    derivation: inferred
    supports: []

  - id: c-mh-v3-slc-mc-frontend
    text: >-
      The SLC is best seen as a front end to the memory controller rather than a conventional cache: a write that lands
      in the SLC counts as written to DRAM
    loc: p070
    quote: "the SLC should not be thought of as a traditional style cache, it should be thought of as a front-end to the memory controller, so writing to the SLC is as good as writing to DRAM"
    derivation: inferred
    supports: []
    notes: Same view as c-mh-v2-slc-memory-side

  - id: c-mh-v3-dma-write-slc
    text: >-
      A request from an IO block that misses in Coherence is checked against the SLC; a write is stored in the SLC and
      a read that misses there goes on to the memory controller
    loc: p070
    quote: "if the request is a write, store in SLC; if it's a read that does not match in SLC go to the memory"
    derivation: inferred
    hedge: "I think the way that works is"
    supports: []

  - id: c-mh-v3-uncacheable-caching
    text: >-
      Even requests to uncacheable ranges can be cached in full by the SLC, because it is a memory-side cache, and in
      part by the CPU caches through the Coherence tags
    loc: p071
    quote: "The SLC caching always works because the SLC is a memory-side cache; the CPU-side caching works because we’ve put some smarts into Coherence."
    derivation: inferred
    supports: []
    notes: The SLC side mainly helps IO blocks and saves energy; the Coherence side mainly helps the CPU

  - id: c-mh-v3-cpu-qos-fixed
    text: The priority of CPU memory requests used to be fixed and fairly low; a recent patent makes it somewhat more dynamic
    loc: p071
    quote: "What priority does the CPU get? I think that used to be fixed and fairly low"
    derivation: inferred
    hedge: "I think"
    supports: []

  - id: c-mh-v3-qos-five
    text: >-
      Apple's patents mostly describe five QoS settings in three priority bands; two of the bands hold one realtime and
      one non-realtime setting, which can age differently
    loc: p071
    quote: "The Apple patents mostly talk about 5 QoS Settings which (more or less) represent three priority bands."
    method: patent-reading
    derivation: inferred
    value: 5
    unit: QoS classes
    hedge: "(more or less)"
    supports: []

  - id: c-mh-v3-qos-bands
    text: >-
      The QoS bands are: high, RT Red; mid, RT Yellow and NRT Low Latency; low, RT Green and NRT Bulk
    loc: p081
    quote: "We have, according to the patents, 3+2 QoS classes, which we can think of as forming three bands,"
    method: patent-reading
    derivation: inferred
    value: 3
    unit: bands
    supports: []

  - id: c-mh-v3-qos-evolution
    text: >-
      Fabric priority evolved from keeping realtime traffic glitch-free (PA Semi to early A7), to bandwidth reservation,
      and by about 2020 to also guaranteeing minimum progress
    loc: p071
    quote: "now (as of 2020) we’re preserving these previous two desiderata, while also adding minimum progress guarantees."
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-fabric-credits
    text: >-
      In the current (about 2020) design a requester needs credits to enter the fabric and then the memory controller,
      which enforces bandwidth and flow control and lets fabric queues stay small
    loc: p071
    quote: "To enter the fabric (and then to enter the memory controller) requires credits."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Small fabric queues save area and power and cut latency (less bufferbloat)

  - id: c-mh-v3-fabric-arbitration
    text: >-
      Inside the fabric and memory controller, arbiters at routing points use grant counters and QoS levels to keep
      latency low and guarantee minimum progress
    loc: p072
    quote: "Once in the fabric (or memory controller) arbitration takes over at various routing points ... counters (grants) and flow markings (QoS levels) to ensure low latency and minimum progress"
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-six-vcs
    text: >-
      The current fabric uses three virtual channels (RealTime, Low Latency, Bulk), each in a posted and a non-posted
      form, six in all
    loc: p074
    quote: "the three virtual channels I listed above come as posted and non-posted versions, so there are in fact six basic Apple virtual channels."
    method: patent-reading
    derivation: inferred
    value: 6
    unit: virtual channels
    supports: []
    notes: The virtual channels replace the older QoS-plus-flowID tagging; Handley calls the scheme PCIe-inspired

  - id: c-mh-v3-flowid-gone
    text: The separate flow IDs once used to tag streams such as GPU request streams appear to be gone in the most recent designs
    loc: p074
    quote: "The distinct flowIDs, used apparently to tag things like different streams of GPU requests, appear to be gone in the most recent designs."
    method: patent-reading
    derivation: inferred
    hedge: "appear to be gone"
    supports: []

  - id: c-mh-v3-vc-ordering
    text: Ordering is fixed within a virtual channel, as in PCIe
    loc: p075
    quote: "I believe that for both Apple and PCIe, ordering must remain fixed within a Virtual Channel."
    derivation: inferred
    hedge: "I believe"
    supports: []
    notes: Patents differ on whether each virtual channel has its own hardware queue; Handley guesses separate queues for routing but not at the memory controller

  - id: c-mh-v3-credits-dram
    text: >-
      For DRAM, credits act as both flow control and bandwidth allocation: a requester's credits set how many requests it
      may queue at the memory controller before it is throttled
    loc: p076
    quote: "the credits of each ... essentially control how many requests the ... can queue up at the Memory Controller before it is throttled, and so the credits act as bandwidth allocation."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: There is no dedicated pool of memory controller slots per requester

  - id: c-mh-v3-gen2-credits
    text: >-
      The second-generation fabric (about 2012 to 2018) used credits only for flow control between the Coherence Point
      and the memory controller queues
    loc: p076
    quote: "The second generation Fabric (~2012 to ~2018) used credits for flow control between the Coherence Point (essentially the start of processing all memory requests) and the Memory Controller proper"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a7

  - id: c-mh-v3-gen3-credits
    text: The third-generation fabric (after about 2018) uses credits end to end for bandwidth allocation and flow control
    loc: p076
    quote: "The third generation (post ~2018) Fabric uses credits end-to-end throughout the Fabric for bandwidth allocation and flow control."
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-2010-five-ports
    text: >-
      The first Apple design (2010) feeds the memory controller through five independent ports, realtime, two GPU, CPU
      and non-realtime, with no network beyond that and no SLC
    loc: p078
    quote: "We have nothing like a SoC! We have five independent paths that flow data into the memory"
    method: patent-reading
    derivation: inferred
    value: 5
    unit: ports
    supports: []
    chip: a5
    notes: From US20120072677A1, which Handley places at the A4 or A5. Camera and display sit on the realtime port

  - id: c-mh-v3-2010-port-roles
    text: In the 2010 design the GPU ports favour bandwidth over latency and the CPU port favours latency over bandwidth
    loc: p078
    quote: "the two port for the GPU are obvious. However they prioritize bandwidth over latency. - the CPU port prioritize latency over bandwidth."
    method: patent-reading
    derivation: inferred
    hedge: "I think"
    supports: []
    chip: a5

  - id: c-mh-v3-2010-mc-queues
    text: >-
      Inside the 2010 memory controller a switch routes five inputs to seven outputs, and requests then pass three queue
      levels: MCIU, presorting queues (PSQ) and the memory interface (MIF)
    loc: p080
    quote: "The MCIUs (Memory Channel Interface Units) are queues feeding the PSQs (Presorting Queues) which feed the third level of queues in the MIF (Memory Interface Unit)."
    method: patent-reading
    derivation: inferred
    value: 3
    unit: queue levels
    supports: []
    chip: a5

  - id: c-mh-v3-2010-bw-ports
    text: In the 2010 design bandwidth is shared by giving each of the five ports a proportion programmed into the memory controller
    loc: p081
    quote: "For this initial 2010 design, bandwidth is allocated to the five ports"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a5

  - id: c-mh-v3-2010-inband-upgrade
    text: >-
      When a flow ID's QoS rises, the memory controller raises every queued request of that flow to the new QoS (an
      in-band upgrade)
    loc: p082
    quote: "The memory controller, when it sees a change in the QoS of a flowID, will upgrade all queued items with that flowID to the new QoS."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a5
    notes: A flow ID is a few source bits plus a few grouping bits; from 2012 Apple calls it a group ID

  - id: c-mh-v3-2010-aiu-arb
    text: >-
      The 2010 interface unit always serves RT Red and RT Yellow requests first; otherwise it serves the ports by weighted
      round robin with weights from bandwidth-sharing registers
    loc: p083
    quote: "as long as there (RT Red and RT Yellow) requests present, they are always serviced first."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a5

  - id: c-mh-v3-2010-aging
    text: The three later queue levels of the 2010 memory controller raise a request's QoS once it has waited past a set count
    loc: p083
    quote: "The three subsequent queue levels all use counter based arbitration, so that if a given request remains in a queue for longer than a certain count, the request will have its QoS upgraded."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a5

  - id: c-mh-v3-mc-affinity
    text: >-
      The memory controller sorts requests into affinity buckets (same DRAM page, or a different bank or rank), and its
      last stage picks read or write mode and which bucket to send to DRAM
    loc: p083
    quote: "These are sorted in different buckets of affine operations (while still tagged with their QoS)"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From the 2010 patents (US8510521B2); Handley expects the details to change with every SoC

  - id: c-mh-v3-2011-nrt-throttle
    text: >-
      A 2011 change caps the non-realtime requests held in the memory controller's internal queues while realtime
      traffic is present, and keeps the cap for a while after it leaves
    loc: p085
    quote: "use a counter to limit the number of NRT transactions enqueued in these later stages when RT traffic is present."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a5
    notes: From US9141568B2

  - id: c-mh-v3-2011-dwrr
    text: >-
      In 2011 bandwidth among high-QoS requesters is split by deficit-weighted round robin, with tokens per epoch that
      the memory controller counts but does not report back
    loc: p085
    quote: "The primary idea here is to service the ... using deficit-weighted round robin."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a5

  - id: c-mh-v3-credit-return
    text: >-
      In the most recent designs a credit is spent when a request is made and returned when it is fulfilled, so credits
      also give flow control, and throttling happens at entry to the fabric
    loc: p085
    quote: "credits in the most recent designs (as opposed to the tokens of this 2011 design) are spent when an ... makes a request, and returned when the request is fulfilled"
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-l2-cpu-qos
    text: >-
      The L2 sets the QoS of each core's memory requests from its count of that core's outstanding requests: few
      outstanding means latency mode and high QoS, many means bandwidth mode and low QoS
    loc: p088
    quote: "The L2 keeps track of the number of outstanding memory requests (with characterization of prefetch vs demand, read vs write, and code vs data) for each core."
    method: patent-reading
    derivation: inferred
    hedge: "perhaps A6? level design, but probably continuing forward"
    supports: []
    notes: >-
      From US8751746B2. Dirty castouts and most prefetches go out at low priority, instruction demand misses at the
      highest. No count of outstanding misses is given

  - id: c-mh-v3-tournament
    text: >-
      Fabric queues find their highest-priority entry each cycle by a tournament of pairwise comparisons over log2(N)
      rounds, the same scheme as the core's scheduling queues
    loc: p090
    quote: "a tournament scheme whereby each entry is compared with its neighbor, the winner of each pair being compared against the next pair"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US9009369B2

  - id: c-mh-v3-no-cwf-split
    text: A 2018 patent suggests the memory system does not split multi-beat reads to send the critical word first
    loc: p092
    quote: "suggest that there’s no attempt being made (yet?) to split multi-beat read transactions to allow for critical word first."
    method: patent-reading
    derivation: inferred
    hedge: "(yet?)"
    supports: []
    notes: From US10649922B2. Apple patented critical-word-first forwarding and splitting in 2010; Handley cannot tell whether either is used now

  - id: c-mh-v3-l1-l2-32b
    text: The L1 to L2 path appears to be 32 B wide, moving 64 B L1 lines
    loc: p092
    quote: "the L1 to L2 width appears to be 32B (transferring 64B lines)"
    derivation: inferred
    value: 32
    unit: B/cycle
    hedge: "appears to be"
    supports: [l2.l1_path_width]
    notes: Agrees with c-mh-v2-l2-l1-read-32b

  - id: c-mh-v3-l2-line-128
    text: The L2 line, and the line used across the rest of the SoC, appears to be 128 B
    loc: p092
    quote: "the L2 and System line width appears to be 128B"
    derivation: inferred
    value: 128
    unit: B
    hedge: "appears to be"
    supports: [l2.line, slc.line]

  - id: c-mh-v3-m1-dram-banks
    text: >-
      The M1 has at least two DRAM banks in the sense of separately powerable DRAM devices; the Pro, Max and Ultra have
      more
    loc: p092
    quote: "on either the M1 (which has at least two such “banks”) to the Pro, Max, and Ultra, all providing ever more DRAM banks"
    derivation: inferred
    value: 2
    unit: banks
    hedge: "at least"
    supports: []
    notes: >-
      He suggests Apple could power some down in a low-power mode, as a 2010 Intel Mac patent (US8799553B2) remaps
      memory on the fly; he does not know if it is used

  - id: c-mh-v3-dram-hash
    text: >-
      Apple may combine address bits (a permutation hash) rather than extract fixed bits to pick the DRAM channel, rank
      and bank; a 2010 patent makes the interleave selection programmable
    loc: p093
    quote: "Apple might employ more sophisticated addressing hashes than the basic “extract n bits from location m”"
    method: patent-reading
    derivation: inferred
    hedge: "might"
    supports: []
    notes: From US20120137090A1, which lets the OS vary the permutation

  - id: c-mh-v3-slc-behind-mc
    text: >-
      The SLC is owned and controlled by the memory controller and sits behind it, outside coherency; to every other
      block it looks like DRAM that responds faster
    loc: p094
    quote: "it's just a strange piece of DRAM that responds faster than normal DRAM."
    derivation: inferred
    supports: []

  - id: c-mh-v3-three-generations
    text: >-
      Apple's fabric has had three generations: a memory controller with almost no NoC (2010), a layered memory controller
      and NoC that adds the SLC (2012), and a third that moves much of the layering into the NoC
    loc: p094
    quote: "Moving functionality down into the NoC means that there are now fewer layers of queues"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: In the third generation each queue arbiter weighs more factors instead of one feature per layer

  - id: c-mh-v3-slc-a7
    text: >-
      The SLC first appears in a 2012 patent; the A7 die shows a large SRAM block that is presumably the SLC, and the A6
      has none
    loc: p095
    quote: "The A7 die shot shows a large block of SRAM that is presumably the SLC; we do not see such a block on the A6 die."
    derivation: inferred
    hedge: "presumably"
    supports: []
    chip: a7
    notes: The patent is US20140059297A1, System cache with sticky allocation

  - id: c-mh-v3-2012-xbars
    text: >-
      The 2012 NoC has at least two crossbar levels: a central switch feeding either an IO crossbar or a coherence
      crossbar between GPU and CPU
    loc: p100
    quote: "at least two cross-bar switch levels (a “central” level feeding out to either an IO crossbar or a “Coherence” crossbar that switches between GPU and CPU"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a7

  - id: c-mh-v3-duplicate-tags
    text: >-
      The Coherence Point holds duplicate tags (line address and MOESI state) for every block's cache; for a two-level
      cache they mirror the L2
    loc: p101
    quote: "So it has a set of Duplicate Tags ... If the cache has two levels, the tags describe the L2 contents"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: A request that matches a duplicate tag is sent down to the owning cache; one that matches none goes on to the SLC

  - id: c-mh-v3-pseudo-l3
    text: >-
      Where Intel's L3 holds tags and data and is inclusive, Apple's coherence point is a tag-only pseudo-L3 whose data
      stay in the blocks' own caches
    loc: p102
    quote: "Apple constructs a pseudo-L3 as (tags+ [data is whatever’s in the various compute caches])"
    derivation: inferred
    supports: []

  - id: c-mh-v3-uncached-l2-ways
    text: A read to an uncacheable IO range fetches a full line into the L2, but only a few L2 ways may hold such lines
    loc: p104
    quote: "that full line is stored in the L2, but only a small number of ways of the L2 are allowed to hold the data."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US9043554B2; the lines are expected to stream with little reuse

  - id: c-mh-v3-uncached-write-gather
    text: Writes to uncacheable ranges are gathered into full lines, which then go to the fabric bypassing L1 and L2
    loc: p104
    quote: "tries to gather them to a full cache line before the entire cache line is sent out."
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-flush-engine
    text: >-
      Apple cores have a flush engine: the core can cut power at once while a lower-power block flushes modified L1 lines
      to the L2 before the L1 powers off
    loc: p105
    quote: "allowing a lower power logic block to flush modified lines in the L1 to L2, before the L1 also cuts power."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US9128857B2

  - id: c-mh-v3-remote-cache-slc
    text: >-
      Unused or partly powered-down private caches, for example spare CPU L2, can extend the SLC, with the duplicate tags
      then acting as SLC tags
    loc: p106
    quote: "The idea is to use that private Compute Cache as an extension of the SLC, with the Duplicate tags now acting as SLC tags"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US9280471B2; Apple's example lends spare CPU L2 to the GPU

  - id: c-mh-v3-remote-cache-latency
    text: >-
      Fetching a line from a remote private cache through the SLC might take about 50 ns, against about 100 ns to DRAM
    loc: p106
    quote: "maybe 50 ns or so (?) to get the data via a trip all the way to the SLC then rerouted to a private cache, rather than 100ns to DRAM"
    derivation: inferred
    value: 50
    unit: ns
    approx: true
    hedge: "maybe 50 ns or so (?)"
    supports: []
    notes: A guess, not a measurement. The 100 ns DRAM figure fits c-7cpu-dram-latency (L2 latency plus 91 ns)

  - id: c-mh-v3-slc-io-proxy
    text: >-
      The SLC can act as a cache controller for small caches in IO blocks outside the coherence domain, turning one
      request into the simpler commands such a cache needs
    loc: p107
    quote: "creating a fake cache controller in the SLC to manage the IO cache"
    method: patent-reading
    derivation: inferred
    hedge: "what I think this 2016 patent is about"
    supports: []
    notes: From US10402326B1

  - id: c-mh-v3-bw-controller
    text: >-
      A central bandwidth management controller watches fabric statistics (latency, bandwidth use, queue depths) and tells
      limiter circuits in front of each IP block to slow down; it can also change fabric speed, with hysteresis
    loc: p107
    quote: "central Bandwidth Management Controller that tracks various statistics related to the fabric"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20140086070A1

  - id: c-mh-v3-coherence-no-qos
    text: >-
      In the 2012 design the Coherence Point ignores QoS and keeps short queues; most buffering sits in the QoS-ordered
      Switch, and credits pass among Switch, Coherence and memory controller so a request moves on only when a slot opens
    loc: p110
    quote: "So Apple drops worrying about QoS at the Coherence point. ... make the Coherence Point queues not very deep"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a7
    notes: From US20140181419A1

  - id: c-mh-v3-buffer-at-source
    text: The 2018 redesign moves most buffering out of the Switch into each source block, before requests enter the fabric
    loc: p110
    quote: "the 2018 redesign, at which point the buffering mostly moves to the next stage, in each source ... before the data even is allowed into the Fabric."
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-two-pipelines
    text: >-
      The 2012 design has two pipelines from Coherence through the SLC to the memory controller, split by hashed address
      (for example even and odd lines), each arbitrating only its own half
    loc: p110
    quote: "a striking pattern is the existence of two pipelines from Coherence through the SLC to the Memory Controller."
    method: patent-reading
    derivation: inferred
    value: 2
    unit: pipelines
    supports: []
    chip: a7
    notes: The split may extend to two memory channels. Barriers and the shared return path still tie the two pipelines together

  - id: c-mh-v3-eight-pipelines
    text: The 2018 redesign splits the Coherence to SLC to memory controller path across 8 or more address-interleaved pipelines
    loc: p110
    quote: "The 2018 redesign takes this far further, splitting across 8 or more such pipelines."
    method: patent-reading
    derivation: inferred
    value: 8
    unit: pipelines
    supports: []
    notes: A lower bound, not tied to a chip. Compare c-mh-v2-slc-even-odd, which splits the M1 SLC and memory controller into even and odd halves

  - id: c-mh-v3-display-qos
    text: >-
      The display controller raises its request QoS when its local buffer runs low and lowers it once the buffer passes a
      safety level; a later patent moves the thresholds when the memory controller is busy
    loc: p112
    quote: "If the buffer fullness sinks too low, we increase QoS; then when the buffer fullness rises above a safety level, we reduce QoS."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US8963938B2 and US9019291B2. Each request is kept at the lowest QoS that does the job so the memory controller can sort for bandwidth

  - id: c-mh-v3-merge-escalate
    text: >-
      When the memory controller merges a new request with a queued one for the same line, it raises the queued request's
      priority so a high-QoS request does not wait at low priority
    loc: p113
    quote: "a high QoS request that comes in might be attached to a pre-existing low QoS request for that line, and then just sit in the queue at low priority!"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20140244920A1 and US9135177B2

  - id: c-mh-v3-victim-request
    text: >-
      Besides reads and writes, a cache can send a victim request: the line moves from one cache to another (L2 to SLC)
      with ownership, and since it need not be dirty it need not reach DRAM
    loc: p115
    quote: "victim request (address, line of data, plus a flag saying “move ownership of this address+data from cache A to cache B”)"
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-2012-cp-64
    text: >-
      The 2012 Coherence Point has two queues, each a table of outstanding transactions; the patent's example holds 64,
      each with one address or two for a victim
    loc: p115
    quote: "in the 2012 patent, the example given is 64 pending transactions"
    method: patent-reading
    derivation: inferred
    value: 64
    unit: transactions
    supports: []
    chip: a7

  - id: c-mh-v3-strands
    text: >-
      The Coherence Point keeps same-address transactions in order by linking matching entries into lists (strands); only
      unlinked entries or list heads may move on to the SLC
    loc: p115
    quote: "If we find a match, we create a linked list of transactions, so that the earliest transaction points to the next later one"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20140173218A1. Handley guesses the next item waits until the SLC confirms the one before

  - id: c-mh-v3-fabric-interrupts
    text: >-
      Device interrupts become fabric messages ordered behind the device's earlier writes, so those writes are globally
      visible by the time the CPU takes the interrupt
    loc: p116
    quote: "the interrupt is converted into a fabric message, just like other fabric messages."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US9152588B2

  - id: c-mh-v3-retry-queue
    text: >-
      A cache such as the L2 or SLC links same-address requests and internal operations in a retry queue; scheduling by
      priority and age never breaks into a linked list
    loc: p117
    quote: "a cache (think L2 or SLC) can have both external requests and internal operations (like flushing out data prior to powering down some part of the cache)."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20200050548A1

  - id: c-mh-v3-write-table
    text: >-
      A requester's write buffer is split into a pending-request buffer holding data and a small write table holding
      hashed addresses of writes in flight, which later requests check for ordering
    loc: p118
    quote: "the write buffer is now split into two buffers"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20220083369A1. A false hash match only delays an unrelated write by about a hundred cycles

  - id: c-mh-v3-victim-fill
    text: >-
      Lines allocate in L1; an L1 victim moves to the L2 and an L2 victim moves to the SLC, so the L2 is a victim cache for
      L1 and the SLC holds L2 victims; prefetches into the L2 are the exception
    loc: p119
    quote: "When a line in L1 is eventually replaced, it will be moved to L2 (ie L2 is a victim cache for L1), and likewise when a line in L2 is replaced, that line will be moved to SLC."
    derivation: inferred
    value: L2 victims
    hedge: "As far as I can tell"
    supports: [slc.allocation]
    notes: Fits c-7cpu-slc-exclusive and the cached region past L2 out to ~16 MiB in c-mh-v2-slc-size

  - id: c-mh-v3-slc-pending
    text: >-
      On a miss the SLC allocates the line at once in a pending state; later requests to it wait in a replay buffer until
      the data arrive, so no miss queue has to be searched
    loc: p120
    quote: "the line is marked as “pending”. Then any subsequent request for this line will also see it as pending. All requests to pending lines go into a replay buffer"
    method: patent-reading
    derivation: inferred
    hedge: "at least, as of 2012"
    supports: []
    notes: From US20140089600A1

  - id: c-mh-v3-slc-device-alloc
    text: >-
      By default, reads from blocks other than the CPU allocate their lines in the SLC, probably modulated for blocks with
      their own caches and for streaming flows
    loc: p120
    quote: "by default non-CPU requests are allocated in the SLC on read of a line"
    method: patent-reading
    derivation: inferred
    hedge: "suggests"
    supports: []

  - id: c-mh-v3-groupid-16
    text: Requests carry a group (flow) ID; the 2012 sticky-allocation patent suggests 16 of them, 4 bits, perhaps more on newer chips
    loc: p120
    quote: "this next patent suggests there are 16 of these, 4 bits, though of course this may have risen in more modern SoCs"
    method: patent-reading
    derivation: inferred
    value: 16
    unit: group IDs
    hedge: "this may have risen in more modern SoCs"
    supports: []
    chip: a7

  - id: c-mh-v3-slc-sticky
    text: SLC lines record the requester's group ID and a sticky bit; a sticky line stays until it is marked non-sticky
    loc: p121
    quote: "lines marked as sticky will persist until they are marked non-sticky."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US9311251B2

  - id: c-mh-v3-slc-replacement
    text: >-
      SLC replacement takes an invalid line first, then an LRU dirty line, and otherwise a random line, drawing again if
      that line is sticky
    loc: p121
    quote: "first priority is to use invalid lines. Next in (negative) priority is LRU lines that are dirty. ... If it’s sticky, we generate a new random number and try again."
    method: patent-reading
    derivation: inferred
    value: invalid, then LRU dirty, then random non-sticky
    supports: [slc.replacement]
    notes: Dirty LRU lines go first because a recently written line is less likely to be touched again than a recently read one

  - id: c-mh-v3-slc-frame-relabel
    text: >-
      All SLC data of one GPU frame share a flow ID; for the next frame the GPU can relabel those lines to a new ID, or a
      hit by the new ID takes them over
    loc: p121
    quote: "the GPU can tell the SLC to relabel all flowID X lines as now belonging to flowID Y"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Video capture, video decode and the display pipe use flow IDs the same way

  - id: c-mh-v3-slc-quotas
    text: >-
      A group ID may have an SLC quota capping its lines, giving three levels of persistence: sticky lines, then the
      group's quota, then general replacement
    loc: p121
    quote: "groupIDs may have SLC quotas associated with them, so that given groupID cannot use more than a certain number of lines."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20140075118A1; quotas may oversubscribe the cache

  - id: c-mh-v3-slc-hints
    text: >-
      Requests can carry SLC hints: do-not-allocate, de-allocate (a hit line becomes LRU dirty and goes first), and a
      per-group sticky-replace hint
    loc: p121
    quote: "a do-not-allocate hint, which means what it says. ... a de-allocate hint. ... a (per flowID) sticky-replace hint."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20140075125A1

  - id: c-mh-v3-cpu-no-slc-alloc
    text: CPU and GPU misses never allocate lines in the SLC; the do-not-allocate hint is for other hardware blocks
    loc: p121
    quote: "I think this is for HW devices, and that CPU/GPU misses would never allocate in the SLC anyway."
    derivation: inferred
    hedge: "I think"
    supports: []
    notes: Consistent with c-mh-v3-victim-fill

  - id: c-mh-v3-quota-drop
    text: >-
      When a quota is ended, its dirty lines can be invalidated without write-back, suiting per-frame scratch data such as
      shadow or normal textures
    loc: p122
    quote: "dirty lines of a quota that has ended can simply be dropped by having every line invalidated, so they are not even written back to RAM."
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-slc-driver
    text: >-
      An SLC driver sets the quotas: device drivers register their memory streams (data stream IDs) and properties with
      it
    loc: p123
    quote: "Based on this information, the SLC Driver determines the quotas (and other options) for the SLC."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: From US20210034527A1

  - id: c-mh-v3-slc-driver-goal
    text: >-
      The SLC driver sizes quotas to cut DRAM traffic, in effect energy, using each stream's hits per second per quota line
      and rebalancing coarsely; Handley thinks a marginal-gain rule would do better
    loc: p123
    quote: "it's optimizing for reducing the traffic that has to go to DRAM rather than hitting in the SLC (which is essentially optimizing for energy)."
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v3-slc-purpose
    text: >-
      The SLC is built mainly for low-energy communication between blocks; the system still uses it as an L3 for the CPU
      when nothing else needs it
    loc: p125
    quote: "The SLC should be seen primarily as a means to facilitate communication at lower energy."
    derivation: inferred
    supports: []

  - id: c-mh-v3-spec-read-2012
    text: >-
      In the 2012 design a read may enter the memory controller queues during the SLC tag lookup, if it has low-latency
      QoS, no ordering hazard, few speculative reads ahead of it and a group ID unlikely to hit in the SLC
    loc: p126
    quote: "while a read request is performing the SLC Tags lookup, the request is also allowed to move to (entry to) the Memory Controller Queues."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a7
    notes: From US9201796B2. The read goes no further down the queues until the SLC miss is confirmed

  - id: c-mh-v3-partial-dirty
    text: >-
      The 2012 SLC keeps partial-line writes in a partial-dirty state, reusing the line's ECC bits as a byte mask; a read
      that hits such a line forces a merge through DRAM
    loc: p127
    quote: "we re-purpose the ECC bits protecting the line as a bitmask describing which bytes of the line (for a partial dirty line) are valid."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: a7
    notes: From US20140089602A1. Handley expects newer designs to have explicit mask bits

new_params:
  slc.line: {block: slc, name: SLC line size, unit: B}
  slc.allocation: {block: slc, name: SLC allocation policy, mechanism: slc_victim_fill}
  slc.replacement: {block: slc, name: SLC replacement policy, mechanism: slc_sticky_quota}

new_mechanisms:
  slc_victim_fill:
    name: SLC filled by L2 victims
    status: inferred
    description: CPU lines move from L1 to L2 to the SLC as each level evicts them, so a CPU miss does not allocate in the SLC.
    params: [slc.allocation, slc.size, l2.size]
    sim_switch: null
    detection_rule: the cached region seen by one core extends to about the L2 share plus the SLC, not to the larger of the two
  coherence_duplicate_tags:
    name: Coherence point with duplicate tags
    status: inferred
    description: Before the SLC, a coherence point holds copies of every cache's L2 tags and states, a tag-only pseudo-L3 that orders same-address requests.
    params: []
    sim_switch: null
    detection_rule: a read of a line held modified in the other cluster returns faster than a DRAM access
  slc_sticky_quota:
    name: SLC sticky lines and group quotas
    status: inferred
    description: SLC lines carry a group ID and a sticky bit; driver-set quotas cap each group, and replacement skips sticky lines.
    params: [slc.replacement]
    sim_switch: null
    detection_rule: not visible to CPU-only probes; a GPU or media working set within its quota survives a CPU sweep larger than the SLC
  slc_speculative_read:
    name: DRAM read issued alongside the SLC lookup
    status: inferred
    description: A latency-sensitive read enters the memory controller pipeline while the coherence and SLC tag checks run, and is killed if either hits.
    params: [memctrl.dram_latency, slc.latency]
    sim_switch: null
    detection_rule: DRAM-miss latency exceeds SLC-hit latency by no more than the memory controller's own DRAM access time
  fabric_qos_credits:
    name: Credit-gated fabric with QoS bands
    status: inferred
    description: Requests carry one of five QoS classes in three bands on six virtual channels; credits gate entry to the fabric and memory controller.
    params: []
    sim_switch: null
    detection_rule: not visible to a single-core probe; under bulk GPU traffic a latency-bound CPU miss slows less than CPU streaming bandwidth falls
  pio_network:
    name: Separate PIO network
    status: inferred
    description: Device-memory accesses and short control messages such as interprocessor interrupts use a flat network that skips coherence, the SLC and DRAM.
    params: []
    sim_switch: null
    detection_rule: device register access and interprocessor interrupt latency stay flat while the memory fabric is saturated

mechanism_claims:
  slc_victim_fill: [c-mh-v3-victim-fill, c-mh-v3-victim-request, c-mh-v3-cpu-no-slc-alloc, c-mh-v3-slc-device-alloc]
  coherence_duplicate_tags: [c-mh-v3-request-path, c-mh-v3-duplicate-tags, c-mh-v3-pseudo-l3, c-mh-v3-strands, c-mh-v3-remote-cache-slc]
  slc_sticky_quota: [c-mh-v3-slc-sticky, c-mh-v3-slc-replacement, c-mh-v3-slc-quotas, c-mh-v3-slc-hints,
    c-mh-v3-slc-frame-relabel, c-mh-v3-quota-drop, c-mh-v3-slc-driver, c-mh-v3-slc-driver-goal, c-mh-v3-groupid-16]
  slc_speculative_read: [c-mh-v3-spec-read-2012]
  fabric_qos_credits: [c-mh-v3-qos-five, c-mh-v3-qos-bands, c-mh-v3-fabric-credits, c-mh-v3-fabric-arbitration,
    c-mh-v3-six-vcs, c-mh-v3-credits-dram, c-mh-v3-gen3-credits, c-mh-v3-credit-return, c-mh-v3-buffer-at-source,
    c-mh-v3-l2-cpu-qos, c-mh-v3-bw-controller]
  pio_network: [c-mh-v3-device-bypass]
