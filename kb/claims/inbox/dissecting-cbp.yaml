# dissecting-cbp.yaml
# Jiajie Chen, Peng Qu and Youhui Zhang, 2024
# The Firestorm conditional branch predictor reverse engineered: a split path history register and six TAGE pattern history tables.
session: dissecting-cbp
source: arxiv-2411-13900

claims:
  - id: c-cq-phr-100
    text: Firestorm's path history register records the most recent 100 taken branches
    loc: p005
    quote: "This indicates that the PHR in both microarchitectures can only record information from the most recent 100 taken branches."
    method: branch-sweep
    derivation: measured
    value: 100
    unit: branches
    supports: [dirpred.history]
    chip: m1
    notes: >-
      Measured on the M1 (Firestorm) and the X Elite (Oryon) with identical results; the test also rules out a
      global history register of branch outcomes. Agrees with Tuby and Morrison's history length of 100.

  - id: c-cq-phr-split
    text: Firestorm keeps two separate path history registers, one for taken-branch target addresses and one for branch addresses
    loc: p006
    quote: "the PHR is split into two registers: one called PHRT ... whereas Firestorm has a 28-bit PHRB. The PHRT remains consistent at 100 bits"
    method: branch-sweep
    derivation: measured
    value: "PHRT 100 bits, PHRB 28 bits"
    supports: []
    chip: m1
    notes: >-
      PHRT records taken-branch target addresses, PHRB records branch addresses; each shifts one bit per taken
      branch. Confirmed in hardware. Refines the single-register bit list of c-tm-history-inputs.

  - id: c-cq-footprint-bits
    text: The Firestorm history footprint folds in only branch-address bits 5:2 and target-address bits 31:2
    loc: p006
    quote: "only the bits 5:2 of the branch address (abbreviated as B below) are utilized in the computation of the footprint ... the bits 31:2 of the target address (abbreviated as T below) are utilized in the PHR footprint computation"
    method: branch-sweep
    derivation: measured
    value: "branch bits 5:2 into PHRB, target bits 31:2 into PHRT"
    supports: []
    chip: m1
    notes: Reparametrizes c-tm-history-inputs by assigning branch-address bits to PHRB and target-address bits to PHRT.

  - id: c-cq-pc-input
    text: Firestorm's conditional branch predictor feeds PC bits 18:2 into the pattern history tables
    loc: p007
    quote: "the Firestorm CBP uses PC[18:2] as input, while the Oryon CBP uses PC[12:2]."
    method: branch-sweep
    derivation: measured
    value: "PC[18:2]"
    supports: []
    chip: m1

  - id: c-cq-tage
    text: Firestorm's conditional predictor is a TAGE design with six tagged pattern history tables recovered experimentally
    loc: p001
    quote: "the six pattern history tables in their TAGE branch predictor."
    method: branch-sweep
    derivation: measured
    value: tage-like
    supports: [dirpred.kind]
    chip: m1
    notes: Six tagged tables with geometric history lengths were recovered, confirming the TAGE-style structure assumed from Apple patents.

  - id: c-cq-tables
    text: Firestorm's TAGE conditional predictor has six pattern history tables
    loc: p003
    quote: "special design of the PHR and the six pattern history tables."
    method: branch-sweep
    derivation: measured
    value: 6
    unit: tables
    supports: [dirpred.tables]
    chip: m1

  - id: c-cq-pht1
    text: Firestorm's longest-history pattern history table is four-way set associative with 4096 entries, indexed with PC bits 6 and 9
    loc: p008
    quote: "the 1st PHT of the Firestorm CBP is\n4-way set associative and uses PC[6] and PC[9] in its index\nfunction ... which is 4-way 4096entry in capacity"
    method: branch-sweep
    derivation: measured
    value: "4-way, 4096 entries"
    supports: []
    chip: m1

  - id: c-cq-geometry
    text: Firestorm's six pattern history tables use PHRT history lengths 100, 57, 32, 18, 11 and 6 with associativities 4,4,4,4,6,6 and 10 or 11 index bits
    loc: p009
    quote: "Firestorm\n\n100\n57\n32\n18\n11\n6\n\n28\n28\n28\n18\n11\n6\n\n4\n4\n4\n4\n6\n6\n\n10\n10\n10\n11\n11\n11*"
    method: branch-sweep
    derivation: measured
    value: "PHRT lengths 100/57/32/18/11/6; assoc 4/4/4/4/6/6; index bits 10/10/10/11/11/11"
    supports: []
    chip: m1
    notes: "Table 3. PHRB lengths 28/28/28/18/11/6. The last table's index-bit count is marked low confidence."

  - id: c-cq-capacity
    text: Firestorm's conditional branch predictor holds about 44K entries across its six tables
    loc: p011
    quote: "Apple Firestorm\nQualcomm Oryon\nIntel Skylake\n\n100 + 28\n100 + 32\n186\n\n6\n6\n3\n\n44K\n40K\n6K"
    derivation: derived
    value: 44000
    unit: entries
    approx: true
    supports: [dirpred.capacity]
    chip: m1
    notes: "Table 6. PHR width is 100 (PHRT) plus 28 (PHRB); the total is computed from the recovered per-table sizes."

  - id: c-cq-partition-pc6
    text: Firestorm partitions the pattern history tables by one PC bit, PC bit 6, so two adjacent conditional branches can be predicted in one cycle
    loc: p011
    quote: "Apple and\nQualcomm CBPs are also partitioned by one PC bit: PC[6],\naccording to our CBP models."
    derivation: derived
    value: "PC[6]"
    supports: []
    chip: m1
    notes: >-
      Two adjacent conditional branches in one prediction block share the same PC[6] and thus the same index, so
      both ways of one set are read and matched against two tags without a second SRAM read port.

new_params:
  dirpred.tables: {block: dirpred, name: Tagged tables (PHTs), unit: tables}

mechanism_claims:
  path_history_shift_xor: [c-cq-phr-100, c-cq-phr-split, c-cq-footprint-bits]
