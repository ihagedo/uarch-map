# dissecting-cbp.yaml
# Jiajie Chen, Peng Qu and Youhui Zhang, 2024
# The Firestorm conditional branch predictor reverse engineered: a split path history register and six TAGE pattern history tables.
session: dissecting-cbp
source: arxiv-2411-13900

claims:
  - id: c-cq-phr-100
    text: Firestorm's path history register records the most recent 100 taken branches
    loc: p005
    quote: "This indicates that the PHR in both microarchitectures can only record information from the most recent 100 taken branches."
    method: branch-sweep
    derivation: measured
    value: 100
    unit: branches
    supports: [dirpred.history]
    chip: m1
    notes: >-
      Measured on the M1 (Firestorm) and the X Elite (Oryon) with identical results; the test also rules out a
      global history register of branch outcomes. Agrees with Tuby and Morrison's history length of 100.

  - id: c-cq-phr-split
    text: Firestorm keeps two separate path history registers, one for taken-branch target addresses and one for branch addresses
    loc: p006
    quote: "the PHR is split into two registers: one called PHRT ... whereas Firestorm has a 28-bit PHRB. The PHRT remains consistent at 100 bits"
    method: branch-sweep
    derivation: measured
    value: "PHRT 100 bits, PHRB 28 bits"
    supports: []
    chip: m1
    notes: >-
      PHRT records taken-branch target addresses, PHRB records branch addresses; each shifts one bit per taken
      branch. Confirmed in hardware. Refines the single-register bit list of c-tm-history-inputs.

  - id: c-cq-footprint-bits
    text: The Firestorm history footprint folds in only branch-address bits 5:2 and target-address bits 31:2
    loc: p006
    quote: "only the bits 5:2 of the branch address (abbreviated as B below) are utilized in the computation of the footprint ... the bits 31:2 of the target address (abbreviated as T below) are utilized in the PHR footprint computation"
    method: branch-sweep
    derivation: measured
    value: "branch bits 5:2 into PHRB, target bits 31:2 into PHRT"
    supports: []
    chip: m1
    notes: Reparametrizes c-tm-history-inputs by assigning branch-address bits to PHRB and target-address bits to PHRT.

  - id: c-cq-pc-input
    text: Firestorm's conditional branch predictor feeds PC bits 18:2 into the pattern history tables
    loc: p007
    quote: "the Firestorm CBP uses PC[18:2] as input, while the Oryon CBP uses PC[12:2]."
    method: branch-sweep
    derivation: measured
    value: "PC[18:2]"
    supports: []
    chip: m1

mechanism_claims:
  path_history_shift_xor: [c-cq-phr-100, c-cq-phr-split, c-cq-footprint-bits]
