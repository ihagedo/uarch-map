  - id: c-mh-v8-a16-rack-7
    text: >-
      Despite the smaller P-core rack counts on the A15 and A16, Dougall Johnson's NOP measurement still gives 7
      instructions per rack
    loc: p009
    quote: "Although dougall suggests this is not the case, that NOP measurement still gives a 1:7 ratio"
    method: secondhand
    derivation: reported
    value: 7
    unit: uops
    chip: a16
    supports: []
    notes: >-
      Handley wonders whether the ROB was split into separate failable and non-failable parts so the total could
      shrink at the same 1:7 ratio
  - id: c-mh-v8-noc-networks
    text: >-
      Per a 2021 patent, the NoC is split into several independent address+data networks, for example IO
      (ordered, coherent, high latency), CPU (ordered, coherent, low latency) and GPU/NPU/ISP (relaxed order,
      non-coherent)
    loc: p010
    quote: >-
      Split the existing NoC (which is already multiple networks, for address vs data, with a separate network for
      IO/interrupts) into multiple “address+data” networks.
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 3
    unit: networks
    supports: []
    notes: US20220334997A1; the networks may also differ in topology
  - id: c-mh-v8-mc-hash-bits
    text: >-
      Per a 2021 patent, physical addresses are hashed across the memory controllers so sequential streams spread
      widely, and each routing step (chip, slice, row, side, then inside the controller) drops the address bits it
      has used
    loc: p013
    quote: >-
      the physical memory address space is hashed then spread over multiple memory controllers ... the address
      bit(s) that forced that routing decision are dropped
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US20220342588A1
  - id: c-mh-v8-mc-shutdown
    text: >-
      Per the same patent, on-chip logic reports how busy each memory controller is to the OS, which can shut idle
      controllers down after moving their remaining pages, or leave their DRAM in self-refresh
    loc: p015
    quote: "certain memory controllers can be shut down (to save energy, of course) in low usage situations"
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US20220342588A1
  - id: c-mh-v8-power-levels
    text: >-
      Per a 2021 patent, power is managed at four time scales: clock dithering against undervolt events at about
      150 cycles, then frequency from current tracking, then voltage per island, then temperature
    loc: p017
    quote: >-
      On the fastest time scale (which is still of the order of ~150 cycles) we see that the primary goal is to
      respond to an undervolt (UVD) event.
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 150
    unit: cycles
    approx: true
    supports: []
    notes: US20220137692A1; the patent lets each level tell the central controller what it plans next
  - id: c-mh-v8-mc-gen4
    text: >-
      Per a 2021 patent, the memory controller's bank selection now weighs each requester's bandwidth QoS as well as
      its latency QoS, so a requester confined to one bank still gets bandwidth
    loc: p020
    quote: "coupling, to some extent, the bank selection stage to the virtual channel selection stage based not only on an ... latency QoS but also on an ... bandwidth QoS"
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US20220357879A1 (Memory Bank Hotspotting); Handley calls it a step toward a fourth-generation controller
  - id: c-mh-v8-m3pro-dram-150
    text: The M3 Pro has about 150 GB/s of DRAM bandwidth, from three memory channels
    loc: p020
    quote: "the M3 Pro has ~150GB/s of DRAM bandwidth, corresponding to three “memory channels”"
    method: secondhand
    derivation: reported
    value: 150
    unit: GB/s
    approx: true
    chip: m3pro
    supports: []
    notes: Handley gives no source for the figure; die shots show two DRAM packages on one side and one on the other
  - id: c-mh-v8-mc-rt-credits
    text: >-
      Per a 2021 patent, real-time requests get a separate transaction table in the memory controller with their
      own DRAM bandwidth credits
    loc: p022
    quote: "The separate real time queue comes with separate DRAM bandwidth credits"
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US20230060508A1; Handley guesses the GPUs of the M1 Pro and Max could otherwise hog DRAM bandwidth
  - id: c-mh-v8-mc-ranks
    text: >-
      Two 2023 patents are the first Apple memory-controller patents to handle DRAM ranks, grouping requests by
      rank and staying on one rank when bandwidth matters
    loc: p025
    quote: "these are the first Apple Memory Controller patents I have seen that reference rank!"
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US20240095194A1 and US20240094917A1; Handley reads them as a route to larger DRAM capacity
  - id: c-mh-v8-m3pro-three-slc
    text: >-
      The M3 Pro has three SLC and memory-controller units, not four, so addresses must be routed by a factor of
      three
    loc: p025
    quote: "the M3 Pro now comes with three, not four, SLC’s and memory controllers"
    derivation: inferred
    value: 3
    unit: units
    chip: m3pro
    supports: []
    notes: A 2023 routing patent (US20240104017A1) shows how to route by multiples of 3 (and 15)
  - id: c-mh-v8-realtime-lines
    text: >-
      Per a 2022 patent, a physical address range can be marked real-time: its lines may be reserved in the L1, L2
      and SLC and its NoC transactions get maximum priority
    loc: p028
    quote: >-
      mark some lines in the various caches (L1, L2, SLC) as reserved for realtime lines, and we can give NoC
      transactions to these addresses maximum priority
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US11886340B1; Handley links it to the Vision Pro
  - id: c-mh-v8-zero-pattern
    text: >-
      Per a patent extending one that masks zero bytes on NoC transfers, caches track common data patterns and send
      a pattern index instead of the data
    loc: p033
    quote: "when such a pattern needs to be transferred, the pattern index can be ... rather than the data"
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: >-
      US11442855B2; Handley reads a figure as mapping some addresses into a pattern space, which would give
      zero-content pages but not zero-content lines
  - id: c-mh-v8-slc-states
    text: >-
      SLC lines need only Invalid, Modified and Valid states; Exclusive and Shared are not needed because no
      requester inside the SLC modifies data
    loc: p033
    quote: "cache lines only requires states like Invalid, Modified, and Valid. States like Exclusive or Shared are about some ... within the cache"
    derivation: inferred
    supports: []
    notes: Stated while reading US20220365881A1 (2021)
  - id: c-mh-v8-slc-line-512
    text: >-
      Handley guesses SLC lines are about 512 B, run as a sectored cache with one tag and per-sector valid flags,
      for example four 128 B sectors
    loc: p033
    quote: "SLC cache lines are probably long. My guess is that they perhaps 512B long"
    derivation: inferred
    value: 512
    unit: B
    hedge: "My guess is that they perhaps"
    supports: []
    notes: >-
      There is no SLC line param; c-7cpu-slc-line and c-mh-v2-l2-line-128-bw give 128 B for the SLC, which would
      match one sector here
  - id: c-mh-v8-slc-partial-valid
    text: >-
      Per a 2021 patent, each SLC half-line has a 3-bit state; a partial state marks invalid granules (say 8 B), and
      the line is shifted to free room for per-granule valid and modified masks
    loc: p034
    quote: >-
      split the cache line into two halves, upper and lower. Each half gets three bits of tag, so eight states are
      available.
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 3
    unit: bits
    hedge: "I’m somewhat guessing the exact numbers used by Apple"
    supports: []
    notes: US20220365881A1; Handley thinks the main use is remote atomics executed in the SLC
  - id: c-mh-v8-l1d-no-way-mispredict
    text: >-
      Tests show no L1D way prediction, or else a predictor that stays perfect even on a random stream of accesses
    loc: p034
    quote: >-
      Experimentally there seems to be no way prediction for the L1D (or whatever they are doing seems to be a
      perfect predictor even when one tries to generate a random stream of accesses!)
    derivation: measured
    hedge: "seems to be"
    supports: []
    notes: Restates the vol 2 result (c-mh-v2-way-pred-test, c-mh-v2-way-pred-hashed)
  - id: c-mh-v8-way-confirm
    text: >-
      Per a 2021 patent, the way predictor keeps a copy of the predicted way's tag, and a per-line bit cleared on
      eviction or a TLB change lets a repeat hit skip the cache tag compare
    loc: p035
    quote: >-
      so we’ve basically replaced transporting and comparing a tag (multiple bits, perhaps 40 or so) with a single
      bit
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 1
    unit: bits
    supports: []
    notes: US11487667B1; Handley thinks it suits I-caches best
  - id: c-mh-v8-l1-plru
    text: Apple's L1 replacement is at least pseudo-LRU, possibly full LRU tracking
    loc: p038
    quote: "Apple is definitely doing something at least pseudo-LRU-like, possibly fully LRU tracking."
    derivation: inferred
    value: pseudo-LRU
    hedge: "possibly fully LRU tracking"
    supports: []
    notes: >-
      No method given. Differs from vol 2's reading that an L1D line's way comes from physical page bits
      (c-mh-v2-l1d-way-hash)
  - id: c-mh-v8-critical-lines
    text: >-
      Per a 2022 patent, L2 lines carry a criticality field that travels with the line to the L1 and the SLC (where
      the DSID field is reused); page-table leaves and the heads of the I-fetch and load miss queues are critical
    loc: p038
    quote: >-
      lines in the L2 have an additional field that describes how “critical” they are. This field moves around with
      the line as it travels down to L1 or out to SLC
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US20230060225A1
  - id: c-mh-v8-l2-lru-patent
    text: >-
      Per the same patent, the L2 uses strict LRU and places new lines at chosen points in the order, keeping
      critical lines longer and letting non-temporal or unused prefetched lines go first
    loc: p039
    quote: >-
      the L2 uses a strict LRU scheme, but then uses the ideas suggested above to place new lines in an “appropriate”
      place in the LRU ordering
    method: patent-reading
    derivation: inferred
    chip: post-m1
    hedge: "the patent seems to suggest"
    supports: []
    notes: >-
      US20230060225A1 (2022). Differs from the random replacement Handley inferred for the M1 L2
      (c-mh-v2-l2-random-repl); the patent postdates the M1
  - id: c-mh-v8-thrash-detect
    text: >-
      Per a 2022 patent, one controller watches L1 and L2 metrics (prefetch usefulness, pointer-chase hit rates,
      thrashing) and adjusts prefetch aggressiveness, L1 write allocation and the L1 insertion policy
    loc: p043
    quote: >-
      We have the sort of total control we have come to expect from Apple, a single controller that’s tracking both
      L1 and L2 and collecting various metrics.
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US11886354B1; when thrashing, writes may go to L2 instead of allocating in L1
  - id: c-mh-v8-variable-latency
    text: >-
      Per a 2022 patent, a large cache can have a hit latency that depends on distance, about one cycle to the
      nearest blocks and four to the farthest, with far blocks winning return collisions to bound the worst case
    loc: p045
    quote: >-
      they suggest that reasonable values for current caches are the nearest blocks are one cycle away, the farthest
      blocks four cycles away
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 4
    unit: cycles
    supports: []
    notes: US11893241B1; Handley discusses it as a way to keep a large SLC fast
  - id: c-mh-v8-slc-quota
    text: >-
      The SLC has long enforced per-client quotas; per a 2022 patent, quotas are now adjusted each epoch from usage
      statistics such as traffic and hit rates
    loc: p047
    quote: >-
      track these various statistics over some epoch, and at the end of each epoch adjust quotas to reflect the
      patterns just seen
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US11914521B1; the patent says the scheme also applies to L1 and L2
  - id: c-mh-v8-age-tracking
    text: >-
      Per a 2018 patent, scheduler entries hold short age offsets from a base timestamp, and the older-or-younger
      bitmaps across pipelines needed for a flush are built only when a flush happens
    loc: p047
    quote: >-
      a short offset relative to a base timestamp is used for the timestamp of an instruction within the scheduling
      queue
    method: patent-reading
    derivation: inferred
    hedge: "As far as I can tell"
    supports: []
    notes: US11422821B1
  - id: c-mh-v8-writeback-pool
    text: >-
      Per a 2021 patent, results beyond the register file's write ports go to a temporary pool and drain later
      instead of stalling; six integer results plus three load pairs would need 12 writes in one cycle
    loc: p048
    quote: >-
      all six integer execution units generate a result, along with three load pair instructions. In theory this
      means we need to write back 6 + 2*3=12results in one cycle
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 12
    unit: writes/cycle
    supports: []
    notes: US20230011446A1
  - id: c-mh-v8-fill-forward
    text: >-
      Apple cores forward fill data to waiting loads: once a missed line is known to be coming, the load is
      scheduled and its bytes go to the LSU as the line fills the L1, perhaps two or three cycles sooner
    loc: p048
    quote: "the Apple cores implement fill-forwarding. ... This presumably knocks two or three cycles off the latency."
    method: patent-reading
    derivation: inferred
    value: 2.5
    unit: cycles
    range: [2, 3]
    hedge: "presumably"
    supports: []
    notes: Described as a side issue in US20230011446A1 (2021)
  - id: c-mh-v8-fadd-m1
    text: A chain of dependent FADDs runs at one billion per second on the M1, matching a 3-cycle FADD latency
    loc: p048
    quote: >-
      On M1 the latency of FADD is 3 cycles and frequency is 3GHz, so we expect, and see, 1B instructions per second
      of this stream.
    method: throughput
    derivation: measured
    value: 3
    unit: cycles
    supports: []
    notes: FADD V2.4S chain; confirms c-at-fadd-latency
  - id: c-mh-v8-m3-fadd-fusion
    text: >-
      On the M3 the same dependent FADD chain runs at 1.6 billion per second; Handley guesses back-to-back fusion
      cuts a dependent FADD pair from 6 to 5 cycles, which with the 4:3 clock ratio gives 1.6x
    loc: p049
    quote: >-
      For M3 the performance is 1.6B instructions per second ... reduce the latency for dependent pairs of FADDs
      from 6 to 5 cycles
    derivation: inferred
    value: 5
    unit: cycles
    hedge: "My guess"
    chip: m3
    supports: []
    notes: Handley does not say who ran the M3 test; he compares IBM POWER10's back-to-back fusion
  - id: c-mh-v8-m1-no-load-op-fusion
    text: The M1 has no load-op or op-store fusion
    loc: p049
    quote: "one set of fusions that was missing from M1 was load-op and op-store fusions"
    derivation: reported
    value: false
    supports: []
    notes: Aside with no method; adds to the unfused pairs listed in c-dj-no-fusion
  - id: c-mh-v8-load-op-patent
    text: >-
      Per a 2022 patent, a small ALU in the load/store unit applies an op to the loaded value, fusing loads with
      ADD, XOR, shifts and rotates, and with CBZ or TBZ but not flag-setting compares
    loc: p049
    quote: >-
      having a small ALU within the load/store unit which can execute the ALU op directly on the loaded value while
      it’s still in the load/store unit
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: >-
      US12008369B1; branch details sit in a Fusion Table indexed by the unused second-register field of the
      load-pair encoding
  - id: c-mh-v8-load-op-rules
    text: >-
      In the load-op fusion patent the load and op need only be decoded in the same cycle, not be adjacent, and the
      fused pair may return both the loaded value and the op result
    loc: p050
    quote: >-
      First the load and op do not need to be adjacent! As long as they are in the same decode group (ie decoded in
      the same cycle) the fusion will happen.
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: As of 2024, LLVM's M4 model listed no load-op fusion pattern
  - id: c-mh-v8-tage-lvp-patent
    text: >-
      Per a 2023 patent, TAGE-style load value or address prediction keeps its prediction tables in the front end,
      read around rename, and its training tables in the load/store unit
    loc: p052
    quote: >-
      One, prediction table, sits in the front end, able to provide values at around Rename time. The other, training
      table, sits in the Load/Store unit.
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US12159142B1; only table indices, not full history, are sent down the pipe
  - id: c-mh-v8-m4-three-loads
    text: The M4 P core still executes at most three loads per cycle
    loc: p053
    quote: "the back end is (still, as of the M4) set up to handle only three loads per cycle"
    derivation: reported
    value: 3
    unit: loads/cycle
    chip: m4
    supports: []
    notes: Aside with no method; the same limit as the M1 (lsu.loads_per_cycle)
  - id: c-mh-v8-sfb-patent
    text: >-
      Per a 2022 patent, a fetch-predictor field lets fetch run through a predicted-taken short forward branch whose
      target is in the same fetch group, up to about 16 instructions, and drop the skipped instructions
    loc: p056
    quote: >-
      at essentially any length of branch where the branch and the target sit within the same possible Fetch Group
      (ie are within up to ~16 instructions of each other)
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 16
    unit: instructions
    approx: true
    supports: []
    notes: US20240028339A1; skipped instructions are removed between the I-cache and the fetch queue
  - id: c-mh-v8-short-loop-unroll
    text: >-
      Per the same patent, a short backward loop is duplicated in the fetch queue so one fetch supplies two
      iterations
    loc: p057
    quote: >-
      We have now duplicated the loop body within the Fetch Queue. Essentially one Fetch has given us two iterations
      round the loop
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 2
    unit: iterations
    supports: []
    notes: US20240028339A1; an odd trip count is fixed by the slower predictors without a full flush
  - id: c-mh-v8-return-fetch-stack
    text: >-
      Per the same patent, a Return Fetch Stack, about one entry for now, keeps the instructions after a short call
      so the return needs no second fetch
    loc: p060
    quote: >-
      pretty much a single entry “stack” for now, to be used (again based on data being tracked in the Fetch
      Predictor Table) only for cases of a short call
    method: patent-reading
    derivation: inferred
    chip: post-m1
    value: 1
    unit: entries
    supports: []
    notes: US20240028339A1
  - id: c-mh-v8-return-trace-not-stored
    text: >-
      Before the 2022 return-fetch patents, the trace after a return was not held in the fetch predictor, so fetch
      after a return assumed the maximum length and discarded the excess
    loc: p061
    quote: >-
      The patent says that the trace following a return is currently not stored in the Fetch Predictor, and so after
      a return we have to proceed as though the trace is unknown
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US11941401B1. Corrects Handley's earlier assumption that the M1 kept return fetch parameters; he guesses the
      fetch state machine was too complex. See c-mh-v4-nfp-return-table, c-mh-v4-return-bubble
  - id: c-mh-v8-return-params
    text: >-
      Per a 2022 patent, the fetch-predictor entry for the code after a call goes either onto the RAS with the return
      address (faster) or into a separate table indexed by the return address (less energy)
    loc: p062
    quote: "This stores Return Fetch Parameters in a separate piece of storage that is indexed by the return address."
    method: patent-reading
    derivation: inferred
    chip: post-m1
    hedge: "if I have the big picture correct"
    supports: []
    notes: US11941401B1; Handley suggests the faster scheme for P cores and the other for E cores
  - id: c-mh-v8-bp-bank-hint
    text: >-
      Per the same patent, the fetch predictor records which branch-predictor bank holds a branch's data, so only
      that bank wakes to confirm the branch
    loc: p063
    quote: >-
      the Fetch Predictor stores the appropriate bank holding data for this particular branch and sends it to the
      Branch Predictor, so only that particular bank needs to wake up
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US11941401B1
  - id: c-mh-v8-amx-store-pipe
    text: >-
      AMX instructions issue through the store pipelines, at most two per cycle, and wait in the store queue until
      they are non-speculative and passed to the AMX unit
    loc: p063
    quote: >-
      Instructions are passed through the STORE pipeline (meaning a maximum of two per cycle can be issued) and sit in
      the store queue until they are shifted to the AMX unit.
    derivation: inferred
    value: 2
    unit: instr/cycle
    hedge: "apparently..."
    supports: []
    notes: Matches Johnson's AMX roles for load/store units 7 and 8 (c-dj-ls-units)
  - id: c-mh-v8-amx-reg-sets
    text: The AMX unit holds four logical register sets, one for each of the four cores it serves
    loc: p064
    quote: "We have four logical sets of registers in AMX for each of the four client CPUs."
    derivation: reported
    value: 4
    unit: sets
    supports: []
    notes: Aside with no method; a 2021 patent (US20230095072A1) renames registers of idle clients into a shared pool
  - id: c-mh-v8-abandonable-requests
    text: >-
      Per an Apple patent, each cache request carries an abandonable flag (prefetches, instruction fetches and
      speculative loads are abandonable), so on an interrupt the cache may drop those requests and the core drains
      faster
    loc: p065
    quote: >-
      every load (more precisely every cache request) sent to the cache now has an additional field added which notes
      whether the request is “abandonable”
    method: patent-reading
    derivation: inferred
    chip: post-m1
    supports: []
    notes: US11556485B1
  - id: c-mh-v8-cluster-shared
    text: >-
      The L2, L2 TLB, page walkers, LZ engine and AMX are shared by the cores of a cluster, and all cores of a
      cluster run at one frequency
    loc: p065
    quote: >-
      the shared hardware (L2, L2 TLB, page walkers, LZ engine, AMX, etc) ... all cores in a cluster have to share the
      same frequency
    derivation: inferred
    supports: []
    notes: >-
      A firmer statement than c-mh-v2-tlb2-per-cluster and c-mh-v2-tlb2-shared-guess, which lacked direct evidence;
      no evidence is given here either. The shared clock matches c-mh-v3-cluster-one-freq
  - id: c-mh-v8-m3pro-6core
    text: The M3 Pro and M3 Max have six-core P-clusters
    loc: p065
    quote: "The M3 Pro and Max implement a 6-core P-cluster."
    derivation: reported
    value: 6
    unit: cores
    chip: m3pro
    supports: []
    notes: Aside with no method; the M1 cluster has 4 (pcluster.cores)
  - id: c-mh-v8-amx-per-cluster
    text: The M1 and M2 have one AMX unit per P-cluster; the M1 Pro, with two P-clusters, has two
    loc: p065
    quote: "A single unit would represent the same design as M1 and M2"
    derivation: inferred
    value: 1
    unit: units
    supports: []
  - id: c-mh-v8-amx-m1-dgemm
    text: >-
      Peak large-matrix FP64 DGEMM on one M1 AMX unit is about 300 GFLOPS, twice that on an M1 Pro or Max with two
      units
    loc: p065
    quote: >-
      Peak DGEMM (FP64) large matrix multiple performance on a single M1 AMX unit is around 300GFLOPS, so twice that
      on an M1 Pro or Max.
    method: secondhand
    derivation: reported
    value: 300
    unit: GFLOPS
    approx: true
    supports: []
    notes: Handley points to Philip Turner's amx-benchmarks, run on an M1 Max with two AMX units
  - id: c-mh-v8-m2-amx-350
    text: One M2 AMX unit reaches about 350 GFLOPS on large FP64 matrix multiplies
    loc: p065
    quote: >-
      refers to an M2, and has that large matrix multiple performance on a single AMX unit as more like 350GFLOPS
    method: secondhand
    derivation: reported
    value: 350
    unit: GFLOPS
    approx: true
    chip: m2
    supports: []
    notes: From slides of a BLIS Retreat 2023 talk (GemmFIP-ExoLang)
  - id: c-mh-v8-m3max-amx
    text: >-
      Code reaching about 600 GFLOPS on an M1 Max reaches about 800 GFLOPS on an M3 Max, about the clock ratio, so
      the M3 Max has two AMX units, one per P-cluster
    loc: p065
    quote: >-
      code that achieved about 600GLOPS on an M1 Max achieves 800GFLOPS on an M3 Max, which is more or less what we
      would expect from frequency scaling
    derivation: inferred
    value: 2
    unit: units
    hedge: "presumably"
    chip: m3max
    supports: []
    notes: The GFLOPS figures come from a Twitter thread by Gabriel Baraldi
  - id: c-mh-v8-m3pro-amx-one
    text: >-
      The M3 Pro has one AMX unit, yet Howard Oakley found small-matrix and FFT Accelerate calls consistently faster
      on it than on the two-unit M1 Pro
    loc: p066
    quote: >-
      the M3 Pro (which we have concluded has just one AMX unit) was consistently faster than the M1 Pro (two AMX
      units)
    derivation: inferred
    value: 1
    unit: units
    chip: m3pro
    supports: []
    notes: Handley credits AMX improvements outside the outer-product peak, which scales only with clock
  - id: c-mh-v8-amx-outer-8x8
    text: >-
      Used as an outer-product engine, an AMX unit computes a full 8x8 (64-product) outer product each cycle, so its
      peak grows only with clock
    loc: p066
    quote: >-
      when the AMX unit is used as an outer product engine, calculating a full 8×8→64 outer ... every cycle, it can
      only scale faster by the GHz ratio
    derivation: inferred
    value: 64
    unit: products/cycle
    supports: []
    notes: Said of AMX units from the M1 to the M3

new_mechanisms:
  fill_forwarding:
    name: Fill forwarding to waiting loads
    status: inferred
    description: A load that missed the L1 is woken as its line arrives and takes its bytes during the fill, not by replaying afterwards.
    params: []
    sim_switch: null
    detection_rule: >-
      a pointer chase whose nodes hit in L2 shows a load-to-use latency two or three cycles below the L2 hit latency
      plus an L1 hit

mechanism_claims:
  l1d_way_lookup: [c-mh-v8-l1d-no-way-mispredict]
  fill_forwarding: [c-mh-v8-fill-forward]
