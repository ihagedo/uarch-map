# handley-vol8-core.yaml
# Maynard Handley, 2025
# Corrections to the M1 picture and later-chip changes to the core (AArch64-Explore vol 8).
session: handley-vol8-core
source: handley-vol8

claims:
  - id: c-mh-v8-a15-rob-smaller
    text: >-
      Dougall Johnson found the A15/M2 P core has a ROB and some other structures about 10% smaller than the
      A14/M1, and a slightly larger load/store scheduling queue
    loc: p009
    quote: "~10% smaller ROB and some other structures, slightly larger load/store scheduling queue"
    method: secondhand
    derivation: reported
    value: 10
    unit: "%"
    approx: true
    chip: a15
    supports: []
    notes: Handley reads this as a rebalancing based on traces from the A14/M1
  - id: c-mh-v8-a15-tpidrro
    text: On the A15/M2, reads of special registers such as TPIDRRO_EL0 (thread-local data) are faster
    loc: p009
    quote: >-
      some special purpose registers (TPIDRRO_EL0, used by multiple threads within a single process to access
      thread-local data) are made faster
    method: secondhand
    derivation: reported
    chip: a15
    supports: []
    notes: From Dougall Johnson's list of A15/M2 differences
  - id: c-mh-v8-a15-adr-rename
    text: On the A15/M2, ADR and ADRP are handled at rename, like MOV immediate
    loc: p009
    quote: "ADR/ADRP, used to access global data, made faster (now handled at Rename, like MOV immediate)"
    method: secondhand
    derivation: reported
    value: true
    chip: a15
    supports: []
    notes: From Dougall Johnson's list; on the M1 adr and adrp are not eliminated (c-dj-mov-elim)
  - id: c-mh-v8-icestorm-4wide
    text: Icestorm, the M1's E core, is four wide; its A15 successor Blizzard widens this to five
    loc: p009
    quote: "Blizzard (the small core) is now 5-wide rather than 4-wide"
    method: secondhand
    derivation: reported
    value: 4
    unit: instr/cycle
    chip: icestorm
    supports: []
    notes: Implied by Dougall Johnson's A15 finding as Handley relays it
  - id: c-mh-v8-a15-blizzard
    text: The A15/M2 E core (Blizzard) is five wide, with a ROB about 33% larger than its predecessor's
    loc: p009
    quote: "Blizzard (the small core) is now 5-wide rather than 4-wide, with a 33% larger ROB"
    method: secondhand
    derivation: reported
