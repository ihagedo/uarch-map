# prime-retouch.yaml
# Jaehyuk Lee, Fan Sang and Taesoo Kim, 2024
# The M1 L1D tree-PLRU replacement, cache geometry from CCSIDR_EL1 and the Apple PMU, from the Prime+Retouch attack.
session: prime-retouch
source: arxiv-2402-15425

claims:
  - id: c-prt-l1d-tree-plru
    text: >-
      The L1D replacement policy is tree-based pseudo-LRU: the eviction order over every pattern of hits in a full
      set matches Tree-PLRU
    loc: p004
    quote: "we successfully reveal that the M1 processor adopts the Tree-PLRU eviction policy for the L1 data cache"
    method: counter
    derivation: measured
    value: tree-PLRU
    supports: [l1d.replacement]
    notes: >-
      Kernel driver timing loads with the Apple PMU cycle counter and L1D-miss event 0xa3. The core used is not named;
      the attack built on the policy worked on both core types (c-prt-ice-l1d-tree-plru).
  - id: c-prt-ice-l1d-tree-plru
    text: >-
      An access sequence built on tree-PLRU state produced the predicted extra L1D misses on Icestorm as well as
      Firestorm
    loc: p013
    quote: "We empirically found that 14 additional misses are enough to clearly distinguish genuine victim accesses in both types of core."
    derivation: measured
    value: tree-PLRU
    supports: []
    chip: icestorm
    notes: >-
      The 57-load sequence adds 14 misses only when the tree state shows the victim's access. The paper states
      tree-PLRU for the M1 L1D without separating the cores.

  - id: c-prt-l1d-ways
    text: CCSIDR_EL1 reports the Firestorm L1D as 8-way set associative
    loc: p004
    quote: "retrieve such information by utilizing the system registers CCSIDR_EL1 and CSSELR_EL1 ... L1 DCache L2 DCache L1 DCache L2 DCache 256 8 64 8192 12 128"
    method: vendor-doc
    derivation: documented
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: Table I gives the Firestorm L1D as 256 sets, 8 ways, 64 B lines.
  - id: c-prt-l1d-line
    text: CCSIDR_EL1 reports a 64 B line for the Firestorm L1D
    loc: p004
    quote: "retrieve such information by utilizing the system registers CCSIDR_EL1 and CSSELR_EL1 ... L1 DCache L2 DCache L1 DCache L2 DCache 256 8 64 8192 12 128"
    method: vendor-doc
    derivation: documented
    value: 64
    unit: B
    supports: [l1d.line]
  - id: c-prt-l2-ways
    text: CCSIDR_EL1 reports the P-cluster L2 as 12-way set associative
    loc: p004
    quote: "retrieve such information by utilizing the system registers CCSIDR_EL1 and CSSELR_EL1 ... L1 DCache L2 DCache L1 DCache L2 DCache 256 8 64 8192 12 128"
    method: vendor-doc
    derivation: documented
    value: 12
    unit: ways
    supports: [l2.assoc]
    notes: Table I gives the Firestorm L2 as 8192 sets, 12 ways, 128 B lines.
  - id: c-prt-l2-line
    text: CCSIDR_EL1 reports a 128 B line for the P-cluster L2
    loc: p004
    quote: "retrieve such information by utilizing the system registers CCSIDR_EL1 and CSSELR_EL1 ... L1 DCache L2 DCache L1 DCache L2 DCache 256 8 64 8192 12 128"
    method: vendor-doc
    derivation: documented
    value: 128
    unit: B
    supports: [l2.line]
  - id: c-prt-ice-l1d-geometry
    text: CCSIDR_EL1 reports the Icestorm L1D as 128 sets of 8 ways with 64 B lines
    loc: p004
    quote: "256 8 64 8192 12 128 128 8 64 2048 16 128 TABLE I: Information of data cache hierarchies in M1 processors"
    method: vendor-doc
    derivation: documented
    value: 128 sets, 8 ways, 64 B lines
    supports: []
    chip: icestorm
  - id: c-prt-ice-l2-geometry
    text: CCSIDR_EL1 reports the E-cluster L2 as 2048 sets of 16 ways with 128 B lines
    loc: p004
    quote: "256 8 64 8192 12 128 128 8 64 2048 16 128 TABLE I: Information of data cache hierarchies in M1 processors"
    method: vendor-doc
    derivation: documented
    value: 2048 sets, 16 ways, 128 B lines
    supports: []
    chip: icestorm

  - id: c-prt-l1d-index
    text: On Firestorm the L1D set is (virtual address mod 16384) / 64, so address bits 6-13 pick the set
    loc: p004
    quote: "s = (x mod 16384)/64 on Firestorm core and s = (x mod 8192)/64 on Icestorm"
    derivation: measured
    value: (VA mod 16384) / 64
    supports: []
  - id: c-prt-ice-l1d-index
    text: On Icestorm the L1D set is (virtual address mod 8192) / 64, so address bits 6-12 pick the set
    loc: p004
    quote: "s = (x mod 16384)/64 on Firestorm core and s = (x mod 8192)/64 on Icestorm"
    derivation: measured
    value: (VA mod 8192) / 64
    supports: []
    chip: icestorm

  - id: c-prt-l1-hit
    text: >-
      A single Firestorm L1D hit, timed between barriers with the PMU cycle counter, takes 4 cycles once the barrier
      cost is taken off
    loc: p005
    quote: "the actual L1 hit latency is 2 cycles and 4 cycles, and L1 miss latency is around 12 cycles and 16 cycles, respectively"
    method: counter
    derivation: derived
    value: 4
    unit: cycles
    supports: []
    notes: Measured total minus the 56-cycle barrier cost (c-prt-barrier). Not a pointer chase, so not comparable with l1d.latency.
  - id: c-prt-l1-miss
    text: A Firestorm L1D miss takes about 16 cycles on the same timing
    loc: p005
    quote: "the actual L1 hit latency is 2 cycles and 4 cycles, and L1 miss latency is around 12 cycles and 16 cycles, respectively"
    method: counter
    derivation: derived
    value: 16
    unit: cycles
    approx: true
    supports: []
    notes: The level that served the miss is not stated. Measured total minus the 56-cycle barrier cost.
  - id: c-prt-ice-l1-hit
    text: A single Icestorm L1D hit takes 2 cycles on the same timing
    loc: p005
    quote: "the actual L1 hit latency is 2 cycles and 4 cycles, and L1 miss latency is around 12 cycles and 16 cycles, respectively"
    method: counter
    derivation: derived
    value: 2
    unit: cycles
    supports: []
    chip: icestorm
    notes: Measured total minus the 51-cycle barrier cost (c-prt-ice-barrier).
  - id: c-prt-ice-l1-miss
    text: An Icestorm L1D miss takes about 12 cycles on the same timing
    loc: p005
    quote: "the actual L1 hit latency is 2 cycles and 4 cycles, and L1 miss latency is around 12 cycles and 16 cycles, respectively"
    method: counter
    derivation: derived
    value: 12
    unit: cycles
    approx: true
    supports: []
    chip: icestorm
  - id: c-prt-barrier
    text: The barrier around the timed load adds 56 cycles on Firestorm
    loc: p005
    quote: "The measured latency includes the memory barrier instruction’s latency: 51 cycles and 56 cycles, respectively, on Icestorm and Firestorm core."
    method: counter
    derivation: measured
    value: 56
    unit: cycles
    supports: []
    notes: The appendix code brackets the PMU reads and the load with ISB.
  - id: c-prt-ice-barrier
    text: The barrier around the timed load adds 51 cycles on Icestorm
    loc: p005
    quote: "The measured latency includes the memory barrier instruction’s latency: 51 cycles and 56 cycles, respectively, on Icestorm and Firestorm core."
    method: counter
    derivation: measured
    value: 51
    unit: cycles
    supports: []
    chip: icestorm

  - id: c-prt-no-armv8-pmu
    text: The M1 cores do not implement the standard ARMv8 PMU; accessing its system registers halts the system
    loc: p004
    quote: "we found that the M1 does not deploy the standard ARMv8 PMU"
    derivation: measured
    value: false
    supports: []
  - id: c-prt-pmu-10
    text: Apple's PMU counts at most 10 events at once per core, each counter selecting one of 255 events (0 to 254)
    loc: p004
    quote: "the M1 processor can concurrently monitor at most 10 PMU events per core, and each PMU can track one of the 255 undocumented events (0 to 254)"
    method: other
    derivation: measured
    value: 10
    unit: events
    supports: []
    notes: Interface worked out from XNU's partial use of the PMU and experiment.
  - id: c-prt-pmu-cycles
    text: Apple PMU event 0x2 counts core clock cycles
    loc: p004
    quote: "0x2 that tracks the core clock cycles (e.g., rdtsc as in x86)"
    method: counter
    derivation: measured
    supports: []
  - id: c-prt-pmu-l1d-miss
    text: Apple PMU event 0xa3 counts L1D misses
    loc: p004
    quote: "0xa3 that monitors the L1 data cache miss event"
    method: counter
    derivation: measured
    supports: []
  - id: c-prt-pmesr0
    text: PMESR0 (S3_1_C15_C5_0) selects the events for PMC2 to PMC5, 8 bits per counter
    loc: p016
    quote: "the PMESR0 register mapped to S3_1_C15_C5_0 provides a way to select PMU events for PMC2 to PMC5. Each PMC can track PMU events 0 to 254, and 8 bits are assigned per PMC."
    derivation: measured
    supports: []
  - id: c-prt-pmcr0
    text: >-
      PMCR0 (s3_1_c15_c0_0) enables counters with bits 0-7, sets the interrupt mode with bits 8-10 and grants EL0
      access with bit 30
    loc: p016
    quote: "The PMCR0 register mapped to s3_1_c15_c0_0 controls basic capabilities of PMU such as which Performance Monitoring Counter (PMC) needs to be enabled (bit 0-7)"
    derivation: measured
    supports: []
    notes: EL0 access is off by default on macOS. PMCR1 (bits 16-23 for EL1) picks the exception levels that count.
  - id: c-prt-cntvct-alias
    text: The Apple system register s3_4_c15_c10_6 reads the ARM system counter at EL0 as an alias of CNTVCT_EL0
    loc: p011
    quote: "we could discover that an undocumented system register s3_4_c15_c10_6 is used as an alias of CNTVCT_EL0"
    method: other
    derivation: measured
    supports: []
    notes: Found by disassembling Rosetta 2's translation of rdtsc. Reading CNTVCT_EL0 itself faulted in the authors' Linux setup.
  - id: c-prt-clock
    text: Firestorm runs at 3.2 GHz
    loc: p011
    quote: "it is known that Firestorm core runs at 3.2GHz"
    method: secondhand
    derivation: reported
    value: 3.2
    unit: GHz
    supports: [pcluster.clock_max]

new_params:
  l1d.replacement: {block: l1d, name: L1D replacement policy}
  l2.assoc: {block: l2, name: L2 associativity, unit: ways}

mechanism_claims:
  l1d_page_offset_index: [c-prt-l1d-index, c-prt-ice-l1d-index]
  l1d_tree_plru: [c-prt-ice-l1d-tree-plru]
