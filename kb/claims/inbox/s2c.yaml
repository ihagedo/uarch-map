# s2c.yaml
# Jiyong Yu et al., 2023
# The M1 exclusive monitor and P-cluster L2 (inclusion, AutoLock, replacement, set index) reverse engineered for S2C.
session: s2c
source: usenix23-s2c

claims:
  - id: c-s2c-stxr-l1-evict
    text: >-
      A store-exclusive to a private line fails exactly when the line was evicted from the L1D after its
      load-exclusive, and never while the line stays in the L1D
    loc: p005
    quote: "strex to a local exclusive address never fails when the address still remains in the L1, and always fails when the address resides only in lower levels of the cache"
    method: other
    derivation: measured
    value: true
    supports: []
    notes: >-
      Algorithm 1: 1000 LDXR/STXR pairs with random loads between, the line's L1 residency timed with the cycle
      counter, repeated over 10 times. One run: 518 failed and evicted, 482 neither, none mixed.
  - id: c-s2c-ice-stxr-l1-evict
    text: On Icestorm too, a store-exclusive fails exactly when its line has left the L1D since the load-exclusive
    loc: p005
    quote: "We test the above code on both P-cores and E-cores ... consistently observed that fail correlates perfectly with evict_from_L1"
    method: other
    derivation: measured
    value: true
    supports: []
    chip: icestorm
  - id: c-s2c-erg-64
    text: >-
      The exclusive reservation granule is 64 B, the L1D line size: a store-exclusive to a different address than
      its load-exclusive succeeds only inside the same 64 B block
    loc: p005
    quote: "We observed that strex can succeed even if ldrex and strex addresses differ. Also, strex only succeeds when the two addresses are on the same 64-byte-aligned block."
    method: other
    derivation: measured
    value: 64
    unit: B
    supports: [lsu.exclusive_granule]
    notes: The authors read a 64 B rather than 128 B (L2 line) granule as a sign that the monitor tracks L1D lines only.
  - id: c-s2c-one-reservation
    text: Each core holds only one exclusive reservation at a time; a younger load-exclusive replaces the older one
    loc: p005
    quote: "we find that each core can indeed only monitor one exclusive address at a time"
    method: other
    derivation: measured
    value: 1
    unit: addresses
    supports: []
  - id: c-s2c-monitor-coherence
    text: >-
      The authors speculate that the exclusive monitor rides on the L1 coherence protocol, perhaps as a dedicated
      coherence state for lines reserved by a load-exclusive
    loc: p014
    quote: "we speculate that the exclusive monitor is implemented by piggybacking on the cache coherence protocol. The implementation may use a dedicated coherence state for exclusive addresses accessed by LL instructions."
    derivation: inferred
    hedge: "we speculate"
    supports: []
    notes: A store-exclusive, like a plain store, would then invalidate the line in other cores' L1Ds and so clear their reservations.
  - id: c-s2c-stxr-rob-head
    text: >-
      A store-exclusive is not performed until it reaches the head of the reorder buffer, so it waits for older
      loads to complete
    loc: p011
    quote: "strex is not performed until it reaches the head of the reorder buffer, and thus would not execute until load[x] is completed if the load was placed before it"
    derivation: inferred
    supports: []
    notes: Given as the reason the racing load had to follow the STXR in program order in the multi-set monitor.
  - id: c-s2c-m2-stxr
    text: On the M2 a store-exclusive likewise fails when its line is evicted from the L1D
    loc: p013
    quote: "We are able to reproduce the same attack primitive that we explained in §3 on M2 CPUs."
    derivation: measured
    supports: []
    chip: m2
    notes: The M2 cache hierarchy itself was not reverse engineered.

  - id: c-s2c-l1-index
    text: The L1D set index is taken from the page-offset address bits above the line offset
    loc: p006
    quote: "L1 sets are indexed by the page offset bits subtracting the L1 line offset bits."
    method: other
    derivation: measured
    value: page-offset bits above the line offset
    supports: []
    notes: Pages are 16 KB on the M1. Matches the (VA mod 16384)/64 mapping in c-prt-l1d-index.
  - id: c-s2c-l1d-8way
    text: >-
      Eight addresses sharing the target's L1D set index always evict it from the L1D and seven never do, so the
      L1D is 8-way set associative
    loc: p006
    quote: "The results show that the candidate L1 eviction set always evicts the target address out of the L1 cache. Also if we drop one address from the eight-element eviction set, the target address will never be evicted."
    method: other
    derivation: measured
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: Eviction checked by timing the target load with the cycle counter.
  - id: c-s2c-l1-lru
    text: The L1D uses an LRU-based replacement policy
    loc: p006
    quote: "The L1 cache adopts an LRUbased replacement policy for choosing evicted lines."
    method: other
    derivation: measured
    value: LRU-based
    supports: []
    notes: >-
      Rests on the 8-in, 7-out eviction test, which does not separate true LRU from tree-PLRU; Prime+Retouch finds
      tree-PLRU (c-prt-l1d-tree-plru).

  - id: c-s2c-l2-cross-core-l1-hit
    text: >-
      Walking a plain L2 eviction set on another core never evicted the target line from the first core's L1D
    loc: p006
    quote: "After running this experiment with different addresses, we always observe an L1 hit."
    method: other
    derivation: measured
    supports: []
    notes: >-
      Hetterich and Schwarz saw the same. The authors trace it to AutoLock (c-s2c-l2-autolock) rather than to a
      non-inclusive L2.
  - id: c-s2c-l2-inclusive
    text: >-
      The P-cluster L2 is inclusive of the L1Ds: contention with lines from another core in an L2 set evicts this
      core's lines from its L1D
    loc: p007
    quote: "the contention with T in the L2 causes S to be evicted from the L1, which is only possible in an inclusive L2"
    method: other
    derivation: measured
    value: inclusive
    supports: []
    contradicts: [l2.inclusion]
    notes: >-
      Two cores, eviction set split over two L1D sets so AutoLock cannot interfere. Disagrees with the non-inclusive,
      non-exclusive reading (c-mh-v3-l2-covering-tags-hint, c-mh-v3-dram-fill-l1-only). E-core results said similar.
  - id: c-s2c-l2-autolock
    text: The L2 evicts lines that have no L1D copy before lines an L1D still holds (AutoLock)
    loc: p008
    quote: "M1 also employs the AutoLock optimization [64] to prioritize data without L1 copies for eviction from the L2."
    method: other
    derivation: measured
    value: true
    supports: []
    notes: >-
      AutoLock, which the authors say ARM CPUs use with inclusive caches, is described in US 8,271,733. Shown by
      varying how the eviction set is split over two L1D sets (c-s2c-autolock-threshold).
  - id: c-s2c-autolock-threshold
    text: >-
      With a minimal L2 eviction set split over the two L1D sets of one L2 line on another core, the target is
      evicted only when the smaller half holds at least 3 lines
    loc: p007
    quote: "We observe that addr can be evicted when the smaller half of S has at least 3 addresses (meaning 3 or 9 addresses are flipped)."
    method: other
    derivation: measured
    value: 3
    unit: addresses
    supports: []
    notes: >-
      The authors' reading: with fewer, the other L1D set holds at most 8, so at most 11 of the 12 lines in the L2
      set have L1D copies and the target, held in L1D, is never chosen.
  - id: c-s2c-l2-line-split
    text: >-
      The L2 line is 128 B, twice the L1D line, so the lines of one L2 set spread over two adjacent L1D sets
    loc: p007
    quote: "we notice that the L2 line size in the M1 is 128 Bytes, twice the size of L1 lines. This means that data in one L2 set can reside in two adjacent L1 sets."
    method: secondhand
    derivation: reported
    value: 128
    unit: B
    supports: [l2.line]
    notes: >-
      Taken from Table 1 (PACMAN). Flipping address bit 6 moves a line to the other L1D set but keeps its L2 set; the
      inclusion and AutoLock tests rely on this split.

new_params:
  lsu.exclusive_granule: {block: lsu, name: Exclusive reservation granule, unit: B}

new_mechanisms:
  exclusive_monitor_l1:
    name: Exclusive monitor bound to L1D residency
    status: measured
    description: >-
      A load-exclusive reservation lasts only while its line stays in the L1D, so evicting the line makes the
      store-exclusive fail; each core holds one reservation with a 64 B granule.
    params: [lsu.exclusive_granule]
    sim_switch: null
    detection_rule: LDXR a line, walk an 8-address L1D eviction set for it, then STXR; the store fails exactly when the line left the L1D
  l2_autolock:
    name: Inclusive L2 that spares L1-resident lines (AutoLock)
    status: measured
    description: >-
      The L2 is inclusive of the L1Ds, and its replacement takes lines with no L1D copy before lines an L1D still
      holds.
    params: [l2.inclusion, l2.replacement]
    sim_switch: null
    detection_rule: >-
      an L2 eviction set walked on another core evicts a line from this core's L1D only when the set's own lines all
      stay in L1D, split over the two L1D sets of one 128 B L2 line

mechanism_claims:
  exclusive_monitor_l1: [c-s2c-stxr-l1-evict, c-s2c-erg-64, c-s2c-one-reservation, c-s2c-monitor-coherence,
                         c-s2c-stxr-rob-head]
  l2_autolock: [c-s2c-l2-inclusive, c-s2c-l2-autolock, c-s2c-autolock-threshold, c-s2c-l2-cross-core-l1-hit]
