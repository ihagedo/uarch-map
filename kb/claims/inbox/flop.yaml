# flop.yaml
# Jason Kim, Jalen Chuang, Daniel Genkin and Yuval Yarom, 2025
# Load value prediction found on the M3 and later and absent on the M2; the M1 was not tested.
session: flop
source: usenix25-flop

claims:
  - id: c-flop-m2-no-lvp
    text: >-
      On the M2 P cores a chain of dependent loads runs no faster when every load returns the same constant, so
      the M2 has no load value prediction
    loc: p004
    quote: "and does not depend on the values loaded from memory being randomized or constant. Thus, we conclude that an LVP is not present."
    method: pointer-chase
    derivation: measured
    value: false
    supports: []
    chip: m2
    notes: >-
      Byte loads to shuffled, flushed 128 B-aligned offsets, 10 to 500 loads, median of 100, macOS 14.5 development
      kernel. The M1 was not tested.
  - id: c-flop-m3-lvp
    text: >-
      On the M3 P cores the dependent chain speeds up from about 40 loads when every load returns the same
      constant, taking about half the cycles at 500 loads
    loc: p004
    quote: "show a significant speedup from 40 iterations and above on our experiment when the load values are constant"
    method: pointer-chase
    derivation: measured
    value: 40
    unit: loads
    supports: []
    chip: m3
    notes: Relayed by Handley in c-mh-v8-m3-lvp.
  - id: c-flop-ecores-no-lvp
    text: The E cores of the M2 and M3 have no load value prediction
    loc: p004
    quote: "Moving on to the E-cores of both CPUs (Figure 3 bottom), these generate plots that do not differ significantly by load value, indicating the lack of LVPs."
    method: pointer-chase
    derivation: measured
    value: false
    supports: []
    chip: m3
    notes: M2 and M3 E cores.
  - id: c-flop-lvp-chips
    text: Load value prediction is present on the M3, M4 and A17 Pro and absent on the M2, A15 and A16
    loc: p004
    quote: "That is, the LVP is present on the M3, M4, and A17 and absent on the M2, A15, and A16."
    method: pointer-chase
    derivation: measured
    value: true
    supports: []
    chip: m3
    notes: WebAssembly version of the test in Safari, ten million loads, 1 ms timer.
  - id: c-flop-lvp-width
    text: >-
      The M3 predictor predicts any constant for 1-, 2- and 4-byte loads, but for 8-byte loads only the value
      zero
    loc: p005
    quote: "Remarkably, while all other load widths activate the LVP on any constant value fitting that width, we observe that activation on 8-byte wide loads occurs only when the load value is zero."
    method: pointer-chase
    derivation: measured
    supports: []
    chip: m3
  - id: c-flop-lvp-no-pointers
    text: The authors conjecture the 8-byte restriction keeps the predictor from learning pointer values
    loc: p005
    quote: "We conjecture that this may be a countermeasure for memory safety such that the LVP will not learn values of pointers."
    derivation: inferred
    hedge: "We conjecture that this may be"
    supports: []
    chip: m3
  - id: c-flop-lvp-constants-only
    text: The M3 predictor learns only constant load values, not values that change by a fixed stride
    loc: p005
    quote: "As such, we conclude that Apple’s implementation of the LVP trains only on constants."
    method: pointer-chase
    derivation: measured
    supports: []
    chip: m3
    notes: Striding load values gave the same runtime trend as random values.
  - id: c-flop-lvp-local
    text: >-
      Fully unrolling the load loop stops the M3 predictor from firing, so it trains per load instruction, not on
      a global window of recent values
    loc: p005
    quote: "Hence, we conclude that LVP trains with local scope (presumably with entries tagged with the instruction address) instead of training on a global window of recent load values."
    method: pointer-chase
    derivation: measured
    hedge: "presumably"
    supports: []
    chip: m3
  - id: c-flop-lvp-72
    text: The M3 predictor tracks at most 72 distinct load instructions at once, fewer for some load spacings
    loc: p005
    quote: "Interestingly, we observe that the maximum number of copies the LVP can accommodate is 72, but this also depends on how far the load instructions are spaced apart."
    method: other
    derivation: measured
    value: 72
    unit: loads
    supports: []
    chip: m3
    notes: Copies of the load spaced 0 to 32 instructions apart; same result with ASLR off. Relayed by Handley in c-mh-v8-m3-lvp-entries.
  - id: c-flop-lvp-4way
    text: >-
      The authors conjecture the predictor table is 4-way set associative with its set chosen by a hash of page
      offset bits of the load PC
    loc: p006
    quote: "Thus, we conjecture the LVP’s internal state cache may be 4-way set-associative ... and uses a hash function on the page offset bits to determine the set"
    derivation: inferred
    value: 4
    unit: ways
    hedge: "we conjecture ... may be"
    supports: []
    chip: m3
  - id: c-flop-lvp-train-240
    text: >-
      The M3 predictor mispredicts reliably after more than 240 training loads; at about 60, 120 and 180 loads it
      fires only 25 to 50 % of the time
    loc: p006
    quote: "Finally, past 240 loads, we observe activations with near-perfect reliability. Thus, in subsequent experiments, we train the LVP on 250 loads."
    method: other
    derivation: measured
    value: 240
    unit: loads
    supports: []
    chip: m3
    notes: Stale-value gadget with the load target flushed, 10 to 400 training loads, 1,000 runs each. Relayed by Handley in c-mh-v8-m3-lvp-train.
  - id: c-flop-lvp-sixty
    text: >-
      The authors conjecture the predictor favours training counts in multiples of 60 until 240, when its
      confidence suffices at any length
    loc: p006
    quote: "we conjecture that the Apple LVP prefers training loads that are multiples of 60 until 240 loads, at which point it builds enough confidence to activate reliably regardless of training length"
    derivation: inferred
    value: 60
    unit: loads
    hedge: "we conjecture"
    supports: []
    chip: m3
  - id: c-flop-lvp-buffer
    text: >-
      Mispredictions stay reliable while the caches of all cores are thrashed, so the authors conjecture the
      predictor state sits in a dedicated buffer, not in cache lines
    loc: p007
    quote: "above 240 loads, we observe that LVP activations are reliable even when thrashing the cache on all cores, leading us to conjecture that value-prediction state is stored in a dedicated microarchitectural buffer instead of cache lines"
    derivation: inferred
    hedge: "leading us to conjecture"
    supports: []
    chip: m3
  - id: c-flop-lvp-decay
    text: >-
      Predictor state survives a one-second busy wait on an idle core; with a memory-heavy workload on the same
      core, mispredictions halve by 200 ms and fall to a tenth by 1 s
    loc: p007
    quote: "However, the plots diverge at 10 ms, where the intensive load/store activity over time seemingly causes the activations to halve at 200 ms and decrease to one-tenth at 1 s."
    method: other
    derivation: measured
    supports: []
    chip: m3
    notes: Busy waits of 1 us to 1 s between training and misprediction, stress-ng vm as the workload.
  - id: c-flop-lvp-sleep
    text: Non-maskable interrupts leave the predictor state intact, but letting the core sleep clears it
    loc: p007
    quote: "we identify that the LVP state is resilient to them ... core in a low-power state, we observe that this resets the LVP state, resulting in no activations."
    method: other
    derivation: measured
    supports: []
    chip: m3
  - id: c-flop-m3-clock
    text: The M3 peaks at 4.05 GHz
    loc: p007
    quote: "given the M3’s peak frequency of 4.05 GHz [50], is more than four billion cycles"
    method: secondhand
    derivation: reported
    value: 4.05
    unit: GHz
    supports: []
    chip: m3
    notes: Cites a Tom's Hardware report.
  - id: c-flop-mul-3
    text: Citing Apple's optimization guide, the authors take each MUL to cost 3 cycles
    loc: p007
    quote: "Given Apple documentation stating that each mul takes 3 cycles [4]"
    method: secondhand
    derivation: reported
    value: 3
    unit: cycles
    supports: []
    notes: Used to turn MUL counts into speculation windows in cycles.
  - id: c-flop-spec-window
    text: >-
      After a value misprediction the M3 runs on about 330 cycles (110 dependent MULs) when the real load misses
      the cache, and about 30 cycles (10 MULs) when it hits
    loc: p007
    quote: "our results translate to speculation windows of 330 (for cache misses) and 30 (for hits) cycles"
    method: other
    derivation: derived
    value: 330
    unit: cycles
    supports: []
    chip: m3
    notes: MUL counts at 3 cycles each, per Apple's guide. The predictor still fires when the load hits.
  - id: c-flop-rogue-call
    text: >-
      On the M3 a stale predicted value used as an index can select a function pointer, and the core
      speculatively calls that function
    loc: p008
    quote: "Therefore, we conclude that the LVP is also effective at diverting control flow under speculation."
    method: other
    derivation: measured
    supports: []
    chip: m3
    notes: Secret received in all 100 trials. SLAP saw no speculative calls after LAP mispredictions on the M3 (c-slap-m3-no-spec-call).
  - id: c-flop-lvp-kernel
    text: The M3 predictor trains and mispredicts in kernel code as it does in user code
    loc: p008
    quote: "Remarkably, the LVP functions similarly in kernel-space"
    method: other
    derivation: measured
    supports: []
    chip: m3
    notes: Gadget in a kernel extension driven through ioctl calls.
  - id: c-flop-no-user-kernel
    text: Training in user space does not carry over to kernel code
    loc: p015
    quote: "as we were not able to train the LVP across userspace / kernel boundary"
    method: other
    derivation: measured
    supports: []
    chip: m3
  - id: c-flop-full-pc-tag
    text: The M3 predictor matches the full load PC; clones aliasing the low 8 to 46 address bits never mispredict
    loc: p018
    quote: "Hence, we conclude that the LVP likely tags its internal state with the full instruction address, precluding aliasing attacks."
    method: other
    derivation: measured
    hedge: "likely"
    supports: []
    chip: m3
  - id: c-flop-pid-tag
    text: >-
      Training in one process never causes mispredictions in another, even when the two share an ASID, so the
      predictor may also tag entries by process
    loc: p018
    quote: "indicating that the LVP may employ PID-tagging in addition to PC-tagging"
    method: other
    derivation: measured
    hedge: "may"
    supports: []
    chip: m3
  - id: c-flop-kernel-addr
    text: >-
      A user-space misprediction aimed at a kernel address leaks nothing, possibly because speculation stops at a
      load from a kernel address
    loc: p018
    quote: "However, we do not receive any data over the covert channel this time, possibly indicating that speculation may terminate when loading from a kernel address."
    method: other
    derivation: measured
    hedge: "possibly indicating that speculation may"
    supports: []
    chip: m3
  - id: c-flop-dit
    text: Setting the DIT bit disables load value prediction on the M3 P cores, per process and from user space
    loc: p014
    quote: "Therefore, we conclude that setting the DIT bit indeed disables the LVP."
    method: pointer-chase
    derivation: measured
    supports: []
    chip: m3
    notes: Both the speedup test and the stale-value test lose their effect. GoFetch found DIT also disables the M3 data memory-dependent prefetcher.
  - id: c-flop-dit-cost
    text: Running the Safari renderer with DIT set costs 4.5 % on Speedometer 3.0, and DIT costs 0.6 % on the BYTE benchmark
    loc: p014
    quote: "such a mitigation results in an overhead of 4.5% on the Speedometer 3.0 benchmark. In addition, we observe the overhead in native environments is even smaller, with 0.6% on average"
    method: throughput
    derivation: measured
    value: 4.5
    unit: "%"
    supports: []
    chip: m3

new_params:
  lsu.value_prediction: {block: lsu, name: Load value prediction}

new_mechanisms:
  load_value_prediction:
    name: Load value prediction
    block: lsu
    status: absent
    description: A PC-tagged predictor hands a load's last constant value to dependent instructions early; not found on M1 or M2, present from M3/A17 Pro.
    params: [lsu.value_prediction]
    sim_switch: null
    detection_rule: >-
      a chain of dependent byte loads from shuffled, cache-missing lines runs at the same speed whether every line
      holds one constant or random values; with the predictor the constant run speeds up after about 40 loads

mechanism_claims:
  load_value_prediction: [c-flop-m2-no-lvp, c-flop-m3-lvp, c-flop-ecores-no-lvp, c-flop-lvp-chips, c-flop-lvp-width,
                          c-flop-lvp-no-pointers, c-flop-lvp-constants-only, c-flop-lvp-local, c-flop-lvp-72,
                          c-flop-lvp-4way, c-flop-lvp-train-240, c-flop-lvp-sixty, c-flop-lvp-buffer, c-flop-lvp-decay,
                          c-flop-lvp-sleep, c-flop-spec-window, c-flop-rogue-call, c-flop-lvp-kernel,
                          c-flop-no-user-kernel, c-flop-full-pc-tag, c-flop-pid-tag, c-flop-kernel-addr, c-flop-dit]
