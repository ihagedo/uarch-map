# handley-vol1-theory.yaml
# Maynard Handley, 2025
# The Map stage and load/store ordering tags, from the theory chapters (M1 Explainer vol 1).
session: handley-vol1-theory
source: handley-vol1

claims:
  - id: c-mh-v1-map-stage
    text: >-
      Apple's patents show a separate Map stage ahead of Rename that works out the register dependencies among the up
      to eight instructions handled in one cycle; Rename then allocates each instruction's resources
    loc: p011
    quote: >-
      You have to figure out the successive name dependencies between all the instructions ... Apple is very clear, in
      multiple patents, that they use this separate Map stage
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      Handley names no patent number here. He says most other companies do not describe such a stage and suggests it
      may help Apple sustain its width.
  - id: c-mh-v1-lsq-order-tags
    text: >-
      In the virtual load/store queue the program-order tag given at rename is, depending on the patent, the retirement
      group number (GNUM), the reorder buffer number (RNUM) or a load-queue number (LNUM)
    loc: p134
    quote: >-
      Different patents suggest that what Apple variously calls the GNUM (retirement group number), or the RNUM (reorder
      buffer number), or the LNUM (load queue? number) are used as the ordering property for load/stores
    method: patent-reading
    derivation: inferred
    hedge: "Different patents suggest"
    supports: []
    notes: Handley names no patent numbers here. The tags play the role of the age bits in his POWER4-style split LQ/SQ model.

mechanism_claims:
  lsq_at_issue: [c-mh-v1-lsq-order-tags]
  group_map: [c-mh-v1-map-stage]
