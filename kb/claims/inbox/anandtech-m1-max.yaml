# anandtech-m1-max.yaml
# Andrei Frumusanu, 2021
# The unchanged Firestorm core and L2 in the M1 Pro and Max, their SLC, memory latency and CPU bandwidth limits.
session: anandtech-m1-max
source: anandtech-m1-max

claims:
  - id: c-at-max-same-core
    text: The M1 Pro and M1 Max use the M1's Firestorm cores, with no change the author could find
    loc: p001
    quote: "We seemingly can confirm this, as we’re seeing no apparent changes in the cores compared to what we’ve discovered on the M1 chips."
    derivation: measured
    value: true
    hedge: "seemingly"
    supports: []
    notes: Rather than the A15's newer cores, as the author expected.

  - id: c-at-max-l1d-latency
    text: The Firestorm L1D has a 3-cycle load-to-load latency
    loc: p002
    quote: "it’s still a 3.2GHz peak core with 128KB of L1D at 3 cycles load-load latencies, and a 12MB L2 cache"
    derivation: measured
    value: 3
    unit: cycles
    supports: [l1d.latency]
    notes: Measured on the M1 Max, whose core and L2 the author finds unchanged from the M1.

  - id: c-at-max-l1d-size
    text: The Firestorm L1D holds 128 KB
    loc: p002
    quote: "On the core and L2 side of things, there haven’t been any changes ... it’s still a 3.2GHz peak core with 128KB of L1D"
    derivation: measured
    value: 128
    unit: KiB
    supports: [l1d.size]
    notes: Measured on the M1 Max, whose core the author finds unchanged from the M1.

  - id: c-at-max-l2-size
    text: Each P-cluster L2 is 12 MB, unchanged from the M1
    loc: p002
    quote: "On the core and L2 side of things, there haven’t been any changes ... and a 12MB L2 cache."
    derivation: measured
    value: 12
    unit: MiB
    supports: [l2.size]
    notes: Measured on the M1 Max; the author finds the L2 unchanged from the M1.

  - id: c-at-max-clock-steps
    text: >-
      On the M1 Pro and Max a Firestorm core peaks at 3228 MHz with one core active in its cluster, 3132 MHz with two
      and 3036 MHz with three or four
    loc: p001
    quote: "The CPU cores clock up to 3228MHz peak, however vary in frequency depending on how many cores are active within a cluster, clocking down to 3132 at 2, and 3036 MHz at 3 and 4 cores active."
    derivation: measured
    value: 3228
    unit: MHz
    supports: []
    chip: m1max
    notes: Also the M1 Pro.

  - id: c-at-max-two-clusters
    text: >-
      The eight performance cores of the M1 Pro and Max form two 4-core clusters, each with its own 12 MB L2 and its
      own clock, so one cluster can run four cores at 3036 MHz while the other runs one at 3.23 GHz
    loc: p001
    quote: "the 8 performance cores in the M1 Pro and M1 Max are indeed consisting of two 4-core clusters, both with their own 12MB L2 caches, and each being able to clock their CPUs independently from each other"
    derivation: measured
    value: 2
    unit: clusters
    supports: []
    chip: m1max
    notes: Also the M1 Pro.

  - id: c-at-max-pro-mem
    text: The M1 Pro has 256-bit LPDDR5-6400 memory, giving 204 GB/s, against 68 GB/s on the M1
    loc: p001
    quote: "the M1 Pro features 256-bit LPDDR5 memory at 6400MT/s speeds, corresponding to 204GB/s bandwidth. This is significantly higher than the M1 at 68GB/s"
    derivation: derived
    value: 204
    unit: GB/s
    supports: []
    chip: m1pro
    notes: Computed from the bus width and data rate. Agrees with c-mh-v8-m1pro-bw.

  - id: c-at-max-max-mem
    text: The M1 Max has a 512-bit LPDDR5 memory system with 408 GB/s of bandwidth
    loc: p001
    quote: "using a whopping 512-bit wide LPDDR5 memory subsystem ... This gives the chip a massive 408GB/s of bandwidth"
    derivation: derived
    value: 408
    unit: GB/s
    supports: []
    chip: m1max
    notes: Agrees with c-mh-v8-m1max-bw.

  - id: c-at-max-pro-slc-24
    text: >-
      The author identifies the SLC as 24 MB on the M1 Pro and 48 MB on the M1 Max, a 50% increase in SLC per block
      over the M1
    loc: p001
    quote: "to be falling in at 24MB for the M1 Pro, and 48MB on the M1 Max ... makes sense given the SRAM die area – representing a 50% increase over the per-block SLC on the M1"
    derivation: inferred
    value: 24
    unit: MiB
    supports: []
    chip: m1pro
    notes: Reasoned partly from SRAM die area.

  - id: c-at-max-slc-48
    text: >-
      The M1 Max has 48 MB of SLC, which the author calls the memory controller caches, meant to amplify bandwidth for
      the chip's blocks and cut off-chip DRAM traffic and energy
    loc: p001
    quote: "The memory controller caches are at 48MB in this chip, allowing for theoretically amplified memory bandwidth for various SoC blocks as well as reducing off-chip DRAM traffic"
    derivation: measured
    value: 48
    unit: MiB
    supports: []
    chip: m1max
    notes: Agrees with c-cc-gcc-m1max-slc-48.

  - id: c-at-max-m1-slc-8
    text: The M1's SLC is 8 MB, against 48 MB on the M1 Max
    loc: p002
    quote: "Where things are quite different is when we enter the system cache, instead of 8MB, on the M1 Max it’s now 48MB large"
    derivation: measured
    value: 8
    unit: MiB
    supports: [slc.size]
    notes: From latency tests set against the M1's. Replaces the 16 MB assumed in the Mac mini review (c-at-mini-slc-16).

  - id: c-at-max-slc-slower
    text: >-
      The M1 Max's SLC is slower than the M1's; its latency depends on the access pattern, and even a linear chain shows
      data travelling farther than on the M1 and the A-series chips
    loc: p002
    quote: "it’s also evidently slower than the M1 SLC – the exact figures here depend on access pattern, but even the linear chain access shows that data has to travel a longer distance than the M1"
    method: pointer-chase
    derivation: measured
    supports: []
    chip: m1max

  - id: c-at-max-dram-latency
    text: >-
      At a 128 MB test depth DRAM latency on the M1 Max is roughly 15 ns higher than on the M1, which the author puts
      down to the larger SLC, a more complex fabric or worse LPDDR5 timings
    loc: p002
    quote: "At a 128MB comparable test depth, the new chip is roughly 15ns slower. The larger SLCs, more complex chip fabric, as well as possible worse timings on the part of the new LPDDR5 memory all could add"
    derivation: measured
    value: 15
    unit: ns
    approx: true
    hedge: "all could add"
    supports: []
    chip: m1max

  - id: c-at-max-m1-dram-bound
    text: One M1 core fully saturates the M1's memory bandwidth, and the bottleneck is the DRAM itself
    loc: p002
    quote: "we had already noted that the M1 chip was able to fully saturate its memory bandwidth with a single core and that the bottleneck had been on the DRAM itself"
    derivation: measured
    value: true
    supports: []
    notes: Restates the author's Mac mini result (c-at-mini-one-core-saturates).

  - id: c-at-max-one-core-102
    text: >-
      One thread on the M1 Max moves up to 102 GB/s; the limit there seems to be what one core, or rather the CPU
      cluster, can do
    loc: p002
    quote: "it’s able to stress the memory fabric to up to 102GB/s ... On the M1 Max, it seems that we’re hitting the limit of what a core can do"
    derivation: measured
    value: 102
    unit: GB/s
    hedge: "it seems that"
    supports: []
    chip: m1max
    notes: The core and L2 are the M1's. The test reads, modifies and writes back lines, half reads and half writes.

  - id: c-at-max-evict-limit
    text: >-
      Bandwidth drops once the footprint passes the 12 MB L2, which the author reads as the core being limited when it
      evicts lines out to the rest of the memory system
    loc: p002
    quote: "the reduction in BW at the 12MB figure signals that the core is somehow limited in bandwidth when evicting cache lines back to the upper memory system"
    derivation: inferred
    hedge: "somehow"
    supports: []
    chip: m1max
    notes: Read-modify-write test with a 1:1 read and write ratio.

  - id: c-at-max-fabric-224
    text: >-
      With threads spread over both P clusters, DRAM bandwidth stops at 224 GB/s at four threads, and more P-core
      threads add nothing, which the author calls the limit of the chip's fabric for the CPUs
    loc: p002
    quote: "a fourth thread lands us at 224GB/s and this appears to be the limit on the SoC fabric that the CPUs are able to achieve"
    derivation: measured
    value: 224
    unit: GB/s
    hedge: "appears to be"
    supports: []
    chip: m1max
    notes: Two threads, one per cluster, reach 186 GB/s and three reach 204 GB/s.

  - id: c-at-max-ecores-243
    text: Adding the E cores, in their own cluster, lifts CPU DRAM bandwidth to at most 243 GB/s, far below the chip's 409 GB/s
    loc: p002
    quote: "It’s only when the E-cores, which are in their own cluster, are added in, when the bandwidth is able to jump up again, to a maximum of 243GB/s."
    derivation: measured
    value: 243
    unit: GB/s
    supports: []
    chip: m1max
    notes: The jump comes only with another cluster, which fits a limit per cluster.

new_params: {}
new_mechanisms: {}
mechanism_claims:
  one_core_dram_saturation: [c-at-max-m1-dram-bound]
  noc_layout: [c-at-max-fabric-224, c-at-max-ecores-243]
  slc_memory_side: [c-at-max-slc-48]

resolutions:
  - param: slc.size
    claims: [c-7cpu-slc-size, c-at-mini-slc-16]
    resolution: The same author measures 8 MB for the M1 here; the 16 MB was assumed from the A14
    resolved_by: c-at-max-m1-slc-8
