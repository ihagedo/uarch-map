# jia-m1.yaml
# Jiajie Chen, 2024
# Chen's measurements of the M1's Firestorm and Icestorm cores, front end to L2 TLB, with figures he quotes from Apple's optimization guide.
session: jia-m1
source: jia-m1

claims:
  - id: c-jia-fetch-page-split
    text: >-
      Firestorm splits a fetch that crosses a page boundary into two cycles, so a loop placed across two pages pays one
      extra cycle per iteration
    loc: p001
    quote: "把循环放在两个页的边界上，发现 Firestorm 微架构遇到跨页的取指时确实会拆成两个周期来进行"
    method: throughput
    derivation: measured
    supports: []
    notes: Chen notes that one-cycle cross-page fetch would need two iTLB lookups or paired page entries.

  - id: c-jia-fetch-16
    text: >-
      With the loop's first instruction in the last 4 bytes of one page and the rest on the next, time per iteration
      rises by a cycle every 16 instructions, so Firestorm fetches 16 instructions per cycle
    loc: p001
    quote: "可以看到每 16 条指令会多一个周期，因此 Firestorm 的前端取指宽度确实是 16 条指令"
    method: throughput
    derivation: measured
    value: 16
    unit: instr/cycle
    supports: []
    contradicts: [fetch.width]
    notes: Agrees with c-mh-v4-fetch-16. The same loop kept within one page is limited by the back end instead.

  - id: c-jia-fetch-line
    text: Sixteen instructions per cycle is one 64 B cache line, though the back end limits the observed rate to 8 per cycle
    loc: p001
    quote: "虽然 Fetch 可以每周期 16 条指令，也就是一条 64B 的缓存行，由于后端的限制，只能观察到 8 的 IPC"
    derivation: inferred
    supports: []

  - id: c-jia-ice-fetch-8
    text: The same cross-page test adds a cycle every 8 instructions on Icestorm, so Icestorm fetches 8 instructions per cycle
    loc: p001
    quote: "可以看到每 8 条指令会多一个周期，意味着 Icestorm 的前端取指宽度为 8 条指令"
    method: throughput
    derivation: measured
    value: 8
    unit: instr/cycle
    supports: []
    chip: icestorm

  - id: c-jia-sysctl-l1i
    text: macOS reports a 192 KB L1I for the performance cores and 128 KB for the efficiency cores
    loc: p001
    quote: "通过 sysctl 可以看到，Firestorm 具有 192KB L1 ICache，Icestorm 具有 128KB L1 ICache ... hw.perflevel0.l1icachesize: 196608"
    method: other
    derivation: documented
    value: 192
    unit: KiB
    supports: [l1i.size]
    notes: macOS sysctl values as read by Chen.

  - id: c-jia-guide-l1i-size
    text: Apple's optimization guide gives every P-core from the A14 and M1 to the A18 and M4 a 192 KiB L1I
    loc: p001
    quote: "根据 Apple Silicon CPU Optimization Guide，从 M1 Family 到 M4 Family，A14 Bionic 到 A18 Family，P-Core 的 L1 ICache 的配置都是 192KiB"
    method: secondhand
    derivation: reported
    value: 192
    unit: KiB
    supports: [l1i.size]
    notes: From Apple's optimization guide.

  - id: c-jia-guide-l1i-ways
    text: Apple's optimization guide gives the P-core L1I as 6-way set associative
    loc: p001
    quote: "P-Core 的 L1 ICache 的配置都是 192KiB , 6-way, 64B lines"
    method: secondhand
    derivation: reported
    value: 6
    unit: ways
    supports: []
    notes: From Apple's optimization guide. Disagrees with l1i.assoc (12); agrees with c-ilk-l1i-ways and c-pac-l1i-ways.

  - id: c-jia-guide-l1i-line
    text: Apple's optimization guide gives the P-core L1I 64 B lines
    loc: p001
    quote: "P-Core 的 L1 ICache 的配置都是 192KiB , 6-way, 64B lines"
    method: secondhand
    derivation: reported
    value: 64
    unit: B
    supports: [l1i.line]
    notes: From Apple's optimization guide.

  - id: c-jia-guide-ice-l1i
    text: >-
      Apple's optimization guide gives the E-core L1I as 128 KiB with 64 B lines, 8-way on the M1 and A14 and 4-way
      from the M2 and A15 on
    loc: p001
    quote: "E-Core 的 L1 ICache 都是 128KiB , 64B lines，其中 M1 Family 和 A14 Bionic 是 8-way，其余处理器（M2 Family 和 A15 Bionic 开始）是 4-way"
    method: secondhand
    derivation: reported
    value: 8
    unit: ways
    supports: []
    chip: icestorm
    notes: From Apple's optimization guide.

  - id: c-jia-l1i-192
    text: >-
      A loop of NOPs ending in a branch runs at 8 instructions per cycle up to a 192 KB footprint and drops quickly to
      2.22 beyond it, matching a 192 KB L1I
    loc: p001
    quote: "可以看到 footprint 在 192 KB 之前时可以达到 8 IPC，之后则快速降到 2.22 IPC，这里的 192 KB 就对应了 Firestorm 的 L1 ICache 的容量"
    method: throughput
    derivation: measured
    value: 192
    unit: KiB
    supports: [l1i.size]

  - id: c-jia-ice-l1i-128
    text: On Icestorm the same loop runs at 4 per cycle up to 128 KB and drops to 2.10 beyond, matching a 128 KB L1I
    loc: p001
    quote: "可以看到 footprint 在 128 KB 之前时可以达到 4 IPC，之后则快速降到 2.10 IPC，这里的 128 KB 就对应了 Icestorm 的 L1 ICache 的容量"
    method: throughput
    derivation: measured
    value: 128
    unit: KiB
    supports: []
    chip: icestorm

  - id: c-jia-btb-1024
    text: >-
      With an unconditional branch every 4 bytes, Firestorm takes one cycle per branch up to 1024 branches, then three
      cycles per branch up to 49152 branches
    loc: p001
    quote: "可见在 1024 个分支之内可以达到 1 的 CPI，超过 1024 个分支，出现了 3 CPI 的平台，一直延续到 49152 个分支"
    method: branch-sweep
    derivation: measured
    value: 1024
    unit: entries
    supports: [btb.l0_entries]

  - id: c-jia-btb-l1i-plateau
    text: >-
      The three-cycle plateau ends at 49152 branches, which is where 4-byte branches fill the 192 KB L1I, so branches
      missing the BTB still cost three cycles while their code stays in the L1I
    loc: p001
    quote: "第二个拐点 49152，对应的是指令 footprint 超出 L1 ICache 的情况：L1 ICache 是 192KB，按照每 4 字节一个 B 指令计算，最多可以存放 49152 条 B 指令"
    method: branch-sweep
    derivation: measured
    value: 3
    unit: cycles/branch
    supports: []
    notes: Same tier as c-ox-btb-miss-bubble and c-mh-v4-btb-l0.

  - id: c-jia-btb-miss-late
    text: >-
      Past the BTB's capacity the predictor no longer knows which instructions are branches, and a branch is found only
      after fetch or even decode, which costs the extra cycles
    loc: p001
    quote: "超出 BTB 容量以后，分支预测时，无法从 BTB 中得到哪些指令是分支指令的信息，只能等到取指甚至译码后才能后知后觉地发现这是一条分支指令"
    derivation: inferred
    supports: []

  - id: c-jia-btb-8b
    text: >-
      With a branch every 8 bytes the one-cycle limit falls to 512 branches and the three-cycle plateau ends at 24576,
      showing a set-associative BTB whose index loses sets when low PC bits are always zero
    loc: p001
    quote: "可以看到 CPI=1 的拐点前移到 512 个分支，同时 CPI=3 的平台的拐点也前移到了 24576。拐点的前移，意味着 BTB 采用了组相连的结构"
    method: branch-sweep
    derivation: measured
    value: 512
    unit: branches
    supports: []

  - id: c-jia-btb-index
    text: >-
      Spacing branches 2048 B or more apart leaves room for only two one-cycle branches, so the zero-bubble BTB has 512
      sets of 2 ways indexed by PC bits 10:2
    loc: p001
    quote: "最终 CPI=1 的拐点定格在 2 条分支，此时分支的间距大于或等于 2048B ... 可以认为 Firestorm 的 BTB 是 512 Set 2 Way 的结构，Index 是 PC[10:2]"
    method: branch-sweep
    derivation: measured
    value: "512 sets, 2-way, indexed by PC bits 10:2"
    supports: [btb.l0_org]

  - id: c-jia-btb-2way
    text: The first-level BTB is 2-way set associative
    loc: p001
    quote: "根据这个信息，可以认为 Firestorm 的 BTB 是 512 Set 2 Way 的结构"
    method: branch-sweep
    derivation: measured
    value: 2
    unit: ways
    supports: [btb.assoc]
    notes: Against the direct-mapped guess of c-mh-v4-m1-nfp-dm.

  - id: c-jia-l1i-6way
    text: >-
      Branches 32 KB or more apart allow only six on the three-cycle plateau, which Chen reads as a 192 KB L1I of 512
      sets and 6 ways indexed by PC bits 14:6
    loc: p001
    quote: "CPI=3 的拐点定格在 6 条分支，此时分支的间距大于或等于 32KB ... 同时也侧面佐证了 192KB L1 ICache 是 512 Set 6 Way，Index 是 PC[14:6]"
    method: branch-sweep
    derivation: measured
    value: 6
    unit: ways
    hedge: "侧面佐证"
    supports: []
    contradicts: [l1i.assoc]
    notes: Agrees with c-ilk-l1i-ways and c-pac-l1i-ways.

  - id: c-jia-ice-btb-1024
    text: >-
      On Icestorm with a branch every 4 bytes the cost steps from 1 to 3 at 1024 branches with no second step; at 8
      bytes the steps fall at 512 and 16384, the L1I capacity
    loc: p001
    quote: "可以看到 1024 的拐点，1024 之前是 1 IPC，之后增加到 3 IPC。比较奇怪的是，没有看到第二个拐点 ... 第一个拐点前移到 512，第二个拐点出现在 16384"
    method: branch-sweep
    derivation: measured
    value: 1024
    unit: branches
    supports: []
    chip: icestorm
    notes: The source writes IPC here for what the Firestorm runs call CPI.

  - id: c-jia-ice-btb-16b
    text: >-
      With branches 16 bytes apart Icestorm's first step falls to 256, then a new two-cycle plateau lasts to 2048 and a
      third step comes at 8192, the L1I capacity
    loc: p001
    quote: "第一个拐点前移到 256，然后出现了一个 2 CPI 的新平台，2 CPI 的平台的拐点出现在 2048，第三个拐点出现在 8192，对应 L1 ICache 容量"
    method: branch-sweep
    derivation: measured
    value: 256
    unit: branches
    supports: []
    chip: icestorm

  - id: c-jia-ice-btb-guess
    text: >-
      Icestorm's irregular BTB results suggest either one BTB with a hashed index or two BTB levels organized to work
      over different ranges rather than simply in series
    loc: p001
    quote: "可能只有一级 BTB，但它的 Index 函数进行了一些 Hash 而非直接取 PC 某几位 ... 可能有两级 BTB，它们并非简单地级联，而是通过不同的组织方式，在不同的区间内发挥作用"
    derivation: inferred
    hedge: "可能"
    supports: []
    chip: icestorm

  - id: c-jia-ice-iprefetch
    text: >-
      Icestorm never exceeds three cycles per branch at 4-byte spacing, perhaps because the test is too small or because
      an instruction prefetcher brings code in once the footprint passes the 128 KB L1I
    loc: p001
    quote: "测试规模不够大，把分支数量继续增大，才能出现 CPI>3 的情况 ... 指令预取器在工作，当 footprint 大于 128KB L1 ICache 时，能提前把指令取进来"
    derivation: inferred
    hedge: "给出一些猜测"
    supports: []
    chip: icestorm

  - id: c-jia-guide-itlb
    text: Apple's optimization guide gives every P-core from the A14 and M1 to the A18 and M4 a 192-entry L1 iTLB, 3 MiB of 16 KiB pages
    loc: p001
    quote: "P-Core 的 L1 ITLB 配置都是一样的： 192 entries ，考虑到每个页是 16 KiB，对应 3 MiB 的内存"
    method: secondhand
    derivation: reported
    value: 192
    unit: entries
    supports: []
    notes: From Apple's optimization guide. Disagrees with itlb.entries (128).

  - id: c-jia-itlb-192
    text: >-
      With branches on separate pages, cost rises from 1 to 3 cycles from BTB conflict misses, then from 3 to 13 cycles
      at 192 pages, matching a 192-entry L1 iTLB
    loc: p001
    quote: "从 1 Cycle 到 3 Cycle 的增加是由于 L1 BTB 的冲突缺失，之后在 192 个页时从 3 Cycle 快速增加到 13 Cycle，则对应了 192 项的 L1 ITLB 容量"
    method: branch-sweep
    derivation: measured
    value: 192
    unit: entries
    supports: []
    contradicts: [itlb.entries]
    notes: Against the 128 entries PACMAN derives from 4 ways and 32 sets (c-pac-itlb-128).

  - id: c-jia-ice-itlb-128
    text: Icestorm shows one step, from 1 to 8 cycles per branch at 128 pages, so its L1 iTLB holds 128 entries
    loc: p001
    quote: "只有一个拐点，在 128 个页时，性能从 1 Cycle 下降到 8 Cycle，意味着 L1 ITLB 容量是 128 项"
    method: branch-sweep
    derivation: measured
    value: 128
    unit: entries
    supports: []
    chip: icestorm

  - id: c-jia-guide-uops
    text: Apple's optimization guide gives the M1 P-core a maximum sustained rate of 8 uops per cycle and the E-core 4
    loc: p001
    quote: "M1 Family 的 Sustained uops Per Cycle 最大值，P-Core 是 8，E-Core 是 4"
    method: secondhand
    derivation: reported
    value: 8
    unit: instr/cycle
    supports: [decode.width]
    notes: From Apple's optimization guide.

  - id: c-jia-guide-uops-m4
    text: Apple's optimization guide raises the P-core's sustained uops per cycle to 9 on the M3 and 10 on the M4
    loc: p001
    quote: "M3 Family 的 P-Core 提升到了 9，E-Core 和 M2 持平；M4 Family 的 P-Core 进一步提升到了 10"
    method: secondhand
    derivation: reported
    value: 10
    unit: instr/cycle
    supports: []
    chip: m4
    notes: From Apple's optimization guide.

  - id: c-jia-decode-8
    text: Firestorm reaches at most 8 instructions per cycle, so decode is at least 8 wide; a wider decoder is not ruled out
    loc: p001
    quote: "Firestorm 最大观察到 8 IPC，Icestorm 最大观察到 4 IPC，那么 Decode 宽度也至少是这么多，暂时也不能排除有更大的 Decode 宽度"
    method: throughput
    derivation: measured
    value: 8
    unit: instr/cycle
    approx: true
    hedge: "至少"
    supports: [decode.width]

  - id: c-jia-ice-decode-4
    text: Icestorm reaches at most 4 instructions per cycle, so its decode is at least 4 wide
    loc: p001
    quote: "Icestorm 最大观察到 4 IPC，那么 Decode 宽度也至少是这么多"
    method: throughput
    derivation: measured
    value: 4
    unit: instr/cycle
    approx: true
    hedge: "至少"
    supports: []
    chip: icestorm

  - id: c-jia-ras-50
    text: Average time per call jumps once the call chain is 50 deep, so Firestorm's return stack holds 50 entries
    loc: p001
    quote: "可以看到调用链深度为 50 时性能突然变差，因此 Firestorm 的 Return Stack 深度为 50"
    method: branch-sweep
    derivation: measured
    value: 50
    unit: entries
    supports: [ras.depth]

  - id: c-jia-ice-ras-32
    text: On Icestorm the time per call jumps at a call depth of 32, so its return stack holds 32 entries
    loc: p001
    quote: "可以看到调用链深度为 32 时性能突然变差，因此 Icestorm 的 Return Stack 深度为 32"
    method: branch-sweep
    derivation: measured
    value: 32
    unit: entries
    supports: []
    chip: icestorm

  - id: c-jia-ice-phr
    text: >-
      Icestorm keeps a 60-bit target path history and a 16-bit branch-address path history, both updated on taken
      branches by shifting one bit and XORing in target bits 47:2 and branch bits 5:2
    loc: p001
    quote: "使用 60 位的 Path History Register for Target(PHRT) 以及 16 位的 Path History Register for Branch(PHRB)，每次执行 taken branch 时更新 ... PHRTnew = (PHRTold << 1) xor T[47:2]"
    derivation: measured
    value: "PHRT 60 bits, PHRB 16 bits"
    supports: []
    chip: icestorm
    notes: Same method as Chen's Firestorm paper. c-ien-ecore-phrt-t48 gives target bits 48:2.

  - id: c-jia-int-spec-362
    text: >-
      The integer register probe steps at 362 instructions; this counts registers free for speculation, and the register
      file also holds the architectural registers, at least 32
    loc: p001
    quote: "32b/64b int：测试 speculative 32/64 位整数寄存器的数量，拐点在 362 ... 注意这里测试的都是能够用于预测执行的寄存器数量，实际的物理寄存器堆还需要保存架构寄存器"
    method: wong-probe
    derivation: measured
    value: 362
    unit: registers
    supports: [int_prf.headroom]

  - id: c-jia-fp-spec-382
    text: The FP register probe with 32-bit FP results steps at 382, the FP registers free for speculation
    loc: p001
    quote: "32b fp：测试 speculative 32 位浮点寄存器的数量，拐点在 382"
    method: wong-probe
    derivation: measured
    value: 382
    unit: registers
    supports: [fp_prf.headroom]

  - id: c-jia-flags-spec-123
    text: The NZCV flags probe steps at 123, the flags registers free for speculation
    loc: p001
    quote: "flags：测试 speculative NZCV 寄存器的数量，拐点在 123"
    method: wong-probe
    derivation: measured
    value: 123
    unit: registers
    supports: [flags_prf.headroom]

  - id: c-jia-ice-prf
    text: On Icestorm the speculative register probes step at 77 integer, 74 FP and 38 flags registers
    loc: p001
    quote: "32b/64b int：测试 speculative 32/64 位整数寄存器的数量，拐点在 77 ... 32b fp：测试 speculative 32 位浮点寄存器的数量，拐点在 74 ... 拐点在 38"
    method: wong-probe
    derivation: measured
    value: "int 77, fp 74, flags 38"
    supports: []
    chip: icestorm

  - id: c-jia-sysctl-l1d
    text: macOS reports a 128 KB L1D for the performance cores and 64 KB for the efficiency cores
    loc: p001
    quote: "Firestorm 具有 128KB L1 DCache，Icestorm 具有 64KB L1 DCache ... hw.perflevel0.l1dcachesize: 131072"
    method: other
    derivation: documented
    value: 128
    unit: KiB
    supports: [l1d.size]
    notes: macOS sysctl values as read by Chen.

  - id: c-jia-guide-l1d
    text: Apple's optimization guide gives every P-core from the A14 and M1 to the A18 and M4 a 128 KiB, 8-way L1D with 64 B lines
    loc: p001
    quote: "P-Core 的 L1 DCache 都是 128KiB, 8-way, 64B lines 的配置"
    method: secondhand
    derivation: reported
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: From Apple's optimization guide. The E-core L1D is given as 64 KiB, 8-way, 64 B lines.

  - id: c-jia-l1d-128
    text: A pointer chase shows a clear step at a 128 KB footprint, the L1D capacity
    loc: p001
    quote: "可以看到 128KB 出现了明显的拐点，对应的就是 128KB 的 L1 DCache 容量"
    method: pointer-chase
    derivation: measured
    value: 128
    unit: KiB
