  - id: c-jia-dtlb-160
    text: >-
      A pointer chase with one pointer per page slows from 160 pages and settles at 9 cycles per load by 250 pages, so
      the L1 dTLB holds 160 entries; the 9 cycles include an L2 TLB hit
    loc: p001
    quote: "从 160 个页开始性能下降，到 250 个页时性能稳定在 9 CPI，认为 Firestorm 的 L1 DTLB 有 160 项"
    method: pointer-chase
    derivation: measured
    value: 160
    unit: entries
    supports: [dtlb.l1_entries]

  - id: c-jia-dtlb-5way
    text: >-
      Spreading pointers 2, 4, 8, 16 and 32 pages apart moves the step to 80, 40, 20, 10 and 5 pages, and 64 pages apart
      stays at 5, so the L1 dTLB is 5-way with 32 sets indexed by VA bits 18:14
    loc: p001
    quote: "每 32 个页一个指针，拐点变成 5；每 64 个页一个指针，拐点依然是 5。说明 Firestorm 的 L1 DTLB 是 5 路组相连，32 个 Set，Index 是 VA[18:14]"
    method: pointer-chase
    derivation: measured
    value: "5-way set associative, indexed by VA bits 14-18"
    supports: [dtlb.l1_org]

  - id: c-jia-ice-dtlb
    text: >-
      Icestorm's L1 dTLB holds 128 entries, 4-way with 32 sets indexed by VA bits 18:14; past it loads settle at 10
      cycles
    loc: p001
    quote: "从 128 个页开始性能下降，到 160 个页时性能稳定在 10 CPI，认为 Icestorm 的 L1 DTLB 有 128 项 ... 说明 Icestorm 的 L1 DTLB 是 4 路组相连，32 个 Set，Index 是 VA[18:14]"
    method: pointer-chase
    derivation: measured
    value: 128
    unit: entries
    supports: []
    chip: icestorm

  - id: c-jia-ldst-mix
    text: >-
      Per cycle Firestorm completes 3 loads with 1 store, 2 loads with 2 stores, 1 load with 2 stores, or 2 stores
      (128-bit accesses)
    loc: p001
    quote: "实测 Firestorm 每个周期可以完成 ... 3x 128b Load + 1x 128b Store ... 2x 128b Load + 2x 128b Store ... 1x 128b Load + 2x 128b Store"
    method: throughput
    derivation: measured
    value: 3
    unit: loads/cycle
    supports: [lsu.loads_per_cycle]

  - id: c-jia-stores-2
    text: At most 3 loads or 2 stores execute per cycle
    loc: p001
    quote: "访存方面，每周期最多 3 Load 或者 2 Store"
    method: throughput
    derivation: measured
    value: 2
    unit: stores/cycle
    supports: [lsu.stores_per_cycle]

  - id: c-jia-load-bw-48
    text: >-
      Widening each access from 128 to 256 bits halves the instruction rate and leaves bandwidth unchanged, so peak read
      bandwidth is 48 B per cycle
    loc: p001
    quote: "如果把每条指令的访存位宽从 128b 改成 256b，读写带宽不变，指令吞吐减半。也就是说最大的读带宽是 48B/cyc"
    method: throughput
    derivation: measured
    value: 48
    unit: B/cycle
    supports: [l1d.load_bw]

  - id: c-jia-store-bw-32
    text: Peak write bandwidth is 32 B per cycle, and peak read and peak write cannot be reached together
    loc: p001
    quote: "最大的写带宽是 32B/cyc，二者不能同时达到"
    method: throughput
    derivation: measured
    value: 32
    unit: B/cycle
    supports: [l1d.store_bw]

  - id: c-jia-ice-ldst
    text: >-
      Per cycle Icestorm completes 2 loads, 1 load with 1 store, or 1 store, for at most 32 B per cycle read and 16 B
      per cycle written
    loc: p001
    quote: "实测 Icestorm 每个周期可以完成 ... 也就是说最大的读带宽是 32B/cyc，最大的写带宽是 16B/cyc"
    method: throughput
    derivation: measured
    value: 2
    unit: loads/cycle
    supports: []
    chip: icestorm

  - id: c-jia-mdp-70
    text: >-
      Repeating a store and a load to one address, the address-dependent pattern slows past 70 loads, while the
      data-dependent pattern has no clear threshold but starts a small rise at 84
    loc: p001
    quote: "数据依赖没有明显的阈值，但从 84 开始出现了一个小的增长，且斜率不为零；地址依赖的阈值是 70"
    method: other
    derivation: measured
    value: 70
    unit: loads
    supports: []
    notes: Handley reads a similar knee as a predictor of about 74 entries (c-mh-v1-lsdp-74-chained).

  - id: c-jia-ice-mdp-13
    text: On Icestorm both the data-dependent and the address-dependent patterns slow past 13 loads
    loc: p001
    quote: "数据依赖和地址依赖的阈值都是 13"
    method: other
    derivation: measured
    value: 13
    unit: loads
    supports: []
    chip: icestorm

  - id: c-jia-stlf-overlap
    text: >-
      Every overlapping store and load of 8 to 64 bits forwards whatever the offset, even when the load or store
      crosses a 64 B line, at the cost of one more cycle
    loc: p001
    quote: "所有 Store 和 Load Overlap 的情况，无论地址偏移，都能成功转发。甚至在 Load 或 Store 跨越 64B 缓存行边界时，也可以成功转发，代价是多一个周期"
    method: other
    derivation: measured
    supports: []

  - id: c-jia-stlf-multi
    text: >-
      A load that needs data from two, four or eight stores forwards at any offset unless the data crosses a line,
      taking 1 to 4 cycles more than forwarding from one store
    loc: p001
    quote: "一个 Load 需要转发两个、四个甚至八个 Store 的数据时，如果数据跨越缓存行，则不能转发，但其他情况下，无论地址偏移，都可以转发，只是比从单个 Store 转发需要多耗费 1-4 个周期"
    method: other
    derivation: measured
    supports: []

  - id: c-jia-stlf-latency
    text: A successful forward takes 7.5 cycles, and a failed forward across a line takes 28 cycles or more
    loc: p001
    quote: "成功转发时 7.5 cycle，跨缓存行且转发失败时 28+ cycle"
    method: other
    derivation: measured
    value: 7.5
    unit: cycles
    supports: []
    contradicts: [lsu.store_load_latency]
    notes: Latency per forwarded store and load in his test; c-mh-v1-store-load-pair-6 gives 6.

  - id: c-jia-ice-stlf
    text: On Icestorm any overlap between a load and earlier stores costs 10 cycles, however many stores overlap and whether or not a line is crossed
    loc: p001
    quote: "在 Icestorm 上，如果 Load 和 Store 访问范围出现重叠，则需要 10 Cycle，无论是和几个 Store 重叠，也无论是否跨缓存行"
    method: other
    derivation: measured
    value: 10
    unit: cycles
    supports: []
    chip: icestorm

  - id: c-jia-guide-ptr-chase
    text: >-
      Apple's optimization guide describes fast pointer chasing with 3-cycle latency when a load's base register is the
      previous load's destination
    loc: p001
    quote: "Apple 实现了 fast pointer chasing with a 3-cycle latency，要求后一个 load 的 base register 和前一个 load 的 destination register 相同"
    method: secondhand
    derivation: reported
    value: 3
    unit: cycles
    supports: [l1d.latency]
    notes: From Apple's optimization guide.

  - id: c-jia-ptr-chase-3
    text: >-
      A load feeding the next load's base runs at 3 cycles with no offset, an immediate offset, a register offset, or
      from the first register of an LDP; an access crossing an 8 B boundary takes 4
    loc: p001
    quote: "实测 Firestorm 的 Load to use latency 针对 pointer chasing 场景做了优化，在下列的场景下可以达到 3 cycle ... ldp x0, x1, [x0] ：load pair 的第一个目的寄存器转发到基地址，无偏移 如果访存跨越了 8B 边界，则退化到 4 cycle"
    method: pointer-chase
    derivation: measured
    value: 3
    unit: cycles
    supports: []

  - id: c-jia-load-use-4
    text: >-
      Load-to-use latency is 4 cycles when the result feeds an ALU, the index register of the next load, or when it is
      the second register of an LDP feeding the next base
    loc: p001
    quote: "在下列场景下 Load to use latency 则是 4 cycle ... load 的目的寄存器作为 alu 的源寄存器 ... ldp x1, x0, [x0] ：load pair 的第二个目的寄存器转发到基地址，无偏移"
    method: pointer-chase
    derivation: measured
    value: 4
    unit: cycles
    supports: [l1d.latency_alu]

  - id: c-jia-ice-ptr-chase
    text: >-
      Icestorm has the same 3-cycle pointer-chase cases and 4-cycle cases as Firestorm; crossing an 8, 16 or 32 B
      boundary still takes 3 cycles and crossing a 64 B boundary takes 7
    loc: p001
    quote: "实测 Icestorm 的 Load to use latency 针对 pointer chasing 场景做了优化 ... 如果访存跨越了 8B/16B/32B 边界，依然是 3 cycle；跨越了 64B 边界则退化到 7 cycle"
    method: pointer-chase
    derivation: measured
    value: 3
    unit: cycles
    supports: []
    chip: icestorm

  - id: c-jia-utag
    text: >-
      AMD's utag test shows the same effects on the M1, read as a virtual-address utag way predictor whose 8-bit tag
      XOR-folds VA bits 47:14, identical on Firestorm and Icestorm
    loc: p001
    quote: "猜想它也用了类似的基于虚拟地址的 UTag/Way Predictor 方案，并测出来它的 UTag 也有 8 bit，Firestorm 和 Icestorm 都是相同的 ... 一共有 8 bit，由 VA[47:14] 折叠而来"
    method: other
    derivation: measured
    value: 8
    unit: bits
    hedge: "猜想"
    supports: []
    notes: The eight folds run from VA bits 14, 22, 30, 38 and 46 to VA bits 21, 29, 37 and 45.

  - id: c-jia-guide-int-units
    text: >-
      Apple's optimization guide lists six integer units for the M1 P-core: ALU/f with BRc/i, ALU/f with BRc, ALU/f,
      ALU with MUL, MAC and MISC, ALU with MUL and DIV, and ALU
    loc: p001
    quote: "M1 Family 的 P-Core 包括如下计算单元 ... ALU/f, BRc/i ... ALU/f, BRc ... ALU, MUL, MAC, MISC ... ALU, MUL, DIV"
    method: secondhand
    derivation: reported
    value: 6
    unit: units
    supports: [eu_int.count]
    notes: From Apple's optimization guide.

  - id: c-jia-guide-fp-units
    text: >-
      Apple's optimization guide lists four FP/SIMD units for the M1 P-core; one adds FDIV, FCMP and SHA, two add moves
      to GPRs and FCSEL, and all four multiply
    loc: p001
    quote: "GENERAL, MOVE2GPR, FCMPf, FCSELf, FDIV, MUL, SHA ... GENERAL, MOVE2GPR, FCSELf, MUL ... GENERAL, MUL"
    method: secondhand
    derivation: reported
    value: 4
    unit: units
    supports: [eu_fp.count]
    notes: From Apple's optimization guide.

  - id: c-jia-guide-lsu
    text: >-
      Apple's optimization guide gives the P-core a burst of 3 load uops, 2 store-address uops and 2 store-data uops per
      cycle, and a sustained 4 uops of which 2 write the cache
    loc: p001
    quote: "Burst: 3 load uops, 2 store uops (address part), and 2 store uops (data part) ... Sustained: 4 uops, 2 write into the cache"
    method: secondhand
    derivation: reported
    value: 3
    unit: loads/cycle
    supports: [lsu.loads_per_cycle]
    notes: From Apple's optimization guide. Chen's own tests did not separate the store address and data parts.

  - id: c-jia-addi-6
    text: >-
      ADD with an immediate runs at 6 per cycle, so six ALUs; ADD, UBFM and SBFM sometimes measure 4.6 to 4.7 and
      sometimes 6, which Chen suspects is a low-power mode
    loc: p001
    quote: "从 addi 的指令来看，有 6 个 ALU，能够执行基本的整数指令（add/ubfm/sbfm 的吞吐有时候测出来 4.6-4.7，有时候测出来 6，怀疑是进入了什么低功耗模式）"
    method: throughput
    derivation: measured
    value: 6
    unit: units
    hedge: "怀疑"
    supports: [eu_int.count]
    notes: The register_security_tag mechanism describes a similar slowdown to about 4-wide.

  - id: c-jia-int-roles
    text: >-
      Mixed-throughput tests give the six integer units as two with ALU, CSEL, branch and MRS NZCV, one with ALU, CSEL
      and FP-to-integer moves, one with ALU and those moves, one with ALU, MUL, MADD and CRC, and one with ALU and MUL
    loc: p001
    quote: "小结：Firestorm 的执行单元如下 ... alu + csel + branch + mrs nzcv ... alu + csel + fmov f2i ... alu + fmov f2i ... alu + mul + madd + crc ... alu + mul"
    method: throughput
    derivation: measured
    value: "2x alu+csel+branch+mrs nzcv; alu+csel+fmov f2i; alu+fmov f2i; alu+mul+madd+crc; alu+mul"
    supports: []
    notes: Matches Johnson's unit roles (c-dj-int-roles) for the instructions tested.

  - id: c-jia-fp-roles
    text: >-
      All four FP/SIMD units run basic FP/SIMD and AES; one also runs FDIV, FRECPE, FRECPX, FRSQRTE and FSQRT, and two
      run FP-to-integer moves and conversions
    loc: p001
    quote: "basic fp/asimd ops + aes + fdiv + frecpe + frecpx + frsqrte + fsqrt + fmov f2i + cvtf2i ... basic fp/asimd ops + aes + fmov f2i + cvtf2i"
    method: throughput
    derivation: measured
    value: "4x basic fp/simd+aes; 1 adds fdiv, frecpe, frecpx, frsqrte, fsqrt; 2 add fmov f2i, fcvtzs"
    supports: []
    notes: Chen's per-unit list, set beside c-dj-fp-roles rather than against it.

  - id: c-jia-f2i-both
    text: >-
      An FP-to-integer move occupies both an FP unit and an integer unit, reading the FP register file on the FP side and
      writing the integer register file on the integer side
    loc: p001
    quote: "fmov f2i 同时占用了浮点执行单元和整数执行单元，这主要是为了复用寄存器堆读写口"
    method: throughput
    derivation: inferred
    supports: []

  - id: c-jia-i2f-lsu
    text: >-
      An integer-to-FP move uses neither FP nor integer units, so Chen places it in the load/store units, which already
      write FP registers
    loc: p001
    quote: "fmov i2f 既不在浮点，也不在整数，那只能在访存了"
    method: throughput
    derivation: inferred
    supports: []

  - id: c-jia-fdiv-fsqrt
    text: >-
      Mixing FDIV and FSQRT drops to one pair every three cycles, guessed to be two pipelines in one unit competing for a
      register file write port
    loc: p001
    quote: "fp fdiv 和 fp fsqrt 混合时，吞吐下降到 0.33 一个不太整的数字，猜测是因为它们属于同一个执行单元内的不同流水线，抢占寄存器堆写口"
    method: throughput
    derivation: inferred
    value: 0.33
    unit: pairs/cycle
    hedge: "猜测"
    supports: []

  - id: c-jia-taken-1
    text: Branches run at 2 per cycle when not taken but only one taken branch completes per cycle
    loc: p001
    quote: "虽然 Br 的吞吐可以达到 2，但是每周期只能有一个 taken branch"
    method: throughput
    derivation: measured
    value: 1
    unit: branches/cycle
    supports: [fetch.taken_per_cycle]

  - id: c-jia-nop-8
    text: NOPs are eliminated and never enter an ALU, so they fill the full 8-wide rate
    loc: p001
    quote: "NOP 被 eliminate 了，不用进 ALU，可以打满 8 的发射宽度"
    method: throughput
    derivation: measured
    value: 8
    unit: instr/cycle
    supports: []

  - id: c-jia-ice-units
    text: >-
      Icestorm has three integer units (two with branch, one with MADD, MUL and CRC), two load units of which one also
      stores, and two FP/SIMD units of which one adds divide, square root and FP-to-integer moves
    loc: p001
    quote: "小结：Icestorm 的执行单元如下 ... alu + csel + mrs nzcv + madd + mul + crc ... load + store ... basic fp/asimd ops + aes + fdiv + frecpe + frecpx + frsqrte + fsqrt + fmov f2i"
    method: throughput
    derivation: measured
    value: "3 integer, 2 load/store, 2 FP/SIMD"
    supports: []
    chip: icestorm

  - id: c-jia-sched-ls-48
    text: >-
      Behind a long-latency op, 58 dependent loads or stores fit before rename stalls, 48 loads (43 stores) of them in
      the schedulable part, so the load/store scheduler holds 48
    loc: p001
    quote: "指令 | 可调度 + 不可调度 | 可调度 ld | 58 | 48 st | 58 | 43"
    method: wong-probe
    derivation: measured
    value: 48
    unit: entries
    supports: [sched_ls.entries]

  - id: c-jia-sched-ls-unified
    text: >-
      Loads and stores reach the same total but differ by 5 in the schedulable part, which Chen tentatively reads as one
      unified load/store scheduler with one non-scheduling queue
    loc: p001
    quote: "load 和 store 总数一样但 Scheduler 差了 5，不确定是测试误差还是什么问题，暂且考虑为一个统一的 Scheduler 和同一个 Non Scheduling Queue"
    method: wong-probe
    derivation: inferred
    value: 1
    unit: queues
    hedge: "暂且考虑为"
    supports: []
    contradicts: [sched_ls.queues]
    notes: Against the four 12-entry queues of c-mh-v1-sched-ls-split-queues.

new_params:
  btb.l0_org: {block: btb, name: Zero-bubble BTB organisation}
  fp_prf.headroom: {block: fp_prf, name: FP/SIMD rename headroom, unit: registers}
  flags_prf.headroom: {block: flags_prf, name: Flags rename headroom, unit: registers}

new_mechanisms:
  fetch_page_split:
    name: Fetch split at page boundaries
    block: fetch
    status: measured
    description: >-
      A fetch that crosses a page boundary takes two cycles, one per page; within a page fetch delivers up to 16
      instructions, one 64 B line, per cycle.
    params: [fetch.width]
    claims: [c-jia-fetch-page-split, c-jia-fetch-line]
    sim_switch: null
    detection_rule: >-
      A loop whose first instruction sits in the last 4 bytes of a page costs one cycle more per iteration than the same
      loop placed within one page.
  l1d_utag_way_predictor:
    name: Virtual-address utag way predictor
    block: l1d
    status: measured
    description: >-
      The L1D picks its way through an 8-bit micro-tag folded by XOR from virtual address bits 47:14, as in AMD's
      linear-address utag scheme, on both core types.
    params: []
    claims: [c-jia-utag]
    sim_switch: null
    detection_rule: >-
      In AMD's utag test, address pairs whose 8-bit XOR folds of bits 47:14 match show the alias slowdown and other
      pairs do not.
  store_address_data_uops:
    name: Store address and store data uops
    block: lsu
    status: inferred
    description: >-
      A store issues as a store-address uop and a store-data uop; Apple's guide gives the P-core up to two of each per
      cycle beside three load uops.
    params: [lsu.stores_per_cycle]
    claims: [c-jia-guide-lsu]
    sim_switch: null
    detection_rule: >-
      A store whose data waits on a long-latency op still issues its address, so a younger load to another address is
      not held behind it.

mechanism_claims:
  l1i_coupled_btb: [c-jia-btb-1024, c-jia-btb-l1i-plateau]
  staged_fetch_redirect: [c-jia-btb-miss-late]
  next_fetch_groups: [c-jia-btb-8b, c-jia-btb-index]
  path_history_shift_xor: [c-jia-ice-phr]
  store_load_dep_predictor: [c-jia-mdp-70]
  sq_partial_forwarding: [c-jia-stlf-overlap, c-jia-stlf-multi]
  lsu_load_to_load_bypass: [c-jia-guide-ptr-chase, c-jia-ptr-chase-3, c-jia-load-use-4]
  exec_forwarding: [c-jia-f2i-both, c-jia-i2f-lsu]
  uop_split_merge: [c-jia-nop-8]
