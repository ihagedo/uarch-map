  - id: c-jia-l1d-lat-3
    text: A pointer chase within the L1D takes 3 cycles per load
    loc: p001
    quote: "可以看到 128KB 出现了明显的拐点，对应的就是 128KB 的 L1 DCache 容量，和官方信息一致。L1 DCache 范围内延迟是 3 cycle"
