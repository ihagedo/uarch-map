  - id: c-jia-ice-l1d
    text: On Icestorm the pointer chase steps at 64 KB, the L1D capacity, with 3 cycles per load inside it and 14 beyond
    loc: p001
    quote: "可以看到 64KB 出现了明显的拐点，对应的就是 64KB 的 L1 DCache 容量，和官方信息一致。L1 DCache 范围内延迟是 3 cycle，之后提升到 14 cycle"
    method: pointer-chase
    derivation: measured
    value: 64
    unit: KiB
    supports: []
