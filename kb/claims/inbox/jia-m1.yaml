  - id: c-jia-guide-a14-dtlb
    text: Apple's optimization guide gives the A14, A15 and M2 P-cores a 256-entry L1 dTLB, against 160 on the M1
    loc: p001
    quote: "除了 M2 Family、A14 Bionic 和 A15 Bionic 的 L1 DTLB 是 256 entries 以外，其余的 M1 Family、M3 Family 到 M4 Family，A16 Bionic 到 A18 Family 的 L1 DTLB 都是 160 entries"
    method: secondhand
    derivation: reported
    value: 256
    unit: entries
    supports: []
    chip: a14
