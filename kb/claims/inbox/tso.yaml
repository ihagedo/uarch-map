# tso.yaml
# Yossi Khayet and Adam Morrison, 2026
# Apple's runtime TSO memory-model mode measured against Arm mode on the M1 and M4.
session: tso
source: asplos26-tso

claims:
  - id: c-tso-entso-bit
    text: >-
      An M-series core switches to x86 TSO ordering when bit 1 (EnTSO) of ACTLR_EL1 is set, which only privileged
      code such as the kernel can do
    loc: p003
    quote: "The memory model can be configured only by code running in a privileged execution level, such as the kernel. ... model is determined by bit #1 (EnTSO) of its auxiliary control register (ACTLR_EL1)"
    method: secondhand
    derivation: reported
    value: "ACTLR_EL1 bit 1 (EnTSO)"
    supports: []
    notes: Background statement without a source. The authors toggle the mode this way on the M1 under Linux and on the M4 under macOS.
  - id: c-tso-rosetta
    text: The TSO mode exists so that code from Apple's Rosetta x86-to-Arm translator runs efficiently
    loc: p003
    quote: "To support efficient execution of binaries created by Apple’s Rosetta x86-to-Arm binary translator [35], an M Series CPU core can be configured to use x86’s TSO memory model"
    method: secondhand
    derivation: reported
    value: true
    supports: []
    notes: Cites Apple's Rosetta documentation, which also supports setting the mode from inside a virtual machine.
  - id: c-tso-m1-prior-specfp
    text: Earlier work found that TSO mode slows multi-threaded SPEC CPU 2017 FP on the M1 by 8.94 % on average
    loc: p002
    quote: "prior work [8, 76] has reported that TSO on the M1 CPU can slow down the SPEC CPU 2017 FP and Geekbench suites by an average of 8.94% and 22%, respectively"
    method: secondhand
    derivation: reported
    value: 8.94
    unit: "%"
    supports: []
    notes: Wrenger et al., 2024.
  - id: c-tso-m1-prior-geekbench
    text: Earlier work found that the M1 scores 22 % lower in Geekbench in TSO mode
    loc: p002
    quote: "prior work [8, 76] has reported that TSO on the M1 CPU can slow down the SPEC CPU 2017 FP and Geekbench suites by an average of 8.94% and 22%, respectively"
    method: secondhand
    derivation: reported
    value: 22
    unit: "%"
    supports: []
    notes: Beck et al. (AtoMig), 2023.
  - id: c-tso-lq-130
    text: An M1 P core keeps about 130 loads in flight
    loc: p003
    quote: "An M1 P core can maintain about 130 loads and 60 stores in flight [39]"
    method: secondhand
    derivation: reported
    value: 130
    unit: entries
    approx: true
    supports: [lq.entries]
    notes: Cites Johnson's Firestorm pages.
  - id: c-tso-sq-60
    text: An M1 P core keeps about 60 stores in flight
    loc: p003
    quote: "An M1 P core can maintain about 130 loads and 60 stores in flight [39]"
    method: secondhand
    derivation: reported
    value: 60
    unit: entries
    approx: true
    supports: [sq.entries]
    notes: Cites Johnson's Firestorm pages.
  - id: c-tso-issue-8
    text: An M1 P core sustains 8 instructions per cycle, against 10 on the M4
    loc: p003
    quote: "M1 and M4 P cores can sustain issuing 8 and 10 instructions per cycle, respectively [36]"
    method: secondhand
    derivation: reported
    value: 8
    unit: instr/cycle
    supports: []
    notes: Cites Apple's CPU optimization guide; the pipeline stage is not named.
  - id: c-tso-cores
    text: The M1 has eight cores, four P and four E
    loc: p007
    quote: "8 (4 P + 4 E) L1D$: 128 KiB, 8-way"
    method: secondhand
    derivation: reported
    value: 4
    unit: cores
    supports: [pcluster.cores]
    notes: Table 1 of the evaluated CPUs, M1 column; no source given.
  - id: c-tso-l1d-128
    text: The M1 P-core L1 data cache is 128 KiB
    loc: p007
    quote: "8 (4 P + 4 E) L1D$: 128 KiB, 8-way"
    method: secondhand
    derivation: reported
    value: 128
    unit: KiB
    supports: [l1d.size]
    notes: Table 1, M1 column; no source given.
  - id: c-tso-l1d-8way
    text: The M1 P-core L1 data cache is 8-way set associative
    loc: p007
    quote: "8 (4 P + 4 E) L1D$: 128 KiB, 8-way"
    method: secondhand
    derivation: reported
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: Table 1, M1 column; no source given. The M4 load-burst test drops past 8 addresses (c-tso-mlp-8).
  - id: c-tso-l2-12mib
    text: The M1 P-cluster L2 is 12 MiB
    loc: p007
    quote: "L1D$: 128 KiB, 8-way L2$ (shared): 12 MiB, 12-way"
    method: secondhand
    derivation: reported
    value: 12
    unit: MiB
    supports: [l2.size]
    notes: Table 1, M1 column; no source given.
  - id: c-tso-l2-12way
    text: The M1 P-cluster L2 is listed as 12-way set associative
    loc: p007
    quote: "L1D$: 128 KiB, 8-way L2$ (shared): 12 MiB, 12-way"
    method: secondhand
    derivation: reported
    value: 12
    unit: ways
    supports: [l2.assoc]
    notes: >-
      Table 1, M1 column; no source given. Handley finds the L2 behaves as three-way with a hashed index
      (c-mh-v2-l2-assoc-hash) and doubts 24-way (c-mh-v2-l2-not-24way).
  - id: c-tso-ice-l1d-8way
    text: The M1 E-core L1 data cache is 64 KiB and 8-way set associative
    loc: p007
    quote: "12-way L1D$: 64 KiB, 8-way L2$ (shared): 4 MiB, 16-way"
    method: secondhand
    derivation: reported
    value: 8
    unit: ways
    supports: []
    chip: icestorm
    notes: Table 1, M1 column; no source given.
  - id: c-tso-ice-l2
    text: The M1 E-cluster L2 is 4 MiB and 16-way set associative
    loc: p007
    quote: "12-way L1D$: 64 KiB, 8-way L2$ (shared): 4 MiB, 16-way"
    method: secondhand
    derivation: reported
    value: 16
    unit: ways
    supports: []
    chip: icestorm
    notes: Table 1, M1 column; no source given.
  - id: c-tso-l1-virt-indexed
    text: The L1 cache of M-series CPUs is virtually indexed
    loc: p011
    quote: "Because the L1 cache in M Series CPUs is virtuallyindexed [78, § 4.1], such accesses suffer from L1 cache set conflicts"
    method: secondhand
    derivation: reported
    supports: []
    notes: Cites the S2C paper on the M1.

  - id: c-tso-m1-simd
    text: >-
      On the M1 P core, cache-hitting loads of more than 16 bytes run over 10x slower in TSO mode than in Arm mode;
      loads of 16 bytes or less are not slowed
    loc: p014
    quote: "On the M1 P core TSO mode, loads of > 16 𝐵 are more than 10× slower than in Arm mode, whereas loads of ≤ 16 𝐵 are not slowed down."
    method: throughput
    derivation: measured
    value: 10
    unit: x
    supports: []
    notes: Loops of 100 M cache-hitting loads of each ldr, ldp and ld1-ld4 variant; 10x is a lower bound.
  - id: c-tso-m4-simd
    text: On the M4 P core every load variant has the same throughput in TSO and Arm modes
    loc: p014
    quote: "In contrast, on the M4, all loads variants have equal throughput in both modes."
    method: throughput
    derivation: measured
    supports: []
    chip: m4
    notes: The M1 slowdown for loads over 16 bytes (c-tso-m1-simd) is gone on the M4.
  - id: c-tso-m1-ffmpeg
    text: >-
      On M1 P cores ffmpeg_x264 runs 25 % slower in TSO mode on one core and about 10 % slower on four, mostly
      from NEON loads of 32 bytes or more
    loc: p009
    quote: "Finally, on M1 P cores, ffmpeg_x264 slows down by 25% in single-core execution and by about 10% in multi-core execution."
    method: throughput
    derivation: measured
    value: 25
    unit: "%"
    supports: []
    notes: Replacing each 32 B vector load with two 16 B loads removes much of the slowdown.
  - id: c-tso-m1-stl
    text: >-
      On M1 P and E cores, as on the M4 P core, a load that needs more bytes than the forwarding store holds runs
      much slower in TSO mode than in Arm mode
    loc: p013
    quote: "on an M4 P core. (M1 P and E core results are qualitatively identical.)"
    method: throughput
    derivation: measured
    supports: []
    notes: The M4 P-core gap is about 5x (c-tso-stl-5x); M1 numbers are not given.
  - id: c-tso-stl-5x
    text: >-
      In TSO mode store-to-load forwarding is as fast as in Arm mode when the load takes all its bytes from the
      store, and about 5x slower when it must also read the cache
    loc: p013
    quote: "STL forwarding in TSO mode is as fast as Arm’s if the load obtains all its data from the store ... but is about 5× slower otherwise, when the load must also access the cache."
    method: throughput
    derivation: measured
    value: 5
    unit: x
    approx: true
    supports: []
    chip: m4
    notes: Loops of 100 M same-address store/load pairs with 4- and 8-byte widths on an M4 P core.
  - id: c-tso-stl-dsb
    text: With a DSB after each store/load pair, every width combination runs at about the same rate in both modes
    loc: p013
    quote: "However, when the STL pairs are serialized by a dsb, all patterns exhibit roughly the same throughput in both modes"
    method: throughput
    derivation: measured
    supports: []
    chip: m4
    notes: That common rate is close to the TSO-mode rate of an 8-byte load from a 4-byte store.
  - id: c-tso-stl-serial
    text: >-
      The authors hypothesize that TSO mode handles partial forwarding pairs one at a time, perhaps waiting for the
      store to reach the L1, though TSO does not require it
    loc: p013
    quote: "We therefore hypothesize that TSO mode serializes partial STL pair handling, possibly because it waits for the store to write to the L1 cache in this case (i.e., disables STL forwarding)."
    derivation: inferred
    hedge: "We therefore hypothesize"
    supports: []
    chip: m4
    notes: Root cause of a 70 % TSO slowdown in fluidanimate built at -O0.

  - id: c-tso-ll-reorder
    text: In TSO mode the M4 still executes independent loads out of order, with the same timing as Arm mode
    loc: p005
    quote: "The pattern’s execution time is identical in Arm and TSO modes, implying that TSO mode executes the loads out of order as in Arm mode."
    method: other
    derivation: measured
    supports: []
    chip: m4
    notes: Each pattern run 1 M times between serializing barriers on M4 P cores; E-core results qualitatively the same.
  - id: c-tso-ll-violation
    text: >-
      With conflicting writes from another core, Arm mode shows TSO-violating results in 99.93 % of runs, while
      TSO mode runs slower, consistent with squash and re-execution
    loc: p005
    quote: "In Arm mode, this results in observable TSO violations (determined by inspecting the values read by the loads) in 99.93% of the executions."
    method: other
    derivation: measured
    value: 99.93
    unit: "%"
    supports: []
    chip: m4
  - id: c-tso-ll-precise
    text: >-
      A lone load whose line is invalidated before it commits, or loads forced into order, run as fast in TSO
      mode as in Arm mode on the M4, where Intel cores squash
    loc: p005
    quote: "The pattern executes with identical timing in the M4 TSO and Arm modes, but incurs TSO violation squashes on the Intel CPU."
    method: other
    derivation: measured
    supports: []
    chip: m4
    notes: Compared with Sapphire Rapids memory-ordering machine clears.
  - id: c-tso-ll-squash-rule
    text: >-
      TSO mode speculatively reorders loads and squashes a load that ran out of order only if its line is
      invalidated from the L1 before it commits
    loc: p005
    quote: "Load–load findings: Apple silicon TSO mode speculatively reorders loads, squashing a load that had executed out of order if its data gets invalidated from the L1 cache."
    derivation: inferred
    supports: []
    chip: m4
    notes: Drawn from M4 timing patterns. Matches the load poison-bit patent Handley describes (c-mh-v3-load-poison).
  - id: c-tso-ss-hits
    text: >-
      Bursts of stores to one L1-resident address run at about two stores per cycle in both modes up to 72
      stores, then one per cycle
    loc: p006
    quote: "Both modes commit about two stores per cycle up to 𝑆 = 72"
    method: throughput
    derivation: measured
    value: 2
    unit: stores/cycle
    approx: true
    supports: []
    chip: m4
    notes: M4 P core. The drop past 72 matches the M4's reported 72-entry store queue.
  - id: c-tso-ss-miss-36
    text: >-
      Bursts of L2-missing stores keep the same rate in both modes up to 36 stores; beyond that TSO mode falls to
      0.007 stores per cycle and Arm mode to 0.05, about 7x apart
    loc: p006
    quote: "Both modes maintain equal throughput up to 𝑆 = 36. Beyond this point, their throughput diverges: TSO mode throughput converges to 0.007 stores per cycle and Arm mode to 0.05 stores per cycle"
    method: throughput
    derivation: measured
    value: 36
    unit: stores
    supports: []
    chip: m4
    notes: M4 P core, stores to random lines of a 64 MB buffer.
  - id: c-tso-ss-mshr-fifo
    text: >-
      The authors read the 36-store knee as 36 store-miss MSHRs, each freed when its store is performed, so TSO
      mode frees them in order and blocks behind the oldest miss
    loc: p006
    quote: "This behavior is consistent with the P core being able to sustain 36 concurrent store misses, with a miss handling register (MSHR) released once the initiating store is performed"
    derivation: inferred
    value: 36
    unit: misses
    hedge: "consistent with"
    supports: []
    chip: m4
    notes: M4 P core; mshr.outstanding is still a hole for the M1.
  - id: c-tso-ss-mix
    text: >-
      Placing each L2-missing store between two L1-hitting stores speeds TSO mode up 12x against 2.93x for Arm
      mode, so TSO mode matches Arm mode up to 80-store bursts
    loc: p007
    quote: "while Arm mode throughput indeed improves by up to 2.93×, TSO mode achieves a 12× improvement. It thus matches Arm mode’s throughput up to 𝑆 = 80"
    method: throughput
    derivation: measured
    value: 12
    unit: x
    supports: []
    chip: m4
    notes: M4 P core; beyond 80 stores TSO mode falls short by at most 33 %.
  - id: c-tso-ss-reorder
    text: >-
      The authors hypothesize the M4 P core performs L1-hitting stores ahead of older L2-missing stores even in
      TSO mode, packing more misses into the store buffer
    loc: p007
    quote: "We hypothesize that the CPU performs L1-hitting stores out of order, ahead of older L2-missing stores, which increases the density of L2-missing stores in the store buffer"
    derivation: inferred
    hedge: "We hypothesize"
    supports: []
    chip: m4
  - id: c-tso-ss-remote
    text: >-
      When another core reads both store targets, TSO-mode store throughput drops 3x on average and up to 5x,
      against 16 % in Arm mode, as if the reordering is switched off
    loc: p007
    quote: "In contrast, TSO mode’s throughput degrades by a more severe harmonic mean of 3× and, for large values of 𝑆, by as much as 5×."
    method: throughput
    derivation: measured
    value: 3
    unit: x
    supports: []
    chip: m4
    notes: A remote reader of only one target has no effect, and less frequent remote reads shrink the loss.
  - id: c-tso-ss-nonspec
    text: >-
      The authors suspect the store reordering is non-speculative, and it appears to reorder only L1-hitting
      stores
    loc: p007
    quote: "Because there is no public information on Apple silicon utilizing post-commit speculation, we suspect that it uses a non-speculative mechanism for store reordering."
    derivation: inferred
    hedge: "we suspect"
    supports: []
    chip: m4
  - id: c-tso-ecore-ss
    text: >-
      M4 E cores show no store reordering in TSO mode: L1-hitting bursts match Arm mode, but every other store
      pattern runs at half the Arm-mode rate
    loc: p007
    quote: "On the E cores, our experiments do not find evidence for store–store reordering. ... for all patterns, Arm mode throughput is consistently 2× better than TSO mode’s."
    method: throughput
    derivation: measured
    value: 2
    unit: x
    supports: []
    chip: m4
    notes: M4 E cores. This explains the 2x TSO slowdown of lbm on M4 E cores.

new_mechanisms:
  tso_mode:
    name: Runtime-selectable TSO memory model
    status: measured
    description: A privileged control bit switches a core to x86-TSO ordering for Rosetta while keeping out-of-order loads.
    params: []
    sim_switch: null
    detection_rule: >-
      with ACTLR_EL1.EnTSO set, cache-hitting loads wider than 16 B run over 10x slower on an M1 P core and an
      8-byte load forwarded from a 4-byte store runs several times slower than with the bit clear

mechanism_claims:
  tso_mode: [c-tso-entso-bit, c-tso-rosetta, c-tso-m1-prior-specfp, c-tso-m1-prior-geekbench, c-tso-m1-simd, c-tso-m4-simd, c-tso-m1-ffmpeg, c-tso-m1-stl, c-tso-stl-5x, c-tso-stl-dsb, c-tso-stl-serial, c-tso-ll-reorder, c-tso-ll-violation, c-tso-ll-precise, c-tso-ll-squash-rule, c-tso-ss-hits, c-tso-ss-miss-36, c-tso-ss-mshr-fifo, c-tso-ss-mix, c-tso-ss-reorder, c-tso-ss-remote, c-tso-ss-nonspec, c-tso-ecore-ss]
  load_poison_bits: [c-tso-ll-squash-rule]
