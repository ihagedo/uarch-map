# gofetch.yaml
# Boru Chen et al., 2024
# The M1 DMP's activation rules, pointer test and filters, re-measured and extended past Augury.
session: gofetch
source: usenix24-gofetch

claims:
  - id: c-gf-firestorm-only
    text: Only the four Firestorm cores of the M1 have the DMP
    loc: p002
    quote: "Most of our experiments were conducted on the Apple M1's 4 Firestorm (performance) cores, which are the only ones to have a DMP."
    derivation: measured
    supports: []
    notes: M1 experiments on a Mac Mini under macOS 13.5.
  - id: c-gf-l1d-8way
    text: Each Firestorm core's 128 KB L1 data cache is 8-way set associative with 64-byte lines
    loc: p002
    quote: "Each Firestorm core has a 128 KByte, 8 way ... L1 data cache with 64 Byte cache lines"
    derivation: inferred
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: Stated as background without a method.
  - id: c-gf-l2-12way
    text: The 12 MB L2 shared by the Firestorm cores is 12-way set associative with 128-byte lines
    loc: p002
    quote: "these 4 Firestorm cores share a 12 MByte, 12 way ... L2 data cache with 128 Byte cache lines"
    derivation: derived
    value: 12
    unit: ways
    supports: [l2.assoc]
    notes: Consistent with the 8192 sets of 128 B the authors enumerate with eviction sets (c-gf-l2-sets). Augury believed 16 ways (c-aug-l2-16way).
  - id: c-gf-l2-sets
    text: The L2 has 8192 sets, indexed by 6 bits of the physical page frame and 7 bits of the page offset
    loc: p009
    quote: "The M1 has 8192 ... L2 cache sets, indexed with 6 (upper) bits from the physical page frame and 7 (lower) bits from the page offset"
    derivation: derived
    value: 8192
    unit: sets
    supports: []
    notes: Appendix A builds 64 eviction sets at a fixed page offset, then all 128 offsets, for 8192 in total.
  - id: c-gf-l2-inclusive
    text: The shared L2 is inclusive of the L1 caches
    loc: p002
    quote: "The shared L2 cache is inclusive of the L1 caches, i.e. every cache line present in the L1 is also present in the L2 [93]."
    method: secondhand
    derivation: reported
    value: inclusive
    supports: [l2.inclusion]
    notes: Cites the S2C paper (Yu et al.), from the same lab.
  - id: c-gf-no-deref-needed
    text: The DMP prefetches pointers beyond the walked range even when the program never dereferences any pointer itself
    loc: p004
    quote: "we deduce that architectural dereferences are not required for the DMP to activate"
    derivation: measured
    supports: []
    notes: Widens Augury's rule that the array's pointers must be dereferenced.
  - id: c-gf-iterate-enough
    text: Merely loading the entries of an array holding valid pointers makes the DMP dereference them, including those inside the walked range
    loc: p004
    quote: "if the aop contains data which can be interpreted as valid pointers, merely iterating over it is sufficient to activate the DMP"
    derivation: measured
    supports: []
  - id: c-gf-one-load
    text: A single load makes the DMP dereference every pointer in the loaded cache line, and one pointer in the line is enough
    loc: p004
    quote: "Even though the program only loads one aop index, other pointers in the same cache line are also brought into the cache."
    derivation: measured
    value: 1
    unit: loads
    supports: []
    notes: Tested with 1 to 8 pointers per line. Augury's three-access threshold (c-aug-min-accesses) applies to reaching past the trained range.
  - id: c-gf-store-no
    text: A store to the line, in place of the load, makes the DMP dereference none of its pointers
    loc: p004
    quote: "Replacing the load with the store instruction, we find that none of pointers in the accessed cache line are dereferenced."
    derivation: measured
    supports: []
  - id: c-gf-l1-fill
    text: The DMP looks for pointers when a line is filled into the L1, and has a history filter and a do-not-scan hint against redundant prefetches
    loc: p004
    quote: "the DMP dereferences pointers specifically on L1 cache fills and features two mechanisms to prevent redundant prefetches: a history filter and a do-not-scan hint"
    derivation: measured
    supports: []
  - id: c-gf-l2-hit
    text: A pointer target fetched by the DMP is then loaded in about 250 cycles, at L2 hit time, against much longer when it was not prefetched
    loc: p004
    quote: "When the pointers are present, a test access (dereference) to one takes ... 250 cycles"
    derivation: measured
    value: 250
    unit: cycles
    approx: true
    supports: []
    notes: Timed with kperf PMC cycle counts around the access; the authors use 300 cycles as the L2 hit cutoff.
  - id: c-gf-once
    text: The DMP reliably dereferences a pointer only once, on the first access to its entry, even after both lines are evicted
    loc: p005
    quote: "We observe that the DMP only reliably dereferences each pointer once, on the first access to its aop entry."
    derivation: measured
    supports: []
  - id: c-gf-filter-128
    text: The DMP re-dereferences a pointer reliably only after 128 other pointers have been seen, which the authors put down to a history filter of about that size
    loc: p005
    quote: "We observe that the DMP only reliably re-activates on ptr when S ≥ 128. This behavior is likely due to the limited capacity of the history filter."
    derivation: derived
    value: 128
    unit: entries
    hedge: "likely"
    supports: [prefetch.dmp_filter_entries]
  - id: c-gf-filter-patent
    text: Apple's content-directed prefetch patent suggests the history filter is a direct-mapped table of 128 or 256 entries
    loc: p005
    quote: "The same patent suggests that this filter may be organized as a direct-mapped 128-entry or 256-entry structure."
    method: patent-reading
    derivation: inferred
    value: 128
    unit: entries
    range: [128, 256]
    supports: []
    notes: US 9,886,385 (Huberty, Meier and Agarwal), the patent Handley cites in c-mh-v2-content-directed.
  - id: c-gf-filter-per-core
    text: The history filter is per core and is cleared when the core sits idle for 100 µs or more
    loc: p005
    quote: "the history filter is a per-core structure and is reset if a core remains idle ... leave the core idle for 100µs or more"
    derivation: measured
    value: 100
    unit: µs
    supports: []
    notes: Moving the test to another core also clears the effect.
  - id: c-gf-l1-half
    text: When an L2 line is filled from DRAM, the DMP scans only the 64-byte half that was accessed, not the other half of the 128-byte line
    loc: p005
    quote: "when filling an L2 cache line from DRAM, the DMP dereferences all pointers in the specific L1 line that is accessed, and not those in the other half of the L2 line"
    derivation: measured
    supports: []
  - id: c-gf-other-half-l2
    text: Accessing one half of a 128-byte L2 line fills that 64-byte half into L1 and L2, while the other half goes only into the L2
    loc: p005
    quote: "the accessed L1 line will be filled into both the L1 and L2 caches, while the other half will only be filled into the L2 cache"
    derivation: measured
    supports: []
    notes: Checked by timing the other half at L2 hit latency. Augury reports two adjacent L1 lines filled together (c-aug-l1-pair-fill).
  - id: c-gf-l2-to-l1
    text: A fill from the L2 into the L1, not only one from DRAM, also triggers the DMP scan
    loc: p005
    quote: "This means that L2 to L1 fills can also activate the DMP."
    derivation: measured
    supports: []
  - id: c-gf-do-not-scan
    text: A line evicted from the L1 alone is not rescanned on refill; only after it leaves the L2 too does the DMP dereference its pointers again, matching a do-not-scan hint the L2 sets on L1 fills
    loc: p006
    quote: "when the aop is also evicted from the L2, the DMP re-dereferences it"
    derivation: measured
    supports: []
    notes: The do-not-scan hint is the patent's mechanism; the authors match it to this behaviour.
  - id: c-gf-4g-region
    text: The DMP follows a pointer only if the pointer and the line holding it lie in the same 4 GB-aligned region, so bits 55 to 32 must match
    loc: p006
    quote: "the DMP only dereferences a pointer if the aop entry and target line are in the same 4 ... region (Figure 6). In other words, that the upper 32 bits of their addresses match"
    derivation: measured
    value: 4
    unit: GiB
    supports: [prefetch.dmp_region]
  - id: c-gf-tbi
    text: The DMP ignores the top 8 bits of a pointer, as with Arm top-byte-ignore; flipping bits 48 to 55 stops the dereference, flipping bits 56 to 63 does not
    loc: p007
    quote: "We conclude that the DMP ignores the upper 8 bits of a pointer when dereferencing it, which matches the “Top-Byte-Ignore” in ARMv8."
    derivation: measured
    supports: []
  - id: c-gf-scan-chunks
    text: The DMP checks each 64-bit-aligned chunk of a filled L1 line as a candidate pointer
    loc: p007
    quote: "The DMP performs the scan by checking each pointer size-aligned chunk (the first 64 bits, second 64 bits, etc.) in the cache line."
    derivation: inferred
    supports: []
    notes: Part of the authors' model; Augury measured the 8-byte alignment rule (c-aug-align-8).
  - id: c-gf-next-line
    text: Besides the pointer's target line, the next line is also found in the L2, which the authors put down to a next-line prefetcher triggered with the DMP
    loc: p007
    quote: "Apart from the target line, we also observe L2 hits to cache lines immediately next to the target line. We hypothesize that this is due to a next-line prefetcher being triggered alongside the DMP"
    derivation: measured
    hedge: "We hypothesize"
    supports: []
  - id: c-gf-two-lines
    text: For each accepted pointer the DMP prefetches two L2 lines, the target and its neighbour, and records both in the history filter
    loc: p007
    quote: "If bits [55:32] match and the pointer is not in the history filter, the DMP attempts to prefetch two L2 lines."
    derivation: inferred
    supports: []
  - id: c-gf-tlb-walk
    text: The DMP looks up the TLB for each candidate pointer, walks the page tables on a miss and inserts the translation
    loc: p007
    quote: "the DMP looks up the translation lookaside buffer (TLB) and triggers page table walks to obtain the physical address corresponding to each candidate pointer"
    method: secondhand
    derivation: reported
    supports: []
    notes: Footnote credits Augury's measurement (c-aug-tlb-fill).

new_params:
  prefetch.dmp_filter_entries: {block: prefetch, name: DMP history filter entries, unit: entries, mechanism: content_directed_prefetch}
  prefetch.dmp_region:         {block: prefetch, name: DMP pointer region (pointer and its line share upper bits), unit: GiB, mechanism: content_directed_prefetch}

mechanism_claims:
  content_directed_prefetch: [c-gf-firestorm-only, c-gf-no-deref-needed, c-gf-one-load, c-gf-store-no, c-gf-l1-fill, c-gf-once, c-gf-filter-128, c-gf-filter-per-core, c-gf-l1-half, c-gf-l2-to-l1, c-gf-do-not-scan, c-gf-4g-region, c-gf-tbi, c-gf-next-line, c-gf-two-lines]
