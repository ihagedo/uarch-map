# pacman.yaml
# Joseph Ravichandran, Weon Taek Na, Jay Lang and Mengjia Yan, 2022
# The M1's TLB hierarchy, cache registers, timers and PAC behaviour under speculation, from the PACMAN attack paper.
session: pacman
source: isca22-pacman

claims:
  - id: c-pac-l1i-ways
    text: The cache configuration registers report a 6-way L1I for the Firestorm cores, with 512 sets of 64 B lines
    loc: p008
    quote: "Level Ways Sets Line Size Total Size L1I 6 512 64 B 192 KB ... Table 2: Cache configurations on M1 obtained via reading system registers."
    method: other
    derivation: documented
    value: 6
    unit: ways
    supports: []
    contradicts: [l1i.assoc]
    notes: Read with a kernel extension. Disagrees with the 12 ways of c-mh-v8-l1i-12way; iLeakage measures 6 (c-ilk-l1i-ways).
  - id: c-pac-l1i-size
    text: The Firestorm L1I is 192 KB according to the cache configuration registers
    loc: p008
    quote: "The private L1 instruction cache , L1 data cache, and shared L2 cache sizes on the p-core side are 192KB, 128KB, and 12MB respectively."
    method: other
    derivation: documented
    value: 192
    unit: KiB
    supports: [l1i.size]
  - id: c-pac-l1i-line
    text: The Firestorm L1I line is 64 bytes according to the cache configuration registers
    loc: p008
    quote: "The cache line size of the L1 data and instruction caches is 64 bytes"
    method: other
    derivation: documented
    value: 64
    unit: B
    supports: [l1i.line]
  - id: c-pac-l1d-ways
    text: The cache configuration registers report an 8-way L1D for the Firestorm cores, with 256 sets of 64 B lines
    loc: p008
    quote: "L1D 8 256 64 B 128 KB ... Table 2: Cache configurations on M1 obtained via reading system registers."
    method: other
    derivation: documented
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: The paper's own eviction test sees half as many ways (c-pac-l1d-assoc-half).
  - id: c-pac-l1d-size
    text: The Firestorm L1D is 128 KB according to the cache configuration registers
    loc: p008
    quote: "The private L1 instruction cache , L1 data cache, and shared L2 cache sizes on the p-core side are 192KB, 128KB, and 12MB respectively."
    method: other
    derivation: documented
    value: 128
    unit: KiB
    supports: [l1d.size]
  - id: c-pac-l1d-line
    text: The Firestorm L1D line is 64 bytes according to the cache configuration registers
    loc: p008
    quote: "The cache line size of the L1 data and instruction caches is 64 bytes"
    method: other
    derivation: documented
    value: 64
    unit: B
    supports: [l1d.line]
  - id: c-pac-l2-ways
    text: The cache configuration registers report a 12-way P-cluster L2 with 8192 sets of 128 B lines
    loc: p008
    quote: "L2 12 8192 128 B 12 MB ... Table 2: Cache configurations on M1 obtained via reading system registers."
    method: other
    derivation: documented
    value: 12
    unit: ways
    supports: [l2.assoc]
  - id: c-pac-l2-size
    text: The L2 shared by the Firestorm cores is 12 MB according to the cache configuration registers
    loc: p008
    quote: "The private L1 instruction cache , L1 data cache, and shared L2 cache sizes on the p-core side are 192KB, 128KB, and 12MB respectively."
    method: other
    derivation: documented
    value: 12
    unit: MiB
    supports: [l2.size]
  - id: c-pac-l2-line
    text: The L2 line is 128 bytes according to the cache configuration registers
    loc: p008
    quote: "the line size of the L2 caches is 128 bytes"
    method: other
    derivation: documented
    value: 128
    unit: B
    supports: [l2.line]
  - id: c-pac-ice-l1i
    text: The Icestorm L1I is 128 KB, 8 ways of 256 sets with 64 B lines, according to the cache configuration registers
    loc: p008
    quote: "L1I 8 256 64 B 128 KB ... Table 2: Cache configurations on M1 obtained via reading system registers."
    method: other
    derivation: documented
    value: 128
    unit: KiB
    chip: icestorm
    supports: []
  - id: c-pac-ice-l1d
    text: The Icestorm L1D is 64 KB, 8 ways of 128 sets with 64 B lines, according to the cache configuration registers
    loc: p008
    quote: "L1D 8 128 64 B 64 KB ... Table 2: Cache configurations on M1 obtained via reading system registers."
    method: other
    derivation: documented
    value: 64
    unit: KiB
    chip: icestorm
    supports: []
  - id: c-pac-ice-l2
    text: The Icestorm cluster's L2 is 4 MB, 16 ways of 2048 sets with 128 B lines, according to the cache configuration registers
    loc: p008
    quote: "L2 16 2048 128 B 4 MB ... Table 2: Cache configurations on M1 obtained via reading system registers."
    method: other
    derivation: documented
    value: 4
    unit: MiB
    chip: icestorm
    supports: []
  - id: c-pac-slc-16
    text: The paper gives the M1's system level cache, a memory-side cache shared by every block on the SoC, as 16 MB
    loc: p008
    quote: "There also exists a 16 MB system level memory-side cache shared across all components on the SoC."
    derivation: reported
    value: 16
    unit: MiB
    supports: []
    notes: >-
      No method or source given, and not part of the register-read table. Disagrees with the 8 MB of c-7cpu-slc-size
      and c-mh-v2-slc-size; 16 MB is AnandTech's A14 figure (c-at-a14-slc).
  - id: c-pac-macos-config
    text: Under macOS 12.2.1 the kernel uses 48-bit virtual addresses, 16-bit PACs and 16 KB pages
    loc: p008
    quote: "The macOS 12.2.1 kernel uses 48-bit virtual addresses and 16-bit PACs with 16KB pages."
    derivation: reported
    value: 16
    unit: KiB
    supports: [dtlb.page_size]
    notes: Stated without a method. The attack's brute force over PAC values 0x0 to 0xFFFF finds the correct kernel PAC, in line with 16-bit PACs.
  - id: c-pac-cntpct-24mhz
    text: The system counter CNTPCT_EL0 is shared by all cores, readable at EL0 by default, and runs at 24 MHz according to CNTFRQ_EL0
    loc: p007
    quote: "a system counter, CNTPCT_EL0, which is shared by all cores and is accessible from EL0 by default ... 24 MHz according to the Counter-timer Frequency register (CNTFRQ_EL0)"
    method: other
    derivation: documented
    value: 24
    unit: MHz
    supports: []
    notes: Checked on macOS Big Sur 11.5. Too coarse for cache or TLB timing, so the paper builds a counting-thread timer for the attack.
  - id: c-pac-no-pmccntr
    text: The M1 does not implement the standard ARM PMU, so the PMCCNTR_EL0 cycle counter is unavailable at every privilege level
    loc: p007
    quote: "the M1 SoC does not use the standard ARM PMU, so this counter is unavailable on M1 at any privilege level"
    derivation: measured
    supports: []
  - id: c-pac-pmc0-pmc1
    text: >-
      Apple's own counter registers include PMC0 (S3_2_c15_c0_0), counting cycles, and PMC1 (S3_2_c15_c1_0), counting
      instructions, readable only in the kernel by default
    loc: p007
    quote: "PMC0 (S3_2_c15_c0_0) counts cycles and PMC1 (S3_2_c15_c1_0) counts instructions ... these counters are only accessible in the kernel"
    method: vendor-doc
    derivation: documented
    supports: []
    notes: Taken from Apple's XNU kernel source (monotonic_arm64.c).
  - id: c-pac-pmcr0-el0
    text: Setting the counter control register PMCR0 (S3_1_c15_c0_0) from a kernel extension makes PMC0 readable from user space
    loc: p007
    quote: "configure the performance counter control register PMCR0 (S3_1_c15_c0_0) and make PMC0 readable from userspace"
    derivation: measured
    supports: []
    notes: The paper's latency figures in its reverse engineering come from PMC0 read this way.
  - id: c-pac-pcore-speculation
    text: The performance cores gave a more reliable attack surface than the efficiency cores, which the authors put down to more speculation
    loc: p007
    quote: "We target our attack on the performance cores, which have provided a more reliable attack surface due to a higher degree of speculation."
    derivation: inferred
    supports: []

