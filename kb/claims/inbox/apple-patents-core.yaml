# apple-patents-core.yaml
# Apple, 2016-2020
# Apple core patents on store commit pointers, banked load and store queues, a two-level reservation station, AMX memory ordering and a write-combining buffer.
session: apple-patents-core

claims:
  - id: c-pat-us10628164b1-commit-candidate
    source: us10628164b1
    text: The load-store unit keeps a commit-candidate pointer to the oldest store in the store queue that may not yet write the data cache
    loc: p015
    quote: "the given store instruction is an oldest store instruction not currently permitted to commit to an external data cache"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018. A store is held back while it sits on the speculative path of a branch, an unresolved system instruction or an exception being handled.
  - id: c-pat-us10628164b1-map-pointer
    source: us10628164b1
    text: The mapping unit sends the load-store unit a pointer to the oldest instruction among branches not yet dispatched and system instructions not yet resolved
    loc: p015
    quote: "the first instruction is an oldest instruction of non-dispatched branches and unresolved system instructions"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018. The patent describes such a pointer; the HID1 bit DIS_BR_DISP_SYS_RSLVD_PTR that m1n1 names may disable it.
  - id: c-pat-us10628164b1-exec-pointer
    source: us10628164b1
    text: >-
      The execution unit sends the load-store unit a pointer to the oldest unresolved issued branch directly, not
      through the mapping unit, which shortens the decision that a store is no longer speculative
    loc: p009
    quote: "Since the execution unit sends the second pointer to the load store unit, rather than send it to the mapping unit located multiple prior pipeline stages away"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018.
  - id: c-pat-us10628164b1-commit-rule
    source: us10628164b1
    text: >-
      Once the commit-candidate store is older than both pointers it is no longer speculative and may write the data
      cache, and the pointer moves on to the next younger store in the store queue
    loc: p015
    quote: "in response to determining the given store instruction is the oldest instruction, update the commit candidate pointer to identify an oldest store instruction that is younger than the given store instruction"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018. The gate is speculation, judged from older branches, system instructions and exceptions.
  - id: c-pat-us10628164b1-group-numbers
    source: us10628164b1
    text: The pointers are group numbers that travel with each instruction down the pipeline and rise in program order, so comparing two of them gives relative age
    loc: p011
    quote: "is a group number or group identifier sent with information corresponding to a respective instruction throughout the processor pipeline ... pointers are assigned as group numbers in an ascending order to instructions in program order"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018.

  - id: c-pat-us10133571b1-two-banks
    source: us10133571b1
    text: The load queue and the store queue are each split into two banks that software still sees as one queue, each bank with its own pointer logic
    loc: p011
    quote: "LSU 18 includes a load queue ... different banks, and a store queue, also having two separate banks"
    method: patent-reading
    derivation: inferred
    value: 2
    unit: banks
    supports: []
    notes: Priority 2016. Banking is said to allow larger queues with less impact on timing.
  - id: c-pat-us10133571b1-one-per-bank
    source: us10133571b1
    text: The banks exchange pointer information, and each bank may put out one entry a cycle for retirement
    loc: p001
    quote: "Based on the pointer information that is exchanged, each bank may output (e.g., for retirement) one entry per cycle."
    method: patent-reading
    derivation: inferred
    value: 1
    unit: entries/cycle per bank
    supports: []
    notes: Priority 2016.
  - id: c-pat-us10133571b1-lq-interleave
    source: us10133571b1
    text: Load-queue entries alternate between the banks, even entries in bank 0 and odd entries in bank 1
    loc: p012
    quote: "with even numbered entries being stored in Bank 0 and odd numbered entries being stored in Bank 1"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2016.
  - id: c-pat-us10133571b1-lq-eligibility
    source: us10133571b1
    text: Each load-queue bank keeps a retirement-eligibility pointer, and a bank retires an entry only when it is older than the eligibility pointers of both banks
    loc: p015
    quote: "entries that are older than entries indicated by both of the first and second eligibility pointers"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2016. Each bank also keeps a dequeue pointer to its next entry to leave.
  - id: c-pat-us10133571b1-same-address
    source: us10133571b1
    text: The bank pointer logic makes two loads to the same address leave the load queue in order
    loc: p012
    quote: "if two different loads have the same address, the pointer logic units 220 and 221 may ensure that these instructions are retired/dequeued in order"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2016.
  - id: c-pat-us10133571b1-resolve-pointer
    source: us10133571b1
    text: Each bank's resolve pointer marks its oldest entry still lacking an address translation, and the load queue starts TLB or page-table accesses from those pointers
    loc: p012
    quote: "Load Queue may initiate accesses to a translation lookaside buffer (TLB) or page table based on the position of the resolved pointers"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2016.
  - id: c-pat-us10133571b1-sq-contiguous
    source: us10133571b1
    text: Store-queue banks are not interleaved; each holds a contiguous run of stores, and one bank's run leaves in order and completely before the other bank's run starts
    loc: p012
    quote: "the group of store instructions in one of the banks are dequeued fully before proceeding to retire any of the store instructions in the other bank"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2016. Bank 0 holds entries 0 to n/2-1 and bank 1 entries n/2 to n-1.
  - id: c-pat-us10133571b1-sq-refill
    source: us10133571b1
    text: While one store-queue bank drains, the other fills with new stores, and retiring stores in contiguous runs keeps memory updates in program order
    loc: p012
    quote: "while store instructions are being dequeued from one of the banks, the other bank may concurrently be filled with store instructions"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2016.
  - id: c-pat-us10133571b1-issued-entries
    source: us10133571b1
    text: The load and store queues receive loads and stores as the fetch, decode, map and issue unit issues them, and hold them once executed
    loc: p011
    quote: "coupled to receive load and store instructions, respectively, issued by FDMI unit 12"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2016. Fits allocation at issue, but the text does not say whether entries are reserved earlier.

  - id: c-pat-us10452434b1-two-buffers
    source: us10452434b1
    text: A reservation station holds ops in a primary and a secondary buffer, and every op in the primary buffer outranks every op in the secondary one
    loc: p013
    quote: "include at least a primary buffer and a secondary buffer, each for storing ops. In various embodiments, each op stored in the primary buffer has a higher priority than any op stored in the secondary buffer"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017. Priority comes from program-order age, an assigned level, a thread or a process. The HID16 bit EnRs4Sec (Enable RS4 Sec) may name such a secondary buffer.
  - id: c-pat-us10452434b1-separate-pick
    source: us10452434b1
    text: Each buffer has its own pick and readiness logic working without the other buffer's contents, so the station can grow without lengthening the cycle
    loc: p014
    quote: "Separate control logic selects ops for issue among N ops stored in the primary buffer based on priority. This control logic performs this selection independent of the data stored in the secondary buffer."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017.
  - id: c-pat-us10452434b1-fill-width
    source: us10452434b1
    text: Ready ops picked in the primary buffer issue first, and ready ops picked in the secondary buffer fill the issue slots left, so a secondary op can issue ahead of unpicked primary ops
    loc: p017
    quote: "issue width is 4, the first number of ops selected in the primary buffer is 3 ... all 3 of the selected ops in the primary buffer are issued and 1 of the 2 ops in the secondary buffer is issued"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017. The numbers are the patent's example.
  - id: c-pat-us10452434b1-staging
    source: us10452434b1
    text: When the secondary buffer sits farther away, its picks pass a pipeline stage before the primary buffer's issue select takes them, a cycle late
    loc: p015
    quote: "A single stage boundary delays by one clock cycle selection for issue"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017. With the buffers close together there may be no stage.
  - id: c-pat-us10452434b1-transfer
    source: us10452434b1
    text: The highest-priority ops of the secondary buffer move up to the primary buffer as room frees, ready or not
    loc: p013
    quote: "the number of ops to transfer includes ops with a highest priority among the ops stored in the secondary buffer, although the source operands may not yet be ready"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017. The example moves three ops a cycle and issues up to three.
  - id: c-pat-us10452434b1-cancel
    source: us10452434b1
    text: An op that issues from the secondary buffer while it is being moved has its move cancelled, so it does not issue twice
    loc: p013
    quote: "the control logic cancels, or invalidates, the transfer of a given op from the secondary buffer to the primary buffer in response to determining that the given op has issued"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017.
  - id: c-pat-us10452434b1-dispatch-credit
    source: us10452434b1
    text: Each reservation station tells the dispatch unit how many ops to send, as free entries or credits, and the dispatch unit need not know the station has two buffers
    loc: p013
    quote: "The dispatch unit receives the indication with the value, but the dispatch unit may not be aware of separate buffers"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017. The count may cover only entries freed in the last cycle.
  - id: c-pat-us10452434b1-dispatch-types
    source: us10452434b1
    text: Dispatch buffers take ops by type (integer, load/store, floating point), and one dispatch buffer may feed two reservation stations
    loc: p012
    quote: "each dispatch buffer 120 may be coupled to two separate reservation stations 122 ... instruction operations may be captured by the dispatch buffers 120A-120N based on the type of instruction operation"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017. Each reservation station feeds one execution unit in the main embodiment.
  - id: c-pat-us10452434b1-age-matrix
    source: us10452434b1
    text: The buffers may be non-shifting, with an age matrix giving relative age and entries allocated at random
    loc: p017
    quote: "is a non-shifting structure with an age matrix ... Entries in the buffers 510 and 540 may be randomly allocated."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017. A shifting buffer is the alternative embodiment.
  - id: c-pat-us10452434b1-latency-wakeup
    source: us10452434b1
    text: An issuing op wakes its dependents with its execution latency, so they can issue just in time to catch its result on the bypass
    loc: p016
    quote: "Each issued op that writes a register wakes up its true dependent ops ... The execution latency information is used for just-in-time issue for the younger data dependent ops."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2017.

  - id: c-pat-us10776125b2-region-table
    source: us10776125b2
    text: >-
      The CPU's load-store unit keeps a memory ordering table of regions with coprocessor loads or stores issued but not
      complete, and CPU loads and stores to those regions wait until they complete
    loc: p001
    quote: "track at least one memory region within which there are outstanding coprocessor load/store memory operations ... The CPU processor may delay CPU load/store operations until the outstanding coprocessor load/store operations are complete."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018. The source of c-mh-v3-amx-ordering-table.
  - id: c-pat-us10776125b2-16k-region
    source: us10776125b2
    text: A region is large, such as one 16 KiB page, so the table matches on the page address and may flag accesses that do not overlap, which is rare enough to accept
    loc: p017
    quote: "if a page size of 16 kilobytes is used, the least significant 14 bits of the address"
    method: patent-reading
    derivation: inferred
    value: 16
    unit: KiB
    supports: []
    notes: Priority 2018. Other embodiments use a cache line, part of a page or several pages.
  - id: c-pat-us10776125b2-count
    source: us10776125b2
    text: Each table entry holds a region address and a count of outstanding coprocessor operations, raised as each issues from the store queue and lowered as each completes; the entry is freed at zero
    loc: p017
    quote: "a count that may be incremented for each outstanding operation and decremented for each completed operation. When the count is reduced to zero, the region may be deallocated"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018.
  - id: c-pat-us10776125b2-l2-ack
    source: us10776125b2
    text: The table entry number travels with the coprocessor operation as a completion ID, and the L2 returns it once it has completed the access
    loc: p017
    quote: "The L2 cache 14 may complete the coprocessor load/store operation ... and may return the completion ID with"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018. Agrees with c-mh-v3-amx-l2-id-release.
  - id: c-pat-us10776125b2-load-replay
    source: us10776125b2
    text: A CPU load that hits a table region cancels its forwarding, waits in the load queue tagged with the entry number, and runs again when that entry is freed
    loc: p017
    quote: "The LDQ 44 may permit the load to be reexecuted once the deallocation ID matching the load's ID is received."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018.
  - id: c-pat-us10776125b2-store-head
    source: us10776125b2
    text: A CPU store checks the table only when it is the oldest in the store queue, and a hit holds it there until the region's entry is freed
    loc: p018
    quote: "Since the CPU store operation is performed when it is oldest in the STQ 42 in this embodiment, there is one case: the CPU store operation hits the memory ordering table 40."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018.
  - id: c-pat-us10776125b2-cop-stall
    source: us10776125b2
    text: >-
      A coprocessor load or store at the head of the store queue waits while an older CPU load to its region is in the
      load queue, while a non-cacheable store or store miss is in the core interface, or while a region count nears its
      maximum or the table is full
    loc: p019
    quote: "if there is a non-cacheable store in the CIF 34 (or a store miss in the CIF 34), or if there is a region count in the memory ordering table 40 that is reaching its maximum"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018. It also waits until older branches and exception-causing instructions resolve.
  - id: c-pat-us10776125b2-flush-younger
    source: us10776125b2
    text: A coprocessor load or store searches the load queue by region, and younger CPU loads to that region that already forwarded data are flushed
    loc: p019
    quote: "The CAM of the LDQ 44 may detect any younger CPU load operations to the same memory region that have forwarded data, causing the younger CPU load operations to be flushed"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018.
  - id: c-pat-us10776125b2-agu-translate
    source: us10776125b2
    text: Coprocessor loads and stores get their addresses generated and translated in the CPU's AGU and TLB, so the CPU knows them before sending the operations on
    loc: p014
    quote: "allowing the addresses accessed by the coprocessor load/store operations to be known prior to issuance of the coprocessor load/store"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018.
  - id: c-pat-us10776125b2-via-stq
    source: us10776125b2
    text: Coprocessor operations pass through the store queue like stores and leave it for the coprocessor only when no longer speculative
    loc: p016
    quote: "Since coprocessor operations are passed through the STQ 42, they may be non-speculative when issued from the STQ 42"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Priority 2018. They go to the coprocessor through the core interface (CIF).

new_mechanisms:
  banked_lsq:
    name: Two-bank load and store queues
    block: lsu
    status: speculative
    description: >-
      The load queue interleaves its entries over two banks, and the store queue fills one bank with a contiguous run of
      stores while the other drains in order; each bank retires one entry a cycle under pointers the banks exchange.
    params: []
    claims: [c-pat-us10133571b1-two-banks, c-pat-us10133571b1-one-per-bank, c-pat-us10133571b1-lq-interleave,
      c-pat-us10133571b1-lq-eligibility, c-pat-us10133571b1-same-address, c-pat-us10133571b1-resolve-pointer,
      c-pat-us10133571b1-sq-contiguous, c-pat-us10133571b1-sq-refill]
    sim_switch: null
    detection_rule: >-
      Draining the load or store queue would top out at one entry per bank per cycle, two in all, however many entries
      are ready to leave.
  hierarchical_reservation_station:
    name: Two-level reservation station
    block: sched_int
    status: speculative
    description: >-
      A scheduler queue holds its highest-priority ops in a primary buffer and the rest in a secondary buffer, each picked
      by its own logic; secondary picks fill issue slots the primary leaves empty, and the oldest secondary ops move up
      as room frees.
    params: []
    claims: [c-pat-us10452434b1-two-buffers, c-pat-us10452434b1-separate-pick, c-pat-us10452434b1-fill-width,
      c-pat-us10452434b1-staging, c-pat-us10452434b1-transfer, c-pat-us10452434b1-cancel]
    sim_switch: null
    detection_rule: >-
      With the front of a queue full of stalled old ops, a young independent op further back would still issue, but
      perhaps a cycle later than an op near the front.

mechanism_claims:
  lsq_early_release: [c-pat-us10628164b1-commit-candidate, c-pat-us10628164b1-map-pointer, c-pat-us10628164b1-exec-pointer,
    c-pat-us10628164b1-commit-rule, c-pat-us10628164b1-group-numbers]
  lsq_at_issue: [c-pat-us10133571b1-issued-entries]
  dispatch_buffers: [c-pat-us10452434b1-dispatch-credit, c-pat-us10452434b1-dispatch-types]
  matrix_scheduler: [c-pat-us10452434b1-age-matrix, c-pat-us10452434b1-latency-wakeup]
  coprocessor_ordering_table: [c-pat-us10776125b2-region-table, c-pat-us10776125b2-16k-region, c-pat-us10776125b2-count,
    c-pat-us10776125b2-l2-ack, c-pat-us10776125b2-load-replay, c-pat-us10776125b2-store-head,
    c-pat-us10776125b2-cop-stall, c-pat-us10776125b2-flush-younger]
  amx_lsu_issue: [c-pat-us10776125b2-agu-translate, c-pat-us10776125b2-via-stq]
