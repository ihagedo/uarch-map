# handley-vol3-soc.yaml
# Maynard Handley, 2025
# Clocks, power states and other SoC blocks as the CPU sees them (AArch64-Explore vol 3).
session: handley-vol3-soc
source: handley-vol3

claims:
  - id: c-mh-v3-fabric-100gbs
    text: >-
      With 32 B data paths and a fabric clocked near the CPU (about 3 GHz), one cluster gets about 100 GB/s
      to DRAM, which is what M1 Pro/Max with LPDDR5 show
    loc: p138
    quote: "the fabric can run at up to CPU GHz (so 3GHz or so) ... the data paths are 32B wide That gets us ~100GB/s read or write from DRAM to a cluster"
    derivation: inferred
    value: 100
    unit: GB/s
    approx: true
    hedge: "if we assume"
    supports: []
    chip: m1max
    notes: He names the M2 alongside the M1 Pro/Max; a Pro or Max does better with both P clusters or the GPU
  - id: c-mh-v3-l2-link-combined
    text: >-
      The core-to-L2 connection looks like a traditional bus with address and data sent together, not the
      split address and data buses of the fabric
    loc: p139
    quote: "Right now the CPU↔L2 connection certainly looks something like a traditional type connection with simultaneous address and data transfers"
    derivation: inferred
    hedge: "looks something like"
    supports: []
    notes: He suggests a split bus would let address-only traffic (coherence, DC ZVA, AMX requests) share the second data beat
  - id: c-mh-v3-dram-half-clock
    text: >-
      Per a 2016 patent, the memory controller and DRAM run at half clock during periods of low activity,
      the same trick already used in the CPU
    loc: p140
    quote: "The answer is one we have already seen used in the CPU: halve the clock (to Controller and DRAM) during periods of low activity"
    method: patent-reading
    derivation: inferred
    value: 2
    unit: clock divider
    supports: []
  - id: c-mh-v3-dram-pstate-interval
    text: >-
      Per a 2019 patent, the memory controller considers changing the DRAM performance state at intervals from
      50 µs to 20 ms
    loc: p141
    quote: "the memory controller considers changing the DRAM p-state (energy saving state/frequency) at anything from 50µs to 20ms"
    method: patent-reading
    derivation: inferred
    value: 10.025
    range: [0.05, 20]
    unit: ms
    hedge: "I guess are at least approximately correct"
    supports: []
    notes: The same patent puts DRAM calibration at about every 200 ms and keeps the old calibration across p-state changes
  - id: c-mh-v3-m1-one-mc-unit
    text: >-
      The M1 has a single memory controller and coherence unit, against four on the M1 Max and eight on the
      M1 Ultra
    loc: p143
    quote: "grow from an M1 with a single such Memory Controller/Coherence unit to a Max with four such units and an Ultra with eight"
    method: patent-reading
    derivation: inferred
    value: 1
    unit: units
    supports: []
    notes: From a 2018 patent that splits coherence checking, SLC and memory controller into address-hashed units
  - id: c-mh-v3-l2-modified-copy
    text: >-
      When one core reads a line that another core in the same cluster has modified, the L2 copies the line
      across, leaving two identical modified copies (MOESI) with no trip to the coherence point
    loc: p146
    quote: "I believe the L2 will handle the transaction, and the (modified) line will be copied from the one CPU to the other, so that now two modified (but identical) copies exist in the cluster"
    derivation: inferred
    hedge: "I believe"
    supports: []
  - id: c-mh-v3-cpu-qos-toggle
    text: >-
      The CPU's memory requests switch between low-latency and bulk priority according to how many outstanding
      requests the L2 has queued
    loc: p157
    quote: "We've seen heuristics for the CPU to try to toggle between low latency and bulk priority depending on how many outstanding requests the L2 has queued up"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-bulk-plus
    text: >-
      Per a 2018 patent, CPU and GPU traffic gets a third class, bulk plus, which the memory controller upgrades
      to low latency when it has more queue credits free than expected
    loc: p157
    quote: "So in essence the CPU and GPU now get three quality classes of bulk, “bulk plus”, and low latency."
    method: patent-reading
    derivation: inferred
    value: 3
    unit: classes
    supports: []
  - id: c-mh-v3-cluster-one-requester
    text: >-
      Each CPU cluster attaches to the main NoC as one requester, with its own local interconnect linking its
      cores, the L2, AMX and other cluster resources
    loc: p168
    quote: "a hierarchy of the primary NoC feeding to each cluster (eg one E and two P clusters) as a single ... only to have that cluster in turn have a local interconnect communicating between say four cores, L2, AMX"
    derivation: inferred
    hedge: "say"
    supports: []
  - id: c-mh-v3-noc-request-128b
    text: The standard NoC and memory request width is 128 B
    loc: p172
    quote: "generates memory requests for the NoC 128B wide (the standard NoC/memory request width)"
    method: patent-reading
    derivation: inferred
    value: 128
    unit: B
    supports: []
    notes: Stated for a 2020 DMA patent; it matches the 128 B L2 line
  - id: c-mh-v3-cpu-l2-scale-together
    text: >-
      Per a 2010 patent, performance states move the CPU, its L2 and perhaps the bus interface together, so no
      part runs faster or slower than the rest needs
    loc: p174
    quote: "if we slow down the CPU we also slow down the L2 cache and maybe the bus interface"
    method: patent-reading
    derivation: inferred
    hedge: "maybe"
    supports: []
  - id: c-mh-v3-apsc-dpe
    text: >-
      Per a 2013 patent, each CPU complex has an automatic power state controller, which limits how many cores
      may run at a given voltage and frequency, and a digital power estimator
    loc: p177
    quote: "an addition to each complex of two important elements, the APSC (automatic power state controller) and the DPE (digital power estimate) ... The APSC controls things like how how many CPUs can be powered up at a particular voltage"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: The purpose is to keep peak draw within what the battery can supply, not to save energy
  - id: c-mh-v3-core-powerup-10us
    text: >-
      Powering up another core takes up to 10 µs, and during the transition the effective clock of the CPUs is
      halved to avoid overload spikes
    loc: p177
    quote: "when a new core is powered up (a process that takes up to 10 µs), there's a concern ... the effective clocks to the CPUs are halved"
    method: patent-reading
    derivation: inferred
    value: 10
    unit: µs
    supports: [pcluster.core_powerup]
    notes: From the same 2013 patent as the power state controller; an upper bound
  - id: c-mh-v3-dpe-throttle
    text: >-
      Per a 2013 patent, the digital power estimator takes per-core counts of costly events such as vector
      instructions per cycle, forms a per-core power estimate and sends per-core throttle requests
    loc: p178
    quote: "It receives ongoing counts from each CPU of \"significant\" events, eg how many vector ... executed per cycle, aggregates these to a per-CPU instantaneous power estimate, and sends per-CPU throttle requests as necessary."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: A 2011 forerunner tracked SIMD intensity over roughly the last 128 cycles and blocked an occasional SIMD issue
  - id: c-mh-v3-hw-dvfs
    text: >-
      Apple's hardware DVFS is probably this loop: sustained excess in the power estimate lowers the offending
      core's frequency and voltage, and a spell within budget lets them rise again
    loc: p179
    quote: "I assume this, essentially, is what Apple has meant by saying they perform DVFS is hardware as opposed to having an OS driver make these modifications"
    method: patent-reading
    derivation: inferred
    hedge: "I assume"
    supports: []
  - id: c-mh-v3-voltage-margin-recovery
    text: >-
      Per a 2014 patent, when the estimator sees a core drawing much less power than budgeted (such as
      integer-only code), its voltage may drop at the same frequency or its frequency may rise at the same voltage
    loc: p179
    quote: "if the DPE detects a pattern of substantially lower estimated power than has been budgeted for ... the voltage for that core is allowed to drop slightly (while maintaining frequency), or frequency is allowed to rise while maintaining voltage"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-energy-credits
    text: >-
      Per 2016 patents, cores spend from a pool of energy credits; as credits run low, a pseudo-random draw
      against the remaining credits decides each cycle whether an instruction may execute
    loc: p183
    quote: "making it probabilistic, as your credits run low, whether an instruction is allowed to execute in this cycle or not. A random or pseudo-random value is compared to the credits available, and if smaller, execution can proceed."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: The random draw staggers throttling across cores to avoid current spikes. A later 2016 patent lets the P and E complexes pass unused credits to each other
  - id: c-mh-v3-l2-slc-throttle
    text: >-
      Per a 2019 patent, the energy-credit scheme also tracks the L2s and the SLC and can throttle them like the
      cores, freezing one for a cycle at random
    loc: p183
    quote: "2019 adds a slight additional flexibility to this by also tracking the energy usage of the L2's and SLC's and, if appropriate occasionally throttling them in the same way as the cores, by probabilistically freezing it for a cycle."
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-clock-dither
    text: >-
      Clock dither, for very short pauses, gives a small section of the CPU only every 4th or 8th clock pulse;
      clock control is full clock gating
    loc: p185
    quote: "Clock Dither is Apple's term for very short pauses, when say a small section of the CPU is only given every 4th or 8th clock pulse"
    method: patent-reading
    derivation: inferred
    value: every 4th or 8th pulse
    hedge: "say"
    supports: []
    notes: From a 2017 power-management patent whose time scales run from clock dither through clock gating and sleep to thermal DVFS
  - id: c-mh-v3-freeze-levels
    text: >-
      Power is managed at several levels: per core, cycle by cycle freezing of SIMD pipelines; per cluster,
      cycle by cycle freezing of cores and cache; and slower temperature-driven DVFS
    loc: p189
    quote: "Within each core more fine-grained allocation is deciding cycle by cycle whether to freeze one or more of the SIMD pipelines; meanwhile at the level of an entire cluster, we're deciding cycle by cycle whether to freeze cores and cache"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-simd-power-down
    text: >-
      Per a 2016 patent, after a long stretch without SIMD use the SIMD register state moves to a slow low-leakage
      store and the SIMD unit is powered off; the next SIMD instruction first reverses this
    loc: p192
    quote: "we move the SIMD state out of registers to the low-leakage store and cut power to the SIMD unit. On encountering a SIMD instruction we reverse the process"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: State shared with the integer side (he thinks the flags) is kept in both units, so only the copy back to the SIMD side is needed on power-up
  - id: c-mh-v3-idle-clock-quarter
    text: >-
      Per 2011 and 2012 patents, a core stalled on a DRAM load or waiting for an event is not stopped but clocked
      slowly, one pulse in four, which keeps it alert to interrupts and bus activity
    loc: p198
    quote: "the Apple solution is, under these conditions, not to freeze the CPU clock, but to run it more slowly (say at one “CPU” clock transition every four “real” transitions)"
    method: patent-reading
    derivation: inferred
    value: 4
    unit: clock divider
    hedge: "say"
    supports: []
    notes: A 2016 update sends one immediate pulse when an event arrives, instead of waiting up to 3 or 7 cycles for the next slow pulse
  - id: c-mh-v3-pll-divider-ramp
    text: >-
      Per a 2014 patent, a frequency change runs through a programmable divider: the PLL is retargeted with the
      divider at 4, then the divider steps down to 1, so the core never sees an overshooting clock
    loc: p200
    quote: "divide the frequency by 4 at the same time that we switch the PLL ... change the clock divider to 3, then 2, then finally 1, and ramp the clock increase"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: His 2 to 3 GHz example is illustrative. The divider also has fractional steps (2, 3/2, 4/3, 1) for a smoother ramp and limited inductive current
  - id: c-mh-v3-cluster-one-freq
    text: >-
      All cores of a cluster share one clock frequency: some cores can sit idle, but two cannot run fast while two
      run slow
    loc: p207
    quote: "clusters run at a fixed frequency. So we can, eg, use three cores of a 4-core cluster, but we can't run two of the cores as fast as possible and two as slow as possible"
    method: patent-reading
    derivation: inferred
    value: per cluster
    supports: [pcluster.clock_domain]
    notes: Given as a constraint on the 2017 cluster-aware scheduler for the A11 and later
  - id: c-mh-v3-control-effort
    text: >-
      Per a 2017 scheduler patent, each thread group gets a control effort between 0 and 1 that maps to a cluster
      type (P or E) and a DVFS level for that cluster, then capped by thermal and power limits
    loc: p208
    quote: "will result in a control effort, a number between 0 and 1, which is mapped to a cluster (P vs E) and a DVFS level for that cluster"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-ecores-for-os
    text: >-
      The OS runs its kernel tasks, daemons, utility work and probably most interrupt handling on the E cores;
      P cores are for developer code
    loc: p210
    quote: "the OS tries to run its kernel tasks, its demons and various utility work, and even, I believe, most interrupt handling, on E cores"
    derivation: inferred
    hedge: "I believe"
    supports: []
    chip: icestorm
  - id: c-mh-v3-m1-ecore-1ghz
    text: The base M1 has four E cores so OS work can spread across them at low frequency, around 1 GHz
    loc: p210
    quote: "The low power devices provide 4 E cores primarily so that they can run those cores at low frequency, and so get the OS work done over multiple cores, running at around 1GHz"
    derivation: inferred
    value: 1
    unit: GHz
    approx: true
    supports: []
    chip: icestorm
    notes: A typical operating point for background work, not the maximum E-core clock
  - id: c-mh-v3-m1pro-ecore-2ghz
    text: >-
      M1 Pro and Max run one E core at 1 GHz when OS work is light, and boost both E cores to 2 GHz once two or
      more tasks need them
    loc: p210
    quote: "The higher power devices (Pro, Max, ...) run a single E core at 1 GHz ... as soon as there are two or more tasks ... the 2 E cores are boosted to 2GHz"
    derivation: inferred
    value: 2
    unit: GHz
    supports: []
    chip: m1max
    notes: Also covers the M1 Pro. He reads this as matching the OS throughput of the base M1's four E cores
  - id: c-mh-v3-amx-via-lsu
    text: >-
      Per a 2016 patent, AMX is one coprocessor per cluster; its instructions pass through the core's load/store
      pipeline, and AMX loads and stores are translated by the core's TLB
    loc: p211
    quote: "a coprocessor that's associated with a cluster as a whole ... these instructions flow through the load/store pipeline. Some of them are AMX loads or stores, and these are translated by the TLB"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: He expects AMX loads and stores that cross a page to need two TLB lookups and fall to microcode
  - id: c-mh-v3-amx-from-l2
    text: >-
      AMX loads and stores go to the L2, so AMX reaches data in a core's L1 more slowly than data already in the
      L2, since L1 lines must first move to the L2
    loc: p212
    quote: "AMX appears to draw its data from the L2 ... accessing data in an L1 is slower than accessing data in the L2, since L1 data will first have to be transferred to the L2"
    derivation: inferred
    hedge: "appears to"
    supports: []
  - id: c-mh-v3-amx-stq-nonspec
    text: >-
      AMX instructions enter the LSU and sit in the store queue; once an entry is non-speculative it is sent to
      AMX over the L2 bus
    loc: p228
    quote: "AMX instruction go to the LSU; get stored in the STQ; at the point an entry in the STQ becomes non-speculative it's interpreted as AMX, and a single AMX instruction is sent out over the L2 bus"
    method: patent-reading
    derivation: inferred
    hedge: "probably"
    supports: []
    notes: Described as the probable first implementation; an earlier passage of the volume guesses the instructions wait in the ROB instead
  - id: c-mh-v3-amx-ordering-table
    text: >-
      Per a 2018 patent, CPU loads and stores are checked against a table of pages with outstanding AMX loads or
      stores, and any that might clash wait; the table works per page, not per address
    loc: p227
    quote: "a table that describes memory “regions” that will be affected by AMX loads and stores ... we delay loads and stores that might clash until the table says OK ... Rather it works on a page granularity"
    method: patent-reading
    derivation: inferred
    value: page
    supports: []
    notes: The core's load/store queue and dependence predictor do not cover AMX. He thinks one table also serves the LZ coprocessor
  - id: c-mh-v3-amx-l2-id-release
    text: >-
      The L2 holds each AMX transaction ID until the last data beat to or from AMX, then forwards it to the core
      to release the ordering-table entry, saving a few cycles
    loc: p228
    quote: "remember all AMX loads/stores happen through L2), it also sends the transaction ID ... the L2 holds onto the ID until the last beat of data to be transferred to/from AMX"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-amx-two-per-cycle
    text: >-
      Since the core carries two stores per cycle to its last stage, a 2019 patent lets up to two AMX
      instructions per cycle reach the bus interface unit
    loc: p229
    quote: "The generic M1 CPU machinery can process two stores (and so, let's assume, two AMX instructions) per cycle ... allow up to two AMX instructions to proceed all the way to the Bus Interface Unit in one cycle"
    method: patent-reading
    derivation: inferred
    value: 2
    unit: instr/cycle
    hedge: "let's assume"
    supports: []
    notes: Two stores per cycle agrees with the measured store rate
  - id: c-mh-v3-l1-l2-bus-32b
    text: The L1-to-L2 data bus is at least about 32 B wide
    loc: p229
    quote: "Meanwhile the data bus from L1 to L2 is at least 32B or so."
    derivation: inferred
    value: 32
    unit: B/cycle
    approx: true
    hedge: "at least 32B or so"
    supports: [l2.l1_path_width]
    notes: Given as a bus width, a lower bound, in an argument that one beat could carry three or four AMX instructions
  - id: c-mh-v3-amx-bundling
    text: >-
      Per a 2019 patent, the bus interface unit gathers AMX instructions and sends them to AMX in bundles of three
      or four per L1-L2 bus transaction
    loc: p229
    quote: "gather sequential AMX instructions in a buffer in this Bus Interface Unit ... send packed bundles of three (or four, or even more?) instructions to AMX as a single transaction"
    method: patent-reading
    derivation: inferred
    value: 3
    range: [3, 4]
    unit: instructions
    hedge: "or even more?"
    supports: []
  - id: c-mh-v3-wake-state-restore
    text: >-
      A core waking from power-down reloads its saved state from the L2 if only that core slept, from the SLC if
      the whole cluster slept, or even from DRAM
    loc: p272
    quote: "memory (maybe L2 if only this core went to sleep, maybe SLC if the cluster went to sleep, maybe even DRAM)"
    method: patent-reading
    derivation: inferred
    hedge: "maybe"
    supports: []
    notes: A 2017 patent keeps PC, LR and SP in the core to skip part of this restore
  - id: c-mh-v3-core-power-toggle
    text: Per a 2017 patent, a core may switch between powered on and powered down hundreds of times a second
    loc: p273
    quote: "The patent makes the interesting claim that a core may toggle between powered-on and powered-down as often as hundreds of times a second!"
    method: patent-reading
    derivation: inferred
    value: hundreds
    unit: transitions/s
    supports: []
  - id: c-mh-v3-fast-ipi
    text: >-
      Per a 2017 patent, cores message each other through special registers instead of the interrupt controller,
      with four kinds of IPI: immediate, deferred, non-waking and retract
    loc: p273
    quote: "Some special purposes registers are defined to allow any core to message any other core ... four different types of IPI messages are now defined."
    method: patent-reading
    derivation: inferred
    value: 4
    unit: IPI types
    supports: []
  - id: c-mh-v3-irq-soft-hard-force
    text: >-
      Per a 2020 patent, an interrupt is offered to clusters in up to three rounds: soft requests ask only
      powered-on cores, and hard or force requests may power a core on
    loc: p275
    quote: "The “soft” requests attempt to save power. So they skip over all powered down cores and only query cores that are active. “hard” and “force” requests will power on a core if that's required"
    method: patent-reading
    derivation: inferred
    value: 3
    unit: rounds
    supports: []
    notes: He guesses E clusters are asked before P clusters. He does not say which chips use this scheme
  - id: c-mh-v3-irq-rob-nack
    text: >-
      A core turns down an interrupt when in-flight long operations, such as loads to DRAM or PCIe, would delay
      it too long; a core that accepts flushes everything after the last such instruction
    loc: p275
    quote: "the CPU tries to estimate how long till it could service the interrupt, and if that number is too high, returns a NACK"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Same 2020 interrupt patent; the flush uses ROB pointers and the history file to rewind register state
  - id: c-mh-v3-wkdm-engine
    text: >-
      Per a 2016 patent, a WKDM page compression engine sits at the cluster, and Apple's two page compress and
      decompress instructions reach it through a core's store pipeline, as AMX instructions do
    loc: p283
    quote: "This describes a WKDM engine, associated with a cluster ... using essentially the same sort of instruction transport mechanism as AMX (ie instructions flow down a core's store pipeline)"
    method: patent-reading
    derivation: inferred
    supports: []
  - id: c-mh-v3-lz-engine-l2
    text: >-
      Per 2017 and 2019 patents, a cluster has one LZ compression engine at the L2, like AMX, while the ANS
      entropy-coding lookups run in the NEON unit on SIMD registers
    loc: p284
    quote: "To go by the patents, we have a single LZ engine associated with the L2 (like AMX), while the lookups required for the ANS entropy coding are handled in the NEON unit on SIMD registers."
    method: patent-reading
    derivation: inferred
    hedge: "To go by the patents"
    supports: []
  - id: c-mh-v3-cluster-l2tlb
    text: >-
      Shared at the cluster level are the L2, AMX, the LZ page-compression engine and probably the L2 TLB
    loc: p287
    quote: "we have seen that Apple place, at the cluster level ... L2 cache ... AMX ... LZ engine (for page compression) ... probably L2 TLB/MMU"
    derivation: inferred
    hedge: "probably"
    supports: []
    notes: An earlier aside in the volume also lists the L2 TLB among hardware the four cores of a cluster share
  - id: c-mh-v3-mul53
    text: >-
      Apple's Mul53 extension uses the 53-bit multiplier of an FP64 unit for integer multiplies, with two
      instructions giving the low and high halves of the 106-bit product
    loc: p287
    quote: "An fp64 execute unit includes a 53b multiplier, which can be used as an integer multiplier ... providing two instructions"
    method: secondhand
    derivation: reported
    value: 53
    unit: bits
    supports: []
    notes: Taken from a third-party write-up of Apple's custom instructions

new_params:
  pcluster.clock_domain: {block: pcluster, name: Clock domain}
  pcluster.core_powerup: {block: pcluster, name: Core power-up time, unit: µs}

new_mechanisms:
  coprocessor_ordering_table:
    name: Coprocessor memory-ordering table
    status: speculative
    description: CPU loads and stores to a page with outstanding AMX (or LZ) accesses wait until the L2 reports those accesses done.
    params: []
    sim_switch: null
    detection_rule: >-
      a CPU load to a page that an in-flight AMX store targets stalls even at a different address in that page,
      but not when it goes to another page
  power_estimator_throttle:
    name: Digital power estimator throttling
    status: speculative
    description: Per-core event counts feed a power estimate and energy credits that block vector or AMX issue for a cycle or two and steer DVFS.
    params: []
    sim_switch: null
    detection_rule: >-
      dense SIMD loops on every core of a cluster show issue bubbles at an unchanged clock that disappear when one
      core runs the same loop alone
  idle_clock_division:
    name: Divided clock while the core waits
    status: speculative
    description: A core stalled on DRAM or waiting for an event receives one clock pulse in four instead of a frequency change.
    params: []
    sim_switch: null
    detection_rule: >-
      core cycles counted per unit of wall time fall by about four during long DRAM-bound stalls or WFE waits,
      with no DVFS change
  simd_power_down:
    name: SIMD unit power-down with state offload
    status: speculative
    description: After a long stretch without SIMD work the SIMD registers move to a low-leakage store and the SIMD unit loses power.
    params: []
    sim_switch: null
    detection_rule: >-
      the first SIMD instruction after a long integer-only stretch costs a fixed extra delay that recurs after each
      idle stretch

mechanism_claims:
  coprocessor_ordering_table: [c-mh-v3-amx-ordering-table, c-mh-v3-amx-l2-id-release]
  power_estimator_throttle: [c-mh-v3-apsc-dpe, c-mh-v3-dpe-throttle, c-mh-v3-hw-dvfs, c-mh-v3-voltage-margin-recovery,
    c-mh-v3-energy-credits, c-mh-v3-l2-slc-throttle, c-mh-v3-freeze-levels]
  idle_clock_division: [c-mh-v3-idle-clock-quarter, c-mh-v3-clock-dither]
  simd_power_down: [c-mh-v3-simd-power-down]
