# ienflow.yaml
# Kaiyuan Rong et al., 2026
# Firestorm and Icestorm conditional branch predictors reverse engineered, with user-to-kernel KASLR and out-of-place Spectre-PHT attacks.
session: ienflow
source: ccs26-ienflow

claims:
  - id: c-ien-phrt-pcore
    text: On the Firestorm core the target-address path history register folds in target bits 31:2 and records up to 100 taken branches
    loc: p005
    quote: "the PHR incorporates bits [31:2] of the target address (denoted as T[31:2] in the following sections) into its hash function and can record up to 100 target addresses on the P-cores of M1 processors."
    method: secondhand
    derivation: reported
    value: 100
    unit: branches
    supports: [dirpred.history]
    chip: m1
    notes: iEnFlow's own reverse engineering confirms the 2024 Firestorm result. The M2 P-core is identical.

  - id: c-ien-phrb-pcore
    text: On the Firestorm core the branch-address path history register folds in branch bits 5:2 and holds 28 entries
    loc: p004
    quote: "bits [5:2] of the branch address (denoted as B[5:2] in the following sections) form the input ... the BHB can record up to 28 branch addresses."
    method: secondhand
    derivation: reported
    value: 28
    unit: branches
    supports: []
    chip: m1
    notes: Confirms the 2024 split path-history-register result. The M2 P-core is identical.

  - id: c-ien-pcore-pht
    text: Firestorm's longest-history pattern history table is four-way with a 10-bit index using PC bits 6 and 9 and a 16-bit tag
    loc: p007
    quote: "we can conclude that\nthe associativity of the PHT is four, and PC[6] and PC[9]\nare involved in the index hash function ... On the P-cores\nof M1, the PHT has a 10-bit index ... the PHT employs a 16-bit\ntag."
    method: secondhand
    derivation: reported
    value: "4-way, 10-bit index, 16-bit tag"
    supports: []
    chip: m1
    notes: Firestorm; the PC input to the table is PC[18:2]. Confirms the 2024 Firestorm result. The M2 P-core is identical.

  - id: c-ien-counter-3bit
    text: Every pattern history table entry uses a 3-bit saturating counter
    loc: p008
    quote: "we observe that PHT entries on\nall tested cores contain a 3-bit saturating counter."
    method: branch-sweep
    derivation: measured
    value: 3
    unit: bits
    supports: [dirpred.counter_bits]
    chip: m1
    notes: Measured on all tested cores (M1 through M4, P and E), so it holds for Firestorm. Agrees with Tuby and Morrison.

  - id: c-ien-all-taken
    text: On Firestorm every taken branch type updates the path history register, while not-taken conditional branches do not
    loc: p005
    quote: "Our results show that all types of taken branches are recorded\non M1-M3 processors and on the E-cores of the M4 processor."
    method: branch-sweep
    derivation: measured
    supports: []
    chip: m1
    notes: >-
      Tested direct and indirect jumps, taken and non-taken conditional branches, direct and indirect calls, and
      returns. Supports the shift-and-XOR update policy where not-taken conditional branches do not shift.

  - id: c-ien-ecore-phr-60
    text: On the Icestorm core the path history register records 60 taken branches
    loc: p007
    quote: "After executing 100 branches (P-cores)\nor 60 branches (E-cores), the PHR is set to the target value."
    method: branch-sweep
    derivation: measured
    value: 60
    unit: branches
    supports: []
    chip: icestorm
    notes: Confirms Tuby and Morrison's Icestorm history length of 60. Table 2 lists the Icestorm PHRB at 16 and PC input PC[17:2].

  - id: c-ien-ecore-phrt-t48
    text: On the Icestorm core the target-address path history register folds in nearly the whole target address, bits 48:2
    loc: p005
    quote: "On the E-cores, our measurements confirm that bits T[46:2] participate in the PHR\nhash function ... it is reasonable to infer that T[48:2] is regarded as the footprint in the PHR update\nfunction."
    method: branch-sweep
    derivation: measured
    hedge: "reasonable to infer"
    value: "target bits 48:2"
    supports: []
    chip: icestorm
    notes: >-
      T[46:2] confirmed directly, T[48:2] inferred from a kernel collision. Unlike Firestorm's T[31:2], the
      Icestorm core hashes almost the full target address, which defeats brute-force aliasing.

  - id: c-ien-ecore-pht
    text: On the Icestorm core the longest-history pattern history table is four-way with a 9-bit index and a 16-bit tag
    loc: p007
    quote: "on the E-cores, the PHT has\na 9-bit index ... the PHT employs a 16-bit\ntag."
    method: branch-sweep
    derivation: measured
    value: "4-way, 9-bit index, 16-bit tag"
    supports: []
    chip: icestorm
    notes: Four-way per Table 2. The P-core table has a 10-bit index, the E-core a 9-bit index.

  - id: c-ien-pht-shared-pcore
    text: User-space out-of-place Spectre-PHT mistraining steers kernel branch prediction on Firestorm, so its pattern history table is shared between user and kernel
    loc: p012
    quote: "out-of-place Spectre-PHT mistraining\nsucceeds on both the P-cores and the E-cores across all tested Apple\nM1-M4 processors. This demonstrates that PHT entries trained in\nuser space can be used by kernel branches for branch prediction."
    method: branch-sweep
    derivation: measured
    supports: []
    chip: m1
    notes: Confirms that Firestorm keeps no user or kernel isolation in the conditional predictor.

  - id: c-ien-pht-shared-ecore
    text: User-space out-of-place Spectre-PHT mistraining also steers kernel branch prediction on Icestorm
    loc: p013
    quote: "we successfully achieve\nout-of-place Spectre attacks on the E-cores of the M1 as well as on\nall core types across Apple M2-M4 processors."
    method: branch-sweep
    derivation: measured
    supports: []
    chip: icestorm
    notes: >-
      Disagrees with Tuby and Morrison, who reported Icestorm user or kernel isolation and failed on the E-cores;
      iEnFlow attributes their failure to the Icestorm core hashing nearly the full target address.

  - id: c-ien-m4-pcore-nojumps
    text: On the M4 performance core direct unconditional jumps are not recorded in the path history register
    loc: p005
    quote: "on the P-cores of the M4, direct jumps (i.e., the b instruction) are not captured."
    method: branch-sweep
    derivation: measured
    supports: []
    chip: m4
    notes: A change from M1 through M3, where every taken branch type is recorded; the authors tie it to new M4 branch prediction mechanisms.

mechanism_claims:
  path_history_shift_xor: [c-ien-all-taken]
  bpu_isolation: [c-ien-pht-shared-pcore, c-ien-pht-shared-ecore]
