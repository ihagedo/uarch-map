# handley-vol8-memory.yaml
# Maynard Handley, 2025
# Store queue, prefetch, barriers and the memory system in later chips (AArch64-Explore vol 8).
session: handley-vol8-memory
source: handley-vol8

claims:
  - id: c-mh-v8-cluster-one-clock
    text: >-
      All cores of an Apple cluster run at one frequency, apart from sleeping cores, so reaching the L2 or another
      core never crosses a clock domain; a SoC-wide controller sets each cluster's frequency, voltage and L2 power
      savings
    loc: p105
    quote: >-
      Apple (at least to the extent they describe things in patents) provide a power budget for a cluster ... The
      whole reason we run the Apple cluster at a single frequency (apart from sleeping cores)
    derivation: inferred
    value: per cluster
    supports: [pcluster.clock_domain]
    notes: Agrees with c-mh-v3-cluster-one-freq. Said while contrasting Nuvia's per-cluster power controllers.

  - id: c-mh-v8-virtual-alloc
    text: >-
      Apple already appears to give out ordering identifiers at rename and the physical load/store queue slot only
      at execution
    loc: p109
    quote: >-
      ordering identifiers (which are just numbers) at Allocate, and allocating the ultimate resource at the point of
      execution. We've seen that Apple already seem to be doing this with LSU slots
    derivation: inferred
    value: at issue
    hedge: "seem to be"
    supports: [lsu.allocation]
    notes: Restates c-mh-v1-virtual-lsq; agrees with c-dj-lsq-alloc-issue.

  - id: c-mh-v8-three-engines
    text: >-
      Apple now seems to run instruction prefetch, fetch and full branch prediction as three decoupled
      address-generation engines
    loc: p106
    quote: >-
      Apple seem to now be using three decoupled address-generation engines to perform I-fetch/branch prediction.
    derivation: inferred
    hedge: "seem to"
    supports: []
    chip: post-m1
    notes: >-
      Said in a summary written around the Neoverse V2 launch, so no chip is named. The M1 goes only as far as an
      instruction queue (c-mh-v4-decoupled-iq).

  - id: c-mh-v8-prefetch-lsu
    text: >-
      Apple's data prefetchers track addresses in virtual space and train on every load and store, in order, at the
      LSU rather than on the stream of L1 misses
    loc: p111
    quote: >-
      Apple have the same functionality (tracking in virtual space, not physical space; Apple are ahead in capturing
      all load/stores in order at the LSU
    derivation: inferred
    supports: []
    notes: Restates c-mh-v2-prefetch-at-lsu. He ranks Apple and Arm's Neoverse V2 about level on prefetch algorithms.

  - id: c-mh-v8-prefetch-kinds
    text: >-
      Apple's AMPM prefetcher covers the cases of SMS and best-offset prefetching, and its content-directed prefetcher
      is a stronger form of a correlated miss cache for walking pointer structures
    loc: p111
    quote: "My understanding is that Apple's AMPM scheme handles the same sort of cases as SMS ... and BO (fancy version of a next line prefetcher); and Apple's Content Directed Prefetcher is a more powerful form of CMC"
    derivation: inferred
    hedge: "My understanding is"
    supports: [prefetch.kinds]
    notes: Consistent with c-mh-v2-prefetch-kinds, which also lists a large-stride prefetcher.

  - id: c-mh-v8-cdp-lsu
    text: >-
      Training at the LSU lets Apple's prefetching use the values loaded, not only addresses, to spot pointer chasing
      early; this comes from the 2016 content-directed prefetch patent, whose filtering step seems to need LSU
      information
    loc: p111
    quote: >-
      if you do your prefetching based on what you see at the LSU (as Apple does, but apparently no-one else) you can
      also train on the content of what is loaded
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v8-prefetch-wake
    text: >-
      After the L2 has been powered down and lost its contents, Apple runs the prefetchers more aggressively once it
      powers up again
    loc: p112
    quote: >-
      the way Apple runs the prefetchers more aggressively after the L2 cache is powered up after having been powered
      down and lost its contents
    derivation: inferred
    supports: []
    notes: >-
      Given as existing Apple behaviour with no chip named. The deny-list patent repeats it for a CPU waking from
      sleep with empty caches (c-mh-v8-deny-list-ration).

  - id: c-mh-v8-spec-ipc-v2
    text: >-
      Eyeballing published SPEC2017 results, the M1 and M2 are mostly slightly ahead of Arm's Neoverse V2 on IPC, but
      not dramatically
    loc: p112
    quote: "Apple is mostly still slightly ahead on IPC (as of M1 and M2), but not dramatically so"
    method: secondhand
    derivation: reported
    supports: []
    chip: m2
    notes: >-
      Apple results from the TomyLemon Apple-CPU-Benchmarks collection. Large x264 and exchange2 leads he puts down to
      compilers.

  - id: c-mh-v8-gb6-m1-m4
    text: >-
      Geekbench 6 single-thread scores, averaged over devices, rise 1.62x from M1 to M4 (1.12x, 1.20x and 1.21x per
      generation); SPEC2017 shows about the same 60% gain
    loc: p113
    quote: >-
      Overall 1.12 1.20 1.21 1.62 ... SPEC2017 numbers basically replicate this pattern of ~60% improvement from M1 to
      M4.
    method: secondhand
    derivation: derived
    value: 1.62
    unit: ratio
    supports: []
    chip: m4
    notes: >-
      Mostly iPads, with an iMac for the M3. Pro, Max and Ultra parts run 0.1 to 0.2 GHz higher and, with their larger
      SLC, score 2 to 3% more.

  - id: c-mh-v8-ghz-m1-m4
    text: Clock speed rose 1.38x from M1 to M4, by 1.09x to the M2, 1.17x to the M3 and 1.07x to the M4
    loc: p113
    quote: "GHz ratio 1.09 1.17 1.07 1.38"
    method: secondhand
    derivation: derived
    value: 1.38
    unit: ratio
    supports: []
    chip: m4
    notes: From the same device averages as c-mh-v8-gb6-m1-m4.

  - id: c-mh-v8-ipc-per-gen
    text: >-
      About 17% of the M1 to M4 single-thread gain is IPC, roughly 5% per generation, less than the clock
      contribution
    loc: p113
    quote: "About 17% of the overall improvement has been IPC, so call it about 5% IPC boost per generation."
    method: secondhand
    derivation: derived
    value: 5
    unit: "%"
    approx: true
    supports: []
    chip: m4
    notes: >-
      Per-benchmark IPC is mostly flat or rising; object detection gains 2.30x in IPC from M1 to M4, horizon detection
      none.

  - id: c-mh-v8-n3-sram
    text: >-
      The M1 and M2 are built on N5 and the M3 and M4 on N3, where SRAM density barely improves, so Apple kept its
      structures at about the same sizes and restructured the pipeline for higher clocks
    loc: p114
    quote: >-
      M1 and M2 were on an N5 process, M3 and M4 on an N3 process. ... pivot to retaining the same sorts of structures
      in the same sorts of sizes, but restructuring the pipeline
    derivation: inferred
    supports: []
    chip: m3
    notes: N3 raises logic density by about 60% but SRAM density by about 5%.

  - id: c-mh-v8-m3-width-9
    text: The M3 P core is 9 wide
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 9
    unit: instr/cycle
    supports: []
    chip: m3
    notes: The M1 is 8 wide (decode.width).

  - id: c-mh-v8-m4-width-10
    text: The M4 P core is 10 wide
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 10
    unit: instr/cycle
    supports: []
    chip: m4
    notes: The trace-cache discussion also calls the current CPU 10 wide.

  - id: c-mh-v8-m4-int-units-8
    text: The latest P cores have eight integer execution units, up from six
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 8
    unit: units
    supports: []
    chip: m4
    notes: The sentence does not say whether the M3 already has eight. The M1 has six (eu_int.count).

  - id: c-mh-v8-m4-ls-pipes
    text: >-
      Apple's current P cores still have two load units, one store unit and one ambidextrous load/store unit, where
      Arm's Cortex-X925 has three load units
    loc: p114
    quote: "compared to Apple's two loads, a store, and an ambidextrous unit"
    derivation: inferred
    value: 4
    unit: units
    supports: []
    chip: m4
    notes: Same layout as on the M1 (c-mh-v2-ls-pipes, lsu.ls_units).

  - id: c-mh-v8-m4-neon-4
    text: Apple's current P cores still have four NEON pipelines
    loc: p114
    quote: "Another version of this for Apple might be to boost the existing four NEON pipelines to handle SVE."
    derivation: inferred
    value: 4
    unit: units
    supports: []
    chip: m4
    notes: Same count as on the M1 (eu_fp.count).

  - id: c-mh-v8-bias-m3-m4
    text: >-
      Apple began exploiting strongly biased branches around 2020; the first patent's tweak is maybe in the M3, and
      the later front-end redesign built on it maybe in the M4
    loc: p117
    quote: >-
      from an initial idea (a nice tweak which maybe is in the M3) to the substantial redesign which is maybe in the
      M4
    method: patent-reading
    derivation: inferred
    hedge: "maybe"
    supports: []
    chip: m3
    notes: The M4-era pieces are c-mh-v8-biased-indirect, c-mh-v8-biased-csel and c-mh-v8-trace-cache.

  - id: c-mh-v8-bias-bits
    text: >-
      A front-end bias predictor marks strongly biased branches in the predecoded I-cache line with a bias bit and a
      direction bit; the front end treats them as an unconditional branch or a NOP until the branch executes
    loc: p118
    quote: >-
      we also mark these strongly pre-dicted branches (one bit) and their branch direction (one bit). ... A strongly
      biased taken branch is almost equivalent to a goto
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m3
    notes: US20230244494A1 (2022), maybe in the M3 (c-mh-v8-bias-m3-m4).

  - id: c-mh-v8-bias-table
    text: The bias predictor is a table indexed by a hash of the PC, with a two-bit state per entry
    loc: p119
    quote: >-
      we have a table, indexed by a hash of the PC, and a state machine that updates the (two bit) contents of each
      table entry
    method: patent-reading
    derivation: inferred
    value: 2
    unit: bits
    supports: []
    chip: m3
    notes: >-
      A bias misprediction resets the entry to not-biased and clears the I-cache bits. The patent is vague; Handley
      would add the ASID to the hash and a micro-tag.

  - id: c-mh-v8-bias-skip-tage
    text: >-
      Strongly biased branches skip the TAGE check after fetch, saving power; Handley infers they are also kept out of
      TAGE training and the global history, though the patent does not say so
    loc: p119
    quote: >-
      don't bother to run TAGE after fetch to check the TAGE prediction (power saving). ... Apple don't explicitly
      mention doing this, but everything else about the design suggests this is an additional feature.
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m3
    notes: Same patent as c-mh-v8-bias-bits.

  - id: c-mh-v8-m1-two-branch-units
    text: The M1 and M2 have two branch pipelines, each with the full machinery for recovering from a misprediction
    loc: p121
    quote: >-
      (at least for M1 and M2) we have two branch handling pipelines, and both of them need ... a large amount of
      circuitry to deal with a misprediction
    derivation: inferred
    value: 2
    unit: units
    supports: []
    notes: Agrees with eu_int.roles (branches on units 1 and 2) and c-at-branches.

  - id: c-mh-v8-light-branch-unit
    text: >-
      Confidently predicted branches go to a lightweight branch unit that only checks the prediction; a wrong one is
      replayed on a single heavyweight unit that handles recovery
    loc: p121
    quote: >-
      Instead we provide one or two lightweight branch execution units and a heavyweight unit. We preferen-tially send
      branches to the lightweight unit, only sending them to the heavyweight unit if we're not confident
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m3
    notes: >-
      US20230244495A1 (2022), maybe in the M3. Handley guesses the branch stays in its scheduling queue for a cycle,
      as in speculative scheduling, so it can be reissued on the paired heavyweight pipeline.

  - id: c-mh-v8-m3-branch-pipes
    text: The M3 has two branch pipelines, one heavyweight and one lightweight
    loc: p121
    quote: >-
      The general consensus seems to be that the M3 and M4 both have only two branch pipelines (so one heavyweight and
      one lightweight)
    method: secondhand
    derivation: reported
    value: 2
    unit: units
    hedge: "seems to be"
    supports: []
    chip: m3

  - id: c-mh-v8-m4-branch-pipes
    text: The M4 has two branch pipelines, one heavyweight and one lightweight
    loc: p121
    quote: >-
      The general consensus seems to be that the M3 and M4 both have only two branch pipelines (so one heavyweight and
      one lightweight)
    method: secondhand
    derivation: reported
    value: 2
    unit: units
    hedge: "seems to be"
    supports: []
    chip: m4

  - id: c-mh-v8-biased-indirect
    text: >-
      Indirect branches found strongly biased after execution are recorded in a table at the I-cache entrance and
      rewritten as direct branches, hidden from the ITTAGE predictor and checked on the lightweight branch unit
    loc: p122
    quote: >-
      We track, after execution, whether each indirect branch is strongly biased. If so we place a record in a table at
      the entrance to the I-cache, and rewrite indirect control transfer instructions
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: US20250036416A1 (2023). Handley places this round of biased-branch patents maybe in the M4.

  - id: c-mh-v8-biased-csel
    text: >-
      CSELs that almost always pick the same input are recorded in a table at the L1I entrance and rewritten as plain
      moves that execute in zero cycles at rename, checked later when the CSEL executes
    loc: p123
    quote: >-
      rewrite the instructions as the non-conditional variant. This allows the non-conditional variant (basically a
      mov to execute in zero cycles without having to wait for the condition flag to be evaluated).
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: Added at the end of the first biased-branch patent; Handley places this use maybe in the M4.

  - id: c-mh-v8-trace-cache
    text: >-
      A trainer copies traces, straight-line code joined by one or two stable taken branches, from the instruction
      queue into a trace cache; a hit in the trace next-fetch predictor overrides the normal one and fetches the trace
    loc: p129
    quote: >-
      sees a sequence that looks like a trace (so non-branches separated by one or two stable taken branches) it flags
      this sequence and the trace is copied from the instruction queue to the Trace Cache
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: US20250021332A1 (2023); traces of about 16 instructions. Handley places the trace cache maybe in the M4.

  - id: c-mh-v8-trace-well-biased
    text: >-
      Traces may also hold well-biased branches (about 95% one way), which stay in the predictors; ones that
      mispredict too often go into a Bloom filter and are kept out of traces
    loc: p132
    quote: >-
      The final piece of all this support for well-biased (~95%) branches is some machinery to count how often they
      mispredict and, if they mispredict too often, place them in a Bloom filter
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: A pre-hashed history field in the trace predictor adds several branch outcomes to the history in one cycle.

  - id: c-mh-v8-fetch-pred-sizes
    text: >-
      With the trace cache the 1024-entry L0 and 2048-entry L1 fetch predictors presumably remain, joined by an L0
      trace fetch predictor of perhaps 256 entries
    loc: p132
    quote: >-
      Presumably we still have the old 1024 entry L0 Fetch Predictor and the 2048 entry L1 Fetch Predictor, but we also
      have a (?256 entry?) L0 Trace Fetch Predictor
    derivation: inferred
    value: 256
    unit: entries
    approx: true
    hedge: "Presumably ... (?256 entry?)"
    supports: []
    chip: m4
    notes: The 1024-entry L0 matches btb.l0_entries on the M1; the 2048-entry L1 matches c-mh-v4-m2-l2-fp (M2).

  - id: c-mh-v8-trace-groups
    text: >-
      Handling two branches a cycle gives fetch or trace groups of about 12 instructions, about 18 if a third of the
      branches are ultra-biased
    loc: p132
    quote: >-
      allowing for Fetch/Trace Groups of about ~12 in length. But it's actually slightly better than that. If we allow
      say a third of these to be ultra-biased branches then we get to about ~18 in length
    derivation: inferred
    value: 12
    unit: instructions
    approx: true
    supports: []
    chip: m4

  - id: c-mh-v8-pred-stages
    text: >-
      Behind the single-cycle next-fetch predictor sit a simple history-based predictor that takes two cycles and
      costs one cycle when it corrects, then TAGE and ITTAGE predictors that take 3 to 5 cycles
    loc: p133
    quote: >-
      a slower large and simple history-based branch predictor that takes two cycles and can (if necessary) correct a
      mistake made by the Next Fetch Predictor, wasting only a cycle ... taking anywhere from 3 to 5 cycles
    derivation: inferred
    value: 4
    range: [3, 5]
    unit: cycles
    supports: []
    notes: Restates the staged scheme of c-mh-v4-nfp-trained-by-predictors; agrees with c-mh-v4-tage-5-cycles.

  - id: c-mh-v8-nfp-hysteresis
    text: >-
      Apple's next-fetch predictors have so far repeated what happened the last time a PC was seen, softened by
      hysteresis that changes an entry only after two wrong uses
    loc: p133
    quote: >-
      The existing Apple designs have all been basically to repeat what was done last time this program counter
      address was encountered.
    derivation: inferred
    supports: []
    notes: Agrees with c-mh-v4-nfp-hysteresis.

  - id: c-mh-v8-nfp-history
    text: >-
      The next-fetch predictor gains, beside its history-free table, a table indexed by a hash of recent branch PCs
      (source path) and tagged by recent branch targets (target path), split into taken and not-taken tables
    loc: p134
    quote: "The index into the table is based on the source path, but the tag in the table is based on the target path."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12353882B1 (2023); no chip named.

  - id: c-mh-v8-return-bubble
    text: >-
      A fetch group ending in a return used to cost one cycle while the return address was read from the RAS; later
      designs remove that cycle
    loc: p124
    quote: >-
      if a sequential run ended with return, this used to mean a one cycle delay looking up the return address in the
      Return Address Stack
    derivation: inferred
    value: 1
    unit: cycles
    supports: [ras.return_bubble]
    notes: Restates c-mh-v4-return-bubble.

new_mechanisms:
  biased_branch_filter:
    name: Biased-branch filtering in the front end
    status: speculative
    description: >-
      Branches, indirect branches and CSELs that always go one way are marked at the I-cache, handled as jumps, NOPs
      or moves, kept out of the main predictors and checked on a lightweight branch unit.
    params: []
    sim_switch: null
    detection_rule: >-
      adding many always-taken branches does not raise the misprediction rate of history-dependent branches, while the
      first flip of such a branch costs a full mispredict
  trace_cache:
    name: Trace cache built on stable taken branches
    status: speculative
    description: >-
      Straight-line runs joined by stable taken branches are copied from the instruction queue into a trace cache, so
      one fetch can cross several taken branches.
    params: []
    sim_switch: null
    detection_rule: a loop body joined by always-taken branches sustains more than one taken branch per cycle

mechanism_claims:
  lsq_at_issue: [c-mh-v8-virtual-alloc]
  lsu_virtual_prefetch: [c-mh-v8-prefetch-lsu]
  content_directed_prefetch: [c-mh-v8-prefetch-kinds, c-mh-v8-cdp-lsu]
  decoupled_fetch: [c-mh-v8-three-engines]
  l1i_coupled_btb: [c-mh-v8-nfp-hysteresis, c-mh-v8-pred-stages]
  biased_branch_filter: [c-mh-v8-bias-m3-m4, c-mh-v8-bias-bits, c-mh-v8-bias-table, c-mh-v8-bias-skip-tage,
    c-mh-v8-light-branch-unit, c-mh-v8-biased-indirect, c-mh-v8-biased-csel]
  trace_cache: [c-mh-v8-trace-cache, c-mh-v8-trace-well-biased, c-mh-v8-fetch-pred-sizes, c-mh-v8-trace-groups]
