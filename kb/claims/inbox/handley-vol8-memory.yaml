# handley-vol8-memory.yaml
# Maynard Handley, 2025
# Store queue, prefetch, barriers and the memory system in later chips (AArch64-Explore vol 8).
session: handley-vol8-memory
source: handley-vol8

claims:
  - id: c-mh-v8-cluster-one-clock
    text: >-
      All cores of an Apple cluster run at one frequency, apart from sleeping cores, so reaching the L2 or another
      core never crosses a clock domain; a SoC-wide controller sets each cluster's frequency, voltage and L2 power
      savings
    loc: p105
    quote: >-
      Apple (at least to the extent they describe things in patents) provide a power budget for a cluster ... The
      whole reason we run the Apple cluster at a single frequency (apart from sleeping cores)
    derivation: inferred
    value: per cluster
    supports: [pcluster.clock_domain]
    notes: Agrees with c-mh-v3-cluster-one-freq. Said while contrasting Nuvia's per-cluster power controllers.

  - id: c-mh-v8-virtual-alloc
    text: >-
      Apple already appears to give out ordering identifiers at rename and the physical load/store queue slot only
      at execution
    loc: p109
    quote: >-
      ordering identifiers (which are just numbers) at Allocate, and allocating the ultimate resource at the point of
      execution. We've seen that Apple already seem to be doing this with LSU slots
    derivation: inferred
    value: at issue
    hedge: "seem to be"
    supports: [lsu.allocation]
    notes: Restates c-mh-v1-virtual-lsq; agrees with c-dj-lsq-alloc-issue.

  - id: c-mh-v8-three-engines
    text: >-
      Apple now seems to run instruction prefetch, fetch and full branch prediction as three decoupled
      address-generation engines
    loc: p106
    quote: >-
      Apple seem to now be using three decoupled address-generation engines to perform I-fetch/branch prediction.
    derivation: inferred
    hedge: "seem to"
    supports: []
    chip: post-m1
    notes: >-
      Said in a summary written around the Neoverse V2 launch, so no chip is named. The M1 goes only as far as an
      instruction queue (c-mh-v4-decoupled-iq).

  - id: c-mh-v8-prefetch-lsu
    text: >-
      Apple's data prefetchers track addresses in virtual space and train on every load and store, in order, at the
      LSU rather than on the stream of L1 misses
    loc: p111
    quote: >-
      Apple have the same functionality (tracking in virtual space, not physical space; Apple are ahead in capturing
      all load/stores in order at the LSU
    derivation: inferred
    supports: []
    notes: Restates c-mh-v2-prefetch-at-lsu. He ranks Apple and Arm's Neoverse V2 about level on prefetch algorithms.

  - id: c-mh-v8-prefetch-kinds
    text: >-
      Apple's AMPM prefetcher covers the cases of SMS and best-offset prefetching, and its content-directed prefetcher
      is a stronger form of a correlated miss cache for walking pointer structures
    loc: p111
    quote: "My understanding is that Apple's AMPM scheme handles the same sort of cases as SMS ... and BO (fancy version of a next line prefetcher); and Apple's Content Directed Prefetcher is a more powerful form of CMC"
    derivation: inferred
    hedge: "My understanding is"
    supports: [prefetch.kinds]
    notes: Consistent with c-mh-v2-prefetch-kinds, which also lists a large-stride prefetcher.

  - id: c-mh-v8-cdp-lsu
    text: >-
      Training at the LSU lets Apple's prefetching use the values loaded, not only addresses, to spot pointer chasing
      early; this comes from the 2016 content-directed prefetch patent, whose filtering step seems to need LSU
      information
    loc: p111
    quote: >-
      if you do your prefetching based on what you see at the LSU (as Apple does, but apparently no-one else) you can
      also train on the content of what is loaded
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v8-prefetch-wake
    text: >-
      After the L2 has been powered down and lost its contents, Apple runs the prefetchers more aggressively once it
      powers up again
    loc: p112
    quote: >-
      the way Apple runs the prefetchers more aggressively after the L2 cache is powered up after having been powered
      down and lost its contents
    derivation: inferred
    supports: []
    notes: >-
      Given as existing Apple behaviour with no chip named. The deny-list patent repeats it for a CPU waking from
      sleep with empty caches (c-mh-v8-deny-list-ration).

  - id: c-mh-v8-spec-ipc-v2
    text: >-
      Eyeballing published SPEC2017 results, the M1 and M2 are mostly slightly ahead of Arm's Neoverse V2 on IPC, but
      not dramatically
    loc: p112
    quote: "Apple is mostly still slightly ahead on IPC (as of M1 and M2), but not dramatically so"
    method: secondhand
    derivation: reported
    supports: []
    chip: m2
    notes: >-
      Apple results from the TomyLemon Apple-CPU-Benchmarks collection. Large x264 and exchange2 leads he puts down to
      compilers.

  - id: c-mh-v8-gb6-m1-m4
    text: >-
      Geekbench 6 single-thread scores, averaged over devices, rise 1.62x from M1 to M4 (1.12x, 1.20x and 1.21x per
      generation); SPEC2017 shows about the same 60% gain
    loc: p113
    quote: >-
      Overall 1.12 1.20 1.21 1.62 ... SPEC2017 numbers basically replicate this pattern of ~60% improvement from M1 to
      M4.
    method: secondhand
    derivation: derived
    value: 1.62
    unit: ratio
    supports: []
    chip: m4
    notes: >-
      Mostly iPads, with an iMac for the M3. Pro, Max and Ultra parts run 0.1 to 0.2 GHz higher and, with their larger
      SLC, score 2 to 3% more.

  - id: c-mh-v8-ghz-m1-m4
    text: Clock speed rose 1.38x from M1 to M4, by 1.09x to the M2, 1.17x to the M3 and 1.07x to the M4
    loc: p113
    quote: "GHz ratio 1.09 1.17 1.07 1.38"
    method: secondhand
    derivation: derived
    value: 1.38
    unit: ratio
    supports: []
    chip: m4
    notes: From the same device averages as c-mh-v8-gb6-m1-m4.

  - id: c-mh-v8-ipc-per-gen
    text: >-
      About 17% of the M1 to M4 single-thread gain is IPC, roughly 5% per generation, less than the clock
      contribution
    loc: p113
    quote: "About 17% of the overall improvement has been IPC, so call it about 5% IPC boost per generation."
    method: secondhand
    derivation: derived
    value: 5
    unit: "%"
    approx: true
    supports: []
    chip: m4
    notes: >-
      Per-benchmark IPC is mostly flat or rising; object detection gains 2.30x in IPC from M1 to M4, horizon detection
      none.

  - id: c-mh-v8-n3-sram
    text: >-
      The M1 and M2 are built on N5 and the M3 and M4 on N3, where SRAM density barely improves, so Apple kept its
      structures at about the same sizes and restructured the pipeline for higher clocks
    loc: p114
    quote: >-
      M1 and M2 were on an N5 process, M3 and M4 on an N3 process. ... pivot to retaining the same sorts of structures
      in the same sorts of sizes, but restructuring the pipeline
    derivation: inferred
    supports: []
    chip: m3
    notes: N3 raises logic density by about 60% but SRAM density by about 5%.

  - id: c-mh-v8-m3-width-9
    text: The M3 P core is 9 wide
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 9
    unit: instr/cycle
    supports: []
    chip: m3
    notes: The M1 is 8 wide (decode.width).

  - id: c-mh-v8-m4-width-10
    text: The M4 P core is 10 wide
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 10
    unit: instr/cycle
    supports: []
    chip: m4
    notes: The trace-cache discussion also calls the current CPU 10 wide.

  - id: c-mh-v8-m4-int-units-8
    text: The latest P cores have eight integer execution units, up from six
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 8
    unit: units
    supports: []
    chip: m4
    notes: The sentence does not say whether the M3 already has eight. The M1 has six (eu_int.count).

  - id: c-mh-v8-m4-ls-pipes
    text: >-
      Apple's current P cores still have two load units, one store unit and one ambidextrous load/store unit, where
      Arm's Cortex-X925 has three load units
    loc: p114
    quote: "compared to Apple's two loads, a store, and an ambidextrous unit"
    derivation: inferred
    value: 4
    unit: units
    supports: []
    chip: m4
    notes: Same layout as on the M1 (c-mh-v2-ls-pipes, lsu.ls_units).

  - id: c-mh-v8-m4-neon-4
    text: Apple's current P cores still have four NEON pipelines
    loc: p114
    quote: "Another version of this for Apple might be to boost the existing four NEON pipelines to handle SVE."
    derivation: inferred
    value: 4
    unit: units
    supports: []
    chip: m4
    notes: Same count as on the M1 (eu_fp.count).

mechanism_claims:
  lsq_at_issue: [c-mh-v8-virtual-alloc]
  lsu_virtual_prefetch: [c-mh-v8-prefetch-lsu]
  content_directed_prefetch: [c-mh-v8-prefetch-kinds, c-mh-v8-cdp-lsu]
  decoupled_fetch: [c-mh-v8-three-engines]
