# handley-vol8-memory.yaml
# Maynard Handley, 2025
# Store queue, prefetch, barriers and the memory system in later chips (AArch64-Explore vol 8).
session: handley-vol8-memory
source: handley-vol8

claims:
  - id: c-mh-v8-cluster-one-clock
    text: >-
      All cores of an Apple cluster run at one frequency, apart from sleeping cores, so reaching the L2 or another
      core never crosses a clock domain; a SoC-wide controller sets each cluster's frequency, voltage and L2 power
      savings
    loc: p105
    quote: >-
      Apple (at least to the extent they describe things in patents) provide a power budget for a cluster ... The
      whole reason we run the Apple cluster at a single frequency (apart from sleeping cores)
    derivation: inferred
    value: per cluster
    supports: [pcluster.clock_domain]
    notes: Agrees with c-mh-v3-cluster-one-freq. Said while contrasting Nuvia's per-cluster power controllers.

  - id: c-mh-v8-virtual-alloc
    text: >-
      Apple already appears to give out ordering identifiers at rename and the physical load/store queue slot only
      at execution
    loc: p109
    quote: >-
      ordering identifiers (which are just numbers) at Allocate, and allocating the ultimate resource at the point of
      execution. We've seen that Apple already seem to be doing this with LSU slots
    derivation: inferred
    value: at issue
    hedge: "seem to be"
    supports: [lsu.allocation]
    notes: Restates c-mh-v1-virtual-lsq; agrees with c-dj-lsq-alloc-issue.

  - id: c-mh-v8-three-engines
    text: >-
      Apple now seems to run instruction prefetch, fetch and full branch prediction as three decoupled
      address-generation engines
    loc: p106
    quote: >-
      Apple seem to now be using three decoupled address-generation engines to perform I-fetch/branch prediction.
    derivation: inferred
    hedge: "seem to"
    supports: []
    chip: post-m1
    notes: >-
      Said in a summary written around the Neoverse V2 launch, so no chip is named. The M1 goes only as far as an
      instruction queue (c-mh-v4-decoupled-iq).

  - id: c-mh-v8-prefetch-lsu
    text: >-
      Apple's data prefetchers track addresses in virtual space and train on every load and store, in order, at the
      LSU rather than on the stream of L1 misses
    loc: p111
    quote: >-
      Apple have the same functionality (tracking in virtual space, not physical space; Apple are ahead in capturing
      all load/stores in order at the LSU
    derivation: inferred
    supports: []
    notes: Restates c-mh-v2-prefetch-at-lsu. He ranks Apple and Arm's Neoverse V2 about level on prefetch algorithms.

  - id: c-mh-v8-prefetch-kinds
    text: >-
      Apple's AMPM prefetcher covers the cases of SMS and best-offset prefetching, and its content-directed prefetcher
      is a stronger form of a correlated miss cache for walking pointer structures
    loc: p111
    quote: "My understanding is that Apple's AMPM scheme handles the same sort of cases as SMS ... and BO (fancy version of a next line prefetcher); and Apple's Content Directed Prefetcher is a more powerful form of CMC"
    derivation: inferred
    hedge: "My understanding is"
    supports: [prefetch.kinds]
    notes: Consistent with c-mh-v2-prefetch-kinds, which also lists a large-stride prefetcher.

  - id: c-mh-v8-cdp-lsu
    text: >-
      Training at the LSU lets Apple's prefetching use the values loaded, not only addresses, to spot pointer chasing
      early; this comes from the 2016 content-directed prefetch patent, whose filtering step seems to need LSU
      information
    loc: p111
    quote: >-
      if you do your prefetching based on what you see at the LSU (as Apple does, but apparently no-one else) you can
      also train on the content of what is loaded
    method: patent-reading
    derivation: inferred
    supports: []

  - id: c-mh-v8-prefetch-wake
    text: >-
      After the L2 has been powered down and lost its contents, Apple runs the prefetchers more aggressively once it
      powers up again
    loc: p112
    quote: >-
      the way Apple runs the prefetchers more aggressively after the L2 cache is powered up after having been powered
      down and lost its contents
    derivation: inferred
    supports: []
    notes: >-
      Given as existing Apple behaviour with no chip named. The deny-list patent repeats it for a CPU waking from
      sleep with empty caches (c-mh-v8-deny-list-ration).

  - id: c-mh-v8-spec-ipc-v2
    text: >-
      Eyeballing published SPEC2017 results, the M1 and M2 are mostly slightly ahead of Arm's Neoverse V2 on IPC, but
      not dramatically
    loc: p112
    quote: "Apple is mostly still slightly ahead on IPC (as of M1 and M2), but not dramatically so"
    method: secondhand
    derivation: reported
    supports: []
    chip: m2
    notes: >-
      Apple results from the TomyLemon Apple-CPU-Benchmarks collection. Large x264 and exchange2 leads he puts down to
      compilers.

  - id: c-mh-v8-gb6-m1-m4
    text: >-
      Geekbench 6 single-thread scores, averaged over devices, rise 1.62x from M1 to M4 (1.12x, 1.20x and 1.21x per
      generation); SPEC2017 shows about the same 60% gain
    loc: p113
    quote: >-
      Overall 1.12 1.20 1.21 1.62 ... SPEC2017 numbers basically replicate this pattern of ~60% improvement from M1 to
      M4.
    method: secondhand
    derivation: derived
    value: 1.62
    unit: ratio
    supports: []
    chip: m4
    notes: >-
      Mostly iPads, with an iMac for the M3. Pro, Max and Ultra parts run 0.1 to 0.2 GHz higher and, with their larger
      SLC, score 2 to 3% more.

  - id: c-mh-v8-ghz-m1-m4
    text: Clock speed rose 1.38x from M1 to M4, by 1.09x to the M2, 1.17x to the M3 and 1.07x to the M4
    loc: p113
    quote: "GHz ratio 1.09 1.17 1.07 1.38"
    method: secondhand
    derivation: derived
    value: 1.38
    unit: ratio
    supports: []
    chip: m4
    notes: From the same device averages as c-mh-v8-gb6-m1-m4.

  - id: c-mh-v8-ipc-per-gen
    text: >-
      About 17% of the M1 to M4 single-thread gain is IPC, roughly 5% per generation, less than the clock
      contribution
    loc: p113
    quote: "About 17% of the overall improvement has been IPC, so call it about 5% IPC boost per generation."
    method: secondhand
    derivation: derived
    value: 5
    unit: "%"
    approx: true
    supports: []
    chip: m4
    notes: >-
      Per-benchmark IPC is mostly flat or rising; object detection gains 2.30x in IPC from M1 to M4, horizon detection
      none.

  - id: c-mh-v8-n3-sram
    text: >-
      The M1 and M2 are built on N5 and the M3 and M4 on N3, where SRAM density barely improves, so Apple kept its
      structures at about the same sizes and restructured the pipeline for higher clocks
    loc: p114
    quote: >-
      M1 and M2 were on an N5 process, M3 and M4 on an N3 process. ... pivot to retaining the same sorts of structures
      in the same sorts of sizes, but restructuring the pipeline
    derivation: inferred
    supports: []
    chip: m3
    notes: N3 raises logic density by about 60% but SRAM density by about 5%.

  - id: c-mh-v8-m3-width-9
    text: The M3 P core is 9 wide
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 9
    unit: instr/cycle
    supports: []
    chip: m3
    notes: The M1 is 8 wide (decode.width).

  - id: c-mh-v8-m4-width-10
    text: The M4 P core is 10 wide
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 10
    unit: instr/cycle
    supports: []
    chip: m4
    notes: The trace-cache discussion also calls the current CPU 10 wide.

  - id: c-mh-v8-m4-int-units-8
    text: The latest P cores have eight integer execution units, up from six
    loc: p114
    quote: "Thus 9-wide (M3) and 10-wide (M4), along with 8 rather than 6 integer execution units."
    method: secondhand
    derivation: reported
    value: 8
    unit: units
    supports: []
    chip: m4
    notes: The sentence does not say whether the M3 already has eight. The M1 has six (eu_int.count).

  - id: c-mh-v8-m4-ls-pipes
    text: >-
      Apple's current P cores still have two load units, one store unit and one ambidextrous load/store unit, where
      Arm's Cortex-X925 has three load units
    loc: p114
    quote: "compared to Apple's two loads, a store, and an ambidextrous unit"
    derivation: inferred
    value: 4
    unit: units
    supports: []
    chip: m4
    notes: Same layout as on the M1 (c-mh-v2-ls-pipes, lsu.ls_units).

  - id: c-mh-v8-m4-neon-4
    text: Apple's current P cores still have four NEON pipelines
    loc: p114
    quote: "Another version of this for Apple might be to boost the existing four NEON pipelines to handle SVE."
    derivation: inferred
    value: 4
    unit: units
    supports: []
    chip: m4
    notes: Same count as on the M1 (eu_fp.count).

  - id: c-mh-v8-bias-m3-m4
    text: >-
      Apple began exploiting strongly biased branches around 2020; the first patent's tweak is maybe in the M3, and
      the later front-end redesign built on it maybe in the M4
    loc: p117
    quote: >-
      from an initial idea (a nice tweak which maybe is in the M3) to the substantial redesign which is maybe in the
      M4
    method: patent-reading
    derivation: inferred
    hedge: "maybe"
    supports: []
    chip: m3
    notes: The M4-era pieces are c-mh-v8-biased-indirect, c-mh-v8-biased-csel and c-mh-v8-trace-cache.

  - id: c-mh-v8-bias-bits
    text: >-
      A front-end bias predictor marks strongly biased branches in the predecoded I-cache line with a bias bit and a
      direction bit; the front end treats them as an unconditional branch or a NOP until the branch executes
    loc: p118
    quote: >-
      we also mark these strongly pre-dicted branches (one bit) and their branch direction (one bit). ... A strongly
      biased taken branch is almost equivalent to a goto
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m3
    notes: US20230244494A1 (2022), maybe in the M3 (c-mh-v8-bias-m3-m4).

  - id: c-mh-v8-bias-table
    text: The bias predictor is a table indexed by a hash of the PC, with a two-bit state per entry
    loc: p119
    quote: >-
      we have a table, indexed by a hash of the PC, and a state machine that updates the (two bit) contents of each
      table entry
    method: patent-reading
    derivation: inferred
    value: 2
    unit: bits
    supports: []
    chip: m3
    notes: >-
      A bias misprediction resets the entry to not-biased and clears the I-cache bits. The patent is vague; Handley
      would add the ASID to the hash and a micro-tag.

  - id: c-mh-v8-bias-skip-tage
    text: >-
      Strongly biased branches skip the TAGE check after fetch, saving power; Handley infers they are also kept out of
      TAGE training and the global history, though the patent does not say so
    loc: p119
    quote: >-
      don't bother to run TAGE after fetch to check the TAGE prediction (power saving). ... Apple don't explicitly
      mention doing this, but everything else about the design suggests this is an additional feature.
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m3
    notes: Same patent as c-mh-v8-bias-bits.

  - id: c-mh-v8-m1-two-branch-units
    text: The M1 and M2 have two branch pipelines, each with the full machinery for recovering from a misprediction
    loc: p121
    quote: >-
      (at least for M1 and M2) we have two branch handling pipelines, and both of them need ... a large amount of
      circuitry to deal with a misprediction
    derivation: inferred
    value: 2
    unit: units
    supports: []
    notes: Agrees with eu_int.roles (branches on units 1 and 2) and c-at-branches.

  - id: c-mh-v8-light-branch-unit
    text: >-
      Confidently predicted branches go to a lightweight branch unit that only checks the prediction; a wrong one is
      replayed on a single heavyweight unit that handles recovery
    loc: p121
    quote: >-
      Instead we provide one or two lightweight branch execution units and a heavyweight unit. We preferen-tially send
      branches to the lightweight unit, only sending them to the heavyweight unit if we're not confident
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m3
    notes: >-
      US20230244495A1 (2022), maybe in the M3. Handley guesses the branch stays in its scheduling queue for a cycle,
      as in speculative scheduling, so it can be reissued on the paired heavyweight pipeline.

  - id: c-mh-v8-m3-branch-pipes
    text: The M3 has two branch pipelines, one heavyweight and one lightweight
    loc: p121
    quote: >-
      The general consensus seems to be that the M3 and M4 both have only two branch pipelines (so one heavyweight and
      one lightweight)
    method: secondhand
    derivation: reported
    value: 2
    unit: units
    hedge: "seems to be"
    supports: []
    chip: m3

  - id: c-mh-v8-m4-branch-pipes
    text: The M4 has two branch pipelines, one heavyweight and one lightweight
    loc: p121
    quote: >-
      The general consensus seems to be that the M3 and M4 both have only two branch pipelines (so one heavyweight and
      one lightweight)
    method: secondhand
    derivation: reported
    value: 2
    unit: units
    hedge: "seems to be"
    supports: []
    chip: m4

  - id: c-mh-v8-biased-indirect
    text: >-
      Indirect branches found strongly biased after execution are recorded in a table at the I-cache entrance and
      rewritten as direct branches, hidden from the ITTAGE predictor and checked on the lightweight branch unit
    loc: p122
    quote: >-
      We track, after execution, whether each indirect branch is strongly biased. If so we place a record in a table at
      the entrance to the I-cache, and rewrite indirect control transfer instructions
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: US20250036416A1 (2023). Handley places this round of biased-branch patents maybe in the M4.

  - id: c-mh-v8-biased-csel
    text: >-
      CSELs that almost always pick the same input are recorded in a table at the L1I entrance and rewritten as plain
      moves that execute in zero cycles at rename, checked later when the CSEL executes
    loc: p123
    quote: >-
      rewrite the instructions as the non-conditional variant. This allows the non-conditional variant (basically a
      mov to execute in zero cycles without having to wait for the condition flag to be evaluated).
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: Added at the end of the first biased-branch patent; Handley places this use maybe in the M4.

  - id: c-mh-v8-trace-cache
    text: >-
      A trainer copies traces, straight-line code joined by one or two stable taken branches, from the instruction
      queue into a trace cache; a hit in the trace next-fetch predictor overrides the normal one and fetches the trace
    loc: p129
    quote: >-
      sees a sequence that looks like a trace (so non-branches separated by one or two stable taken branches) it flags
      this sequence and the trace is copied from the instruction queue to the Trace Cache
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: US20250021332A1 (2023); traces of about 16 instructions. Handley places the trace cache maybe in the M4.

  - id: c-mh-v8-trace-well-biased
    text: >-
      Traces may also hold well-biased branches (about 95% one way), which stay in the predictors; ones that
      mispredict too often go into a Bloom filter and are kept out of traces
    loc: p132
    quote: >-
      The final piece of all this support for well-biased (~95%) branches is some machinery to count how often they
      mispredict and, if they mispredict too often, place them in a Bloom filter
    method: patent-reading
    derivation: inferred
    supports: []
    chip: m4
    notes: A pre-hashed history field in the trace predictor adds several branch outcomes to the history in one cycle.

  - id: c-mh-v8-fetch-pred-sizes
    text: >-
      With the trace cache the 1024-entry L0 and 2048-entry L1 fetch predictors presumably remain, joined by an L0
      trace fetch predictor of perhaps 256 entries
    loc: p132
    quote: >-
      Presumably we still have the old 1024 entry L0 Fetch Predictor and the 2048 entry L1 Fetch Predictor, but we also
      have a (?256 entry?) L0 Trace Fetch Predictor
    derivation: inferred
    value: 256
    unit: entries
    approx: true
    hedge: "Presumably ... (?256 entry?)"
    supports: []
    chip: m4
    notes: The 1024-entry L0 matches btb.l0_entries on the M1; the 2048-entry L1 matches c-mh-v4-m2-l2-fp (M2).

  - id: c-mh-v8-trace-groups
    text: >-
      Handling two branches a cycle gives fetch or trace groups of about 12 instructions, about 18 if a third of the
      branches are ultra-biased
    loc: p132
    quote: >-
      allowing for Fetch/Trace Groups of about ~12 in length. But it's actually slightly better than that. If we allow
      say a third of these to be ultra-biased branches then we get to about ~18 in length
    derivation: inferred
    value: 12
    unit: instructions
    approx: true
    supports: []
    chip: m4

  - id: c-mh-v8-pred-stages
    text: >-
      Behind the single-cycle next-fetch predictor sit a simple history-based predictor that takes two cycles and
      costs one cycle when it corrects, then TAGE and ITTAGE predictors that take 3 to 5 cycles
    loc: p133
    quote: >-
      a slower large and simple history-based branch predictor that takes two cycles and can (if necessary) correct a
      mistake made by the Next Fetch Predictor, wasting only a cycle ... taking anywhere from 3 to 5 cycles
    derivation: inferred
    value: 4
    range: [3, 5]
    unit: cycles
    supports: []
    notes: Restates the staged scheme of c-mh-v4-nfp-trained-by-predictors; agrees with c-mh-v4-tage-5-cycles.

  - id: c-mh-v8-nfp-hysteresis
    text: >-
      Apple's next-fetch predictors have so far repeated what happened the last time a PC was seen, softened by
      hysteresis that changes an entry only after two wrong uses
    loc: p133
    quote: >-
      The existing Apple designs have all been basically to repeat what was done last time this program counter
      address was encountered.
    derivation: inferred
    supports: []
    notes: Agrees with c-mh-v4-nfp-hysteresis.

  - id: c-mh-v8-nfp-history
    text: >-
      The next-fetch predictor gains, beside its history-free table, a table indexed by a hash of recent branch PCs
      (source path) and tagged by recent branch targets (target path), split into taken and not-taken tables
    loc: p134
    quote: "The index into the table is based on the source path, but the tag in the table is based on the target path."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12353882B1 (2023); no chip named.

  - id: c-mh-v8-return-bubble
    text: >-
      A fetch group ending in a return used to cost one cycle while the return address was read from the RAS; later
      designs remove that cycle
    loc: p124
    quote: >-
      if a sequential run ended with return, this used to mean a one cycle delay looking up the return address in the
      Return Address Stack
    derivation: inferred
    value: 1
    unit: cycles
    supports: [ras.return_bubble]
    notes: Restates c-mh-v4-return-bubble.

  - id: c-mh-v8-l1d-8way
    text: The L1D is 8-way set associative
    loc: p134
    quote: >-
      we'll assume the number of ways is 8 (as it is for L1D, though it's 12 for L1I, and varies for different models
      of L2)
    derivation: inferred
    value: 8
    unit: ways
    supports: [l1d.assoc]
    notes: Agrees with c-mh-v2-l1d-8way and c-mh-v2-l1d-8way-tlb.

  - id: c-mh-v8-l1i-12way
    text: The L1I is 12-way set associative
    loc: p134
    quote: >-
      we'll assume the number of ways is 8 (as it is for L1D, though it's 12 for L1I, and varies for different models
      of L2)
    derivation: inferred
    value: 12
    unit: ways
    supports: [l1i.assoc]
    notes: L2 associativity, he adds, varies from model to model.

  - id: c-mh-v8-ipv-replacement
    text: >-
      Cache replacement order is updated through small insertion/promotion vectors, one picked per line by its
      prefetched and critical bits, with the vectors tuned offline on benchmarks
    loc: p142
    quote: >-
      The trick is that which IPV is selected is based on properties of the cache line. So a cache line may be marked
      as Prefetch'ed (the P bit 42) and/or as Critical (CR bit 44).
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: >-
      US12222875B1 (2023); the patent tunes the vectors with a genetic algorithm. Handley thinks it is realistically
      the L2, the L1s using an approximation to LRU (c-mh-v8-l1-plru).

  - id: c-mh-v8-deny-list
    text: >-
      Prefetched lines carry a bit in the L1 (and usefully the L2) that demand use clears; a line evicted with the bit
      still set goes into a deny list that later prefetch candidates are checked against
    loc: p143
    quote: >-
      First is we need a bit in the cache (certainly L1, but it's helpful to have it also in L2) indicating that a line
      was brought in by a prefetcher.
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12306762B1 (2023).

  - id: c-mh-v8-deny-list-entry
    text: >-
      The deny list is a hashed table, not a Bloom filter; each entry holds a short partial tag, a valid bit and a
      count that gives a line perhaps four unused prefetches before it is denied
    loc: p143
    quote: >-
      an entry is very small: a few bits of tag (which, along with the implicit index hash together approxi-mate the
      address), a valid bit, and a count. ... maybe four
    method: patent-reading
    derivation: inferred
    value: 4
    unit: unused prefetches
    approx: true
    hedge: "maybe four"
    supports: []
    chip: post-m1

  - id: c-mh-v8-deny-list-ration
    text: >-
      The deny list also rations prefetch: partly counted addresses go to the back of the prefetch queue, and when
      bandwidth is short, as when a waking CPU prefetches aggressively into empty caches, they are dropped
    loc: p143
    quote: >-
      a prefetch address that matches in the Deny List, but is not yet at full count might always be moved to the end
      of the list of lines being prefetched
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1

  - id: c-mh-v8-hsq-two-queues
    text: >-
      The store queue is split in two: a primary queue holds the oldest stores and writes them to the L1, and a
      secondary queue holds younger stores and can only pass them to the primary queue
    loc: p144
    quote: >-
      So what Apple proposes is two separate store queues. The first is like what we have today, and stores the oldest
      writes. ... has no ability to interface with the L1 cache, only to move stores to the primary store queue
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12298915B1 (2023). The secondary queue still answers load searches, more slowly.

  - id: c-mh-v8-hsq-search-width
    text: Only the primary store queue is searched by three loads at once; the secondary queue serves one load search at a time
    loc: p144
    quote: >-
      only the first queue supports full three-wide load searching; the second queue provides for only a single load
      search at a time
    method: patent-reading
    derivation: inferred
    value: 3
    unit: loads/cycle
    supports: []
    chip: post-m1

  - id: c-mh-v8-hsq-fast-4
    text: The primary queue finds a matching store in about 4 cycles, helped by an index of address hashes
    loc: p144
    quote: >-
      including via the equivalent of an "index" [eg a table of address hashes], so that a hit against a store occurs
      in around 4 cycles
    method: patent-reading
    derivation: inferred
    value: 4
    unit: cycles
    approx: true
    supports: []
    chip: post-m1
    notes: On the M1, forwarding from the store queue takes about 4 to 5 cycles (c-mh-v1-forwarding-lam).

  - id: c-mh-v8-hsq-slow-11
    text: The secondary queue compares addresses one block at a time and finds a matching store in about 11 cycles
    loc: p144
    quote: >-
      just a fairly mechanical comparison of addresses one block at a time, so that a hit against a store occurs in
      around 11 cycles
    method: patent-reading
    derivation: inferred
    value: 11
    unit: cycles
    approx: true
    supports: []
    chip: post-m1

  - id: c-mh-v8-hsq-banks
    text: The primary store queue is built from two SRAM banks and the secondary from one
    loc: p145
    quote: "It does say that the fast queue consists of two SRAM banks, while the slow queue is a single SRAM bank."
    method: patent-reading
    derivation: inferred
    value: 2
    unit: banks
    supports: []
    chip: post-m1

  - id: c-mh-v8-hsq-split-loads
    text: >-
      A load only partly covered by queued stores takes what it can from the store queues, even from both, and the
      rest from the cache, rather than waiting for the stores to reach the L1
    loc: p145
    quote: >-
      suppose part of a load is present in the store queue but not the rest (eg store was 16b, load is 32b). This is
      handled by extracting as much as possible of the data from the store queue
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1

  - id: c-mh-v8-mispredict-flush
    text: >-
      Recovery from a misprediction starts when it is detected: one possibly-mispredicting instruction issues per
      cycle, and a bit vector marking same-cycle issues as older or younger tells recovery which units to flush
    loc: p147
    quote: >-
      the big idea at the time was to only allow one instruction issue per cycle that could possibly mispredict. Then,
      relative to that one instruction, earlier instructions that issue in the same cycle get marked in a bit vector
    method: patent-reading
    derivation: inferred
    hedge: "have almost certainly changed at some point"
    supports: []
    notes: >-
      US11422821B1 (2018), with no chip named. Handley thinks two or more pipelines may now mispredict in one cycle.
      See c-mh-v8-age-tracking for the same patent's age offsets.

  - id: c-mh-v8-fusions-2023
    text: >-
      New fused pairs are integer divide plus multiply-subtract, an ALU op plus a mask, compare plus CSEL (or CSINC),
      and two-instruction large immediates, which are handled at rename like MOVI
    loc: p147
    quote: >-
      The pairs added are - integer divide followed by multiply-subtract. ... an ALU operation followed by a mask ...
      a compare followed by CSEL.
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12217060B1 (2023). The M1's fusions are rename.fusion.

  - id: c-mh-v8-scvtf-latency
    text: SCVTF and DUP from an integer register take about 12 to 13 cycles on the M1
    loc: p148
    quote: "Both of these seem simple enough but Dougall's M1 latency tables give a latency of around 12..13 cycles."
    method: secondhand
    derivation: reported
    value: 12.5
    range: [12, 13]
    unit: cycles
    supports: []

  - id: c-mh-v8-scvtf-fake-load
    text: >-
      Integer-to-FP instructions such as SCVTF and DUP have long been cracked into a fake load that carries the integer
      through the full load pipeline, TLB lookup and store-queue check included, into an FP register, then an FP op
    loc: p148
    quote: >-
      the way this has been handled by Apple for a long time is that an instruction like SCVTF is cracked into two
      instructions, the first of which is a fake load that moves the data through the load store unit
    derivation: inferred
    supports: []
    notes: Fits c-ox-xfer-fwd (scalar-to-SIMD moves take a load unit slot).

  - id: c-mh-v8-xfer-path
    text: >-
      The LSU gains a register-transfer path separate from its memory path that also does the conversion or lane
      duplication; the op is cracked at decode for rename and fused again into one op after it
    loc: p148
    quote: >-
      there is a separate path in the LSU dedicated to Register Transfer, independent of the main LSU Memory path.
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12288066B1 (2023). Handley guesses the latency drops to maybe 5 cycles.

  - id: c-mh-v8-isb-decode-flush
    text: >-
      Decoding an ISB flushes everything younger and halts fetch at once, without waiting for the ISB to reach the ROB
      head; a new instruction that consumes context an unfinished older one may still change is poisoned and flushed
    loc: p150
    quote: >-
      at the point where we Decode the ISB we immediately flush everything behind the ISB in the pipeline and halt
      Fetch
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US12229561B1 (2022). Compare c-mh-v8-faster-isb.

  - id: c-mh-v8-isb-tlbi
    text: When a TLBI precedes the ISB, fetch simply waits until the TLBI completes
    loc: p151
    quote: "the most energy efficient strategy is to delay fetch until the TLBI is competed"
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1

  - id: c-mh-v8-dsb-early
    text: A DSB flushes at decode and completes once older loads and stores are done, not once all older instructions are
    loc: p151
    quote: >-
      generating the flush as soon as we decode the DSB, and waiting to complete the DSB based on when pending
      load/stores have completed, not for all instructions to have completed
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1

  - id: c-mh-v8-tlbi-dsb-poison
    text: >-
      After TLBI plus DSB, a younger load or store that needs a remote cache before every remote TLBI has completed is
      poisoned and flushed or replayed, so local work resumes without waiting for all acknowledgements
    loc: p151
    quote: >-
      treat a load/store that required a remote cache interaction as poisoned, and flush it (or replay it) once we know
      all the remote TLBI's have completed
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1

  - id: c-mh-v8-remote-tlbi-drain
    text: >-
      A core receiving a remote TLBI and DSB pauses at rename (or fetch) and drains the affected instructions before it
      acknowledges, instead of flushing everything at once
    loc: p152
    quote: >-
      Apple suggests that the remote CPU no longer needs to flush every-thing ASAP. Instead it can pause the pipeline
      at Allocate/Rename (or earlier, like Fetch)
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1

  - id: c-mh-v8-translation-barrier
    text: >-
      A proposed translation barrier instruction would let only the instructions and accesses whose translation could
      change wait after page-table edits, instead of the heavyweight barriers that flush everything today
    loc: p153
    quote: >-
      Right now the way this is handled is with heavyweight barriers that flush everything after the page table
      changes; but the patent points out that this is more aggressive than necessary.
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20250217207A1 (2025), presumably for a future Armv9 profile; Handley calls it a stake in the ground.

  - id: c-mh-v8-tlb-sidecar
    text: >-
      A pre-translate instruction locks entries into a TLB that has a sidecar of variable-size entries, grown by
      merging contiguous pages
    loc: p154
    quote: >-
      the TLB (my guess is this is the L2 TLB, not the L1) is split into two parts. One part handles traditional fixed
      size page lookup, the second part referred to as a "sidecar"
    method: patent-reading
    derivation: inferred
    hedge: "my guess is"
    supports: []
    chip: post-m1
    notes: US20250094355A1 (2023). Handley sees no real-world sign of this TLB yet.

  - id: c-mh-v8-companion-cores
    text: >-
      Besides P and E cores, Apple SoCs carry Chinook-class 64-bit Arm companion cores that run the GPU, ANE and similar
      blocks; they lack AMX and appear to lack FP/NEON
    loc: p159
    quote: >-
      Apple has at least three processor lines, the P- and E-cores, and the Chinook class compan-ion cores used to
      control the GPU, ANE, and similar such items.
    derivation: inferred
    hedge: "appear not to have FP/NEON"
    supports: []
    notes: No chip named; given as known for Apple SoCs.

  - id: c-mh-v8-small-core
    text: >-
      A new companion core, between a Pentium and a PPC 601 in sophistication, has an FP unit, two-way issue and
      out-of-order completion
    loc: p159
    quote: >-
      The (presumably new Chinook-level) core seems to be some-where between a Pentium and a PPC 601 in sophistication.
      There appears to be an FP unit (though perhaps without NEON capabilities) and 2-way issue.
    method: patent-reading
    derivation: inferred
    value: 2
    unit: instr/cycle
    hedge: "presumably ... seems to be"
    supports: []
    chip: post-m1
    notes: US20250094173A1 (2023).

  - id: c-mh-v8-hw-dvfs
    text: >-
      Apple's power management acts on predicted rather than past behaviour and changes settings fast enough that
      dedicated hardware does it, not the OS over long averaging windows
    loc: p220
    quote: >-
      proactive power handling (predict what the system will do rather than just do what would have been optimal over
      the most recent past), and the rate at which power settings were changed (fast enough that this required
      dedicated hardware
    derivation: inferred
    supports: []
    notes: Agrees with c-mh-v3-hw-dvfs and c-cc-clk-m1max-hw-boost.

  - id: c-mh-v8-slc-dup-tags
    text: >-
      A request that missed its cluster L2 went to the SLC, which kept a copy of the tags of every relevant cache and
      tested the address against each set
    loc: p225
    quote: >-
      The request first goes to the SLC, and in the past the SLC had a set of tags matching each relevant cache in the
      system, so the request address would be tested against all these sets of cache tags.
    derivation: inferred
    supports: []
    notes: Agrees with c-mh-v3-duplicate-tags. The 2024 directory patent replaces this (c-mh-v8-directory).

  - id: c-mh-v8-directory
    text: >-
      Apple now tracks the lines in all L2-level caches with a coherence directory at the SLC instead of duplicate tags,
      trading a little area and rare forced invalidations for lower power
    loc: p227
    quote: "So the main significance of the patent is that it tells us Apple is now using a directory."
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: US20250103496A1 (2024). Handley reads it as preparation for more L2-level caches on large chips.

  - id: c-mh-v8-directory-overflow
    text: >-
      The directory is a hashed table of 4-slot sets; when a fifth line maps to a full set, one existing line, probably
      chosen at random, is invalidated in its L2
    loc: p226
    quote: >-
      where each index refers to 4 slots. Now we can handle up to 4 hash collisions for any index ... So we're forced to
      throw away one of those pre-existing lines
    method: patent-reading
    derivation: inferred
    value: 4
    unit: ways
    hedge: "probably choosing a random slot"
    supports: []
    chip: post-m1

  - id: c-mh-v8-directory-way-bits
    text: >-
      The SLC tells an L2 which directory way holds each new line; the L2 keeps those bits in its tags and returns them
      on invalidation, so the SLC need not search the set
    loc: p228
    quote: >-
      include a few bits that state which of the four ways (ie which of the four slots) is being used by the directory
      to hold this address
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1

  - id: c-mh-v8-retry-queue
    text: >-
      A request that meets a busy line in the snoop queue or directory used to be sent back to the buffer in front of
      the memory controller and SLC; it now waits in a retry queue inside them, with separate queues per client class
    loc: p228
    quote: >-
      the request would be "rejected", meaning that it would have to go back to buffer sitting in front of the memory
      controller/SLC ... The modification of this patent is to create a dedicated retry queue
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: >-
      US20250103520A1 (2024). Requests are checked in parallel against cache tags, the directory, memory-controller
      queues and the snoop queue. Separate IO and CPU retry queues keep IO from slowing the CPU.

  - id: c-mh-v8-line-128
    text: The system line is 128 B, two CPU lines; 128 B lines move between the SLC and the L2, and 64 B lines between the L2 and the L1
    loc: p229
    quote: >-
      the system cache line length is 128B. This means a system line is two CPU lines. The system seems to handle this
      by transferring 128B lines to and from the CPU L2, while the CPU L2 transfers 64B lines
    derivation: inferred
    value: 128
    unit: B
    supports: [l2.line, slc.line]
    notes: >-
      Agrees with c-mh-v2-l2-line-128 and c-mh-v3-l2-line-128. Elsewhere he guesses a sectored SLC with lines of about
      512 B (c-mh-v8-slc-line-512).

  - id: c-mh-v8-64b-dirty
    text: >-
      Every cache up to the SLC now tracks dirtiness per 64 B half-line, where some earlier 128 B-line L2s did not,
      which trims DRAM write traffic
    loc: p229
    quote: >-
      in the past some of the L2 caches that used 128B lines might not track dirtiness at the 64B level, but now all
      caches in the system do.
    method: patent-reading
    derivation: inferred
    supports: []
    chip: post-m1
    notes: From the retry-queue patent. A 2023 patent (US12007901B2) already tracks some SLC line state per half-line, mainly for remote atomics.

  - id: c-mh-v8-m1-bw-66
    text: The base M chip of the first two generations has two memory controllers, and the M1 has about 66 GB/s of DRAM bandwidth
    loc: p229
    quote: >-
      the M has two, the Pro has four, and the Max has eight. ... meant the relevant A and M1 had 33 and 66GB/s, while
      Pro and Max were at 200 and 400
    method: secondhand
    derivation: reported
    value: 66
    unit: GB/s
    approx: true
    supports: [memctrl.peak_bw]
    notes: >-
      He counts 64-bit controllers; c-mh-v3-m1-one-mc-unit counts one unit on the M1. The M1 uses LPDDR4X-4266, a
      68.256 GB/s peak (c-mh-v2-lpddr4x-peak).

  - id: c-mh-v8-m1pro-bw
    text: The M1 Pro has four memory controllers and about 200 GB/s of DRAM bandwidth
    loc: p229
    quote: "the M has two, the Pro has four, and the Max has eight. ... while Pro and Max were at 200 and 400"
    method: secondhand
    derivation: reported
    value: 200
    unit: GB/s
    approx: true
    supports: []
    chip: m1pro

  - id: c-mh-v8-m1max-bw
    text: >-
      The M1 Max has eight memory controllers and about 400 GB/s of DRAM bandwidth, but the CPU clusters cannot use all
      of it; only the GPU can
    loc: p229
    quote: >-
      while Pro and Max were at 200 and 400; also for Max not all this bandwidth was available to the CPU clusters,
      only the GPUs could fully exploit it
    method: secondhand
    derivation: reported
    value: 400
    unit: GB/s
    approx: true
    supports: []
    chip: m1max
    notes: Agrees with c-mh-v2-m1max-core-100 and c-mh-v3-fabric-100gbs (about 100 GB/s per CPU cluster).

  - id: c-mh-v8-m4-bw
    text: The M4 has two memory controllers and about 120 GB/s of DRAM bandwidth
    loc: p230
    quote: "M4 has two memory controllers and bandwidth of 140 GB/s (actually 120, probably using slightly slower DRAM)"
    method: secondhand
    derivation: reported
    value: 120
    unit: GB/s
    approx: true
    supports: []
    chip: m4
    notes: His scheme gives 140 GB/s; the real 120 GB/s he puts down to slightly slower DRAM.

  - id: c-mh-v8-m4pro-bw
    text: The M4 Pro has four memory controllers and about 280 GB/s of DRAM bandwidth
    loc: p230
    quote: "M4 Pro has four controllers and bandwidth of 280 GB/s"
    method: secondhand
    derivation: reported
    value: 280
    unit: GB/s
    approx: true
    supports: []
    chip: m4pro

  - id: c-mh-v8-m4max-bw
    text: >-
      The full M4 Max has eight memory controllers and about 560 GB/s; the binned M4 Max disables two, leaving six and
      about 420 GB/s
    loc: p230
    quote: >-
      M4 Max cheap has 6 controllers and bandwidth of 420 GB/s M4 Max expensive has 8 controllers and bandwidth of 560
      GB/s
    method: secondhand
    derivation: reported
    value: 560
    unit: GB/s
    approx: true
    supports: []
    chip: m4max
    notes: >-
      The binned part's 36 GB is six 6 GB DRAMs. Handley credits a new split of work between network and memory
      controller with making controllers easy to disable, probably at startup.

new_params:
  l1i.assoc: {block: l1i, name: L1I associativity, unit: ways}
  memctrl.peak_bw: {block: memctrl, name: Peak DRAM bandwidth (chip), unit: GB/s}

new_mechanisms:
  biased_branch_filter:
    name: Biased-branch filtering in the front end
    status: speculative
    description: >-
      Branches, indirect branches and CSELs that always go one way are marked at the I-cache, handled as jumps, NOPs
      or moves, kept out of the main predictors and checked on a lightweight branch unit.
    params: []
    sim_switch: null
    detection_rule: >-
      adding many always-taken branches does not raise the misprediction rate of history-dependent branches, while the
      first flip of such a branch costs a full mispredict
  trace_cache:
    name: Trace cache built on stable taken branches
    status: speculative
    description: >-
      Straight-line runs joined by stable taken branches are copied from the instruction queue into a trace cache, so
      one fetch can cross several taken branches.
    params: []
    sim_switch: null
    detection_rule: a loop body joined by always-taken branches sustains more than one taken branch per cycle
  prefetch_deny_list:
    name: Prefetch deny list
    status: speculative
    description: >-
      Addresses of prefetched lines evicted unused enter a small counted table that pushes back or drops later
      prefetches to them.
    params: []
    sim_switch: null
    detection_rule: >-
      a pattern whose prefetched lines are never used stops adding DRAM traffic after a few repetitions, and resumes
      once the lines are used on demand
  hierarchical_store_queue:
    name: Hierarchical store queue
    status: speculative
    description: >-
      A primary store queue holds the oldest stores, serves three load searches at once and writes to the L1; younger
      stores wait in a slower secondary queue searched one load at a time.
    params: [sq.entries, lsu.store_load_latency]
    sim_switch: null
    detection_rule: >-
      with many older stores in flight, forwarding from one of the youngest stores takes about 11 cycles instead of
      about 4
  early_barrier_completion:
    name: Early barrier completion
    status: speculative
    description: >-
      ISB and DSB flush younger work at decode and complete once the relevant older instructions finish, poisoning
      rare conflicting instructions instead of waiting for the barrier to reach the ROB head.
    params: []
    sim_switch: null
    detection_rule: >-
      an ISB or DSB costs little more than a refetch when no older memory or system-register work is pending, and its
      cost grows with outstanding older loads and stores rather than with older ALU work
  coherence_directory:
    name: Coherence directory at the SLC
    status: speculative
    description: >-
      A hashed, set-associative directory at the SLC records which L2-level caches hold each line, replacing duplicate
      tags; a set overflow invalidates a line in its L2.
    params: []
    sim_switch: null
    detection_rule: >-
      lines cached in several L2s are invalidated well below the L2s' combined capacity when their addresses crowd one
      directory set
  ipv_replacement:
    name: Criticality-aware replacement vectors
    status: speculative
    description: >-
      Cache replacement order is updated by small insertion/promotion vectors chosen by each line's prefetched and
      critical bits.
    params: []
    sim_switch: null
    detection_rule: >-
      in a contended set, prefetched lines never used are evicted before demand lines of the same age, and
      page-table or instruction lines outlast both

