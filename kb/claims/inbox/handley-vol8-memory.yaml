  lsu_virtual_prefetch: [c-mh-v8-prefetch-lsu]
  content_directed_prefetch: [c-mh-v8-prefetch-kinds, c-mh-v8-cdp-lsu]
  decoupled_fetch: [c-mh-v8-three-engines]
  l1i_coupled_btb: [c-mh-v8-nfp-hysteresis, c-mh-v8-pred-stages]
  biased_branch_filter: [c-mh-v8-bias-m3-m4, c-mh-v8-bias-bits, c-mh-v8-bias-table, c-mh-v8-bias-skip-tage,
    c-mh-v8-light-branch-unit, c-mh-v8-biased-indirect, c-mh-v8-biased-csel]
  trace_cache: [c-mh-v8-trace-cache, c-mh-v8-trace-well-biased, c-mh-v8-fetch-pred-sizes, c-mh-v8-trace-groups]
  prefetch_deny_list: [c-mh-v8-deny-list, c-mh-v8-deny-list-entry, c-mh-v8-deny-list-ration]
  hierarchical_store_queue: [c-mh-v8-hsq-two-queues, c-mh-v8-hsq-search-width, c-mh-v8-hsq-fast-4, c-mh-v8-hsq-slow-11,
    c-mh-v8-hsq-banks, c-mh-v8-hsq-split-loads]
  early_barrier_completion: [c-mh-v8-isb-decode-flush, c-mh-v8-isb-tlbi, c-mh-v8-dsb-early, c-mh-v8-tlbi-dsb-poison,
    c-mh-v8-remote-tlbi-drain, c-mh-v8-translation-barrier]
  coherence_directory: [c-mh-v8-directory, c-mh-v8-directory-overflow, c-mh-v8-directory-way-bits]
  coherence_duplicate_tags: [c-mh-v8-slc-dup-tags]
  ipv_replacement: [c-mh-v8-ipv-replacement]
  power_estimator_throttle: [c-mh-v8-hw-dvfs]
