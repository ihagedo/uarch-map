# deng-sme.yaml
# Chencheng Deng, Weiling Yang, Jianbin Fang and Dezun Dong, 2025
# How the M4 Pro's SME units, the descendants of AMX, share the L2 and the cores' TLBs, order against core memory accesses and reach their throughput limits.
session: deng-sme
source: arxiv-2512-21473

claims:
  - id: c-deng-l2-only
    text: The SME unit shares only the L2 with the CPU cores and does not use their L1 caches
    loc: p005
    quote: "Since SME only shares the L2 cache with CPU cores, we map blocks that traditionally reside in L2/L3 caches to the shared L2 cache, without reserving L1 cache space."
    derivation: measured
    supports: []
    chip: m4
    notes: Their microbenchmarks show the L2 sharing. Agrees with c-dj-amx-l2 and c-mh-v3-amx-from-l2 for the M1.
  - id: c-deng-tlb
    text: The core's load/store unit translates SME addresses, so the core's L1D TLB and the shared L2 TLB cover SME accesses
    loc: p005
    quote: "Address translation is handled by the core load/store unit, with both the core L1D TLB and the shared L2 TLB covering SME unit accesses."
    derivation: inferred
    supports: []
    chip: m4
  - id: c-deng-ordering
    text: The CPU core and the SME unit are ordered against each other in memory, and both touching the same memory at once causes severe pipeline stalls
    loc: p004
    quote: "We further observe that a memory ordering relationship exists between the CPU core and the SME unit. Simultaneous access to the same memory by both can cause severe pipeline stalls."
    derivation: measured
    supports: []
    chip: m4
    notes: They keep SME buffers off the stack and away from data the core is using. Agrees with c-dj-amx-mix-slow for the M1.
  - id: c-deng-four-tiles
    text: One thread reaches peak outer-product throughput only when it accumulates into all four 32-bit ZA tiles
    loc: p003
    quote: "As shown in Fig. 2, utilizing four tiles ensures reaching the maximum throughput."
    method: throughput
    derivation: measured
    value: 4
    unit: tiles
    supports: []
    chip: m4
    notes: Matches the four independent Z accumulators one M1 core needs (c-cx-matfp64-sat).
  - id: c-deng-int8-2x
    text: An 8-bit integer outer product reaches 4010 GOPS on one thread, twice the 2006 of every other non-fp64 type
    loc: p003
    quote: "outer product instruction achieves 4010 GOPS with four ZA tiles in a single thread, whereas all other precisions (INT16, INT32, FP16, BF16, and FP32) peak at 2006 GOPS or GFLOPS."
    method: throughput
    derivation: measured
    value: 4010
    unit: GOPS
    supports: []
    chip: m4
  - id: c-deng-fp64-quarter
    text: fp64 outer products reach only 501 GFLOPS, a quarter of the fp32 rate
    loc: p003
    quote: "FP64 performance is limited to 501 GFLOPS, representing only one-quarter of the throughput of other non-INT8 precisions"
    method: throughput
    derivation: measured
    value: 501
    unit: GFLOPS
    supports: []
    chip: m4
    notes: The same fp32 to fp64 ratio c-cx-fp32-4x measures on the M1 Max.
  - id: c-deng-two-threads
    text: A second thread doubles outer-product throughput, while more threads raise it only a little, as threads spread over clusters
    loc: p004
    quote: "As the thread count increases, the scheduler attempts to distribute threads across clusters for load balancing, and throughput peaks at 8375 GOPS."
    method: throughput
    derivation: measured
    value: 8375
    unit: GOPS
    supports: []
    chip: m4
    notes: Two threads give 8020 GOPS of 8-bit integer outer products against 4010 for one.
  - id: c-deng-units
    text: The M4 Pro has one SME unit per cluster, two fast ones for the P-clusters and a slower one for the E-cluster, shared by the cores of each cluster
    loc: p004
    quote: "suggests that the M4 Pro contains two high-throughput SME units associated with the P-core clusters and one lower-throughput unit with the E-core cluster"
    derivation: inferred
    hedge: "suggests"
    supports: []
    chip: m4

mechanism_claims:
  amx_datapath: [c-deng-l2-only, c-deng-int8-2x, c-deng-fp64-quarter]
  amx_lsu_issue: [c-deng-tlb]
  coprocessor_ordering_table: [c-deng-ordering]
  amx_shared_contexts: [c-deng-two-threads, c-deng-units]
  amx_z_dependency_window: [c-deng-four-tiles]
