# handley-vol4-predict.yaml
# Maynard Handley, 2025
# Direction, indirect and return prediction, loops and decode, largely read from Apple patents (M1 Explainer vol 4).
session: handley-vol4-predict
source: handley-vol4

claims:
  - id: c-mh-v4-ogehl-2012
    text: >-
      Per Apple's 2012 patent, the branch direction predictor of that time was O-GEHL, a perceptron-weighted
      predictor combining tables of several history lengths
    loc: p051
    quote: "The Branch Direction Predictor (as of 2012) was the O-GEHL version of the Perceptron predictor"
    method: patent-reading
    derivation: inferred
    value: o-gehl
    supports: []
    notes: US20140089647A1 (2012). Superseded by the TAGE-like design (c-mh-v4-tage)
  - id: c-mh-v4-bp-confidence-retrain
    text: >-
      Per the 2012 patent, each predicted branch carries a confident/weak flag and the table indices used, so the
      predictor is retrained on mispredictions and on correct but weak predictions, and not otherwise
    loc: p052
    quote: >-
      what the Branch Predictor actually feeds forward, along with the predicted branch outcome (all attached to the
      Branch instruction) is ... an indication of whether the branch was confidently or weakly predicted
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20140089647A1 (2012). Handley suggests a lower-power variant keeps the indices in a local circular table
      and sends only a pointer with the branch
  - id: c-mh-v4-bp-line-rows
    text: >-
      Per the 2012 patent, the direction predictor is indexed by the fetch group's cache-line address and each row
      holds a counter for every instruction slot in the line, so one lookup covers every branch in the fetch group
    loc: p053
    quote: >-
      with a single Fetch Group PC we can identify the appropriate row of the Branch Direction Predictor, which
      holds prediction data for all possible branches in that line
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20140089647A1 (2012). Handley's example (128 B line, 32 counters per row, 128 rows) is illustrative. Works
      for the global tables too because all branches in a trace share the same path history
  - id: c-mh-v4-bp-half-banks
    text: >-
      Per the 2012 patent, predictor storage is split into two halves so a fetch group spanning two lines can still
      read a full line's width, and the unused half is not powered when the group fits in half a line
    loc: p054
    quote: "the actual storage is split into two halves, so that one can always access a full line’s width of storage"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20140089647A1 (2012)
  - id: c-mh-v4-tage
    text: >-
      By 2015 Apple's direction predictor is a proper TAGE-like system (patent US10719327B1): tagged tables indexed
      by PC and increasingly long path history, best-match selection and usefulness bits
    loc: p054
    quote: "By 2015 Apple have moved on to a proper TAGE-like system, but they add one interesting twist"
    method: patent-reading
    derivation: inferred
    value: tage-like
    supports: [dirpred.kind]
    notes: >-
      Handley later calls it the M1's TAGE (c-mh-v4-m1-tage)
  - id: c-mh-v4-tage-assoc
    text: >-
      Per the 2015 patent, each TAGE table may be direct-mapped, 2-way or 4-way, with ways and sets chosen per
      table; Handley guesses 4-way for short-history tables, 2-way for intermediate and direct-mapped for long
    loc: p056
    quote: >-
      Each of the TAGE tables can be implemented not as a direct-mapped cache but as two- or four-way, with
      different tables having a different number of ways
    method: patent-reading
    derivation: inferred
    hedge: perhaps
    supports: []
    notes: >-
      US10719327B1 (2015); per-table associativity is the patent's novelty. Handley's nine tables and the 4/2/1-way
      split are his illustration
  - id: c-mh-v4-tage-sequential
    text: >-
      Per the 2015 patent, the TAGE tables are probed partly in sequence rather than all in parallel to save energy;
      Handley imagines three groups of three tables, a later group probed only if earlier ones miss or are weak
    loc: p055
    quote: "to save energy, there is some degree of sequential testing of the different tables rather than full parallel testing"
    method: patent-reading
    derivation: inferred
    hedge: "The details are not given, but one could imagine"
    supports: []
    notes: >-
      US10719327B1 (2015). Handley: not exactly TAGE's best match across all lengths, but close enough at lower
      power
  - id: c-mh-v4-tage-power-gating
    text: >-
      Per a 2016 patent, deep power-saving modes power off TAGE tables selectively, favouring tables with few
      useful entries and shorter histories; a re-powered table stays off until training gives it an entry
    loc: p056
    quote: >-
      maintain a measure of how many useful values are in each of the tables ... preferentially cut power to the
      shorter-history tables
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10223123B1 (2016)

  - id: c-mh-v4-ibp-2013-tables
    text: >-
      Per Apple's 2013 indirect predictor patent, two tables are read in parallel: a 1024-entry table indexed by a
      hash of path history and PC, and a 2-way PC table indexed by PC bits 5..9; a history-table hit wins
    loc: p057
    quote: >-
      the history table has 1024 entries (indexed by a hash of 10 bits of path data and some bits of PC data) ...
      the PC table has 32 entries
    method: patent-reading
    derivation: inferred
    value: 1024
    unit: entries
    supports: []
    notes: >-
      US9311100B2 (2013), a cascaded predictor after Driesen and Holzle. Handley says this design "is now replaced by
      something like ITTAGE/COTTAGE". The PC table is described both as 32 entries and as 2-way with two entries
      per index
  - id: c-mh-v4-ibp-2013-training
    text: >-
      Per the 2013 patent, a new indirect branch goes into the PC table if a slot is free, else the history table;
      a PC-table entry that mispredicts is marked not useful and a history-table entry is made for it
    loc: p058
    quote: >-
      When a new indirect branch is encountered, the initial impulse is classify it in the PC-based predictor. ...
      If a branch already in the PC-based predictor mispredicts, we mark its usefulness as 0
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9311100B2 (2013). Usefulness counters also arbitrate replacement in the history table
  - id: c-mh-v4-ibp-hysteresis
    text: >-
      In the 2013 indirect predictor, history-table entries carry hysteresis: an entry keeps its target after one
      misprediction and switches only after two in a row
    loc: p059
    quote: "The hysteresis value allows entries in the history-based table to make one mistake while retaining the current target."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9311100B2 (2013); Handley calls hysteresis a common Apple feature in caches
  - id: c-mh-v4-ibp-8kb
    text: >-
      Handley estimates the 2013 indirect predictor at about 1000 entries of about 8 bytes, roughly 8 KB, against the
      64 KB suggested in the ITTAGE paper
    loc: p059
    quote: >-
      the size of this predictor storage is ~1000 entries, call them 8 bytes long ... So we're talking ~8kB for the
      indirect branch predictor
    derivation: inferred
    value: 8
    unit: KB
    approx: true
    hedge: call them 8 bytes long
    supports: []
    notes: Handley's own sizing of the 2013 design (6 B of target, 2 B of tag and usefulness per entry)
  - id: c-mh-v4-ibp-m1-long-history
    text: >-
      The 2013 indirect predictor lacks ITTAGE-style very long branch history; Handley assumes the M1 has added it
    loc: p059
    quote: >-
      missing, is sophisticated use of a very long branch history as in IT-TAGE, but I would assume that by now with
      the M1 that has been corrected
    derivation: inferred
    hedge: I would assume
    supports: []
    notes: No evidence given; see c-mh-v4-ibp-ittage for the patent statement that the predictor is a TAGE variant
  - id: c-mh-v4-objc-predictor-not-m1
    text: >-
      The register-operand indirect predictor for objc_msgSend (patent US20210240477A1) is not in the A14/M1
    loc: p059
    quote: "This patent represents functionality that we know is not in the A14/M1"
    derivation: inferred
    value: false
    supports: []
    notes: >-
      Handley does not say how this is known; he links Apple's objc4 runtime header objc-bp-assist.h, which
      configures the hardware
  - id: c-mh-v4-objc-predictor-m2
    text: The register-operand indirect predictor for objc_msgSend appears to be present in the A15/M2
    loc: p059
    quote: "functionality that we know is not in the A14/M1, but appears to be present in the A15/M2"
    derivation: inferred
    value: true
    hedge: appears to be
    chip: m2
    supports: []
    notes: Handley believes WebKit's JavaScript dispatcher also uses it
  - id: c-mh-v4-mop-pred-uop
    text: >-
      Per the 2020 patent, Decode compares each BR with one configured hot PC and on a match inserts a predict uop
      before it; configuration registers also name two key registers, x16 (class) and x1 (selector)
    loc: p063
    quote: >-
      Each branch-to-register (BR) instruction in Decode is compared against the special hot PC. If there’s a match,
      then a special fake “predict” instruction is inserted before the BR
    method: patent-reading
    derivation: inferred
    chip: m2
    supports: []
    notes: >-
      US20210240477A1; the registers are set at app initialization. On the A15/M2, not the M1
      (c-mh-v4-objc-predictor-not-m1). A fake dependency through an sts register keeps the predict uop ahead of the
      BR.
  - id: c-mh-v4-mop-cache
    text: >-
      The predict uop hashes x16 and x1 into a roughly 10-bit index into a Method/Object Predictor (MOP) cache and
      redirects fetch on a hit; the MOP entry is written from a training entry when the BR retires
    loc: p064
    quote: >-
      create a hash from x16 (the class) and x1 (the method selector), using the usual xor’s and folding ...
      something like a 10-bit index, which will be looked up in the MOP (Method/Object Predictor) cache
    method: patent-reading
    derivation: inferred
    value: 10
    unit: bits
    approx: true
    hedge: something like
    chip: m2
    supports: []
    notes: US20210240477A1 (2020). The MOP cache entries carry a security tag
  - id: c-mh-v4-ibp-prev-call-pc
    text: >-
      Per a 2020 patent, for the configured hot indirect branch the indirect predictor indexes and tags with the PC
      of the previous function call instead of the branch's own PC
    loc: p066
    quote: >-
      usually we use the current PC except when that current PC equals the hot PC, in which case we use the prior
      PC
    method: patent-reading
    derivation: inferred
    chip: m2
    supports: []
    notes: >-
      US11294684B2 (2020). Placed on m2 since it relies on the hot-PC configuration of the objc_msgSend predictor, which
      Handley places on the A15/M2; he does not name a chip for this patent himself
  - id: c-mh-v4-ibp-ittage
    text: Per a 2020 patent, Apple's indirect branch predictor is a TAGE variant, something like ITTAGE or COTTAGE
    loc: p066
    quote: "We begin by confirming that the IBP is a TAGE variant, something like ITTAGE or COTTAGE"
    method: patent-reading
    derivation: inferred
    value: ittage-like
    hedge: something like
    supports: [indpred.kind]
    notes: >-
      US11294684B2 (2020). Handley says the 2013 two-table design "is now replaced by something like ITTAGE/COTTAGE";
      the 2016 branch-information patent also shows TAGE elements in the indirect predictor (c-mh-v4-ibp-btp-hit)

  - id: c-mh-v4-loop-buffers-m1
    text: >-
      The M1 has several kinds of loop buffer, mainly to save energy, since a loop's backward branch already costs it
      nothing; simpler loops get the more aggressive savings
    loc: p066
    quote: >-
      M1 already has that cost down to zero. Even so M1 incorporates a variety of loop buffers, mainly, but not
      exclusively to save energy.
    derivation: inferred
    supports: []
    notes: No method given; the section that follows reads Apple's 2012-2014 loop patents
  - id: c-mh-v4-loop-detect
    text: >-
      Per a 2012 patent, a short backward branch starts loop detection; when the loop-back distance repeats with no
      branches in the body a few times (say three), the loop runs from the loop buffer; nothing is kept across encounters
    loc: p068
    quote: "If we increment detection mode successfully enough times (say three times) then we assume we have a loop"
    method: patent-reading
    derivation: inferred
    hedge: say three times
    supports: []
    notes: US9557999B2 (2012)
  - id: c-mh-v4-loop-buffer-after-decode
    text: >-
      In the 2012 patent the loop buffer sits after Decode and holds uops, so Decode is skipped too; later patents seem
      to place it before Decode, running loops from the instruction queue
    loc: p068
    quote: "The loop buffer apparently lives after Decode. ... the cost of Decode can also be avoided."
    method: patent-reading
    derivation: inferred
    hedge: apparently
    supports: []
    notes: US9557999B2 (2012); Handley is unsure which placement later designs keep
  - id: c-mh-v4-loop-8-branches
    text: >-
      The 2012 loop buffer accepts loops containing forward conditional branches whose outcomes do not change between
      iterations, tracking up to 8 of them by offset from the loop start; indirect branches disqualify a loop
    loc: p068
    quote: >-
      we have a table that can record up to 8 conditional branches, recording specifically how many instructions from
      the start of the loop till the branch
    method: patent-reading
    derivation: inferred
    value: 8
    unit: branches
    supports: []
    notes: US9557999B2 (2012). A misprediction flushes and marks the backward branch as not a loop for a while
  - id: c-mh-v4-fetch-one-group
    text: >-
      In the fetch scheme Handley describes for Apple's cores, only one fetch group (a run of instructions ending at a
      taken branch) is fetched per cycle, so a 3-instruction loop runs at most 3 instructions per cycle
    loc: p069
    quote: >-
      only one Fetch Group (ie trace of instructions up to a taken branch) is acquired per cycle
    derivation: inferred
    supports: []
    notes: Consistent with fetch.taken_per_cycle = 1; Handley states it as a property of the scheme, not a measurement
  - id: c-mh-v4-loop-packing
    text: >-
      Per a 2012 patent, a short loop body is replicated in the loop buffer as many times as fits, so dispatch is not
      limited to one iteration (one fetch group) per cycle
    loc: p069
    quote: >-
      the loop body will be replicated in the buffer as many times as will fit. This bypasses the Fetch limit.
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US9753733B2 (2012). Dispatch from the buffer is "6 at a time in 2012, 8 at a time now". Neither 2012 patent
      says how the loop is exited other than by a misprediction
  - id: c-mh-v4-loop-buffer-96
    text: >-
      The 2012 loop-packing patent suggests a loop buffer of 16 rows of 6 slots, about 96 uops, matching the 6-wide
      decode of A7-class cores
    loc: p070
    quote: >-
      arranged as 16 rows of 6 slots (6 slots because decode for that generation of A7-class CPUs had 6-wide
      decode); so able to hold about 96 ops
    method: patent-reading
    derivation: inferred
    value: 96
    unit: uops
    approx: true
    supports: []
    notes: US9753733B2 (2012), A7 generation; no M1 loop-buffer size is given. Handley compares Skylake's 64-uop IDQ
  - id: c-mh-v4-l0-cache
    text: >-
      Per a 2014 patent, instructions can come from four sources: normal fetch with the I-cache and full predictors,
      a small L0 cache (probably direct mapped) sequenced by a simple local predictor, a loop buffer, and a trace cache
    loc: p071
    quote: "an L0 cache (smaller and lower power than the I cache, probably direct mapped)"
    method: patent-reading
    derivation: inferred
    hedge: probably
    supports: []
    notes: >-
      US20150205725A1 (2014). The L0 serves loops with mostly predictable internal branches that fail the loop-buffer
      tests; Handley guesses its predictor is gshare-like. No details on when the trace cache is used
  - id: c-mh-v4-l0-size
    text: >-
      The L0 size is not given; other patents suggest it is about the size of the loop buffer, itself about the size
      of the fetch queue: maybe 8 to 12 lines of 16 instructions
    loc: p072
    quote: >-
      it’s much the same size as the Loop Buffer, which is much the same size as the Fetch Queue; so maybe 8 to 12
      lines each holding 16 instructions, something like that
    derivation: inferred
    value: 10
    unit: lines
    approx: true
    hedge: maybe ... something like that
    supports: []
    notes: >-
      Range 8-12 lines of 16 instructions; value is the midpoint. Bears on iq.depth (the fetch queue), but is a guess
      stated in lines
  - id: c-mh-v4-loop-table
    text: >-
      Per a 2014 patent, a previous-loop table records each loop's start, end and iteration count and the kinds and
      variability of the branches in its body, and updates itself when these change
    loc: p072
    quote: >-
      a “previous loop table” has now been added to the system. This table records some obvious things like the loop,
      start, end, and iteration count
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US9524011B2 (2014). Unclear whether the table holds several loops or several branches of one nested loop, or
      whether it is used on later encounters
  - id: c-mh-v4-loop-iq-mode
    text: >-
      Per the 2014 tiered patent, after two or three iterations a loop runs from the instruction queue with fetch and
      the I-cache asleep but direction prediction awake; after about 20 iterations it may move to the loop buffer or L0
    loc: p073
    quote: >-
      This puts Fetch and the I-cache to sleep (but Branch Direction Prediction stays awake) and we run the loop out of
      the Instruction Queue
    method: patent-reading
    derivation: inferred
    value: 20
    unit: iterations
    approx: true
    hedge: 20 iterations or so
    supports: []
    notes: >-
      US9524011B2 (2014). Loop mode starts "perhaps after just two or three iterations". To enter it, fetch must
      force the loop body into the instruction queue instead of bypassing it to Decode
  - id: c-mh-v4-loop-exit-predictor
    text: >-
      Per a 2014 patent, while a loop runs from the loop buffer or L0 the direction predictor stays on to predict the
      exit until branch history saturates; loops whose exit keeps mispredicting turn it off from the start
    loc: p074
    quote: >-
      we keep the Branch Direction Predictor alive, to (hopefully) predict the exit condition ... for as long we have
      not saturated the Branch History vectors
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9471322B2 (2014). Per-loop state is kept in an Early Loop Buffer Mode Table

  - id: c-mh-v4-bit-tables
    text: >-
      A Branch Information Table and a Taken Branch Information Table hold each branch's predictor state (RAS top of
      stack, path histories, targets) from Decode to Retire; at retirement it is sent to the predictors for training
    loc: p081
    quote: >-
      there are two large subtables, the BIT and the TBIT (Taken Branch Information Table) each with subsections for
      different types of branch
    method: patent-reading
    derivation: inferred
    supports: []
    notes: Detailed from US10175982B1 (2016) in c-mh-v4-bit-60 and c-mh-v4-tbit-96
  - id: c-mh-v4-ras-two
    text: >-
      Per Apple's 2011 RAS patent, there are two return stacks, a small speculative RAS used by fetch and an
      Execution RAS kept as a linked list, against about five in Intel's design
    loc: p081
    quote: >-
      So Apple have one for Fetch, and another that's modified at Execution. In particular the Execution RAS
      (implemented in the linked list form)
    method: patent-reading
    derivation: inferred
    value: 2
    unit: stacks
    supports: []
    notes: >-
      US9354886B2 (2011). The patent's speculative RAS is Handley's MiniRAS. A "first time" bit in the BIT keeps load
      replay of RET or BR from pushing or popping the Execution RAS twice; the 2013 redesign supersedes this
  - id: c-mh-v4-ras-linked-guess
    text: >-
      Handley's guess: the Execution RAS is a pure linked list in an array of perhaps 90 entries with valid bits, an
      entry freed when its RET retires, so overflow comes only from very deep call nesting
    loc: p083
    quote: >-
      treat the structure as a pure linked list, implemented with a finite array of node-sized entries (say 90 or so),
      where each entry has a “valid” bit
    derivation: inferred
    value: 90
    unit: entries
    approx: true
    hedge: Here's my guess as to what Apple does
    supports: []
    notes: >-
      "say 90 or so" is illustrative, the size of a node array in a guessed implementation, not a return-stack depth
      (cf. the 50-entry return stack, c-cc-oryon-m1-ras-50). Handley: "we're already on such a limb"
  - id: c-mh-v4-ras-at-decode
    text: >-
      Per a 2013 patent, the main RAS is maintained at Decode, pushed on calls and popped on returns there, so load
      replay no longer threatens it
    loc: p085
    quote: >-
      the main RAS (what was previously called the Execution RAS) is now maintained at Decode rather than at Execute
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9405544B2 (2013), described by Handley as a 2014 design
  - id: c-mh-v4-ras-mini
    text: >-
      In the 2013 design the fetch-side MiniRAS only covers returns that follow calls not yet seen by Decode, tracked
      by call and return counts between Fetch and Decode, so it is much smaller than the main RAS
    loc: p085
    quote: >-
      The MiniRAS is only required if there is a return following a very recent call, so that that the call has not
      yet propagated to the primary RAS
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9405544B2 (2013)
  - id: c-mh-v4-predecode-call-ret
    text: >-
      Predecode bits mark calls and returns, so for lines not yet in the fetch predictor, fetch takes a return's target
      from the MiniRAS and pauses after a call until a predictor or execution supplies the target
    loc: p085
    quote: >-
      from the predecode bits, it will know that the Fetch Group it is sending downstream includes a call or a return
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9405544B2 (2013)

  - id: c-mh-v4-pac-ras
    text: >-
      Per a 2016 patent, pointer authentication codes in the high bits of return addresses are checked as part of the
      logic that reads and writes the RAS
    loc: p086
    quote: >-
      PAC (Pointer Authentication) stuff that encodes the 2015 tag in a few high bits of the return address ... always
      checked as part of logic that reads and writes the RAS
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US10409600B1 (2016). The 2015 forerunner (US10867031B2) used a RAS misprediction to trigger call/return tag
      checks; Handley is not sure it was ever built
  - id: c-mh-v4-bp-security-tag
    text: >-
      Handley reads the 2018 predictor-security patent as adding a security tag (protection level, process ID, VM ID,
      high PC bits) to predictor entries; if it does not match the machine state, the prediction is not used
    loc: p086
    quote: >-
      augment that tag with a security tag which holds, among other things, the protection level, the process ID, the
      VM ID, and some of the high bits of the PC
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US20200192673A1; the patent's own claim is c-pat-us20200192673a1-context-encrypted-targets. Handley says such a
      tag "is in fact implemented to some extent", and high PC bits can separate JIT code from its host.

  - id: c-mh-v4-predecode-offset
    text: >-
      Per a 2014 patent, predecode on I-cache fill stores the low 14 bits (page offset) of each PC-relative branch
      target, so only the upper bits are added at use and a target lookup can start at once, safe under aliasing
    loc: p088
    quote: >-
      Suppose that rather than calculating the entire target address we calculate only the lowest fourteen bits.
    method: patent-reading
    derivation: inferred
    value: 14
    unit: bits
    supports: []
    notes: >-
      US9940262B2 (2014). Full targets would break when a physically tagged line is shared by processes that map a
      library at different virtual addresses
  - id: c-mh-v4-predecode-undef
    text: >-
      Per a 2014 patent, predecode replaces every undefined instruction encoding with a single undefined value, so
      Decode checks for only one
    loc: p088
    quote: 'replace them with a single "undefined instruction" value'
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20160011875A1 (2014)

  - id: c-mh-v4-seq-line-power
    text: >-
      Per a 2010 patent, the ITLB and tag lookups are skipped when sequential fetch reads from the same I-cache line as
      in the previous cycle
    loc: p089
    quote: >-
      suppresses the ITLB and tags lookup in the case where sequential Fetch reads instructions from the same I-cache
      line as was accessed in the previous cycle
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US8914580B2 (2010)
  - id: c-mh-v4-seq-way-pred
    text: >-
      Per a 2013 patent, a sequential way predictor gives the I-cache ways of the next few sequential lines from a
      fetch PC, so only those ways are precharged and tag lookups are skipped
    loc: p090
    quote: >-
      Way Predictor that, when given a Fetch PC, gives the way information for say the next four sequen-tial cache lines
    method: patent-reading
    derivation: inferred
    hedge: say the next four
    supports: []
    notes: >-
      US9311098B2 (2013). Handley guesses the last ITLB translation is held in a register in Fetch to skip the TLB too
  - id: c-mh-v4-fetch-pred-gating
    text: >-
      Per a 2013 patent, fetch-predictor entries record which kinds of branch the next fetch group contains, so the
      conditional, indirect and return predictors can be clock-gated when not needed
    loc: p090
    quote: >-
      since the Fetch Predictor contains information about whether the next Fetch Group contains conditional
      branches, indirect calls, and returns
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10901484B2 (2013). Handley says the patent's details may be obsolete relative to the M1
  - id: c-mh-v4-fetch-pred-split
    text: >-
      In Handley's reading of the same patent, the fetch predictor is two PC-indexed arrays, one for groups ending in
      a taken branch (with target) and one for fall-through groups, letting predictors sleep two or three groups ahead
    loc: p090
    quote: "the Fetch Predictor array is split into two pieces. They are both indexed by the current PC"
    method: patent-reading
    derivation: inferred
    hedge: I think what they are trying to say is
    supports: []
    notes: US10901484B2 (2013)
  - id: c-mh-v4-fetch-bitmaps
    text: >-
      The fetch prediction unit keeps two bitmaps over the I-cache lines, recording whether a line's tag and TLB
      result are held in the fetch predictor and whether the line has changed, so tag and ITLB lookups can be skipped
    loc: p091
    quote: "the Fetch Prediction Unit holds two bitmaps of every line of the I-cache"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10901484B2 (2013)
  - id: c-mh-v4-subroutine-power
    text: >-
      Per a 2016 patent, on a call fetch reads the whole line's predecode bits and stores them in the RAS, so after the
      return the conditional and indirect predictors can be clock-gated and the fetch width set
    loc: p092
    quote: >-
      load the entire line’s worth of pre-decode bits ... We can store this information in the Return Address Stack
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10203959B1 (2016); helps only for calls not already held in the predictors

  - id: c-mh-v4-m1-tage
    text: >-
      Handley calls the M1's main direction predictor a TAGE system and suggests a small companion loop predictor so
      TAGE could be shut down soon after loop mode starts
    loc: p093
    quote: "a nice, small, companion predictor for the primary M1 TAGE system"
    derivation: inferred
    value: tage-like
    supports: [dirpred.kind]
    notes: Aside in the fetch summary; rests on the patent reading in c-mh-v4-tage, no measurement
  - id: c-mh-v4-nfp-contents
    text: >-
      The Next Fetch Predictor (Apple's BTB) is a cache indexed by the previous fetch PC that returns the next trace:
      target PC, length, energy data such as TLB result and I-cache way, maybe a return marker
    loc: p094
    quote: >-
      The NFP (ie the Next Fetch Predictor, ie what everyone else calls the BTB) is a cache. The index used for lookup
      is the previous PC
    derivation: inferred
    supports: []
  - id: c-mh-v4-nfp-assoc
    text: The Next Fetch Predictor has been something like 512 sets of 2 ways, perhaps 256 sets of 4 ways in future
    loc: p094
    quote: "In the past something like 512 sets each of 2 ways; maybe in future 256 sets each of 4 ways?"
    derivation: inferred
    value: 2
    unit: ways
    hedge: something like
    supports: []
    notes: >-
      "In the past" names no chip, and no source or method is given. Handley adds that Apple may prefer 2 ways (lower
      power) where others use 4, with set index from the low 9 PC bits and about 10 tag bits, probably hashed with the
      ASID

  - id: c-mh-v4-checkpoints
    text: >-
      Apple probably adds checkpoints to the History File for faster misprediction recovery; a 2013 patent refers to
      them, but no details are known
    loc: p097
    quote: >-
      It’s probable that Apple uses these, and we have a patent from 2013 that refers to them, but no further details.
    method: patent-reading
    derivation: inferred
    hedge: It’s probable
    supports: []
    notes: US9311084B2 (2013, RDA checkpoint optimization); the RDA itself has since been replaced
  - id: c-mh-v4-not-taken-untrained
    text: >-
      Predicted-not-taken branches are meant to be almost NOPs: always-not-taken branches never enter the predictor
      tables, and finding no prediction means predicting not taken
    loc: p097
    quote: "if a not-taken branch is encountered, I think we don't bother training on it"
    derivation: inferred
    hedge: I think
    supports: []
    notes: Handley guesses this holds for about half of branches, saving table space and training effort
  - id: c-mh-v4-bit-60
    text: >-
      The example in Apple's 2016 branch-information patent has a 60-entry BIT, a circular queue allocated at Decode
      for every branch and holding pending branches between allocation and retirement
    loc: p098
    quote: "in the example given in the patent, they suggest the BIT holds 60 entries, while the TBIT holds 96 entries"
    method: patent-reading
    derivation: inferred
    value: 60
    unit: entries
    supports: []
    notes: >-
      US10175982B1 (2016), example values only. Handley does not know the current sizes or whether the structures
      still exist in this form
  - id: c-mh-v4-tbit-96
    text: >-
      The same patent example has a 96-entry TBIT, allocated for predicted-taken branches (or at execute for mispredicted
      not-taken ones); Handley reads the extra 36 entries as retired branches still awaiting predictor training
    loc: p098
    quote: "in the example given in the patent, they suggest the BIT holds 60 entries, while the TBIT holds 96 entries"
    method: patent-reading
    derivation: inferred
    value: 96
    unit: entries
    supports: []
    notes: >-
      US10175982B1 (2016), example values only. BIT slices: all branches, conditional; TBIT slices: indirect, all
      taken, call/return, with the BIT conditional slice and TBIT indirect slice sharing entry size
  - id: c-mh-v4-path-histories
    text: >-
      The 2016 patent keeps two path histories, GHIST (shifted one bit and XORed with each taken branch's target) and
      PHIST (shifted one bit and XORed with 4 bits of the branch PC), and no direction history
    loc: p100
    quote: >-
      The GHIST vector is the “target path history” vector, created by, on taken branches ... xor’ing in 4 bits of new
      branch PC
    method: patent-reading
    derivation: inferred
    value: 4
    unit: bits
    supports: []
    notes: >-
      US10175982B1 (2016). Gives no history length. Handley expects such details (4 bits, update only on taken branches)
      to have changed since
  - id: c-mh-v4-ibp-btp-hit
    text: >-
      The 2016 patent's fields show the indirect predictor using TAGE elements (multiple tables, usefulness bits) plus
      a BTP hit table, probably to power the predictor down when it is rarely used
    loc: p101
    quote: >-
      They suggest that the Indirect Branch Predictor uses elements of TAGE (like multiple tables and U bits), as
      expected, but also add a “BTP hit table”
    method: patent-reading
    derivation: inferred
    hedge: probably
    supports: []
    notes: US10175982B1 (2016); corroborates c-mh-v4-ibp-ittage
  - id: c-mh-v4-bit-overwrite
    text: >-
      Per the 2016 patent, a full BIT or TBIT does not stall the core: older entries are overwritten because they only
      serve predictor training, so a long run of not-taken branches may show no BIT limit
    loc: p101
    quote: "if one of the tables ever becomes full, the machinery should just keep going overwriting older entries"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US10175982B1 (2016). Handley's point is that a not-taken-branch probe for the BIT size might not work

  - id: c-mh-v4-iq-bypass
    text: >-
      Fetch draws from up to two cache lines per cycle; fetched instructions go straight to Decode when the
      instruction queue is empty and into the queue otherwise, possibly split between both in one cycle
    loc: p102
    quote: >-
      Fetch has to pull in some number of instructions from up to two cache lines ... if the Instruction Queue is
      empty, then the Fetch’ed instructions should be delivered directly to Decode without buffering
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US10445091B1 (2016), which Handley says describes the A6. Its improvement treats the fetch buffer as a circular
      buffer to cut mux logic

  - id: c-mh-v4-cold-start-fetch
    text: >-
      Per a 2016 patent, after a cold start (power-up with empty caches) instruction fetch from the L2 turns aggressive,
      each one-line fetch becoming three lines
    loc: p105
    quote: >-
      during the aggressive phase of a cold start, replacing each fetch of a single line from the L2 with three lines
    method: patent-reading
    derivation: inferred
    value: 3
    unit: lines
    hedge: details have surely changed
    supports: []
    notes: US10007616B1 (2016)
  - id: c-mh-v4-cold-start-tage
    text: >-
      In the same cold-start phase a new branch is written into four TAGE entries instead of the usual one or two,
      while the tables hold little useful data
    loc: p105
    quote: "during the aggressive phase of a cold start ... four (rather than two or one) TAGE entries"
    method: patent-reading
    derivation: inferred
    value: 4
    unit: entries
    hedge: details have surely changed
    supports: []
    notes: US10007616B1 (2016)
  - id: c-mh-v4-prefetch-boost
    text: >-
      Per a 2017 patent, the L1 instruction and data prefetchers turn more aggressive when demand or prefetch misses
      take longer than expected to return (missing in L2 or the SLC)
    loc: p105
    quote: "the L1 prefetcher monitors whether demand or prefetch misses take longer than expected to return"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: >-
      US10346309B1 (2017). Handley's queue sizes (64 entries, 12/32/64 active) are explicitly made up; he thinks Apple
      does not yet have a decoupled prefetch-address engine

  - id: c-mh-v4-decode-8
    text: The M1 has 8 decoders
    loc: p106
    quote: "Each Decoder (so 8 as of M1) is a block that consists of a few sub-decoders"
    derivation: reported
    value: 8
    unit: instr/cycle
    supports: [decode.width]
    notes: Aside with no method; Handley's own measurement of the 8-wide front end is in vol 1 (c-mh-v1-frontend-8)
  - id: c-mh-v4-decode-vector-gating
    text: >-
      Per a 2010 patent, each decoder has integer, load/store, vector-integer and vector-FP sub-decoders; the vector
      ones stay gated off until needed, woken by a small table of vector PCs and kept awake by a timer
    loc: p106
    quote: >-
      the instruction to be decoded is fed directly to the Integer and Load/Store decoders, but is usually blocked from
      going to the Vector Decoders
    method: patent-reading
    derivation: inferred
    hedge: probably still holds
    supports: []
    notes: >-
      US20120079249A1 (2010, Swift era). A vector instruction that finds its decoder asleep loops round for another
      pass, costing at least a cycle
  - id: c-mh-v4-trace-length
    text: >-
      Because the fetch predictor skips expected-not-taken branches, the average fetched trace is around 10
      instructions, an adequate but tight match for 8 instructions per cycle
    loc: p107
    quote: "which means that the average length of a trace is around 10 instructions or so"
    derivation: inferred
    value: 10
    unit: instructions
    approx: true
    hedge: around 10 instructions or so
    supports: []
    notes: No method or source given
  - id: c-mh-v4-iq-fixup
    text: >-
      Apple appears to fix up fetch predictions in the instruction queue using the slower predictors, but not to drop
      short forward branches from the fetch predictor or convert them to predicated instructions
    loc: p108
    quote: >-
      Apple appear to have some elements of this scheme (if possible, fixup predictions from slow branch predictors in
      the Instruction Queue) in place
    derivation: inferred
    hedge: appear to
    supports: []
    notes: >-
      A mispredicted short forward branch can be fixed by marking its instructions in the instruction queue
      invalid, without resteering fetch

new_params:
  indpred.kind: {block: indpred, name: Indirect predictor type, unit: ""}

new_mechanisms:
  loop_modes:
    name: Tiered loop modes
    status: speculative
    description: Loops run from the instruction queue, a loop buffer or an L0 cache.
    params: []
    patents: [US9557999B2, US9753733B2, US20150205725A1, US9524011B2, US9471322B2]
    sim_switch: null
    detection_rule: >-
      a loop body shorter than the 8-wide dispatch group sustaining more than one iteration (taken loop-back
      branch) per cycle would show loop packing

mechanism_claims:
