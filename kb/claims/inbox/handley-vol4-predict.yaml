               c-mh-v4-loop-packing, c-mh-v4-loop-buffer-96, c-mh-v4-l0-cache, c-mh-v4-l0-size, c-mh-v4-loop-table,
               c-mh-v4-loop-iq-mode, c-mh-v4-loop-exit-predictor]
  bpu_isolation: [c-mh-v4-bp-security-tag]
