# m1n1.yaml
# Asahi Linux, 2025
# What the m1n1 bootloader sets on M1 Firestorm cores and clusters, the bit names it defines, and how it turns on the SLC.
session: m1n1
source: m1n1

claims:
  - id: c-m1n1-stnt-threshold
    text: An Apple erratum title quoted by m1n1 names an STNT widget with a contiguous-store counter, whose threshold m1n1 sets to 3 on every M1 Firestorm
    loc: p001
    quote: "// \"Post-silicon tuning of STNT widget contiguous counter threshold\" reg_mask(SYS_IMP_APL_HID4, HID4_CNF_CNTR_THRESH_MASK, HID4_CNF_CNTR_THRESH(3));"
    derivation: documented
    supports: []
    notes: STNT is read as store non-temporal. m1n1's M2 and M3 setups leave this field alone.
  - id: c-m1n1-sibling-merge-off
    text: An Apple erratum title quoted by m1n1 says a sibling merge in the LLC can let an uncached load break Arm ordering rules, so m1n1 sets HID5 DISABLE_FILL_2C_MERGE on every M1 Firestorm
    loc: p001
    quote: "// \"Sibling Merge in LLC can cause UC load to violate ARM Memory Ordering Rules.\" reg_set(SYS_IMP_APL_HID5, HID5_DISABLE_FILL_2C_MERGE);"
    derivation: documented
    supports: []
    notes: LLC read as the cluster L2, since cluster registers name an LLC flush and an LLC throttle; sibling perhaps the other 64 B half of a 128 B L2 line. The M2 and M3 setups leave the merge on.
  - id: c-m1n1-ldnt-off
    text: m1n1 sets HID11 DISABLE_LD_NT_WIDGET in its common setup for every M1 Firestorm, keeping the load non-temporal widget off
    loc: p001
    quote: "static void init_common_firestorm(void) ... reg_set(SYS_IMP_APL_HID11, HID11_DISABLE_LD_NT_WIDGET);"
    derivation: documented
    supports: []
    notes: The M2 setup sets the same bit. The register doc reads LDNT as load non-temporal, with a question mark (c-asahi-ldnt).
  - id: c-m1n1-nex-temp
    text: An Apple erratum title quoted by m1n1 says NEX power gating gave wrong temperature-sensor readings, worked around with dummy cycles, and m1n1 sets the HID13 pre-cycles field to 4 on every M1 Firestorm
    loc: p001
    quote: "// \"configure dummy cycles to work around incorrect temp sensor readings on // NEX power gating\" reg_mask(SYS_IMP_APL_HID13, HID13_PRE_CYCLES_MASK, HID13_PRE_CYCLES(4));"
    derivation: documented
    supports: []
    notes: NEX is read as the NEON/FP execution unit; HID7 names a NEX fast FMUL.
  - id: c-m1n1-rf-bank-livelock
    text: m1n1 sets HID16 MPX_PICK_45, MP_CYCLONE_7 and two spare bits on every M1 Firestorm, perhaps for an erratum on the forward-progress widget for register-file bank and multipass conflicts, which implies a banked register file
    loc: p001
    quote: "// Maybe: \"RF bank and Multipass conflict forward progress widget does not // handle 3+ cycle livelock\""
    derivation: inferred
    hedge: "Maybe"
    supports: []
    notes: m1n1's own comment doubts that the title belongs to these bits. Fits the four banks of c-mh-v1-prf-banks; says nothing of bank power gating.
  - id: c-m1n1-cache-fusion-off
    text: An Apple erratum title quoted by m1n1 says I-cache fusion of cross-beat AES or PMULL pairs is not disabled for an unconditional branch's recoded instruction, and m1n1 sets HID0 FETCH_WIDTH_DISABLE and CACHE_FUSION_DISABLE on every M1 Firestorm
    loc: p001
    quote: "// \"Cross-beat Crypto(AES/PMUL) ICache fusion is not disabled for branch // unconditional \"recoded instruction.\" reg_set(SYS_IMP_APL_HID0, HID0_FETCH_WIDTH_DISABLE | HID0_CACHE_FUSION_DISABLE);"
    derivation: documented
    supports: []
    notes: AES and PMULL pairs are measured to fuse on the M1 (c-dj-fusion-crypto); this turns off a fusion made in the I-cache. What Fetch Width Disable does is not stated.
  - id: c-m1n1-force-nonspec
    text: On every M1 Firestorm m1n1 forces non-speculative execution while single-stepping and when the speculative flush pointer is invalid while MP is valid, with the force-non-speculative timer select set to 3
    loc: p001
    quote: "reg_set(SYS_IMP_APL_HID7, HID7_FORCE_NONSPEC_IF_STEPPING | HID7_FORCE_NONSPEC_IF_SPEC_FLUSH_POINTER_INVALID_AND_MP_VALID); reg_mask(SYS_IMP_APL_HID7, HID7_FORCE_NONSPEC_TARGET_TIMER_SEL_MASK, HID7_FORCE_NONSPEC_TARGET_TIMER_SEL(3));"
    derivation: documented
    supports: []
    notes: MP is not expanded in the source. The M2 setup sets the flush-pointer bit and timer only on revision 0.
  - id: c-m1n1-hvc-spec
    text: m1n1 sets HID18 HVC_SPECULATION_DISABLE on every M1 Firestorm, so the core can speculate past an HVC unless this bit is set
    loc: p001
    quote: "reg_set(SYS_IMP_APL_HID9, HID9_TSO_SERIALIZE_VLD_MICROOPS | HID9_FIX_BUG_51667805); reg_set(SYS_IMP_APL_HID18, HID18_HVC_SPECULATION_DISABLE);"
    derivation: documented
    supports: []
  - id: c-m1n1-tso-vld
    text: m1n1 sets HID9 TSO_SERIALIZE_VLD_MICROOPS on every M1 Firestorm, read as serializing the micro-ops of vector loads in TSO mode
    loc: p001
    quote: "static void init_m1_firestorm(void) ... reg_set(SYS_IMP_APL_HID9, HID9_TSO_SERIALIZE_VLD_MICROOPS | HID9_FIX_BUG_51667805);"
    derivation: inferred
    supports: []
    notes: Fits c-tso-m1-simd, where M1 loads over 16 B run over 10x slower in TSO mode. The M2 setup leaves this bit clear (c-m1n1-m2-tso).
  - id: c-m1n1-pcie-throttle-off
    text: m1n1 clears HID3 DEV_PCIE_THROTTLE_ENABLE on every M1 Firestorm, leaving the core's PCIe device-access throttle off
    loc: p001
    quote: "// Disable SMC trapping to EL2 reg_clr(SYS_IMP_APL_HID1, HID1_TRAP_SMC); reg_clr(SYS_IMP_APL_HID3, HID3_DEV_PCIE_THROTTLE_ENABLE | HID3_DISABLE_ARBITER_FIX_BIF_CRD);"
    derivation: documented
    supports: []
    notes: The M2 and M3 setups turn this throttle on instead (c-m1n1-m2-pcie-throttle).
  - id: c-m1n1-credits
    text: On every M1 Firestorm m1n1 clears the bit that disables an arbiter fix for BIF credits, and on the T8103 it sets the HID6 upstream credit-token init field for C2 to 0
    loc: p001
    quote: "reg_clr(SYS_IMP_APL_HID3, HID3_DEV_PCIE_THROTTLE_ENABLE | HID3_DISABLE_ARBITER_FIX_BIF_CRD); ... reg_mask(SYS_IMP_APL_HID6, HID6_UP_CRD_TKN_INIT_C2_MASK, HID6_UP_CRD_TKN_INIT_C2(0));"
    derivation: documented
    supports: []
    notes: BIF read as the bus interface between core and fabric; C2 is not expanded.
  - id: c-m1n1-lfsr-stalls
    text: m1n1 turns on LFSR-driven random stalls at load pipe 2 issue and at store-queue replay on the T8103 and M1 Pro from revision 0x10 and on every M1 Max
    loc: p001
    quote: "if (rev >= 0x10) { reg_set(SYS_IMP_APL_HID4, HID4_ENABLE_LFSR_STALL_LOAD_PIPE2_ISSUE | HID4_ENABLE_LFSR_STALL_STQ_REPLAY);"
    derivation: documented
    supports: []
    notes: Random stalls are read as a livelock breaker. The M3 setup keeps the load pipe 2 stall (c-m1n1-m3-lfsr).
  - id: c-m1n1-br-kill-limit
    text: m1n1 turns on an MDSB stall-pipeline ECO and a branch kill limit on the T8103 at revision 0x11 and on the M1 Pro and Max from revision 0x10
    loc: p001
    quote: "if (rev == 0x11) reg_set(SYS_IMP_APL_HID1, HID1_ENABLE_MDSB_STALL_PIPELINE_ECO | HID1_ENABLE_BR_KILL_LIMIT);"
    derivation: documented
    supports: []
    notes: A branch kill is read as a mispredict flush; what the limit caps is not stated, nor what MDSB means.
  - id: c-m1n1-pref-replay
    text: m1n1 sets HID18 PREF_REPLAY_DISABLE, read as turning off prefetch replay, on the T8103 from revision 0x11 and on the M1 Pro and Max from revision 0x10
    loc: p001
    quote: "if (rev >= 0x11) reg_set(SYS_IMP_APL_HID18, HID18_PREF_REPLAY_DISABLE);"
    derivation: documented
    supports: []
    notes: The Asahi register doc calls HID18 bit 49 SpareBit17, so what the bit does is unclear.
  - id: c-m1n1-same-page-power
    text: m1n1 turns on a same-page power optimization (HID0 SAME_PG_POWER_OPTIMIZATION) on every M1 Firestorm
    loc: p001
    quote: "static void init_common_firestorm(void) { reg_set(SYS_IMP_APL_HID0, HID0_SAME_PG_POWER_OPTIMIZATION);"
    derivation: documented
    supports: []
    notes: HID0 otherwise holds front-end bits (loop buffer, I-cache prefetch, fetch width), so this may save fetch power within a page; the source does not say.
  - id: c-m1n1-nex-gating
    text: m1n1 turns on NEX power gating, with the HID13 reset-cycle field set to 12, on P-cores only, for the M1 and the other chips it marks as having NEX power gating
    loc: p002
    quote: "/* Enable NEX powergating, the reset cycles might be overridden by chickens */ if (!is_ecore()) { reg_mask(SYS_IMP_APL_HID13, HID13_RESET_CYCLES_MASK, HID13_RESET_CYCLES(12)); reg_set(SYS_IMP_APL_HID14, HID14_ENABLE_NEX_POWER_GATING);"
    derivation: documented
    supports: []
  - id: c-m1n1-amx-ctx
    text: Each core writes its own core number within its cluster into AMX_CTX_EL1 at boot, which suggests one AMX context per core
    loc: p002
    quote: "// XXX is this really AMX? int core = mrs(MPIDR_EL1) & 0xff; msr(SYS_IMP_APL_AMX_CTX_EL1, core);"
    derivation: inferred
    hedge: "XXX is this really AMX?"
    supports: []
    notes: The write runs on E and P cores alike because both share one feature set, so it says nothing about an E-cluster AMX unit.
  - id: c-m1n1-wfi-retention
    text: On the M1 m1n1 sets the CYC_OVRD WFI mode to 2 (up) and turns on WFI state retention, so a core waiting in WFI keeps its state
    loc: p002
    quote: "/* Unmask external IRQs, set WFI mode to up (2), enable WFI retention */"
    derivation: documented
    supports: []
    notes: The register doc lists WFI mode 2 as force up and 3 as force down, so WFI can also power a core down.
  - id: c-m1n1-bp-retention
    text: m1n1 turns on branch-prediction state retention across cluster (ACC) sleep on the M1, setting the ACC_CFG BP sleep field to 3
    loc: p002
    quote: "// Enable branch prediction state retention across ACC sleep if (cpu_features->acc_cfg) { reg_mask(SYS_IMP_APL_ACC_CFG, ACC_CFG_BP_SLEEP_MASK, ACC_CFG_BP_SLEEP(3));"
    derivation: documented
    supports: []
  - id: c-m1n1-dc-mva-off
    text: m1n1 sets DISABLE_DC_MVA and DISABLE_DC_SW_L2_OPS on every core from the A7 to the M3, the M1 included, turning off data-cache maintenance by address and set/way operations on the L2
    loc: p002
    quote: "/* This is performed unconditionally on all cores (necessary?) */ if (is_ecore()) reg_set(SYS_IMP_APL_EHID4, EHID4_DISABLE_DC_MVA | EHID4_DISABLE_DC_SW_L2_OPS); else reg_set(SYS_IMP_APL_HID4, HID4_DISABLE_DC_MVA | HID4_DISABLE_DC_SW_L2_OPS);"
    derivation: inferred
    hedge: "necessary?"
    supports: []
    notes: With DC by-address operations off, the clean step the mechanism names cannot come from DC instructions; only I-cache invalidation stays with software.
  - id: c-m1n1-features-m1
    text: m1n1 marks the M1 as having SPRR, along with fast IPIs, SIQ_CFG and AMX
    loc: p002
    quote: "const struct midr_part_features features_m1 = { ... .fast_ipi = true, .mmu_sprr = true, .siq_cfg = true, .amx = true, };"
    derivation: documented
    supports: []
    notes: SPRR is read as the indexed page permissions of c-mh-v3-sprr-index; the source gives no SPRR details.
  - id: c-m1n1-sysreg-spec
    text: The HID1 bit names include separate disables for speculative MSR and MRS of DAIF and of other system registers, so the P-core executes these system-register accesses speculatively
    loc: p003
    quote: "#define HID1_DIS_MSR_SPEC_DAIF BIT(49) #define HID1_DIS_MRS_SPEC_DAIF BIT(50) #define HID1_DIS_MSR_SPEC_NON_DAIF BIT(51) #define HID1_DIS_MRS_SPEC_NON_DAIF BIT(52)"
    derivation: documented
    supports: []
    notes: Header names cover all Apple cores; which ones the M1 uses is not stated. Fits the speculative special-register writes of c-mh-v1-spr-speculative-writes.
  - id: c-m1n1-chkpt
    text: The HID1 bit names include a checkpoint disable (DISABLE_CHKPT) and a clock override for the checkpoint logic, so the P-core keeps checkpoints
    loc: p003
    quote: "#define HID1_RCC_FORCE_CHKPT_L3_CLKS_ON BIT(29) #define HID1_DISABLE_CHKPT BIT(30)"
    derivation: documented
    supports: []
    notes: Checkpoints for faster recovery were guessed in c-mh-v4-checkpoints; what is checkpointed is not stated.
  - id: c-m1n1-retire-groups
    text: The HID1 bit names show retire groups that normally run past instruction and microcode ends, and retirement of several groups and several indirect branches at once, each with a disable
    loc: p003
    quote: "#define HID1_DIS_MULT_RETIRE BIT(11) #define HID1_DIS_MULT_INDIR_BR_RETIRE BIT(12) ... #define HID1_FORCE_GRP_BNDRY_ON_INST_END BIT(33) #define HID1_FORCE_GRP_BNDRY_ON_UCODE_END BIT(34)"
    derivation: inferred
    supports: []
    notes: Forcing a group boundary at each instruction end implies groups hold several instructions, as measured in c-dj-retire-groups.
  - id: c-m1n1-rtr-ahead
    text: The bit names show a branch-dispatch and system-resolved pointer, and let loads become ready to retire ahead of older stores and stores ahead of older loads
    loc: p003
    quote: "#define HID1_DIS_BR_DISP_SYS_RSLVD_PTR BIT(13) ... #define HID4_DISABLE_LD_RTR_AHEAD_OLDER_ST BIT(8) ... #define HID4_DIS_ST_RTR_AHEAD_OLDER_LD BIT(32)"
    derivation: inferred
    supports: []
    notes: RTR read as ready to retire. HID21 also names a wait of the load queue's RTR on older store-release completion.

new_mechanisms:
  lsu_forward_progress:
    name: Load-store forward-progress widgets
    block: lsu
    status: inferred
    description: Counters watch for victimized lock lines and repeated replays of the oldest load or store and step in by stalling issue, and LFSR-driven random stalls at issue, replay, retire and drain points break up livelocks.
    params: []
    claims: [c-m1n1-lfsr-stalls]
    sim_switch: null
    detection_rule: A probe that keeps the oldest load replaying, or makes two cores fight over one locked line, would see bursts of extra stall cycles and timing noise rather than a hang.
  forced_nonspec_mode:
    name: Forced non-speculative execution
    block: retire
    status: inferred
    description: Control bits stop the core from speculating past HVC or guarded-mode calls, while single-stepping, or when the speculative flush pointer is invalid while an MP condition holds, for a time set by a timer select.
    params: []
    claims: [c-m1n1-force-nonspec, c-m1n1-hvc-spec]
    sim_switch: null
    detection_rule: A load placed after an HVC that never returns to it would leave a cache footprint only while HVC speculation is on.

mechanism_claims:
  streaming_store_nt: [c-m1n1-stnt-threshold]
  l2_half_lines: [c-m1n1-sibling-merge-off]
  nt_load_handling: [c-m1n1-ldnt-off]
  simd_power_down: [c-m1n1-nex-temp, c-m1n1-nex-gating]
  banked_prf_power: [c-m1n1-rf-bank-livelock]
  macro_op_fusion: [c-m1n1-cache-fusion-off]
  tso_mode: [c-m1n1-tso-vld]
  pio_network: [c-m1n1-pcie-throttle-off]
  fabric_qos_credits: [c-m1n1-credits]
  issue_age_flush: [c-m1n1-br-kill-limit]
  amx_shared_contexts: [c-m1n1-amx-ctx]
  cluster_sleep_states: [c-m1n1-wfi-retention, c-m1n1-bp-retention]
  l1i_maintenance_only: [c-m1n1-dc-mva-off]
  indexed_page_permissions: [c-m1n1-features-m1]
  speculative_special_regs: [c-m1n1-sysreg-spec]
  rename_retire_queue: [c-m1n1-chkpt]
  retire_groups: [c-m1n1-retire-groups]
  lsq_early_release: [c-m1n1-rtr-ahead]
