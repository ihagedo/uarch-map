# corsix-amx.yaml
# Peter Cawley, 2022
# AMX register file and operation set per chip, and AMX throughput by thread count and Z accumulators on M1 Max and M2.
session: corsix-amx
source: corsix-amx

claims:
  - id: c-cx-fp-types
    text: AMX floating-point multiply-adds take fp16, fp32 or fp64 with all three operands the same width, or fp16 multiplicands accumulating into fp32
    loc: p001
    quote: "IEEE754 f16 or f32 or f64 (same width for all three fused-multiply-add operands) ... IEEE754 f16 multiplicands, accumulating onto f32"
    derivation: measured
    supports: []
    notes: Reverse engineered on an M1 Max.
  - id: c-cx-m2-bf16
    text: The M2 adds bf16 multiplicands, accumulating into bf16 or fp32
    loc: p001
    quote: "On M2 hardware, bf16 multiplicands, accumulating onto bf16 or IEEE754 f32"
    derivation: measured
    supports: []
    chip: m2
  - id: c-cx-m3-modes
    text: The M3 adds one mode each to the X load, the Y load and the integer outer product
    loc: p001
    quote: "The M2 to M3 transition [adds one extra mode to each of `ldx` and `ldy` and `matint`]"
    derivation: measured
    supports: []
    chip: m3
  - id: c-cx-m4-offsets
    text: On the M4 some modes of the extract and vector operations ignore the low bits of the X or Y offset
    loc: p001
    quote: "The M3 to M4 transition [causes some modes of `extrh`, `extrv`, `vecfp`, and `vecint` to ignore low bits of X/Y offset]"
    derivation: measured
    supports: []
    chip: m4
  - id: c-cx-regs
    text: Each core's AMX state is 80 registers of 64 bytes, 8 in the X pool, 8 in the Y pool and 64 forming the 64x64-byte Z grid
    loc: p002
    quote: "The architectural state contains 80 such registers: 8 of which in the X pool, 8 of which in the Y pool, and the remaining 64 forming a 64x64 grid called Z."
    derivation: measured
    value: 80
    unit: registers
    supports: []
    notes: About 5 KB in all.
  - id: c-cx-circular
    text: The X pool, and likewise the Y pool, acts as a 512-byte circular buffer from which most instructions can take any contiguous 64 bytes
    loc: p002
    quote: "The entire X register pool can be concatenated to form a circular buffer of 512 bytes. Most instructions can operate on _any_ contiguous 64 byte range from this circular buffer."
    derivation: measured
    value: 512
    unit: B
    supports: []
  - id: c-cx-no-moves
    text: No instruction moves data directly between AMX registers and the core's general or SIMD registers; data goes through memory
    loc: p002
    quote: "There is no direct movement between AMX registers and A64 general purpose registers or SIMD registers; data has to go via memory."
    derivation: measured
    supports: []
  - id: c-cx-vec-mat
    text: Vector operations combine X, Y and one Z register lane by lane, while matrix operations write an outer product across as many Z registers as X and Y have lanes
    loc: p002
    quote: "Vector: Select one register from Z, and combine X/Y/Z in a standard SIMD manner ... Matrix: Select a number of registers from Z equal to the number of lanes in X and Y"
    derivation: measured
    supports: []
  - id: c-cx-indexed
    text: Some operations read X or Y through an indexed load, treating 2-, 4- or 5-bit fields as lane indices into another register
    loc: p002
    quote: "Some operations support _indexed loads_ rather than 64-byte span loads. ... the index size (`IS`) is 2/4/5 bits"
    derivation: measured
    supports: []
  - id: c-cx-mixed-full-z
    text: A full outer product of 16-bit X and Y into 32-bit Z needs 1024 Z values, which takes all 64 Z registers
    loc: p002
    quote: "which there is _just_ space for: use all 64 Z registers, with 16 elements in each."
    derivation: measured
    value: 64
    unit: registers
    supports: []
  - id: c-cx-setclr
    text: Setting up AMX zeroes all its registers and faults if AMX is already set up; clearing it leaves the registers uninitialised so they need no saving on a context switch
    loc: p003
    quote: "Raises invalid instruction exception if already setup. All registers set to zero. ... All registers set to uninitialised, no longer need saving/restoring on context switch."
    derivation: measured
    supports: []
  - id: c-cx-matint-opts
    text: The integer outer product can take indexed or shuffled X and Y and offers a right shift, a sqrdmlah-style rounding multiply and a popcount mode
    loc: p003
    quote: "Indexed X or Y, shuffle X, shuffle Y,<br/>right shift, `sqrdmlah`, `popcnt`"
    derivation: measured
    supports: []
  - id: c-cx-matint-int8
    text: In ALU mode 8 the integer outer product multiplies 8-bit X and Y and accumulates into 16-bit or 32-bit Z, with an unusual data layout
    loc: p004
    quote: "When 47=8, FMA is performed with 8-bit multiplicands, accumlating onto 16-bit or 32-bit Z, using a slightly unusual (for AMX) data layout."
    derivation: measured
    value: true
    supports: []
    notes: Reverse engineered on an M1 Max; only the 8-bit by 16-bit variant is marked M3 only. Contradicts c-mh-v3-amx-no-int8 and the "no int8" in amx_op_set.
  - id: c-cx-m3-i8i16
    text: The M3 adds an 8-bit X by 16-bit Y integer outer product into 32-bit Z
    loc: p004
    quote: "When 47=8, M3 also supports 8-bit X, 16-bit Y, 32-bit Z"
    derivation: measured
    supports: []
    chip: m3
  - id: c-cx-one-to-one
    source: corsix-amx-issues
    text: Each CPU cluster, P or E, has its own AMX unit, placed beside the cluster's L2 on die shots
    loc: p002
    quote: "an AMX coprocessor associated with an E CPU cluster ... There's a 1:1 correspondence between CPU clusters and AMX clusters, and on die shots you'll see them colocated, along with a bunch of L2."
    derivation: inferred
    value: 1
    unit: units
    supports: [amx.units]
    notes: Adds an E-cluster unit that c-mh-v8-amx-per-cluster and amx_shared_contexts leave out.
  - id: c-cx-per-core-rf
    source: corsix-amx-issues
    text: Each AMX unit must hold at least 512 bytes of X, 512 bytes of Y and 4096 bytes of Z for every core of its cluster
    loc: p002
    quote: "X register file, which is at least 512 bytes per CPU core in the associated CPU cluster ... Z register file, which is at least 4096 bytes per CPU core"
    derivation: inferred
    supports: []
  - id: c-cx-z-in-cells
    source: corsix-amx-issues
    text: The X and Y register files sit apart from the compute cells, while Z is likely split up and held inside the cells
    loc: p002
    quote: "The X and Y register files (or a combined X and Y register file) will be separate from the AMX cells, but the Z register file is likely split up and colocated in the AMX cells."
    derivation: inferred
    hedge: "likely"
    supports: []
    notes: Agrees with c-mh-v3-amx-z-in-pe.
  - id: c-cx-cell-grid
    source: corsix-amx-issues
    text: Each compute cell handles an aligned 8-byte by 8-byte piece of the 64x64-byte grid, and the P-cluster AMX may well have an 8x8 grid of cells on both M1 and M2
    loc: p002
    quote: "a cell is an aligned 8-byte by 8-byte sub-grid, in which FMA/MAC operations are performed ... P AMX may well be 8x8 cells in both M1 and M2"
    derivation: inferred
    value: 8x8
    hedge: "may well be"
    supports: [amx.pe_grid]
  - id: c-cx-cell-f64
    source: corsix-amx-issues
    text: Each cell holds one fp64 FMA circuit that can split into four fp32 FMAs or other ways for fp16, bf16 and integer multiply-accumulate
    loc: p002
    quote: "Each cell contains an F64 FMA circuit. Said circuit can be split up and used as four separate F32 FMA circuits, or split up in other ways for F16/BF16/integer-multiply-accumulate."
    derivation: inferred
    value: 4
    unit: fp32 FMAs
    supports: []
    notes: c-mh-v3-amx-pe-grid reads two fp32 multiply-adders per element from a patent; c-cx-fp32-4x measures fp32 at four times fp64.
  - id: c-cx-fma-latency
    source: corsix-amx-issues
    text: The FMA path from addend input to output takes four cycles
    loc: p002
    quote: "That circuit might be split into four pipeline stages (e.g. 4 cycle compute latency), or at least the path from addend input to FMA output is four cycles."
    derivation: inferred
    value: 4
    unit: cycles
    hedge: "might be split into four pipeline stages"
    supports: [amx.fma_latency]
  - id: c-cx-four-ranges
    source: corsix-amx-issues
    text: With a four-cycle FMA, each cell needs four distinct Z ranges in flight to stay busy, so a matrix operation that uses all 4096 bytes of Z needs several cores
    loc: p002
    quote: "Given that the latency is 4 cycles, four distinct ranges of Z are required. If a matrix instruction refers to all 4096 bytes of Z, then multiple CPU cores need to be in play."
    derivation: inferred
    value: 4
    unit: Z ranges
    supports: []
  - id: c-cx-instr-only
    source: corsix-amx-issues
    text: The CPU cluster sends AMX only instructions, never data, and data moves between them through memory, in particular the L2
    loc: p002
    quote: "The CPU cluster only sends instructions to the AMX cluster, not data. ... Data has to move via memory, and in particular via L2."
    derivation: inferred
    supports: []
  - id: c-cx-store-ports
    source: corsix-amx-issues
    text: How fast a core can queue AMX instructions is set by its store ports, two per P-core on the M1, and fusion might let each port carry two AMX instructions a cycle
    loc: p002
    quote: "for M1 that means store ports, of which there are 2 per P core, and 1 per E core. Instruction fusion might let you enqueue two AMX instructions per port per cycle"
    derivation: inferred
    value: 2
    unit: instr/cycle
    hedge: "might"
    supports: [amx.issue_width]
    notes: He gives one store port per E-core.
  - id: c-cx-matfp64-sat
    source: corsix-amx-issues
    text: One thread's fp64 outer-product throughput grows with independent Z accumulators up to four, reaching 370.8 GFLOPS, and stays flat beyond
    loc: p002
    quote: "For `matfp` FP64xFP64=FP64, I'm seeing the following on M1 Max: ... |4 (2048 bytes) per thread|370.8 GFLOPS ... |5 (2560 bytes) per thread|370.9 GFLOPS"
    method: throughput
    derivation: measured
    value: 4
    unit: accumulators
    supports: []
    notes: M1 Max.
  - id: c-cx-two-clusters
    source: corsix-amx-issues
    text: Going from one thread to two roughly doubles AMX throughput on an M1 Max, since it has two P-clusters each with its own AMX
    loc: p002
    quote: "M1 Max gets ~100% improvement going from 1 thread to 2, which is consistent with M1 Max having two P clusters."
    method: throughput
    derivation: measured
    value: 100
    unit: "%"
    approx: true
    supports: []
    notes: M1 Max.
  - id: c-cx-three-dip
    source: corsix-amx-issues
    text: Throughput dips at three threads, likely because three threads cannot be spread well over two AMX units
    loc: p002
    quote: "The dip when going to 3 threads is likely a consequence of the same thing, with there being no good scheduling of 3 threads onto two AMX clusters."
    derivation: inferred
    hedge: "likely"
    supports: []
    notes: M1 Max.
  - id: c-cx-m2-saturate
    source: corsix-amx-issues
    text: On the M2 a single thread almost saturates the one AMX unit, so more threads add little
    loc: p002
    quote: "M2 sees only small gains from increasing thread count, as a single thread is able to almost saturate the entire AMX cluster."
    method: throughput
    derivation: measured
    supports: []
    chip: m2
  - id: c-cx-m2-same
    source: corsix-amx-issues
    text: An M2 AMX unit performs about like an M1 one, its single-thread results about 10% higher in line with its clock
    loc: p002
    quote: 'The "1 Thread" column sees a ~10% uplift in performance, consistent with M2 clocks being 10% higher than M1.'
    method: throughput
    derivation: measured
    value: 10
    unit: "%"
    approx: true
    supports: []
    chip: m2
  - id: c-cx-fp32-4x
    source: corsix-amx-issues
    text: fp32 outer products run at four times the FLOPS of fp64 ones
    loc: p002
    quote: "FP32 is getting 4x the performance of FP64."
    method: throughput
    derivation: measured
    value: 4
    unit: x
    supports: []
    notes: M1 Max and M2.
  - id: c-cx-f16f32
    source: corsix-amx-issues
    text: An fp16 by fp16 outer product into fp32 Z, which fills all of Z, runs at about the fp32 rate
    loc: p002
    quote: "Going down to FP16xFP16=FP32, M1 Max: ... Similar performance to FP32xFP32=FP32."
    method: throughput
    derivation: measured
    supports: []
    notes: M1 Max.
  - id: c-cx-fp16-2x
    source: corsix-amx-issues
    text: fp16 outer products into fp16 Z run at twice the fp32 rate
    loc: p002
    quote: "Going down to FP16xFP16=FP16, M1 Max: ... Twice the performance of FP32."
    method: throughput
    derivation: measured
    value: 2
    unit: x
    supports: []
    notes: M1 Max.
  - id: c-cx-vecfp-sat
    source: corsix-amx-issues
    text: One thread's fp64 vector multiply-add throughput grows with independent Z accumulators up to eight, reaching 92.8 GFLOPS, and stays flat beyond
    loc: p002
    quote: "For vecfp FP64xFP64=FP64, I'm seeing the following on M1 Max: ... |8 (512 bytes) per thread|92.8 GFLOPS ... |9 (576 bytes) per thread|89.0 GFLOPS"
    method: throughput
    derivation: measured
    value: 8
    unit: accumulators
    supports: []
    notes: M1 Max.
  - id: c-cx-m2-multi
    source: corsix-amx-issues
    text: The M2's modes that run a vector operation on two or four registers at once raise peak throughput little
    loc: p002
    quote: "No major performance improvement from using the two-at-a-time or four-at-a-time vector instruction modes"
    method: throughput
    derivation: measured
    supports: []
    chip: m2
  - id: c-cx-xy-rf-bw
    source: corsix-amx-issues
    text: The four-at-a-time vector mode doubles throughput only with broadcast modes that read fewer operands, which points to limited read bandwidth from a seemingly shared X/Y register file
    loc: p002
    quote: "It looks like four-at-a-time gets (up to) double the throughput when any broadcast mode other than mode 0 is used ... This suggests another bottleneck in the equations: bandwidth out of the (seemingly combined) X/Y register file."
    derivation: inferred
    hedge: "seemingly combined"
    supports: []
    chip: m2
  - id: c-cx-vec-1t
    source: corsix-amx-issues
    text: One thread can reach 185.5 GFLOPS of fp32 vector multiply-adds on AMX, but only by spreading them over 512 bytes of Z
    loc: p004
    quote: "A single thread _can_ exceed 102.4 GFLOPS, potentially hitting 185.5 GFLOPS, but you need to be using 512 bytes of Z registers to get there."
    method: throughput
    derivation: measured
    value: 185.5
    unit: GFLOPS
    supports: []
    notes: M1 Max.
  - id: c-cx-vec-4t
    source: corsix-amx-issues
    text: Four threads reach only 406.0 GFLOPS of fp32 vector multiply-adds on AMX, and more threads add nothing
    loc: p004
    quote: "Four threads only get to 406.0 GFLOPS, which is less than the theoretical 409.6 achievable with NEON. More than four threads don't help AMX, but will help NEON."
    method: throughput
    derivation: measured
    value: 406.0
    unit: GFLOPS
    supports: []
    notes: M1 Max, two P-clusters.
  - id: c-cx-z-spread
    source: corsix-amx-issues
    text: Vector operations reach full throughput only when their Z accumulators are spread as far apart as allowed rather than packed together
    loc: p004
    quote: "For vector operations, the Z accumulators you choose want to be maximally spread out over the permissible range, rather than contiguous"
    method: throughput
    derivation: measured
    supports: []
  - id: c-cx-no-rename
    source: corsix-amx-issues
    text: AMX does little or no register renaming
    loc: p004
    quote: "There's limited-to-no register renaming going on."
    derivation: inferred
    hedge: "limited-to-no"
    supports: []

mechanism_claims:
  amx_op_set: [c-cx-fp-types, c-cx-m2-bf16, c-cx-m3-modes, c-cx-m4-offsets, c-cx-vec-mat, c-cx-indexed,
               c-cx-mixed-full-z, c-cx-setclr, c-cx-matint-opts, c-cx-matint-int8, c-cx-m3-i8i16]
  amx_datapath: [c-cx-regs, c-cx-circular, c-cx-no-moves, c-cx-z-in-cells, c-cx-cell-grid, c-cx-cell-f64,
                 c-cx-fp32-4x, c-cx-f16f32, c-cx-fp16-2x, c-cx-m2-same, c-cx-m2-multi, c-cx-xy-rf-bw]
  amx_shared_contexts: [c-cx-one-to-one, c-cx-per-core-rf, c-cx-two-clusters, c-cx-three-dip, c-cx-m2-saturate,
                        c-cx-vec-4t]
  amx_lsu_issue: [c-cx-instr-only, c-cx-store-ports]
  amx_z_dependency_window: [c-cx-fma-latency, c-cx-four-ranges, c-cx-matfp64-sat, c-cx-vecfp-sat, c-cx-vec-1t,
                            c-cx-z-spread, c-cx-no-rename]
