# handley-vol2-l1.yaml
# Maynard Handley, 2025
# L1D organisation and banking, and the L1 TLB (M1 Explainer vol 2).
session: handley-vol2-l1
source: handley-vol2

claims:
  - id: c-mh-v2-l1-bw-basics
    text: >-
      Three LDP (X-register pair) loads per cycle with autoincrement addressing load 48 B/cycle from the L1, a peak
      of 153.6 GB/s at 3.2 GHz
    loc: p002
    quote: "within L1 we can load 48B/cycle ... the maximum load throughput from L1D is 48B*3.2GHz=153.6GB/s"
    method: throughput
    derivation: measured
    value: 48
    unit: B/cycle
    supports: [l1d.load_bw]
    notes: >-
      LDP x0, [x2, #16] or the post-index form run at essentially three per cycle; manual base increments add a
      dependency chain. For the perfect-48 vs realistic-32 B/cycle rule of thumb see c-mh-v2-l1-bw
  - id: c-mh-v2-l1-lsu-128b
    text: Each load moves at most 128 bits from the L1D to the LSU, so a vector LDP needs two cycles of data transfer
    loc: p002
    quote: "the width from L1D to the LSU for each load appears to be 128b, so something like a vector LDP takes two cycles for the data transfer"
    derivation: inferred
    value: 128
    unit: bits
    hedge: "appears to be"
    supports: []
    notes: See c-mh-v2-ldpq-throughput (LDP Q at 1.5 per cycle, two cache traversals each)
  - id: c-mh-v2-dram-random-64
    text: For random loads that mostly miss to DRAM, the M1 delivers around 64 GB/s
    loc: p003
    quote: "mostly misses to DRAM for every load ... M1 appears to provide a bandwidth of around 64GB/s"
    derivation: reported
    value: 64
    unit: GB/s
    approx: true
    hedge: "appears to provide ... around"
    supports: []
    notes: >-
      Given right after he points readers to AnandTech's A13 and M1 articles for bandwidth and latency numbers; he
      does not say whose figure it is. He adds that the M1 has twice the A13's DRAM bandwidth
  - id: c-mh-v2-slc-memory-side
    text: >-
      The M1's system level cache is a memory-side cache, associated with the DRAM controller rather than with the
      CPUs or any other block
    loc: p003
    quote: "it's a memory-side cache. In other words you can think of it as being a cache that is tightly associated with the DRAM (and more specifically with the DRAM controller)"
    derivation: inferred
    supports: []
    notes: >-
      He lists benefits this allows: streaming traffic bypassing the SLC, and the SLC acting as a virtual write queue
      (ISCA 2010; known in IBM POWER8). He does not show the M1 doing either
  - id: c-mh-v2-ls-pipes
    text: >-
      The load/store pipes are best summarized as two load-only, one store-only and one ambidextrous pipeline,
      four in all
    loc: p004
    quote: "the best way to summarize is something like there are ... 2 load-only pipelines ... 1 store-only pipeline ... 1 ambidextrous pipeline"
    method: throughput
    derivation: inferred
    value: 4
    unit: units
    supports: [lsu.ls_units]
    notes: Starts from the instruction tables' 3 loads or 2 stores per cycle
  - id: c-mh-v2-ls-mix
    text: >-
      The core runs 3 loads + 1 store or 2 loads + 2 stores in one cycle, but not 3 loads + 2 stores
    loc: p004
    quote: "we should be able to run 3 loads+1 store, or 2 loads+2stores in one cycle, and we can; but we can't, for example, run 3 loads and 2 stores in a cycle"
    method: throughput
    derivation: measured
    value: 4
    unit: ops/cycle
    supports: []
    notes: >-
      Interleaved store/load streams reach 3.99-4.0 ops/cycle and one store plus three loads 3.97-4.0.
      Ice Lake does 2+2 but cannot switch to 3+1

  - id: c-mh-v2-tlb-two-pages
    text: >-
      Probes of three loads, two on one page and one on a page 16 KiB away, take 2.8 cycles per two probes, against
      one cycle per probe when all three share a page and cache line
    loc: p005
    quote: "LDR [x1]; LDR [x1+8]; LDR [x1+16K] 2 probes per 2.8 cycles (so about 1.4 cycles per"
    method: throughput
    derivation: measured
    value: 1.4
    unit: cycles/probe
    approx: true
    supports: []
    notes: No address update, so no L1 or TLB misses; about 2.14 loads serviced per cycle
  - id: c-mh-v2-tlb-three-pages
    text: Probes of three loads on three pages 16 KiB apart take 5 cycles per two probes
    loc: p005
    quote: "LDR [x1]; LDR [x1+16K]; LDR [x1+32K] 2 probes per 5 cycles (so about 2.5 cycles per"
    method: throughput
    derivation: measured
    value: 2.5
    unit: cycles/probe
    approx: true
    supports: []
    notes: Handley reads this as about 1 + 1/6 requests serviced per TLB lookup
  - id: c-mh-v2-dtlb-single-port
    text: >-
      The L1 dTLB does one lookup per cycle, and the result is shared over piggyback ports with every waiting load
      or store to the same page, so the TLB is single-ported
    loc: p005
    quote: "one TLB lookup per cycle, but that TLB lookup result can service multiple requestors that all have the same page number"
    method: throughput
    derivation: inferred
    value: 1
    unit: lookups/cycle
    supports: [dtlb.l1_lookups_per_cycle]
    notes: >-
      Up to four loads/stores on the same page share one translation. Handley guesses each piggyback port also
      receives the page permissions.
  - id: c-mh-v2-tlb-queues
    text: >-
      Requests wait for the TLB in 4 queues of up to 4 entries, binned by low page-number bits; each cycle the
      oldest request is translated together with the others in its queue on the same page
    loc: p006
    quote: "The results of these simulations do not prove, but strongly suggest, that the system is using 4 queues, each queue holds up to four entries"
    method: simulation
    derivation: inferred
    value: 4
    unit: queues
    hedge: "do not prove, but strongly suggest"
    supports: []
    notes: >-
      Stochastic simulations; the system favours latency (oldest first) over waiting for queues to fill, and a request
      may wait up to three cycles. The four-ops-per-cycle case needs at least four queues of at least
      four entries
  - id: c-mh-v2-l1-entry-queues
    text: >-
      Requests entering the L1 are queued the same way, four queues of up to four requestors, the scarce resource
      being access to a bank: requests to different lines in the same bank must wait
    loc: p006
    quote: "Very much the same structure (servicing multiple requests when possible, four queues, holding up to four requestors) is used at entry into the L1"
    derivation: inferred
    value: 4
    unit: queues
    supports: []
    notes: 'Handley mentions 16 banks "to simplify tremendously"; see c-mh-v2-l1d-banks'
  - id: c-mh-v2-tlb-autoinc
    text: >-
      When each base register auto-increments by #200, the 16K- and 32K-offset probes run at close to three loads
      per cycle, which Handley explains as the loads spreading evenly over the four TLB queues
    loc: p007
    quote: "But this substantially improves things! Giving a throughput of very close one one cycle per three loads"
    method: throughput
    derivation: measured
    value: 3
    unit: loads/cycle
    approx: true
    supports: []
  - id: c-mh-v2-tlb-4ops
    text: >-
      Two loads and two stores to four pages at offsets of k x (16 KiB + 80 B) sustain four operations per cycle
    loc: p007
    quote: "if you use the four offsets (0, 1, 2, 3)*(16*1024+64+16) you will sustain four operations per cycle"
    method: throughput
    derivation: measured
    value: 4
    unit: ops/cycle
    supports: []
    notes: >-
      Two loads + two stores on one page also run at full rate; one access on another page gives about one cycle per
      quad (2.6-2.7 requests per lookup). Three loads + one store, or auto-updates, break the symmetry.
  - id: c-mh-v2-tlb-no-sharing
    text: >-
      A load stream that touches a new page on every access, over about 16 pages, can share no TLB lookups and
      drops to about one load per cycle (0.97 cycles per load)
    loc: p008
    quote: "no TLB lookup can be shared, and the number of accesses processed per cycle drops from the ideal of three or four down to to just very slightly below 1."
    method: throughput
    derivation: measured
    value: 0.97
    unit: cycles/load
    supports: []
    notes: >-
      Loads only, offsets (0, 1, 2) x (16 KiB + 80 B), wrapped every 256 KiB; wrapping at 128 KiB (8-12 pages live)
      doubles throughput to 2 loads/cycle
  - id: c-mh-v2-tlb-queue-overflow
    text: >-
      Spreading the same stream over 32 or 64 pages makes each load take two cycles; Handley guesses a load that
      cannot be enqueued for the TLB (4 x 4 slots) is replayed
    loc: p009
    quote: "If we go in the other direction, making the BIC happen at either 512K or 1024K, each load now takes two cycles."
    method: throughput
    derivation: measured
    value: 2
    unit: cycles/load
    hedge: "My guess is"
    supports: []
    notes: >-
      He does not think TLB entries, cache lines or line segments are the bottleneck; his guess is that each load is
      submitted twice, the first time unsuccessfully
  - id: c-mh-v2-page-cross-31
    text: >-
      A load that crosses a page boundary costs 31 cycles; three such loads to the same page pair take 93 cycles,
      with no reuse of the translations
    loc: p009
    quote: "What is surprising, perhaps, is just how bad it is - 31 cycles per load!"
    method: throughput
    derivation: measured
    value: 31
    unit: cycles
    supports: []
    notes: >-
      He presumes microcode performs the two TLB lookups and two accesses. Two normal loads plus one
      page-crossing load still take 31 cycles per iteration. Compare c-ox-page-cross (about 28 extra cycles)

  - id: c-mh-v2-l1d-size
    text: The L1D is 128 KiB and holds 2048 lines
    loc: p035
    quote: "And we know that the L1D is 128kiB, so it holds 2048 lines."
    derivation: reported
    value: 128
    unit: KiB
    supports: [l1d.size]
    notes: >-
      Handley calls size and line length the only definite facts, but gives no method on this page
  - id: c-mh-v2-l1d-line
    text: >-
      The L1D line is 64 B, not the 128 B line Handley had taken from internet claims until his own tests showed
      otherwise
    loc: p035
    quote: "We know that cache lines are 64B (eventually we'll see experiments to this effect)."
    derivation: measured
    value: 64
    unit: B
    supports: [l1d.line]
    notes: >-
      The 128 B line and a 100 GB/s in-L1 load bandwidth were problematic internet claims he (in)validated with
      his own tests. The DC ZVA test (64 B L1 lines, 128 B L2 lines) is c-mh-v2-l1d-line-dczva
  - id: c-mh-v2-l1d-8way
    text: >-
      Handley's working model of the L1D is 8-way set associative with 256 sets indexed by address bits 6-13 (the
      bits untranslated with 16 KiB pages), which he labels conjecture
    loc: p035
    quote: "the cache is 8-way set associative ... And we know that the L1D is 128kiB, so it holds 2048 lines. Those two are definite. The rest is conjecture."
    derivation: inferred
    value: 8
    unit: ways
    hedge: "The rest is conjecture."
    supports: [l1d.assoc]
    notes: >-
      2048 lines in 256 sets of 8; addresses 16 KiB apart compete for 8 lines. Untested here (see
      c-mh-v2-l1d-8way-tlb). Handley thinks the real lookup is closer to c-mh-v2-l1d-hashed-lookup.
  - id: c-mh-v2-dtlb-160-aside
    text: In passing, the M1's L1 TLB holds 160 pages
    loc: p039
    quote: "But that's not quite as bad as you might think. The M1 TLB holds 160 pages"
    derivation: reported
    value: 160
    unit: entries
    supports: [dtlb.l1_entries]
    notes: >-
      Aside in his estimate of the storage cost of a D2D-style TLB; his measurement (at least 160 entries,
      128+32) is c-mh-v2-dtlb
  - id: c-mh-v2-no-large-pages
    text: Apple appears uninterested in large pages, possibly because range registers cover much the same need
    loc: p039
    quote: "Apple so far has appeared uninterested in these (possibly because they use range registers, which solve much the same problem"
    derivation: inferred
    hedge: "appeared"
    supports: []
  - id: c-mh-v2-l1d-hashed-lookup
    text: >-
      Handley thinks the L1D is in effect a direct-mapped cache with a two-stage lookup (8 untranslated set bits,
      then a 3-bit hash of the physical address from a fast TLB-side table), because no way misprediction is seen;
      the L2 TLB shows similar signs
    loc: p043
    quote: "Ultimately, I think something like this last, most complicated setup, is in fact what we are seeing. ... there never seems to be way misprediction [the L1 case]"
    derivation: inferred
    hedge: "I think"
    supports: []
    notes: >-
      Handley cites US8472267B2 (its micro-TLB supplies one physical address bit early) as a stripped-down version. In
      the L2 TLB, overflowing one set's ways misbehaves; he guesses the L2 does something similar.

  - id: c-mh-v2-way-pred-test
    text: >-
      Byte loads to six sets, each at a randomly chosen one of eight 16 KiB-apart pages, take 2.53 cycles per three
      loads against 2.39 without randomness, and the gap closes once the bases avoid shared banks, so no way
      misprediction is visible
    loc: p050
    quote: "we see no evidence of way misprediction. When I use random numbers in the array, time per (three loads) is 2.53 cycles; when I use all zeros that time is 2.39 cycles."
    method: throughput
    derivation: measured
    hedge: "Assuming I got the details correct (hah!)"
    supports: []
    notes: >-
      The residual gap tracked LD_UNIT_UOP (bank-collision resubmissions), not L2 traffic; moving x9 and x10 to offset
      16 in their lines removed it.
  - id: c-mh-v2-way-pred-hashed
    text: >-
      The L1D does not use a standard set-indexed way predictor; Handley suggests one indexed by a hash of the
      virtual address (perhaps with the ASID), covering at least 2048 and more likely 4096 entries
    loc: p050
    quote: "This all suggests to me we're absolutely not using a standard way predictor (table indexed by setID); but we may well be using a way predictor of the form I described"
    derivation: inferred
    hedge: "may well be"
    supports: []
    notes: >-
      A 12-bit hash into a 4096-entry table of predicted ways is the only scheme he knows that matches the
      accuracy of the M1 way predictor; he knows of no paper or Apple patent describing it
  - id: c-mh-v2-ld-unit-uop
    text: >-
      The LD_UNIT_UOP counter mostly counts bank collisions: it counts how often the LSU submits a load request to the
      L1, and most resubmissions come from bank collisions
    loc: p050
    quote: "looks like, under most conditions, this counter counts bank collisions. More precisely, it counts how often a load request is submitted by the LSU to the L1"
    method: counter
    derivation: inferred
    hedge: "looks like"
    supports: []
    notes: >-
      About 1.2 per load in the zero case, 1.3 in the random case of the way-prediction probe. The later tables'
      "traversals" column is his reading of an M1 performance counter

  - id: c-mh-v2-l1d-byte-subarrays
    text: >-
      Handley reads his timings as showing the L1D is built from byte-wide (perhaps two-byte) sub-arrays, so a cycle
      powers only the bytes it uses and can write some bytes of a line while reading others
    loc: p052
    quote: "My timings suggest that we do in fact have these very narrow cache sub-arrays."
    derivation: inferred
    hedge: "My timings suggest"
    supports: []
    notes: >-
      The lowest-level access is the byte, or perhaps the two-byte word; "Apple apparently sub-array their
      cache by bytes". Apple's patents call these sub-arrays banks
  - id: c-mh-v2-concurrent-store-load
    text: >-
      Per Apple's patent, a store writes the byte sub-arrays a load is not using in the same cycle, even partially
      when the two overlap, and line IDs found by loads' tag lookups are attached to pending stores
    loc: p052
    quote: "As long as the bytes differ, I can perform the loads and stores in the same cycle because they live in different sub-arrays."
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US9448936B2 (2014), Concurrent store and load operations
  - id: c-mh-v2-store-write-buffers
    text: >-
      A store that is no longer speculative moves with its data into a write buffer between the store queue and the
      L1, freeing its store-queue entry; patents suggest at least four such buffers, with some store coalescing
    loc: p053
    quote: "patents suggest there are at least four of these buffers, and that there is probably some sort of store coalescing happening"
    method: patent-reading
    derivation: inferred
    value: 4
    unit: buffers
    hedge: "patents suggest"
    supports: []
    notes: >-
      In Handley's store flow a store first borrows the translation and line ID from a load to the same page or line,
      and later writes the L1 on a load's line access or a dedicated store access. Patents not named.
  - id: c-mh-v2-stores-free
    text: Tests show that stores very rarely cost load bandwidth
    loc: p053
    quote: "A variety of tests seem to validate the above model, bottom line being that you very rarely lose load bandwidth to stores."
    derivation: measured
    hedge: "seem to validate"
    supports: []
    notes: 'His summary: "for the most part stores never consume load bandwidth"'
  - id: c-mh-v2-unaligned-free
    text: Aligned halfword loads behave like byte loads, and non-aligned halfword loads pay essentially no penalty
    loc: p055
    quote: "non-aligned halfwords pay essentially no penalty, given the mechanisms we have described (and again what we see)"
    derivation: measured
    supports: []
  - id: c-mh-v2-misaligned-single-request
    text: >-
      Per Apple's patent, a load that straddles two cache lines stays one unit that sends two line requests to the
      cache; only a page-crossing load falls back to microcode
    loc: p055
    quote: "a misaligned load is still handled as a single unit, with two line requests sent to the cache"
    method: patent-reading
    derivation: inferred
    supports: []
    notes: US20130013862A1

  - id: c-mh-v2-l1d-bank-width
    text: Each L1D bank is 16 B wide, so a 256 B row spans the 16 banks and addresses 256 B apart share a bank
    loc: p057
    quote: "So, at a physical level, the cache consists of 16 banks, each bank is 16B wide."
    method: stride-sweep
    derivation: measured
    value: 16
    unit: B
    supports: [l1d.bank_width]
    notes: Model stated up front and fitted to the stride tables (c-mh-v2-l1d-banks)
  - id: c-mh-v2-l1d-banks
    text: The L1D has 16 banks, each 16 B wide
    loc: p072
    quote: "seems reasonable to me to conclude that the EO3 and ABCD3 models describe the byte loads ... which in turn implies 16 banks, each 16B wide."
    method: stride-sweep
    derivation: measured
    value: 16
    unit: banks
    hedge: "it seems reasonable to me to conclude"
    supports: [l1d.banks]
    notes: The Intel designs Handley knows used 8 banks
  - id: c-mh-v2-loads-per-cycle
    text: Byte loads stepping by 0 to 32 B run at three per cycle
    loc: p063
    quote: "Note that nothing interesting happens till 64B; within margin of noise we achieve three loads per cycle."
    method: throughput
    derivation: measured
    value: 3
    unit: loads/cycle
    supports: [lsu.loads_per_cycle]
    notes: 2.97-3.0 loads/cycle; halfword, word, doubleword and 128-bit loads give the same
  - id: c-mh-v2-bank-stride-sweep
    text: >-
      Byte loads stepping by 64 B run at 2.35 per cycle, by 128 B at 1.71 and by 256 B at 1.0, as they crowd onto
      four, two and one bank, with 1.28, 1.75 and 3 traversals per load
    loc: p062
    quote: "LSU LoadB 64 2.35 1. 1. 1.28 LSU LoadB 128 1.71 1. 1. 1.75 LSU LoadB 256 1. 1. 1. 3."
    method: stride-sweep
    derivation: measured
    value: 1
    unit: loads/cycle
    supports: []
    notes: >-
      Stochastic models with three-request lookahead (EO3 for two banks: 1.66; ABCD3 for four banks: 2.27) come close
      to the 1.71 and 2.35 measured
  - id: c-mh-v2-piggyback
    text: >-
      Several loads to the same 16 B bank element are served by one bank access, the bytes for each load extracted
      and routed to its register, so they still run at three per cycle
    loc: p063
    quote: "When we are loading from the same 16B element (the case for loads separated by 0, 1, 2, 4) the piggybacking scheme works!"
    method: stride-sweep
    derivation: inferred
    supports: []
    notes: >-
      Three overlapping 16 B loads at A, A+1, A+2 are served from 18 B across two banks without serialising
  - id: c-mh-v2-l1-lookahead-3
    text: >-
      Each cycle the LSU offers three load requests to the L1, which serves the first and any later ones bound for
      other banks; the traversal counter (1.75) fits this three-request model (1.8) better than a four-request one (2.28)
    loc: p068
    quote: "I can give various pleading excuses for why the Apple value means something different from what it seems to mean, but EO3 looks like the way to bet."
    method: simulation
    derivation: inferred
    value: 3
    unit: requests/cycle
    hedge: "looks like the way to bet"
    supports: []
    notes: >-
      Requests reach the cache in roughly random order (c-mh-v2-load-order). He suggests holding the rejected request
      in a buffer at the L1 would gain about 5 %
  - id: c-mh-v2-width-independent
    text: >-
      Byte, halfword, word, doubleword and 128-bit loads give the same throughput at every step, so only the bank
      pattern of the addresses matters
    loc: p073
    quote: "The loaded width does not matter, only the pattern of addresses (ie which banks are accessed)."
    method: stride-sweep
    derivation: measured
    supports: []
    notes: Steps of 0-256 B, and 512 and 1024 B for 128-bit loads
  - id: c-mh-v2-ldp-x-single
    text: >-
      An LDP of two X registers takes two register remaps but one ROB entry and one cache submission, and performs
      like a single 128-bit load
    loc: p074
    quote: "Also note that a load pair X is not cracked either as regards retirement (second to last column; one entry in the ROB for each load pair X instruction) or cracked for submission to the cache"
    method: counter
    derivation: measured
    supports: []
  - id: c-mh-v2-ldpq-throughput
    text: >-
      LDP of two Q registers runs at 1.5 per cycle with two cache traversals each, against three per cycle for the
      equivalent pair of LDR Q, so both move 48 B per cycle
    loc: p075
    quote: "The LDPQ case performs 1.5 loads per cycle; in both cases 3*16B gets transferred to the LSU."
    method: throughput
    derivation: measured
    value: 1.5
    unit: loads/cycle
    supports: []
    notes: >-
      LoadPQ table: 1.5 up to a 64 B step, 1.17 at 128 B and 0.86 at 256 B, half the LDR Q pair rates of 2.35
      and 1.71
  - id: c-mh-v2-ldpq-late-crack
    text: >-
      LDP Q is split into two 16 B requests only at submission to the cache, after address generation, TLB and way
      lookup; rename and the ROB see one instruction
    loc: p075
    quote: "This all suggests to me that a LDPQ is cracked, but very late in the LSU (probably after TLB and way lookup) into two LDQ instructions."
    method: counter
    derivation: inferred
    hedge: "suggests to me"
    supports: []
    notes: 'Not cracked at decode: "256b=32B via a single instruction that splits into two at the point of cache access"'
  - id: c-mh-v2-line-cross-loads
    text: >-
      Doubleword and 128-bit loads that each straddle two cache lines run at the same rates as aligned loads, three
      per cycle at small steps, with the same bank-collision pattern
    loc: p076
    quote: "These probes correspond to loads from a base address that is a cacheline aligned address minus one. So every load straddles two cache lines. ... Whether we load from two lines or not, we see the same pattern of collisions."
    method: stride-sweep
    derivation: measured
    value: 3
    unit: loads/cycle
    supports: []
    notes: >-
      LoadX1 and LoadQ1 tables. Line-straddling LDP Q pairs fall further, to 0.53 pairs/cycle at a 256 B step,
      because both halves need the same bank
  - id: c-mh-v2-l1-load-paths-6
    text: The L1 has six 16 B data paths to the LSU, since three line-straddling loads per cycle each read two banks
    loc: p077
    quote: "But what these results do suggest is that in fact we have not three 16B wide paths from the L1 to the LSU, but 6 such paths."
    derivation: inferred
    value: 6
    unit: paths
    hedge: "what these results do suggest"
    supports: []
    notes: From LoadX1 at a 64 B step approaching three loads per cycle; Handley had earlier left it at "three (four? six?)"
  - id: c-mh-v2-subarray-guess
    text: >-
      Each bank, logically 512 rows of 16 B, may be built from four sub-arrays of 128 rows that work in parallel,
      which would explain line-straddling LDP Q pairs at a 256 B step running slightly above 0.5 per cycle
    loc: p077
    quote: "the basic SRAM subarray may be 128b wide (16B*8) and 128 rows high, so that there are four such sub-arrays in a bank"
    derivation: inferred
    value: 4
    unit: sub-arrays per bank
    hedge: "My best guess"
    supports: []
    notes: Sits uneasily with his byte-wide sub-array reading (c-mh-v2-l1d-byte-subarrays)
  - id: c-mh-v2-no-parallel-sources
    text: >-
      Apple does not yet seem to serve some loads from the store queue or the L1's specialty buffers in parallel with
      the L1D to raise load bandwidth
    loc: p060
    quote: "Apple doesn't yet seem to be exploiting aggressively the performance amplification available in having some loads serviced by either the Store Queue or the Specialty Buffers, in parallel with the L1D"
    derivation: inferred
    hedge: "doesn't yet seem"
    supports: []
  - id: c-mh-v2-4-lines-per-cycle
    text: >-
      Three loads and one store per cycle to four different lines (320 B step) show that four cache lines can be
      addressed per cycle, so way determination handles four addresses per cycle
    loc: p086
    quote: "shows us that we can access 4 different cache lines per cycle, ie however we perform address to way translation, we can perform four of those, and submit 4 addresses, to the cache, per cycle"
    method: throughput
    derivation: measured
    value: 4
    unit: lines/cycle
    supports: []
    notes: >-
      The text says the 320 B case gives a throughput of 4; the printed Store1Load3B table row reads 3.37 ops/cycle.
      He also says more than two (three, presumably four) indices can be submitted per cycle

  - id: c-mh-v2-stores-per-cycle
    text: Byte stores stepping by 0 to 128 B run at two per cycle, falling to 1.02 at a 256 B step
    loc: p078
    quote: "This works perfectly all the way out to 128 -- we can submit two stores to the cache per cycle"
    method: throughput
    derivation: measured
    value: 2
    unit: stores/cycle
    supports: [lsu.stores_per_cycle]
    notes: StoreB table; a store that overwrites the previous one still runs at full speed
  - id: c-mh-v2-store-fire-forget
    text: >-
      Stores cross from the LSU to the L1 once, even under bank conflicts, so they are latched in buffers at the L1
      that write them into the banks whenever loads leave room
    loc: p078
    quote: "What I think is happening is that stores are submitted to the cache as ... latched to some buffer(s), and the buffer(s) opportunistically feed bytes to the L1D whenever loads aren't using resources"
    method: counter
    derivation: inferred
    hedge: "What I think is happening"
    supports: []
    notes: >-
      Store traversals stay at 1 except for three loads + one store at 64-256 B steps (1.04-1.08), read as occasional
      buffer overflow, loads presumably having priority. One or two stores can wait at the L1 on a bank collision.
  - id: c-mh-v2-load-order
    text: >-
      Loads reach the L1 in jumbled order, mainly because one scheduler queue pair drains through a load unit and the
      ambidextrous unit while the other drains through one load unit; stores stay much closer to program order
    loc: p078
    quote: "My guess is that the primary reason loads are reordered is the ambidextrous load/store queue."
    derivation: inferred
    hedge: "My guess is"
    supports: []
    notes: >-
      Handley also suspects the instruction pool between rename and the scheduling queues does not preserve order; the
      bank-collision models assume randomly ordered requests
  - id: c-mh-v2-store-bw-32
    text: 128-bit stores also run at two per cycle, so the LSU can move at least 32 B of store data per cycle to the cache
    loc: p079
    quote: "Storing vectors shows the same pattern, so there's at least 32B of bandwidth (two 16B stores per cycle) from LSU to the cache."
    method: throughput
    derivation: measured
    value: 32
    unit: B/cycle
    hedge: "at least"
    supports: [l1d.store_bw]
    notes: >-
      StoreQ: 2.0 per cycle out to a 128 B step, 1.02 at 256 B; STP Q pairs run at 1.0 pair (2 x 16 B) per cycle at
      every step tried, 0-256 B
  - id: c-mh-v2-misaligned-store-16
    text: >-
      16-byte stores that each straddle a line boundary run at two per cycle up to an 8 B step but only 1.23 at a
      16 B step and 1.0 beyond
    loc: p080
    quote: "Now we see trouble start at at offset of 16 ... it should be able to run at 2*16B per cycle, not the 1.25 (20B/cycle) we see."
    method: stride-sweep
    derivation: measured
    value: 1.23
    unit: stores/cycle
    supports: []
    notes: >-
      StoreQ1 table; his text rounds to 1.25. Line-straddling STP Q pairs fall to 0.53-0.61 pairs/cycle from a
      32 B step
  - id: c-mh-v2-store-paths-2
    text: There are only two 16 B store data paths from the LSU to the L1D
    loc: p082
    quote: "there are only two 16B store paths from the LSU to the L1D (and perhaps also a wider path to the pool of specialty buffers than can transfer an entire cache line?)"
    derivation: inferred
    value: 2
    unit: paths
    supports: []
    notes: >-
      From the misaligned 16 B store results (c-mh-v2-misaligned-store-16), unlike misaligned loads, which keep three
      per cycle; one of the conclusions he calls solid
  - id: c-mh-v2-sq-slot-32b
    text: >-
      Store-queue slots seem to be 32 B wide: stores aggregate within a slot and a store torn across a line takes
      two slots, which predicts about 1.33 misaligned 16 B stores per cycle
    loc: p082
    quote: "the numbers we see here seem to suggest that + the width of a slot in the store queue is 32B (rather than 64B)"
    derivation: inferred
    value: 32
    unit: B
    hedge: "seem to suggest"
    supports: []
    notes: He adds that he does not especially trust any aspect of this explanation

  - id: c-mh-v2-same-address-storeload
    text: >-
      A store, load, store, load stream to one address runs at 3.66 operations per cycle, the loads served from the
      store queue
    loc: p083
    quote: "both the loads (they will go to different physical registers, even though, of course, the first load is meaningless) will be serviced out of the store queue, not the L1D"
    method: throughput
    derivation: measured
    value: 3.66
    unit: ops/cycle
    supports: []
    notes: >-
      He sees a glitch costing about one op in twelve. Slightly over one register remap per load, which he puts down to
      initial flushes before the load/store alias detector was trained
  - id: c-mh-v2-storeload-same-bank
    text: >-
      Interleaved byte stores and loads to alternate bytes of one 16 B element (steps of 1-4 B) run at 3.99 operations
      per cycle, so a bank serves a load and a store to different bytes in the same cycle
    loc: p083
    quote: "Apple's patents claim these can happen in the same cycle; we activate one bank, send the appropriate read and write byte enables ... and this certainly seems to be possible"
    method: throughput
    derivation: measured
    value: 3.99
    unit: ops/cycle
    supports: []
    notes: >-
      StoreLoadB table: about 3.2 ops/cycle at 8-32 B steps with no cache bank collisions counted
      (c-mh-v2-sq-banks-guess), 3.2 at 64 B with 1.44 load traversals, 2.0 at 128 B, 1.03 at 256 B
  - id: c-mh-v2-partial-forwarding
    text: >-
      Interleaved 16 B stores and loads offset by 1-4 B, each load overlapping the previous store, still run at four
      operations per cycle, merging store-queue bytes with L1 bytes
    loc: p084
    quote: "the first load has to pull in 15 bytes from the store queue and one byte from the L1 cache, then glue them together. And this is done without a glitch!"
    method: throughput
    derivation: measured
    value: 4
    unit: ops/cycle
    supports: []
    notes: "StoreLoadQ table: 3.99-4.0 for steps of 0-4 B, 2.97 at 8 B"
  - id: c-mh-v2-sq-banks-guess
    text: >-
      Mixed store/load streams at 8-32 B steps stall at about 3.2 operations per cycle with no cache bank collisions
      counted, which Handley guesses comes from collisions between sub-queues of a banked store queue
    loc: p084
    quote: "My best guess is that perhaps the store queue is split into multiple sub-queues"
    derivation: inferred
    hedge: "My best guess is that perhaps"
    supports: []
    notes: >-
      Also invoked for 16 B stores/loads at 8-16 B steps, and for four stores then four loads, which worsens the 64 and
      128 B steps without more load resubmissions

new_params:
  l1d.banks:                  {block: l1d,  name: L1D banks,                  unit: banks}
  l1d.bank_width:             {block: l1d,  name: L1D bank width,             unit: B}
  l1d.store_bw:               {block: l1d,  name: L1D store bandwidth,        unit: B/cycle}
  dtlb.l1_lookups_per_cycle:  {block: dtlb, name: L1 dTLB lookups per cycle,  unit: lookups/cycle}

new_mechanisms:
  dtlb_piggyback:
    name: Single-ported dTLB with piggyback ports
    status: inferred
    description: One dTLB lookup per cycle, shared with queued requests to the same page.
    params: [dtlb.l1_lookups_per_cycle]
    sim_switch: null
    detection_rule: >-
      three loads per cycle to one page run at full rate; spreading them over three pages 16 KiB apart drops to about
      2.5 cycles per three loads, and a new page on every access to about one load per cycle
  l1d_banked_piggyback:
    name: Banked L1D with piggybacked loads and buffered stores
    status: inferred
    description: Sixteen 16 B banks; loads to one element share an access and stores are buffered.
    params: [l1d.banks, l1d.bank_width, l1d.load_bw, l1d.store_bw]
    sim_switch: null
    detection_rule: >-
      loads stepping by 256 B fall to one per cycle, by 128 B to about 1.7 and by 64 B to about 2.35, while steps up to
      32 B keep three per cycle; stores keep two per cycle out to 128 B steps
  l1d_way_lookup:
    name: L1D way selection without visible misprediction
    status: speculative
    description: Loads to random ways run as fast as loads to one way; no way misprediction shows.
    params: [l1d.assoc]
    sim_switch: null
    detection_rule: >-
      loads that pick one of eight 16 KiB-apart pages at random on every access run no slower than loads to a fixed
      page once bank collisions are removed

mechanism_claims:
  dtlb_piggyback: [c-mh-v2-dtlb-single-port, c-mh-v2-tlb-queues, c-mh-v2-tlb-two-pages, c-mh-v2-tlb-three-pages,
                   c-mh-v2-tlb-autoinc, c-mh-v2-tlb-4ops, c-mh-v2-tlb-no-sharing, c-mh-v2-tlb-queue-overflow]
  l1d_banked_piggyback: [c-mh-v2-l1d-banks, c-mh-v2-l1d-bank-width, c-mh-v2-l1-entry-queues, c-mh-v2-bank-stride-sweep,
                         c-mh-v2-piggyback, c-mh-v2-l1-lookahead-3, c-mh-v2-l1-load-paths-6, c-mh-v2-4-lines-per-cycle,
                         c-mh-v2-l1d-byte-subarrays, c-mh-v2-concurrent-store-load, c-mh-v2-store-fire-forget,
                         c-mh-v2-storeload-same-bank, c-mh-v2-stores-free, c-mh-v2-ld-unit-uop]
  l1d_way_lookup: [c-mh-v2-l1d-8way, c-mh-v2-l1d-hashed-lookup, c-mh-v2-way-pred-test, c-mh-v2-way-pred-hashed]
  lsq_early_release: [c-mh-v2-store-write-buffers]
