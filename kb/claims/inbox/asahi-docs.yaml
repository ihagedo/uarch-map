# asahi-docs.yaml
# Asahi Linux, 2025
# Apple CPU register bit names, core start-up and the page-compression instructions, from the Asahi hardware docs.
session: asahi-docs
source: asahi-docs

claims:
  - id: c-asahi-mtlb-prefetch
    text: The HID2 bit names include a disable for MMU MTLB prefetch and a force-purge of the MTB, so some Apple cores prefetch translations into a main TLB
    loc: p001
    quote: "[#sys-apl-hid2-el1] SYS_APL_HID2_EL1 * [13] Disable MMU MTLB Prefetch * [17] Force Purge MTB"
    derivation: inferred
    supports: []
    notes: Sits against c-mh-v2-no-pte-prefetch, which sees no serious TLB prefetching on the M1; the bit may belong to another generation. MTLB and MTB are not expanded.
  - id: c-asahi-full-line-write
    text: The HID5 bit names include a full-line write feature that can be disabled, beside the fill 2C merge disable
    loc: p001
    quote: "* [54] Enable Dn FIFO Read Stall * [57] Disable Full Line Write * [61] Disable Fill 2C Merge"
    derivation: documented
    supports: []
    notes: Fits c-mh-v3-full-line-write-l2, where a new 64 B line written quickly goes whole to the L2 without allocating in the L1.
  - id: c-asahi-hwp
    text: The bit names include separate disables for the load and the store hardware prefetcher (HID5), an HWP GUPS disable (HID10) and a prefetcher disable in ACTLR_EL1 bit 3
    loc: p001
    quote: "* [44] Disable HWP Load * [45] Disable HWP Store ... [#sys-apl-hid10-el1] SYS_APL_HID10_EL1 * [0] Disable Hwp Gups ... * [3] Disable HWP"
    derivation: documented
    supports: []
    notes: GUPS is not expanded. SLAP finds the HID10 and ACTLR prefetch bits leave the M2 address predictor running (c-slap-m2-hid-bits).
  - id: c-asahi-stnt-unaligned
    text: The bit names include an STNT widget disable (HID4) and a disable of the STNT widget for unaligned stores (HID9), which the doc reads as store non-temporal with a question mark
    loc: p001
    quote: "* [1] Disable STNT Widget ... * [52] Disable STNT (Store Non-Temporal?) Widget For Unaligned"
    derivation: inferred
    hedge: "Store Non-Temporal?"
    supports: []
  - id: c-asahi-ldnt
    text: The HID11 bit names include a disable for an LDNT widget, which the doc reads as load non-temporal with a question mark
    loc: p001
    quote: "* [23] Disable Fast Drain Optimization * [59] Disable LDNT (Load Non-Temporal?) Widget"
    derivation: inferred
    hedge: "Load Non-Temporal?"
    supports: []
  - id: c-asahi-xpick
    text: The HID16 and HID7 bit names show cross-picking between reservation stations 4 and 5 (xPick RS 45, MPx Pick 45), a secondary for RS4 and a cross pick 2, read as paired scheduler queues that issue for each other
    loc: p001
    quote: "* [7] Disable Cross Pick 2 ... * [57] Enable RS4 Sec * [59] SpareBit3 * [60] Disable xPick RS 45 * [61] Enable MPx Pick 45"
    derivation: inferred
    supports: []
    notes: m1n1 sets MPx Pick 45 on every M1 Firestorm (c-m1n1-rf-bank-livelock). RS read as reservation station; Sec and MPx are not expanded.
  - id: c-asahi-nex-sleep
    text: The HID14 bit names include a NEX sleep timeout and a NEX power-gating enable, so the NEX unit powers down after an idle timeout
    loc: p001
    quote: "[#sys-apl-hid14-el1] SYS_APL_HID14_EL1 * [?:0] Nex Sleep Timeout Cyclone * [32] Nex Power Gating Enable"
    derivation: inferred
    supports: []
    notes: NEX read as the NEON/FP execution unit.
  - id: c-asahi-datasetid
    text: HID8 holds four DataSetID fields of four bits each, read as the data set IDs the core attaches to its requests for SLC allocation
    loc: p001
    quote: "* [7:4] DataSetID0 * [11:8] DataSetID1 * [35] Wke Force Strict Order * [59:56] DataSetID2 * [63:60] DataSetID3"
    derivation: inferred
    supports: []
    notes: The doc gives names and bit ranges only; CPU data set IDs are read from patents in c-mh-v6-cpu-dsid.
  - id: c-asahi-bp-retention
    text: Branch-predictor state can be kept across cluster sleep separately for the direction predictor (BDP) and the target predictor (BTP)
    loc: p001
    quote: "Branch predictor state retention across ACC sleep * [3:2] BP Sleep (2=BDP, 3=BTP)"
    derivation: inferred
    supports: []
    notes: BDP and BTP are not expanded in the doc.
  - id: c-asahi-fast-ipi
    text: Fast IPIs skip the AIC through request registers, local within a cluster or global with a target cluster, in immediate, retract, deferred and nowake types, with a deferred countdown in REFCLK ticks
    loc: p001
    quote: "These are used for \"fast\" IPIs not using AIC ... * [20:16] Target cluster * [29:28] RR Type (0=immediate, 1=retract, 2=deferred, 3=nowake) ... * [15:0] Deferred IPI countdown value (in REFCLK ticks)"
    derivation: documented
    supports: []
    notes: Matches the four IPI kinds read from a patent in c-mh-v3-fast-ipi.
  - id: c-asahi-siq-refuse
    text: A core that writes 3 to its SIQ_CFG register stops AICv2 from sending it IRQs, while FIQs, which come from the core complex itself, still arrive
    loc: p001
    quote: "If a core writes 0x3 to it's copy of the register, AICv2 will not send IRQs to that core. FIQs unaffected, as those are part of the core complexes themselves."
    derivation: documented
    supports: []
    notes: AICv2 serves the M1 Pro and Max and later chips; the M1 has SIQ_CFG too (c-m1n1-features-m1).
  - id: c-asahi-ic-ivau-asid
    text: ACTLR_EL1 bit 12 enables ASID matching for IC IVAU, so I-cache invalidation by address can be limited to one address space
    loc: p001
    quote: "* [6] Enable PRSV * [12] IC IVAU Enable ASID"
    derivation: inferred
    supports: []
  - id: c-asahi-tso-bit
    text: ACTLR_EL1 bit 1 turns on TSO ordering
    loc: p001
    quote: "[#actlr-el1-arm-standard-not-standard] ACTLR_EL1 (ARM standard-not-standard) * [1] Enable TSO"
    derivation: documented
    supports: []
    notes: Agrees with c-tso-entso-bit. The doc also lists a TSO enable in HID9 and a TSO flag in AIDR_EL1.
  - id: c-asahi-fill-bubble
    text: The HID11 bit names include a fill C1 bubble optimization, so a fill normally avoids a bubble it would otherwise cause
    loc: p001
    quote: "* [1] Disable X64 NT Lnch Optimization * [7] Disable Fill C1 Bub(ble?) Optimization"
    derivation: inferred
    hedge: "Bub(ble?)"
    supports: []
    notes: C1 is not expanded; m1n1's header names the same bit DISABLE_FILL_C1_BUB_OPT.
  - id: c-asahi-smp-start
    text: A core is started through the power manager, with its start address written to RVBAR in its own implementation registers and its bit then set in the cluster's start register, after which it begins at RVBAR
    loc: p002
    quote: "* Write start address to RVBAR at `cpu-impl-reg + 0x00` ... * Set (1 << core) in `pmgr[(offset + 0x8) + 4*cluster]` (that's core from 0-3, cluster 0-1) * This starts up the core itself."
    derivation: documented
    supports: []
    notes: The start bits sit in the power manager, as c-mh-v3-reset-vector expects for the reset address, but RVBAR itself sits in each core's implementation-register block.
  - id: c-asahi-alive-aic
    text: A system-wide core-alive mask in the power manager is not needed for a core to start, but without its bit AIC interrupts do not work
    loc: p002
    quote: "This seems to be some kind of system-wide \"core alive\" signal. It is not required for the core to spin up, but without it AIC interrupts won't work"
    derivation: inferred
    hedge: "This seems to be some kind of"
    supports: []
  - id: c-asahi-wkdm
    text: The cores have Apple instructions, wkdmc and wkdmd, that compress and decompress a whole memory page with WKdm, given source and destination addresses in registers
    loc: p003
    quote: "00200800 | rD << 5 | rS wkdmc, compress memory page ... 00200c00 | rD << 5 | rS wkdmd, uncompress memory page"
    derivation: documented
    supports: []
    notes: Status comes back in the source register. Where the compression engine sits is not stated; c-mh-v3-wkdm-engine reads a patent that puts it at the cluster.

mechanism_claims:
  mmu_walk_cache: [c-asahi-mtlb-prefetch]
  l1d_write_allocate: [c-asahi-full-line-write]
  lsu_virtual_prefetch: [c-asahi-hwp]
  streaming_store_nt: [c-asahi-stnt-unaligned]
  nt_load_handling: [c-asahi-ldnt]
  paired_sched_queues: [c-asahi-xpick]
  simd_power_down: [c-asahi-nex-sleep]
  slc_sticky_quota: [c-asahi-datasetid]
  core_power_cycle: [c-asahi-smp-start]
  cluster_sleep_states: [c-asahi-bp-retention]
  fast_ipi: [c-asahi-fast-ipi]
  interrupt_routing: [c-asahi-siq-refuse, c-asahi-alive-aic]
  l1i_maintenance_only: [c-asahi-ic-ivau-asid]
  tso_mode: [c-asahi-tso-bit]
  fill_bank_conflicts: [c-asahi-fill-bubble]
  cluster_compression_engines: [c-asahi-wkdm]
