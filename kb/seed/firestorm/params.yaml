  fetch.taken_per_cycle:        {block: fetch,    name: Taken branches per cycle,        unit: branches/cycle, sim_key: taken_per_cycle}
  l1i.size:                     {block: l1i,      name: L1I capacity,                    unit: KiB,         sim_key: l1i_kib}
  l1i.line:                     {block: l1i,      name: L1I line size,                   unit: B}
  itlb.entries:                 {block: itlb,     name: iTLB entries,                    unit: entries}
