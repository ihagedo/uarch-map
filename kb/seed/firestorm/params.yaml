  eu_int.roles:                 {block: eu_int,   name: Integer unit roles}
  eu_fp.count:                  {block: eu_fp,    name: FP/SIMD execution units,         unit: units,       sim_key: fp_units}
  eu_fp.roles:                  {block: eu_fp,    name: FP/SIMD unit roles}
