  retire.issuing_window:        {block: retire,   name: Issuing-uop window,              unit: uops}
  retire.rename_queue:          {block: retire,   name: Rename retire queue,             unit: entries,     sim_key: rename_retire}
  retire.rate_groups:           {block: retire,   name: Retire rate,                     unit: groups/cycle, sim_key: retire_rate}
  retire.rate_renames:          {block: retire,   name: Rename retire rate,              unit: entries/cycle}
  retire.inflight_branches:     {block: retire,   name: In-flight branches,              unit: branches,    sim_key: branch_window}

  lq.entries:                   {block: lq,       name: Load queue,                      unit: entries,     sim_key: lq}
  sq.entries:                   {block: sq,       name: Store queue,                     unit: entries,     sim_key: sq}
  lsu.allocation:               {block: lsu,      name: LSQ allocation point,            mechanism: lsq_at_issue}
  lsu.ls_units:                 {block: lsu,      name: Load/store units and roles}
  lsu.forwarding:               {block: lsu,      name: Store-to-load forwarding}
  lsu.disambiguation:           {block: lsu,      name: Memory disambiguation predictor}
  l1d.size:                     {block: l1d,      name: L1D capacity,                    unit: KiB,         sim_key: l1d_kib}
  l1d.line:                     {block: l1d,      name: L1D line size,                   unit: B,           sim_key: l1d_line}
  l1d.assoc:                    {block: l1d,      name: L1D associativity,               unit: ways}
  l1d.latency:                  {block: l1d,      name: L1D hit latency (pointer chase), unit: cycles,      sim_key: l1d_latency}
  l1d.latency_complex:          {block: l1d,      name: L1D hit latency (complex addr),  unit: cycles}
  l1d.load_bw:                  {block: l1d,      name: L1D load bandwidth,              unit: B/cycle}
  dtlb.l1_entries:              {block: dtlb,     name: L1 dTLB entries,                 unit: entries,     sim_key: dtlb_l1}
  dtlb.l1_org:                  {block: dtlb,     name: L1 dTLB organisation}
  dtlb.l2_entries:              {block: dtlb,     name: L2 TLB entries,                  unit: entries}
  mshr.outstanding:             {block: mshr,     name: Outstanding L1D misses (MLP),    unit: misses,      sim_key: mlp}
  prefetch.kinds:               {block: prefetch, name: Prefetcher kinds}
  l2.size:                      {block: l2,       name: L2 capacity,                     unit: MiB,         sim_key: l2_mib}
  l2.line:                      {block: l2,       name: L2 line size,                    unit: B}
  l2.latency:                   {block: l2,       name: L2 hit latency,                  unit: cycles,      sim_key: l2_latency}
  l2.inner_slice:               {block: l2,       name: Per-core inner L2 slice,         unit: MiB}
  slc.size:                     {block: slc,      name: SLC capacity,                    unit: MiB}
  slc.latency:                  {block: slc,      name: SLC hit latency,                 unit: cycles}
  memctrl.dram_latency:         {block: memctrl,  name: DRAM latency,                    unit: ns,          sim_key: dram_latency_ns}

mechanisms:
  retire_groups:
    name: Coalesced retire groups
    status: inferred
    description: Uops retire in groups of up to seven; a memory op starts a group and a branch ends one.
    params: [retire.model, retire.groups, retire.group_max_uops, retire.group_issuing_uops, retire.nop_window,
             retire.issuing_window]
    sim_switch: retire_group
    detection_rule: NOP knee divided by load, store or branch knee is close to a whole number >= 2
  rename_retire_queue:
    name: Rename retire queue (history file)
    status: inferred
    description: A second queue of about 620 entries limits instructions that change the register map.
    params: [retire.rename_queue, retire.rate_renames]
    sim_switch: rename_retire
    detection_rule: register-writing fillers knee far below the NOP knee and above the physical register count
  lsq_at_issue:
    name: Load/store queue entries allocated at issue
    status: speculative
    description: Load and store queue entries are taken at issue, not at dispatch.
    params: [lsu.allocation, lq.entries, sq.entries]
    sim_switch: lsq_alloc_issue
    detection_rule: same filler gives different knees under a miss delay and an ALU delay
