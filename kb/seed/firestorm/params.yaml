  btb.l1_entries:               {block: btb,      name: Second-level BTB entries,        unit: entries,     sim_key: btb_l1}
  btb.taken_bubble:             {block: btb,      name: Taken-branch bubble (L1 tier),   unit: cycles,      sim_key: btb_bubble}
  btb.assoc:                    {block: btb,      name: BTB associativity,               unit: ways}
  dirpred.kind:                 {block: dirpred,  name: Direction predictor type}
  dirpred.history:              {block: dirpred,  name: Global history length,           unit: branches,    sim_key: dir_history}
  dirpred.capacity:             {block: dirpred,  name: Direction predictor capacity,    unit: entries}
  dirpred.mispredict_penalty:   {block: dirpred,  name: Mispredict penalty,              unit: cycles,      sim_key: mispredict_penalty}
  ras.depth:                    {block: ras,      name: Return stack depth,              unit: entries,     sim_key: ras_depth}
  indpred.capacity:             {block: indpred,  name: Indirect predictor capacity,     unit: entries}
  ftq.present:                  {block: ftq,      name: Decoupled fetch present}
  ftq.depth:                    {block: ftq,      name: Fetch target queue depth,        unit: entries,     sim_key: ftq_depth}
  ftq.fdip:                     {block: ftq,      name: Fetch-directed prefetch present}
  iq.depth:                     {block: iq,       name: Fetch-to-decode queue depth,     unit: entries,     sim_key: iq_depth}

  rename.width:                 {block: rename,   name: Rename width,                    unit: uops/cycle,  sim_key: rename_width}
  rename.mov_elimination:       {block: rename,   name: Register move elimination}
  rename.zero_idiom:            {block: rename,   name: Zero idiom elimination}
  rename.mov_imm_limit:         {block: rename,   name: Move-immediate elimination limit, unit: per 8 instr}
  rename.fusion:                {block: rename,   name: Fusion rules}
  rename.security_tag:          {block: rename,   name: Register mapping security tag, mechanism: register_security_tag}
  int_prf.total:                {block: int_prf,  name: Integer physical registers,      unit: registers,   sim_key: int_prf}
  int_prf.headroom:             {block: int_prf,  name: Integer rename headroom,         unit: registers}
  fp_prf.total:                 {block: fp_prf,   name: FP/SIMD physical registers,      unit: registers,   sim_key: fp_prf}
  flags_prf.total:              {block: flags_prf, name: Flags physical registers,       unit: registers,   sim_key: flags_prf}
  dispatch.int_entries:         {block: dispatch, name: Integer dispatch buffer,         unit: entries,     sim_key: dispatch_int}
  dispatch.mul_entries:         {block: dispatch, name: Multiply dispatch buffer,        unit: entries}
  dispatch.ls_entries:          {block: dispatch, name: Load-store dispatch buffer,      unit: entries,     sim_key: dispatch_ls}
  sched_int.entries_per_queue:  {block: sched_int, name: Integer scheduler queue size,   unit: entries,     sim_key: sched_int}
