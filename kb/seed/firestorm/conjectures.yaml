# conjectures.yaml
# Isaac Hagedorn, 2026-10-09
# Ours: bounds for params nothing published measures, and mechanisms for questions nothing published
# answers. Each rests on claims and says what would tell it from the alternative.
conjectures:
  ftq.depth:
    value: 0
    text: Probably none, if fetch is not decoupled from prediction as Handley argues.
    basis: [c-mh-v4-not-decoupled, c-mh-v4-fully-decoupled-no-win]
  iq.depth:
    value: "≥120"
    text: Handley guesses the queue covers an L1I miss that hits in L2, at least 120 instructions (8 x 15).
    basis: [c-mh-v4-iq-guess, c-mh-v4-iq-bypass]
  mshr.outstanding:
    value: "≥7"
    text: By Little's law, about 7 L1D fills must be in flight to draw 85 GB/s from the L2 at 17 cycles, and about 48
      L2 lines of 128 B beyond the L2 to draw 64 GB/s from DRAM at about 97 ns.
    basis: [c-mh-v2-l2-load-85, c-mh-v2-l2-latency-17, c-7cpu-ram-read-bw, c-7cpu-dram-latency]

mechanisms:
  l1i_tree_plru:
    name: Tree-PLRU L1I replacement
    block: l1i
    status: inferred
    ours: true
    description: The L1I picks its victim by tree pseudo-LRU over its six ways, as three pairs, like the L1D.
    basis: [c-ilk-l1i-ways, c-pac-l1i-ways, c-prt-ice-l1d-tree-plru, c-s2c-l1-lru]
    alternative: Random or round-robin replacement.
    detection_rule: An eviction sequence built on tree-PLRU state evicts the predicted code line, as Prime+Retouch showed
      for the L1D.
  l1i_maintenance_only:
    name: Code changes by cache maintenance only
    block: l1i
    status: conjecture
    ours: true
    description: >-
      The L1I does not snoop stores; code written at run time is cleaned to the L2 and invalidated by line, and the
      L2 forwards the invalidate through its copies of the L1 tags.
    basis: [c-mh-v3-l2-dup-tags, c-mh-v3-l2-snoop-filter]
    alternative: The L1I snoops stores to lines it holds and drops them itself.
    detection_rule: Code rewritten without an I-cache invalidate keeps running its old instructions.
  path_history_rewind:
    name: Path history rewind
    block: dirpred
    status: conjecture
    ours: true
    description: >-
      Each branch in flight records the head of a circular buffer of taken-branch footprints; a mispredict rewinds
      the head to that mark and pushes the corrected outcome.
    basis: [c-cq-phr-split, c-ien-phrb-pcore, c-ien-all-taken, c-mh-v4-checkpoints, c-mh-v4-bit-tables]
    alternative: Each branch saves full copies of both history registers, restored on a mispredict.
    detection_rule: No timing probe tells them apart; the simulator can carry either.
  l1d_write_allocate:
    name: Write-allocate L1D with store-miss entries
    block: l1d
    status: inferred
    ours: true
    description: >-
      A store miss takes a store-miss entry that fetches the line for ownership while younger store hits write ahead
      of it; full-line streaming stores skip the fetch and go out non-temporal.
    basis: [c-tso-ss-mshr-fifo, c-tso-ss-reorder, c-mh-v2-store-stream-detect, c-mh-v2-nt-store-bypass,
            c-mh-v2-sq-slot-32b]
    alternative: Stores that miss write around the L1D into the L2.
    detection_rule: A load right after a store that missed hits the L1D if the store allocated the line, and goes to the
      L2 if it wrote around.
  fill_buffer_pool:
    name: Shared fill buffers with line merging
    block: mshr
    status: conjecture
    ours: true
    description: >-
      One fill buffer per 64 B line in flight, shared by demand loads and L1 prefetches; a second miss to the line
      joins its entry, and a load that finds the buffers full replays.
    basis: [c-ox-store-load, c-mh-v8-fill-forward, c-mh-v2-ampm-throttle, c-tso-ss-mshr-fifo, c-dj-loads]
    alternative: Each miss holds its own entry, and a second miss to a line waits until the first fills.
    detection_rule: Independent loads to distinct lines level off at the buffer count, while loads to one line keep
      scaling past it.
  l2_core_round_robin:
    name: Round-robin among cores at the L2
    block: l2
    status: conjecture
    ours: true
    description: Per-core request queues feed each L2 bank round-robin, demand ahead of prefetch, cores in latency mode first.
    basis: [c-mh-v3-l2-cpu-qos, c-mh-v3-retry-queue, c-mh-v2-l2-cachelets]
    alternative: Requests from all cores enter one queue in arrival order.
    detection_rule: With three cores streaming through the L2, a fourth core's pointer chase keeps its unloaded latency
      under round-robin and slows with the load under one shared queue.

judgments:
  trace_cache:
    verdict: unlikely
    text: Not on the M1. ocxtal measured at most one taken branch per cycle, and Handley places the trace cache on the M4.
    basis: [c-ox-two-branches, c-mh-v8-trace-cache]
  matrix_scheduler:
    verdict: likely
    text: Nothing measured goes against it, and it fits operands read at issue from queues that do not shift.
    basis: [c-mh-v1-read-at-issue, c-mh-v1-age-matrix]
  lsq_at_issue:
    verdict: likely
    text: Allocation at issue explains why the apparent queue sizes change with the delay used (about 330, 125 and 100,
      188 and 118).
    basis: [c-mh-v1-virtual-lsq, c-mh-v1-lq-dram-125, c-mh-v1-lq-storeaddr-188]
  hierarchical_store_queue:
    verdict: unlikely
    text: Not in this form on the M1. The two-queue design comes from a post-M1 patent; the M1's 60 stores fit one queue,
      banked as Handley guesses from the mixed-stream stall.
    basis: [c-mh-v8-hsq-two-queues, c-mh-v2-sq-banks-guess, c-dj-stores]
  loop_modes:
    verdict: likely
    text: Handley says the M1 has loop buffers to save energy; a loop's backward branch already costs nothing, so they
      should not change timing.
    basis: [c-mh-v4-loop-buffers-m1]
  iq_bypass_fixup:
    verdict: likely
    text: Likely for bypassing an empty queue. Deleting the instructions a short forward branch skips comes from a post-M1
      patent and stays open.
    basis: [c-mh-v4-iq-bypass, c-mh-v8-sfb-patent]
  two_level_ras:
    verdict: likely
    text: Both patents predate the M1, and nothing measured goes against a main stack at decode with a small fetch-side
      stack.
    basis: [c-mh-v4-ras-at-decode, c-mh-v4-ras-mini]
  l2_cachelets:
    verdict: likely
    text: Likely in effect. One core's bandwidth changes at 3 MiB and 7.5 MiB, and S2C's two hashed index bits fit four
      slices; whether the cachelets are physical is open.
    basis: [c-mh-v2-l2-transitions, c-mh-v2-l2-inner-bw, c-s2c-l2-slices]
  l2.inclusion:
    verdict: settled
    text: Inclusive of the L1Ds. Two labs measured it across cores; the non-inclusive readings come from patents.
    basis: [c-ilk-l2-inclusive, c-s2c-l2-inclusive, c-mh-v3-dram-fill-l1-only]
  l2_victim_fill:
    verdict: unlikely
    text: Not as stated on the M1. With an inclusive L2, measured by two labs, DRAM fills enter the L2 as well as the L1.
    basis: [c-ilk-l2-inclusive, c-s2c-l2-inclusive]
  l2.replacement:
    verdict: settled
    text: LRU among one core's lines, as S2C measured. Handley's partial hits between 8 and 16 MiB fit low-priority
      insertion of streaming lines better than random replacement.
    basis: [c-s2c-l2-repl, c-mh-v2-l2-random-repl, c-mh-v3-l2-stream-lru0]
  content_directed_prefetch:
    verdict: settled
    text: Both hold. A privileged HID11 bit turns the DMP off on the M1 and M2; no control outside the kernel does, which
      is what Augury and GoFetch found.
    basis: [c-slap-m1-hid11-dmp, c-aug-not-disableable, c-gf-no-disable]
  early_barrier_completion:
    verdict: unlikely
    text: Not on the M1 for DSB. A DSB alone does not stop speculation past a mispredicted branch on the M1; the design
      comes from post-M1 patents.
    basis: [c-dimva-dmb-dsb, c-mh-v8-dsb-early]
  uop_split_merge:
    verdict: settled
    text: NOPs never issue and use no unit, but they are not dropped at decode; each takes a retire slot, which is why
      over 2200 fit in the window.
    basis: [c-ox-nop-decoder, c-mh-v1-nop-rob-slot, c-dj-nop-b-no-issue, c-mh-v1-nop-window]
  slc.inclusion:
    verdict: settled
    text: Neither inclusive nor strictly exclusive. For CPU lines the SLC is a victim cache of the L2, so CPU reads do not
      allocate in it, close to the exclusive SLC 7-cpu suggests.
    basis: [c-7cpu-slc-exclusive, c-mh-v3-slc-neither-incl-excl, c-mh-v8-slc-victim]
  slc_victim_fill:
    verdict: likely
    text: Handley's later readings agree that CPU misses do not allocate in the SLC; his result of about 50 cycles in
      random boxes fits region prefetch into the L2 better than an SLC prefetcher.
    basis: [c-mh-v3-cpu-no-slc-alloc, c-mh-v8-slc-victim, c-mh-v2-slc-spatial, c-mh-v2-region-prefetch]
  zero_cycle_loads:
    verdict: likely
    text: Present but narrow. Handley's probes speed up only a load that uses the store's address register with an
      immediate offset, a case ocxtal's tests need not have hit.
    basis: [c-mh-v1-zcl-5-vs-7, c-mh-v1-zcl-addressing, c-ox-no-aliasing]
